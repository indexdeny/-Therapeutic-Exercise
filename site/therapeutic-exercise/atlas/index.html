<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Атлас упражнений — Лечебные упражнения</title>
<style>
:root {
  --page: #0f1613; --board: #1d2b27; --panel: #22322d; --edge: #3a5047;
  --chalk: #ece8dc; --dim: #9aaba3; --faint: #5d7068; --task: #f0b45a; --quiz: #86c9e8; --good: #8fd6b0; --bad: #f08a7a;
  --ui: "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --book: "Iowan Old Style", Palatino, Georgia, serif;
  --ease: cubic-bezier(.2, .8, .2, 1);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100svh; background: var(--board); color: var(--chalk); font: 16px/1.45 var(--ui); }
.top { position: sticky; top: 0; z-index: 3; display: flex; align-items: center; gap: 14px; padding: 12px 24px;
  background: rgba(22, 33, 29, .92); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid #2a3b35; }
.top h1 { margin: 0; font: 500 26px/1.1 var(--book); }
.back { color: var(--dim); font-size: 14px; text-decoration: none; border: 1px solid var(--edge); border-radius: 999px; padding: 4px 12px; white-space: nowrap; }
.back:hover { color: var(--chalk); }
/* Search and the five filters; each filter is a <details> with a list of check boxes. */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 24px; }
.search { flex: 0 1 300px; min-width: 0; background: var(--panel); border: 1px solid var(--edge); border-radius: 999px; padding: 7px 14px; color: var(--chalk); font: 15px var(--ui); }
.search::placeholder { color: var(--faint); }
details.f { position: relative; }
details.f > summary { list-style: none; cursor: pointer; background: var(--panel); border: 1px solid var(--edge); border-radius: 999px; padding: 6px 13px;
  font-size: 14px; color: var(--dim); white-space: nowrap; user-select: none; }
details.f > summary::-webkit-details-marker { display: none; }
details.f > summary b { color: var(--chalk); font-weight: 600; }
details.f.on > summary { border-color: var(--good); }
details.f[open] > summary { border-color: var(--task); }
.menu { position: absolute; z-index: 4; top: calc(100% + 6px); left: 0; min-width: 240px; max-height: 60vh; overflow-y: auto; padding: 6px;
  background: var(--panel); border: 1px solid var(--edge); border-radius: 12px; box-shadow: 0 16px 40px rgba(0, 0, 0, .45); }
.menu label { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 8px; cursor: pointer; font-size: 15px; white-space: nowrap; }
.menu label:hover { background: rgba(255, 255, 255, .05); }
.menu small { margin-left: auto; padding-left: 12px; color: var(--faint); }
.menu input { accent-color: var(--task); }
.reset { background: none; border: 0; color: var(--task); font: 14px var(--ui); cursor: pointer; padding: 6px 4px; }
.count { margin-left: auto; color: var(--dim); font-size: 14px; white-space: nowrap; }
/* Cards on the left, the preview panel on the right. */
.at { display: grid; grid-template-columns: minmax(0, 1fr) 520px; gap: 24px; align-items: start; padding: 4px 24px 32px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
.card { display: flex; flex-direction: column; padding: 0; text-align: left; background: var(--panel); border: 1.5px solid var(--edge); border-radius: 14px;
  overflow: hidden; color: inherit; font: inherit; cursor: pointer; }
.card:hover { border-color: var(--faint); }
.card.sel { border-color: var(--task); box-shadow: 0 0 0 2px rgba(240, 180, 90, .3); }
.card img { display: block; width: 100%; height: 160px; object-fit: contain; background: #18231f; }
.card .b { display: flex; flex-direction: column; gap: 2px; padding: 9px 12px 11px; }
.nm { font-weight: 700; font-size: 16px; line-height: 1.25; }
.en { color: var(--dim); font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin: 5px 0 4px; }
.chip { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--edge); color: var(--dim); }
.chip.g { color: var(--good); border-color: #3f6b55; }
.chip.p { color: var(--quiz); border-color: #3d5f70; }
.chip.none { color: var(--faint); border-style: dashed; }
.key { font-size: 13.5px; }
.foot { display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: var(--faint); }
.empty { grid-column: 1 / -1; padding: 40px 0; color: var(--dim); text-align: center; }
.pv { position: sticky; top: 70px; max-height: calc(100svh - 86px); overflow-y: auto; background: var(--page); border: 1.5px solid var(--edge); border-radius: 16px; }
.pv-empty { margin: 0; padding: 48px 28px; color: var(--dim); text-align: center; }
.pv-body { position: relative; }
.pv-x { display: none; position: absolute; right: 10px; top: 10px; z-index: 2; width: 38px; height: 38px; border: 0; border-radius: 50%;
  background: rgba(15, 22, 19, .85); color: var(--chalk); font: 24px/1 var(--ui); cursor: pointer; }
.pv-frame { position: relative; aspect-ratio: 16 / 9; background: #18231f; }
.pv-frame iframe { display: block; width: 100%; height: 100%; border: 0; }
.pv-sound { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 10px 20px; border: 0; border-radius: 999px;
  background: var(--chalk); color: var(--board); font: 600 15px var(--ui); cursor: pointer; }
.pv-ctl { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #16211d; color: var(--dim); font-size: 13px; font-variant-numeric: tabular-nums; }
.pv-play { flex: none; width: 30px; height: 30px; border: 0; border-radius: 50%; background: var(--chalk); color: var(--board); font-size: 12px; cursor: pointer; }
.pv-bar { flex: 1; height: 4px; border-radius: 2px; background: #2c3d37; overflow: hidden; }
.pv-bar i { display: block; width: 0; height: 100%; background: var(--task); }
.pv-info { padding: 12px 16px 16px; }
.pv-info h2 { margin: 0; font: 500 22px/1.2 var(--book); }
.pv-info .key { margin: 8px 0 6px; font-size: 15px; }
.warn { margin: 0 0 6px; font-size: 14px; color: var(--bad); }
.note { margin: 0 0 6px; font-size: 14px; color: var(--dim); }
.pill { display: inline-block; padding: 0 8px; border: 1px dashed var(--faint); border-radius: 999px; font-size: 11px; }
.mom { margin: 10px 0 0; padding: 0; list-style: none; }
.mom button { display: flex; gap: 10px; width: 100%; padding: 6px 8px; border: 0; border-radius: 8px; background: none; color: var(--dim); font: 14px/1.35 var(--ui);
  text-align: left; cursor: pointer; }
.mom button b { flex: none; min-width: 74px; color: var(--chalk); }
.mom button[aria-current] { background: rgba(240, 180, 90, .12); color: var(--chalk); }
.mom button[aria-current] b { color: var(--task); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.btn { display: inline-block; padding: 6px 14px; border: 1px solid var(--edge); border-radius: 999px; background: none; color: var(--chalk); font: 14px var(--ui);
  text-decoration: none; cursor: pointer; }
.btn.go { background: var(--chalk); color: var(--board); border-color: var(--chalk); }
.page { margin: 8px 0 0; color: var(--faint); font-size: 13px; }
.card:focus-visible, .btn:focus-visible, .mom button:focus-visible, details.f > summary:focus-visible, .pv-play:focus-visible, .pv-x:focus-visible,
.back:focus-visible, .reset:focus-visible { outline: 3px solid var(--task); outline-offset: 2px; }
/* Narrow screens: the preview slides up over the whole page. */
@media (max-width: 1099px) {
  .top, .filters { padding-left: 16px; padding-right: 16px; }
  .at { display: block; padding: 4px 16px 24px; }
  .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .pv { display: none; position: fixed; inset: 0; z-index: 5; max-height: none; border: 0; border-radius: 0; animation: up .25s var(--ease); }
  body.pv-open { overflow: hidden; }
  body.pv-open .pv { display: block; }
  .pv-x { display: block; }
}
@media (max-width: 559px) {
  .grid { grid-template-columns: minmax(0, 1fr); }
  .search { flex-basis: 100%; }
  .menu { position: static; margin-top: 6px; box-shadow: none; }
  .count { margin-left: 0; }
}
@keyframes up { from { transform: translateY(100%); } }
/* The contents and the lessons cross-fade on navigation; the atlas takes part too. */
@view-transition { navigation: auto; }
@media (prefers-reduced-motion: reduce) { .pv { animation: none; } ::view-transition-group(*), ::view-transition-old(*), ::view-transition-new(*) { animation: none !important; } }
</style>
</head>
<body>
<header class="top"><a class="back" href="../#contents">← Оглавление</a><h1>Атлас упражнений</h1></header>
<div class="filters" id="filters"></div>
<main class="at">
  <section class="grid" id="grid" aria-label="Упражнения"></section>
  <aside class="pv" id="pv" aria-label="Превью упражнения">
    <p class="pv-empty" id="pvEmpty">Выберите упражнение — здесь урок покажет, как его делают.</p>
    <div class="pv-body" id="pvBody" hidden>
      <button class="pv-x" id="pvClose" type="button" aria-label="Закрыть превью">×</button>
      <div class="pv-frame"><iframe id="pvFrame" title="Момент урока" allow="autoplay"></iframe>
        <button class="pv-sound" id="pvSound" type="button" hidden>▶ Включить звук</button></div>
      <div class="pv-ctl"><button class="pv-play" id="pvPlay" type="button" aria-label="Пуск или пауза">▶</button><span id="pvNow">0:00</span>
        <span class="pv-bar"><i id="pvBar"></i></span><span id="pvDur"></span></div>
      <div class="pv-info" id="pvInfo"></div>
    </div>
  </aside>
</main>
<script src="data.js"></script>
<script src="../lib/moment.js"></script>
<script src="../lib/atlas.js"></script>
</body>
</html>
