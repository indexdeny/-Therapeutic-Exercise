  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Ведение пациента: шесть элементов — от обследования до результатов, со сквозной координацией и документацией.', 'w1'],
     ['Обследование: анамнез, обзор систем, тесты; итог — рамки ФТ и исходный уровень.', 'w2'],
     ['Опрос по системам и обзор систем ищут то, что требует направления к врачу.', 'w3'],
     ['Тестируйте и нарушения, и функцию: активность и участие.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 220 + i * 140, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 32, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-parts', prompt: ['К какой части обследования относится действие?'],
    build: grid([
      { parts: ['Спросить, какие лекарства принимает пациент'], ans: ['hist'], why: 'Лекарства — часть анамнеза (бокс 1.9).' },
      { parts: ['Измерить пульс и артериальное давление'], ans: ['sys'], why: 'Скрининг сердца и лёгких руками — обзор систем.' },
      { parts: ['Гониометрия коленного сустава'], ans: ['test'], why: 'Специальное измерение — тесты и измерения.' },
      { parts: ['Спросить о лихорадке и изменении веса'], ans: ['hist'], why: 'Это устный опрос по системам — часть анамнеза.' },
      { parts: ['Осмотреть кожу и послеоперационный рубец'], ans: ['sys'], why: 'Осмотр кожи — обзор систем.' },
    ], [['hist', 'Анамнез', COL.whole], ['sys', 'Обзор систем', COL.real], ['test', 'Тесты', COL.task]], { multi: false, text: true }),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-tf', prompt: ['Верно или неверно?'],
    build: grid([
      { parts: ['Опрос по системам — часть анамнеза.'], ans: ['t'], why: 'Верно: его проводят устно во время сбора анамнеза.' },
      { parts: ['Пациент обычно описывает проблему через нарушения: «у меня снижен объём движений».'], ans: ['f'], why: 'Неверно: пациенты говорят об ограничениях в делах.' },
      { parts: ['Исходные измерения нужны, чтобы потом оценить результат лечения.'], ans: ['t'], why: 'Верно: от них измеряют изменения.' },
      { parts: ['Чем больше тестов, тем лучше — стоит собрать всё возможное.'], ans: ['f'], why: 'Неверно: нужно не собирать лишнего и начинать с главного.' },
      { parts: ['Если проблема вне рамок физической терапии, пациента направляют к другому специалисту.'], ans: ['t'], why: 'Верно: это часть модели ведения.' },
    ], TF, { multi: false, text: true }),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
