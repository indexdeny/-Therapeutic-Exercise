const CHAPTER = { number: 26, title: 'Самостоятельный ROM: руки, палка, блоки, доска', minutes: 8, language: 'ru', next: '../ch027/' };
// bio begin: places of the biomechanics layer (B switches); made by tools/therapeutic-exercise/bio.py from content/therapeutic-exercise/ch026/bio.ru.json
const BIO = [
  {"beat": "wand", "fig": 0, "level": "angle", "joint": "aN", "load": {"type": "none"}},
];
// bio end
// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch026/cards.ru.json
const CARDS_SHORT = {
  "как только пациент может выучить\nдаже при слабости или параличе": "даже при слабости или параличе",
  "защищают заживающие ткани\nпосле операции или травмы, когда сильное сокращение мышц противопоказано": "сильное сокращение противопоказано",
  "запястье\nпальцы здоровой руки — на тыле, большой палец — в ладони; во все стороны, не давя на пальцы": "во все стороны, не давя на пальцы",
  "пальцы\nбольшим пальцем разгибают, ладонью сверху сгибают": "большим разгибают, ладонью сгибают",
  "большой палец\nразгибание — здоровый большой палец вдоль его ладонной поверхности; сгибание и противопоставление — 1-ю пястную кость к мизинцу": "противопоставление — к мизинцу",
  "наружная ротация сидя\nспина с опорой, бедро и колено согнуты; колено отвести наружу руками и вернуть": "колено отвести наружу руками",
  "голеностоп и пальцы\nбольная нога лежит на колене здоровой; рукой двигают стопу во все стороны": "нога на колене здоровой → стопа рукой",
  "больше мышечной активности\nчем при движении руками терапевта или аппаратом — только когда она нужна": "только когда она нужна",
};
// cards-short end

const SKIN = '#d8d1c1', GOOD = '#a6dcb8', WOOD = '#c9a36b';   // GOOD: the patient's healthy hand when it helps
const wave = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
// A capsule between two stage points (for the schematic views).
function seg(p, col, w) {
  const e = mk('path', { fill: col, stroke: mix(col, '#000000', .35), 'stroke-width': 1.5 }, p);
  return { e, set(A, B) { e.setAttribute('d', capsuleD(A, B, w, w * .8)); } };
}
// An oval for a helping hand; place it with put(e, { x, y, r }) and reveal it with show.
const gripOval = (p, col = GOOD, k = 1) => { const e = mk('ellipse', { rx: 22 * k, ry: 15 * k, fill: col, 'fill-opacity': .9, stroke: mix(col, '#000000', .35), 'stroke-width': 2 }, p); put(e, { o: 0 }); return e; };
// The patient's own hand on a point of their own body. reach() re-poses the same figure, so re-entry is blocked.
// k() (0..1) blends from the hand's resting place to the target, so the hand can travel there.
function selfHold(f, side, target, k = () => 1) {
  const rest = onStage(f, 'W' + side);
  let busy = false;
  const upd = () => {
    const v = k();
    if (busy || v <= 0) return;
    busy = true;
    const [x, y] = target();
    reach(f, side, lerp(rest[0], x, v), lerp(rest[1], y, v));
    busy = false;
  };
  f.onSet.push(upd); upd();
}
// Two-link reach for a leg: the ankle of leg 'N' or 'F' lands on a stage point, the knee bends forward.
function legReach(f, side, X, Y) {
  const [tx, ty] = toLocal(f, X, Y), th = RIG.th, sh = RIG.sh, dg = 180 / Math.PI;
  const vx = tx * f.dir, vy = ty, D = clamp(Math.hypot(vx, vy), 20, th + sh - 1);
  const phi = Math.atan2(vx, vy) * dg;
  const beta = Math.acos(clamp((th * th + D * D - sh * sh) / (2 * th * D), -1, 1)) * dg;
  const gam = Math.acos(clamp((th * th + sh * sh - D * D) / (2 * th * sh), -1, 1)) * dg;
  f.set({ ['h' + side]: phi + beta + f.pose.t, ['k' + side]: 180 - gam });
}
// A wand held across both hands of a side-view figure: it points at us, so it is drawn short and slanted.
function wandOn(p, f, defs) {
  const w = limbEl(p, defs, WOOD, 6 * f.s, 6 * f.s, '#8a6d3f');
  const upd = () => { const [x, y] = onStage(f, 'WN'), k = f.s; w.set([x - 30 * k, y + 16 * k], [x + 34 * k, y - 18 * k]); };
  f.onSet.push(upd); upd();
  return w;
}
// The hand from lesson 23 (shaded): forearm along x to the wrist at (x, y), then metacarpal and three phalanges.
// set({ w, mcp, pip, dip }) in degrees, + = toward the palm. h.J: joints, h.phis: segment angles.
function handModel(p, x, y, s = 1) {
  const g = G(p, { o: 0 }), defs = mk('defs', {}, g), L = [86, 48, 32, 25].map(v => v * s), R = [14, 10, 8.5, 7.5].map(v => v * s);
  limbEl(g, defs, SKIN, 24 * s, 19 * s, '#8a8476').set([x - 300 * s, y], [x, y]);
  const segs = R.map(r => limbEl(g, defs, SKIN, r, r * .85, '#8a8476'));
  const h = { g, s, ang: { w: 0, mcp: 20, pip: 30, dip: 15 }, J: [], phis: [] };
  h.set = (a = {}) => {
    Object.assign(h.ang, a);
    const { w, mcp, pip, dip } = h.ang, phis = [w, w + mcp, w + mcp + pip, w + mcp + pip + dip];
    let P = [x, y];
    const joints = [P];
    phis.forEach((ph, i) => { const Q = [P[0] + L[i] * Math.cos(rad(ph)), P[1] + L[i] * Math.sin(rad(ph))]; segs[i].set(P, Q); joints.push(Q); P = Q; });
    h.J = joints; h.phis = phis;
    h.onSet && h.onSet();
    return h;
  };
  h.set();
  return h;
}
// Point on segment i of the hand: q along it, off to the palm (+) or the back (−).
const handPt = (h, i, q, off) => { const A = h.J[i], B = h.J[i + 1], ph = rad(h.phis[i]); return [lerp(A[0], B[0], q) - Math.sin(ph) * off, lerp(A[1], B[1], q) + Math.cos(ph) * off]; };

// The devices that help with self-assisted ROM, as small chalk sketches around (0, 0).
const ST = { stroke: COL.chalk, 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round', 'stroke-linejoin': 'round' };
const DEVICES = [
  ['палка', g => path(g, 'M-60 30L60 -30', { ...ST, 'stroke-width': 11, stroke: WOOD })],
  ['лестница для пальцев', g => { path(g, 'M-24 70V-70M24 70V-70', ST); for (let y = -50; y <= 50; y += 25) path(g, `M-24 ${y}H24`, ST); }],
  ['скольжение по стене', g => { path(g, 'M34 -70V70', { ...ST, 'stroke-width': 7 }); path(g, 'M-40 50Q0 10 24 -46', { ...ST, stroke: COL.task, 'stroke-dasharray': '6 8' }); mk('circle', { cx: 24, cy: -46, r: 9, fill: COL.task }, g); }],
  ['мяч', g => { mk('circle', { cx: 0, cy: 6, r: 50, ...ST }, g); path(g, 'M-50 6Q0 36 50 6', ST); }],
  ['блоки', g => { path(g, 'M-44 -66H44', { ...ST, 'stroke-width': 7 }); mk('circle', { cx: 0, cy: -44, r: 20, ...ST }, g); path(g, 'M-20 -44V66M20 -44V36', ST); }],
  ['скользящая доска', g => { path(g, 'M-70 0H70V22H-70Z', ST); [-45, -15, 15, 45].forEach(x => mk('circle', { cx: x, cy: 36, r: 9, ...ST }, g)); }],
  ['педальный тренажёр', g => { mk('circle', { cx: 0, cy: 6, r: 38, ...ST }, g); path(g, 'M0 6L27 -21M0 6L-27 33', ST); path(g, 'M17 -21H37M-37 33H-17', { ...ST, 'stroke-width': 8 }); }],
];

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Самостоятельный ROM', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 3 · Урок 26', { x: 800, y: 230, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'Самостоятельные упражнения на объём', { x: 800, y: 315, size: 54, weight: 600, anchor: 'middle' });
    T(g, 'движений: руки, палка, блоки, доска', { x: 800, y: 380, size: 44, weight: 600, anchor: 'middle', fill: COL.dim });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'как пациенту помогать себе самому', 800, 460, m('sub'), { size: 30, fill: COL.task, anchor: 'middle', weight: 600 });

    prog(q => { const a = lerp(10, 165, wave(q, 1)); f.set({ aN: a, aF: a }); }, m('sub', .4), Math.max(1.5, D - m('sub', .4) - 1.1), lin);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);
  }],

  ['why', 'Зачем', (m) => {

    infoCard(p, 80, 290, 680, 190, 'защищают заживающие ткани', 'после операции или травмы, когда сильное сокращение мышц противопоказано', COL.good, m('prot'));
    infoCard(p, 80, 510, 680, 100, 'часть домашней программы', null, COL.task, m('home'));
    txt(p, 'помогает здоровая конечность или приспособления', 1180, 130, m('dev'), { size: 24, weight: 700, fill: COL.chalk, anchor: 'middle' });
    DEVICES.forEach(([name, draw], i) => {
      const row = i < 4 ? 0 : 1, col = row ? i - 4 : i, x = 910 + col * 180 + (row ? 90 : 0), y = 270 + row * 260;

      put(para(g, name, 0, 112, null, { size: 20, fill: COL.dim, maxW: 170, anchor: 'middle' }), { o: 1 });
      show(g, m('dev', .3 + i * .5));

  }],

  ['guide', 'Как обучать', (m) => {
    const p = panel(0);
    txt(p, 'как обучать', 800, 100, .2, { size: 30, weight: 600, fill: COL.dim, anchor: 'middle' });
    ['объяснить пользу движения', 'научить положению тела и стабилизации', 'наблюдать и исправлять обходные и опасные движения',
     'если есть оборудование — убрать все опасности', 'рисунки и ясные указания: сколько повторений и как часто', 'на следующем визите — проверить, изменить, усложнить'].forEach((str, i) => {
      const x = 100 + (i < 3 ? 0 : 720), y = 240 + (i % 3) * 190, g = G(p, { o: 0, y: 16 });
      mk('circle', { cx: x + 30, cy: y, r: 30, fill: i === 5 ? COL.good : COL.task }, g);
      T(g, String(i + 1), { x: x + 30, y: y + 11, size: 30, weight: 700, fill: COL.board, anchor: 'middle' });
      put(para(g, str, x + 82, y + 4, null, { size: 28, weight: 600, maxW: 570 }), { o: 1 });
      tw(g, { o: 1, y: 0 }, m('g' + (i + 1)), .6);
    });
  }],

  ['arm', 'Здоровая рука ведёт', (m) => {
    const p = panel(0), TOP = 560, s = 1.1, hx = 570;
    bench(p, hx - 330 * s, hx + 280 * s, TOP, .2, COL.dim, 155 * s);
    const pt = supine(p, hx, TOP, s, .2);
    // the healthy (far) hand travels to the weak arm's wrist and leads it overhead and back
    let k = 0;
    selfHold(pt, 'F', () => { const [x, y] = onStage(pt, 'WN'); return [x - 4, y + 2]; }, () => k);
    prog(q => { k = io(q); pt.set({}); }, m('grip'), 1.2, lin);
    prog(q => pt.set({ aN: lerp(4, 165, wave(q, 1)), eN: 6 }), m('flex'), 4.6, lin);
    txt(p, 'здоровая рука двигает больную', 800, 100, m('man'), { size: 28, weight: 700, fill: GOOD, anchor: 'middle' });
    pill(p, '↑ подъём: помощь основным мышцам', 1210, 180, m('man', 3), { col: COL.whole, size: 22 });
    pill(p, '↓ опускание: помощь антагонистам', 1210, 236, m('man', 5.5), { col: COL.int, size: 22 });
    txt(p, 'берёт больную руку за запястье, поддерживая кисть', 500, 180, m('grip'), { size: 23, fill: COL.chalk, anchor: 'middle' });
    // rotation: turn the humerus (the forearm is a spoke), not just bend the elbow
    txt(p, 'ротация: локоть на небольшой подушке', 1245, 340, m('rot'), { size: 23, weight: 700, fill: COL.chalk, anchor: 'middle' });
    const box = (x, ok, t0) => { const g = G(p, { o: 0 }); roundBox(g, x - 125, 380, 250, 330, ok ? COL.good : COL.bad, PANEL, 2.5); show(g, t0); return g; };
    const b1 = box(1110, true, m('rot', .3)), b2 = box(1385, false, m('rot', 1.3));
    const E1 = [1110, 600], fo1 = seg(b1, SKIN, 11);
    mk('circle', { cx: E1[0], cy: E1[1], r: 15, fill: SKIN, stroke: '#8a8476', 'stroke-width': 2 }, b1);
    const spoke = a => fo1.set(E1, [E1[0] + 110 * Math.sin(rad(a)), E1[1] - 110 * Math.cos(rad(a))]);
    spoke(0);
    prog(q => spoke(60 * Math.sin(2 * Math.PI * 2 * q)), m('rot', .6), 6.5, lin);
    put(para(b1, 'вращать плечевую кость', 1110, 660, null, { size: 21, weight: 700, fill: COL.good, maxW: 220, anchor: 'middle' }), { o: 1 });
    const S2 = [1300, 600], E2 = [1395, 600], ua2 = seg(b2, SKIN, 12), fo2 = seg(b2, SKIN, 10);
    ua2.set(S2, E2);
    const bend = a => fo2.set(E2, [E2[0] + 85 * Math.cos(rad(a)), E2[1] - 85 * Math.sin(rad(a))]);
    bend(20);
    prog(q => bend(20 + 110 * wave(q, 2)), m('rot', 1.6), 5.6, lin);
    put(para(b2, 'просто сгибать локоть', 1385, 660, null, { size: 21, weight: 700, fill: COL.bad, maxW: 220, anchor: 'middle' }), { o: 1 });
    checkMark(p, 1210, 410, m('rot', .8));
    cross(p, 1485, 410, 13, m('rot', 1.8));
    pill(p, 'пронация и супинация: лучевая кость вокруг локтевой, кисть не скручивать', 800, 830, m('pron'), { col: COL.task, size: 22 });
  }],

  ['hand', 'Запястье и пальцы', (m) => {
    const p = panel(0);
    const h = handModel(p, 600, 430, 1.6);
    show(h.g, .2);
    // the healthy hand: fingers on the back of the weak hand, thumb in its palm
    const back = gripOval(p, GOOD, 1.5), palm = gripOval(p, GOOD, 1);
    let onFingers = 0;
    h.onSet = () => {
      const i = onFingers ? 1 : 0, ph = h.phis[i];
      const B = handPt(h, i, .5, -26 * h.s), P = handPt(h, i, .45, 20 * h.s);
      put(back, { x: B[0], y: B[1], r: ph }); put(palm, { x: P[0], y: P[1], r: ph });
    };
    h.set({ w: 0, mcp: 10, pip: 15, dip: 8 });
    show(back, m('wr', .4)); show(palm, m('wr', .8));
    prog(q => h.set({ w: 55 * Math.sin(2 * Math.PI * 2 * q) }), m('wr', 1.2), m('fing') - m('wr', 1.4), lin);
    prog(q => { onFingers = 1; const v = wave(q, 1.5); h.set({ w: 0, mcp: lerp(0, 70, v), pip: lerp(0, 90, v), dip: lerp(0, 50, v) }); }, m('fing', .4), m('th') - m('fing', .4), lin);
    const lg = G(p, { o: 0 });
    mk('ellipse', { cx: 170, cy: 780, rx: 22, ry: 15, fill: GOOD, stroke: mix(GOOD, '#000000', .35), 'stroke-width': 2 }, lg);
    T(lg, 'здоровая рука', { x: 205, y: 788, size: 22, fill: GOOD, weight: 700 });
    show(lg, m('wr', .4));
    infoCard(p, 1000, 110, 520, 190, 'запястье', 'пальцы здоровой руки — на тыле, большой палец — в ладони; во все стороны, не давя на пальцы', COL.whole, m('wr'), { size: 22 });
    infoCard(p, 1000, 330, 520, 150, 'пальцы', 'большим пальцем разгибают, ладонью сверху сгибают', COL.good, m('fing'), { size: 22 });
    infoCard(p, 1000, 510, 520, 220, 'большой палец', 'разгибание — здоровый большой палец вдоль его ладонной поверхности; сгибание и противопоставление — 1-ю пястную кость к мизинцу', COL.task, m('th'), { size: 22 });
  }],

  ['leg', 'Нога', (m) => {
    const p = panel(0), TOP = 460, s = 1.0, hx = 470;
    bench(p, hx - 330 * s, hx + 280 * s, TOP, .2, COL.dim, 155 * s);
    const pt = supine(p, hx, TOP, s, .2);
    // the healthy foot lifts the weak knee, then both hands pull it to the chest
    let k = 0;
    ['N', 'F'].forEach(sd => selfHold(pt, sd, () => { const [x, y] = onStage(pt, 'KN'); return [x + (sd === 'N' ? 6 : -6), y - 4]; }, () => k));
    prog(q => { const v = io(q); pt.set({ hN: 45 * v, kN: 80 * v, hF: 22 * v, kF: 40 * v }); }, m('hip', .6), 2, lin);
    prog(q => { k = io(q); pt.set({}); }, m('hip', 3), 1.1, lin);
    prog(q => { const v = io(q); pt.set({ hN: lerp(45, 112, v), kN: lerp(80, 125, v), hF: lerp(22, 0, v), kF: lerp(40, 0, v) }); }, m('hip', 4.4), 2, lin);
    txt(p, 'здоровая стопа или ремень под колено, затем руками — к груди', hx, 100, m('hip'), { size: 23, weight: 700, fill: GOOD, anchor: 'middle' });
    txt(p, 'сидя можно поднять бедро руками', hx, 145, m('hip', 6.5), { size: 21, fill: COL.dim, anchor: 'middle' });
    // abduction and adduction lying down, seen from above: the healthy foot slides under the weak leg
    const cx = 1190, cy = 380, fs = .55;
    txt(p, 'вид сверху', cx, 180, m('abd'), { size: 21, fill: COL.dim, anchor: 'middle' });
    const tt = tableTop(p, cx, cy, fs, m('abd'));
    const f = flatFig(p, cx, cy, fs, m('abd'));
    prog(q => f.legF(lerp(3, -9, io(q))), m('abd', .6), 1, lin);
    prog(q => f.leg(14 - 14 * Math.cos(2 * Math.PI * 1.5 * q)), m('abd', 1.8), m('er') - m('abd', 1.8), lin);
    txt(p, 'здоровая стопа скользит под больной ногой', cx, 612, m('abd', .6), { size: 21, weight: 700, fill: GOOD, anchor: 'middle' });
    txt(p, 'трудно: вес ноги и трение, но нужно для движений в кровати', cx, 646, m('abd', 3), { size: 19, fill: COL.dim, anchor: 'middle' });
    infoCard(p, 80, 690, 690, 150, 'наружная ротация сидя', 'спина с опорой, бедро и колено согнуты; колено отвести наружу руками и вернуть', COL.whole, m('er'), { size: 22 });
    infoCard(p, 830, 690, 690, 150, 'голеностоп и пальцы', 'больная нога лежит на колене здоровой; рукой двигают стопу во все стороны', COL.task, m('ank'), { size: 22 });
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-rot', prompt: ['Что важно при самостоятельной ротации плеча?'],
    build: choice([
      ['Вращать плечевую кость: предплечье движется, как спица колеса'],
      ['Сгибать и разгибать локоть'],
      ['Скручивать кисть в запястье'],
      ['Держать локоть на весу, без опоры'],
    ], 0, 'Вращают плечевую кость; локоть на небольшой подушке, предплечье — спица колеса.',
    [null, 'Сгибание локтя — не ротация плеча.', 'Кисть не скручивают: это для пронации и супинации — и то без скручивания.', 'Локоть кладут на небольшую подушку.']),
  }], done) }],

  ['wand', 'Палка', (m, D) => {
    const p = panel(0), defs = mk('defs', {}, p), s = 1.2, GY = 800;
    // left: a standing figure with the wand, side view
    ground(p, 90, 420, GY, .2);
    const f = fig(p, { x: 250, y: GY - 182 * s, s, o: 0, pose: { aN: 10, aF: 10, eN: 6, eF: 6 } });
    show(f.g, .2);
