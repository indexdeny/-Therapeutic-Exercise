<script>
'use strict';
const CHAPTER = { number: 28, title: 'Гибкость, гипомобильность, контрактура', minutes: 8, language: 'ru', next: '../ch029/' };
// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch028/cards.ru.json
const CARDS_SHORT = {
  "подвижность\nспособность частей тела двигаться так, чтобы объёма хватало для повседневных задач": "объёма хватает для повседневных задач",
  "функциональный объём\nне обязательно полный, «нормальный» объём": "не обязательно полный, «нормальный» объём",
  "динамическая\nнасколько проводит сустав сокращение мышцы": "сокращение мышцы",
  "пассивная\nнасколько сустав можно провести пассивно": "провести пассивно",
  "контрактура\nадаптивное укорочение мышцы, сухожилия и тканей вокруг сустава: сильное сопротивление растяжению и ограничение объёма": "укорочение → ограничение объёма",
  "перерастяжение\nрастяжение далеко за нормальную длину мышцы и объём сустава": "далеко за нормальную длину",
  "иногда нужна\nздоровым спортсменам с хорошей силой и стабильностью": "спортсменам с хорошей стабильностью",
  "опасна\nесли связки и мышцы не удерживают сустав: нестабильность, боль, травмы": "нестабильность, боль, травмы",
};
// cards-short end

const SKIN = '#d8d1c1', HAND = '#b9cfe0', BONE = ANAT.bone, METAL_C = '#8fa3ad';
const wave = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
// A simple joint in side view for the contracture types: two bones meeting at (cx, cy), a capsule around the joint
// and a muscle crossing it above. Returns the parts so a beat can mark what is wrong.
function jointSketch(p, cx, cy, s = 1) {
  const g = G(p, { x: cx, y: cy, s, o: 0 }), defs = mk('defs', {}, g);
  const mus = limbEl(g, defs, ANAT.muscle, 20, 20, mix(ANAT.muscle, '#000000', .35));
  mus.set([-110, -58], [110, -58]);
  [[-150, -12], [12, 150]].forEach(([a, b]) => { mk('path', { d: capsuleD([a, 0], [b, 0], 20, 20), fill: BONE, stroke: '#9c9585', 'stroke-width': 2 }, g); });
  const cap = mk('ellipse', { cx: 0, cy: 0, rx: 44, ry: 36, fill: 'none', stroke: ANAT.tendon, 'stroke-width': 3, 'stroke-dasharray': '7 5' }, g);
  [-110, 110].forEach(x => path(g, `M${x} -48V-20`, { stroke: ANAT.tendon, 'stroke-width': 4 }));
  return { g, mus, cap };
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Гибкость и контрактура', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 4 · Урок 28', { x: 800, y: 240, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'Гибкость, гипомобильность, контрактура', { x: 800, y: 335, size: 56, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'с этого урока начинается глава о растяжке', 800, 430, m('sub'), { size: 30, fill: COL.task, anchor: 'middle', weight: 600 });
    const art = G(scene, { o: 0 });
    const sc = tableScene(art, { hx: 820, top: 680, s: .55, t0: 0 });
    muscleOn(sc.pt, ...MUSCLE.hamstrings, { after: 'ftN', w: 13 });
    show(art, m('sub', .2));
    prog(q => sc.pt.set({ hN: 75 * wave(q, 1) }), m('sub', .4), Math.max(1.5, D - m('sub', .4) - 1.1), lin);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);
  }],

  ['mob', 'Подвижность', (m, D) => {
    const p = panel(0), s = 1.3, GY = 800;
    ground(p, 120, 640, GY, .2);
    // a shelf the patient reaches for: the task needs about 150° of shoulder flexion, not the full range
    const shelf = G(p, { o: 0 });
    mk('rect', { x: 470, y: 250, width: 170, height: 14, rx: 4, fill: COL.dim }, shelf);
    mk('rect', { x: 540, y: 216, width: 46, height: 34, rx: 6, fill: COL.task, 'fill-opacity': .7 }, shelf);
    show(shelf, .2);
    const f = fig(p, { x: 330, y: GY - 182 * s, s, o: 0, pose: { aN: 10, eN: 12 } });
    show(f.g, .2);
    const Sh = onStage(f, 'Sh'), R = 230;
    const full = path(p, romArc(Sh, R, 0, 180, 90), { stroke: COL.dim, 'stroke-width': 4, 'stroke-dasharray': '6 8' }, { o: 0 });
    const need = path(p, romArc(Sh, R + 18, 0, 150, 90), { stroke: COL.good, 'stroke-width': 7 }, { o: 0 });
    show(full, m('func', .3)); show(need, m('func', 1));
    prog(q => f.set({ aN: lerp(10, 150, q), eN: lerp(12, 8, q) }), m('mob', .8), 2.4, io);
    txt(p, 'полный объём', Sh[0] - 70, Sh[1] - R - 14, m('func', .3), { size: 21, fill: COL.dim, anchor: 'end' });
    txt(p, 'нужный для задачи', Sh[0] + R + 34, Sh[1] + 10, m('func', 1), { size: 22, weight: 700, fill: COL.good });
    infoCard(p, 820, 120, 680, 200, 'подвижность', 'способность частей тела двигаться так, чтобы объёма хватало для повседневных задач', COL.whole, m('mob'), { size: 23 });
    infoCard(p, 820, 350, 680, 150, 'функциональный объём', 'не обязательно полный, «нормальный» объём', COL.good, m('func'), { size: 23 });
    txt(p, 'подвижность опирается на работу мышц:', 1160, 570, m('musc'), { size: 23, weight: 700, fill: COL.chalk, anchor: 'middle' });
    ['сила', 'выносливость', 'нервно-мышечный контроль'].forEach((str, i) => pill(p, str, [915, 1075, 1365][i], 630, m('musc', .6 + i * .6), { col: COL.nat, size: 22 }));
  }],

  ['str', 'Что такое растяжка', (m) => {
    const p = panel(0);
    labelBox(p, 800, 110, 1300, ['растяжка — удлиняет адаптивно укоротившиеся ткани и увеличивает гибкость и объём движений'], COL.task, m('def'), { size: 25 });
    pill(p, 'сначала — обследование: что ограничивает и нужна ли растяжка', 800, 190, m('exam'), { col: COL.whole, size: 22 });
    // three stages: hands of a specialist → the patient alone → a device
    const sc = tableScene(p, { hx: 310, top: 520, s: .62, t0: m('seq') });
    const ham = muscleOn(sc.pt, ...MUSCLE.hamstrings, { after: 'ftN', w: 12 });
    prog(q => sc.pt.set({ hN: 70 * wave(q, 2) }), m('seq', .6), 6, lin);
    const GY = 560, s2 = .75, sf = fig(p, { x: 790, y: GY - 22 * s2, s: s2, o: 0, pose: { t: 52, hd: 10, hN: 142, kN: 0, fN: 0, hF: 142, kF: 0, fF: 0 } });
    reach(sf, 'N', ...onStage(sf, 'toeN')); reach(sf, 'F', ...onStage(sf, 'toeN'));
    muscleOn(sf, ...MUSCLE.hamstrings, { after: 'ftN', w: 12, slack: .82 });
    ground(p, 700, 1000, GY, m('seq', 2));
    show(sf.g, m('seq', 2));
    // a dynamic splint: two cuffs on a hinge with a dial
    const dv = G(p, { x: 1300, y: 470, o: 0 });
    path(dv, 'M-120 30L0 0L110 -60', { stroke: METAL_C, 'stroke-width': 12 });
    mk('circle', { cx: 0, cy: 0, r: 26, fill: PANEL, stroke: METAL_C, 'stroke-width': 5 }, dv);
    path(dv, 'M0 0L14 -16', { stroke: COL.task, 'stroke-width': 4 });
    [[-80, 20], [80, -44]].forEach(([x, y]) => mk('rect', { x: x - 26, y: y - 20, width: 52, height: 40, rx: 10, fill: 'none', stroke: COL.chalk, 'stroke-width': 3 }, dv));
    show(dv, m('seq', 4));
    [['ручная растяжка, мобилизация', 310, 0], ['самостоятельная растяжка', 800, 2], ['приспособления', 1300, 4]].forEach(([str, x, k]) => txt(p, str, x, 690, m('seq', k), { size: 23, weight: 700, fill: COL.chalk, anchor: 'middle' }));
    arrowTo(p, [520, 690], [600, 690], m('seq', 2), { col: COL.dim, w: 4 });
    arrowTo(p, [1000, 690], [1120, 690], m('seq', 4), { col: COL.dim, w: 4 });
    labelBox(p, 800, 790, 1100, ['новый объём — сразу в повседневные движения и упражнения на силу'], COL.good, m('use'), { size: 24 });
  }],

  ['flex', 'Гибкость', (m) => {
    const p = panel(0);
    const sc = tableScene(p, { hx: 640, top: 560, s: 1.15, t0: .2 });
    const pt = sc.pt, rf = muscleOn(pt, ...MUSCLE.rectus, { after: 'ftN', w: 13 }), ham = muscleOn(pt, ...MUSCLE.hamstrings, { after: 'ftN', w: 13, slack: 1.02 });
    put(sc.th.g, { o: 0 });
    // dynamic: the patient's own hip flexors lift the leg; passive: the therapist takes it further
    prog(q => { pt.set({ hN: 60 * io(q) }); rf.act(io(q) * .9); }, m('dyn', .4), 1.6, lin);
    prog(q => rf.act(.9 * (1 - q)), m('pas'), .6, lin);
    show(sc.th.g, m('pas'));
    prog(q => pt.set({ hN: lerp(60, 85, io(q)) }), m('pas', .8), 1.6, lin);
    const H = onStage(pt, 'H'), R = 300;
    const a1 = path(p, romArc(H, R, 0, 60), { stroke: COL.task, 'stroke-width': 6 }, { o: 0 });
    const a2 = path(p, romArc(H, R + 22, 0, 85), { stroke: COL.whole, 'stroke-width': 6 }, { o: 0 });
    show(a1, m('dyn', 2)); show(a2, m('pas', 2.4));
    infoCard(p, 80, 100, 620, 160, 'гибкость', 'плавно и без боли провести сустав через неограниченный объём', COL.chalk, m('flex'), { size: 22 });
    infoCard(p, 960, 100, 560, 150, 'динамическая', 'насколько проводит сустав сокращение мышцы', COL.task, m('dyn'), { size: 22 });
    infoCard(p, 960, 280, 560, 150, 'пассивная', 'насколько сустав можно провести пассивно', COL.whole, m('pas'), { size: 22 });
    txt(p, '60°', H[0] + R * Math.cos(rad(-60)) + 14, H[1] + R * Math.sin(rad(-60)), m('dyn', 2), { size: 23, weight: 700, fill: COL.task });
    txt(p, '85°', H[0] + (R + 22) * Math.cos(rad(-85)) + 12, H[1] + (R + 22) * Math.sin(rad(-85)) - 8, m('pas', 2.4), { size: 23, weight: 700, fill: COL.whole });
    NOTE(p, 1240, 470, m('dyn', 2));
    labelBox(p, 800, 820, 980, ['пассивная гибкость — условие, но не гарантия динамической'], COL.int, m('pre'), { size: 25 });
  }],

  ['hypo', 'Гипомобильность', (m) => {
    const p = panel(0);
    txt(p, 'гипомобильность — подвижность сустава уменьшена', 800, 100, m('hypo'), { size: 28, weight: 700, fill: COL.chalk, anchor: 'middle' });
    const card = (x, y, title, body, col, t0) => { const g = G(p, { o: 0 }); roundBox(g, x, y, 690, 280, col, PANEL, 2.5); put(para(g, title, x + 220, y + 60, null, { size: 25, weight: 700, fill: col, maxW: 440 }), { o: 1 }); put(para(g, body, x + 220, y + 130, null, { size: 22, fill: COL.chalk, maxW: 440 }), { o: 1 }); show(g, t0); return g; };
    const c1 = card(80, 160, 'долгая иммобилизация', 'гипс, ортез, вытяжение; боль, воспаление, выпот', COL.whole, m('imm'));
    const c2 = card(830, 160, 'образ жизни', 'сидячий образ жизни, привычные неправильные позы', COL.task, m('life'));
    const c3 = card(80, 480, 'нервная система и мышцы', 'паралич, нарушения тонуса, мышечный дисбаланс', COL.real, m('neuro'));
    const c4 = card(830, 480, 'травмы и болезни', 'переломы, операции, ожоги, болезни суставов, сколиоз и кифоз', COL.bad, m('trauma'));
    // icons: a leg in a cast, a slumped sitter, a nerve with a spark, a broken bone
    const defs = mk('defs', {}, p);
    limbEl(c1, defs, SKIN, 22, 16, '#8a8476').set([150, 260], [190, 400]);
    mk('rect', { x: 140, y: 290, width: 70, height: 90, rx: 14, fill: '#f2efe6', stroke: '#b8b2a2', 'stroke-width': 2, transform: 'rotate(-16 175 335)' }, c1);
    const sit = fig(c2, { x: 960, y: 360, s: .55, pose: { ...SIT, t: -6, hd: 22, aN: 30, eN: 70, aF: 30, eF: 70 } });
    path(c2, 'M915 372H1000M920 372V430M995 372V430', { stroke: COL.dim, 'stroke-width': 4 });
    path(c3, 'M120 690C160 600 200 680 240 600', { stroke: COL.real, 'stroke-width': 6 });
    path(c3, 'M190 560L170 610H200L180 660', { stroke: COL.int, 'stroke-width': 5 });
    path(c4, 'M880 690L960 620L975 640L1000 600L1060 560', { stroke: BONE, 'stroke-width': 18 });
    path(c4, 'M955 612L985 648', { stroke: COL.bad, 'stroke-width': 5 });
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-flex', prompt: ['Динамическая или пассивная гибкость?'],
    build: grid([
      { parts: ['Пациент сам поднимает руку до 120°'], ans: ['d'], why: 'Объём, который даёт сокращение мышцы.' },
      { parts: ['Терапевт поднимает руку пациента до 170°'], ans: ['p'], why: 'Сустав проводят пассивно.' },
      { parts: ['Пациент активно разгибает колено до конца'], ans: ['d'], why: 'Активное движение.' },
      { parts: ['Стопу пассивно сгибают к голени на 20°'], ans: ['p'], why: 'Движение без сокращения мышцы пациента.' },
      { parts: ['Нужна достаточная сила мышцы, а не только растяжимость'], ans: ['d'], why: 'Динамическая гибкость зависит и от сокращения мышцы.' },
    ], [['d', 'Динамическая', COL.task], ['p', 'Пассивная', COL.whole]], { multi: false, text: true }),
  }], done) }],

  ['contr', 'Контрактура', (m) => {
    const p = panel(0), defs = mk('defs', {}, p);
    // the spectrum from mild tightness to an irreversible contracture
    const gr = mk('linearGradient', { id: 'spec', x1: 0, x2: 1 }, defs);
    [[0, COL.int], [.6, COL.nat], [1, COL.bad]].forEach(([o, c]) => mk('stop', { offset: o, 'stop-color': c }, gr));
    const bar = G(p, { o: 0 });
    mk('rect', { x: 200, y: 120, width: 1200, height: 22, rx: 11, fill: 'url(#spec)' }, bar);
    [['тугоподвижность', 220, 'start'], ['укорочение', 640, 'middle'], ['контрактура', 1000, 'middle'], ['необратимая', 1400, 'end']].forEach(([str, x, a]) => T(bar, str, { x, y: 180, size: 22, weight: 700, fill: COL.chalk, anchor: a }));
    show(bar, m('range'));
    // a knee flexion contracture: the knee will not straighten, the hamstrings and the back of the capsule are taut
    const sc = tableScene(p, { hx: 560, top: 600, s: 1.1, t0: .2, hands: null, pose: { hN: 0, kN: 70 } });
    const ham = muscleOn(sc.pt, ...MUSCLE.hamstrings, { after: 'ftN', w: 13, slack: .9 });
    const ghost = path(p, '', { stroke: COL.chalk, 'stroke-width': 3, 'stroke-dasharray': '8 8' }, { o: 0 });
    const [kx, ky] = onStage(sc.pt, 'KN');
    prog(q => sc.pt.set({ kN: lerp(70, 32, io(q)) }), m('def', .5), 2, lin);
    ghost.setAttribute('d', `M${kx} ${ky}H${kx + 190 * 1.1}`);
    show(ghost, m('def', 2.5));
    cross(p, kx + 210, ky - 8, 14, m('def', 2.8));
    txt(p, 'колено не разгибается: задняя группа натянута', 560, 780, m('def', 3), { size: 23, weight: 700, fill: ANAT.stretch, anchor: 'middle' });
    infoCard(p, 1020, 230, 500, 270, 'контрактура', 'адаптивное укорочение мышцы, сухожилия и тканей вокруг сустава: сильное сопротивление растяжению и ограничение объёма', COL.bad, m('def'), { size: 22 });
    ['почти полная потеря — контрактура', 'частичная — укорочение', 'лёгкая — тугоподвижность'].forEach((str, i) => pill(p, str, 1270, 580 + i * 62, m('terms', i * 1.2), { col: [COL.bad, COL.nat, COL.int][i], size: 22 }));
  }],

  ['name', 'Название по стороне', (m) => {
    const p = panel(0);
    labelBox(p, 800, 100, 1100, ['контрактуру называют по стороне сустава, где ткани укорочены'], COL.chalk, m('side'), { size: 26 });
    // elbow: the flexors are shortened, so the elbow stops short of full extension
    const el = elbowModel(p, { x: 120, y: 520, s: 1.8 });
    put(el.g, { o: 0 }); show(el.g, m('elbow'));
    ['biceps', 'brachialis'].forEach(k => { el.muscles[k].rest *= .86; });
    el.set(80);
    prog(q => el.set(lerp(80, 128, io(q))), m('elbow', .6), 2, lin);
    txt(p, 'сгибательная контрактура локтя', 380, 720, m('elbow', 1), { size: 25, weight: 700, fill: COL.bad, anchor: 'middle' });
    txt(p, 'укорочены сгибатели — локоть не разгибается', 380, 760, m('elbow', 1.6), { size: 21, fill: ANAT.stretch, anchor: 'middle' });
    // hip seen from above: the adductors are shortened, so the leg barely moves out
    const cx = 1200, cy = 470, s = .62;
    tableTop(p, cx, cy, s, m('hip'));
    const f = flatFig(p, cx, cy, s, m('hip'));
    const P0 = [8, 10], thighPt = () => { const u = f.pts.uL, n = [-u[1], u[0]]; return [30 + 120 * u[0] - 14 * n[0], 120 * u[1] - 14 * n[1]]; };
    f.leg(3);
    const add = muscleEl(f.top, { rest: Math.hypot(...thighPt().map((v, i) => v - P0[i])) * .97, w: 13 });
    f.onSet.push(() => add.set(P0, thighPt()));
    f.leg(3);
    prog(q => f.leg(lerp(3, 10, io(q))), m('hip', .8), 1.6, lin);
    txt(p, 'приводящая контрактура бедра', cx, 720, m('hip', 1), { size: 25, weight: 700, fill: COL.bad, anchor: 'middle' });
    txt(p, 'укорочены приводящие — нога не отводится', cx, 760, m('hip', 1.6), { size: 21, fill: ANAT.stretch, anchor: 'middle' });
    pill(p, 'контрактура (укорочение) ≠ сокращение (активное напряжение)', 800, 840, m('vs'), { col: COL.int, size: 23 });
  }],

  ['types', 'Миостатическая и псевдомиостатическая', (m) => {
    const p = panel(0);
    txt(p, 'миостатическая', 420, 110, m('myo'), { size: 27, weight: 700, fill: COL.nat, anchor: 'middle' });
    // a row of sarcomeres: the shortened muscle has fewer of them, each of the same length
    const row = (y, n, t0, label) => {
      const g = G(p, { o: 0 }), w = 64;
      for (let i = 0; i < n; i++) sarcomere(g, 120 + w / 2 + i * w, y, w, 36);
      T(g, label, { x: 120, y: y - 34, size: 21, fill: COL.dim });
      show(g, t0);
      return g;
    };
    row(230, 10, m('myo', .5), 'норма');
    row(360, 7, m('myo', 2), 'миостатическая контрактура');
    const br = path(p, `M${120 + 7 * 64} 395V410H${120 + 10 * 64}V395`, { stroke: COL.bad, 'stroke-width': 3, fill: 'none' }, { o: 0 });
    show(br, m('myo', 3));
    txt(p, 'саркомеров меньше, длина каждого прежняя', 420, 450, m('myo', 3), { size: 22, weight: 700, fill: COL.bad, anchor: 'middle' });
    pill(p, 'уходит за сравнительно короткое время растяжки', 420, 510, m('myo', 5), { col: COL.good, size: 22 });
    // pseudomyostatic: a muscle held contracted by the nervous system; inhibition lets it lengthen fully
    txt(p, 'псевдомиостатическая', 1180, 110, m('pseudo'), { size: 27, weight: 700, fill: COL.real, anchor: 'middle' });
    const mg = G(p, { o: 0 }), defs = mk('defs', {}, mg);
    const A = [930, 400];
    [[860, 400, 930, 400], [1430, 400, 1500, 400]].forEach(([a, b, c, d]) => mk('path', { d: capsuleD([a, b], [c, d], 16, 16), fill: BONE }, mg));
    const mu = muscleEl(mg, { rest: 400, w: 30 });
    const lightning = path(mg, 'M1180 200L1150 260H1190L1160 320', { stroke: COL.int, 'stroke-width': 6 });
    T(mg, 'спастичность, ригидность, спазм, боль', { x: 1180, y: 180, size: 21, fill: COL.int, anchor: 'middle' });
    show(mg, m('pseudo', .3));
    const setL = (L, a) => { mu.set(A, [A[0] + L, A[1]]); mu.act(a); };
    setL(330, .9);
    prog(q => setL(330, .9), m('pseudo', .3), .1, lin);
    prog(q => { setL(lerp(330, 470, io(q)), .9 * (1 - q)); put(lightning, { o: 1 - q }); }, m('inh', .6), 2.4, lin);
    txt(p, 'мышца словно постоянно сокращена', 1180, 490, m('pseudo', 2), { size: 22, weight: 700, fill: COL.bad, anchor: 'middle' });
    labelBox(p, 1180, 600, 600, ['нервно-мышечное торможение', '→ мышца удлиняется полностью'], COL.good, m('inh'), { size: 24 });
  }],

  ['types2', 'Артрогенная, фиброзная, необратимая', (m) => {
    const p = panel(0);
    const xs = [220, 600, 990, 1380];
    const J = xs.map((x, i) => jointSketch(p, x, 400, .95));
    const t0s = [m('arth'), m('peri'), m('fib'), m('irr')];
    J.forEach((j, i) => show(j.g, t0s[i]));
    // arthrogenic: inside the joint — effusion, osteophytes, adhesions
    const a = G(J[0].g, { o: 0 });
    mk('ellipse', { cx: 0, cy: 0, rx: 26, ry: 22, fill: COL.whole, 'fill-opacity': .45 }, a);
    path(a, 'M-14 -18l-8 -12l10 4M14 18l8 12l-10 -4', { stroke: BONE, 'stroke-width': 5 });
    path(a, 'M-8 -6L8 6M-6 8L8 -8', { stroke: COL.bad, 'stroke-width': 3 });
    show(a, m('arth', .6));
    // periarticular: the capsule thick and tight
    tw(J[1].cap, { o: 1 }, m('peri', .6), .1);
    prog(q => { J[1].cap.setAttribute('stroke-width', (3 + 6 * q).toFixed(1)); J[1].cap.setAttribute('stroke-dasharray', q > .5 ? 'none' : '7 5'); J[1].cap.setAttribute('stroke', mix(ANAT.tendon, ANAT.taut, q)); }, m('peri', .6), 1, lin);
    // fibrotic: grey fibrous strands through the muscle
    const fb = G(J[2].g, { o: 0 });
    for (let i = 0; i < 6; i++) path(fb, `M${-90 + i * 34} -76L${-70 + i * 34} -40`, { stroke: '#8d8a84', 'stroke-width': 5 });
    show(fb, m('fib', .6));
    // irreversible: scar and bone take the place of the muscle
    const ir = G(J[3].g, { o: 0 });
    mk('rect', { x: -70, y: -80, width: 140, height: 44, rx: 10, fill: '#8d8a84' }, ir);
    mk('ellipse', { cx: 30, cy: -58, rx: 30, ry: 16, fill: BONE }, ir);
    show(ir, m('irr', .6));
    [['артрогенная', 'изменения внутри сустава: выпот, остеофиты, спайки, хрящ', COL.whole],
     ['периартикулярная', 'капсула и ткани вокруг сустава теряют подвижность', ANAT.tendon],
     ['фиброзная', 'фиброзная ткань в мышце: растянуть можно, но трудно', COL.int],
     ['необратимая', 'рубец, плотные спайки, кость — без операции не исправить', COL.bad]].forEach(([t1, t2, col], i) => {
      txt(p, t1, xs[i], 560, t0s[i], { size: 25, weight: 700, fill: col, anchor: 'middle' });
      put(para(p, t2, xs[i], 600, null, { size: 20, fill: COL.chalk, maxW: 330, anchor: 'middle' }), { o: 0 });
      show(p.lastChild, t0s[i] + .5);
    });
    labelBox(p, 800, 790, 1180, ['чем дольше фиброзная контрактура, тем вероятнее, что она станет необратимой'], COL.bad, m('irr', 3), { size: 23 });
  }],

  ['sel', 'Избирательная растяжка', (m) => {
    const p = panel(0), s = 1.05, GY = 640;
    txt(p, 'одни мышцы растягивают, другим дают слегка укоротиться — ради функции', 800, 100, m('sel'), { size: 25, weight: 700, fill: COL.chalk, anchor: 'middle' });
    // spinal cord injury: long sitting — the hamstrings are kept long, the low back extensors a little short
    ground(p, 130, 660, GY, m('sci'));
    const f = fig(p, { x: 300, y: GY - 22 * s, s, o: 0, pose: { t: 18, hd: 6, hN: 108, kN: 0, fN: 0, hF: 108, kF: 0, fF: 0, aN: 20, eN: 30, aF: 20, eF: 30 } });
    const ham = muscleOn(f, ...MUSCLE.hamstrings, { after: 'ftN', w: 12, slack: .9 });
    f.set({});
    show(f.g, m('sci'));
    const back = muscleOn(f, ['H', 'Sh', 20, -14], ['H', 'Sh', 80, -16], { w: 12, slack: 1.15, col: ANAT.muscleDeep });
    txt(p, 'задняя группа бедра — растягивают', 400, 700, m('sci', 1), { size: 22, weight: 700, fill: ANAT.stretch, anchor: 'middle' });
    txt(p, 'разгибатели поясницы — слегка короче: опора при сидении', 400, 740, m('sci', 3), { size: 22, weight: 700, fill: COL.nat, anchor: 'middle' });
    // tenodesis grasp: extending the wrist pulls the shortened finger flexors and the fingers close
    const h = handSide(p, 1200, 400, 1.3, { tendons: true });
    show(h.g, m('ten'));
    h.set({ w: 45, mcp: 5, pip: 5, dip: 3 });
    prog(q => { const v = wave(q, 1.5); h.set({ w: lerp(45, -45, v), mcp: lerp(5, 65, v), pip: lerp(5, 75, v), dip: lerp(3, 40, v) }); }, m('ten', .6), 6, lin);
    txt(p, 'тенодезный захват', 1150, 600, m('ten'), { size: 25, weight: 700, fill: COL.task, anchor: 'middle' });
    put(para(p, 'запястье разгибается — слегка укороченные сгибатели пальцев натягиваются, и пальцы сгибаются сами', 1150, 645, null, { size: 21, maxW: 560, fill: COL.chalk, anchor: 'middle' }), { o: 0 });
    show(p.lastChild, m('ten', .8));
    pill(p, 'обычно — при стойком параличе', 400, 160, m('sel', 3), { col: COL.dim, size: 21 });
  }],

  ['over', 'Перерастяжение', (m) => {
    const p = panel(0), s = 1.35, GY = 790;
    ground(p, 220, 700, GY, .2);
    const f = fig(p, { x: 460, y: GY - 182 * s, s, o: 0, pose: { aN: 4, eN: 10 } });
    show(f.g, .2);
    const K = onStage(f, 'KN');
    const line = path(p, `M${K[0]} ${K[1] - 120}L${K[0]} ${K[1] + 120}`, { stroke: COL.dim, 'stroke-width': 3, 'stroke-dasharray': '8 8' }, { o: 0 });
    show(line, m('over', .5));
    const ax = onStage(f, 'AN')[0];
    prog(q => { f.set({ kN: -20 * io(q) }); plant(f, 'AN', ax, GY); }, m('over', 1), 1.4, lin);
    txt(p, 'колено переразгибается', K[0] + 40, K[1] + 8, m('over', 2.4), { size: 22, weight: 700, fill: COL.bad });
    txt(p, 'гипермобильность', 460, 120, m('over', 1.5), { size: 27, weight: 700, fill: COL.bad, anchor: 'middle' });
    infoCard(p, 860, 140, 650, 180, 'перерастяжение', 'растяжение далеко за нормальную длину мышцы и объём сустава', COL.bad, m('over'), { size: 23 });
    infoCard(p, 860, 350, 650, 160, 'иногда нужна', 'здоровым спортсменам с хорошей силой и стабильностью', COL.good, m('sport'), { size: 23 });
    infoCard(p, 860, 540, 650, 190, 'опасна', 'если связки и мышцы не удерживают сустав: нестабильность, боль, травмы', COL.bad, m('instab'), { size: 23 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-type', prompt: ['Какой это тип контрактуры?'],
    build: grid([
      { parts: ['После инсульта спастичность не даёт разогнуть локоть'], ans: ['ps'], why: 'Псевдомиостатическая: мышцу держит нервная система.' },
      { parts: ['Выпот и остеофиты в колене ограничивают движение'], ans: ['ar'], why: 'Артрогенная: изменения внутри сустава.' },
      { parts: ['После долгого сидения укоротилась здоровая задняя группа бедра'], ans: ['my'], why: 'Миостатическая: мышца здорова, саркомеров меньше.' },
      { parts: ['Мышцу заместили рубец и кость'], ans: ['ir'], why: 'Необратимая: без операции не исправить.' },
    ], [['my', 'Миостатическая', COL.nat], ['ps', 'Псевдомиостатическая', COL.real], ['ar', 'Артрогенная', COL.whole], ['ir', 'Необратимая', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Гибкость бывает динамической и пассивной; пассивная — условие, но не гарантия динамической.', 'w1'],
     ['Контрактуру называют по стороне укороченных тканей: сгибательная, приводящая.', 'w2'],
     ['Миостатическая уходит быстро, псевдомиостатическая уступает торможению, фиброзная трудна, необратимая — только операция.', 'w3'],
     ['Избирательная растяжка и гипермобильность — баланс подвижности и стабильности.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 220 + i * 140, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 31, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-name', prompt: ['Назовите контрактуру.'],
    build: grid([
      { parts: ['Укорочены сгибатели колена — колено не разгибается'], ans: ['f'], why: 'Сгибательная контрактура колена.' },
      { parts: ['Укорочены приводящие бедра — нога не отводится'], ans: ['ad'], why: 'Приводящая контрактура бедра.' },
      { parts: ['Укорочена четырёхглавая — колено не сгибается'], ans: ['e'], why: 'Разгибательная контрактура колена.' },
      { parts: ['Укорочены отводящие бедра — нога не приводится'], ans: ['ab'], why: 'Отводящая контрактура бедра.' },
      { parts: ['Укорочены сгибатели локтя'], ans: ['f'], why: 'Сгибательная контрактура локтя.' },
    ], [['f', 'Сгибательная', COL.nat], ['e', 'Разгибательная', COL.whole], ['ad', 'Приводящая', COL.task], ['ab', 'Отводящая', COL.real]], { multi: false, text: true }),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-tf', prompt: ['Верно или неверно?'],
    build: grid([
      { parts: ['Пассивная гибкость гарантирует динамическую.'], ans: ['f'], why: 'Неверно: это условие, но не гарантия.' },
      { parts: ['Контрактуру называют по стороне сустава с укороченными тканями.'], ans: ['t'], why: 'Верно.' },
      { parts: ['Миостатическая контрактура обычно уходит за сравнительно короткое время растяжки.'], ans: ['t'], why: 'Верно.' },
      { parts: ['Контрактура и сокращение — синонимы.'], ans: ['f'], why: 'Неверно: укорочение тканей ≠ активное напряжение.' },
      { parts: ['При тетраплегии разгибателям поясницы иногда дают немного укоротиться.'], ans: ['t'], why: 'Верно: это опора при сидении.' },
    ], TF, { multi: false, text: true }),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
