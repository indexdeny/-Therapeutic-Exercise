<body>

<script src="audio/ru/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 37, title: 'Предосторожности и вспомогательные средства', minutes: 8, language: 'ru', next: '../ch038/' };
// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch037/cards.ru.json
const CARDS_SHORT = {
  "проверять программы\nупражнения готовых программ и видео; убирать или менять неподходящие; баланс между мышцами-антагонистами": "убирать неподходящие, баланс антагонистов",
  "учить пациента\nразминка, самостабилизация, правильная интенсивность: боль после занятия лёгкая и проходит за сутки": "разминка + боль проходит за сутки",
  "обучение расслаблению\nтихое место, мягкий голос, глубокое дыхание или спокойный образ": "тихое место, голос, дыхание",
  "аутогенная тренировка\nсамовнушение и медитация": "самовнушение и медитация",
  "прогрессивная релаксация\nот кистей и стоп к туловищу: напрячь 5–7 с, расслабить 20–30 с, почувствовать тяжесть и тепло": "напрячь 5–7 с, расслабить 20–30 с",
  "пилатес\nдыхание, стабилизация корпуса, контроль позы, сила, гибкость": "дыхание, корпус, контроль позы",
  "тепло\nмышца теплее — ткани растяжимее; нужна меньшая сила и меньше времени": "теплее → растяжимее, меньше силы",
  "как разогреть\nповерхностно: горячие пакеты, парафин; глубоко: ультразвук, коротковолновая диатермия; большие мышцы — лёгкая разминка": "пакеты, ультразвук, лёгкая разминка",
  "без растяжки — почти ничего\nтепло само по себе гибкость почти не увеличивает; вместе с растяжкой данные смешанные": "тепло само гибкость не увеличивает",
  "холод\nсразу после травмы — меньше боли и спазма; но заживающие ткани от холода менее растяжимы и легче травмируются": "после травмы — да; ткани менее растяжимы",
  "массаж\nрасслабляет мышцы, усиливает кровоток, снимает спазм": "расслабляет, кровоток, спазм",
  "мобилизация мягких тканей\nмиофасциальный и поперечный фрикционный массаж, инструменты: ползучесть и релаксация": "фрикционный массаж: ползучесть и релаксация",
  "обратная связь\nприбор показывает напряжение мышцы — пациент учится его ощущать и снижать": "прибор → учится снижать напряжение",
  "тракция и маятник\nлёгкая тракция, маятниковые движения, можно с грузом 0,5–1 кг (в книге — 1–2 фунта): меньше боли и спазма": "груз 0,5–1 кг → меньше боли и спазма",
};
// cards-short end

const HAND = '#b9cfe0', HEAT = '#f08c5a', COLD = '#7fc4ec';
const wave = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
// A warning row: a red triangle with «!», then the text.
function warnRow(p, x, y, str, t0, { size = 25, maxW = 620, col = COL.bad } = {}) {
  const g = G(p, { o: 0, x: -16 });
  path(g, `M${x + 22} ${y - 34}L${x + 46} ${y + 6}H${x - 2}Z`, { stroke: col, 'stroke-width': 3, fill: col, 'fill-opacity': .2 });
  T(g, '!', { x: x + 22, y: y + 1, size: 24, weight: 700, fill: col, anchor: 'middle' });
  put(para(g, str, x + 64, y, null, { size, weight: 600, maxW }), { o: 1 });
  tw(g, { o: 1, x: 0 }, t0, .5);
  return g;
}
// A flame and a snowflake drawn in chalk, centred at (x, y).
const flame = (p, x, y, s = 1) => path(p, `M${x} ${y + 40 * s}C${x - 40 * s} ${y + 30 * s} ${x - 30 * s} ${y - 10 * s} ${x} ${y - 50 * s}C${x + 30 * s} ${y - 10 * s} ${x + 40 * s} ${y + 30 * s} ${x} ${y + 40 * s}Z`, { stroke: HEAT, 'stroke-width': 4, fill: HEAT, 'fill-opacity': .25 });
const snow = (p, x, y, s = 1) => path(p, [0, 60, 120].map(a => { const c = Math.cos(rad(a)) * 44 * s, d = Math.sin(rad(a)) * 44 * s; return `M${x - c} ${y - d}L${x + c} ${y + d}`; }).join(''), { stroke: COLD, 'stroke-width': 5 });

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Предосторожности', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 4 · Урок 37', { x: 800, y: 230, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'Предосторожности', { x: 800, y: 315, size: 56, weight: 600, anchor: 'middle' });
    T(g, 'и вспомогательные средства', { x: 800, y: 380, size: 46, weight: 600, anchor: 'middle', fill: COL.dim });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'как растягивать безопасно и что помогает растяжке', 800, 460, m('sub'), { size: 30, fill: COL.task, anchor: 'middle', weight: 600 });
    const art = G(scene, { o: 0 });
    flame(art, 700, 690, 1.3); snow(art, 900, 690, 1.3);
    show(art, m('sub', .2));
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);
  }],

  ['gen', 'Общие предосторожности', (m) => {
    const p = panel(0);
    txt(p, 'общие предосторожности', 800, 100, .2, { size: 30, weight: 700, fill: COL.bad, anchor: 'middle' });
    warnRow(p, 120, 220, 'не выводить сустав за нормальный объём; норма у всех своя — у женщин гибкость обычно больше, с возрастом меняется', m('g1'), { maxW: 1300 });
    warnRow(p, 120, 360, 'остеопороз: болезнь, постельный режим, возраст, стероиды', m('g2'), { maxW: 1300 });
    warnRow(p, 120, 470, 'свежесросшийся перелом: стабилизировать между переломом и движущимся суставом', m('g3'), { maxW: 1300 });
    warnRow(p, 120, 580, 'длинный рычаг — больший момент силы: важно, где приложена сила', m('g4'), { maxW: 1300 });
    // a lever: the same force farther from the joint makes more torque
    const lv = G(p, { o: 0 });
    path(lv, 'M500 760H1100', { stroke: ANAT.bone, 'stroke-width': 14 });
    mk('circle', { cx: 500, cy: 760, r: 16, fill: COL.board, stroke: ANAT.bone, 'stroke-width': 4 }, lv);
    show(lv, m('g4', .5));
    arrowTo(p, [700, 680], [700, 745], m('g4', 1), { col: COL.whole, w: 5 });
    arrowTo(p, [1080, 680], [1080, 745], m('g4', 1.8), { col: COL.bad, w: 5 });
    txt(p, 'ближе — меньше момент', 700, 668, m('g4', 1), { size: 21, fill: COL.whole, anchor: 'middle' });
    txt(p, 'дальше — больше', 1080, 668, m('g4', 1.8), { size: 21, fill: COL.bad, anchor: 'middle' });
  }],

  ['gen2', 'Ещё предосторожности', (m) => {
    const p = panel(0);
    warnRow(p, 120, 160, 'после долгой иммобилизации — не энергично: связки и сухожилия теряют прочность', m('g5'), { maxW: 1300 });
    warnRow(p, 120, 300, 'дозу увеличивать постепенно', m('g6'), { maxW: 1300 });
    warnRow(p, 120, 580, 'не растягивать отёчные ткани', m('g7'), { maxW: 1300 });
    warnRow(p, 120, 690, 'не перерастягивать слабые мышцы, особенно держащие тело против силы тяжести', m('g8'), { maxW: 1300 });
    // a 24-hour line: mild tenderness is fine; pain longer than a day means too much force
    const X0 = 220, X1 = 1360, Y = 440;
    const tl = G(p, { o: 0 });
    path(tl, `M${X0} ${Y}H${X1}`, { stroke: COL.dim, 'stroke-width': 4 });
    [0, 12, 24, 36, 48].forEach(h => { const x = X0 + (X1 - X0) * h / 48; path(tl, `M${x} ${Y - 10}V${Y + 10}`, { stroke: COL.dim, 'stroke-width': 3 }); T(tl, `${h} ч`, { x, y: Y + 40, size: 20, fill: COL.dim, anchor: 'middle' }); });
    mk('rect', { x: X0, y: Y - 40, width: (X1 - X0) / 2, height: 24, rx: 8, fill: COL.good, 'fill-opacity': .6 }, tl);
    mk('rect', { x: X0 + (X1 - X0) / 2, y: Y - 40, width: (X1 - X0) / 2, height: 24, rx: 8, fill: COL.bad, 'fill-opacity': .6 }, tl);
    T(tl, 'лёгкая проходящая чувствительность — норма', { x: X0 + (X1 - X0) / 4, y: Y - 56, size: 21, fill: COL.good, anchor: 'middle', weight: 700 });
    T(tl, 'боль дольше суток — сила была слишком большой', { x: X0 + 3 * (X1 - X0) / 4, y: Y - 56, size: 21, fill: COL.bad, anchor: 'middle', weight: 700 });
    show(tl, m('g6', .8));
  }],

  ['mass', 'Массовые программы', (m) => {
    const p = panel(0);
    txt(p, 'ошибки массовых программ гибкости', 800, 90, .2, { size: 28, weight: 700, fill: COL.chalk, anchor: 'middle' });
    [['неизбирательность: растягивают подвижное, а укороченное — нет', 'm1'], ['нет разминки', 'm2'], ['плохая стабилизация', 'm3'], ['баллистика', 'm4'],
     ['«без боли нет результата»', 'm5'], ['«барьерная» растяжка нагружает внутренние связки согнутого колена', 'm6'], ['не учитывают возраст: пожилые, подростки после скачка роста', 'm7']].forEach(([str, mark], i) =>
      warnRow(p, i < 4 ? 80 : 830, 190 + (i % 4) * 150, str, m(mark), { size: 23, maxW: 600 }));
    // the slumped sitter: what tends to shorten
    const s = .7, GY = 800, f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...SIT, t: -6, hd: 24, aN: 34, eN: 80, aF: 34, eF: 80 } });
    plant(f, 'AN', 1300, GY);
    const [hx, hy] = onStage(f, 'H'), ch = path(p, `M${hx - 40} ${hy + 18}H${hx + 26}M${hx - 34} ${hy + 18}V${GY}M${hx + 20} ${hy + 18}V${GY}M${hx - 40} ${hy + 18}V${hy - 60}`, { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 });
    show(f.g, m('m1', 2)); show(ch, m('m1', 2));
    put(para(p, 'сутулое сидение: укорачиваются сгибатели бедра и туловища, разгибатели и внутренние ротаторы плеча', 1180, 730, null, { size: 19, maxW: 380, fill: COL.int, anchor: 'end' }), { o: 0 });
    show(p.lastChild, m('m1', 2.5));
  }],

  ['strat', 'Что делать', (m) => {
    const p = panel(0);
    infoCard(p, 100, 160, 660, 380, 'проверять программы', 'упражнения готовых программ и видео; убирать или менять неподходящие; баланс между мышцами-антагонистами', COL.whole, m('s1'), { size: 25 });
    infoCard(p, 840, 160, 660, 380, 'учить пациента', 'разминка, самостабилизация, правильная интенсивность: боль после занятия лёгкая и проходит за сутки', COL.good, m('s2'), { size: 25 });
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-safe', prompt: ['Безопасно или опасно?'],
    build: grid([
      { parts: ['Растягиваться по принципу «без боли нет результата»'], ans: ['x'], why: 'Опасно: только в пределах переносимости.' },
      { parts: ['Разминка на велотренажёре перед растяжкой'], ans: ['o'], why: 'Безопасно: тёплые ткани растягиваются легче.' },
      { parts: ['«Барьерная» растяжка при больном колене'], ans: ['x'], why: 'Опасно: нагрузка на внутренние связки колена.' },
      { parts: ['Подросток после скачка роста растягивается как взрослый гимнаст'], ans: ['x'], why: 'Опасно: двусуставные мышцы временно укорочены.' },
      { parts: ['Офисный работник растягивает укороченные сгибатели бедра'], ans: ['o'], why: 'Безопасно и избирательно.' },
    ], [['o', 'Безопасно', COL.good], ['x', 'Опасно', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['relax', 'Расслабление', (m) => {
    const p = panel(0);
    infoCard(p, 80, 110, 700, 160, 'обучение расслаблению', 'тихое место, мягкий голос, глубокое дыхание или спокойный образ', COL.whole, m('rel'), { size: 23 });
    infoCard(p, 80, 290, 700, 120, 'аутогенная тренировка', 'самовнушение и медитация', COL.real, m('aut'), { size: 23 });
    infoCard(p, 80, 430, 700, 170, 'прогрессивная релаксация', 'от кистей и стоп к туловищу: напрячь 5–7 с, расслабить 20–30 с, почувствовать тяжесть и тепло', COL.good, m('prog'), { size: 23 });
    infoCard(p, 80, 620, 700, 110, 'метод Фельденкрайза — осознание движения', null, COL.task, m('feld'), { size: 22 });
    infoCard(p, 820, 620, 700, 160, 'пилатес', 'дыхание, стабилизация корпуса, контроль позы, сила, гибкость', COL.int, m('pil'), { size: 23 });
    // progressive relaxation: a hand clenches, then lets go
    const h = handSide(p, 1180, 300, 1.2);
    show(h.g, m('prog'));
    prog(q => { const v = q < .2 ? q / .2 : q < .3 ? 1 : 1 - (q - .3) / .7; const c = clamp(v, 0, 1); h.set({ mcp: 10 + 70 * c, pip: 15 + 85 * c, dip: 8 + 50 * c }); }, m('prog', .5), 5, lin);
    txt(p, 'напрячь — расслабить', 1140, 470, m('prog', .5), { size: 23, weight: 700, fill: COL.good, anchor: 'middle' });
  }],

  ['heat', 'Тепло', (m) => {
    const p = panel(0);
    flame(p, 220, 260, 1.4);
    infoCard(p, 380, 120, 1120, 170, 'тепло', 'мышца теплее — ткани растяжимее; нужна меньшая сила и меньше времени', HEAT, m('heat'), { size: 24 });
    infoCard(p, 120, 330, 680, 240, 'как разогреть', 'поверхностно: горячие пакеты, парафин; глубоко: ультразвук, коротковолновая диатермия; большие мышцы — лёгкая разминка', HEAT, m('how'), { size: 23 });
    infoCard(p, 840, 330, 680, 240, 'без растяжки — почти ничего', 'тепло само по себе гибкость почти не увеличивает; вместе с растяжкой данные смешанные', COL.int, m('alone'), { size: 23 });
    const s = .62, GY = 850, f = fig(p, { x: 460, y: GY - 182 * s, s, o: 0 });
    ground(p, 300, 640, GY, m('how', 1));
    show(f.g, m('how', 1));
    walk(f, m('how', 1.2), 4, { cycles: 3 });
  }],

  ['cold', 'Холод', (m) => {
    const p = panel(0);
    snow(p, 220, 260, 1.4);
    infoCard(p, 380, 120, 1120, 170, 'холод', 'сразу после травмы — меньше боли и спазма; но заживающие ткани от холода менее растяжимы и легче травмируются', COLD, m('cold'), { size: 23 });
    // the authors' timeline: cold first 24–48 h; later warm before or during the stretch; cold after it
    const X0 = 140, X1 = 1460, Y = 520, tl = G(p, { o: 0 });
    path(tl, `M${X0} ${Y}H${X1}`, { stroke: COL.dim, 'stroke-width': 4 });
    mk('rect', { x: X0, y: Y - 34, width: 300, height: 30, rx: 8, fill: COLD, 'fill-opacity': .7 }, tl);
    T(tl, 'первые 24–48 ч: холод', { x: X0 + 150, y: Y + 40, size: 22, weight: 700, fill: COLD, anchor: 'middle' });
    show(tl, m('rec'));
    const w = G(p, { o: 0 });
    mk('rect', { x: 620, y: Y - 34, width: 380, height: 30, rx: 8, fill: HEAT, 'fill-opacity': .7 }, w);
    T(w, 'растяжка: тепло до или во время', { x: 810, y: Y + 40, size: 22, weight: 700, fill: HEAT, anchor: 'middle' });
    show(w, m('rec', 2.5));
    const a = G(p, { o: 0 });
    mk('rect', { x: 1020, y: Y - 34, width: 400, height: 30, rx: 8, fill: COLD, 'fill-opacity': .7 }, a);
    T(a, 'после: холод в удлинённом положении', { x: 1220, y: Y + 40, size: 22, weight: 700, fill: COLD, anchor: 'middle' });
    show(a, m('after'));
    pill(p, 'растяжка противопоказана при остром воспалении', 290, 640, m('rec', 1), { col: COL.bad, size: 21 });
  }],

  ['other', 'Другие средства', (m) => {
    const p = panel(0);
    infoCard(p, 80, 110, 700, 200, 'массаж', 'расслабляет мышцы, усиливает кровоток, снимает спазм', COL.nat, m('mas'), { size: 23 });
    infoCard(p, 820, 110, 700, 200, 'мобилизация мягких тканей', 'миофасциальный и поперечный фрикционный массаж, инструменты: ползучесть и релаксация', COL.int, m('stm'), { size: 23 });
    infoCard(p, 80, 340, 700, 200, 'обратная связь', 'прибор показывает напряжение мышцы — пациент учится его ощущать и снижать', COL.whole, m('bio'), { size: 23 });
    infoCard(p, 820, 340, 700, 200, 'тракция и маятник', 'лёгкая тракция, маятниковые движения, можно с грузом 0,5–1 кг (в книге — 1–2 фунта): меньше боли и спазма', COL.good, m('tr'), { size: 23 });
    // a pendulum: the arm hangs and swings
    const s = .9, GY = 860, f = fig(p, { x: 1100, y: GY - 182 * s, s, o: 0, pose: { ...STAND, t: 60, hN: 60, hF: 60, kN: 10, kF: 10, aN: 60, eN: 4, aF: 20, eF: 30 } });
    plant(f, 'AN', 1100, GY);
    show(f.g, m('tr'));
    prog(q => f.set({ aN: 60 + 18 * Math.sin(2 * Math.PI * 3 * q) }), m('tr', .5), 5, lin);
    ground(p, 960, 1260, GY, m('tr'));
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-hc', prompt: ['Тепло или холод?'],
    build: grid([
      { parts: ['Первые 24–48 часов после травмы'], ans: ['c'], why: 'Холод: меньше отёка, спазма и боли.' },
      { parts: ['Перед растяжкой'], ans: ['h'], why: 'Тепло: ткани растяжимее.' },
      { parts: ['После растяжки, в удлинённом положении'], ans: ['c'], why: 'Холод: меньше боли после и стойче прирост.' },
      { parts: ['Ультразвук перед растяжкой'], ans: ['h'], why: 'Глубокое тепло.' },
      { parts: ['Лёгкая ходьба перед растяжкой'], ans: ['h'], why: 'Разминка разогревает.' },
    ], [['h', 'Тепло', HEAT], ['c', 'Холод', COLD]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Не выходить за нормальный объём; беречь кости при остеопорозе, свежие переломы, отёчные ткани и слабые мышцы.', 'w1'],
     ['Боль дольше суток — сила была слишком большой.', 'w2'],
     ['Массовые программы проверять: баланс, разминка, стабилизация, без баллистики и «без боли нет результата».', 'w3'],
     ['Тепло — до или во время растяжки, холод — после, в удлинённом положении.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 220 + i * 140, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 31, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-sore', prompt: ['Пациент растягивается по видео. Мышцы болят уже двое суток после занятия. Что это значит?'],
    build: choice([
      ['Сила была слишком большой: уменьшить интенсивность и увеличивать дозу постепенно'],
      ['Так и должно быть: «без боли нет результата»'],
      ['Нужно растягиваться чаще и сильнее'],
      ['Боль значит, что ткани уже удлинились навсегда'],
    ], 0, 'Боль дольше суток — признак воспаления от слишком большой силы; это может дать новый рубец.',
    [null, 'Этот принцип — частая ошибка массовых программ.', 'Это усилит повреждение.', 'Нет: боль — признак повреждения, а не прироста.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-tf', prompt: ['Верно или неверно?'],
    build: grid([
      { parts: ['Отёчные ткани растягивают энергичнее.'], ans: ['f'], why: 'Неверно: их не растягивают.' },
      { parts: ['У малоподвижных людей часто укорочены сгибатели бедра.'], ans: ['t'], why: 'Верно.' },
      { parts: ['«Барьерная» растяжка безопасна для колена.'], ans: ['f'], why: 'Неверно: нагружает внутренние связки согнутого колена.' },
      { parts: ['Тепло без растяжки почти не увеличивает гибкость.'], ans: ['t'], why: 'Верно.' },
      { parts: ['После растяжки холод кладут на ткани в удлинённом положении.'], ans: ['t'], why: 'Верно.' },
    ], TF, { multi: false, text: true }),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
