const CHAPTER = { number: 45, title: 'Показания, ограничения, противопоказания', minutes: 8, language: 'ru', next: '../ch046/' };

  "системные болезни соединительной ткани\nнапример, РА: сильные приёмы рвут ткань": "сильные приёмы рвут ткань",
  "пожилые\nслабая ткань, плохое кровообращение: мягко": "слабая ткань: мягко",

// cards-short end

const wave = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
// Signals travelling along a nerve: a quadratic curve A–C–B drawn at t0, with n dots running along it in turn.
function nerve(p, A, C, B, col, t0, { dur = 1.2, n = 4, w = 4 } = {}) {
  const e = path(p, `M${A[0]} ${A[1]}Q${C[0]} ${C[1]} ${B[0]} ${B[1]}`, { stroke: col, 'stroke-width': w }, { d: 0 });
  draw(e, t0, .6);
  const dot = mk('circle', { r: 8, fill: col }, p);
  put(dot, { o: 0 });
  for (let i = 0; i < n; i++) prog(q => { const u = q, x = (1 - u) ** 2 * A[0] + 2 * u * (1 - u) * C[0] + u * u * B[0], y = (1 - u) ** 2 * A[1] + 2 * u * (1 - u) * C[1] + u * u * B[1]; put(dot, { x, y, o: q < 1 ? 1 : 0 }); }, t0 + .6 + i * dur, dur, lin);
  return e;
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Показания и противопоказания', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 5 · Урок 45', { x: 800, y: 230, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'Показания, ограничения', { x: 800, y: 315, size: 56, weight: 600, anchor: 'middle' });
    T(g, 'и противопоказания', { x: 800, y: 380, size: 46, weight: 600, anchor: 'middle', fill: COL.dim });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'когда мягко, когда растягивать и когда нельзя', 800, 460, m('sub'), { size: 30, fill: COL.task, anchor: 'middle', weight: 600 });
    const art = G(scene, { o: 0 });
    [['мягко', COL.good, 520], ['растягивать', ANAT.taut, 800], ['нельзя', COL.bad, 1080]].forEach(([str, col, x], i) => pill(art, str, x, 640, i * .4, { col, size: 30 }));
    show(art, m('sub', .2));
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);
  }],

  ['pain', 'Боль и защитное напряжение', (m) => {
    const p = panel(0);
    infoCard(p, 80, 90, 680, 120, 'мягкая мобилизация', 'боль и защитное напряжение мышц', COL.good, m('two'), { size: 23 });
    infoCard(p, 840, 90, 680, 120, 'растягивающие приёмы', 'ограничение движения → функциональная подвижность', ANAT.taut, m('two', 2), { size: 23 });
    // neurophysiological effect: mechanoreceptor input inhibits the pain signal in the cord
    const j = jointGlide(p, { x: 200, y: 560, s: .6, shaft: 150, t0: m('pain') });
    prog(q => j.set({ n: 3 * Math.sin(2 * Math.PI * 8 * q) + 3 }), m('neuro'), 6, lin);
    txt(p, 'колебания малой амплитуды', 200, 820, m('neuro'), { size: 21, fill: COL.whole, anchor: 'middle' });
    const cord = G(p, { o: 0 });
    roundBox(cord, 520, 400, 200, 300, COL.dim, PANEL, 2.5);
    T(cord, 'спинной мозг', { x: 620, y: 440, size: 21, fill: COL.dim, anchor: 'middle' });
    T(cord, 'ствол мозга', { x: 620, y: 466, size: 21, fill: COL.dim, anchor: 'middle' });
    show(cord, m('pain'));
    const S1 = j.stage([j.R + 14, -20]), S2 = j.stage([j.R + 14, 30]);
    nerve(p, S1, [400, 470], [560, 530], COL.whole, m('neuro', .5), { n: 4 });
    nerve(p, S2, [400, 650], [560, 620], COL.bad, m('pain', .5), { n: 3 });
    txt(p, 'механорецепторы', 400, 455, m('neuro', .5), { size: 20, fill: COL.whole, anchor: 'middle' });
    txt(p, 'боль', 400, 690, m('pain', .5), { size: 20, fill: COL.bad, anchor: 'middle' });
    const outP = path(p, 'M640 600Q700 400 640 290', { stroke: COL.bad, 'stroke-width': 5 }, { d: 0 });
    draw(outP, m('pain', 1.5), .6);
    txt(p, 'в мозг', 640, 275, m('pain', 1.5), { size: 21, fill: COL.bad, anchor: 'middle' });
    // inhibition: a blocking bar on the pain line
    const blk = path(p, 'M575 532L610 590M595 600L630 580', { stroke: COL.whole, 'stroke-width': 6 }, { o: 0 });
    show(blk, m('neuro', 3));
    tw(outP, { o: .2 }, m('neuro', 3.5), .8);
    txt(p, 'боль ↓', 700, 360, m('neuro', 3.8), { size: 26, weight: 700, fill: COL.good });
    // mechanical effect: the fluid moves and feeds the cartilage
    const k = jointGlide(p, { x: 1180, y: 560, s: .8, shaft: 150, t0: m('mech') });
    fluidIn(k);
    prog(q => k.set({ d: 6 * Math.sin(2 * Math.PI * 4 * q), n: 3 * Math.sin(2 * Math.PI * 4 * q + 1) }), m('mech', .5), 6, lin);
    txt(p, 'жидкость → питание хряща', 1180, 300, m('mech'), { size: 23, weight: 700, fill: FLUID, anchor: 'middle' });
    txt(p, 'против застоя', 1180, 335, m('mech', 1), { size: 21, fill: COL.dim, anchor: 'middle' });
    pill(p, 'реактивные ткани не растягивают', 1180, 860, m('no'), { col: COL.bad, size: 22 });
  }],

  ['hypo', 'Другие показания', (m) => {
    const p = panel(0);
    const cell = (x0, y0, title, body, col, t0) => {
      const g = G(p, { o: 0 });
      roundBox(g, x0, y0, 720, 370, col, PANEL, 2.5);
      T(g, title, { x: x0 + 24, y: y0 + 44, size: 25, weight: 700, fill: col });
      put(para(g, body, x0 + 340, y0 + 100, null, { size: 22, maxW: 355 }), { o: 1 });
      show(g, t0);

    cell(60, 90, 'обратимая гипомобильность', 'всё более интенсивные приёмы суставной игры: устойчивая или колебательная сила растягивает капсулу и связки', ANAT.taut, m('rev'));
    const A = jointGlide(p, { x: 230, y: 310, s: .45, shaft: 110, t0: m('rev') });
    prog(q => A.set({ d: 13 * io(q) }), m('rev', 1), 1.2, lin);
    prog(q => A.set({ d: 13 - 3 * wave(q, 4) }), m('rev', 2.5), 3, lin);
    cell(820, 90, 'позиционное нарушение', 'кость стоит неправильно → боль, ограничение; MWM выравнивает при движении, явный подвывих вправляют толчком', COL.nat, m('fault'));
    const B = jointGlide(p, { x: 990, y: 310, s: .45, shaft: 110, t0: m('fault') });

    prog(q => B.set({ a: 18 * Math.sin(2 * Math.PI * q), d: -10 * (1 - io(q)), raw: true }), m('fix', .5), 3, lin);
    cell(60, 480, 'прогрессирующее ограничение', 'суставная игра сохраняет объём; доза — по реакции пациента и состоянию болезни', COL.whole, m('prog'));
    const bars = G(p, { o: 0 });
    [['сейчас', 260], ['без лечения', 150], ['с лечением', 240]].forEach(([str, w], i) => {

      T(bars, str, { x: 90, y: 612 + i * 70, size: 19, fill: COL.dim });
    });
    show(bars, m('prog', .5));
    pill(p, 'схема', 250, 822, m('prog', .5), { col: COL.dim, size: 18 });
    cell(820, 480, 'функциональная иммобильность', 'нерастягивающие скольжения и тракция сохраняют суставную игру', COL.good, m('imm'));
    const C = jointGlide(p, { x: 990, y: 700, s: .45, shaft: 110, t0: m('imm') });
    prog(q => C.set({ d: 5 * Math.sin(2 * Math.PI * 4 * q) }), m('imm', .5), 4, lin);
  }],

  ['lim', 'Доказательства и ограничения', (m) => {
    const p = panel(0);
    infoCard(p, 70, 100, 700, 330, 'доказательства', 'мануальная терапия помогает при боли в пояснице, импинджменте плеча, артрозе колена, боли в шее; рандомизированных исследований по периферическим суставам мало', COL.whole, m('ev'), { size: 23 });
    infoCard(p, 830, 100, 700, 330, 'не меняет течение болезни', 'ревматоидный артрит, воспаление после травмы: задача — уменьшить боль, сохранить суставную игру, ослабить механические ограничения', COL.dim, m('dis'), { size: 23 });
    // the dose gauge: from gentle to too strong
    const cx = 560, cy = 800, R = 220, f = v => v.toFixed(1);
    const g = G(p, { o: 0 });
    [[COL.good, 180, 240], [COL.int, 240, 300], [COL.bad, 300, 360]].forEach(([col, a0, a1]) => path(g, `M${f(cx + R * Math.cos(rad(a0)))} ${f(cy + R * Math.sin(rad(a0)))}A${R} ${R} 0 0 1 ${f(cx + R * Math.cos(rad(a1)))} ${f(cy + R * Math.sin(rad(a1)))}`, { stroke: col, 'stroke-width': 26 }));
    T(g, 'мягко', { x: cx - R - 10, y: cy + 40, size: 21, fill: COL.good, anchor: 'middle' });
    T(g, 'слишком сильно', { x: cx + R + 10, y: cy + 40, size: 21, fill: COL.bad, anchor: 'middle' });
    const nd = G(g, { x: cx, y: cy, r: -170 });
    path(nd, `M0 0L${R - 30} 0`, { stroke: COL.chalk, 'stroke-width': 6 });
    mk('circle', { r: 12, fill: COL.chalk }, g);
    show(g, m('skill'));
    prog(q => put(nd, { r: lerp(-170, -15, io(q)) }), m('skill', 3), 2, lin);
    infoCard(p, 900, 480, 630, 330, 'результат зависит от мастерства', 'приёмы относительно безопасны по правилам; без обследования или со слишком большой силой — травма сустава или гипермобильность', COL.bad, m('skill'), { size: 23 });
  }],

    id: 'c-ind', prompt: ['Что подходит?'],
    build: grid([
      { parts: ['Острая боль и защитное напряжение мышц'], ans: ['g'], why: 'Мягкие колебания и тракция: тормозят боль, без растяжки.' },
      { parts: ['Капсула укорочена после иммобилизации, боли мало'], ans: ['s'], why: 'Обратимая гипомобильность — растягивающие приёмы.' },
      { parts: ['Сустав временно нельзя двигать'], ans: ['g'], why: 'Нерастягивающие скольжения сохраняют суставную игру.' },
      { parts: ['Явный подвывих головки лучевой кости'], ans: ['t'], why: 'Явный подвывих вправляют толчком.' },
      { parts: ['Неправильное скольжение поверхностей при движении'], ans: ['m'], why: 'MWM выравнивает кости, пока человек двигается.' },
    ], [['g', 'Мягкие', COL.good], ['s', 'Растягивающие', ANAT.taut], ['m', 'MWM', COL.nat], ['t', 'Толчок', COL.task]], { multi: false, text: true }),
  }], done) }],

  ['contra', 'Противопоказания', (m) => {
    const p = panel(0);
    txt(p, 'истинные противопоказания к растягивающей мобилизации', 800, 95, m('only'), { size: 26, weight: 700, fill: COL.chalk, anchor: 'middle' });
    ['гипермобильность', 'выпот', 'воспаление'].forEach((str, i) => labelBox(p, 300 + i * 500, 165, 420, [str], COL.bad, m('only', 1 + i * .6), { size: 28 }));
    const j = jointGlide(p, { x: 330, y: 500, s: .75, shaft: 150, t0: m('hyp') });
    prog(q => j.set({ d: 22 * Math.sin(2 * Math.PI * 2 * q) }), m('hyp', .5), 4, lin);
    txt(p, 'слишком большая игра', 330, 760, m('hyp', .5), { size: 21, fill: COL.dim, anchor: 'middle' });
    infoCard(p, 590, 270, 400, 170, 'некроз связок или капсулы', 'растягивающие приёмы нельзя', COL.bad, m('hyp'), { size: 22 });
    infoCard(p, 590, 470, 400, 200, 'болезненный гипермобильный', 'мягкая суставная игра в пределах движения, без растяжки', COL.good, m('hyp', 6), { size: 22 });
    // inflammation: a flame
    const fl = G(p, { x: 1260, y: 420, o: 0 });
    mk('path', { d: 'M0 70C-60 40 -50 -20 -10 -70C0 -30 30 -40 20 -90C70 -40 70 40 0 70Z', fill: COL.bad, 'fill-opacity': .75, stroke: COL.bad, 'stroke-width': 3 }, fl);
    mk('path', { d: 'M0 60C-25 40 -20 10 0 -20C10 10 30 20 0 60Z', fill: COL.int }, fl);
    show(fl, m('infl'));
    pulse(fl, m('infl', .5), 1.1);
    infoCard(p, 1060, 540, 470, 260, 'воспаление', 'растяжка → больше боли, защитного напряжения и повреждения; мягкие колебания или тракция временно уменьшают боль', COL.bad, m('infl'), { size: 22 });
  }],

  ['eff', 'Выпот', (m) => {
    const p = panel(0);
    const sw = G(p, { x: 400, y: 450, s: .7, o: 0 });
    mk('ellipse', { rx: 175, ry: 140, fill: FLUID, 'fill-opacity': .22, stroke: FLUID, 'stroke-width': 3 }, sw);
    const j = jointGlide(p, { x: 400, y: 450, s: 1, shaft: 150, t0: .2 });
    fluidIn(j);
    show(sw, m('eff'));
    prog(q => { put(sw, { s: lerp(.7, 1.12, io(q)) }); j.set({ n: 9 * io(q) }); }, m('eff', .3), 2.5, lin);
    txt(p, 'выпот: капсула уже растянута жидкостью', 400, 100, m('eff'), { size: 24, weight: 700, fill: FLUID, anchor: 'middle' });
    infoCard(p, 820, 90, 340, 240, 'быстро', 'обычно кровь: травма, гемофилия → врач, пункция', COL.bad, m('fast'), { size: 22 });
    infoCard(p, 1190, 90, 340, 240, 'медленно, > 4 ч', 'серозный выпот или отёк: лёгкая травма, раздражение, артрит', COL.int, m('slow'), { size: 22 });
    infoCard(p, 820, 360, 710, 180, 'отёчный сустав не растягивают', 'ограничивают жидкость и мышечная реакция на боль, а не укороченные волокна', COL.bad, m('nost'), { size: 22 });
    prog(q => j.set({ n: 9 + 1.5 * Math.sin(2 * Math.PI * 6 * q) }), m('gent', .5), 4, lin);
    infoCard(p, 820, 570, 710, 150, 'мягкие колебания без натяжения капсулы', 'блокируют боль, улучшают ток жидкости', COL.good, m('gent'), { size: 22 });
    infoCard(p, 820, 745, 710, 120, 'боль ↑ после мягких → слишком интенсивно или не показано', null, COL.task, m('worse'), { size: 22 });
  }],

  ['prec', 'Особая осторожность', (m) => {
    const p = panel(0);
    txt(p, 'с особой осторожностью — если признаки и реакция благоприятны', 800, 95, m('prec'), { size: 25, weight: 700, fill: COL.int, anchor: 'middle' });
    txt(p, 'обычно безопаснее угловой растяжки: не сжимает сустав', 800, 140, m('prec', 2), { size: 22, fill: COL.dim, anchor: 'middle' });
    const items = [
      ['злокачественная опухоль', null, 'p1'], ['болезнь кости на рентгенограмме', null, 'p1'], ['несросшийся перелом', 'решают место и фиксация', 'p1'],
      ['сильная боль', 'сначала найти причину', 'p2'], ['гипермобильность соседних суставов', 'стабилизировать их', 'p2'], ['эндопротез', 'механизм сам ограничивает движение', 'p2'],
      ['новая или ослабленная ткань', 'травма, операция, иммобилизация, кортикостероиды: мягко', 'p3'], ['системные болезни соединительной ткани', 'например, РА: сильные приёмы рвут ткань', 'p3'], ['пожилые', 'слабая ткань, плохое кровообращение: мягко', 'p3'],
    ];
    items.forEach(([t, b, mk0], i) => {
      const r = Math.floor(i / 3), c = i % 3;
      infoCard(p, 70 + c * 490, 185 + r * 225, 460, 200, t, b, COL.int, m(mk0, (i % 3) * 1.4), { size: 21 });
    });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-contra', prompt: ['Противопоказание к растягивающей мобилизации или особая осторожность?'],
    build: grid([
      { parts: ['Выпот в суставе'], ans: ['c'], why: 'Одно из трёх истинных противопоказаний.' },
      { parts: ['Эндопротез'], ans: ['p'], why: 'Особая осторожность: механизм сам ограничивает движение.' },
      { parts: ['Воспаление'], ans: ['c'], why: 'Истинное противопоказание.' },
      { parts: ['Несросшийся перелом'], ans: ['p'], why: 'Осторожность: решают место и фиксация.' },
      { parts: ['Гипермобильность с возможным некрозом связок'], ans: ['c'], why: 'Истинное противопоказание.' },
    ], [['c', 'Противопоказание', COL.bad], ['p', 'Осторожность', COL.int]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Мягкие приёмы — при боли и защитном напряжении: тормозят боль и гонят синовиальную жидкость.', 'w1'],
     ['Растягивающие — при обратимой гипомобильности; MWM и толчок — при позиционных нарушениях.', 'w2'],
     ['Истинные противопоказания к растяжке — гипермобильность, выпот и воспаление.', 'w3'],
     ['Опухоль, перелом, эндопротез, новая ткань, системные болезни — с особой осторожностью.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 220 + i * 140, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 31, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-blood', prompt: ['Через полчаса после травмы колено быстро и сильно отекло. Что делать?'],
    build: choice([
      ['Направить к врачу: быстрый отёк — вероятно, кровь в суставе'],
      ['Растянуть капсулу, пока не сформировалась контрактура'],
      ['Провести толчок, чтобы вернуть объём'],
      ['Подождать четыре часа и растягивать'],
    ], 0, 'Быстрый отёк обычно означает кровь в полости сустава: нужна помощь врача.',
    [null, 'Отёчный сустав не растягивают.', 'Толчок при выпоте не показан.', 'Выпот — противопоказание к растяжке.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-tf', prompt: ['Верно или неверно?'],
    build: grid([
      { parts: ['Истинных противопоказаний к растягивающей мобилизации три.'], ans: ['t'], why: 'Верно: гипермобильность, выпот, воспаление.' },
      { parts: ['Отёчный сустав растягивают, чтобы выгнать жидкость.'], ans: ['f'], why: 'Неверно: капсула и так растянута.' },
      { parts: ['Мобилизация меняет течение ревматоидного артрита.'], ans: ['f'], why: 'Неверно: не меняет течение болезни.' },
      { parts: ['При эндопротезе нужна особая осторожность.'], ans: ['t'], why: 'Верно.' },
      { parts: ['Медленный отёк — дольше четырёх часов.'], ans: ['t'], why: 'Верно: обычно серозный выпот или отёк.' },
    ], TF, { multi: false, text: true }),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
