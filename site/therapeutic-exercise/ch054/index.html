// A standing figure holding a box in both hands.
const BOX_LO = { aN: 30, eN: 110, aF: 30, eF: 110 }, BOX_HI = { aN: 170, eN: 8, aF: 170, eF: 8 };
function boxFig(p, x, gy, s, t0, pose = BOX_LO, w = 64) {
  const f = fig(p, { x, y: gy - 182 * s, s, o: 0, pose });
  const bx = carry(p, f, c => boxProp(c, w, w * .72), { turn: false, along: 14 });
  put(bx, { o: 0 });
  if (t0 !== null) { show(f.g, t0); show(bx, t0); }
  return { f, bx };
}
// A small figure jumping n times on the spot.
function jumper(p, x, gy, s, t0, dur, n = 2) {
  const f = fig(p, { x, y: gy - 182 * s, s, o: 0 });
  plant(f, 'AN', x, gy); show(f.g, t0);
  const CR = { ...STAND, t: 30, hN: 75, kN: 90, fN: 30, hF: 75, kF: 90, fF: 30, aN: -40, aF: -40, eN: 10, eF: 10 };
  const UP = { ...STAND, aN: 165, aF: 165, eN: 5, eF: 5, fN: -25, fF: -25 };
  prog(q => {
    const u = (q * n) % 1;
    let pose = STAND, lift = 0;
    if (u < .3) pose = blendPose(STAND, CR, io(u / .3));
    else if (u < .42) pose = blendPose(CR, UP, io((u - .3) / .12));
    else if (u < .8) { pose = UP; lift = 70 * Math.sin(Math.PI * (u - .42) / .38); }
    else pose = blendPose(UP, STAND, io((u - .8) / .2));
    f.set(pose); plant(f, 'AN', x, gy - lift * s);
  }, t0 + .3, dur, lin);
  return f;
}
// A small figure stepping up and down n times (from lesson 2).
function stepper(p, x, gy, s, t0, dur, n) {
  const f = stepUp(p, x, gy, s, t0, { dur: .5 });
  put(f.g, { o: 0 }); show(f.g, t0);
  const [ax] = onStage(f, 'AF');
  prog(q => { const e = (1 + Math.cos(2 * Math.PI * n * q)) / 2; f.set(blendPose(STAND, STEP, e)); plant(f, 'AF', ax, gy); }, t0 + 1.1, dur, lin);
  return f;
}

  ['over', 'Принцип перегрузки', (m) => {
    const p = panel(0), x0 = 130, y0 = 720, W = 860, H = 520, N = 300;
    txt(p, 'принцип перегрузки (overload principle)', 560, 92, m('over'), { size: 30, weight: 700, fill: COL.chalk, anchor: 'middle' });
    chartAxes(p, x0, y0, W, H, 'уровень', 'время →', .3);
    // the load (step line) and the capacity of the muscle that slowly follows it
    const load = t => t < .5 ? .45 : .45 + .1 * Math.min(3, Math.floor((t - .5) / .13) + 1);
    const cap = [.25];
    for (let i = 1; i <= N; i++) { const t = i / N, c = cap[i - 1], L = load(t); cap.push(L > c ? c + (L - c) * 11 / N : c); }
    const X = t => x0 + t * W, Y = v => y0 - v * H, f = v => v.toFixed(1);
    const gap = mk('path', { fill: COL.task, 'fill-opacity': .25, stroke: 'none' }, p);
    const lP = path(p, '', { stroke: COL.whole, 'stroke-width': 5 }), cP = path(p, '', { stroke: COL.good, 'stroke-width': 5 });
    const upto = tt => {
      const n = Math.max(1, Math.round(tt * N));
      let dl = '', dc = '', top = '', bot = '';
      for (let i = 0; i <= n; i++) {
        const t = i / N, pl = `${f(X(t))} ${f(Y(load(t)))}`, pc = `${f(X(t))} ${f(Y(cap[i]))}`;
        dl += (i ? 'L' : 'M') + pl; dc += (i ? 'L' : 'M') + pc; top += (i ? 'L' : 'M') + pl; bot = 'L' + pc + bot;
      }
      lP.setAttribute('d', dl); cP.setAttribute('d', dc); gap.setAttribute('d', top + bot + 'Z');
    };
    prog(q => upto(.5 * q), m('over', 1), Math.max(2, m('flat', 2) - m('over', 1)), lin);
    prog(q => upto(.5 + .5 * q), m('prog', .3), 4.5, lin);
    txt(p, 'нагрузка', X(.02), Y(.45) - 16, m('over', 1), { size: 23, fill: COL.whole, weight: 700 });
    txt(p, 'возможности мышцы', X(.02), Y(.25) + 36, m('over', 1), { size: 23, fill: COL.good, weight: 700 });
    pill(p, 'перегрузка', X(.13), Y(.37), m('over', 3), { col: COL.task, size: 21 });
    pill(p, 'уровень сохраняется', X(.44), Y(.45) + 44, m('flat', .5), { col: COL.good, size: 21 });

    infoCard(p, 1060, 120, 480, 220, 'нагрузка выше привычной', 'груз превышает обменные возможности мышцы — ей приходится работать на новом уровне', COL.task, m('over'), { size: 22 });
    infoCard(p, 1060, 360, 480, 120, 'мышца приспосабливается', 'возможности растут', COL.good, m('ad'), { size: 22 });
    infoCard(p, 1060, 500, 480, 160, 'требования не меняются', 'уровень сохраняется, но больше не растёт', COL.dim, m('flat'), { size: 22 });
    infoCard(p, 1060, 680, 480, 120, 'нагрузку повышают', 'постепенно, шаг за шагом', COL.whole, m('prog'), { size: 22 });
  }],
