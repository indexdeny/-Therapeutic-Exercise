// A strip of motor unit potentials: n bursts from x0 to x0 + w around baseline y, amplitudes amp(i). Returns the path.
function emgStrip(p, x0, y, w, n, amp, col = ANAT.taut) {
  let d = `M${x0} ${y}`, seed = 7;
  const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
  for (let i = 0; i < n; i++) {
    const a = x0 + i * w / n, b = a + w / n * .6;
    for (let x = a; x < b; x += 4) { const env = Math.sin(Math.PI * (x - a) / (b - a)); d += `L${x.toFixed(1)} ${(y + (rnd() * 2 - 1) * amp(i) * env).toFixed(1)}`; }
    d += `L${(a + w / n).toFixed(1)} ${y}`;
  }
  return path(p, d, { stroke: col, 'stroke-width': 2 }, { d: 0 });
}

    // multiple sclerosis: strength over a day (scheme)
    const x0 = 120, y0 = 800, W = 620, H = 300;
    chartAxes(p, x0, y0, W, H, 'сила', '', m('ms'));
    txt(p, 'день →', x0 + W, y0 + 62, m('ms'), { size: 20, fill: COL.dim, anchor: 'end' });
    const day = t => .8 - .45 * Math.exp(-(((t - .55) / .17) ** 2));
    draw(path(p, fnPath(x0, y0, W, H, day, .02, .3), { stroke: COL.good, 'stroke-width': 5 }, { d: 0 }), m('ms', .5), 1);
    draw(path(p, fnPath(x0, y0, W, H, day, .3, .7), { stroke: COL.bad, 'stroke-width': 5 }, { d: 0 }), m('pm', .2), 1.2);
    draw(path(p, fnPath(x0, y0, W, H, day, .7, .98), { stroke: COL.good, 'stroke-width': 5 }, { d: 0 }), m('eve', .2), 1);
    txt(p, 'рассеянный склероз', x0 + 80, y0 - H - 8, m('ms'), { size: 23, weight: 700, fill: COL.chalk });
    txt(p, 'утро', x0 + .1 * W, y0 + 30, m('ms', .5), { size: 20, fill: COL.good, anchor: 'middle' });
    txt(p, 'середина дня', x0 + .55 * W, y0 + 30, m('pm'), { size: 20, fill: COL.bad, anchor: 'middle' });
    txt(p, 'вечер', x0 + .9 * W, y0 + 30, m('eve'), { size: 20, fill: COL.good, anchor: 'middle' });
    pill(p, 'схема', x0 + W - 50, y0 - H - 20, m('ms'), { col: COL.dim, size: 19 });
    infoCard(p, 840, 480, 700, 200, 'доставка кислорода нарушена', 'болезни сердца, периферических сосудов, лёгких; химиотерапия, облучение → устают быстрее, восстанавливаются дольше', COL.bad, m('o2'), { size: 22 });
    ['температура', 'качество воздуха', 'высота'].forEach((s, i) => pill(p, s, 960 + i * 220, 740, m('env', .3 + i * .4), { col: COL.dim, size: 24 }));
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-ms', prompt: ['У пациента рассеянный склероз. Когда лучше планировать упражнения с сопротивлением?'],
    build: choice([['Утром'], ['В середине дня'], ['В любое время — разницы нет'], ['Сразу после долгой прогулки']], 0,
      'Утром пациент обычно отдохнувший и действует лучше всего.',
      [null, 'К середине дня он обычно достигает порога утомления и заметно слабеет.', 'Утомление при рассеянном склерозе меняется в течение дня.', 'Мышцы и организм уже утомлены.']),
  }], done) }],

  ['recov', 'Восстановление', (m) => {
    const p = panel(0), x0 = 140, y0 = 560, W = 680, H = 380;
    txt(p, 'восстановление после нагрузки', 800, 80, m('recov'), { size: 30, weight: 700, fill: COL.chalk, anchor: 'middle' });
    // force in % of the pre-exercise level over 5 minutes of rest
    const pas = t => (95 - 35 * Math.exp(-t * 5)) / 100, act = t => (95 - 35 * Math.exp(-t * 7.2)) / 100;
    const toY = v => (v - .5) / .5;
    const g = G(p, { o: 0 });
    path(g, `M${x0} ${y0 - H - 10}V${y0}H${x0 + W + 10}`, { stroke: COL.dim, 'stroke-width': 3 });
    [50, 75, 100].forEach(v => T(g, v + '%', { x: x0 - 12, y: y0 - toY(v / 100) * H + 7, size: 19, fill: COL.dim, anchor: 'end' }));
    [0, 1, 2, 3, 4, 5].forEach(v => T(g, String(v), { x: x0 + v / 5 * W, y: y0 + 30, size: 19, fill: COL.dim, anchor: 'middle' }));
    T(g, 'мин отдыха', { x: x0 + W, y: y0 + 60, size: 20, fill: COL.dim, anchor: 'end' });
    mk('rect', { x: x0, y: y0 - toY(.95) * H, width: W, height: (toY(.95) - toY(.9)) * H, fill: COL.good, 'fill-opacity': .18 }, g);
    T(g, '90–95%', { x: x0 + W - 6, y: y0 - toY(.95) * H - 10, size: 20, fill: COL.good, anchor: 'end', weight: 700 });
    show(g, m('min'));
    draw(path(p, fnPath(x0, y0, W, H, t => toY(pas(t))), { stroke: COL.whole, 'stroke-width': 5 }, { d: 0 }), m('min', .5), 2);
    const b = G(p, { o: 0 });
    path(b, `M${x0 + .6 * W} ${y0 - H}V${y0}M${x0 + .8 * W} ${y0 - H}V${y0}`, { stroke: COL.task, 'stroke-width': 2, 'stroke-dasharray': '6 6' });
    T(b, '3–4 мин', { x: x0 + .7 * W, y: y0 - H - 8, size: 21, fill: COL.task, anchor: 'middle', weight: 700 });
    mk('rect', { x: x0, y: y0 - H, width: W * .2, height: H, fill: COL.whole, 'fill-opacity': .1 }, b);
    T(b, '1-я минута', { x: x0 + .1 * W, y: y0 - 16, size: 19, fill: COL.whole, anchor: 'middle' });
    show(b, m('min', 2.5));
    draw(path(p, fnPath(x0, y0, W, H, t => toY(act(t))), { stroke: COL.good, 'stroke-width': 5, 'stroke-dasharray': '12 8' }, { d: 0 }), m('act', .5), 1.6);
    txt(p, 'пассивный отдых', x0 + .3 * W, y0 - toY(.8) * H + 34, m('min', 1.5), { size: 21, fill: COL.whole, weight: 600 });
    txt(p, 'активный — быстрее', x0 + .07 * W, y0 - toY(.93) * H - 8, m('act', 1.5), { size: 21, fill: COL.good, weight: 600 });
    pill(p, 'схема', x0 + 70, y0 - H - 30, m('min'), { col: COL.dim, size: 19 });
    // what restores how fast
    const tl = G(p, { o: 0 });
    path(tl, 'M140 720H820', { stroke: COL.dim, 'stroke-width': 3 });
    show(tl, m('fast'));
    [['кислород, энергия', 'минуты', 200, 'fast'], ['молочная кислота', '≈ 1 час', 470, 'lac'], ['гликоген', 'несколько дней', 740, 'gly']].forEach(([s, t, x, k]) => {
      const g2 = G(p, { o: 0 });
      mk('circle', { cx: x, cy: 720, r: 11, fill: COL.task }, g2);
      T(g2, s, { x, y: 690, size: 21, fill: COL.chalk, anchor: 'middle', weight: 600 });
      T(g2, t, { x, y: 762, size: 21, fill: COL.task, anchor: 'middle' });
      show(g2, m(k));
    });
    infoCard(p, 900, 140, 640, 140, 'в каждой программе', 'между подходами и между занятиями', COL.whole, m('recov', 1), { size: 23 });
    infoCard(p, 900, 300, 640, 160, 'активное восстановление', 'лёгкие упражнения в отдыхе — быстрее, чем покой', COL.good, m('act'), { size: 23 });
    infoCard(p, 900, 480, 640, 200, 'без восстановления нет роста', 'отдых слишком короткий → плато или ухудшение, слабость от перетренированности', COL.int, m('tip'), { size: 23 });
    infoCard(p, 900, 700, 640, 140, 'утомлённая мышца', 'легче получает острое растяжение', COL.bad, m('strain'), { size: 23 });
  }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Мышечное утомление — нормальное временное снижение силы; тип I устаёт меньше всего, IIB — больше всего.', 'w1'],
     ['Дрожание, замедление, неполный объём, обходные движения → меньше нагрузка или другая группа мышц.', 'w2'],
     ['Порог утомления — время удержания или число повторений; при многих болезнях он нерегулярен.', 'w3'],
     ['До 90–95% — за 3–4 мин; активный отдых быстрее; без восстановления нет прогресса.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 220 + i * 140, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 31, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-signs', prompt: ['Признак утомления или нет?'],
    build: grid([
      { parts: ['Работающая мышца дрожит'], ans: ['y'], why: 'Дрожание — признак утомления.' },
      { parts: ['Каждое следующее повторение медленнее, хотя пациент не хочет замедляться'], ans: ['y'], why: 'Невольное замедление — признак.' },
      { parts: ['С тем же грузом движение уже не доходит до конца объёма'], ans: ['y'], why: 'Неполный объём — признак.' },
      { parts: ['Пациент отклоняет корпус назад, чтобы поднять груз'], ans: ['y'], why: 'Обходное движение — признак.' },
      { parts: ['Движение плавное, темп и объём прежние'], ans: ['n'], why: 'Признаков утомления нет.' },
    ], [['y', 'Признак', COL.bad], ['n', 'Нет', COL.good]], { multi: false, text: true }),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-tired', prompt: ['На восьмом повторении разгибания колена с манжетой четырёхглавая дрожит, а пациент отклоняется назад, чтобы закончить движение. Что делать?'],
    build: choice([
      ['Уменьшить груз или прекратить и перейти к другой группе мышц'],
      ['Довести подход до конца любой ценой'],
      ['Добавить груз, раз мышца так работает'],
      ['Не обращать внимания, если нет боли'],
    ], 0, 'Это признаки утомления: снизить нагрузку или дать мышце отдохнуть, работая другой группой.',
    [null, 'Утомлённая мышца легче травмируется, а обходные движения закрепляют неправильный рисунок.', 'Признаки утомления — повод уменьшить нагрузку, а не увеличить.', 'Дрожание и обходные движения — признаки утомления и без боли.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
