const T1 = '#c2564a', T2 = '#f6d2c6', CT = '#8a958f';
// Strength over the life span relative to the peak at 30 (a scheme from the book's rates); ACTIVE: an active old age.
const LIFE = a => a <= 10 ? .06 + .024 * a : a <= 18 ? .3 + (a - 10) * .07 : a <= 30 ? .86 + (a - 18) * .14 / 12
  : a <= 60 ? 1 - .008 * (a - 30) : a <= 80 ? .76 * (1 - .0175 * (a - 60)) : .494 * (1 - .03 * (a - 80));
const ACTIVE = a => .76 * (1 - .003 * (a - 60));
// The chart: axes with ages 0–90; seg(a0, a1, t0, dur) draws the curve between two ages (dur 0: at once).
function lifeChart(p, t0, { x0 = 110, y0 = 620, W = 880, H = 430 } = {}) {
  const g = G(p, { o: 0 }), X = a => x0 + a / 90 * W, Y = v => y0 - v * H;
  path(g, `M${x0} ${y0 - H - 20}V${y0}H${x0 + W + 20}`, { stroke: COL.dim, 'stroke-width': 3 });
  for (let a = 0; a <= 90; a += 10) { path(g, `M${X(a)} ${y0}V${y0 + 8}`, { stroke: COL.dim, 'stroke-width': 2 }); T(g, String(a), { x: X(a), y: y0 + 32, size: 19, fill: COL.dim, anchor: 'middle' }); }
  T(g, 'сила', { x: x0 + 12, y: y0 - H - 4, size: 21, fill: COL.dim });
  T(g, 'возраст, лет', { x: x0 + W + 10, y: y0 + 62, size: 20, fill: COL.dim, anchor: 'end' });
  show(g, t0);
  pill(p, 'схема', x0 + W - 30, y0 - H - 10, t0, { col: COL.dim, size: 19 });
  const curve = (fn, a0, a1, col, t, dur, dash) => {
    let d = '';
    for (let i = 0; i <= 60; i++) { const a = lerp(a0, a1, i / 60); d += `${i ? 'L' : 'M'}${X(a).toFixed(1)} ${Y(fn(a)).toFixed(1)}`; }
    const e = path(p, d, { stroke: col, 'stroke-width': 5, 'stroke-dasharray': dash || 'none' }, dash ? { o: 0 } : { d: 0 });
    if (dash) show(e, t, Math.max(.2, dur)); else draw(e, t, Math.max(.05, dur));
    return e;
  };
  return { X, Y, seg: (a0, a1, t, dur = 1.5, col = ANAT.muscle) => curve(LIFE, a0, a1, col, t, dur), curve };
}
// A small figure standing on the line under the chart at an age.
function ageFig(p, ch, a, s, t0, pose = {}, y = 875) {
  const f = fig(p, { x: ch.X(a), y: y - 182 * s, s, o: 0, pose });
  plant(f, 'AN', ch.X(a), y);
  show(f.g, t0);
  return f;
}
// A muscle cross-section: fibres of type I and II and connective tissue between them.
function ageSection(p, cx, cy, r, old, t0) {
  const g = G(p, { o: 0 });
  mk('circle', { cx, cy, r, fill: old ? mix(CT, COL.board, .3) : mix(ANAT.muscle, COL.board, .6), stroke: ANAT.muscle, 'stroke-width': 3 }, g);
  let k = 0;
  const step = 31;
  for (let y = -r; y <= r; y += step * .87) for (let x = -r; x <= r; x += step) {
    const xx = x + ((Math.round((y + r) / (step * .87)) % 2) ? step / 2 : 0), i = k++;
    if (Math.hypot(xx, y) > r - 16) continue;
    if (old && (i * 7) % 10 < 3) continue;   // fewer fibres
    const t2 = i % 2 === 0, fr = t2 ? (old ? 8 : 14) : (old ? 11 : 12);
    mk('circle', { cx: cx + xx, cy: cy + y, r: fr, fill: t2 ? T2 : T1, stroke: mix(ANAT.muscle, '#000000', .35), 'stroke-width': 1.2 }, g);
  }
  show(g, t0);
  return g;
}

    txt(p, 'причина или следствие — трудно сказать', 520, 760, m('why', 1.5), { size: 22, fill: COL.dim, anchor: 'middle', italic: true });
  }],

  ['power', 'Скорость и мощность', (m) => {
    const p = panel(0), x0 = 110, y0 = 440, W = 560, H = 270;
    txt(p, 'скорость, мощность, выносливость', 800, 80, m('power'), { size: 30, weight: 700, fill: COL.chalk, anchor: 'middle' });
    chartAxes(p, x0, y0, W, H, 'усилие', 'время →', m('slow'));
    const yng = t => t < .55 ? .9 * (1 - Math.exp(-t / .05)) : .9 * Math.exp(-(t - .55) / .04), eld = t => t < .55 ? .9 * (1 - Math.exp(-t / .16)) : .9 * (1 - Math.exp(-.55 / .16)) * Math.exp(-(t - .55) / .13);
    draw(path(p, fnPath(x0, y0, W, H, yng), { stroke: COL.whole, 'stroke-width': 5 }, { d: 0 }), m('slow', .4), 1.2);
    draw(path(p, fnPath(x0, y0, W, H, eld), { stroke: COL.task, 'stroke-width': 5 }, { d: 0 }), m('slow', 1.4), 1.6);
    txt(p, 'молодой', x0 + .12 * W, y0 - .93 * H, m('slow', .8), { size: 21, fill: COL.whole, weight: 600 });
    txt(p, 'пожилой: дольше нарастает и расслабляется', x0 + .2 * W, y0 - .5 * H, m('slow', 2.5), { size: 21, fill: COL.task, weight: 600 });
    pill(p, 'схема', x0 + W - 30, y0 - H - 10, m('slow'), { col: COL.dim, size: 19 });
    // rising from a low chair needs power
    const GY = 830, s = .7, f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...SIT, t: 30, hN: 115, kN: 110, hF: 115, kF: 110, fN: 20, fF: 20, aN: 40, aF: 40 } });
    plant(f, 'AN', 380, GY);
    const hip = onStage(f, 'H');
    chair(p, hip[0], hip[1] + 7, GY, m('pw'));
    p.appendChild(f.g);
    show(f.g, m('pw'));
    poseTo(f, { ...STAND, t: 6, aN: 20, aF: 20 }, m('pw', 1.5), 2.6, io, ['AN', 380, GY]);
    ground(p, 150, 620, GY, m('pw'));
    txt(p, 'встать с низкого стула', 380, 520, m('pw', .5), { size: 23, fill: COL.task, anchor: 'middle', weight: 600 });
    infoCard(p, 740, 130, 800, 140, 'медленнее', 'сокращение, восстановление после утомления; дольше развить усилие и расслабиться', COL.task, m('power', 1), { size: 22 });
    infoCard(p, 740, 285, 800, 120, 'падает мощность', 'встать с низкого стула, поймать равновесие', COL.task, m('pw'), { size: 22 });
    infoCard(p, 740, 420, 800, 120, 'мощность ↔ функция', 'связь с ограничениями и инвалидностью сильнее, чем у силы', COL.bad, m('key'), { size: 22 });
    infoCard(p, 740, 555, 800, 160, 'выносливость', 'меньше капилляров и митохондрий, ферменты, транспорт глюкозы → быстрее устаёт; у активных — почти до 80 лет мало', COL.real, m('end'), { size: 21 });
    infoCard(p, 740, 730, 800, 125, 'тренировка помогает и в старости', 'сила, мощность, выносливость · глава 24', COL.good, m('can'), { size: 22 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-power', prompt: ['Что у пожилых сильнее связано с ограничениями функции и инвалидностью?'],
    build: choice([['Снижение мышечной мощности'], ['Снижение наибольшей силы'], ['Снижение роста'], ['Число волокон первого типа']], 0,
      'Мощность — сила и скорость вместе — нужна, чтобы быстро встать или поймать равновесие.',
      [null, 'Сила тоже снижается, но с ограничениями функции сильнее связана мощность.', 'Об этом в книге речи нет.', 'Связь с функцией в книге описана для мощности.']),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Детство: сила растёт линейно; силовая программа — малые грузы, отдых, присмотр.', 'w1'],
     ['Подростки: резкий рост, особенно у юношей; пик силы — к 20–30 годам.', 'w2'],
     ['Потом −8% за десятилетие, после 60 — −15–20%, после 80 — −30%; у активных — меньше.', 'w3'],
     ['У пожилых особенно падает мощность — она сильнее всего связана с функцией.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 220 + i * 140, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 31, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-decline', prompt: ['Посчитайте (сила в процентах от пика).'],
    build: blanks([
      { parts: ['От пика 100% за десятилетие −8%: ', { box: '92' }, ' %'], why: '100 − 8 = 92.' },
      { parts: ['Было 80%, за десятилетие после 60 лет −20% от этого: ', { box: '64' }, ' %'], why: '80 × 0,8 = 64.' },
      { parts: ['Активный пожилой: −0,3% в год × 10 лет = −', { box: '3' }, ' %'], why: '0,3 × 10 = 3.' },
    ]),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-elder', prompt: ['Женщина 78 лет: сила ног снижена, ей трудно быстро встать с низкого дивана, недавно чуть не упала. Что верно?'],
    build: choice([
      ['Силовая тренировка в её возрасте может значительно улучшить силу, мощность и выносливость'],
      ['В 78 лет упражнения с сопротивлением бесполезны'],
      ['Важна только наибольшая сила, скорость движения не имеет значения'],
      ['Потеря силы с возрастом не связана с падениями'],
    ], 0, 'Значительный прирост возможен и в пожилом возрасте; особенно важна мощность — быстро встать, поймать равновесие.',
    [null, 'Книга: в пожилом возрасте возможен значительный прирост.', 'Мощность сильнее связана с ограничениями функции.', 'Слабость ног и туловища связана с более частыми падениями.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
