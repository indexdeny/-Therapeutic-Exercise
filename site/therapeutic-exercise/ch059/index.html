const STR = COL.nat, END = COL.real, T1 = '#c2564a', T2A = '#e8907c', T2B = '#f6d2c6', CAP = '#ff5a3c';
// A fibre circle with a label inside (fibre types).
function fibreTok(p, x, y, r, col, label, t0) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r, fill: col, stroke: mix(col, '#000000', .4), 'stroke-width': 3 }, g);
  T(g, label, { y: 10, size: 28, weight: 700, fill: COL.board, anchor: 'middle' });
  show(g, t0);
  return g;
}
// A small cross-section: fibres of radius fr in rings, capillaries (k per fibre) around them.
function capSection(p, cx, cy, fr, k, t0) {
  const g = G(p, { o: 0 }), pts = [[0, 0]];
  for (let i = 0; i < 6; i++) pts.push([Math.cos(rad(i * 60)) * fr * 2.25, Math.sin(rad(i * 60)) * fr * 2.25]);
  for (let i = 0; i < 12; i++) pts.push([Math.cos(rad(i * 30 + 15)) * fr * 4.3, Math.sin(rad(i * 30 + 15)) * fr * 4.3]);
  mk('circle', { cx, cy, r: fr * 5.6, fill: mix(ANAT.muscle, COL.board, .7), stroke: ANAT.muscle, 'stroke-width': 3 }, g);
  pts.forEach(([x, y], i) => {
    mk('circle', { cx: cx + x, cy: cy + y, r: fr, fill: ANAT.muscle, stroke: mix(ANAT.muscle, '#000000', .35), 'stroke-width': 1.2 }, g);
    for (let j = 0; j < k; j++) { const a = rad(j * 360 / k + i * 23); mk('circle', { cx: cx + x + Math.cos(a) * (fr + 3), cy: cy + y + Math.sin(a) * (fr + 3), r: 3, fill: CAP }, g); }
  });
  show(g, t0);
  return g;
}

    cross(p, 550, 215, 18, m('ii1', .7));
    txt(p, 'II → I при тренировке — почти не бывает', 550, 150, m('ii1', 1), { size: 22, fill: COL.bad, anchor: 'middle', weight: 700 });
    infoCard(p, 200, 650, 1200, 150, 'в реабилитации и фитнесе', 'IIB → IIA — обычно; II → I — почти нет', COL.whole, m('ii1', 2), { size: 23 });
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-adapt', prompt: ['Верно или нет?'],
    build: grid([
      { parts: ['Первые 4–8 недель сила растёт в основном за счёт гипертрофии'], ans: ['f'], why: 'В основном за счёт нервной системы.' },
      { parts: ['Быстрее всего гипертрофируются волокна IIB'], ans: ['t'], why: 'Да.' },
      { parts: ['Гиперплазия — главная причина роста мышцы'], ans: ['f'], why: 'Если и есть, она незначительна.' },
      { parts: ['При тренировке волокна II типа часто превращаются в I'], ans: ['f'], why: 'Почти не бывает.' },
      { parts: ['IIB переходят в IIA и становятся устойчивее к утомлению'], ans: ['t'], why: 'Да: при тренировке выносливости и в начале тяжёлой силовой.' },
    ], TF, { multi: false, text: true }),
  }], done) }],

  ['vasc', 'Сосуды и обмен', (m) => {
    const p = panel(0);
    txt(p, 'силовая и на выносливость: сравним', 800, 82, m('vasc'), { size: 30, weight: 700, fill: COL.chalk, anchor: 'middle' });
    capSection(p, 260, 330, 26, 1, m('cap'));
    txt(p, 'силовая: волокна толще, капилляров меньше', 260, 520, m('cap', .3), { size: 21, fill: STR, anchor: 'middle', weight: 600 });
    capSection(p, 260, 700, 18, 4, m('cap', 3));
    txt(p, 'на выносливость: капилляров больше', 260, 860, m('cap', 3.3), { size: 21, fill: END, anchor: 'middle', weight: 600 });
    pill(p, 'схема', 470, 160, m('cap'), { col: COL.dim, size: 19 });
    const X = [1060, 1360];
    [['силовая', STR], ['на выносливость', END]].forEach(([s, c], i) => pill(p, s, X[i], 160, m('vasc', .5 + i * .4), { col: c, size: 25 }));
    const rows = [['капилляры', '↓ или =', '↑', 'cap'], ['митохондрии', '↓', '↑', 'mito'], ['АТФ, КФ, миоглобин, ферменты', '↑', '↑', 'met'], ['триглицериды', '?', '↑', 'met'], ['безжировая масса', '↑', '=', 'body'], ['% жира', '↓', '↓', 'body']];
    rows.forEach(([lab, a, b, k], i) => {
      const y = 245 + i * 95, g = G(p, { o: 0 });
      mk('rect', { x: 560, y: y - 38, width: 980, height: 76, rx: 12, fill: i % 2 ? 'none' : PANEL }, g);
      put(para(g, lab, 580, y + 2, null, { size: 23, weight: 600, maxW: 320 }), { o: 1 });
      [a, b].forEach((v, j) => T(g, v, { x: X[j], y: y + 10, size: 30, weight: 700, fill: v === '↑' ? COL.good : v === '↓' ? COL.bad : COL.dim, anchor: 'middle' }));
      show(g, m(k, i === 3 ? 2 : i === 5 ? 1.5 : .3));
    });
  }],

  ['conn', 'Соединительная ткань и кость', (m) => {
    const p = panel(0);
    txt(p, 'сухожилия, связки, кость', 800, 82, m('conn'), { size: 30, weight: 700, fill: COL.chalk, anchor: 'middle' });
    // a joint: two bones, a ligament across it, a muscle whose tendon inserts on the lower bone
    const g = G(p, { o: 0 });
    const b1 = boneEl(g, 22), b2 = boneEl(g, 22);
    b1.set([120, 300], [400, 300]); b2.set([440, 300], [720, 300]);
    const lig = ligEl(g, { rest: 120, w: 7 }); lig.set([360, 320], [480, 320]);
    const mu = muscleEl(g, { rest: 300, w: 26, tendon: .25 }); mu.set([150, 250], [560, 284]);
    show(g, m('conn', .5));
    const spot = (x, y, t0) => { const s = G(p, { x, y, o: 0 }); mk('circle', { r: 22, fill: 'none', stroke: ANAT.taut, 'stroke-width': 5 }, s); show(s, t0); pulse(s, t0 + .5, 1.3); return s; };
    spot(475, 279, m('ten')); spot(480, 320, m('ten', 3));
    txt(p, 'мышечно-сухожильный переход', 470, 210, m('ten'), { size: 21, fill: ANAT.taut, anchor: 'middle', weight: 600 });
    txt(p, 'связка у кости', 480, 382, m('ten', 3), { size: 21, fill: ANAT.taut, anchor: 'middle', weight: 600 });
    infoCard(p, 80, 440, 680, 170, 'прочность на разрыв ↑', 'поддерживают окрепшую мышцу, реже травмируются; соединительная ткань в мышце утолщается', ANAT.tendon, m('ten', 1), { size: 22 });
    pill(p, 'эксцентрически — быстрее', 420, 650, m('ecc'), { col: COL.task, size: 24 });
    // bone: weight-bearing loads along the leg and the spine
    const GY = 820, f = fig(p, { x: 1000, y: GY - 182 * .9, s: .9, o: 0 });
    show(f.g, m('bone'));
    ground(p, 900, 1100, GY, m('bone'));
    const ext = muscleOn(f, ['H', 'Sh', 20, -14], ['Sh', 'H', 20, 12], { w: 9, after: 'torso' });
    prog(q => ext.act(.7 * q), m('spine'), .6, lin);
    const ld = G(p, { o: 0 });
    path(ld, `M1000 340V${GY - 20}M988 ${GY - 40}L1000 ${GY - 18}L1012 ${GY - 40}`, { stroke: COL.whole, 'stroke-width': 5, 'stroke-dasharray': '12 8' });
    show(ld, m('bone', 1));
    txt(p, 'с опорой', 1000, 860, m('bone', 1), { size: 21, fill: COL.whole, anchor: 'middle', weight: 600 });
    infoCard(p, 1150, 130, 390, 220, 'плотность кости', 'тесно связана с силой мышц и активностью всю жизнь', ANAT.bone, m('bone'), { size: 22 });
    infoCard(p, 1150, 370, 390, 290, 'данные противоречивы', 'нужны интенсивность и нагрузка на участок через опору; заметный прирост — 9–12 месяцев', COL.int, m('ev'), { size: 22 });
    infoCard(p, 1150, 680, 390, 180, 'разгибатели спины', 'сила связана с плотностью позвонков', COL.whole, m('spine'), { size: 22 });
    txt(p, 'разгибатели спины', 870, 420, m('spine'), { size: 21, fill: '#ff7a5c', anchor: 'end', weight: 600 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-bone', prompt: ['Что, по данным книги, нужно, чтобы упражнения повышали или сохраняли плотность кости?'],
    build: choice([
      ['Достаточная интенсивность, нагрузка на нужный участок через опору и месяцы занятий'],
      ['Лёгкие упражнения сидя, без опоры, несколько недель'],
      ['Только растяжка'],
      ['Покой, чтобы не перегружать кость'],
    ], 0, 'Плотность росла или сохранялась при достаточной интенсивности и нагрузке через опору; срок — до 9–12 месяцев.',
    [null, 'Без нагрузки через опору и при малой интенсивности плотность не росла; недель мало.', 'Растяжка не нагружает кость.', 'Кость приспосабливается к нагрузке, а не к покою.']),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Внимание, мотивация и обратная связь влияют на результат программы.', 'w1'],
     ['Первые 4–8 недель — нервная система, потом — гипертрофия.', 'w2'],
     ['Быстрее растут волокна IIB; IIB переходят в IIA; гиперплазия незначительна.', 'w3'],
     ['Силовая: капилляров и митохондрий меньше; сухожилия, связки и кость крепче.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 220 + i * 140, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 31, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-table', prompt: ['Какая тренировка даёт эту адаптацию?'],
    build: grid([
      { parts: ['Плотность капилляров растёт'], ans: ['e'], why: 'Тренировка выносливости.' },
      { parts: ['Гипертрофия волокон, больше всего IIB'], ans: ['s'], why: 'Силовая.' },
      { parts: ['Плотность митохондрий снижается'], ans: ['s'], why: 'Силовая высокой интенсивности.' },
      { parts: ['Безжировая масса не меняется, процент жира снижается'], ans: ['e'], why: 'Тренировка выносливости.' },
      { parts: ['Безжировая масса растёт'], ans: ['s'], why: 'Силовая.' },
    ], [['s', 'Силовая', STR], ['e', 'На выносливость', END]], { multi: false, text: true }),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-neural', prompt: ['Через три недели силовой программы пациент поднимает заметно больший груз, но объём мышцы не изменился. Чем это объяснить?'],
    build: choice([
      ['Нервными адаптациями: больше единиц, чаще и синхроннее импульсы'],
      ['Гиперплазией: стало больше волокон'],
      ['Переходом волокон II типа в I'],
      ['Ростом плотности капилляров'],
    ], 0, 'Ранний прирост силы — в основном нервный; гипертрофия обычно позже.',
    [null, 'Гиперплазия, если и есть, незначительна.', 'Такого перехода при тренировке почти не бывает — и он не дал бы силы.', 'Силовая тренировка скорее снижает плотность капилляров.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
