const LOW = COL.whole, HIGH = COL.nat, TFLC = '#e0b25a';
// A patient lying on the left side, seen from the front: a flatFig turned −90°, so the head is on the left and the near
// (top) leg abducts upward. The gluteus medius and the tensor fasciae latae (with the iliotibial band) on the top hip;
// cuff: a cuff weight above the ankle. abd(th) abducts the top leg. Local → stage: (x, y) → (cx + y·s, cy − x·s).
function sideLying(p, cx, cy, s, t0, { cuff = false } = {}) {
  const f = flatFig(p, cx, cy, s, t0);
  put(f.g, { r: -90 });
  bench(p, cx - 330 * s, cx + 420 * s, cy + 68 * s, t0, COL.dim, 110 * s);
  p.appendChild(f.g);
  const R = (v, th) => { const c = Math.cos(rad(th)), sn = Math.sin(rad(th)); return [v[0] * c + v[1] * sn, -v[0] * sn + v[1] * c]; };
  const H = [30, 0], add = (A, v) => [A[0] + v[0], A[1] + v[1]];
  const gm = muscleEl(f.top, { rest: 82, w: 17 });
  const tfl = muscleEl(f.top, { rest: 70, w: 11, col: mix(ANAT.muscle, '#d8b070', .3), tendon: .15 });
  const itb = mk('path', { fill: 'none', stroke: ANAT.tendon, 'stroke-width': 4, 'stroke-linecap': 'round', opacity: .9 }, f.top);
  const cw = cuff ? G(f.top) : null;
  if (cw) { mk('rect', { x: -14, y: -24, width: 28, height: 48, rx: 9, fill: '#5b6f86', stroke: '#2b3644', 'stroke-width': 2 }, cw); path(cw, 'M-14 -8H14M-14 8H14', { stroke: '#2b3644', 'stroke-width': 2 }); }
  const out = { f, gm, tfl, th: 3 };
  out.abd = th => {
    f.leg(th); out.th = th;
    gm.set([64, -64], add(H, R([30, 12], th)));
    const tb = add(H, R([24, 80], th)), kn = add(H, R([20, 168], th));
    tfl.set([46, -44], tb);
    itb.setAttribute('d', `M${tb[0].toFixed(1)} ${tb[1].toFixed(1)}L${kn[0].toFixed(1)} ${kn[1].toFixed(1)}`);
    if (cw) { const a = add(H, R([0, 300], th)); put(cw, { x: a[0], y: a[1], r: -th }); }
  };
  out.abd(3);
  out.stage = P => [cx + P[1] * s, cy - P[0] * s];
  out.ankle = () => out.stage(add(H, R([0, 300], out.th)));
  return out;
}

const BEATS = [

  ['align', 'Выравнивание', (m) => {

    infoCard(p, 960, 480, 580, 170, 'обходные движения', 'работу берёт сильный соседний агонист или мышца-стабилизатор', COL.bad, m('sub'), { size: 22 });
    infoCard(p, 960, 670, 580, 190, 'правильное выравнивание', 'направление волокон, линия тяги, действие мышцы: конечность движется так, как её двигает мышца', COL.good, m('line'), { size: 22 });

  ['grav', 'Выравнивание и сила тяжести', (m) => {
    const p = panel(0);

    prog(q => { sl.abd(3 + 32 * (1 - Math.cos(2 * Math.PI * 1.5 * q)) / 2); sl.gm.act(.95); }, m('side', .6), 4, lin);

    arrowTo(p, [A[0] + 40, A[1] - 150], [A[0] + 40, A[1] - 30], m('side', .5), { col: COL.whole, w: 6 });

    const sp = supine(p, 1180, 470, .95, m('sup'));
    bench(p, 1180 - 330 * .95, 1180 + 330 * .95, 470, m('sup'), COL.dim, 110);

    const p = panel(0), GY = 470;
    txt(p, 'стабилизация (stabilization)', 800, 82, m('stab'), { size: 30, weight: 700, fill: COL.chalk, anchor: 'middle' });
    txt(p, 'удержать сегмент или всё тело неподвижным; твёрдая опора, вес тела', 800, 122, m('stab', 1), { size: 23, fill: COL.dim, anchor: 'middle' });

    curls(c, m('int', .8), 3, 1.5);
    prog(q => { const s = 1 + .5 * io(q); [...c.db.children].forEach(e => put(e, { s })); }, m('ov', .5), 1.5, lin);
    infoCard(p, 620, 130, 920, 170, 'величина сопротивления в каждом повторении', 'нагрузка (load): сколько груза поднимают, опускают или удерживают', HIGH, m('int'), { size: 22 });
    infoCard(p, 620, 315, 920, 150, 'перегрузка', 'нагрузка выше привычной — постепенно увеличивать сопротивление', COL.task, m('ov'), { size: 22 });
    infoCard(p, 620, 480, 920, 190, 'субмаксимальная или максимальная?', 'цели программы · причина и тяжесть нарушений · стадия заживления · возраст · здоровье · тренированность', COL.whole, m('sub'), { size: 22 });
    infoCard(p, 620, 685, 920, 120, 'в реабилитации — обычно меньше, чем у здоровых', null, COL.good, m('reh'), { size: 22 });
  }],

  ['tab', 'Малая и высокая интенсивность', (m) => {
    const p = panel(0);
    txt(p, 'малая интенсивность', 410, 82, m('tab'), { size: 30, weight: 700, fill: LOW, anchor: 'middle' });
    txt(p, 'высокая интенсивность', 1200, 82, m('h'), { size: 30, weight: 700, fill: HIGH, anchor: 'middle' });
    const low = ['ранняя стадия заживления', 'после долгой иммобилизации: хрящ, кость', 'проверить реакцию после бездействия', 'обучение упражнению, форма', 'большинство детей и пожилых', 'цель — выносливость', 'разминка и заминка', 'медленная изокинетика — меньше сжатие'];
    low.forEach((s, i) => {
      const g = G(p, { o: 0 }), y = 140 + i * 70;
      mk('rect', { x: 50, y, width: 730, height: 58, rx: 14, fill: PANEL, stroke: LOW, 'stroke-width': 2 }, g);
      T(g, s, { x: 72, y: y + 38, size: 24, fill: COL.chalk });
      show(g, m('l' + (i + 1)));
    });
    const high = ['цель — сила, мощность, рост мышцы', 'поздняя реабилитация здоровых взрослых перед тяжёлой работой или спортом', 'программы для людей без патологии', 'тяжёлая атлетика, бодибилдинг'];
    high.forEach((s, i) => {
      const g = G(p, { o: 0 }), y = 140 + i * 105;
      mk('rect', { x: 820, y, width: 730, height: 90, rx: 14, fill: PANEL, stroke: HIGH, 'stroke-width': 2 }, g);
      put(para(g, s, 842, y + 38, null, { size: 24, maxW: 690 }), { o: 1 });
      show(g, m('h' + (i + 1)));
    });
    infoCard(p, 820, 580, 730, 270, 'внимание', 'боль при упражнении — интенсивность слишком велика; ближе к максимуму — выше риск для сердца и сосудов → ритмичное дыхание в каждом повторении', COL.bad, m('pain'), { size: 23 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-intensity', prompt: ['Малая или высокая интенсивность?'],
    build: grid([
      { parts: ['Третий день после растяжения связок, ткани надо защищать'], ans: ['l'], why: 'Ранняя стадия заживления — малая.' },
      { parts: ['Пациента учат новому упражнению'], ans: ['l'], why: 'Сначала форма — малая.' },
      { parts: ['Здоровый взрослый перед возвращением к тяжёлой работе, поздняя реабилитация'], ans: ['h'], why: 'Высокая.' },
      { parts: ['Цель — выносливость мышц'], ans: ['l'], why: 'Малая интенсивность, больше повторений.' },
      { parts: ['Цель — сила и мощность у здорового человека'], ans: ['h'], why: 'Высокая.' },
    ], [['l', 'Малая', LOW], ['h', 'Высокая', HIGH]], { multi: false, text: true }),
  }], done) }],

  ['rm', 'Повторный максимум', (m) => {
    const p = panel(0), GY = 780;
    txt(p, 'повторный максимум (repetition maximum, RM)', 800, 82, m('rm'), { size: 30, weight: 700, fill: COL.chalk, anchor: 'middle' });
    ground(p, 70, 330, GY, m('one', -.5)); ground(p, 360, 620, GY, m('ten', -.5));
    const a = curlFig(p, 200, GY, .95, 1.6, m('one', -.5)), b = curlFig(p, 490, GY, .95, 1.05, m('ten', -.5));
    curls(a, m('one', .3), 2.4, .5, { top: 120 });
    const ca = txt(p, '1ПМ: 1 раз', 200, 330, m('one', .3), { size: 26, weight: 700, fill: HIGH, anchor: 'middle' });
    const cb = txt(p, '', 490, 330, m('ten', .3), { size: 26, weight: 700, fill: LOW, anchor: 'middle' });
    prog(q => { const e = (1 - Math.cos(2 * Math.PI * 10 * q)) / 2; b.f.set({ aN: 6, eN: lerp(10, 120, e) }); b.mu.act(.6 + .4 * q); cb.textContent = '10ПМ: ' + Math.min(10, Math.floor(q * 10 + .5)) + ' раз'; }, m('ten', .3), 6, lin);
    txt(p, 'весь объём, с контролем, до утомления', 345, 850, m('def', 1), { size: 21, fill: COL.dim, anchor: 'middle' });
    infoCard(p, 680, 120, 860, 150, 'наибольший груз', 'который с контролем проходит весь доступный объём заданное число раз до утомления (Делорм)', COL.task, m('def'), { size: 22 });
    infoCard(p, 680, 285, 860, 120, 'зачем', 'начальный груз · исходная динамическая сила', COL.whole, m('use'), { size: 22 });
    infoCard(p, 680, 420, 860, 120, '1ПМ — надёжно и безопасно', 'здоровые молодые, спортсмены, активные пожилые', COL.good, m('safe'), { size: 22 });
    infoCard(p, 680, 555, 860, 165, 'небезопасно', 'поражения суставов; заживление или риск травмы мягких тканей; остеопороз или его риск; болезни сердца и сосудов', COL.bad, m('no'), { size: 22 });
    infoCard(p, 680, 735, 860, 120, 'расчёт 1ПМ', 'по формулам и таблицам — больше повторений с меньшим грузом', COL.whole, m('calc'), { size: 22 });
  }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Параметры программы (FITT и другие) подбирают под функциональные цели.', 'w1'],
     ['Выравнивание — как действует мышца и с учётом силы тяжести; стабилизация — внешняя или внутренняя.', 'w2'],
     ['Малая интенсивность — заживление, обучение, выносливость, дети и пожилые; высокая — сила и мощность у здоровых.', 'w3'],
     ['Повторный максимум задаёт начальный груз и исходную силу; 1ПМ — не для всех.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 220 + i * 140, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 31, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-1rm', prompt: ['Можно ли определять одноповторный максимум (1ПМ)?'],
    build: grid([
      { parts: ['Здоровый молодой спортсмен перед программой'], ans: ['y'], why: 'Надёжно и безопасно.' },
      { parts: ['Активная пожилая женщина без болезней'], ans: ['y'], why: 'У активных пожилых — тоже.' },
      { parts: ['Пациентка с остеопорозом'], ans: ['n'], why: 'Максимальное усилие небезопасно — рассчитать по таблицам.' },
      { parts: ['Две недели после растяжения связок голеностопа'], ans: ['n'], why: 'Мягкие ткани заживают.' },
      { parts: ['Пациент с ишемической болезнью сердца'], ans: ['n'], why: 'Сердечно-сосудистый риск.' },
    ], [['y', 'Можно', COL.good], ['n', 'Небезопасно', COL.bad]], { multi: false, text: true }),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-gmed', prompt: ['Пациентка лежит на боку и отводит ногу с манжетой, но бедро при этом уходит вперёд, в сгибание. Что происходит и что исправить?'],
    build: choice([
      ['Работу берёт напрягатель широкой фасции; держать бедро слегка разогнутым, таз чуть вперёд'],
      ['Всё правильно — так сильнее работает средняя ягодичная'],
      ['Нужно лечь на спину — так манжета лучше сопротивляется отведению'],
      ['Нужно убрать манжету и делать быстрее'],
    ], 0, 'При сгибании бедра главным двигателем становится TFL; правильное выравнивание возвращает работу средней ягодичной.',
    [null, 'При сгибании польза для средней ягодичной теряется.', 'На спине сила тяжести и манжета сопротивляются сгибанию, а не отведению.', 'Дело не в грузе и скорости, а в выравнивании.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
