// A strip of sets and rests: blocks [[kind, width, label]], kind 's' (a set: rep ticks) or 'r' (rest).
function setStrip(p, x, y, blocks, t0, { h = 50, n = 9 } = {}) {
  const g = G(p, { o: 0 });
  let cx = x;
  blocks.forEach(([k, w, lab]) => {
    if (k === 's') {
      mk('rect', { x: cx, y, width: w, height: h, rx: 10, fill: mix(STR, COL.board, .6), stroke: STR, 'stroke-width': 2 }, g);
      for (let i = 0; i < n; i++) path(g, `M${cx + (i + .5) * w / n} ${y + 10}V${y + h - 10}`, { stroke: STR, 'stroke-width': 4 });
    } else {
      mk('rect', { x: cx + 4, y: y + h / 2 - 3, width: w - 8, height: 6, rx: 3, fill: REST }, g);
    }
    if (lab) T(g, lab, { x: cx + w / 2, y: y + h + 28, size: 20, fill: k === 's' ? STR : REST, anchor: 'middle' });
    cx += w;
  });
  show(g, t0);
  return g;
}
// A week of seven day cells; marks[i]: 0 empty, a colour, or [colour, n] for n small sessions in a day.
function weekRow(p, x, y, marks, t0, label, col) {
  const g = G(p, { o: 0 });
  ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'].forEach((d, i) => {
    const cx = x + i * 58;
    mk('rect', { x: cx, y, width: 50, height: 50, rx: 9, fill: PANEL, stroke: EDGE, 'stroke-width': 2 }, g);
    T(g, d, { x: cx + 25, y: y + 72, size: 17, fill: COL.dim, anchor: 'middle' });
    const mkd = marks[i];
    if (Array.isArray(mkd)) for (let k = 0; k < mkd[1]; k++) mk('circle', { cx: cx + 12 + (k % 3) * 13, cy: y + 16 + Math.floor(k / 3) * 17, r: 5, fill: mkd[0] }, g);
    else if (mkd) mk('rect', { x: cx + 6, y: y + 6, width: 38, height: 38, rx: 7, fill: mkd }, g);
  });
  T(g, label, { x: x + 420, y: y + 33, size: 22, fill: col || COL.chalk, weight: 600 });
  show(g, t0);
  return g;
}

    const [ax] = onStage(sq, 'AN');
    prog(q => { const e = (1 - Math.cos(2 * Math.PI * 2 * q)) / 2; sq.set(blendPose(STAND, { ...SQUAT, aN: 90, aF: 90 }, e * .8)); plant(sq, 'AN', ax, GY); q4.act(.9); gl.act(.9); }, m('big', .5), 5, lin);
    txt(p, 'приседание: крупные мышцы, многосуставное', 380, 580, m('big', .3), { size: 22, fill: COL.good, anchor: 'middle', weight: 600 });
    arrowTo(p, [640, 360], [880, 360], m('big', 1.5), { col: COL.good, w: 6 });
    txt(p, 'раньше', 760, 335, m('big', 1.5), { size: 23, fill: COL.good, anchor: 'middle', weight: 700 });
    ground(p, 960, 1300, GY, m('big', 2));
    const c = curlFig(p, 1130, GY, .9, 1, m('big', 2));
    curls(c, m('big', 2.5), 4, 2.5);
    txt(p, 'сгибание локтя: мелкие, односуставное', 1130, 580, m('big', 2.3), { size: 22, fill: COL.dim, anchor: 'middle', weight: 600 });
    labelBox(p, 800, 660, 1100, ['крупные группы → мелкие'], COL.good, m('big'), { size: 28 });
    labelBox(p, 800, 740, 1100, ['многосуставные → односуставные'], COL.good, m('multi'), { size: 28 });
    labelBox(p, 800, 820, 1100, ['после разминки: интенсивнее → легче'], COL.task, m('int'), { size: 28 });
  }],

  ['freq', 'Частота', (m) => {

    weekRow(p, 80, 140, Array(7).fill([COL.whole, 4]), m('early'), 'после операции: несколько раз в день', COL.whole);
    weekRow(p, 80, 250, [STR, 0, STR, 0, STR, 0, 0], m('mid'), '2–3 раза, через день', STR);
    weekRow(p, 80, 360, [STR, END, STR, END, STR, 0, 0], m('mid', 3), 'до 5: руки / ноги — 48 ч', COL.chalk);
    weekRow(p, 80, 470, [0, COL.good, 0, 0, COL.good, 0, 0], m('keep'), 'поддержка — 2 раза', COL.good);
    weekRow(p, 80, 580, [COL.task, 0, COL.task, 0, COL.task, 0, 0], m('keep', 3), 'дети, очень пожилые — ≤ 2–3', COL.task);
    weekRow(p, 80, 690, [COL.bad, COL.bad, COL.bad, COL.bad, COL.bad, COL.bad, 0], m('ath'), 'атлеты — до 6 дней', COL.bad);
    infoCard(p, 960, 140, 580, 230, 'от чего зависит', 'интенсивность и объём, цели, здоровье, опыт, реакция; больше нагрузка → больше времени на восстановление', COL.whole, m('freq', 1), { size: 22 });
    infoCard(p, 960, 390, 580, 160, 'перетренированность', 'слишком часто, мало отдыха, накопленное утомление', COL.bad, m('over'), { size: 22 });
    infoCard(p, 960, 570, 580, 200, 'эксцентрические высокой интенсивности', 'больше микротравм и отсроченной боли → реже', COL.task, m('ecc'), { size: 22 });
  }],

  ['dur', 'Длительность', (m) => {
    const p = panel(0), x0 = 140, W = 1300, X = w => x0 + w / 16 * W;

    const g = G(p, { o: 0 });

    const band = (a, b, y, col, lab, t0) => { const bg = G(p, { o: 0 }); mk('rect', { x: X(a), y, width: X(b) - X(a), height: 60, rx: 14, fill: col, 'fill-opacity': .3, stroke: col, 'stroke-width': 3 }, bg); T(bg, lab, { x: (X(a) + X(b)) / 2, y: y + 39, size: 23, weight: 700, fill: col, anchor: 'middle' }); show(bg, t0); };

    band(6, 12, 400, STR, '≥ 6–12 нед.: гипертрофия, сосуды', m('musc'));
    infoCard(p, 140, 620, 620, 160, 'месяц-два', 'одним пациентам достаточно, чтобы вернуться к функции', COL.whole, m('dur', 1.5), { size: 23 });

  }],

  ['rest', 'Отдых', (m) => {

    setStrip(p, 120, 190, [['s', 200], ['r', 80, 'короче'], ['s', 200]], m('set', 2), { n: 12 });

    setStrip(p, 120, 320, [['s', 200], ['r', 220, '2–3 мин'], ['s', 200]], m('set', .5), { n: 9 });

    infoCard(p, 900, 170, 640, 160, 'пока группа отдыхает', 'другая группа той же конечности или та же группа другой', COL.whole, m('alt'), { size: 23 });
    infoCard(p, 900, 350, 640, 200, 'легко утомляются, дети, пожилые', '≥ 3 мин между подходами — активно: лёгкий велосипед, другая конечность', COL.good, m('frail'), { size: 23 });
    weekRow(p, 120, 640, [STR, 0, STR, 0, STR, 0, 0], m('sess'), '48 ч: через день', STR);
    txt(p, 'между занятиями при умеренной интенсивности', 120, 615, m('sess'), { size: 22, fill: COL.dim });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-dose', prompt: ['Верно или нет?'],
    build: grid([
      { parts: ['Крупные группы мышц тренируют раньше мелких'], ans: ['t'], why: 'Да.' },
      { parts: ['Односуставные упражнения делают раньше многосуставных'], ans: ['f'], why: 'Наоборот: многосуставные раньше.' },
      { parts: ['Эксцентрические упражнения высокой интенсивности делают чаще концентрических'], ans: ['f'], why: 'Реже: больше микротравм и отсроченной боли.' },
      { parts: ['При умеренной интенсивности отдых между подходами 2–3 минуты'], ans: ['t'], why: 'Да.' },
      { parts: ['Поддерживающая программа — обычно 2 раза в неделю'], ans: ['t'], why: 'Да.' },
    ], TF, { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Исходная нагрузка: ПМ, % массы тела, шкала Борга; зона — 40–70% от 1ПМ.', 'w1'],
     ['Больше груз — меньше повторений: 75% ≈ 10; подходов обычно 2–4.', 'w2'],
     ['Сила — 60–80%, 8–12 повторений; выносливость — много повторений малым грузом, рано.', 'w3'],
     ['Крупные и многосуставные — раньше; 2–3 раза в неделю; отдых 2–3 мин и 48 ч.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 220 + i * 140, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 31, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-load', prompt: ['Посчитайте.'],
    build: blanks([
      { parts: ['Масса тела 80 кг. Жим ногами — 50% массы тела: ', { box: '40' }, ' кг'], why: '80 × 0,5 = 40 кг.' },
      { parts: ['1ПМ = 20 кг. Зона 40–70%: от ', { box: '8' }, ' до ', { box: '14' }, ' кг'], why: '20 × 0,4 = 8; 20 × 0,7 = 14.' },
      { parts: ['Груз 75% от 1ПМ — примерно ', { box: '10' }, ' повторений'], why: 'У среднего нетренированного взрослого.' },
    ]),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-immob', prompt: ['Голень была шесть недель в гипсе. Какие мышцы обычно теряют массу быстрее и что начать рано?'],
    build: choice([
      ['Антигравитационные (много волокон I типа) — рано начать тренировку выносливости малым грузом'],
      ['Их антагонисты — сразу тяжёлые подходы до отказа'],
      ['Все одинаково — ждать полного заживления'],
      ['Только волокна II типа — начинать с прыжков'],
    ], 0, 'При иммобилизации волокна I типа атрофируются быстрее → антигравитационные мышцы теряют больше; выносливость малым грузом можно начинать очень рано.',
    [null, 'Быстрее теряют массу антигравитационные; тяжёлые подходы рано опасны для заживающих тканей.', 'Различия есть, а тренировку выносливости можно начинать рано без риска для тканей.', 'Быстрее атрофируются волокна I типа.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
