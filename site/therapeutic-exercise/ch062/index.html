const STA = COL.whole, CON = COL.nat, ECC = COL.task, ISO = COL.real;
// An elbow model with a dumbbell in the hand; set(a) bends the elbow and moves the dumbbell.
function armWithDb(p, x, y, s, k, t0) {
  const arm = elbowModel(p, { x, y, s });
  const db = G(p);
  dumbbell(db, k);
  arm.setA = a => { arm.set(a); const { E, W, hand } = arm.pts; put(db, { x: x + hand[0] * s, y: y + hand[1] * s, r: Math.atan2(W[1] - E[1], W[0] - E[0]) * 180 / Math.PI + 90, s: s * .8 }); };
  arm.setA(150);
  [arm.g, db].forEach(e => { put(e, { o: 0 }); show(e, t0); });
  arm.db = db;
  return arm;
}
// A push-up on a support: toes planted at (fx, fy), the straight body tilted th degrees forward from upright, hands
// at arm's length in front of the shoulders. dip(e): 0 up, 1 down — the body turns about the toes and the arms follow.
function pushFig(p, fx, fy, s, th, t0) {
  const pose = { ...STAND, hN: 0, hF: 0, kN: 0, kF: 0, fN: th < 25 ? th : -15, fF: th < 25 ? th : -15, aN: 90, eN: 0, aF: 90, eF: 0 };
  const f = fig(p, { x: 0, y: 0, s, r: th, o: 0, pose });
  const key = th < 25 ? 'AN' : 'toeN';
  plant(f, key, fx, fy);
  const Sh = onStage(f, 'Sh'), L = (RIG.ua + RIG.fa) * s * .97, a = rad(th), H = [Sh[0] + Math.cos(a) * L, Sh[1] + Math.sin(a) * L];
  const tri = muscleOn(f, ...MUSCLE.triceps, { after: 'hdN', w: 9 });
  f.H = H;
  f.dip = e => { put(f.g, { r: th + 8 * e }); plant(f, key, fx, fy); reach(f, 'N', ...H); reach(f, 'F', ...H); tri.act(.85); };
  f.dip(0);
  show(f.g, t0);
  return f;
}
// The tilt at which the hands of a push-up from toes at (fx, fy) reach the height hy.
function tiltFor(fx, fy, s, hy) {
  let lo = 30, hi = 100;
  for (let i = 0; i < 30; i++) {
    const th = (lo + hi) / 2, f = fig(scene, { x: 0, y: 0, s, r: th, o: 0, pose: { ...STAND, hN: 0, hF: 0, kN: 0, kF: 0, fN: -15, fF: -15 } });
    plant(f, 'toeN', fx, fy);
    const Sh = onStage(f, 'Sh'), y = Sh[1] + Math.sin(rad(th)) * (RIG.ua + RIG.fa) * s * .97;
    f.g.remove();
    if (y < hy) lo = th; else hi = th;
  }
  return (lo + hi) / 2;
}

    infoCard(p, 80, 690, 920, 170, 'по другим данным', 'эксцентрическая сила от скорости почти не зависит', COL.dim, m('ecc', 6), { size: 22 });
    infoCard(p, 1060, 120, 480, 330, 'от медленных к быстрым', 'свободные грузы — только медленно и средне (контроль); быстро — изокинетика, пневматика и гидравлика, эластичное сопротивление', COL.whole, m('app'), { size: 22 });
    infoCard(p, 1060, 470, 480, 300, 'специфичность скорости', 'сила растёт в основном на тренируемых скоростях, перенос ограничен → скорость как в функции', COL.good, m('spec'), { size: 22 });
  }],

  ['per', 'Периодизация', (m) => {
    const p = panel(0), x0 = 120, y0 = 640, W = 1000, H = 380;
    txt(p, 'периодизация (periodization)', 800, 76, m('per'), { size: 30, weight: 700, fill: COL.chalk, anchor: 'middle' });
    txt(p, 'отрезки времени с системным изменением нагрузки', 800, 118, m('per', 1), { size: 23, fill: COL.dim, anchor: 'middle' });
    const g = G(p, { o: 0 });
    path(g, `M${x0} ${y0 - H}V${y0}H${x0 + W + 20}`, { stroke: COL.dim, 'stroke-width': 3 });
    T(g, 'год →', { x: x0 + W + 10, y: y0 + 36, size: 20, fill: COL.dim, anchor: 'end' });
    show(g, m('cyc'));
    ['подготовка', 'сила', 'мощность', 'пик', 'отдых'].forEach((s, i) => {
      const w = [.3, .25, .2, .1, .15][i], a = [0, .3, .55, .75, .85][i], bg = G(p, { o: 0 });
      mk('rect', { x: x0 + a * W + 3, y: y0 + 50, width: w * W - 6, height: 44, rx: 10, fill: [COL.whole, COL.nat, COL.task, COL.bad, COL.good][i], 'fill-opacity': .3 }, bg);
      T(bg, s, { x: x0 + (a + w / 2) * W, y: y0 + 80, size: 20, fill: COL.chalk, anchor: 'middle' });
      show(bg, m('cyc', .4 + i * .4));
    });
    const vol = t => t < .85 ? .85 - .7 * t : .3, inten = t => t < .85 ? .25 + .75 * t : .4;
    draw(path(p, fnPath(x0, y0, W, H, vol), { stroke: COL.whole, 'stroke-width': 5 }, { d: 0 }), m('cyc', 2.5), 1.5);
    draw(path(p, fnPath(x0, y0, W, H, inten), { stroke: COL.nat, 'stroke-width': 5 }, { d: 0 }), m('cyc', 2.5), 1.5);
    txt(p, 'объём', x0 + 20, y0 - .85 * H - 12, m('cyc', 3), { size: 22, fill: COL.whole, weight: 700 });
    txt(p, 'интенсивность', x0 + .55 * W, y0 - .7 * H - 16, m('cyc', 3), { size: 22, fill: COL.nat, weight: 700 });
    const pk = G(p, { o: 0 });
    path(pk, `M${x0 + .8 * W} ${y0 - H - 10}V${y0}`, { stroke: COL.bad, 'stroke-width': 3, 'stroke-dasharray': '8 6' });
    T(pk, 'соревнование — пик', { x: x0 + .8 * W, y: y0 - H - 20, size: 22, fill: COL.bad, anchor: 'middle', weight: 700 });
    show(pk, m('cyc', 3.5));
    pill(p, 'схема', x0 + 70, y0 - H + 10, m('cyc'), { col: COL.dim, size: 19 });
    infoCard(p, 1170, 150, 380, 200, 'для кого', 'тренированные тяжелоатлеты и пауэрлифтеры', COL.task, m('ath'), { size: 22 });
    infoCard(p, 1170, 370, 380, 220, 'зачем', 'пик к соревнованиям; без перетренированности и психологического застоя', COL.good, m('cyc'), { size: 22 });
    infoCard(p, 1170, 610, 380, 240, 'доказательства', 'ограничены; приёмы — для травмированных спортсменов на поздней стадии', COL.dim, m('ev'), { size: 22 });
  }],

  ['integ', 'Перенос в функцию', (m) => {
    const p = panel(0), GY = 760;
    txt(p, 'перенос в функцию', 800, 76, m('integ'), { size: 30, weight: 700, fill: COL.chalk, anchor: 'middle' });
    ground(p, 120, 560, GY, m('stab'));
    const LO = { aN: 25, eN: 70, aF: 25, eF: 70 }, HI = { aN: 70, eN: 50, aF: 70, eF: 50 };
    const f = fig(p, { x: 320, y: GY - 182 * 1.1, s: 1.1, o: 0, pose: LO });
    const bx = carry(p, f, c => boxProp(c, 70, 52), { turn: false, along: 16 });
    const ext = muscleOn(f, ['H', 'Sh', 20, -14], ['Sh', 'H', 20, 12], { w: 10, after: 'torso' });
    const abd = muscleOn(f, ['H', 'Sh', 14, 20], ['Sh', 'H', 30, -22], { w: 10, after: 'torso' });
    const bic = muscleOn(f, ...MUSCLE.biceps, { after: 'hdN', w: 10 });
    [f.g, bx].forEach(e => { put(e, { o: 0 }); show(e, m('stab')); });
    prog(q => { f.set(blendPose(LO, HI, (1 - Math.cos(2 * Math.PI * 2.5 * q)) / 2)); ext.act(.8); abd.act(.8); bic.act(.9); }, m('stab', .5), 6, lin);
    txt(p, 'устойчивость: туловище', 320, 250, m('stab', 2), { size: 22, fill: '#ff7a5c', anchor: 'middle', weight: 600 });
    txt(p, 'подвижность: руки', 320, 820, m('stab', 3), { size: 22, fill: COL.task, anchor: 'middle', weight: 600 });
    infoCard(p, 640, 120, 900, 180, 'подвижность на фоне устойчивости', 'агонисты и антагонисты держат сустав; многие группы мышц — в нужной последовательности', COL.whole, m('stab'), { size: 22 });
    infoCard(p, 640, 315, 900, 160, 'сила, мощность, выносливость — вместе', 'медленно и точно, быстро, повторно, долго держать позу → анализ задач', COL.task, m('bal'), { size: 22 });
    infoCard(p, 640, 490, 900, 200, 'движения самих задач', 'плоскости, диагонали, сочетания; толкать, тянуть, поднимать, держать — от малого к большему', COL.good, m('task'), { size: 22 });
    infoCard(p, 640, 705, 900, 150, 'самостоятельность', 'оценивать скорость, силу, длительность усилия и момент', COL.real, m('self'), { size: 22 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-mode', prompt: ['Верно или нет?'],
    build: grid([
      { parts: ['Свободные грузы безопасны на любой скорости'], ans: ['f'], why: 'Только на медленной и средней: иначе нет контроля.' },
      { parts: ['Сила растёт в основном на тех скоростях, на которых тренировались'], ans: ['t'], why: 'Специфичность скорости.' },
      { parts: ['Короткая дуга помогает обойти болезненную часть объёма'], ans: ['t'], why: 'Да.' },
      { parts: ['Изометрия — сокращение без движения в суставе'], ans: ['t'], why: 'Да.' },
      { parts: ['Эффективность периодизации надёжно доказана'], ans: ['f'], why: 'Доказательств немного.' },
    ], TF, { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Режим: статическое или динамическое, открытая или закрытая цепь, вид сопротивления, полная или короткая дуга.', 'w1'],
     ['Скорость: концентрическая сила падает, эксцентрическая сначала растёт; эффект специфичен к скорости.', 'w2'],
     ['Периодизация — циклы с меняющейся нагрузкой; данных о её пользе мало.', 'w3'],
     ['Перенос в функцию: устойчивость плюс подвижность, движения самих задач.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 220 + i * 140, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 31, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-mode', prompt: ['Что выбрать?'],
    build: grid([
      { parts: ['После операции обойти болезненную часть объёма'], ans: ['short'], why: 'Короткая дуга.' },
      { parts: ['Развить силу во всём объёме движения'], ans: ['full'], why: 'Полная дуга.' },
      { parts: ['Подготовить к быстрым повседневным движениям'], ans: ['fast'], why: 'Тренировка на быстрых скоростях.' },
      { parts: ['Сохранить мышцу, когда сустав обездвижен'], ans: ['iso'], why: 'Изометрия — установочное напряжение.' },
    ], [['short', 'Короткая дуга', COL.task], ['full', 'Полная дуга', COL.good], ['fast', 'Быстрая скорость', COL.whole], ['iso', 'Изометрия', STA]], { multi: false, text: true }),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-speed', prompt: ['Пожилой пациентке нужно успевать перейти улицу и подхватить себя при спотыкании. Пока она делает только медленные упражнения с гантелями. Что добавить?'],
    build: choice([
      ['Тренировку на более высоких скоростях — с эластичным сопротивлением или на изокинетическом тренажёре'],
      ['Ничего: сила с медленных упражнений переносится на все скорости'],
      ['Быстрые взмахи свободными гантелями'],
      ['Только изометрию'],
    ], 0, 'Эффект специфичен к скорости; быстрые скорости безопасно дают эластика и изокинетика.',
    [null, 'Перенос на другие скорости ограничен.', 'Со свободными грузами быстро — нет контроля, это небезопасно.', 'Изометрия не тренирует быстрые движения.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
