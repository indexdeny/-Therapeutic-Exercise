// cards-short end

const MAN = COL.whole, MECH = COL.task, ISOC = COL.real, HAND = '#b9cfe0';
// A seated figure on a bench, knee extensors on the thigh: { f, q }.
function seatedKnee(p, hx, hy, s, t0, kN = 90) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...SIT, t: 4, kN, aN: 20, eN: 30, aF: 20, eF: 30 } });
  plant(f, 'H', hx, hy);
  bench(p, hx - 110 * s, hx + 60 * s, hy + 8 * s, t0, COL.dim, 182 * s * .95);
  p.appendChild(f.g);
  const q = muscleOn(f, ...MUSCLE.rectus, { after: 'ftN', w: 13 });
  show(f.g, t0);
  return { f, q };
}
// An arrow pressing on a point of a figure along the direction (dx, dy); follows the figure.
function pressOn(p, f, key, dx, dy, col, t0, L = 70) {
  const a = path(p, '', { stroke: col, 'stroke-width': 6 }, { o: 0 });
  const upd = () => {
    const [x, y] = onStage(f, key), n = Math.hypot(dx, dy), ux = dx / n, uy = dy / n, b = [x - ux * 16, y - uy * 16], s0 = [b[0] - ux * L, b[1] - uy * L], v = w => w.toFixed(1);
    a.setAttribute('d', `M${v(s0[0])} ${v(s0[1])}L${v(b[0])} ${v(b[1])}M${v(b[0] - ux * 14 - uy * 10)} ${v(b[1] - uy * 14 + ux * 10)}L${v(b[0])} ${v(b[1])}L${v(b[0] - ux * 14 + uy * 10)} ${v(b[1] - uy * 14 - ux * 10)}`);
  };
  f.onSet.push(upd); upd();
  show(a, t0);
  return a;
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Изометрия', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });

    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);
  }],

  ['types', 'Выбор и прогрессия', (m) => {

  ['man', 'Ручное и механическое', (m) => {

  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-isotype', prompt: ['Какой вид изометрии?'],
    build: grid([

      { parts: ['Упираться в стену при 4–6 углах сгибания колена'], ans: ['multi'], why: 'Изометрия под несколькими углами.' },

    p.appendChild(sp.g);

    txt(p, 'установочное', 280, 128, m('set'), { size: 26, weight: 700, fill: COL.whole, anchor: 'middle' });
    infoCard(p, 60, 420, 470, 440, 'установочные (setting)', 'малая интенсивность, почти без сопротивления · меньше боль и спазм, лучше расслабление и кровоток · силу не растят (кроме очень слабых), но замедляют атрофию', COL.whole, m('set', 1), { size: 22 });
    // stabilization: standing, co-contraction against alternating pushes
    const GY = 380, sf = fig(p, { x: 800, y: GY - 182 * .62, s: .62, o: 0 });
    const qd = muscleOn(sf, ...MUSCLE.rectus, { after: 'ftN', w: 10 }), hm = muscleOn(sf, ...MUSCLE.hamstrings, { after: 'ftN', w: 10 });
    show(sf.g, m('stab'));
    ground(p, 680, 920, GY, m('stab'));
    const pf = pressOn(p, sf, 'Sh', 1, 0, COL.task, m('stab', .5), 60), pb = pressOn(p, sf, 'Sh', -1, 0, COL.task, m('stab', .5), 60);

    txt(p, 'стабилизационное', 800, 128, m('stab'), { size: 26, weight: 700, fill: COL.good, anchor: 'middle' });
    infoCard(p, 565, 420, 470, 440, 'стабилизационные', 'длительное субмаксимальное совместное сокращение · с опорой, против веса тела или рук терапевта · ритмическая стабилизация и чередующаяся изометрия (ПНФ), туловище, мячи', COL.good, m('stab', 1), { size: 22 });
    // multiple angles: four knee angles with the resistance at each
    const sk = seatedKnee(p, 1250, 270, .62, m('multi'), 90);
    prog(q => { const k = Math.min(3, Math.floor(q * 4)); sk.f.set({ kN: [80, 60, 40, 20][k] }); sk.q.act(.85); }, m('multi', 1), 6, lin);
    pressOn(p, sk.f, 'AN', 0, -1, ISOC, m('multi', 1), 50);
    txt(p, 'под несколькими углами', 1300, 128, m('multi'), { size: 26, weight: 700, fill: ISOC, anchor: 'middle' });
    infoCard(p, 1070, 420, 470, 440, 'под несколькими углами', 'сопротивление в нескольких положениях · сила во всём объёме, когда движение можно, а динамика болезненна', ISOC, m('multi', .5), { size: 22 });
  }],

  ['dose', 'Дозировка изометрии', (m) => {
    const p = panel(0), x0 = 100, y0 = 480, W = 640, H = 300;
    txt(p, 'дозировка изометрии', 800, 76, m('dose'), { size: 30, weight: 700, fill: COL.chalk, anchor: 'middle' });
    chartAxes(p, x0, y0, W, H, 'изометрическая сила', 'угол в суставе →', m('ang'));
    const bell = t => .85 * Math.exp(-(((t - .5) / .3) ** 2));
    draw(path(p, fnPath(x0, y0, W, H, bell, .02, .98), { stroke: ISOC, 'stroke-width': 5 }, { d: 0 }), m('ang', .4), 1.2);
    txt(p, 'больше перекрытие актина и миозина', x0 + .5 * W, y0 - H - 34, m('ang', 1.5), { size: 20, fill: ISOC, anchor: 'middle' });
    [.2, .4, .6, .8].forEach((a, i) => {
      const bg = G(p, { o: 0 });
      mk('rect', { x: x0 + (a - .06) * W, y: y0 - H, width: .12 * W, height: H, fill: COL.good, 'fill-opacity': .18 }, bg);
      path(bg, `M${x0 + a * W} ${y0 - H}V${y0}`, { stroke: COL.good, 'stroke-width': 3 });
      show(bg, m('spec', .5 + i * .5));
    });
    txt(p, 'прирост — ±10° от тренируемого угла → 4–6 углов', x0, y0 + 70, m('spec', 1), { size: 22, fill: COL.good, weight: 600 });
    pill(p, 'схема', x0 + W - 30, y0 - H - 24, m('ang'), { col: COL.dim, size: 19 });
    // the time course of one contraction: 2 s rise, 6 s hold, 2 s fall
    const tx = 100, ty = 800, TW = 640, TH = 140, g = G(p, { o: 0 });
    path(g, `M${tx} ${ty - TH - 10}V${ty}H${tx + TW + 10}`, { stroke: COL.dim, 'stroke-width': 3 });
    path(g, `M${tx} ${ty}L${tx + TW * .2} ${ty - TH}H${tx + TW * .8}L${tx + TW} ${ty}`, { stroke: '#ff7a5c', 'stroke-width': 5 });
    [['2 с', .1], ['6 с удержание', .5], ['2 с', .9]].forEach(([s, a]) => T(g, s, { x: tx + a * TW, y: ty + 30, size: 21, fill: COL.chalk, anchor: 'middle', weight: 600 }));
    T(g, '10 с', { x: tx + TW + 20, y: ty - 4, size: 22, fill: COL.task, weight: 700 });
    show(g, m('dur'));
    infoCard(p, 820, 120, 720, 130, '≥ 60% от максимального произвольного', 'подстраивать под угол и повышать по мере роста силы', COL.task, m('int'), { size: 22 });
    infoCard(p, 820, 265, 720, 130, 'плавно', 'сопротивление прикладывать и снимать постепенно — без боли и рывка', COL.good, m('grad'), { size: 22 });
    infoCard(p, 820, 410, 720, 130, '6, но не больше 10 секунд', 'мышца быстро устаёт; серии сокращений — меньше судорог', '#ff7a5c', m('dur'), { size: 22 });
    infoCard(p, 820, 555, 720, 150, 'специфичность', 'угла (±10°) и режима: растёт статическая сила, динамическая — почти нет', ISOC, m('spec'), { size: 22 });
  }],

  ['safe', 'Безопасность', (m) => {
    const p = panel(0);
    txt(p, 'источники сопротивления и безопасность', 800, 76, m('safe'), { size: 30, weight: 700, fill: COL.chalk, anchor: 'middle' });
    ['рука терапевта', 'стена, дверной проём', 'блок с грузом больше силы мышцы', 'изокинетика: 0°/с'].forEach((s, i) => pill(p, s, 220 + i * 390, 160, m('safe', .5 + i * .6), { col: ISOC, size: 23 }));
    // breath holding raises the pressure; exhaling during the contraction keeps it down
    const GY = 640, f = fig(p, { x: 330, y: GY - 182 * 1.05, s: 1.05, o: 0, pose: { aN: 85, eN: 20, aF: 85, eF: 20, t: 10 } });
    ground(p, 120, 560, GY, m('val'));
    show(f.g, m('val'));
    path(p, `M${onStage(f, 'WN')[0] + 18} 260V${GY}`, { stroke: COL.dim, 'stroke-width': 10 }, { o: 0 });
    show(p.lastChild, m('val'));
    const bp = G(p, { o: 0 });
    mk('rect', { x: 640, y: 240, width: 40, height: 340, rx: 10, fill: 'none', stroke: COL.dim, 'stroke-width': 2 }, bp);
    const bar = mk('rect', { x: 645, y: 575, width: 30, height: 0, rx: 7, fill: COL.bad }, bp);
    T(bp, 'давление', { x: 660, y: 225, size: 20, fill: COL.dim, anchor: 'middle' });
    show(bp, m('val'));
    const lab = txt(p, '', 330, 220, m('val', .5), { size: 25, weight: 700, fill: COL.bad, anchor: 'middle' });
    prog(q => { const h = 320 * io(q); bar.setAttribute('y', (575 - h).toFixed(1)); bar.setAttribute('height', h.toFixed(1)); lab.textContent = 'задержка дыхания!'; }, m('val', .5), 2, lin);
    prog(q => { const h = 320 * (1 - .65 * io(q)); bar.setAttribute('y', (575 - h).toFixed(1)); bar.setAttribute('height', h.toFixed(1)); bar.setAttribute('fill', mix(COL.bad, COL.good, q)); lab.textContent = 'выдох во время сокращения'; lab.setAttribute('fill', COL.good); }, m('val', 6), 2, lin);
    txt(p, 'упор в стену', 330, 690, m('val'), { size: 22, fill: COL.dim, anchor: 'middle' });
    infoCard(p, 760, 240, 780, 220, 'проба Вальсальвы', 'задержка дыхания при напряжении → давление резко растёт; дышать ритмично, выдыхать во время сокращения', COL.int, m('val'), { size: 23 });
    infoCard(p, 760, 490, 780, 180, 'противопоказание', 'изометрия высокой интенсивности при заболеваниях сердца или сосудов в анамнезе', COL.bad, m('contra'), { size: 23 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-iso', prompt: ['Верно или нет?'],
    build: grid([
      { parts: ['Изометрическое сокращение удерживают 6–10 секунд'], ans: ['t'], why: 'Да: дольше — мышца быстро устаёт.' },
      { parts: ['Изометрия при 60° укрепляет мышцу во всём объёме'], ans: ['f'], why: 'Только около 60° (±10°).' },
      { parts: ['Установочные упражнения заметно увеличивают силу здоровой мышцы'], ans: ['f'], why: 'Силу растят только у очень слабых мышц.' },
      { parts: ['Во время изометрии пациент выдыхает'], ans: ['t'], why: 'Чтобы избежать пробы Вальсальвы.' },
      { parts: ['Изометрическая тренировка мало влияет на динамическую силу'], ans: ['t'], why: 'Эффект специфичен к режиму.' },
    ], TF, { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Ручное — точный контроль, когда мышца слаба; механическое — измеримо и может быть больше.', 'w1'],
     ['Изометрия — напряжение без движения: при иммобилизации, для устойчивости, при боли от движения.', 'w2'],
     ['Виды: установочная, стабилизационная, под несколькими углами.', 'w3'],
     ['≥ 60%, 6–10 с, 4–6 углов; дышать, выдох во время сокращения.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 220 + i * 140, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 31, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-iso', prompt: ['Посчитайте.'],
    build: blanks([
      { parts: ['2 с нарастание + ', { box: '6' }, ' с удержание + 2 с расслабление = 10 с'], why: '2 + 6 + 2 = 10.' },
      { parts: ['Тренировали при 60° — прирост примерно от ', { box: '50' }, '° до ', { box: '70' }, '°'], why: '±10° от тренируемого угла.' },
      { parts: ['20 сокращений по 6 с — всего ', { box: '120' }, ' с напряжения'], why: '20 × 6 = 120.' },
    ]),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-cardiac', prompt: ['Пациенту 68 лет, в анамнезе инфаркт. Нужно укрепить четырёхглавую мышцу. Что не подходит?'],
    build: choice([
      ['Изометрия с максимальным усилием и задержкой дыхания'],
      ['Упражнения малой интенсивности с ритмичным дыханием'],
      ['Плавно прикладывать и снимать сопротивление'],
      ['Выдыхать во время сокращения'],
    ], 0, 'Изометрия высокой интенсивности противопоказана при заболеваниях сердца и сосудов, а задержка дыхания резко повышает давление.',
    [null, 'Это подходит.', 'Это правильная техника.', 'Это защищает от пробы Вальсальвы.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
