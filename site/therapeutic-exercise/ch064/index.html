const CON = COL.nat, ECC = COL.task;
// An elbow model with a dumbbell of size k in the hand; setA(a) bends the elbow, setK(k) changes the dumbbell.
function armWithDb(p, x, y, s, k, t0) {
  const arm = elbowModel(p, { x, y, s });
  const db = G(p), inner = G(db);
  dumbbell(inner, 1);
  arm.setK = kk => put(inner, { s: kk });
  arm.setK(k);
  arm.setA = a => { arm.set(a); const { E, W, hand } = arm.pts; put(db, { x: x + hand[0] * s, y: y + hand[1] * s, r: Math.atan2(W[1] - E[1], W[0] - E[0]) * 180 / Math.PI + 90, s: s * .8 }); };
  arm.setA(150);
  [arm.g, db].forEach(e => { put(e, { o: 0 }); show(e, t0); });
  return arm;
}

  ['vel', 'Груз и скорость', (m) => {
    const p = panel(0), cx = 1130, y0 = 640, W = 380, H = 460;
    txt(p, 'груз определяет скорость', 800, 76, m('vel'), { size: 30, weight: 700, fill: COL.chalk, anchor: 'middle' });

    path(g, `M${cx - W} ${y0}H${cx + W + 10}M${cx} ${y0 + 10}V${y0 - H - 10}`, { stroke: COL.dim, 'stroke-width': 3 });
    T(g, 'напряжение', { x: cx + 12, y: y0 - H, size: 20, fill: COL.dim });
    T(g, 'поднимает →', { x: cx + W, y: y0 + 34, size: 19, fill: COL.dim, anchor: 'end' });
    T(g, '← опускает', { x: cx - W, y: y0 + 34, size: 19, fill: COL.dim });
    show(g, m('vel', .3));
    const Fc = v => .55 * (1 - v) / (1 + 3 * v), Fe = v => .55 + .32 * (1 - Math.exp(-v * 7));
    path(p, fnPath(cx, y0, W, H, Fc), { stroke: CON, 'stroke-width': 4, 'stroke-opacity': .6 }, { o: 0 }); show(p.lastChild, m('vel', .3));
    path(p, fnPath(cx - W, y0, W, H, v => Fe(1 - v)), { stroke: ECC, 'stroke-width': 4, 'stroke-opacity': .6 }, { o: 0 }); show(p.lastChild, m('vel', .3));

      const sp = Math.abs(v), base = 110;
      a.setA(dir === 0 ? base + 2 * Math.sin(q * 40) : dir > 0 ? lerp(165, 60, (q * (.4 + sp)) % 1) : lerp(60, 165, (q * (.4 + sp)) % 1));
      a.act('biceps', 1);
      put(dot, { x: cx + v * W, y: y0 - (v >= 0 ? Fc(v) : Fe(-v)) * H });
      lab.textContent = txt0; lab.setAttribute('fill', col);
    }, m(k, .2), dur, lin);
    phase('iso', 1.2, 0, 0, 'груз удерживается: скорость 0', COL.chalk);

    phase('e1', 1.3, -.15, -1, 'чуть больше — медленно вниз', ECC);
    phase('e2', 1.55, -.7, -1, 'ещё больше — быстрее, сила на плато', ECC, 2.5);
    infoCard(p, 80, 790, 1440, 90, 'заблуждение: «медленное опускание того же груза даёт больше напряжения» — нет, меньше', null, COL.bad, m('myth'), { size: 22 });

    txt(p, 'эксцентрическая и концентрическая: ещё различия', 800, 76, m('more'), { size: 30, weight: 700, fill: COL.chalk, anchor: 'middle' });
    infoCard(p, 80, 120, 700, 200, 'экономнее', 'меньше кислорода и энергии, меньше утомление → бег под гору может эффективнее развивать выносливость', ECC, m('en'), { size: 22 });
    infoCard(p, 820, 120, 700, 200, 'специфичнее', 'эксцентрическая — сильнее к режиму и скорости; выбирать упражнения, похожие на функцию', COL.whole, m('spec'), { size: 22 });
    infoCard(p, 80, 340, 700, 200, 'перекрёстный эффект', 'у обоих видов — немного сильнее другая сторона; влияние на функцию не доказано', COL.dim, m('cross'), { size: 22 });
    infoCard(p, 820, 340, 700, 200, 'отсроченная боль (DOMS)', 'чаще и сильнее после непривычной, быстро наращиваемой интенсивной эксцентрики', COL.bad, m('doms'), { size: 22 });
    infoCard(p, 80, 560, 1440, 140, 'но', 'при равных интенсивности и объёме — разницы нет; постепенное наращивание эксцентрики — без отсроченной боли', COL.good, m('eq'), { size: 23 });
    // the ramp: a sudden jump in eccentric load vs a gradual one (scheme)
    const g = G(p, { o: 0 });
    path(g, 'M120 840H520V760H700', { stroke: COL.bad, 'stroke-width': 5 });
    path(g, 'M820 840Q1100 840 1160 800T1500 760', { stroke: COL.good, 'stroke-width': 5 });
    T(g, 'резко — боль', { x: 410, y: 880, size: 21, fill: COL.bad, anchor: 'middle' });
    T(g, 'постепенно — без боли', { x: 1160, y: 880, size: 21, fill: COL.good, anchor: 'middle' });
    show(g, m('eq', 1));
  }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Концентрически — поднимают и разгоняют, эксцентрически — опускают, тормозят, поглощают энергию.', 'w1'],
     ['Эксцентрически контролируют больший груз меньшим числом единиц; слабой мышце легче опускать.', 'w2'],
     ['Медленное опускание того же груза не даёт большего напряжения.', 'w3'],
     ['Эксцентрика экономнее и специфичнее; резкий рост — отсроченная боль, постепенный — безопасно.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 220 + i * 140, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 31, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-phase', prompt: ['Концентрическая или эксцентрическая работа указанной мышцы?'],
    build: grid([
      { parts: ['Встать со стула — четырёхглавая'], ans: ['c'], why: 'Укорачивается, разгибая колено.' },
      { parts: ['Сесть на стул — четырёхглавая'], ans: ['e'], why: 'Удлиняется, тормозя посадку.' },
      { parts: ['Спуск по лестнице — четырёхглавая опорной ноги'], ans: ['e'], why: 'Тормозит сгибание колена.' },
      { parts: ['Поднести стакан ко рту — двуглавая'], ans: ['c'], why: 'Сгибает локоть, укорачиваясь.' },
      { parts: ['Опустить стакан на стол — двуглавая'], ans: ['e'], why: 'Контролирует разгибание, удлиняясь.' },
    ], [['c', 'Концентрическая', CON], ['e', 'Эксцентрическая', ECC]], { multi: false, text: true }),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-weak', prompt: ['Четырёхглавая мышца оценена на 2 балла из 5: пациент не может разогнуть колено сидя против силы тяжести. С чего можно начать?'],
    build: choice([
      ['Колено разгибают пассивно, а пациент медленно опускает голень сам — эксцентрически'],
      ['Тяжёлая манжета и подъёмы до отказа'],
      ['Быстрые концентрические подъёмы с лентой'],
      ['Ждать, пока мышца окрепнет сама'],
    ], 0, 'Эксцентрически нужно меньше двигательных единиц: опускать против силы тяжести легче, чем поднимать.',
    [null, 'Мышца слабее 3/5 не справится, а груз небезопасен.', 'Концентрически поднять против силы тяжести она пока не может.', 'Без нагрузки сила не растёт.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
