// A patient seated in an isokinetic dynamometer: the lever turns about the knee and is strapped above the ankle.
// set(kN) moves the knee; the quadriceps and the hamstrings are on the thigh. Returns { f, q, h, lever }.
function dynoSeat(p, hx, hy, s, t0) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...SIT, t: -6, kN: 90, aN: 30, eN: 40, aF: 30, eF: 40 } });
  plant(f, 'H', hx, hy);
  const seat = G(p, { o: 0 });
  mk('rect', { x: hx - 120 * s, y: hy + 8 * s, width: 170 * s, height: 22 * s, rx: 6, fill: PANEL, stroke: COL.dim, 'stroke-width': 3 }, seat);
  mk('rect', { x: hx - 150 * s, y: hy - 190 * s, width: 24 * s, height: 220 * s, rx: 6, fill: PANEL, stroke: COL.dim, 'stroke-width': 3 }, seat);
  path(seat, `M${hx - 40 * s} ${hy + 30 * s}V${hy + 175 * s}`, { stroke: COL.dim, 'stroke-width': 6 });
  const K = onStage(f, 'KN'), head = G(p, { o: 0 });
  mk('rect', { x: K[0] - 34 * s, y: K[1] - 120 * s, width: 68 * s, height: 100 * s, rx: 10, fill: MACH, stroke: '#2b3644', 'stroke-width': 2 }, head);
  mk('circle', { cx: K[0], cy: K[1], r: 16 * s, fill: '#2b3644', stroke: '#9fb0bf', 'stroke-width': 3 }, head);
  path(head, `M${K[0]} ${K[1] - 20 * s}V${K[1] - 120 * s}`, { stroke: '#2b3644', 'stroke-width': 6 });
  p.appendChild(f.g);
  const lever = path(p, '', { stroke: '#9fb0bf', 'stroke-width': 9 }), pad = mk('rect', { width: 26 * s, height: 40 * s, rx: 6, fill: MACH }, p);
  const q = muscleOn(f, ...MUSCLE.rectus, { after: 'ftN', w: 12 }), h = muscleOn(f, ...MUSCLE.hamstrings, { after: 'ftN', w: 12 });
  f.onSet.push(() => {
    const Kk = onStage(f, 'KN'), A = onStage(f, 'AN'), d = [A[0] - Kk[0], A[1] - Kk[1]], L = Math.hypot(...d), u = [d[0] / L, d[1] / L], P = [Kk[0] + u[0] * L * .82, Kk[1] + u[1] * L * .82];
    lever.setAttribute('d', `M${Kk[0].toFixed(1)} ${Kk[1].toFixed(1)}L${(Kk[0] + u[0] * L * .9).toFixed(1)} ${(Kk[1] + u[1] * L * .9).toFixed(1)}`);
    put(pad, { x: P[0] - 13 * s, y: P[1] - 20 * s, r: 0 });
  });
  f.set({});
  [f.g, seat, head, lever, pad].forEach(e => { put(e, { o: 0 }); show(e, t0); });
  p.appendChild(head);
  return { f, q, h, lever };
}
// A round gauge with a needle: set(v) 0..1.
function gauge(p, x, y, r, label, col, t0) {
  const g = G(p, { x, y, o: 0 });
  path(g, `M${-r} 0A${r} ${r} 0 0 1 ${r} 0`, { stroke: COL.dim, 'stroke-width': 6 });
  const nd = path(g, `M0 0L${-r + 12} 0`, { stroke: col, 'stroke-width': 5 });
  mk('circle', { r: 8, fill: col }, g);
  T(g, label, { y: 36, size: 21, fill: col, anchor: 'middle', weight: 600 });
  show(g, t0);
  return { g, set: v => put(nd, { r: 180 * clamp(v, 0, 1) }) };
}

    infoCard(p, 640, 720, 900, 140, 'меньше мышцы — концентрически, больше — эксцентрически', 'положение и сопротивление меняют, чтобы максимум пришёлся куда нужно', CONST, m('dir'), { size: 22 });
  }],

    band(60, 210, 180, COL.good, 'средние 60–180 (240)', m('cls', 2));
    band(210, 360, 180, CONST, 'быстрые 180 (240)–360+', m('cls', 4.5));
    band(30, 120, 430, ISOK, 'эксц. 30–120', m('ecc'));
    band(60, 120, 490, ISOK, '60–120', m('ecc', 2), '6 5');
    const wk = G(p, { o: 0 });
    mk('rect', { x: X(230), y: 560, width: X(240) - X(230), height: 80, fill: COL.task }, wk);
    T(wk, 'ходьба: нога ≈ 230–240°/с', { x: X(235), y: 670, size: 22, fill: COL.task, anchor: 'middle', weight: 700 });
    show(wk, m('walk'));
    infoCard(p, 300, 720, 1000, 130, 'многие движения в жизни быстрее', 'чем самый быстрый режим прибора', COL.bad, m('fast'), { size: 23 });
  }],

  ['feat', 'Особенности изокинетики', (m) => {
    const p = panel(0);
    txt(p, 'особенности изокинетики', 800, 76, m('feat'), { size: 30, weight: 700, fill: COL.chalk, anchor: 'middle' });
    const d = dynoSeat(p, 340, 460, 1, m('recip'));
    const lab = txt(p, '', 330, 800, m('recip', .5), { size: 24, weight: 700, fill: '#ff7a5c', anchor: 'middle' });
    prog(q => { const u = (q * 2.5) % 1, e = u < .5 ? u * 2 : 2 - u * 2, up = u < .5; d.f.set({ kN: lerp(90, 10, e) }); d.q.act(up ? .95 : .05); d.h.act(up ? .05 : .95); lab.textContent = up ? 'четырёхглавая: разгибает' : 'задняя группа: сгибает'; }, m('recip', .5), 7, lin);
    infoCard(p, 700, 120, 840, 140, 'взаимная тренировка', 'антагонисты по очереди — или одна группа концентрически, затем эксцентрически', ISOK, m('recip'), { size: 22 });
    infoCard(p, 700, 275, 840, 140, 'спектр скоростей', 'эффект специфичен к скорости → тренируют на 90–360°/с', COL.whole, m('spec'), { size: 22 });
    infoCard(p, 700, 430, 840, 110, 'быстрее — меньше сжатие сустава', '(концентрически)', COL.good, m('comp'), { size: 22 });
    infoCard(p, 700, 555, 840, 140, 'утомление', 'сила падает — сопротивление тоже; можно сделать ещё повторения', COL.int, m('fat'), { size: 22 });
    infoCard(p, 700, 710, 840, 150, 'болезненная дуга', 'давит слабее — сопротивление меньше; остановился — сопротивления нет', COL.bad, m('pain'), { size: 22 });
  }],

  ['lim', 'Ограничения', (m) => {
    const p = panel(0);
    txt(p, 'эффект и ограничения', 800, 76, m('lim'), { size: 30, weight: 700, fill: COL.chalk, anchor: 'middle' });
    infoCard(p, 80, 130, 700, 210, 'эффект', 'сила, мощность, выносливость; функция — мало данных (подача в теннисе, бросок мяча)', COL.good, m('lim', .3), { size: 23 });
    infoCard(p, 820, 130, 700, 330, 'перенос ограничен', 'в жизни быстрее и скорость меняется; прибор — одна мышца или пара, один сустав, одна плоскость, без опоры · обходят: диагонали, несколько суставов, закрытая цепь', COL.bad, m('why'), { size: 22 });
    infoCard(p, 80, 360, 700, 200, 'практика', 'только там, где есть прибор; нужна помощь с настройкой и наблюдение — дорого', COL.int, m('cost'), { size: 23 });
    // the shoulder rotators: 90/90 vs the arm at the side
    const GY = 820;
    ground(p, 820, 1500, GY, m('setup'));
    // front view (scheme): 90/90 — the arm out to the side, the forearm up; safer — the arm at the side, the forearm forward
    const front = (x, abd, t0) => {
      const g = G(p, { o: 0 }), defs = mk('defs', {}, g), ln = mix('#d8d1c1', COL.board, .62);
      limbEl(g, defs, '#d8d1c1', 46, 52, ln).set([x, 760], [x, 600]);
      mk('circle', { cx: x, cy: 555, r: 32, fill: '#d8d1c1', stroke: ln, 'stroke-width': 2 }, g);
      const S = [x + 50, 612];
      if (abd) { limbEl(g, defs, '#d8d1c1', 15, 12, ln).set(S, [S[0] + 100, S[1]]); limbEl(g, defs, '#d8d1c1', 12, 10, ln).set([S[0] + 100, S[1]], [S[0] + 100, S[1] - 95]); }
      else { limbEl(g, defs, '#d8d1c1', 15, 12, ln).set(S, [S[0] + 6, S[1] + 100]); mk('circle', { cx: S[0] + 6, cy: S[1] + 100, r: 15, fill: '#d8d1c1', stroke: ln, 'stroke-width': 2 }, g); }
      show(g, t0);
    };
    front(960, true, m('setup')); front(1320, false, m('setup', 1.5));
    pill(p, 'схема, вид спереди', 1140, 860, m('setup'), { col: COL.dim, size: 19 });
    txt(p, '90/90 — по инструкции', 1010, 500, m('setup'), { size: 21, fill: COL.dim, anchor: 'middle', weight: 600 });
    txt(p, 'безопаснее: рука вдоль тела', 1340, 500, m('setup', 1.5), { size: 21, fill: COL.good, anchor: 'middle', weight: 700 });
    infoCard(p, 80, 590, 700, 230, 'настройка', 'положение производителя иногда меняют: вращатели плеча — в положении покоя или с рукой вдоль тела', COL.whole, m('setup'), { size: 23 });
  }],

  ['prog', 'Прогрессия изокинетики', (m) => {
    const p = panel(0);
    txt(p, 'когда и как начинать изокинетику', 800, 76, m('prog'), { size: 30, weight: 700, fill: COL.chalk, anchor: 'middle' });
    txt(p, 'поздняя стадия: активное движение во всём объёме — без боли', 800, 122, m('prog', 1), { size: 24, fill: COL.good, anchor: 'middle' });
    const S = [['субмаксимально', 'максимально'], ['короткая дуга', 'полная'], ['60–180°/с', 'быстрее'], ['концентрически, разные скорости', 'эксцентрически']];
    S.forEach(([a, b], i) => {
      const y = 190 + i * 150, x = 140 + i * 60, g = G(p, { o: 0 });
      mk('rect', { x, y, width: 1300 - i * 60, height: 110, rx: 18, fill: PANEL, stroke: ISOK, 'stroke-width': 2.5 }, g);
      mk('circle', { cx: x + 50, cy: y + 55, r: 26, fill: ISOK }, g);
      T(g, String(i + 1), { x: x + 50, y: y + 65, size: 28, weight: 700, fill: COL.board, anchor: 'middle' });
      T(g, a, { x: x + 100, y: y + 66, size: 26, fill: COL.chalk, weight: 600 });
      T(g, '→ ' + b, { x: 1420, y: y + 66, size: 26, fill: COL.good, weight: 700, anchor: 'end' });
      show(g, m('p' + (i + 1)));
    });
    txt(p, 'эксцентрической скоростью управляет прибор — поэтому позже', 800, 860, m('p4', 3), { size: 23, fill: COL.dim, anchor: 'middle', italic: true });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-isoprog', prompt: ['Что вводят раньше в изокинетической тренировке?'],
    build: choice([
      ['Максимальные концентрические сокращения на нескольких скоростях'],
      ['Эксцентрическую изокинетику'],
      ['Сразу быстрые скорости, больше 300°/с'],
      ['Полную дугу через болезненный участок'],
    ], 0, 'Концентрической работе легче научиться, и её контролирует пациент; эксцентрической скоростью управляет прибор.',
    [null, 'Её вводят позже — скоростью рычага управляет прибор.', 'Сначала 60–180°/с.', 'Сначала короткая дуга вне боли.']),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Постоянный груз максимален в одной точке; переменное сопротивление — кулачки, рычаги, эластика.', 'w1'],
     ['Свободные грузы — медленно; быстро и безопасно — гидравлика, пневматика, эластика.', 'w2'],
     ['Изокинетика держит скорость (0–500°/с) и подстраивает сопротивление; эффект специфичен к скорости.', 'w3'],
     ['Начинают поздно: субмаксимально, коротко, медленно, концентрически — затем дальше.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 220 + i * 140, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 31, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-vel', prompt: ['Какая это скорость концентрической изокинетики?'],
    build: grid([
      { parts: ['0°/с'], ans: ['i'], why: 'Изометрический режим.' },
      { parts: ['45°/с'], ans: ['s'], why: 'Медленная: 30–60°/с.' },
      { parts: ['120°/с'], ans: ['m'], why: 'Средняя: 60–180 (240)°/с.' },
      { parts: ['300°/с'], ans: ['f'], why: 'Быстрая: 180 (240)–360°/с и выше.' },
    ], [['i', 'Изометрия', COL.dim], ['s', 'Медленная', COL.whole], ['m', 'Средняя', COL.good], ['f', 'Быстрая', CONST]], { multi: false, text: true }),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-isostart', prompt: ['Поздняя стадия после операции на колене: активное разгибание без боли, но при 40–60° сгибания неприятно. С чего начать изокинетику?'],
    build: choice([
      ['Субмаксимально, короткой дугой вне неприятного участка, 60–180°/с, концентрически'],
      ['Максимально, полной дугой, 300°/с'],
      ['Эксцентрическая изокинетика на 120°/с'],
      ['Изокинетику нельзя до полного исчезновения дискомфорта'],
    ], 0, 'Прогрессия: субмаксимально → максимально, коротко → полно, медленно-средне → быстро, концентрически → эксцентрически.',
    [null, 'Это конец прогрессии, а не начало.', 'Эксцентрику вводят после концентрических усилий на нескольких скоростях.', 'Короткая дуга позволяет начать, обходя неприятный участок.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
