const OKC = COL.whole, CKC = COL.good, CAST = '#8f9aa3';
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
// Open chain: sitting knee extension with the quadriceps. Returns { f, q }.
function openKnee(p, hx, hy, s, t0) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...SIT, t: 4, kN: 90, aN: 20, eN: 30, aF: 20, eF: 30 } });
  plant(f, 'H', hx, hy);
  bench(p, hx - 110 * s, hx + 60 * s, hy + 8 * s, t0, COL.dim, 182 * s * .95);
  p.appendChild(f.g);
  const q = muscleOn(f, ...MUSCLE.rectus, { after: 'ftN', w: 13 });
  show(f.g, t0);
  return { f, q };
}
// Closed chain: a squat over the planted feet with the quadriceps, the hamstrings and the gluteus maximus.
function squatFig(p, x, gy, s, t0) {
  const f = fig(p, { x, y: gy - 182 * s, s, o: 0 });
  const q = muscleOn(f, ...MUSCLE.rectus, { after: 'ftN', w: 13 }), h = muscleOn(f, ...MUSCLE.hamstrings, { after: 'ftN', w: 12 });
  const gm = muscleOn(f, ['H', 'Sh', 10, -18], ['KN', 'H', 40, -12], { after: 'thN', w: 14 });
  show(f.g, t0);
  const [ax] = onStage(f, 'AN');
  f.sq = e => { f.set(blendPose(STAND, { ...SQUAT, aN: 90, aF: 90 }, e)); plant(f, 'AN', ax, gy); };
  return { f, q, h, gm };
}

    infoCard(p, 620, 120, 920, 150, 'закрытая цепь — больше обратной связи?', 'больше мышц и суставов; опора сжимает суставы и раздражает механорецепторы', CKC, m('why'), { size: 22 });
    infoCard(p, 620, 285, 920, 150, 'данные противоречивы', 'плечо: закрытая + открытая лучше; чувство положения колена — без разницы', COL.int, m('mix'), { size: 22 });
    infoCard(p, 620, 450, 920, 150, 'перенос', 'оба вида растят силу, мощность, выносливость; при той же нагрузке ЭМГ сходна → выбирать по функции', COL.whole, m('carry'), { size: 22 });
    // the jump study (24 healthy people, 6 weeks)
    const g = G(p, { o: 0 });
    T(g, '24 здоровых, 6 недель: вертикальный прыжок', { x: 620, y: 650, size: 22, fill: COL.chalk, weight: 600 });
    mk('rect', { x: 620, y: 680, width: 400, height: 34, rx: 9, fill: CKC }, g); T(g, 'приседания со штангой: +10%', { x: 1035, y: 705, size: 22, fill: CKC, weight: 700 });
    mk('rect', { x: 620, y: 730, width: 8, height: 34, rx: 4, fill: OKC }, g); T(g, 'изокинетическое разгибание колена: без прироста', { x: 640, y: 755, size: 22, fill: OKC, weight: 700 });
    T(g, 'прыжковая программа: меньше нагрузка при приземлении и риск травм колена у спортсменок', { x: 620, y: 810, size: 21, fill: COL.dim });
    show(g, m('jump'));
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-okcckc', prompt: ['Верно или нет?'],
    build: grid([
      { parts: ['Доказано, что закрытая цепь функциональнее открытой'], ans: ['f'], why: 'Таких доказательств нет.' },
      { parts: ['Открытая цепь лучше изолирует отдельную мышцу'], ans: ['t'], why: 'Да.' },
      { parts: ['Большая нагрузка в открытой цепи может навредить недавно восстановленному суставу'], ans: ['t'], why: 'Показано для колена без ПКС.' },
      { parts: ['Для тренировки равновесия лучше открытая цепь'], ans: ['f'], why: 'Очевидный выбор — закрытая цепь.' },
      { parts: ['При одинаковой нагрузке активность мышц в обоих видах сходна'], ans: ['t'], why: 'Да.' },
    ], TF, { multi: false, text: true }),
  }], done) }],

  ['impl', 'Когда что', (m) => {
    const p = panel(0);
    txt(p, 'начало: открытая цепь и разгрузка', 800, 76, m('impl'), { size: 30, weight: 700, fill: COL.chalk, anchor: 'middle' });
    // a long leg cast: open-chain hip exercise in supine
    const sp = supine(p, 330, 330, .75, m('frac'));
    bench(p, 90, 560, 330, m('frac'), COL.dim, 60);
    p.appendChild(sp.g);
    const cast = path(p, '', { stroke: CAST, 'stroke-width': 30, 'stroke-linecap': 'round', opacity: .85 });
    sp.onSet.push(() => { const a = onStage(sp, 'KN'), H = onStage(sp, 'H'), A = onStage(sp, 'AN'), t = [lerp(H[0], a[0], .25), lerp(H[1], a[1], .25)]; cast.setAttribute('d', `M${t[0].toFixed(1)} ${t[1].toFixed(1)}L${a[0].toFixed(1)} ${a[1].toFixed(1)}L${A[0].toFixed(1)} ${A[1].toFixed(1)}`); });
    sp.set({}); put(cast, { o: 0 }); show(cast, m('frac'));
    const hf = muscleOn(sp, ['H', 'Sh', 8, 16], ['H', 'KN', 40, -16], { after: 'torso', w: 11 });
    prog(q => { sp.set({ hN: 35 * cyc(q, 2) }); hf.act(.9); }, m('frac', .8), 5, lin);
    txt(p, 'нога в гипсе: бедро — в открытой цепи', 330, 420, m('frac'), { size: 22, fill: OKC, anchor: 'middle', weight: 600 });
    infoCard(p, 640, 120, 900, 170, 'открытая цепь — когда опора запрещена', 'или при боли, отёке, ограничении в одном звене — для соседних суставов', OKC, m('impl'), { size: 22 });
    infoCard(p, 640, 305, 900, 120, 'сначала изолированно, потом сочетания', null, OKC, m('pat'), { size: 22 });
    // unloading: a pool, parallel bars, body-weight support
    const GY = 790;
    const pool = G(p, { o: 0 });
    mk('rect', { x: 90, y: 560, width: 380, height: 260, fill: COL.whole, 'fill-opacity': .18, stroke: COL.whole, 'stroke-width': 3 }, pool);
    T(pool, 'бассейн', { x: 280, y: 548, size: 22, fill: COL.whole, anchor: 'middle', weight: 700 });
    show(pool, m('unl'));
    const fp = fig(p, { x: 280, y: GY - 182 * .65, s: .65, o: 0 });
    show(fp.g, m('unl'));
    prog(q => fp.set(blendPose(STAND, { ...SQUAT, aN: 60, aF: 60 }, .6 * cyc(q, 2))), m('unl', .5), 4, lin);
    const bars = G(p, { o: 0 });
    path(bars, `M560 640H860M580 640V${GY}M840 640V${GY}`, { stroke: COL.dim, 'stroke-width': 6 });
    T(bars, 'брусья', { x: 710, y: 548, size: 22, fill: COL.dim, anchor: 'middle', weight: 700 });
    show(bars, m('bars'));
    const fb = fig(p, { x: 710, y: GY - 182 * .65, s: .65, o: 0, pose: { aN: 30, eN: 60, aF: 30, eF: 60 } });
    show(fb.g, m('bars'));
    const bw = G(p, { o: 0 });
    path(bw, `M1000 520H1300M1150 520V600`, { stroke: COL.task, 'stroke-width': 6 });
    mk('rect', { x: 990, y: GY, width: 330, height: 22, rx: 8, fill: PANEL, stroke: COL.dim, 'stroke-width': 3 }, bw);
    T(bw, 'дорожка с поддержкой веса', { x: 1150, y: 508, size: 22, fill: COL.task, anchor: 'middle', weight: 700 });
    show(bw, m('bwst'));
    const fw = fig(p, { x: 1100, y: GY - 182 * .65, s: .65, o: 0 });
    show(fw.g, m('bwst'));
    walk(fw, m('bwst', .5), 5, { cycles: 4, dx: 0 });
    path(p, `M1150 600L${1100 + 5} ${GY - 182 * .65 - 70}`, { stroke: COL.task, 'stroke-width': 3 }, { o: 0 }); show(p.lastChild, m('bwst'));
    txt(p, 'вода тормозит, не всегда доступна', 280, 860, m('unl', 1), { size: 19, fill: COL.dim, anchor: 'middle' });
    txt(p, 'нагрузку трудно дозировать', 710, 860, m('bars', 1), { size: 19, fill: COL.dim, anchor: 'middle' });
    txt(p, 'рано: закрытая цепь и ходьба', 1150, 860, m('bwst', 1), { size: 19, fill: COL.good, anchor: 'middle' });
  }],

  ['prog', 'Прогрессия закрытой цепи', (m) => {
    const p = panel(0);
    txt(p, 'как усложнять упражнения закрытой цепи', 800, 76, m('prog'), { size: 30, weight: 700, fill: COL.chalk, anchor: 'middle' });
    const R = [['вес', 'частичный → полный → + груз; руки: стена → облегчённые → обычные отжимания'], ['площадь опоры', 'широкая → узкая; две ноги → одна'], ['опора', 'неподвижная → скользящая; устойчивая → качающаяся, мяч; твёрдая → мягкая; ниже → выше'], ['равновесие', 'с поддержкой → без; глаза открыты → закрыты'], ['размах и плоскость', 'малый → большой; короткая дуга → полная; одна плоскость → несколько: вперёд, назад, диагональ, вбок'], ['скорость', 'медленно → быстро; потом плиометрика и ловкость (глава 23)']];
    R.forEach(([a, b], i) => {
      const y = 130 + i * 122, g = G(p, { o: 0 });
      mk('rect', { x: 80, y, width: 1440, height: 106, rx: 16, fill: PANEL, stroke: CKC, 'stroke-width': 2 }, g);
      mk('circle', { cx: 130, cy: y + 53, r: 26, fill: CKC }, g);
      T(g, String(i + 1), { x: 130, y: y + 63, size: 28, weight: 700, fill: COL.board, anchor: 'middle' });
      T(g, a, { x: 180, y: y + 62, size: 26, weight: 700, fill: CKC });
      put(para(g, b, 460, y + 46, null, { size: 23, maxW: 1030 }), { o: 1 });
      show(g, m('p' + (i + 1)));
    });
  }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Открытая цепь — кисть или стопа свободны, обычно один сустав; закрытая — тело движется над опорой.', 'w1'],
     ['Термины спорные, но в книге их используют.', 'w2'],
     ['Открытая — изоляция и контроль; закрытая — сжатие суставов, равновесие; выбирают по задаче.', 'w3'],
     ['Закрытую цепь усложняют: вес, опора, неустойчивость, равновесие, размах, плоскости, скорость.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 220 + i * 140, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 31, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-ckcprog', prompt: ['Это усложнение или упрощение упражнения закрытой цепи?'],
    build: grid([
      { parts: ['С двух ног — на одну'], ans: ['up'], why: 'Меньше площадь опоры — сложнее.' },
      { parts: ['С пола — на качающуюся доску'], ans: ['up'], why: 'Неустойчивая опора — сложнее.' },
      { parts: ['С закрытыми глазами — на открытые'], ans: ['down'], why: 'Это упрощение.' },
      { parts: ['От полной опоры — к опоре на брусья'], ans: ['down'], why: 'Меньше вес на ноге — проще.' },
      { parts: ['Шаг на ступеньку вперёд — затем вбок'], ans: ['up'], why: 'Из сагиттальной плоскости во фронтальную — сложнее.' },
    ], [['up', 'Усложнение', CKC], ['down', 'Упрощение', COL.whole]], { multi: false, text: true }),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-cast', prompt: ['Перелом большеберцовой кости, нога в длинной гипсовой повязке, нагрузка на ногу ограничена несколько недель. Что можно начать?'],
    build: choice([
      ['Упражнения для бедра в открытой цепи с постепенным усложнением'],
      ['Приседания с полной нагрузкой на ногу'],
      ['Ничего, пока не снимут гипс'],
      ['Прыжки на одной ноге'],
    ], 0, 'Когда опора запрещена, открытая цепь для соседних суставов — до разрешения частичной нагрузки.',
    [null, 'Опора на ногу ограничена.', 'Бедро можно тренировать уже сейчас.', 'Это высокая ударная нагрузка, она запрещена.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
