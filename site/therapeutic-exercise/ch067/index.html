const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
// A standing figure raising the near arm forward (shoulder flexion) with the anterior deltoid on the shoulder.
// The resistance arrow presses on the distal humerus toward extension. Returns { f, dl, arrow }.
function flexFig(p, x, gy, s, t0) {
  const f = fig(p, { x, y: gy - 182 * s, s, o: 0, pose: { aN: 4, eN: 4 } });
  const dl = muscleOn(f, ['Sh', 'H', 4, -14], ['Sh', 'EN', 38, -9], { after: 'hdN', w: 12 });
  const arrow = path(p, '', { stroke: RES, 'stroke-width': 7 }, { o: 0 });
  f.onSet.push(() => {
    const E = onStage(f, 'EN'), S = onStage(f, 'Sh'), dx = E[0] - S[0], dy = E[1] - S[1], L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L;
    const nx = -uy, ny = ux, v = w => w.toFixed(1);   // toward extension (back and down) for a figure facing right
    const b = [E[0] - nx * 18, E[1] - ny * 18], a = [b[0] - nx * 80, b[1] - ny * 80];
    arrow.setAttribute('d', `M${v(a[0])} ${v(a[1])}L${v(b[0])} ${v(b[1])}M${v(b[0] - nx * 16 - ny * 11)} ${v(b[1] - ny * 16 + nx * 11)}L${v(b[0])} ${v(b[1])}L${v(b[0] - nx * 16 + ny * 11)} ${v(b[1] - ny * 16 - nx * 11)}`);
  });
  f.set({});
  show(f.g, t0);
  return { f, dl, arrow };
}
// A strip of sets and rests (as in lesson 61).
function setStrip(p, x, y, blocks, t0, { h = 50, n = 10 } = {}) {
  const g = G(p, { o: 0 });
  let cx = x;
  blocks.forEach(([k, w, lab]) => {
    if (k === 's') {
      mk('rect', { x: cx, y, width: w, height: h, rx: 10, fill: mix(STR, COL.board, .6), stroke: STR, 'stroke-width': 2 }, g);
      for (let i = 0; i < n; i++) path(g, `M${cx + (i + .5) * w / n} ${y + 10}V${y + h - 10}`, { stroke: STR, 'stroke-width': 4 });
    } else mk('rect', { x: cx + 4, y: y + h / 2 - 3, width: w - 8, height: 6, rx: 3, fill: COL.dim }, g);
    if (lab) T(g, lab, { x: cx + w / 2, y: y + h + 28, size: 20, fill: k === 's' ? STR : COL.dim, anchor: 'middle' });
    cx += w;
  });
  show(g, t0);
  return g;
}

    const sheet = G(p, { o: 0 });
    mk('rect', { x: 1000, y: 140, width: 220, height: 260, rx: 10, fill: '#ece8dc' }, sheet);
    [180, 220, 260].forEach(y => path(sheet, `M1020 ${y}H1200`, { stroke: '#9a9483', 'stroke-width': 3 }));
    const mini = fig(sheet, { x: 1110, y: 375 - 182 * .3, s: .3, col: '#6f6a5c', pose: { aN: 4, eN: 100 } });
    T(sheet, 'дома — письменно и с рисунками', { x: 1110, y: 440, size: 22, fill: COL.good, anchor: 'middle', weight: 600 });
    show(sheet, m('instr', 4));
    infoCard(p, 80, 470, 700, 250, 'наблюдение', 'исправлять положение, стабилизацию, скорость; следить за утомлением; ответ до, во время и после; жизненные показатели; предосторожности — урок 68', COL.whole, m('mon'), { size: 22 });
    infoCard(p, 820, 470, 700, 250, 'заминка (cool-down)', 'ритмичные движения без сопротивления — махи руками, ходьба, велотренажёр — и мягкая растяжка', COL.good, m('cool'), { size: 22 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-impl', prompt: ['Верно или нет?'],
    build: grid([
      { parts: ['Сопротивление обычно прикладывают у дистального конца сегмента'], ans: ['t'], why: 'Так наибольший момент при наименьшем сопротивлении.' },
      { parts: ['При эксцентрической работе сопротивление направлено против движения'], ans: ['f'], why: 'В ту же сторону, что и движение.' },
      { parts: ['Разминку делают с сопротивлением'], ans: ['f'], why: 'Без сопротивления.' },
      { parts: ['Ручное сопротивление эффективнее перпендикулярно сегменту'], ans: ['t'], why: 'Да, по всей дуге.' },
      { parts: ['Заминка — ритмичные движения без сопротивления и мягкая растяжка'], ans: ['t'], why: 'Да.' },
    ], TF, { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Обследование, исходные значения, оценка уместности, переоценка.', 'w1'],
     ['Подготовка: виды и оборудование, цели, согласие, одежда, опора, показ.', 'w2'],
     ['R — дистально; против движения (конц.) или по движению (эксц.); стабилизация — проксимально.', 'w3'],
     ['8–12 повторений, второй подход; простые слова; разминка и заминка.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 220 + i * 140, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 31, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-adjust', prompt: ['Что сделать?'],
    build: grid([
      { parts: ['Пациент делает только 6 повторений из целевых 8–12'], ans: ['less'], why: 'Меньше 8 — уменьшить сопротивление.' },
      { parts: ['12 повторений даются легко, программа только началась'], ans: ['more'], why: 'Сначала увеличивают повторения или подходы.' },
      { parts: ['Поднимая гантель, пациент поднимает и плечо'], ans: ['fix'], why: 'Обходное движение — поправить стабилизацию.' },
      { parts: ['Отводя ногу лёжа на боку, пациент сгибает бедро'], ans: ['fix'], why: 'Выравнивание (урок 60).' },
    ], [['less', 'Меньше сопротивление', COL.bad], ['more', 'Больше повторений или подход', COL.task], ['fix', 'Поправить выравнивание и стабилизацию', STABC]], { multi: false, text: true }),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-home', prompt: ['Как лучше оформить упражнение для домашней программы?'],
    build: choice([
      ['Простыми словами с понятным рисунком: «Согните и разогните локоть, 8–12 раз, 2 подхода»'],
      ['«Флексия-экстензия в локтевом суставе, 2 × 10ПМ»'],
      ['Только устно, без записи'],
      ['Ссылку на учебник по анатомии'],
    ], 0, 'Инструкции — простые, без жаргона; дома — письменно и с рисунками.',
    [null, 'Медицинские термины пациенту непонятны.', 'Домашнюю программу дают письменно и с рисунками.', 'Нужны понятные указания, а не теория.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
