const WARN = COL.int, STOP = COL.bad;
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
// A row of a list with a coloured marker.
function row(p, x, y, w, s, col, t0, { size = 22, h = 56 } = {}) {
  const g = G(p, { o: 0 });
  mk('rect', { x, y, width: w, height: h, rx: 12, fill: PANEL, stroke: col, 'stroke-width': 2 }, g);
  mk('circle', { cx: x + 24, cy: y + h / 2, r: 8, fill: col }, g);
  put(para(g, s, x + 44, y + h / 2 + size * .35, null, { size, maxW: w - 60 }), { o: 1 });
  show(g, t0);
  return g;
}
// A front-view figure standing (flatFig upright) with a deltoid on the near shoulder; abd(th, lean, hike).
function frontFig(p, x, y, s, t0) {
  const f = flatFig(p, x, y, s, t0);
  const del = muscleEl(f.top, { rest: 92, w: 16 });
  f.abd = (th, lean = 0, hike = 0) => {
    f.S = [84, -168 - hike]; f.arm(th);
    put(f.g, { r: lean });
    const E = f.pts.E;
    del.set([f.S[0] - 6, f.S[1] - 14], [lerp(f.S[0], E[0], .5), lerp(f.S[1], E[1], .5)]);
  };
  f.del = del;
  f.abd(6);
  return f;
}

    txt(p, 'окончательного лечения пока нет', 430, 640, m('sleeve', 3), { size: 24, fill: COL.task, anchor: 'middle', weight: 700 });
  }],

  ['frac', 'Патологический перелом', (m) => {
    const p = panel(0), GY = 820, s = 1.15;
    txt(p, 'патологический перелом и остеопороз', 800, 76, m('frac'), { size: 30, weight: 700, fill: COL.chalk, anchor: 'middle' });
    ground(p, 80, 460, GY, m('site', -.5));
    const f = fig(p, { x: 270, y: GY - 182 * s, s, o: 0 });
    show(f.g, m('site', -.5));
    const at = (a, b, k, off) => { const A = f.pts[a], B = f.pts[b], dx = B[0] - A[0], dy = B[1] - A[1], L = Math.hypot(dx, dy); return figPt(f, [A[0] + dx * k - dy / L * off, A[1] + dy * k + dx / L * off]); };
    [[at('H', 'Sh', .6, 22), 'позвонки'], [at('H', 'KN', .1, -4), 'бедро'], [onStage(f, 'WN'), 'запястье'], [at('H', 'Sh', .78, -18), 'рёбра']].forEach(([P, s2], i) => {
      const g = G(p, { x: P[0], y: P[1], o: 0 });
      mk('circle', { r: 16, fill: STOP, 'fill-opacity': .4, stroke: STOP, 'stroke-width': 3 }, g);
      show(g, m('site', .4 + i * .5));
      const right = i === 2, ly = P[1] + [14, 8, 34, -20][i], lx = right ? P[0] + 60 : 196;
      show(path(p, `M${P[0] + (right ? 14 : -14)} ${P[1]}L${right ? lx - 6 : lx + 6} ${ly - 7}`, { stroke: STOP, 'stroke-width': 2 }, { o: 0 }), m('site', .4 + i * .5));
      txt(p, s2, lx, ly, m('site', .4 + i * .5), { size: 21, fill: STOP, weight: 600, anchor: right ? 'start' : 'end' });
    });
    ['после менопаузы (первичный)', 'иммобилизация, бездействие', 'ограничение опоры', 'кортикостероиды, иммунодепрессанты'].forEach((s2, i) => pill(p, s2, 680, 150 + i * 56, m('risk', .5 + i * .8), { col: WARN, size: 21 }));
    const R = [['интенсивность', '40–60% от 1ПМ → 60–<80% при необходимости', 'r1'], ['объём, частота', '6–8 недель: 1 подход × 8–12 → 3–4 подхода; 2–3 раза в неделю', 'r2'], ['с опорой, без ударов', 'выпады, шаг на ступеньку с грузом; без прыжков и быстрых движений', 'r3'], ['позвоночник, бёдра', 'без наклона с поворотом и сгибания против сопротивления; без скручиваний', 'r4'], ['безопасность', 'держаться за опору; высокий риск падений — сидя; малые группы', 'r5']];
    R.forEach(([a, b, k], i) => {
      const y = 400 + i * 92, g = G(p, { o: 0 });
      mk('rect', { x: 480, y, width: 1060, height: 80, rx: 14, fill: PANEL, stroke: COL.good, 'stroke-width': 2 }, g);
      T(g, a, { x: 500, y: y + 48, size: 22, weight: 700, fill: COL.good });
      put(para(g, b, 740, y + 34, null, { size: 21, maxW: 780 }), { o: 1 });
      show(g, m(k));
    });
    infoCard(p, 940, 120, 600, 260, 'силовые упражнения нужны', 'они стимулируют кость; груз — для перегрузки, но не для перелома', COL.good, m('good'), { size: 22 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-osteo', prompt: ['Пациентке 70 лет, остеопороз позвоночника. Какое упражнение исключить?'],
    build: choice([
      ['Наклоны корпуса вперёд с поворотом против сопротивления'],
      ['Выпады с лёгкими гантелями, держась за опору'],
      ['Шаг на низкую ступеньку'],
      ['Разгибание спины без сопротивления'],
    ], 0, 'Сгибание с поворотом и сгибание против сопротивления в конце объёма грозят компрессионным переломом позвонка.',
    [null, 'Это низкоударная нагрузка с опорой — подходит.', 'Подходит: опора без ударов.', 'Разгибание не нагружает переднюю часть позвонков.']),
  }], done) }],

  ['contra', 'Противопоказания', (m) => {
    const p = panel(0);
    txt(p, 'противопоказания', 800, 76, m('contra'), { size: 30, weight: 700, fill: COL.chalk, anchor: 'middle' });
    txt(p, 'их немного: правильный вид упражнения и малая начальная интенсивность', 800, 120, m('contra', 1), { size: 23, fill: COL.dim, anchor: 'middle' });
    infoCard(p, 60, 160, 480, 420, 'боль', 'сильная боль при движении без нагрузки — не начинать динамику · острая боль при изометрии против сопротивления — не начинать · боль не уходит при меньшем грузе — прекратить', STOP, m('pain'), { size: 22 });
    infoCard(p, 560, 160, 480, 420, 'воспаление', 'Гийен — Барре (острый), полимиозит, дерматомиозит — абсолютно · острое воспаление сустава — без динамики; мягкие установочные можно', STOP, m('infl'), { size: 22 });
    infoCard(p, 1060, 160, 480, 420, 'сердце и лёгкие', 'тяжёлая ИБС, кардит, кардиомиопатия, сердечная недостаточность, неконтролируемые гипертензия или аритмии', STOP, m('card'), { size: 22 });
    // after a myocardial infarction or a bypass graft: at least 5 weeks, 4 of them supervised endurance rehabilitation
    const x0 = 160, W = 1280, X = w => x0 + w / 6 * W, g = G(p, { o: 0 });
    path(g, `M${x0} 740H${x0 + W}`, { stroke: COL.dim, 'stroke-width': 3 });
    for (let w = 0; w <= 6; w++) T(g, w + ' нед.', { x: X(w), y: 780, size: 19, fill: COL.dim, anchor: 'middle' });
    mk('rect', { x: X(.5), y: 700, width: X(4.5) - X(.5), height: 30, rx: 8, fill: COL.whole, 'fill-opacity': .4 }, g);
    T(g, 'реабилитация на выносливость под наблюдением', { x: X(2.5), y: 690, size: 20, fill: COL.whole, anchor: 'middle' });
    mk('rect', { x: X(5), y: 700, width: X(6) - X(5), height: 30, rx: 8, fill: COL.good, 'fill-opacity': .5 }, g);
    T(g, 'силовые — с разрешения врача', { x: X(5.5), y: 690, size: 20, fill: COL.good, anchor: 'middle' });
    T(g, 'инфаркт / шунтирование', { x: x0, y: 830, size: 21, fill: STOP, weight: 700 });
    show(g, m('mi'));
  }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Без боли, без задержки дыхания, без рывков и обходных движений; осторожно — дети, пожилые, остеопороз.', 'w1'],
     ['Перетренированность обратима; слабость от перегрузки при нервно-мышечных болезнях — может быть стойкой.', 'w2'],
     ['Отсроченная боль: с 12–24 ч, пик на 2–3-й день; микротравма; эффект повторной нагрузки.', 'w3'],
     ['Противопоказания: острое воспаление, миозиты, тяжёлые болезни сердца и лёгких; после инфаркта — ≥ 5 недель.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 220 + i * 140, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 31, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-contra', prompt: ['Можно ли начинать упражнения с сопротивлением?'],
    build: grid([
      { parts: ['Острое воспаление коленного сустава — динамические упражнения'], ans: ['n'], why: 'Противопоказаны: усилят воспаление.' },
      { parts: ['Острое воспаление сустава — мягкие установочные упражнения'], ans: ['y'], why: 'Допустимы, почти без сопротивления.' },
      { parts: ['Полимиозит'], ans: ['n'], why: 'Абсолютно противопоказаны.' },
      { parts: ['Три недели после инфаркта'], ans: ['n'], why: 'Не раньше 5 недель и с разрешения врача.' },
      { parts: ['Контролируемая гипертензия, врач разрешил — малая интенсивность'], ans: ['y'], why: 'После разрешения — малая интенсивность и ритмичное дыхание.' },
    ], [['y', 'Можно', COL.good], ['n', 'Нельзя', STOP]], { multi: false, text: true }),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-numbers', prompt: ['Вспомните цифры.'],
    build: blanks([
      { parts: ['Отсроченная боль начинается через ', { box: '12' }, '–24 ч'], why: '12–24 ч.' },
      { parts: ['Пик отсроченной боли — через 48–', { box: '72' }, ' ч'], why: '48–72 ч.' },
      { parts: ['Остеопороз: начинать с 40–', { box: '60' }, '% от 1ПМ'], why: '40–60%.' },
      { parts: ['После инфаркта силовые — не раньше ', { box: '5' }, ' недель'], why: 'Минимум 5 недель и разрешение врача.' },
    ]),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
