// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch071/cards.ru.json
const CARDS_SHORT = {
  "ПНФ — проприоцептивное нервно-мышечное облегчение\nфункциональные диагональные движения + приёмы облегчения → двигательный ответ, контроль, функция": "диагонали + приёмы облегчения → контроль",
  "Кабат, Нотт, Восс · 1940–50-е годы\nанализ функциональных движений + теории развития, управления и обучения движениям + нейрофизиология": "функциональные движения + нейрофизиология",
  "не только неврология\nсила, выносливость, устойчивость, подвижность, контроль; от изометрии на ранней стадии заживления до быстрых диагоналей против максимального сопротивления": "сила, выносливость, устойчивость, контроль",
  "сильные группы облегчают слабые\nдиагонали + сенсорные сигналы": "диагонали + сенсорные сигналы",
  "диагональные схемы\nмногосуставные, многоплоскостные, диагональные и вращательные движения; работают многие группы мышц": "многосуставные и вращательные движения",
  "две диагонали: D1 и D2\nдля руки и для ноги; каждая — в сгибание и в разгибание": "рука и нога; сгибание и разгибание",
  "название — по плечу или бедру в конце\nсгибание или разгибание + отведение или приведение + наружное или внутреннее вращение": "сгибание + отведение + вращение",
  "одна или две конечности\nсимметрично, асимметрично, взаимно; схемы для лопатки и таза; перекаты, ползание, ходьба": "симметрично, асимметрично, взаимно",
  "лучше всего — руки терапевта\nбольше всего сенсорных сигналов; можно и механическое сопротивление": "больше всего сенсорных сигналов",
  "ручные контакты\nнад агонистами или их сухожилиями: один дистально, другой проксимальнее. Сопротивление разгибанию кисти — рука на тыле кисти": "над агонистами: дистально и проксимальнее",
  "максимальное сопротивление\nнаибольшее, при котором движение плавное и безболезненное; меняется по ходу схемы": "движение плавное и безболезненное",
  "положение терапевта\nвдоль диагонали, лицом к конечности; широкая опора, сопротивление весом тела; двигаться вместе с пациентом": "вдоль диагонали, лицом к конечности",
  "растяжение\nисход — работающие мышцы удлинены; вращением «закрутить» сегмент, выбрать слабину": "мышцы удлинены",
  "рефлекс на растяжение\nбыстро — чуть дальше точки напряжения, и сразу сопротивление; можно повторять по ходу": "сразу сопротивление",
  "рефлекс — нельзя\nранняя стадия заживления после травмы или операции; острый или активный артрит": "раннее заживление, артрит",
  "дистальное → проксимальное\nдистальные компоненты завершаются к середине схемы": "к середине схемы",
  "тракция\nлёгкое разведение суставных поверхностей, обычно в сгибании: тормозит боль": "разведение — тормозит боль",
  "аппроксимация\nмягкое сжатие: совместное сокращение, устойчивость": "сжатие → устойчивость",
  "команды и взгляд\nрезкая команда — вместе с быстрым растяжением; взгляд следит за рукой": "взгляд следит за рукой",
};
// cards-short end

const RES = COL.whole, SKIN = '#d8d1c1', THC = '#b9cfe0', D1C = COL.task, D2C = COL.real;
// A card with a title and labelled rows [[label, text], ...]; its height follows the text. Shown at t0, hidden at t1.
function stepCard(p, x, y, w, title, rows, col, t0, t1 = null) {
  const g = G(p, { o: 0 }), box = roundBox(g, x, y, w, 100, col, PANEL, 2.5);
  T(g, title, { x: x + 24, y: y + 46, size: 30, weight: 700, fill: col });
  let yy = y + 60;
  rows.forEach(([lab, str]) => {
    yy += 34;
    T(g, lab, { x: x + 24, y: yy, size: 19, weight: 700, fill: COL.dim });
    const pr = put(para(g, str, x + 24, yy + 30, null, { size: 22, maxW: w - 48, fill: lab === 'команда' ? COL.task : COL.chalk }), { o: 1 });
    yy += 30 + pr._h - 22 * 1.32 + 6;
  });
  box.setAttribute('height', yy - y + 30);
  if (t0 !== null) show(g, t0, .3);
  if (t1 !== null) hide(g, t1, .3);
  return g;
}
/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'ПНФ', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 6 · Урок 71', { x: 800, y: 170, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'ПНФ', { x: 800, y: 255, size: 56, weight: 600, anchor: 'middle' });
    T(g, 'диагонали и базовые процедуры', { x: 800, y: 320, size: 46, weight: 600, anchor: 'middle', fill: COL.dim });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'проприоцептивное нервно-мышечное облегчение', 800, 400, m('sub'), { size: 30, fill: COL.task, anchor: 'middle', weight: 600 });
    const art = G(scene, { o: 0 });
    const f = pnfFig(art, 800, 650, .4, 0);
    drive(f.arm, PAT.armD1, .4, Math.max(4, D - 1.4), 2);
    show(art, .3);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);
  }],

  ['what', 'Что такое ПНФ', (m, D) => {
    const p = panel(0);
    infoCard(p, 60, 100, 800, 200, 'ПНФ — проприоцептивное нервно-мышечное облегчение', 'функциональные диагональные движения + приёмы облегчения → двигательный ответ, контроль, функция', D1C, m('what'), { size: 23 });
    infoCard(p, 60, 320, 800, 160, 'Кабат, Нотт, Восс · 1940–50-е годы', 'анализ функциональных движений + теории развития, управления и обучения движениям + нейрофизиология', COL.dim, m('hist'), { size: 22 });
    infoCard(p, 60, 500, 800, 200, 'не только неврология', 'сила, выносливость, устойчивость, подвижность, контроль; от изометрии на ранней стадии заживления до быстрых диагоналей против максимального сопротивления', COL.good, m('use'), { size: 22 });
    infoCard(p, 60, 720, 800, 140, 'сильные группы облегчают слабые', 'диагонали + сенсорные сигналы', RES, m('cues'), { size: 22 });
    const f = pnfFig(p, 1210, 470, .62, m('what', .3));
    const rg = pnfRig(p, f, f.arm, { t0: m('cues') });
    const t0 = m('what', .6);
    drive(f.arm, PAT.armD2, t0, D - t0 - .3, reps(D - t0), { cb: rg.cb(PAT.armD2, false, SPEC.armD2F) });
    ['проприоцептивные', 'кожные', 'зрительные', 'слуховые'].forEach((s, i) => pill(p, s, 1060 + (i % 2) * 300, 780 + Math.floor(i / 2) * 60, m('cues', .5 + i * .35), { col: RES }));
    txt(p, 'D2 сгибание правой руки', 1210, 90, m('what', .6), { size: 23, fill: D2C, anchor: 'middle', weight: 700 });
  }],

  ['diag', 'Диагональные схемы', (m, D) => {
    const p = panel(0);
    txt(p, 'правая рука и нога · вид сверху, пациент на спине', 470, 70, m('diag'), { size: 26, weight: 700, anchor: 'middle' });
    const f = pnfFig(p, 470, 530, .74, m('diag', .3));
    pill(p, 'схема', 130, 150, m('diag', .6), { col: COL.dim });
    const guide = (limb, pt, col, lab, t0) => {
      const a = tipPos(f, limb, pt, 0), b = tipPos(f, limb, pt, 1), dx = b[0] - a[0], dy = b[1] - a[1], g = G(p, { o: 0 });
      path(g, `M${(a[0] - dx * .08).toFixed(1)} ${(a[1] - dy * .08).toFixed(1)}L${(b[0] + dx * .08).toFixed(1)} ${(b[1] + dy * .08).toFixed(1)}`, { stroke: col, 'stroke-width': 4, 'stroke-dasharray': '12 9' });
      T(g, lab, { x: b[0] + dx * .16, y: b[1] + dy * .16 + 9, size: 26, weight: 700, fill: col, anchor: 'middle' });
      show(g, t0);
    };
    const t0 = m('d12'), each = Math.max(3, (D - t0 - .4) / 4);
    [[f.arm, PAT.armD1, D1C, 'D1'], [f.arm, PAT.armD2, D2C, 'D2'], [f.leg, PAT.legD1, D1C, 'D1'], [f.leg, PAT.legD2, D2C, 'D2']].forEach(([limb, pt, col, lab], i) => {
      guide(limb, pt, col, lab, t0 + i * each);
      drive(limb, pt, t0 + i * each, each, 1);
    });
    infoCard(p, 930, 110, 620, 180, 'диагональные схемы', 'многосуставные, многоплоскостные, диагональные и вращательные движения; работают многие группы мышц', COL.chalk, m('diag'), { size: 22 });
    infoCard(p, 930, 310, 620, 150, 'две диагонали: D1 и D2', 'для руки и для ноги; каждая — в сгибание и в разгибание', D1C, m('d12'), { size: 22 });
    infoCard(p, 930, 480, 620, 200, 'название — по плечу или бедру в конце', 'сгибание или разгибание + отведение или приведение + наружное или внутреннее вращение', D2C, m('name'), { size: 22 });
    infoCard(p, 930, 700, 620, 170, 'одна или две конечности', 'симметрично, асимметрично, взаимно; схемы для лопатки и таза; перекаты, ползание, ходьба', COL.good, m('bil'), { size: 22 });
  }],

  ['table', 'Компоненты схем', (m) => {
    const p = panel(0);
    txt(p, 'компоненты схем (по таблице книги)', 800, 66, m('table'), { size: 28, weight: 700, anchor: 'middle' });
    const tbl = (x0, y0, cols, rows, rowH, t0s, tH) => {
      const W = cols.reduce((a, c) => a + c[1], 0), hg = G(p, { o: 0 });
      mk('rect', { x: x0, y: y0, width: W, height: 40, rx: 10, fill: COL.board, stroke: EDGE, 'stroke-width': 2 }, hg);
      let x = x0; cols.forEach(([h, w]) => { T(hg, h, { x: x + 12, y: y0 + 28, size: 19, weight: 700, fill: COL.dim }); x += w; });
      show(hg, tH);
      rows.forEach(([col, cells], i) => {
        const g = G(p, { o: 0 }), y = y0 + 46 + i * rowH;
        mk('rect', { x: x0, y, width: W, height: rowH - 6, rx: 10, fill: PANEL, stroke: col, 'stroke-width': 2 }, g);
        let xx = x0;
        cells.forEach((c, j) => { put(para(g, c, xx + 12, y + 27, null, { size: j ? 20 : 21, weight: j ? 500 : 700, fill: j ? COL.chalk : col, maxW: cols[j][1] - 22 }), { o: 1 }); xx += cols[j][1]; });
        show(g, t0s[i]);
      });
    };
    txt(p, 'рука', 50, 112, m('table', .5), { size: 22, weight: 700, fill: COL.dim });
    tbl(50, 122, [['схема', 170], ['плечо', 330], ['лопатка', 300], ['предплечье', 170], ['запястье', 280], ['пальцы', 250]], [
      [D1C, ['D1 сгибание', 'сгибание, приведение, наружное вращение', 'подъём, отведение, поворот вверх', 'супинация', 'сгибание, лучевое отведение', 'сгибание, приведение']],
      [D1C, ['D1 разгибание', 'разгибание, отведение, внутреннее вращение', 'опускание, приведение, поворот вниз', 'пронация', 'разгибание, локтевое отведение', 'разгибание, отведение']],
      [D2C, ['D2 сгибание', 'сгибание, отведение, наружное вращение', 'подъём, отведение, поворот вверх', 'супинация', 'разгибание, лучевое отведение', 'разгибание, отведение']],
      [D2C, ['D2 разгибание', 'разгибание, приведение, внутреннее вращение', 'опускание, приведение, поворот вниз', 'пронация', 'сгибание, локтевое отведение', 'сгибание, приведение']],
    ], 80, [m('u1'), m('u2'), m('u3'), m('u4')], m('table', .5));
    txt(p, 'нога', 50, 528, m('legs'), { size: 22, weight: 700, fill: COL.dim });
    tbl(50, 538, [['схема', 170], ['бедро', 480], ['голеностоп', 520], ['пальцы', 330]], [
      [D1C, ['D1 сгибание', 'сгибание, приведение, наружное вращение', 'тыльное сгибание, инверсия', 'разгибание']],
      [D1C, ['D1 разгибание', 'разгибание, отведение, внутреннее вращение', 'подошвенное сгибание, эверсия', 'сгибание']],
      [D2C, ['D2 сгибание', 'сгибание, отведение, внутреннее вращение', 'тыльное сгибание, эверсия', 'разгибание']],
      [D2C, ['D2 разгибание', 'разгибание, приведение, наружное вращение', 'подошвенное сгибание, инверсия', 'сгибание']],
    ], 56, [m('legs', .4), m('legs', 1.2), m('legs', 2), m('legs', 2.8)], m('legs'));
    txt(p, 'локоть и колено в любой схеме — сгибание или разгибание', 800, 830, m('u4', 3), { size: 23, fill: COL.task, anchor: 'middle', weight: 600 });
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-uepat', prompt: ['Какая это схема руки (положение в конце)?'],
    build: grid([
      { parts: ['Рука через лицо: плечо согнуто, приведено, повёрнуто наружу; супинация'], ans: ['d1f'], why: 'Конец D1 сгибания — «через лицо».' },
      { parts: ['Рука внизу и в стороне: разгибание, отведение, внутреннее вращение; пронация'], ans: ['d1e'], why: 'Конец D1 разгибания — исход D1 сгибания.' },
      { parts: ['Рука вверху и в стороне, большой палец смотрит в пол'], ans: ['d2f'], why: 'Конец D2 сгибания: сгибание, отведение, наружное вращение.' },
      { parts: ['Рука внизу поперёк тела: разгибание, приведение, внутреннее вращение'], ans: ['d2e'], why: 'Конец D2 разгибания — исход D2 сгибания.' },
    ], [['d1f', 'D1 сгибание', D1C], ['d1e', 'D1 разгибание', COL.task], ['d2f', 'D2 сгибание', D2C], ['d2e', 'D2 разгибание', RES]], { multi: false, text: true }),
  }], done) }],

  ['proc', 'Базовые процедуры', (m, D) => {
    const p = panel(0);
    txt(p, 'D1 сгибание правой руки с терапевтом', 450, 70, m('proc'), { size: 26, weight: 700, anchor: 'middle' });
    const f = pnfFig(p, 500, 520, .74, m('proc', .3));
    const rg = pnfRig(p, f, f.arm, { t0: m('mc'), ther: m('pos') });
    const t0 = m('proc', .6);
    drive(f.arm, PAT.armD1, t0, D - t0 - .3, reps(D - t0), { cb: rg.cb(PAT.armD1, false, SPEC.armD1F) });
    infoCard(p, 880, 100, 670, 150, 'лучше всего — руки терапевта', 'больше всего сенсорных сигналов; можно и механическое сопротивление', COL.chalk, m('proc'), { size: 22 });
    infoCard(p, 880, 270, 670, 220, 'ручные контакты', 'над агонистами или их сухожилиями: один дистально, другой проксимальнее. Сопротивление разгибанию кисти — рука на тыле кисти', THC, m('mc'), { size: 22 });
    infoCard(p, 880, 510, 670, 170, 'максимальное сопротивление', 'наибольшее, при котором движение плавное и безболезненное; меняется по ходу схемы', RES, m('max'), { size: 22 });
    infoCard(p, 880, 700, 670, 170, 'положение терапевта', 'вдоль диагонали, лицом к конечности; широкая опора, сопротивление весом тела; двигаться вместе с пациентом', COL.good, m('pos'), { size: 22 });
  }],

  ['stretch', 'Растяжение, тракция, команды', (m, D) => {
    const p = panel(0);
    const f = pnfFig(p, 320, 450, .6, m('stretch'));
    const rg = pnfRig(p, f, f.arm, { t0: m('reflex', 1) });
    const pt = PAT.armD1, cb = rg.cb(pt, false, SPEC.armD1F);
    // the start position lengthens the working muscles; a twist takes up the slack
    toPose(f.arm, pt, 0, m('stretch', .4), 1.2, true);
    const h0 = tipPos(f, f.arm, pt, 0);
    const tw0 = G(p, {});
    arrowTo(tw0, [h0[0] - 30, h0[1] + 34], [h0[0] + 32, h0[1] + 30], m('stretch', 1.4), { c: [h0[0] - 52, h0[1] - 40], col: D1C, w: 4 });
    txt(tw0, 'закрутить', h0[0], h0[1] + 76, m('stretch', 1.6), { size: 21, fill: D1C, anchor: 'middle', weight: 700 });
    hide(tw0, m('reflex'), .3);
    // quick stretch a little past the point of tension, then resistance
    let v0 = null;
    prog(q => { if (!v0) v0 = [f.arm.v, f.arm.t]; f.arm.set(add3(v0[0], [-.22, .06, -.1], Math.sin(Math.PI * q)), v0[1]); }, m('reflex', .3), .35, lin);
    const qs = pill(p, 'быстрое растяжение → ответ', 320, 760, m('reflex', .3), { col: D1C });
    hide(qs, m('prec'), .3);
    drive(f.arm, pt, m('reflex', .8), Math.max(3, m('prec') - m('reflex', 1.1)), 1, { cb });
    // timing: distal → proximal
    const bars = G(p, { o: 0 });
    const bar = (y, lab, col) => { T(bars, lab, { x: 70, y: y - 10, size: 20, fill: COL.dim, weight: 600 }); mk('rect', { x: 70, y, width: 500, height: 16, rx: 8, fill: COL.board, stroke: EDGE, 'stroke-width': 2 }, bars); return mk('rect', { x: 70, y, width: 0, height: 16, rx: 8, fill: col }, bars); };
    const bD = bar(770, 'кисть, запястье, предплечье', D1C), bP = bar(840, 'плечо', RES);
    show(bars, m('time')); hide(bars, m('tr'), .3);
    drive(f.arm, pt, m('time', .2), Math.max(3, m('tr') - m('time', .5)), Math.max(1, Math.round((m('tr') - m('time')) / 5)), { cb: (e, act) => { cb(e, act); bD.setAttribute('width', (act ? 500 * clamp(2 * e, 0, 1) : 0).toFixed(1)); bP.setAttribute('width', (act ? 500 * e : 0).toFixed(1)); } });
    // traction and approximation along the limb
    toPose(f.arm, pt, .15, m('tr', .1), .8);
    prog(() => cb(.15, false), m('tr', .1), .8, lin);
    const [v15] = patPose(pt, .15), at = d => f.stage([f.arm.O[0] + v15[0] * d, f.arm.O[1] + v15[1] * d]);
    const trG = arrowTo(p, at(240), at(330), m('tr', 1), { col: COL.good, w: 6 });
    txt(trG, 'тракция', at(345)[0], at(345)[1] + 30, m('tr', 1.2), { size: 21, fill: COL.good, anchor: 'middle', weight: 700 });
    hide(trG, m('app'), .3);
    const apG = arrowTo(p, at(340), at(250), m('app', .3), { col: COL.task, w: 6 });
    txt(apG, 'аппроксимация', at(345)[0], at(345)[1] + 30, m('app', .5), { size: 21, fill: COL.task, anchor: 'middle', weight: 700 });
    hide(apG, m('vc'), .3);
    // commands and gaze
    const gz = G(p, { o: 0 }), gl = path(gz, '', { stroke: COL.dim, 'stroke-width': 3, 'stroke-dasharray': '7 7' });
    f.arm.onSet.push(o => { const W = o.at(2, 1); gl.setAttribute('d', `M${f.eyes[0].toFixed(1)} ${f.eyes[1].toFixed(1)}L${W[0].toFixed(1)} ${W[1].toFixed(1)}`); });
    show(gz, m('vc', 1));
    pill(p, '«Тяните!»', 470, 160, m('vc', .4), { col: D1C });
    drive(f.arm, pt, m('vc', .5), Math.max(3, D - m('vc', .8)), Math.max(1, Math.round((D - m('vc')) / 5)), { cb });
    // the cards
    const C = [['растяжение', 'исход — работающие мышцы удлинены; вращением «закрутить» сегмент, выбрать слабину', D1C, 'stretch'],

        ['команда', '«Сожмите пальцы, ладонь вверх, тяните вверх и через лицо»'],

        ['руки терапевта', 'тыл кисти; тыльная сторона предплечья у локтя'],
        ['команда', '«Раскройте кисть, к лицу; вверх и в сторону; большой палец наружу»'],

      ['d2e', PAT.armD2, true, SPEC.armD2E, 'D2 разгибание', D2C, [
