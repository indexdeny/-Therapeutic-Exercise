const MECH = COL.task, KID = COL.good, ADULT = COL.whole, METAL = '#9fb0bf';
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
// A cuff weight strapped above the ankle of figure f (follows the leg).
function cuffOn(p, f) {
  const c = G(p);
  mk('rect', { x: -15, y: -13, width: 30, height: 26, rx: 8, fill: '#5b6b78', stroke: '#2c353d', 'stroke-width': 2 }, c);
  mk('rect', { x: -15, y: -3, width: 30, height: 6, fill: '#7f909c' }, c);
  const upd = () => { const K = f.pts.KN, A = f.pts.AN, [x, y] = figPt(f, [lerp(K[0], A[0], .85), lerp(K[1], A[1], .85)]); put(c, { x, y, s: f.s, r: Math.atan2(A[1] - K[1], A[0] - K[0]) * 180 / Math.PI - 90 }); };
  f.onSet.push(upd); upd();
  return c;
}
// A cable column at x (floor GY): a pulley at the top and a weight stack that rises as the handle is pulled down.
function cableColumn(p, x, GY, t0) {
  const g = G(p, { o: 0 });
  mk('rect', { x: x - 35, y: GY - 420, width: 70, height: 420, rx: 6, fill: 'none', stroke: COL.dim, 'stroke-width': 4 }, g);
  mk('circle', { cx: x, cy: GY - 400, r: 14, fill: 'none', stroke: COL.dim, 'stroke-width': 4 }, g);
  const stack = G(g, {});
  for (let i = 0; i < 7; i++) mk('rect', { x: x - 27, y: GY - 30 - i * 22, width: 54, height: 18, rx: 3, fill: MECH, 'fill-opacity': .75 }, stack);
  const cable = path(g, '', { stroke: COL.chalk, 'stroke-width': 2.5 });
  show(g, t0);
  return { g, stack, cable, top: [x - 14, GY - 400] };
}
// A long bone of a child: shaft, ends and the two growth plates (returned to light up).
function childBone(p, cx, cy, t0) {
  const g = G(p, { o: 0 }), B = ANAT.bone, ln = mix(B, COL.board, .55);
  mk('rect', { x: cx - 18, y: cy - 120, width: 36, height: 240, rx: 14, fill: B, stroke: ln, 'stroke-width': 2 }, g);
  [-1, 1].forEach(k => mk('ellipse', { cx, cy: cy + k * 140, rx: 46, ry: 34, fill: B, stroke: ln, 'stroke-width': 2 }, g));
  const plates = [-1, 1].map(k => path(g, `M${cx - 40} ${cy + k * 118}Q${cx} ${cy + k * 108} ${cx + 40} ${cy + k * 118}`, { stroke: COL.task, 'stroke-width': 6 }));
  show(g, t0);
  return { g, plates };
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Механическое сопротивление', (m, D) => {

    const upd = () => { const W = onStage(f, 'WN'); col.cable.setAttribute('d', `M${W[0].toFixed(1)} ${W[1].toFixed(1)}L${col.top[0]} ${col.top[1]}`); put(col.stack, { y: -(W[1] - y0) * .6 }); };

    infoCard(p, 680, 290, 870, 175, 'средняя и поздняя стадия', 'сила 4/5 и выше или пациент сильнее терапевта; нагрузка намного больше ручной', COL.good, m('a2'), { size: 22 });

  }],

  ['dis', 'Недостатки', (m) => {
    const p = panel(0);
    txt(p, 'недостатки', 800, 70, m('dis'), { size: 30, weight: 700, fill: COL.bad, anchor: 'middle' });
    // constant resistance: the torque of a dumbbell peaks at one angle
    const x0 = 100, y0 = 470, W = 480, H = 260;
    chartAxes(p, x0, y0, W, H, 'момент груза', 'угол сгибания локтя →', m('d2'));
    draw(path(p, fnPath(x0, y0, W, H, t => .9 * Math.sin(Math.PI * t), .02, .98), { stroke: MECH, 'stroke-width': 5 }, { d: 0 }), m('d2', .3), 1.2);
    const pk = put(mk('circle', { cx: x0 + W / 2, cy: y0 - .9 * H, r: 10, fill: COL.bad }, p), { o: 0 }); show(pk, m('d2', 1.4));
    txt(p, 'максимум — в одной точке', x0 + W / 2 + 22, y0 - .9 * H - 10, m('d2', 1.4), { size: 22, fill: COL.bad, anchor: 'start', weight: 700 });
    txt(p, '0°', x0, y0 + 30, m('d2'), { size: 19, fill: COL.dim, anchor: 'middle' }); txt(p, '90°', x0 + W / 2, y0 + 30, m('d2'), { size: 19, fill: COL.dim, anchor: 'middle' });

    infoCard(p, 680, 630, 870, 175, 'цена и шаг нагрузки', 'оборудование дорогое; у свободных весов и тренажёров шаг задан производителем', COL.bad, m('d4'), { size: 22 });
  }],

    id: 'c-mechpm', prompt: ['Преимущество или недостаток механического сопротивления?'],

    [['разминка', COL.dim], ['гибкость', COL.good], ['силовая', MECH], ['заминка', COL.dim]].forEach(([s, c], i) => {
      const g = G(p, { o: 0 });
      mk('rect', { x: 260 + i * 280, y: 95, width: 250, height: 50, rx: 12, fill: mix(c, COL.board, .6), stroke: c, 'stroke-width': 2 }, g);
      T(g, s, { x: 385 + i * 280, y: 128, size: 22, weight: 700, anchor: 'middle' });

    // pulling and pushing groups take turns

    txt(p, '8–10 групп мышц', 230, 860, m('groups', .5), { size: 21, fill: COL.dim, anchor: 'middle' });

    // sets and rest
    const sy = 450, blocks = [['подход', 110, MECH, 1], ['отдых 2–3 мин', 140, COL.dim, 1], ['подход', 110, MECH, 1], ['отдых', 70, COL.dim, .35], ['подход', 110, MECH, .35]];
    let xx = gx;
    blocks.forEach(([s, w, c, o], i) => {
      const g = G(p, { o: 0 });
      mk('rect', { x: xx, y: sy, width: w - 6, height: 46, rx: 10, fill: mix(c, COL.board, .55), stroke: c, 'stroke-width': 2 }, g);
      T(g, s, { x: xx + (w - 6) / 2, y: sy + 30, size: 19, weight: 600, anchor: 'middle' });
      tw(g, { o }, m('sets', i * .3), .4);
      xx += w;
    });
    para(p, '2 подхода → до 4; пока одна группа отдыхает, работает другая', gx, sy + 80, m('sets', 1.5), { size: 20, fill: COL.dim, maxW: 540 });
    // a week
    ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].forEach((d, i) => {
      const on = i === 0 || i === 2 || i === 4, g = G(p, { o: 0 });
      mk('rect', { x: gx + i * 74, y: 600, width: 64, height: 56, rx: 10, fill: on ? mix(MECH, COL.board, .4) : PANEL, stroke: on ? MECH : EDGE, 'stroke-width': 2 }, g);
      T(g, d, { x: gx + i * 74 + 32, y: 636, size: 20, weight: 700, anchor: 'middle', fill: on ? COL.chalk : COL.dim });
      show(g, m('sets', 2 + i * .12));
    });
    txt(p, '2–3 раза в неделю', gx + 260, 700, m('sets', 3), { size: 23, fill: MECH, anchor: 'middle', weight: 700 });
    infoCard(p, 1040, 180, 510, 200, 'объём движений', 'весь безболезненный объём; тянущие уравновешивают толкающими; и подъём, и опускание', COL.good, m('groups'), { size: 21 });
    infoCard(p, 1040, 400, 510, 200, 'как двигаться', 'медленно или средне, ритмично, без рывков; дыхание не задерживать; лучше с партнёром', ADULT, m('style'), { size: 21 });
    infoCard(p, 1040, 620, 510, 170, 'перерыв больше 1–2 недель', 'нагрузку и объём снизить', COL.bad, m('style', 4), { size: 21 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-adultdose', prompt: ['Рекомендации для здоровых взрослых. Заполните пропуски.'],
    build: blanks([
      { parts: ['Интенсивность — от ', { box: '60' }, ' до ', { box: '80' }, ' % повторного максимума'], why: 'Умеренная интенсивность.' },
      { parts: [{ box: '8' }, '–', { box: '12' }, ' повторений в подходе'], why: 'Столько позволяет груз 60–80 %.' },
      { parts: ['Отдых между подходами — ', { box: '2' }, '–', { box: '3' }, ' минуты'], why: 'Пока отдыхает одна группа, работает другая.' },
      { parts: ['Нагрузку повышают примерно на ', { box: '5' }, ' %'], why: 'Постепенно, по мере роста силы и выносливости.' },
    ]),
  }], done) }],

  ['kids', 'Дети и подростки', (m, D) => {
    const p = panel(0);
    txt(p, 'дети и подростки', 800, 62, m('kids'), { size: 30, weight: 700, fill: KID, anchor: 'middle' });
    // body-weight squats by a child
    const GY = 480, kf = fig(p, { x: 0, y: 0, s: .62, o: 0, pose: STAND });
    const kq = muscleOn(kf, ...MUSCLE.rectus, { after: 'ftN', w: 9 });
    plant(kf, 'AN', 230, GY); show(kf.g, m('eq')); ground(p, 120, 340, GY, m('eq'));
    prog(q => { kf.set(blendPose(STAND, { ...SQUAT, t: 26, aN: 90, eN: 0, aF: 90, eF: 0 }, cyc(q, Math.max(2, Math.round((D - m('eq')) / 3))))); plant(kf, 'AN', 230, GY); kq.act(.8); }, m('eq', .3), D - m('eq', .5), lin);
    txt(p, 'вес собственного тела', 230, 530, m('eq', .3), { size: 22, fill: KID, anchor: 'middle', weight: 700 });
    // a child-sized dumbbell next to an adult one
    const dA = G(p, { x: 470, y: 420, o: 0 }), dK = G(p, { x: 470, y: 480, o: 0 });
    dumbbell(dA, 1.6); dumbbell(dK, .8);
    show(dA, m('eq', 1)); show(dK, m('eq', 1.3));
    txt(p, 'по размеру ребёнка', 470, 530, m('eq', 1.3), { size: 22, fill: KID, anchor: 'middle', weight: 700 });
    // growth plates
    const bone = childBone(p, 230, 720, m('risk'));
    bone.plates.forEach(pl => tw(pl, { c_stroke: COL.bad }, m('risk', 1.5), .5));
    txt(p, 'зоны роста', 330, 720, m('risk', 1), { size: 22, fill: COL.task, weight: 700 });
    // heat: a thermometer
    const th = G(p, { o: 0 }), tx = 520, ty = 820;
    mk('rect', { x: tx - 14, y: ty - 210, width: 28, height: 200, rx: 14, fill: COL.board, stroke: COL.chalk, 'stroke-width': 2.5 }, th);
    mk('circle', { cx: tx, cy: ty, r: 26, fill: COL.bad, stroke: COL.chalk, 'stroke-width': 2.5 }, th);
    const lvl = mk('rect', { x: tx - 8, y: ty - 60, width: 16, height: 60, rx: 8, fill: COL.bad }, th);
    show(th, m('heat'));
    prog(q => { const h = lerp(60, 190, io(q)); lvl.setAttribute('y', (ty - h).toFixed(1)); lvl.setAttribute('height', h.toFixed(1)); }, m('heat', .4), 2.5);
    txt(p, 'тепло отдаётся хуже', 560, 640, m('heat', .8), { size: 21, fill: COL.bad, weight: 700 });
    txt(p, '→ быстрее устаёт', 560, 675, m('heat', 2), { size: 21, fill: COL.chalk });
    txt(p, '→ отдых дольше', 560, 710, m('heat', 3), { size: 21, fill: COL.chalk });
    infoCard(p, 820, 110, 730, 175, 'можно и полезно', 'при правильной программе и тщательном контроле силовые тренировки детям полезны и безопасны', KID, m('kids'), { size: 22 });
    infoCard(p, 820, 300, 730, 175, 'что показано', 'рост силы, мощности, результатов; профилактика спортивных травм — под вопросом; о навыках — мало данных', ADULT, m('gain'), { size: 22 });
    infoCard(p, 820, 490, 730, 175, 'риск низкий — если по правилам', 'нарушения правил: травмы мягких тканей и зон роста', COL.bad, m('risk'), { size: 22 });
    infoCard(p, 820, 680, 730, 175, 'незрелая терморегуляция', 'дети хуже отдают тепло, быстрее устают и дольше восстанавливаются', COL.task, m('heat'), { size: 22 });
  }],

  ['box', 'Рекомендации для детей', (m) => {
    const p = panel(0);
    txt(p, 'рекомендации для детей (главное)', 800, 62, m('box'), { size: 28, weight: 700, anchor: 'middle' });
    // an age line with the child growing
    const ax = 100, aw = 1400, ay = 340;
    const seg = [['до 6–7 лет', 'только подвижная игра', .22, COL.dim, 'b1'], ['6–7 лет и старше', '≥ 60 мин в день, аэробно; кости 3 дня/нед', .3, KID, 'b1'], ['сила', 'вес собственного тела', .22, ADULT, 'b2'], ['позже', 'лёгкие веса, под контролем', .26, MECH, 'b3']];
    let xx = ax;
    seg.forEach(([a, b, w, c, k], i) => {
      const g = G(p, { o: 0 }), W = w * aw;
      mk('rect', { x: xx, y: ay, width: W - 8, height: 54, rx: 12, fill: mix(c, COL.board, .55), stroke: c, 'stroke-width': 2 }, g);
      T(g, a, { x: xx + (W - 8) / 2, y: ay + 35, size: 22, weight: 700, anchor: 'middle' });
      put(para(g, b, xx + (W - 8) / 2, ay + 92, null, { size: 20, maxW: W - 30, fill: COL.chalk, anchor: 'middle' }), { o: 1 });
      show(g, m(k, i === 1 ? 2.5 : 0));
      const kf = fig(p, { x: 0, y: 0, s: .32 + i * .1, o: 0, pose: i === 0 ? { ...STAND, aN: 60, eN: 40, aF: -30, hN: 30, kN: 40 } : STAND });
      plant(kf, 'AN', xx + (W - 8) / 2, ay - 14);
      show(kf.g, m(k, i === 1 ? 2.5 : .3));
      xx += W;
    });
    path(p, `M${ax} ${ay - 14}H${ax + aw - 8}`, { stroke: COL.faint, 'stroke-width': 3 });
    txt(p, 'до зрелости скелета — никаких околомаксимальных весов, пауэрлифтинга и бодибилдинга', 800, 500, m('b4', 4), { size: 23, fill: COL.bad, anchor: 'middle', weight: 700 });
    infoCard(p, 60, 540, 470, 320, 'контроль и техника', 'обученный взрослый рядом; разминка 5–10 мин; правильная техника без рывков; малая интенсивность; питьё', KID, m('b3'), { size: 22 });
    infoCard(p, 565, 540, 470, 320, 'нагрузка', 'на 8–15 повторений → постепенно 60–80 % расчётного максимума; прогрессия: сначала повторения или число упражнений, потом вес ≤ 5 %', MECH, m('b4'), { size: 22 });
    infoCard(p, 1070, 540, 470, 320, 'объём и частота', '1 подход → 2–3; отдых ≥ 3 мин; не чаще 2 раз в неделю; многосуставные движения; эксцентрику ограничить; снаряды по размеру', ADULT, m('b5'), { size: 22 });
  }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Механическое сопротивление измеримо и может быть большим; не для очень слабых мышц и самой ранней стадии заживления.', 'w1'],
     ['Здоровым взрослым: 60–80 % повторного максимума, 8–12 повторений, 2–4 подхода, 2–3 раза в неделю.', 'w2'],
     ['Детям можно — под контролем, с малой интенсивностью, весом тела и снарядами по размеру.', 'w3'],
     ['У детей — дольше отдых, не чаще 2 раз в неделю, без максимальных весов до зрелости скелета.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 220 + i * 150, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 31, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-kidadult', prompt: ['Это правило для ребёнка или для взрослого?'],
    build: grid([
      { parts: ['Отдых между подходами — не меньше 3 минут'], ans: ['kid'], why: 'Дети дольше восстанавливаются.' },
      { parts: ['60–80 % максимума, 2–4 подхода, отдых 2–3 минуты'], ans: ['adult'], why: 'Рекомендации для здоровых взрослых.' },
      { parts: ['Сначала прибавлять повторения, вес — не больше чем на 5 %'], ans: ['kid'], why: 'Осторожная прогрессия у детей.' },
      { parts: ['Не чаще двух раз в неделю, эксцентрику ограничить'], ans: ['kid'], why: 'Особые правила для детей.' },
      { parts: ['После перерыва больше 1–2 недель снизить нагрузку и объём'], ans: ['adult'], why: 'Из рекомендаций для взрослых.' },
    ], [['kid', 'Ребёнку', KID], ['adult', 'Взрослому', ADULT]], { multi: false, text: true }),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-kidbench', prompt: ['Мальчик 10 лет хочет, как старший брат, жать лёжа максимальный вес. Что ответить?'],
    build: choice([
      ['Силовые можно — под контролем, весом тела или лёгкими весами на 8–15 повторений, без максимальных весов'],
      ['Силовые детям запрещены до 18 лет'],
      ['Можно, если будет страховать брат'],
      ['Можно, но только эксцентрические упражнения'],
    ], 0, 'При правильной программе и контроле силовые детям полезны и безопасны; максимальные веса — только после созревания скелета.',
    [null, 'Нет: при правильной программе и контроле силовые детям можно.', 'Нужен обученный взрослый, а максимальные веса до зрелости скелета нельзя.', 'Эксцентрику детям, наоборот, ограничивают.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
