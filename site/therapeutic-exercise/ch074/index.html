const LOAD = COL.task, DLC = COL.whole, OXC = COL.real, ISOC = COL.good;
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
// Seated knee extension with a cuff weight above the ankle: { f, q4, setK(k) } — k scales the cuff (the load).
function kneeExt(p, hx, hy, s, t0) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...SIT, t: 4, kN: 90, aN: 20, eN: 30, aF: 20, eF: 30 } });
  plant(f, 'H', hx, hy);
  bench(p, hx - 110 * s, hx + 60 * s, hy + 8 * s, t0, COL.dim, 182 * s * .95);
  p.appendChild(f.g);
  const q4 = muscleOn(f, ...MUSCLE.rectus, { after: 'ftN', w: 13 });
  const c = G(p, { o: 0 }), body = G(c, {});
  mk('rect', { x: -15, y: -13, width: 30, height: 26, rx: 8, fill: '#5b6b78', stroke: '#2c353d', 'stroke-width': 2 }, body);
  mk('rect', { x: -15, y: -3, width: 30, height: 6, fill: '#7f909c' }, body);
  let k = 1;
  const upd = () => { const K = f.pts.KN, A = f.pts.AN, [x, y] = figPt(f, [lerp(K[0], A[0], .85), lerp(K[1], A[1], .85)]); put(c, { x, y, s: f.s * k, r: Math.atan2(A[1] - K[1], A[0] - K[0]) * 180 / Math.PI - 90 }); };
  f.onSet.push(upd); upd();
  if (t0 !== null) { show(f.g, t0); show(c, t0); }
  return { f, q4, cuff: c, setK(v) { k = v; upd(); } };
}
// Bars of a set plan: [[label, value 0..1, colour]], in a box x0..x0+w with baseline y0, max height h.
function setBars(p, x0, y0, w, h, sets, t0, gap = 1.2) {
  const n = sets.length, bw = w / n * .6;
  return sets.map(([lab, v, col, sub], i) => {
    const g = G(p, { o: 0 }), x = x0 + (i + .5) * w / n;
    mk('rect', { x: x - bw / 2, y: y0 - v * h, width: bw, height: v * h, rx: 8, fill: mix(col, COL.board, .3), stroke: col, 'stroke-width': 2 }, g);
    T(g, lab, { x, y: y0 - v * h - 14, size: 24, weight: 700, fill: col, anchor: 'middle' });
    if (sub) T(g, sub, { x, y: y0 + 30, size: 19, fill: COL.dim, anchor: 'middle' });
    show(g, t0 + i * gap);
    return g;
  });
}

    infoCard(p, 900, 290, 650, 250, 'нагрузка', 'ниже, а повторений больше: 2–3 × 8–12 при 90–100 % 10ПМ или 10–20 при 40–50 % 1ПМ; отдых 15–20 с; прогрессия — подходы, повторения, груз, станции, круги', LOAD, m('dose'), { size: 22 });
    infoCard(p, 900, 560, 650, 300, 'порядок', 'чередовать руки, ноги, туловище; толкать и тянуть — одни отдыхают, другие работают; крупные группы раньше мелких; многосуставные раньше изолированных — меньше риск травмы от утомления', COL.whole, m('order'), { size: 22 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-circuit', prompt: ['Круговая тренировка. Верно или нет?'],
    build: grid([
      { parts: ['Крупные группы мышц — раньше мелких.'], ans: ['t'], why: 'Верно.' },
      { parts: ['Изолированные упражнения — раньше многосуставных.'], ans: ['f'], why: 'Наоборот: многосуставные раньше — меньше риск травмы от утомления.' },
      { parts: ['Две станции подряд для одних и тех же мышц — удачный порядок.'], ans: ['f'], why: 'Группы чередуют, чтобы одни отдыхали, пока работают другие.' },
      { parts: ['Отдых между станциями — 15–20 секунд.'], ans: ['t'], why: 'Минимальный отдых.' },
      { parts: ['Круг добавляет нагрузку на сердечно-сосудистую систему.'], ans: ['t'], why: 'За счёт малого отдыха.' },
    ], TF, { multi: false, text: true }),
  }], done) }],

  ['iso', 'Изокинетика', (m, D) => {
    const p = panel(0);
    txt(p, 'изокинетика: спектр скоростей', 800, 62, m('iso'), { size: 28, weight: 700, anchor: 'middle' });
    // a speed axis in °/s
    const ax = 120, aw = 1360, ay = 300, sc = v => ax + v / 400 * aw;
    const axG = G(p, { o: 0 });
    path(axG, `M${ax} ${ay}H${ax + aw}`, { stroke: COL.dim, 'stroke-width': 3 });
    [0, 60, 90, 120, 150, 180, 240, 300, 360].forEach(v => { path(axG, `M${sc(v)} ${ay - 8}V${ay + 8}`, { stroke: COL.dim, 'stroke-width': 2 }); T(axG, String(v), { x: sc(v), y: ay + 34, size: 18, fill: COL.dim, anchor: 'middle' }); });
    T(axG, '°/с', { x: ax + aw + 10, y: ay + 6, size: 20, fill: COL.dim });
    show(axG, m('spd'));
    const band = (a, b, col, lab, t0, y = ay - 50) => { const g = G(p, { o: 0 }); mk('rect', { x: sc(a), y, width: sc(b) - sc(a), height: 34, rx: 10, fill: mix(col, COL.board, .5), stroke: col, 'stroke-width': 2 }, g); T(g, lab, { x: (sc(a) + sc(b)) / 2, y: y + 24, size: 19, weight: 700, anchor: 'middle' }); show(g, t0); return g; };
    band(90, 180, ISOC, 'средние 60/90–180', m('vsr'));
    band(180, 360, COL.task, 'быстрые 180–360', m('vsr', 1.5));
    band(360, 400, COL.bad, '> 360 — нет', m('vsr', 4));
    txt(p, 'бросок сверху > 1000 °/с →', ax + aw, ay - 80, m('spd', 4), { size: 21, fill: COL.bad, anchor: 'end', weight: 700 });
    // carry-over only near the training speed
    const tr = 120, cg = G(p, { o: 0 });
    mk('rect', { x: sc(tr - 30), y: ay + 52, width: sc(tr + 30) - sc(tr - 30), height: 22, rx: 8, fill: ISOC, 'fill-opacity': .35 }, cg);
    path(cg, `M${sc(tr)} ${ay + 46}V${ay + 80}`, { stroke: ISOC, 'stroke-width': 4 });
    T(cg, 'перенос ±15–30 °/с от тренируемой', { x: sc(tr + 40), y: ay + 70, size: 20, fill: ISOC, weight: 700 });
    show(cg, m('spec'));
    // the protocol: up the spectrum and back down, with rests
    const steps = [90, 120, 150, 180, 180, 150, 120, 90], py = 470, sw = 110;
    steps.forEach((v, i) => {
      const g = G(p, { o: 0 }), x = 160 + i * (sw + 24), h = (v - 60) / 130 * 90 + 30;
      mk('rect', { x, y: py + 120 - h, width: sw, height: h, rx: 8, fill: mix(ISOC, COL.board, .4), stroke: ISOC, 'stroke-width': 2 }, g);
      T(g, String(v), { x: x + sw / 2, y: py + 112 - h, size: 20, weight: 700, fill: COL.chalk, anchor: 'middle' });
      show(g, m('prot', 2 + i * .45));
    });
    para(p, 'подходы 8–10 повторений: агонист ↔ антагонист; отдых 15–20 с между подходами, 60 с между скоростями; ≤ 3 раз в неделю', 100, py + 160, m('prot', 4), { size: 21, fill: COL.chalk, maxW: 1000 });
    // the dynamometer: the knee at the set speed
    const ke = fig(p, { x: 0, y: 0, s: .75, o: 0, pose: { ...SIT, t: 4, kN: 90, aN: 20, eN: 30, aF: 20, eF: 30 } });
    plant(ke, 'H', 1330, 730); bench(p, 1250, 1370, 736, m('iso'), COL.dim, 130); p.appendChild(ke.g); show(ke.g, m('iso'));
    const q4 = muscleOn(ke, ...MUSCLE.rectus, { after: 'ftN', w: 11 });
    const arm = path(p, '', { stroke: '#7a8a96', 'stroke-width': 9 }), hub = put(mk('circle', { r: 16, fill: '#5b6b78', stroke: '#2c353d', 'stroke-width': 2 }, p), { o: 0 });
    show(arm, m('iso')); show(hub, m('iso'));
    const upd = () => { const K = onStage(ke, 'KN'), A = onStage(ke, 'AN'); put(hub, { x: K[0], y: K[1] }); arm.setAttribute('d', `M${K[0].toFixed(1)} ${K[1].toFixed(1)}L${lerp(K[0], A[0], .9).toFixed(1)} ${lerp(K[1], A[1], .9).toFixed(1)}`); };
    ke.onSet.push(upd); upd();
    prog(q => { const u = (q * 4) % 1, e = u < .5 ? u * 2 : 2 - u * 2; ke.set({ kN: lerp(90, 5, e) }); q4.act(.85); }, m('iso', .5), Math.max(4, D - m('iso', .8)), lin);
    infoCard(p, 80, 690, 1000, 150, 'функция: данные спорные', 'тренировать на скоростях, близких к нужным движениям; для ноги (ходьба) — можно, для руки часто нет', COL.dim, m('iso'), { size: 22 });
  }],

  ['int', 'Интенсивность и прогрессия', (m) => {
    const p = panel(0);
    txt(p, 'изокинетика: интенсивность и прогрессия', 800, 66, m('int'), { size: 28, weight: 700, anchor: 'middle' });
    infoCard(p, 80, 110, 700, 180, 'разминка на динамометре — коротко', 'не заменяет общую разминку (велотренажёр, эргометр для рук); выносливость — субмакс., сила и мощность — макс.', COL.chalk, m('int'), { size: 22 });
    const st = [['начало', 'субмакс. · средние и медленные скорости — почувствовать прибор', ISOC], ['дальше', 'макс. · средние скорости; медленные убрать', COL.task], ['поздно', 'макс. · быстрые скорости — если без боли', COL.bad]];
    st.forEach(([a, b, c], i) => { const g = G(p, { o: 0 }), y = 320 + i * 126, x = 80 + i * 60; mk('rect', { x, y, width: 640, height: 112, rx: 16, fill: PANEL, stroke: c, 'stroke-width': 2.5 }, g); T(g, a, { x: x + 22, y: y + 38, size: 24, weight: 700, fill: c }); put(para(g, b, x + 22, y + 72, null, { size: 21, maxW: 600 }), { o: 1 }); show(g, m('prog', i * 1.6)); });
    ['короткая дуга → полная', 'концентрика → эксцентрика'].forEach((s, i) => pill(p, s, 1150, 360 + i * 70, m('prog', 6 + i * .8), { col: COL.good, size: 24 }));
    // shear at the knee with maximal effort at a slow speed
    const ke = fig(p, { x: 0, y: 0, s: .8, o: 0, pose: { ...SIT, t: 4, kN: 60, aN: 20, eN: 30, aF: 20, eF: 30 } });
    plant(ke, 'H', 1180, 600); bench(p, 1090, 1230, 606, m('prec'), COL.dim, 140); p.appendChild(ke.g); show(ke.g, m('prec'));
    const q4 = muscleOn(ke, ...MUSCLE.rectus, { after: 'ftN', w: 12 }); prog(() => q4.act(1), m('prec'), .5);
    const K = onStage(ke, 'KN');
    arrowTo(p, [K[0] - 50, K[1] + 40], [K[0] + 20, K[1] + 40], m('prec', 1), { col: COL.bad, w: 5 });
    arrowTo(p, [K[0] + 60, K[1] - 34], [K[0] - 10, K[1] - 34], m('prec', 1.3), { col: COL.bad, w: 5 });
    infoCard(p, 820, 730, 730, 140, 'медленно и с макс. усилием — почти никогда', 'слишком велики сдвигающие силы в суставе', COL.bad, m('prec'), { size: 22 });
  }],

  ['ecc', 'Эксцентрическая изокинетика', (m) => {
    const p = panel(0);
    txt(p, 'эксцентрическая изокинетика — только в конце реабилитации', 800, 66, m('ecc'), { size: 27, weight: 700, anchor: 'middle' });
    // speed ranges: concentric versus eccentric
    const ax = 160, aw = 1100, ay = 240, sc = v => ax + v / 400 * aw;
    const g0 = G(p, { o: 0 });
    path(g0, `M${ax} ${ay}H${ax + aw}`, { stroke: COL.dim, 'stroke-width': 3 });
    [0, 60, 120, 180, 360].forEach(v => { path(g0, `M${sc(v)} ${ay - 8}V${ay + 8}`, { stroke: COL.dim, 'stroke-width': 2 }); T(g0, String(v), { x: sc(v), y: ay + 32, size: 18, fill: COL.dim, anchor: 'middle' }); });
    T(g0, '°/с', { x: ax + aw + 12, y: ay + 6, size: 20, fill: COL.dim });
    show(g0, m('e2'));
    const bar = (a, b, y, col, lab, t0) => { const g = G(p, { o: 0 }); mk('rect', { x: sc(a), y, width: sc(b) - sc(a), height: 30, rx: 8, fill: mix(col, COL.board, .45), stroke: col, 'stroke-width': 2 }, g); T(g, lab, { x: sc(b) + 12, y: y + 22, size: 19, weight: 700, fill: col }); show(g, t0); };
    bar(60, 360, ay - 90, ISOC, 'концентрика', m('e2'));
    bar(60, 120, ay - 50, COL.task, 'эксцентрика', m('e2', .8));
    bar(120, 180, ay - 50, COL.dim, 'спортсмены', m('e2', 2));
    const cards = [['когда вводят', 'макс. концентрика на нескольких скоростях без боли; функциональный объём восстановлен', ISOC, 'e1'],
      ['как дозируют', 'субмакс. и дольше — меньше момент силы и риск запаздывающей болезненности', COL.task, 'e2'],
      ['как выполняют', 'непрерывно: концентрика → эксцентрика одной группы, а не агонист ↔ антагонист', COL.whole, 'e3'],
      ['безопасность', 'средние скорости безопаснее быстрых: рычаг с мотором может повредить заживающие ткани', COL.bad, 'e4']];
    cards.forEach(([t, b, c, k], i) => infoCard(p, 80 + (i % 2) * 730, 330 + Math.floor(i / 2) * 270, 710, 250, t, b, c, m(k), { size: 23 }));
    txt(p, 'данных мало — в основном клинический опыт', 800, 300, m('ecc', 3), { size: 21, fill: COL.dim, anchor: 'middle' });
  }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['PRE: постоянная нагрузка, которую повышают по повторному максимуму; типично 2–3 × 6–12.', 'w1'],
     ['Делорм — нагрузка нарастает, Оксфорд — убывает; DAPRE корректирует вес по 3-му подходу.', 'w2'],
     ['Круговая: 8–12 станций, мало отдыха, группы чередуются; крупные и многосуставные — раньше.', 'w3'],
     ['Изокинетика специфична к скорости: спектр скоростей, без макс. усилия на медленных; эксцентрика — в конце.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 220 + i * 150, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 31, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-dapre', prompt: ['Рабочий вес (6ПМ) — 20 фунтов. Заполните план DAPRE.'],
    build: blanks([
      { parts: ['1-й подход: 10 повторений с ', { box: '10' }, ' фунтами'], why: '50 % рабочего веса.' },
      { parts: ['2-й подход: 6 повторений с ', { box: '15' }, ' фунтами'], why: '75 % рабочего веса.' },
      { parts: ['3-й подход: максимум повторений с ', { box: '20' }, ' фунтами'], why: '100 % рабочего веса.' },
      { parts: ['В 3-м подходе 5–6 повторений → 4-й подход с ', { box: '20' }, ' фунтами'], why: 'При 5–6 повторениях вес в 4-м подходе тот же.' },
    ]),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-eccisok', prompt: ['Спортсмен в конце реабилитации: максимальная концентрическая изокинетика без боли на нескольких скоростях, объём восстановлен. Как начать эксцентрическую изокинетику?'],
    build: choice([
      ['Субмаксимально, 60–120 °/с (до 180 °/с), непрерывный цикл концентрика — эксцентрика'],
      ['Максимально на 30 °/с'],
      ['Максимально на 360 °/с'],
      ['Чередовать агонисты и антагонисты на самых быстрых скоростях'],
    ], 0, 'Эксцентрику дают на более медленных скоростях и узком диапазоне, субмаксимально, непрерывным циклом одной группы мышц.',
    [null, 'Максимальное усилие на медленной скорости — большие сдвигающие силы в суставе.', 'Быстрые скорости при эксцентрике опаснее: рычаг с мотором может повредить ткани.', 'Чередование агонистов и антагонистов — это концентрическая изокинетика.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
