// cards-short end

const BANDC = '#e05a5a', SKIN = '#d8d1c1', FORCE = COL.whole, COMP = COL.bad;
const GRADES = [['#f3e15a', 5], ['#e05a5a', 7], ['#5fb878', 9], ['#4a7fd0', 11], ['#3a4148', 13], ['#b8bcc2', 15]];
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
// An elastic band from A to B with rest length L0: it thins and pales as it stretches; set() returns the elongation (0..).
function band(p, col = BANDC, w = 12) {
  const e = path(p, '', { stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' });
  return { e, set(A, B, L0) {
    const L = Math.hypot(B[0] - A[0], B[1] - A[1]), k = clamp(L0 / Math.max(L, 1), .3, 1);
    e.setAttribute('d', `M${A[0].toFixed(1)} ${A[1].toFixed(1)}L${B[0].toFixed(1)} ${B[1].toFixed(1)}`);
    e.setAttribute('stroke-width', (w * Math.sqrt(k)).toFixed(1)); e.setAttribute('stroke', mix(col, '#ffffff', (1 - k) * .4));
    return Math.max(0, (L - L0) / L0);
  } };
}
const arrowD = (A, u, L) => { const B = [A[0] + u[0] * L, A[1] + u[1] * L], f = v => v.toFixed(1); return `M${f(A[0])} ${f(A[1])}L${f(B[0])} ${f(B[1])}M${f(B[0] - u[0] * 14 - u[1] * 9)} ${f(B[1] - u[1] * 14 + u[0] * 9)}L${f(B[0])} ${f(B[1])}L${f(B[0] - u[0] * 14 + u[1] * 9)} ${f(B[1] - u[1] * 14 - u[0] * 9)}`; };
// A lever (upper arm + forearm about the elbow E) pulled by a band anchored at A; returns { set(phi) → {el, torque, perp, along} }.
function bandLever(p, E, L, A, phi0, t0) {
  const g = G(p, { o: 0 }), defs = mk('defs', {}, g), line = mix(SKIN, COL.board, .6);
  limbEl(g, defs, SKIN, 22, 17, line).set([E[0] - 170, E[1] + 40], E);
  const fa = limbEl(g, defs, SKIN, 17, 12, line);
  mk('circle', { cx: A[0], cy: A[1], r: 10, fill: 'none', stroke: COL.chalk, 'stroke-width': 4 }, g);
  const bd = band(g), W0 = [E[0] + L * Math.cos(rad(phi0)), E[1] - L * Math.sin(rad(phi0))], L0 = Math.hypot(A[0] - W0[0], A[1] - W0[1]);
  const aP = path(g, '', { stroke: FORCE, 'stroke-width': 5 }), aC = path(g, '', { stroke: COMP, 'stroke-width': 5 });
  if (t0 !== null) show(g, t0);
  const calc = phi => {
    const u = [Math.cos(rad(phi)), -Math.sin(rad(phi))], W = [E[0] + L * u[0], E[1] + L * u[1]], c = [A[0] - W[0], A[1] - W[1]], d = Math.hypot(...c), cu = [c[0] / d, c[1] / d];
    const el = Math.max(0, (d - L0) / L0), along = cu[0] * u[0] + cu[1] * u[1], n = [-u[1], u[0]], perp = cu[0] * n[0] + cu[1] * n[1];
    return { u, W, cu, el, along, n, perp, torque: el * Math.abs(perp) };
  };
  return { g, calc, set(phi, { comp = true } = {}) {
    const r = calc(phi); fa.set(E, r.W); bd.set(r.W, A, L0);
    aP.setAttribute('d', r.el > .02 ? arrowD(r.W, [r.n[0] * Math.sign(r.perp), r.n[1] * Math.sign(r.perp)], 15 + 70 * r.el * Math.abs(r.perp)) : '');
    aC.setAttribute('d', comp && r.el > .02 && r.along < -.1 ? arrowD(r.W, [r.u[0] * -1, r.u[1] * -1], 12 + 70 * r.el * -r.along) : '');
    return r;
  } };
}

const BEATS = [
  ['intro', 'Эластичное сопротивление', (m, D) => {

    prog(q => { const L = L0 * (1 + 1.5 * cyc(q, Math.max(2, Math.round((m('ex') - m('elong')) / 3)))), B = [ax + L, ay]; const el = b1.set([ax, ay], B, L0); put(hand, { x: B[0], y: B[1] }); pct.textContent = `(L − L₀) / L₀ × 100 = ${Math.round(el * 100)} %`; put(dot, { x: cx0 + el / 1.5 * cw, y: cy0 - ch * .95 * el / 1.5 }); fArr.setAttribute('d', el > .03 ? arrowD([B[0] + 4, ay - 34], [-1, 0], 20 + 60 * el) : ''); }, m('elong', .3), Math.max(3, m('ex') - m('elong', .5)), lin);

    const eMax = Math.max(...S.map(r => r.el)), tMax = Math.max(...S.map(r => r.torque));

    show(p.lastChild, m('torque', 1));
    path(p, fnPath(cx0, cy0, cw, ch, x => S[Math.round(x * N)].torque / tMax * .9, 0, 1, N), { stroke: FORCE, 'stroke-width': 5 }, { o: 0 });

    infoCard(p, 860, 620, 680, 220, 'пик — в середине объёма', 'плечо рычага меняется с углом ленты; на ответ мышцы влияет и её отношение длины и напряжения', FORCE, m('bell'), { size: 22 });

    // standing, the band tied in front at chest height: shoulder extension against it

    plant(f, 'AN', 520, 760);
    const wall = G(p, { o: 0 }); mk('rect', { x: W0 - 40, y: 300, width: 24, height: 460, fill: COL.dim, 'fill-opacity': .5 }, wall);
    mk('circle', { cx: W0 - 6, cy: onStage(f, 'Sh')[1], r: 12, fill: COL.task }, wall);
    show(wall, m('fix')); ground(p, 260, 640, 760, m('len')); show(f.g, m('len'));
    const ex = muscleOn(f, ['Sh', 'H', 6, 14], ['Sh', 'EN', 34, 9], { after: 'hdN', w: 12 }), bd = band(p);
    const Aw = [W0 - 6, onStage(f, 'Sh')[1]], L0 = Math.hypot(onStage(f, 'WN')[0] - Aw[0], onStage(f, 'WN')[1] - Aw[1]);
    f.onSet.push(() => bd.set(Aw, onStage(f, 'WN'), L0)); f.set({});
    put(bd.e, { o: 0 }); show(bd.e, m('len'));
    prog(q => { f.set({ aN: lerp(70, -20, cyc(q, 3)), aF: lerp(70, -20, cyc(q, 3)) }); ex.act(.9); }, m('len', .5), 9, lin);
    txt(p, 'в начале — натянута, но не растянута', 450, 820, m('len', 1), { size: 21, fill: COL.task, anchor: 'middle', weight: 700 });
    infoCard(p, 760, 110, 790, 230, 'толщина', 'толще — больше сопротивление; шкалы цветов у марок разные (в одном исследовании крайние степени расходились на 30–35 %) → одному пациенту — одна марка', COL.task, m('grade'), { size: 22 });
    infoCard(p, 760, 360, 790, 200, 'длина', 'под упражнение и рост; оба конца надёжно закреплены; каждый раз одна и та же длина — иначе нагрузка «гуляет»', COL.good, m('len'), { size: 22 });
    ['дверная ручка', 'ножка стола', 'кольцо', 'наступить ногой', 'петля на конечности', 'пояс — ходьба', 'двумя руками', 'под обе стопы'].forEach((s, i) => pill(p, s, 880 + (i % 3) * 230, 620 + Math.floor(i / 3) * 62, m('fix', .4 + i * .35), { col: COL.whole, size: 20 }));
  }],

  ['setup', 'Настройка', (m, D) => {
    const p = panel(0);
    txt(p, 'максимум — где лента под прямым углом к кости', 800, 66, m('setup'), { size: 28, weight: 700, anchor: 'middle' });
    const E = [420, 560], Lv = 230, tgt = 60, Wt = [E[0] + Lv * Math.cos(rad(tgt)), E[1] - Lv * Math.sin(rad(tgt))];
    const A = [Wt[0] + 200 * Math.sin(rad(tgt)), Wt[1] + 200 * Math.cos(rad(tgt))];
    const lev = bandLever(p, E, Lv, A, -15, m('setup', .3));
    const mark = G(p, { o: 0 }); path(mark, `M${E[0]} ${E[1]}L${(E[0] + 300 * Math.cos(rad(tgt))).toFixed(1)} ${(E[1] - 300 * Math.sin(rad(tgt))).toFixed(1)}`, { stroke: COL.good, 'stroke-width': 2, 'stroke-dasharray': '6 8' });
    T(mark, 'здесь нужен максимум', { x: E[0] + 310 * Math.cos(rad(tgt)), y: E[1] - 310 * Math.sin(rad(tgt)) - 10, size: 20, fill: COL.good, weight: 700, anchor: 'middle' });
    show(mark, m('setup', 1));
    const lab = txt(p, '', 420, 860, m('setup', .6), { size: 22, weight: 700, fill: FORCE, anchor: 'middle' });
    prog(q => { const ph = lerp(-15, 120, cyc(q, Math.max(2, Math.round((D - m('setup')) / 4)))), r = lev.set(ph), ang = Math.acos(clamp(Math.abs(r.along), 0, 1)) * 180 / Math.PI; lab.textContent = `угол ленты к кости ≈ ${Math.round(ang)}°` + (r.along < -.35 && r.el > .05 ? ' — больше сжатие' : ''); lab.setAttribute('fill', r.along < -.35 && r.el > .05 ? COMP : FORCE); }, m('setup', .6), Math.max(4, D - m('setup', .9)), lin);
    txt(p, 'синяя — сопротивление, красная — сжатие в суставе', 420, 820, m('acute'), { size: 20, fill: COL.dim, anchor: 'middle' });
    infoCard(p, 860, 120, 690, 210, 'терапевт выбирает положение', 'где нужен максимум — и крепит ленту так, чтобы там был прямой угол', COL.good, m('setup'), { size: 22 });
    infoCard(p, 860, 350, 690, 150, 'острый угол', 'меньше сопротивление, больше сжатие в суставе', COMP, m('acute'), { size: 22 });
    infoCard(p, 860, 520, 690, 150, 'каждый раз одинаково', 'положение пациента и место крепления', COL.task, m('same'), { size: 22 });
    infoCard(p, 860, 690, 690, 170, 'прогрессия', 'больше повторений с той же лентой или следующая по толщине лента', COL.whole, m('prog'), { size: 22 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-elastic', prompt: ['Эластичное сопротивление. Верно или нет?'],
    build: grid([
      { parts: ['Длинная лента при том же проценте удлинения даёт больше силы.'], ans: ['f'], why: 'Сила зависит от процента удлинения, а не от исходной длины.' },
      { parts: ['При быстром движении сопротивление ленты заметно больше.'], ans: ['f'], why: 'Скорость растяжения почти не влияет.' },
      { parts: ['Максимальный момент — когда лента под прямым углом к кости.'], ans: ['t'], why: 'Верно.' },
      { parts: ['В начальном положении лента натянута, но не растянута.'], ans: ['t'], why: 'Это длина покоя в исходном положении.' },
      { parts: ['Основная потеря силы ленты — в первые 20–50 растяжений.'], ans: ['t'], why: 'Дальше она почти не меняется.' },
    ], TF, { multi: false, text: true }),
  }], done) }],

  ['pm', 'Плюсы и минусы', (m) => {
    const p = panel(0);
    txt(p, 'эластик: плюсы и минусы', 800, 66, m('pm'), { size: 28, weight: 700, anchor: 'middle' });
    // a quick movement is safe: no heavy weight to stop
    const f = fig(p, { x: 260, y: 820 - 182 * .9, s: .9, o: 0, pose: { aN: 6, eN: 10 } });
    const bi = muscleOn(f, ...MUSCLE.biceps, { after: 'hdN', w: 11 }), bd = band(p);
    f.onSet.push(() => bd.set(onStage(f, 'toeN'), onStage(f, 'WN'), 120)); f.set({});
    put(bd.e, { o: 0 }); show(f.g, m('pm')); show(bd.e, m('pm')); ground(p, 150, 380, 820, m('pm'));
    prog(q => { f.set({ eN: lerp(10, 125, cyc(q, 8)) }); bi.act(.9); }, m('pm', 2), 6, lin);
    txt(p, 'быстро — безопасно', 260, 870, m('pm', 2), { size: 21, fill: COL.good, anchor: 'middle', weight: 700 });
    infoCard(p, 480, 110, 1060, 290, 'плюсы', 'лёгкий и недорогой — идеален для дома; мало зависит от тяжести → много положений и сочетаний движений; на средних и быстрых скоростях безопасен — нет инерции тяжёлого груза, подходит для плиометрики', COL.good, m('pm'), { size: 23 });
    infoCard(p, 480, 420, 1060, 420, 'минусы', 'сопротивление цветов — по таблицам: трудно выбрать и оценить смену ленты; нет стабилизации — рисунок движения держат свои мышцы; ленты изнашиваются — менять регулярно, при общих отрезках трудно понять когда; латекс — аллерген (есть безлатексные по сопоставимой цене)', COMP, m('cons'), { size: 23 });
  }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Сопротивление растёт с процентом удлинения — не с длиной и не со скоростью.', 'w1'],
     ['Момент — колоколом; максимум — лента под прямым углом к кости; острый угол — больше сжатие.', 'w2'],
     ['Каждый раз та же длина, положение и крепление; прогрессия — повторения или толще лента.', 'w3'],
     ['Плюсы: дёшево, портативно, много положений, безопасно быстро. Минусы: таблицы, нет стабилизации, износ, латекс.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 220 + i * 150, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 31, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-bandsetup', prompt: ['Что сделать?'],
    build: grid([
      { parts: ['Максимум сопротивления нужен при 90° сгибания локтя'], ans: ['perp'], why: 'Закрепить ленту так, чтобы при 90° она шла под прямым углом к предплечью.' },
      { parts: ['С той же лентой нагрузка от занятия к занятию разная'], ans: ['same'], why: 'Одна и та же длина, положение и место крепления.' },
      { parts: ['Упражнение стало слишком лёгким'], ans: ['prog'], why: 'Больше повторений или следующая по толщине лента.' },
      { parts: ['Лента под острым углом сильно сжимает сустав'], ans: ['perp'], why: 'Перенести крепление, чтобы угол был ближе к прямому.' },
    ], [['perp', 'Прямой угол к кости', FORCE], ['same', 'Та же длина и крепление', COL.task], ['prog', 'Повторы или толще', COL.good]], { multi: false, text: true }),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-latex', prompt: ['У пациентки аллергия на латекс; нужна домашняя программа с сопротивлением. Что предложить?'],
    build: choice([
      ['Безлатексную ленту — и один и тот же отрезок, положение и крепление каждый раз'],
      ['Обычную ленту, но короче'],
      ['Отказаться от эластика: замены нет'],
      ['Любую ленту, а нагрузку повышать скоростью движения'],
    ], 0, 'Есть безлатексные изделия по сопоставимой цене; условия упражнения повторяют одинаково.',
    [null, 'Длина не решает проблему аллергии.', 'Безлатексные ленты есть, и цена сопоставима.', 'Скорость почти не меняет сопротивление ленты.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
