  "равновесие\nстабилизация, проприоцепция, реакция на толчки; опора на одну или две руки или ноги; сменные полусферы — сложнее": "проприоцепция",
  "мини-батут\nмягкие прыжки, бег на месте, подскоки — меньше удар по суставам": "меньше удар",
  "много повторений, малая интенсивность\nвыносливость, координация, сердце и лёгкие; разминка и заминка; сопротивление — трение, гидравлика, пневматика": "выносливость, координация, сердце",
  "велотренажёр\nвертикальный — больше контроля туловища; без ударов; с мотором — и эксцентрика; сиденье меняет объём": "без ударов; сиденье меняет объём",
  "степпер, эллипс, лыжный\nбез ударов, стоя; у степпера и руки — стоя на коленях рядом": "без ударов, стоя",
  "эргометр стоя\nрука поднимается меньше — при синдроме сдавления в плечевом суставе": "рука поднимается меньше — при сдавлении",

const EQ = '#7f909c', BLADE = '#e0a040', STABC = COL.good, ENDC = COL.whole;
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
// The shoulder muscles of the near arm: anterior deltoid, posterior shoulder, and a scapular stabilizer on the back.
const shoulderSet = f => ({
  fl: muscleOn(f, ['Sh', 'H', 4, -14], ['Sh', 'EN', 38, -9], { after: 'hdN', w: 11 }),
  ex: muscleOn(f, ['Sh', 'H', 6, 14], ['Sh', 'EN', 34, 9], { after: 'hdN', w: 11 }),
  sc: muscleOn(f, ['Sh', 'H', 12, 18], ['Sh', 'H', 58, 16], { w: 12, col: ANAT.muscleDeep }),
});
// An oscillating blade held at its middle in the near hand: set(a) bends it (a = −1..1).
function bladeOn(p, f, len = 95) {
  const e = path(p, '', { stroke: BLADE, 'stroke-width': 7, 'stroke-linecap': 'round' });
  const caps = [0, 1].map(() => mk('circle', { r: 9, fill: mix(BLADE, '#000000', .3) }, p));
  return { e, set(a) {
    const W = onStage(f, 'WN'), E = onStage(f, 'EN'), dx = W[0] - E[0], dy = W[1] - E[1], L = Math.hypot(dx, dy) || 1, u = [dx / L, dy / L], n = [-u[1], u[0]], k = len * f.s / .9;
    const T = [W[0] + n[0] * k + u[0] * 40 * a, W[1] + n[1] * k + u[1] * 40 * a], B = [W[0] - n[0] * k + u[0] * 40 * a, W[1] - n[1] * k + u[1] * 40 * a];
    const c1 = [W[0] + n[0] * k * .5 - u[0] * 8 * a, W[1] + n[1] * k * .5 - u[1] * 8 * a], c2 = [W[0] - n[0] * k * .5 - u[0] * 8 * a, W[1] - n[1] * k * .5 - u[1] * 8 * a], fx = v => v.toFixed(1);
    e.setAttribute('d', `M${fx(T[0])} ${fx(T[1])}Q${fx(c1[0])} ${fx(c1[1])} ${fx(W[0])} ${fx(W[1])}Q${fx(c2[0])} ${fx(c2[1])} ${fx(B[0])} ${fx(B[1])}`);
    [T, B].forEach((P, i) => { caps[i].setAttribute('cx', fx(P[0])); caps[i].setAttribute('cy', fx(P[1])); });
  } };
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Стабилизация и выносливость', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 6 · Урок 77', { x: 800, y: 170, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'Оборудование', { x: 800, y: 255, size: 56, weight: 600, anchor: 'middle' });
    T(g, 'для стабилизации, закрытой цепи и выносливости', { x: 800, y: 320, size: 38, weight: 600, anchor: 'middle', fill: COL.dim });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'последний урок главы о силовых упражнениях', 800, 400, m('sub'), { size: 30, fill: COL.task, anchor: 'middle', weight: 600 });
    const art = G(scene, { o: 0 });
    const f = fig(art, { x: 780, y: 800 - 182 * .9, s: .9, pose: { aN: 90, eN: 0 } });
    const mu = shoulderSet(f), bl = bladeOn(art, f);
    ground(art, 660, 920, 800, 0);
    prog(q => { const a = Math.sin(2 * Math.PI * 14 * q); bl.set(a); mu.fl.act(Math.max(0, a)); mu.ex.act(Math.max(0, -a)); mu.sc.act(.8); }, .4, Math.max(4, D - 1.4), lin);
    show(art, .3);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);
  }],

  ['blade', 'Осциллирующий шест', (m, D) => {
    const p = panel(0);
    txt(p, 'осциллирующий шест: динамическая стабилизация', 800, 62, m('blade'), { size: 28, weight: 700, anchor: 'middle' });
    const f = fig(p, { x: 300, y: 720 - 182 * 1.15, s: 1.15, o: 0, pose: { aN: 90, eN: 0, aF: 10, eF: 10 } });
    const mu = shoulderSet(f), bl = bladeOn(p, f, 100);
    show(f.g, m('blade', .3)); show(bl.e, m('blade', .3)); ground(p, 150, 470, 720, m('blade', .3));
    // amplitude grows: more bend, more resistance; the arm later moves through planes
    let A = .4;
    prog(q => { A = lerp(.35, 1, clamp(q * 3, 0, 1)); }, m('blade', 1), Math.max(2, m('co') - m('blade', 1)), lin);
    prog(q => { const a = A * Math.sin(2 * Math.PI * 30 * q); bl.set(a); mu.fl.act(Math.max(0, a) * .9 + .1); mu.ex.act(Math.max(0, -a) * .9 + .1); mu.sc.act(.85); }, m('blade', .5), Math.max(4, m('prog') - m('blade', .5)), lin);
    prog(q => { const a = Math.sin(2 * Math.PI * 40 * q), ang = lerp(90, 150, cyc(q, 2)); f.set({ aN: ang }); bl.set(a); mu.fl.act(Math.max(0, a) * .9 + .1); mu.ex.act(Math.max(0, -a) * .9 + .1); mu.sc.act(.9); }, m('prog'), Math.max(4, m('ev') - m('prog')), lin);
    txt(p, 'больше изгиб — больше сопротивление', 300, 780, m('blade', 2), { size: 21, fill: BLADE, anchor: 'middle', weight: 700 });
    txt(p, 'агонисты ↔ антагонисты — попеременно и быстро', 300, 815, m('co'), { size: 21, fill: '#ff7a5c', anchor: 'middle', weight: 600 });
    ['сагиттальная', 'фронтальная', 'горизонтальная'].forEach((s, i) => pill(p, s, 760 + i * 250, 460, m('prog', 2 + i * 1.2), { col: STABC, size: 22 }));
    txt(p, '→', 885, 468, m('prog', 3.2), { size: 26, fill: COL.dim, anchor: 'middle' }); txt(p, '→', 1135, 468, m('prog', 4.4), { size: 26, fill: COL.dim, anchor: 'middle' });
    infoCard(p, 640, 110, 900, 180, 'колебательное сопротивление', 'пропорционально силе раскачивания: амплитуду, а значит и нагрузку, пациент дозирует сам', BLADE, m('blade'), { size: 22 });
    infoCard(p, 640, 310, 900, 110, 'цель — проксимальная устойчивость для управляемой подвижности', null, STABC, m('prog'), { size: 22 });
    // EMG of the scapular stabilizers: blade higher than cuff weight or elastic (shape only)
    const ex0 = 680, ey0 = 820, gr = G(p, { o: 0 });
    path(gr, `M${ex0} ${ey0}H${ex0 + 820}`, { stroke: COL.dim, 'stroke-width': 2.5 });
    [['верхняя трапециевидная', 0], ['нижняя трапециевидная', 1], ['передняя зубчатая', 2]].forEach(([s, i]) => {
      [[.45, EQ], [.5, '#e05a5a'], [.85, BLADE]].forEach(([v, c], j) => mk('rect', { x: ex0 + 40 + i * 270 + j * 52, y: ey0 - v * 230, width: 42, height: v * 230, rx: 5, fill: c }, gr));
      T(gr, s, { x: ex0 + 40 + i * 270 + 73, y: ey0 + 28, size: 18, fill: COL.dim, anchor: 'middle' });
    });
    show(gr, m('ev'));
    [['манжета', EQ], ['эластик', '#e05a5a'], ['шест', BLADE]].forEach(([s, c], i) => pill(p, s, 760 + i * 150, 540, m('ev', .5), { col: c, size: 19 }));
    pill(p, 'схема: ЭМГ', 1440, 540, m('ev'), { col: COL.dim, size: 19 });
  }],

  ['ball', 'Фитбол', (m, D) => {
    const p = panel(0);
    txt(p, 'фитбол (мяч для стабилизации)', 800, 62, m('ball'), { size: 28, weight: 700, anchor: 'middle' });
    const bx = 420, by = 600, br = 120, id = 'fb' + (++SHADE_ID), defs = mk('defs', {}, p), gr = mk('radialGradient', { id, cx: .38, cy: .32, r: .8 }, defs);
    [[0, '#a8d4f0'], [.6, '#4a7fd0'], [1, '#203a66']].forEach(([o, c]) => mk('stop', { offset: o, 'stop-color': c }, gr));
    const ball = put(mk('circle', { cx: bx, cy: by, r: br, fill: `url(#${id})` }, p), { o: 0 }); show(ball, m('ball', .3));
    ground(p, 220, 640, by + br, m('ball', .3));
    const f = fig(p, { x: 0, y: 0, s: 1, o: 0, pose: { ...SIT, t: 0, kN: 80, kF: 80, hN: 85, hF: 85, aN: 10, eN: 10, aF: 10, eF: 10 } });
    plant(f, 'H', bx - 10, by - br + 6);
    const mu = shoulderSet(f), db = carry(p, f, c => dumbbell(c, 1)); put(db, { o: 0 });
    show(f.g, m('ball', .3)); show(db, m('harder'));
    const ab = muscleOn(f, ['H', 'Sh', 10, 21], ['Sh', 'H', 26, -24], { w: 12 });
    prog(q => { const w = Math.sin(2 * Math.PI * 3 * q) * 4; put(ball, { x: w }); plant(f, 'H', bx - 10 + w, by - br + 6); ab.act(.6); }, m('ball', .5), Math.max(4, D - m('ball', .8)), lin);
    prog(q => { f.set({ aN: lerp(10, 150, cyc(q, 2)) }); mu.fl.act(.9); }, m('harder', .3), Math.max(3, D - m('harder', .6)), lin);
    txt(p, '≈ 50–75 см', bx + br + 20, by + 10, m('ball', 1), { size: 22, fill: '#a8d4f0', weight: 700 });
    txt(p, 'в книге — 20–30 дюймов', bx + br + 20, by + 42, m('ball', 1), { size: 19, fill: COL.dim });
    infoCard(p, 820, 160, 720, 200, 'стабилизация туловища и конечностей', 'прочный виниловый мяч: опора неустойчива, работают мышцы туловища', ENDC, m('ball'), { size: 23 });
    infoCard(p, 820, 390, 720, 170, 'труднее', 'с эластиком или свободными весами на мяче', COL.task, m('harder'), { size: 23 });
  }],

  ['cc', 'Закрытая цепь', (m, D) => {
    const p = panel(0);
    txt(p, 'закрытая цепь: вес тела', 800, 62, m('cc'), { size: 28, weight: 700, anchor: 'middle' });
    // a squat holding dumbbells, then on one leg
    const GY = 430, sq = fig(p, { x: 0, y: 0, s: .8, o: 0, pose: STAND });
    const q4 = muscleOn(sq, ...MUSCLE.rectus, { after: 'ftN', w: 10 });
    plant(sq, 'AN', 200, GY); show(sq.g, m('cc', .3)); ground(p, 100, 320, GY, m('cc', .3));
    const db = carry(p, sq, c => dumbbell(c, .9), { turn: false }); put(db, { o: 0 }); show(db, m('cprog'));
    prog(q => { sq.set(blendPose({ ...STAND, aN: 4, eN: 6 }, { ...SQUAT, t: 22, aN: 4, eN: 6, aF: 4, eF: 6, hF: q > .5 ? 60 : SQUAT.hF, kF: q > .5 ? 80 : SQUAT.kF, fF: q > .5 ? 0 : SQUAT.fF }, cyc(q, 4) * .8)); plant(sq, 'AN', 200, GY); q4.act(.85); }, m('cc', .5), Math.max(4, m('tg') - m('cc', .8)), lin);
    txt(p, 'приседания → с весом → на одной ноге', 210, 480, m('cprog'), { size: 20, fill: COL.task, anchor: 'middle', weight: 700 });
    // the incline glide board: steeper incline — more load
    const bx = 760, byy = 470, Lb = 330, bg = G(p, { o: 0 }), board = path(bg, '', { stroke: EQ, 'stroke-width': 12, 'stroke-linecap': 'round' }), plate = path(bg, '', { stroke: COL.chalk, 'stroke-width': 7 });
    const lf = fig(p, { x: 0, y: 0, s: .75, o: 0, pose: STAND }), lq = muscleOn(lf, ...MUSCLE.rectus, { after: 'ftN', w: 9 });
    const load = mk('rect', { x: 1080, y: 0, width: 26, height: 0, rx: 6, fill: COL.task }, bg);
    mk('rect', { x: 1080, y: 230, width: 26, height: 240, rx: 6, fill: 'none', stroke: COL.dim, 'stroke-width': 2 }, bg);
    T(bg, 'нагрузка', { x: 1093, y: 215, size: 18, fill: COL.dim, anchor: 'middle' });
    show(bg, m('tg')); show(lf.g, m('tg'));
    prog(q => {
      const al = lerp(25, 70, clamp(q * 1.6, 0, 1)), u = [-Math.cos(rad(al)), -Math.sin(rad(al))], foot = [bx + 130, byy];
      board.setAttribute('d', `M${foot[0]} ${foot[1]}L${(foot[0] + u[0] * Lb).toFixed(1)} ${(foot[1] + u[1] * Lb).toFixed(1)}`);
      plate.setAttribute('d', `M${foot[0]} ${foot[1]}l${(-u[1] * 40).toFixed(1)} ${(u[0] * 40).toFixed(1)}M${foot[0]} ${foot[1]}l${(u[1] * 10).toFixed(1)} ${(-u[0] * 10).toFixed(1)}`);
      const k = 45 * cyc(q, 3); lf.set({ t: 0, hN: k, kN: 2 * k, fN: k, hF: k, kF: 2 * k, fF: k, aN: 10, eN: 20 });
      put(lf.g, { r: al - 90 }); plant(lf, 'AN', foot[0] - 8, foot[1] - 10); lq.act(.4 + .6 * Math.sin(rad(al)));
      const h = 240 * Math.sin(rad(al)) * .95; load.setAttribute('y', (470 - h).toFixed(1)); load.setAttribute('height', h.toFixed(1));
    }, m('tg', .3), Math.max(4, m('slide') - m('tg', .6)), lin);
    txt(p, 'полулёжа → стоя', 800, 520, m('tg', 2), { size: 21, fill: COL.task, anchor: 'middle', weight: 700 });
    NOTE(p, 1093, 500, m('tg', 2));

    path(sg, `M${sx - 160} ${sy - 30}Q${sx} ${sy + 50} ${sx + 160} ${sy - 30}`, { stroke: EQ, 'stroke-width': 8 });
    const plat = mk('rect', { x: -50, y: -14, width: 100, height: 22, rx: 6, fill: '#3d4a52', stroke: COL.dim, 'stroke-width': 2 }, sg);
    const feet = [-1, 1].map(k => mk('ellipse', { cx: k * 22, cy: -22, rx: 14, ry: 9, fill: '#d8d1c1' }, sg));
    show(sg, m('slide'));
    prog(q => { const s = Math.sin(2 * Math.PI * 3 * q), x = sx + 140 * s, y = sy - 30 + 40 * (1 - s * s); [plat, ...feet].forEach(e => e.setAttribute('transform', `translate(${x.toFixed(1)} ${(y + 6).toFixed(1)})`)); }, m('slide', .3), Math.max(3, D - m('slide', .6)), lin);
    txt(p, 'скользящая доска (вид спереди)', sx, 470, m('slide'), { size: 20, fill: COL.dim, anchor: 'middle' });
    infoCard(p, 60, 560, 480, 300, 'вес тела, несколько суставов', 'ноги: приседания, выпады, шаг на ступеньку и вниз; руки: отжимания, выжимания сидя, подтягивания; сложнее — гантели, пояс, жилет, эластик, одна опора', COL.good, m('cc'), { size: 21 });
    infoCard(p, 570, 560, 480, 300, 'наклонная платформа', 'наклон круче — нагрузка больше; полулёжа — ранняя частичная нагрузка, позже выпады стоя; можно и туловище, и открытую цепь', COL.task, m('tg'), { size: 21 });
    infoCard(p, 1080, 560, 460, 300, 'скользящая доска', 'платформа по дуге против регулируемого сопротивления; обычно ноги стоя, но и руки, и туловище', ENDC, m('slide'), { size: 21 });
  }],

  ['bal', 'Равновесие и батут', (m, D) => {
    const p = panel(0);
    txt(p, 'равновесие и мини-батут', 800, 62, m('bal'), { size: 28, weight: 700, anchor: 'middle' });
    // a wobble board: a plank on a half sphere, the person on it tilts with it
    const wx = 300, wy = 600, wg = G(p, { o: 0 }), tilt = G(wg, { x: wx, y: wy });
    path(wg, `M${wx - 60} ${wy + 50}A60 60 0 0 1 ${wx + 60} ${wy + 50}Z`, { fill: EQ });
    mk('rect', { x: -150, y: -12, width: 300, height: 18, rx: 6, fill: '#c9a97a', stroke: '#7a6a52', 'stroke-width': 2 }, tilt);
    const f = fig(tilt, { x: 0, y: -12 - 182 * .9, s: .9, pose: { ...STAND, hN: 18, hF: 18, kN: 25, kF: 25, fN: 8, fF: 8, aN: 40, aF: 30 } });
    plant(f, 'AN', 0, -12);
    ground(p, 120, 480, wy + 50, m('bal'));
    show(wg, m('bal', .3));
    prog(q => put(tilt, { x: wx, y: wy, r: 8 * Math.sin(2 * Math.PI * 4 * q) * Math.cos(2 * Math.PI * 1.3 * q) }), m('bal', .5), Math.max(4, m('tramp') - m('bal', .8)), lin);
    const dome = G(p, { o: 0 }); path(dome, `M640 650A90 70 0 0 1 820 650Z`, { fill: '#4a7fd0' }); mk('rect', { x: 630, y: 648, width: 200, height: 10, rx: 4, fill: '#2c353d' }, dome); show(dome, m('bal', 2));
    txt(p, 'полусфера', 730, 690, m('bal', 2), { size: 20, fill: COL.dim, anchor: 'middle' });
    txt(p, 'балансировочная доска', wx, 700, m('bal', .5), { size: 20, fill: COL.dim, anchor: 'middle' });
    // the mini-trampoline with a waist-high bar

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{

      { parts: ['Начать закрытую цепь с частичной нагрузкой, полулёжа'], ans: ['tg'], why: 'Наклонная платформа: небольшой наклон — меньше нагрузка.' },

  ['recip', 'Попеременные тренажёры', (m, D) => {
    const p = panel(0);

    // an upright cycle: the legs follow the pedals
    const g1 = G(p, { o: 0 }), C = [330, 420], cr = 34, seat = [240, 300];
    path(g1, `M${seat[0] - 26} ${seat[1]}H${seat[0] + 26}M${seat[0]} ${seat[1]}L${C[0]} ${C[1]}L${C[0] + 60} ${C[1] - 140}H${C[0] + 90}M${C[0] - 60} 480H${C[0] + 120}M${C[0]} ${C[1]}V480`, { stroke: EQ, 'stroke-width': 7 });
    mk('circle', { cx: C[0], cy: C[1], r: cr, fill: 'none', stroke: EQ, 'stroke-width': 3 }, g1);
    const bf = fig(p, { x: 0, y: 0, s: .85, o: 0, pose: { ...SIT, t: 22, aN: 60, eN: 30, aF: 60, eF: 30 } });

    prog(q => { const a = 2 * Math.PI * 6 * q; legTo(bf, 'N', C[0] + cr * Math.cos(a), C[1] + cr * Math.sin(a)); legTo(bf, 'F', C[0] - cr * Math.cos(a), C[1] - cr * Math.sin(a)); bq.act(Math.max(0, Math.sin(a)) * .9); bh.act(Math.max(0, -Math.sin(a)) * .9); }, m('cyc', .2), Math.max(4, D - m('cyc', .5)), lin);

    mk('circle', { cx: K[0], cy: K[1], r: kr, fill: 'none', stroke: EQ, 'stroke-width': 3 }, g4);

    txt(p, 'ручной эргометр стоя', 640, 520, m('erg'), { size: 21, fill: COL.task, anchor: 'middle', weight: 700 });
    // a stepper
    const g3 = G(p, { o: 0 }), sf = fig(p, { x: 0, y: 0, s: .85, o: 0, pose: { aN: 20, eN: 30, aF: 20, eF: 30 } });
    const pN = mk('rect', { x: 0, y: 0, width: 60, height: 10, rx: 3, fill: EQ }, g3), pF = mk('rect', { x: 0, y: 0, width: 60, height: 10, rx: 3, fill: mix(EQ, COL.board, .4) }, g3);
    path(g3, 'M140 830H340M320 830V640', { stroke: EQ, 'stroke-width': 6 });
    show(g3, m('step')); show(sf.g, m('step'));
    const sq = muscleOn(sf, ...MUSCLE.rectus, { after: 'ftN', w: 10 });
    prog(q => { const s = Math.sin(2 * Math.PI * 5 * q), yN = 780 + 22 * s, yF = 780 - 22 * s; pN.setAttribute('x', 210); pN.setAttribute('y', yN); pF.setAttribute('x', 200); pF.setAttribute('y', yF); plant(sf, 'H', 230, 780 - 182 * .85 + 40); legTo(sf, 'N', 236, yN - 4); legTo(sf, 'F', 226, yF - 4); sq.act(.5 + .4 * s); }, m('step', .2), Math.max(3, D - m('step', .5)), lin);
    txt(p, 'степпер', 240, 870, m('step'), { size: 21, fill: COL.task, anchor: 'middle', weight: 700 });
    // the portable pedals in front of a chair
    const g2 = G(p, { o: 0 }), P0 = [700, 780], pr = 22;

    const pf = fig(p, { x: 0, y: 0, s: .8, o: 0, pose: { ...SIT, t: 4, aN: 20, eN: 40, aF: 20, eF: 40 } });

    txt(p, 'педали у стула', 640, 870, m('port'), { size: 21, fill: COL.task, anchor: 'middle', weight: 700 });
    infoCard(p, 880, 110, 670, 200, 'много повторений, малая интенсивность', 'выносливость, координация, сердце и лёгкие; разминка и заминка; сопротивление — трение, гидравлика, пневматика', ENDC, m('recip'), { size: 21 });
    infoCard(p, 880, 325, 670, 175, 'велотренажёр', 'вертикальный — больше контроля туловища; без ударов; с мотором — и эксцентрика; сиденье меняет объём', COL.task, m('cyc'), { size: 21 });

    infoCard(p, 880, 705, 670, 165, 'эргометр стоя', 'рука поднимается меньше — при синдроме сдавления в плечевом суставе', COL.real, m('erg'), { size: 21 });

  ['isok', 'Изокинетический динамометр', (m, D) => {
    const p = panel(0);

  }], done, 'Практика урока   2 из 2') }],
