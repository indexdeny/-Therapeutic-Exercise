<script>
'use strict';
const CHAPTER = { number: 78, title: 'Ключевые понятия аэробной тренировки', minutes: 9, language: 'ru', next: '../ch079/' };
// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch078/cards.ru.json
const CARDS_SHORT = {
  "физическая форма\nспособность выполнять физическую работу": "способность выполнять физическую работу",
  "мышечная\nодна группа мышц повторяет сокращения долгое время": "одна группа мышц, долгое время",
  "сердечно-сосудистая\nдолгая динамическая работа крупных мышц: ходьба, плавание, велосипед": "крупные мышцы: ходьба, плавание",
  "зависит от частоты, интенсивности и длительности\nприспособление сердца, сосудов и мышц — видно по выносливости": "приспособление сердца, сосудов и мышц",
  "нервные, физические и биохимические изменения\nитог один: ту же работу человек выполняет с меньшими физиологическими затратами": "та же работа — меньшие затраты",
  "порог тренировочного стимула\nнаименьшая нагрузка, которая вызывает ответ": "наименьшая нагрузка, которая вызывает ответ",
  "постнагрузка\nсила левого желудочка, нужная, чтобы открыть аортальный клапан; зависит от напряжения стенки и давления в аорте": "сила левого желудочка",
  "коронарный кровоток\nдиастолическое давление в аорте, длительность диастолы, сопротивление коронарных артерий, коллатерали": "давление в аорте, диастола",
};
// cards-short end

const ACT = COL.whole, EXC = COL.good, FIT = COL.task, O2C = '#9fe0f0', DEM = COL.bad, SUP = COL.good;
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
// Pills in a row centred on cx, each shown gap seconds after the previous one.
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col, size }); x += ws[i] + space; return g; });
}
// A swimmer doing the front crawl, side view, head to the right: sw.set(q) — q is the stroke phase in cycles.
function swimmer(p, x, y, s, t0) {
  const f = fig(p, { x, y, s, r: 90, o: 0, pose: { ...STAND, hN: 0, hF: 0, kN: 6, kF: 6, fN: -45, fF: -45, hd: -10 } });
  const water = G(p, { o: 0 });
  mk('rect', { x: x - 260 * s, y: y - 14 * s, width: 560 * s, height: 70 * s, rx: 10, fill: '#7fc4e8', 'fill-opacity': .22 }, water);
  const wl = path(water, '', { stroke: '#7fc4e8', 'stroke-width': 3 });
  const sw = { f, water };
  sw.set = q => {
    const a = 360 * q;
    f.set({ aN: 180 - (a % 360), eN: 18, aF: 180 - ((a + 180) % 360), eF: 18, hN: 12 * Math.sin(rad(a * 3)), hF: -12 * Math.sin(rad(a * 3)) });
    let d = '';
    for (let i = 0; i <= 40; i++) { const xx = x - 260 * s + i * 14 * s; d += `${i ? 'L' : 'M'}${xx.toFixed(1)} ${(y - 14 * s + 3 * Math.sin(i * .8 + q * 12)).toFixed(1)}`; }
    wl.setAttribute('d', d);
  };
  sw.set(0);
  if (t0 !== null) { show(f.g, t0); show(water, t0); }
  return sw;
}
// The cardiac cycle on a strip: systole (red) and diastole (green — the coronary arteries fill), win seconds wide.
function cycleStrip(p, x0, y, w, bpm, sys, t0, { win = 3, h = 34 } = {}) {
  const g = G(p, { o: 0 }), T0 = 60 / bpm;
  for (let t = 0; t < win - 1e-6; t += T0) {
    const a = x0 + t / win * w, b = x0 + Math.min(win, t + sys) / win * w, c = x0 + Math.min(win, t + T0) / win * w;
    mk('rect', { x: a, y, width: b - a, height: h, fill: mix(DEM, COL.board, .35), stroke: DEM, 'stroke-width': 1.5 }, g);
    if (c > b) mk('rect', { x: b, y, width: c - b, height: h, fill: mix(SUP, COL.board, .35), stroke: SUP, 'stroke-width': 1.5 }, g);
  }
  if (t0 !== null) show(g, t0);
  return g;
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Аэробная тренировка', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 7 · Урок 78', { x: 800, y: 150, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'Аэробная тренировка', { x: 800, y: 235, size: 56, weight: 600, anchor: 'middle' });
    T(g, 'ключевые понятия', { x: 800, y: 300, size: 44, weight: 600, anchor: 'middle', fill: COL.dim });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'активность, упражнение, выносливость, адаптация', 800, 380, m('sub'), { size: 30, fill: COL.task, anchor: 'middle', weight: 600 });
    const art = G(scene, { o: 0 });
    const tm = treadmill(art, 700, 850, .8);
    const h = heartEl(art, 1060, 640, .85);
    prog(q => { tm.set({ ph: q * 7 }); h.beat(cyc(q, 11)); }, .4, Math.max(4, D - 1.4), lin);
    show(art, .3);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);
  }],

  ['act', 'Активность и упражнение', (m, D) => {
    const p = panel(0);
    txt(p, 'физическая активность, упражнение, физическая форма', 800, 62, m('act'), { size: 28, weight: 700, anchor: 'middle' });
    // physical activity: the outer box; exercise: the box inside it
    const outer = G(p, { o: 0 });
    roundBox(outer, 60, 100, 860, 560, ACT, PANEL, 2.5);
    T(outer, 'физическая активность', { x: 84, y: 144, size: 27, weight: 700, fill: ACT });
    put(para(outer, 'любое движение скелетных мышц с заметным ростом расхода энергии', 84, 178, null, { size: 21, maxW: 370 }), { o: 1 });
    show(outer, m('act'));
    const f = stepUp(p, 250, 610, .62, m('act', 2));
    put(f.g, { o: 0 }); show(f.g, m('act', .8));
    const bag = carry(p, f, c => boxProp(c, 34, 46, '#c9a97a'), { turn: false, along: 16 }); put(bag, { o: 0 }); show(bag, m('act', .8));
    pill(p, 'по лестнице с сумками', 240, 640, m('act', 2.5), { col: ACT, size: 19 });
    const inner = G(p, { o: 0 });
    roundBox(inner, 470, 240, 430, 400, EXC, COL.board, 2.5);
    T(inner, 'упражнение', { x: 492, y: 282, size: 27, weight: 700, fill: EXC });
    T(inner, 'запланировано, ради формы', { x: 492, y: 314, size: 21, fill: COL.chalk });
    show(inner, m('ex'));
    const bike = cycleErgo(p, 600, 610, .62, m('ex', .3));
    prog(q => bike.crank(2 * Math.PI * 9 * q, .8), m('ex', .5), Math.max(4, D - m('ex', .8)), lin);
    // physical fitness and its parts
    infoCard(p, 950, 100, 590, 160, 'физическая форма', 'способность выполнять физическую работу', FIT, m('fit'), { size: 22 });
    ['работа сердца и лёгких', 'мышечная сила', 'мышечная выносливость', 'гибкость', 'оптимальный состав тела'].forEach((s, i) =>
      pill(p, s, 1245, 310 + i * 68, m('fit', 1.5 + i * .9), { col: FIT, size: 23 }));
    txt(p, 'как улучшить: регулярно, крупные группы мышц, нагрузка на сердце и лёгкие', 800, 730, m('how'), { size: 24, weight: 600, anchor: 'middle' });
    pillRow(p, ['ходьба', 'велосипед', 'бег', 'плавание', 'подъём по лестнице', 'лыжи', 'отягощения'], 800, 810, m('how', 3), { col: EXC, size: 22, gap: .45 });
  }],

  ['vo2', 'Максимальное потребление кислорода', (m, D) => {
    const p = panel(0);
    txt(p, 'максимальное потребление кислорода (VO₂max)', 800, 62, m('scale'), { size: 28, weight: 700, anchor: 'middle' });
    // the fitness scale from poor to superior
    const sg = G(p, { o: 0 }), id = 'fs' + (++SHADE_ID), defs = mk('defs', {}, sg), gr = mk('linearGradient', { id }, defs);
    [[0, COL.bad], [.5, COL.int], [1, COL.good]].forEach(([o, c]) => mk('stop', { offset: o, 'stop-color': c }, gr));
    mk('rect', { x: 260, y: 140, width: 1080, height: 22, rx: 11, fill: `url(#${id})` }, sg);
    T(sg, 'плохой', { x: 240, y: 158, size: 22, fill: COL.bad, anchor: 'end', weight: 600 });
    T(sg, 'превосходный', { x: 1360, y: 158, size: 22, fill: COL.good, weight: 600 });
    T(sg, 'уровень формы — по расходу энергии во время работы', { x: 800, y: 100, size: 21, fill: COL.dim, anchor: 'middle' });
    const mark = path(sg, 'M0 -14L-12 -32H12Z', { fill: COL.chalk, stroke: 'none' });
    show(sg, m('scale'));
    prog(q => put(mark, { x: 260 + 1080 * (.2 + .6 * cyc(q, 1.5)), y: 140 }), m('scale', .5), Math.max(3, m('def') - m('scale', .5)), io);
    txt(p, 'влияют:', 330, 222, m('fac'), { size: 22, fill: COL.dim, anchor: 'end' });
    pillRow(p, ['возраст', 'пол', 'наследственность', 'малоподвижность', 'болезни'], 830, 222, m('fac', .3), { col: COL.int, size: 21, gap: .45 });
    // the definition and its unit
    const dg = G(p, { o: 0 });
    roundBox(dg, 300, 270, 1000, 200, COL.whole, PANEL, 2.5);
    put(para(dg, 'наибольшее количество кислорода, потреблённое за минуту при максимальном усилии', 800, 316, null, { size: 25, weight: 600, maxW: 900, anchor: 'middle' }), { o: 1 });
    show(dg, m('def'));
    pill(p, 'мл O₂ / кг / мин', 800, 430, m('def', 4), { col: O2C, size: 30 });
    txt(p, 'работа многих крупных мышц: ходьба, бег, плавание', 800, 500, m('def', 2.5), { size: 21, fill: COL.dim, anchor: 'middle' });
    // the oxygen chain: lungs, blood, heart, extraction, the muscle's oxidative potential
    const xs = [220, 510, 800, 1090, 1380], cy0 = 660;
    const lu = lungsEl(p, xs[0], cy0 - 4, .48, m('chain'));
    const rbc = G(p, { o: 0 });
    [[-34, -16], [24, -26], [-6, 22], [36, 24]].forEach(([dx, dy]) => {
      mk('ellipse', { cx: xs[1] + dx, cy: cy0 + dy, rx: 26, ry: 17, fill: BLOOD_A, stroke: mix(BLOOD_A, '#000000', .4), 'stroke-width': 2 }, rbc);
      mk('ellipse', { cx: xs[1] + dx, cy: cy0 + dy, rx: 12, ry: 7, fill: mix(BLOOD_A, '#000000', .25) }, rbc);
    });
    show(rbc, m('chain', 1));
    const ht = heartEl(p, xs[2], cy0 - 4, .52, m('chain', 2));
    const cap = G(p, { o: 0 });
    tube(cap, `M${xs[3] - 90} ${cy0}C${xs[3] - 30} ${cy0 - 50} ${xs[3] + 30} ${cy0 + 50} ${xs[3] + 90} ${cy0}`, BLOOD_A, 24);
    mk('rect', { x: xs[3] - 90, y: cy0 + 36, width: 180, height: 40, rx: 12, fill: mix(ANAT.muscle, COL.board, .3), stroke: ANAT.muscle, 'stroke-width': 2 }, cap);
    show(cap, m('chain', 3));
    const o2d = [0, 1, 2].map(() => put(mk('circle', { r: 5, fill: O2C }, cap), { o: 0 }));
    prog(q => o2d.forEach((d, i) => { const u = (q * 6 + i / 3) % 1; put(d, { x: xs[3] - 50 + i * 50, y: cy0 + 4 + 46 * u, o: q > 0 ? 1 - u : 0 }); }), m('chain', 3.5), Math.max(3, D - m('chain', 3.8)), lin);
    const fb = fibreX(p, xs[4], cy0, 82, { t0: m('chain', 4) }); fb.set({ mito: 1, cap: .3, enz: .6 });
    const labs = [['доставка', 'кислорода'], ['связывание', 'O₂ кровью'], ['работа', 'сердца'], ['извлечение', 'O₂ тканями'], ['окислительные', 'возможности мышц']];
    labs.forEach(([a, b], i) => { txt(p, a, xs[i], 790, m('chain', i), { size: 20, weight: 700, fill: O2C, anchor: 'middle' }); txt(p, b, xs[i], 816, m('chain', i), { size: 20, fill: COL.chalk, anchor: 'middle' }); });
    [0, 1, 2, 3].forEach(i => arrowTo(p, [xs[i] + 95, cy0 - 100], [xs[i + 1] - 95, cy0 - 100], m('chain', i + .6), { col: O2C, w: 3 }));
    // oxygen moving along the chain
    const dots = [0, 1, 2, 3].map(() => put(mk('circle', { r: 7, fill: O2C }, p), { o: 0 }));
    prog(q => { lu.breathe(cyc(q, 4)); ht.beat(cyc(q, 10)); dots.forEach((d, i) => { const u = (q * 3 + i / 4) % 1; put(d, { x: lerp(xs[0], xs[4], u), y: cy0 - 100 - 18 * Math.sin(Math.PI * ((u * 4) % 1)), o: q > 0 ? .9 : 0 }); }); }, m('chain', 4.5), Math.max(3, D - m('chain', 4.8)), lin);
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-actex', prompt: ['Физическая активность или упражнение?'],
    build: grid([
      { parts: ['Подняться на третий этаж с пакетами'], ans: ['act'], why: 'Движение с заметным расходом энергии, но без плана и цели улучшить форму.' },
      { parts: ['Велотренажёр 30 минут три раза в неделю, чтобы стать выносливее'], ans: ['ex'], why: 'Запланировано, выстроено и нацелено на форму — это упражнение.' },
      { parts: ['Перекопать грядки на даче'], ans: ['act'], why: 'Работа в саду — физическая активность.' },
      { parts: ['Программа ходьбы, которую составил физический терапевт'], ans: ['ex'], why: 'План с целью улучшить форму — упражнение.' },
    ], [['act', 'Активность', ACT], ['ex', 'Упражнение', EXC]], { multi: false, text: true }),
  }], done) }],

  ['end', 'Выносливость', (m, D) => {
    const p = panel(0);
    txt(p, 'выносливость: долго работать и противостоять утомлению', 800, 62, m('end'), { size: 28, weight: 700, anchor: 'middle' });
    // muscular endurance: one group, many repetitions
    infoCard(p, 60, 110, 700, 150, 'мышечная', 'одна группа мышц повторяет сокращения долгое время', COL.nat, m('mus'), { size: 22 });
    const c = curlFig(p, 330, 800, 1.2, 1, m('mus', .3));
    curls(c, m('mus', .6), Math.max(4, D - m('mus', .9)), 13.5, { lvl: .8 });
    const rep = txt(p, '', 560, 520, m('mus', .6), { size: 34, weight: 700, fill: COL.nat, anchor: 'middle' });
    prog(q => { rep.textContent = `× ${Math.min(14, Math.floor(q * 14 + .5))}`; }, m('mus', .6), Math.max(4, D - m('mus', .9)), lin);
    // cardiovascular endurance: large muscles, a long time
    infoCard(p, 840, 110, 700, 150, 'сердечно-сосудистая', 'долгая динамическая работа крупных мышц: ходьба, плавание, велосипед', COL.whole, m('cv'), { size: 22 });
    const tm = treadmill(p, 1170, 820, .95, m('cv', .3));
    prog(q => tm.set({ ph: q * 9 }), m('cv', .5), Math.max(4, D - m('cv', .8)), lin);
    const clock = txt(p, '', 1450, 380, m('cv', .5), { size: 34, weight: 700, fill: COL.whole, anchor: 'middle' });
    prog(q => { clock.textContent = `${Math.round(q * 40)} мин`; }, m('cv', .5), Math.max(4, D - m('cv', .8)), lin);
    const h = heartEl(p, 1450, 500, .42, m('cv', .5));
    prog(q => h.beat(cyc(q, 14)), m('cv', .5), Math.max(4, D - m('cv', .8)), lin);
  }],

  ['train', 'Аэробная тренировка', (m, D) => {
    const p = panel(0);
    txt(p, 'аэробная тренировка: мышца лучше использует энергию', 800, 62, m('train'), { size: 28, weight: 700, anchor: 'middle' });
    // a fascicle before and after training
    txt(p, 'до', 230, 125, m('cell'), { size: 24, weight: 700, fill: COL.dim, anchor: 'middle' });
    txt(p, 'после тренировки', 590, 125, m('cell'), { size: 24, weight: 700, fill: COL.good, anchor: 'middle' });
    fibreX(p, 230, 300, 140, { t0: m('cell') });
    const fb = fibreX(p, 590, 300, 140, { t0: m('cell') });
    let enz = 0, mito = 0, cap = 0;
    prog(q => { enz = q; fb.set({ enz, mito, cap }); }, m('enz'), 1.2);
    prog(q => { mito = q; fb.set({ enz, mito, cap }); }, m('mito'), 1.2);
    prog(q => { cap = q; fb.set({ enz, mito, cap }); }, m('cap'), 1.2);
    pill(p, 'схема', 410, 470, m('cell'), { col: COL.dim, size: 18 });
    const leg = [['окислительные ферменты ↑', ANAT.taut, 'enz'], ['митохондрии: больше и крупнее', '#e0904a', 'mito'], ['капилляры ↑', BLOOD_A, 'cap']];
    leg.forEach(([s, c, k], i) => pill(p, s, 410, 515 + i * 50, m(k), { col: c, size: 21 }));
    infoCard(p, 840, 110, 700, 175, 'зависит от частоты, интенсивности и длительности', 'приспособление сердца, сосудов и мышц — видно по выносливости', FIT, m('fit3'), { size: 22 });
    // specificity: swimming trains swimming
    txt(p, 'принцип специфичности', 1190, 345, m('spec'), { size: 26, weight: 700, fill: COL.whole, anchor: 'middle' });
    const sw = swimmer(p, 1010, 470, .8, m('swim'));
    prog(q => sw.set(q * 4), m('swim', .2), Math.max(4, D - m('swim', .5)), lin);
    txt(p, 'тренировка: плавание', 1010, 575, m('swim'), { size: 21, fill: COL.dim, anchor: 'middle' });
    pill(p, 'плавание ↑', 1400, 470, m('swim', 1), { col: COL.good, size: 24 });
    checkMark(p, 1500, 470, m('swim', 1.4));
    const tm = treadmill(p, 980, 860, .6, m('run'));
    prog(q => tm.set({ ph: q * 6, run: true }), m('run', .2), Math.max(3, D - m('run', .5)), lin);
    pill(p, 'бег на дорожке — может не улучшиться', 1330, 760, m('run', .5), { col: COL.int, size: 21 });
  }],

  ['adapt', 'Адаптация', (m, D) => {
    const p = panel(0);
    txt(p, 'адаптация: та же работа — меньшей ценой', 800, 62, m('adapt'), { size: 28, weight: 700, anchor: 'middle' });
    // HR at the same workload over the weeks of training
    const x0 = 130, y0 = 560, w = 620, h = 330;
    chartAxes(p, x0, y0, w, h, 'ЧСС на той же нагрузке', 'недели', m('adapt'));
    [0, 4, 8, 12].forEach(k => txt(p, String(k), x0 + k / 14 * w, y0 + 30, m('adapt'), { size: 19, fill: COL.dim, anchor: 'middle' }));
    const band = put(mk('rect', { x: x0 + 10 / 14 * w, y: y0 - h, width: 2 / 14 * w, height: h, fill: COL.good, 'fill-opacity': .14 }, p), { o: 0 });
    show(band, m('adapt', 2));
    txt(p, '10–12 недель: изменения измеримы', x0 + 11 / 14 * w, y0 - h - 14, m('adapt', 2), { size: 20, fill: COL.good, anchor: 'middle', weight: 700 });
    const fn = x => .9 - .32 * (1 - Math.exp(-x * 2.4));
    draw(path(p, fnPath(x0, y0, w, h, fn), { stroke: COL.whole, 'stroke-width': 5 }, { d: 0 }), m('adapt', .5), 3);
    pill(p, 'схема', x0 + w - 40, y0 - h + 30, m('adapt', .5), { col: COL.dim, size: 18 });
    infoCard(p, 80, 640, 700, 200, 'нервные, физические и биохимические изменения', 'итог один: ту же работу человек выполняет с меньшими физиологическими затратами', COL.good, m('cost'), { size: 22 });
    // the training threshold: low and high fitness
    infoCard(p, 840, 110, 700, 150, 'порог тренировочного стимула', 'наименьшая нагрузка, которая вызывает ответ', COL.int, m('thr'), { size: 22 });

    id: 'p-adapt', prompt: ['Одинаковую программу ходьбы начинают малоподвижный мужчина 55 лет и бегун-любитель. Чего ожидать?'],
    build: choice([
      ['У малоподвижного прирост будет больше; бегуну для заметных сдвигов нужна более интенсивная нагрузка'],
      ['Прирост будет одинаковым — программа ведь одна'],
      ['Больше улучшится бегун: он лучше тренирован'],
      ['Через две недели оба заметно улучшат форму'],
    ], 0, 'У человека с низким уровнем формы больше потенциал роста; чем выше исходный уровень, тем выше порог тренировочного стимула.',
    [null, 'Адаптация зависит от исходного уровня формы и порога стимула.', 'Наоборот: у тренированного меньше запас роста и выше порог.', 'Заметные изменения измеряют через 10–12 недель.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
