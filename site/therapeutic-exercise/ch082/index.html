<script>
'use strict';
const CHAPTER = { number: 82, title: 'FITT и структура занятия', minutes: 13, language: 'ru', next: '../ch083/' };
// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch082/cards.ru.json
const CARDS_SHORT = {
  "здоровый человек ≠ пациент\nпрограммы разные, но любая должна вызвать кондиционирующий ответ сердца и сосудов": "любая → кондиционирующий ответ",
  "рекомендация ACSM\nАмериканский колледж спортивной медицины": "Американский колледж спортивной медицины",
  "порог индивидуален\nзависит от здоровья, активности, возраста и пола: чем выше исходная форма, тем выше нужна интенсивность": "исходная форма выше → интенсивность выше",
  "детренированным хватит меньшего\n40–50 % VO₂max; нагрузка не обязана быть изнуряющей": "40–50 % VO₂max",
  "1) процент от максимальной ЧСС\nпроцент зависит от уровня формы": "процент зависит от уровня формы",
  "2) Карвонен: через резерв ЧСС\nтренировочная = покой + 60–70 % × (макс − покой)": "тренировочная = покой + 60–70 % × (макс − покой)",
  "некоторым детренированным\nтри занятия по 5 минут в день": "три занятия по 5 минут в день",
  "тип: крупные мышцы, ритмично, аэробно\nвеличина сдвигов зависит от вида работы": "величина сдвигов зависит от вида работы",
  "объём = частота × интенсивность × время\nМЕТ-минуты или ккал в неделю; взрослым — ≥ 500–1000 МЕТ-мин (≈ 1000 ккал)": "взрослым ≥ 500–1000 МЕТ-мин",
  "поддерживать легче\nдля сохранения формы нужно меньше занятий, чем для её роста": "нужно меньше занятий",
  "6–17 лет\n60 минут умеренной или интенсивной активности каждый день": "60 минут каждый день",
  "18–65 лет\n30 мин умеренной (3–5,9 МЕТ) × 5 дн или 20 мин интенсивной (≥ 6 МЕТ) × 3 дн или сочетание; отрезки ≥ 10 мин; 500–1000 МЕТ-мин или 1000 ккал в неделю": "30 мин × 5 дн или 20 мин × 3 дн",
  "≥ 65 лет\nи 50–65 лет с хроническими болезнями: то же, а интенсивность — по шкале 0–10": "интенсивность — по шкале 0–10",
  "выше порога адаптации, в пределах переносимости, ниже уровня симптомов\nцель — ударный объём и сердечный выброс ↑, местный кровоток и аэробный обмен ↑; субмаксимально, ритмично, крупные мышцы": "ударный объём ↑, субмаксимально, ритмично",
};
// cards-short end

const FC = [['частота', 'Frequency', COL.whole], ['интенсивность', 'Intensity', COL.bad], ['время', 'Time', COL.task], ['тип', 'Type', COL.good], ['объём', 'Volume', COL.real], ['прогрессия', 'Progression', COL.int]];
const HRC = COL.bad, ZONE = COL.good, WARM = COL.int, COOL = COL.whole;
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
function row(p, x, y, w, s, col, t0, { size = 21, h = 64 } = {}) {
  const g = G(p, { o: 0 });
  mk('rect', { x, y, width: w, height: h, rx: 12, fill: PANEL, stroke: col, 'stroke-width': 2 }, g);
  mk('circle', { cx: x + 24, cy: y + h / 2, r: 8, fill: col }, g);
  const t = para(g, s, x + 44, y + h / 2 + size * .35, null, { size, maxW: w - 60 });
  put(t, { o: 1, y: -(t._h - size * 1.32) / 2 });
  show(g, t0);
  return g;
}
// The FITT-VP strip at the top of a beat: the current parameter is filled.
function fittStrip(p, cur, t0) {
  const ws = FC.map(([s]) => uiW(s, 20) + 30), tot = ws.reduce((a, b) => a + b, 0) + 12 * 5;
  let x = 800 - tot / 2;
  FC.forEach(([s, , c], i) => {
    const g = G(p, { x: x + ws[i] / 2, y: 112, o: 0 });
    mk('rect', { x: -ws[i] / 2, y: -21, width: ws[i], height: 32, rx: 16, fill: i === cur ? c : COL.board, stroke: c, 'stroke-width': 2, opacity: i === cur ? 1 : .55 }, g);
    T(g, s, { y: 1, size: 20, weight: 700, fill: i === cur ? COL.board : c, anchor: 'middle' });
    show(g, t0, .4);
    x += ws[i] + 12;
  });
}
// An HR trace of a session over time (minutes): warm-up to target − 20, the aerobic part in the zone, cool-down.
const session = t => t < 10 ? lerp(70, 118, t / 10) : t < 12 ? lerp(118, 138, (t - 10) / 2) : t < 38 ? 138 + 3 * Math.sin(t * 1.3) : t < 46 ? lerp(138, 82, (t - 38) / 8) : 82;

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Программа аэробных упражнений', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 7 · Урок 82', { x: 800, y: 150, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'Программа аэробных упражнений', { x: 800, y: 235, size: 54, weight: 600, anchor: 'middle' });
    T(g, 'FITT-VP и структура занятия', { x: 800, y: 300, size: 44, weight: 600, anchor: 'middle', fill: COL.dim });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'частота, интенсивность, время, тип, объём, прогрессия', 800, 380, m('sub'), { size: 30, fill: COL.task, anchor: 'middle', weight: 600 });
    const art = G(scene, { o: 0 });
    const knobs = FC.map(([s, , c], i) => {
      const x = 400 + i * 160;
      path(art, `M${x} 500V800`, { stroke: mix(c, COL.board, .5), 'stroke-width': 10 });
      T(art, s, { x, y: 840, size: 20, weight: 700, fill: c, anchor: 'middle' });
      return mk('circle', { cx: x, cy: 650, r: 22, fill: c, stroke: COL.board, 'stroke-width': 3 }, art);
    });
    prog(q => knobs.forEach((k, i) => k.setAttribute('cy', (650 - 110 * Math.sin(2 * Math.PI * (q * 1.5 + i * .17))).toFixed(1))), .4, Math.max(4, D - 1.4), lin);
    show(art, .3);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);
  }],

  ['fitt', 'FITT-VP', (m, D) => {
    const p = panel(0);
    txt(p, 'схема программы: FITT-VP', 800, 62, m('fitt'), { size: 28, weight: 700, anchor: 'middle' });
    infoCard(p, 60, 100, 700, 140, 'здоровый человек ≠ пациент', 'программы разные, но любая должна вызвать кондиционирующий ответ сердца и сосудов', COL.chalk, m('fitt'), { size: 21 });
    infoCard(p, 840, 100, 700, 140, 'рекомендация ACSM', 'Американский колледж спортивной медицины', COL.dim, m('vp'), { size: 21 });
    FC.forEach(([s, en, c], i) => {
      const g = G(p, { o: 0 }), x = 160 + i * 256;
      mk('rect', { x: x - 110, y: 290, width: 220, height: 540, rx: 22, fill: PANEL, stroke: c, 'stroke-width': 3 }, g);
      T(g, s, { x, y: 340, size: 26, weight: 700, fill: c, anchor: 'middle' });
      T(g, `(${en})`, { x, y: 372, size: 19, fill: COL.dim, anchor: 'middle' });
      path(g, `M${x} 430V780`, { stroke: mix(c, COL.board, .5), 'stroke-width': 12 });
      const kn = mk('circle', { cx: x, cy: 700, r: 26, fill: c, stroke: COL.board, 'stroke-width': 4 }, g);
      T(g, en[0], { x, y: 810, size: 26, weight: 700, fill: c, anchor: 'middle' });
      show(g, m('vp', 1 + i * .55));
      prog(q => kn.setAttribute('cy', (700 - 200 * cyc(q, 1) * (.5 + .5 * Math.sin(i))).toFixed(1)), m('vp', 1.3 + i * .55), 2);
    });
  }],

  ['freq', 'Частота', (m, D) => {
    const p = panel(0);
    txt(p, 'частота: сколько раз в неделю', 800, 62, m('freq'), { size: 28, weight: 700, anchor: 'middle' });
    fittStrip(p, 0, m('freq'));
    const days = ['пн', 'вт', 'ср', 'чт', 'пт', 'сб', 'вс'];
    const week = (y, marks, col, lab, sub, t0, dim = false) => {
      const g = G(p, { o: 0 });
      T(g, lab, { x: 60, y: y + 44, size: 24, weight: 700, fill: col });
      if (sub) put(para(g, sub, 60, y + 76, null, { size: 19, fill: COL.dim, maxW: 300 }), { o: 1 });
      days.forEach((d, i) => {
        const x = 420 + i * 150, on = marks.includes(i);
        mk('rect', { x, y, width: 130, height: 110, rx: 14, fill: on ? mix(col, COL.board, dim ? .7 : .5) : PANEL, stroke: on ? col : COL.faint, 'stroke-width': 2 }, g);
        T(g, d, { x: x + 65, y: y + 34, size: 20, fill: COL.dim, anchor: 'middle' });
        if (on) mk('circle', { cx: x + 65, cy: y + 72, r: 14, fill: col }, g);
      });
      show(g, t0);
    };
    week(170, [0, 2, 4, 5], ZONE, '3–4 раза', 'обычно оптимально', m('freq', 1));
    infoCard(p, 420, 300, 1030, 90, 'зависит от здоровья и возраста; возможно, важна меньше интенсивности и длительности', null, COL.dim, m('freq', 4), { size: 20 });
    week(430, [0, 1, 2, 3, 4, 5], COL.whole, 'низкая интенсивность', 'полезнее заниматься чаще', m('low'), true);
    week(600, [1, 4], COL.bad, '2 раза', 'обычно мало для сдвигов', m('two'));
    pill(p, 'пожилым и выздоравливающим может помочь', 935, 760, m('two', 2.5), { col: ZONE, size: 22 });
  }],

  ['int', 'Интенсивность', (m, D) => {
    const p = panel(0);
    txt(p, 'интенсивность — самый важный компонент', 800, 62, m('int'), { size: 28, weight: 700, anchor: 'middle' });
    fittStrip(p, 1, m('int'));
    // overload: the load must stay above the training threshold, which rises as the body adapts
    const x0 = 110, y0 = 560, w = 700, h = 340, X = t => x0 + t * w;
    chartAxes(p, x0, y0, w, h, 'нагрузка', 'недели', m('ovl'));
    show(put(path(p, `M${x0} ${y0 - .3 * h}H${x0 + w}`, { stroke: COL.dim, 'stroke-width': 3, 'stroke-dasharray': '4 6' }), { o: 0 }), m('ovl', .5));
    txt(p, 'повседневная', x0 + w - 6, y0 - .3 * h + 26, m('ovl', .5), { size: 19, fill: COL.dim, anchor: 'end' });
    const thr = path(p, `M${x0} ${y0 - .45 * h}H${X(.33)}V${y0 - .58 * h}H${X(.66)}V${y0 - .7 * h}H${X(1)}`, { stroke: COL.int, 'stroke-width': 3, 'stroke-dasharray': '10 8' }, { o: 0 });
    show(thr, m('ovl', 2));
    txt(p, 'порог', x0 + 8, y0 - .45 * h + 26, m('ovl', 2), { size: 20, fill: COL.int, weight: 700 });
    const ld = path(p, `M${x0} ${y0 - .53 * h}H${X(.33)}V${y0 - .66 * h}H${X(.66)}V${y0 - .8 * h}H${X(1)}`, { stroke: HRC, 'stroke-width': 6 }, { d: 0 });
    draw(ld, m('ovl', 3), 2.5);
    txt(p, 'тренировочная нагрузка', X(.68), y0 - .8 * h - 16, m('ovl', 3.5), { size: 20, fill: HRC, weight: 700 });
    txt(p, 'адаптировался — повышаем', X(.36), y0 - .3 * h - 20, m('ovl', 5), { size: 19, fill: COL.chalk });
    pill(p, 'схема', x0 + w - 40, y0 - h - 20, m('ovl'), { col: COL.dim, size: 18 });
    infoCard(p, 60, 640, 760, 210, 'порог индивидуален', 'зависит от здоровья, активности, возраста и пола: чем выше исходная форма, тем выше нужна интенсивность', COL.int, m('thr'), { size: 21 });
    // the zones on an HR gauge
    const gx = 1100, gt = 170, gh = 440, Yp = v => gt + gh * (1 - v / 100);
    const gg = G(p, { o: 0 });
    mk('rect', { x: gx, y: gt, width: 70, height: gh, rx: 14, fill: PANEL, stroke: COL.faint, 'stroke-width': 2 }, gg);
    [0, 20, 40, 60, 80, 100].forEach(v => T(gg, `${v}`, { x: gx - 14, y: Yp(v) + 7, size: 19, fill: COL.dim, anchor: 'end' }));
    T(gg, '% ЧСС макс', { x: gx + 35, y: gt - 16, size: 20, fill: COL.dim, anchor: 'middle' });
    show(gg, m('zone'));
    show(put(mk('rect', { x: gx, y: Yp(90), width: 70, height: Yp(60) - Yp(90), rx: 8, fill: ZONE, 'fill-opacity': .55 }, p), { o: 0 }), m('zone', .5));
    txt(p, '60–90 % ЧСС макс', gx + 90, Yp(80), m('zone', .5), { size: 23, weight: 700, fill: ZONE });
    txt(p, '≈ 50–85 % VO₂max', gx + 90, Yp(80) + 32, m('zone', 2), { size: 21, fill: COL.chalk });
    show(put(path(p, `M${gx - 10} ${Yp(70)}H${gx + 80}`, { stroke: COL.chalk, 'stroke-width': 5 }), { o: 0 }), m('y70'));
    txt(p, '70 % — минимум', gx + 90, Yp(70) + 70, m('y70'), { size: 20, weight: 700, fill: COL.chalk });
    txt(p, 'для здоровых молодых', gx + 90, Yp(70) + 96, m('y70'), { size: 20, fill: COL.chalk });
    infoCard(p, 870, 640, 680, 150, 'детренированным хватит меньшего', '40–50 % VO₂max; нагрузка не обязана быть изнуряющей', COL.whole, m('dec'), { size: 21 });
  }],

  ['hr', 'Тренировочный пульс', (m, D) => {
    const p = panel(0);
    txt(p, 'тренировочный пульс: процент максимума или Карвонен', 800, 62, m('hr'), { size: 28, weight: 700, anchor: 'middle' });
    txt(p, 'максимальная ЧСС у молодых здоровых:', 60, 175, m('hr'), { size: 22, weight: 700 });
    ['максимальный ступенчатый тест', 'расчёт по субмаксимальному тесту', '220 − возраст — менее точно'].forEach((s, i) => row(p, 60, 195 + i * 74, 640, s, i === 2 ? COL.int : COL.whole, m('hr', 1.5 + i * 1.3), { h: 62 }));
    infoCard(p, 60, 440, 700, 120, '1) процент от максимальной ЧСС', 'процент зависит от уровня формы', COL.whole, m('pct'), { size: 21 });
    infoCard(p, 60, 580, 700, 160, '2) Карвонен: через резерв ЧСС', 'тренировочная = покой + 60–70 % × (макс − покой)', ZONE, m('karv'), { size: 22 });
    // the worked example on an HR scale
    const sx = 1000, st0 = 140, sh = 700, Yb = v => st0 + sh * (1 - (v - 40) / 160);
    const sg = G(p, { o: 0 });
    mk('rect', { x: sx, y: st0, width: 80, height: sh, rx: 14, fill: PANEL, stroke: COL.faint, 'stroke-width': 2 }, sg);
    [60, 100, 140, 180].forEach(v => T(sg, String(v), { x: sx - 14, y: Yb(v) + 7, size: 19, fill: COL.dim, anchor: 'end' }));
    T(sg, 'уд/мин', { x: sx + 40, y: st0 - 16, size: 20, fill: COL.dim, anchor: 'middle' });
    show(sg, m('cmp'));
    const mark = (v, s, col, t0) => { show(put(path(p, `M${sx - 8} ${Yb(v)}H${sx + 88}`, { stroke: col, 'stroke-width': 4 }), { o: 0 }), t0); txt(p, s, sx + 100, Yb(v) + 8, t0, { size: 22, weight: 700, fill: col }); };
    mark(70, 'покой 70', COL.whole, m('cmp', .5));
    mark(180, 'макс 220 − 40 = 180', HRC, m('cmp', 1.5));
    const rr = G(p, { o: 0 });
    path(rr, `M${sx - 80} ${Yb(70)}V${Yb(180)}M${sx - 90} ${Yb(70)}H${sx - 70}M${sx - 90} ${Yb(180)}H${sx - 70}`, { stroke: COL.int, 'stroke-width': 3 });
    T(rr, 'резерв 110', { x: sx - 100, y: Yb(125) + 8, size: 21, weight: 700, fill: COL.int, anchor: 'end' });
    show(rr, m('cmp', 3));
    show(put(mk('rect', { x: sx, y: Yb(147), width: 80, height: Yb(136) - Yb(147), fill: ZONE, 'fill-opacity': .7 }, p), { o: 0 }), m('cmp', 5));
    txt(p, 'Карвонен: 136–147', sx + 100, Yb(141.5) + 8, m('cmp', 5), { size: 24, weight: 700, fill: ZONE });
    show(put(mk('rect', { x: sx, y: Yb(126), width: 80, height: Yb(108) - Yb(126), fill: COL.whole, 'fill-opacity': .55 }, p), { o: 0 }), m('pcmp'));
    txt(p, '60–70 % от макс: 108–126', sx + 100, Yb(117) + 8, m('pcmp'), { size: 22, weight: 700, fill: COL.whole });
    infoCard(p, 60, 760, 700, 100, 'по Карвонену тренировочный пульс выше', null, ZONE, m('pcmp', 2), { size: 22 });
    txt(p, 'пример: 40 лет, пульс покоя 70', 1200, 890 - 10, m('cmp'), { size: 21, fill: COL.dim, anchor: 'middle' });
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-karv', prompt: ['Пациенту 50 лет, пульс покоя 70. Посчитайте тренировочный пульс по Карвонену (60 %).'],
    build: blanks([
      { parts: ['Максимальная ЧСС: 220 − 50 = ', { box: '170' }], why: '220 − возраст.' },
      { parts: ['Резерв ЧСС: 170 − 70 = ', { box: '100' }], why: 'Максимальная минус ЧСС покоя.' },
      { parts: ['Тренировочная: 0,6 × 100 + 70 = ', { box: '130' }, ' уд/мин'], why: '60 % резерва плюс пульс покоя.' },
    ]),
  }], done) }],

  ['risk', 'Пациенты и интенсивность', (m, D) => {
    const p = panel(0);
    txt(p, 'интенсивность у пациентов; риск и специфичность', 800, 62, m('risk'), { size: 28, weight: 700, anchor: 'middle' });
    infoCard(p, 60, 100, 720, 230, 'риск ИБС, болезни сердца и хронические болезни, пожилой возраст', 'максимальную и тренировочную ЧСС берут из нагрузочного теста', COL.task, m('risk'), { size: 22 });
    const cr = G(p, { o: 0 });
    put(pill(cr, '220 − возраст', 640, 262, null, { col: COL.bad, size: 22 }), { o: 1 });
    path(cr, 'M560 255H720', { stroke: COL.bad, 'stroke-width': 4 });
    show(cr, m('risk', 4));
    txt(p, 'большие ошибки', 640, 305, m('risk', 4.5), { size: 19, fill: COL.bad, anchor: 'middle' });
    // the symptom-limited HR is the ceiling
    const sx = 900, sy = 140, sw = 600, sh = 70, Xh = v => sx + (v - 60) / 120 * sw;
    const sg = G(p, { o: 0 });
    mk('rect', { x: sx, y: sy, width: sw, height: sh, rx: 12, fill: PANEL, stroke: COL.faint, 'stroke-width': 2 }, sg);
    [60, 90, 120, 150, 180].forEach(v => T(sg, String(v), { x: Xh(v), y: sy + sh + 28, size: 18, fill: COL.dim, anchor: 'middle' }));
    show(sg, m('slim'));
    show(put(path(p, `M${Xh(150)} ${sy - 12}V${sy + sh + 8}`, { stroke: COL.bad, 'stroke-width': 6 }), { o: 0 }), m('slim', .5));
    txt(p, 'ограничена симптомами', Xh(150), sy - 22, m('slim', .5), { size: 20, weight: 700, fill: COL.bad, anchor: 'middle' });
    show(put(mk('rect', { x: Xh(60 + .4 * 90), y: sy + 8, width: Xh(60 + .6 * 90) - Xh(60 + .4 * 90), height: sh - 16, rx: 8, fill: ZONE, 'fill-opacity': .6 }, p), { o: 0 }), m('start'));
    txt(p, 'старт: 40–60 % максимальной ЧСС', sx + sw / 2, sy + sh + 66, m('start'), { size: 22, weight: 700, fill: ZONE, anchor: 'middle' });

    txt(p, 'мышцы работают — кровь идёт к сердцу', vx + 10, 680, m('cpur', 1), { size: 21, weight: 700, fill: COOL, anchor: 'middle' });
    pill(p, 'схема', vx, 720, m('cpur'), { col: COL.dim, size: 18 });
    ['нет застоя крови в конечностях', 'нет обморока: кровь возвращается к сердцу и мозгу', 'быстрее восстановление: окисление продуктов обмена, запасы энергии', 'меньше риск ишемии миокарда и аритмий'].forEach((s, i) =>
      row(p, 640, 120 + i * 92, 900, s, COOL, m('cpur', .5 + i * 2.5), { h: 76, size: 22 }));
    txt(p, 'безопасность', 800, 520 + 0, m('safe'), { size: 25, weight: 700, fill: COL.int, anchor: 'middle' });
    pillRow(p, ['подходящая обувь', 'не по асфальту и бетону', 'не больше +10 % в неделю'], 1060, 590, m('safe', .8), { col: COL.int, size: 20, gap: 1.4 });
    pillRow(p, ['боль во время или > 2 ч после → снизить нагрузку', 'программа — под конкретного человека'], 1060, 660, m('safe', 5.5), { col: COL.int, size: 20, gap: 1.6 });
    const wf = fig(p, { x: 760, y: 880 - 182 * .4, s: .4, o: 0 });
    show(wf.g, m('cool')); ground(p, 700, 1500, 880, m('cool'));
    walk(wf, m('cool', .3), Math.max(3, D - m('cool', .6)), { cycles: 6, dx: 560 });
  }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['FITT-VP: 3–4 раза в неделю; 60–90 % ЧСС макс; 20–30 мин; крупные мышцы ритмично; объём 500–1000 МЕТ-мин в неделю.', 'w1'],
     ['Тренировочный пульс: % от максимума или Карвонен; у пациентов — по нагрузочному тесту, не выше ЧСС, ограниченной симптомами.', 'w2'],
     ['Прогрессия: время → частота → интенсивность; эффект обратим за недели.', 'w3'],
     ['Занятие: разминка, аэробная часть одним из четырёх методов, заминка — по 5–10 минут.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 30, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-karv60', prompt: ['Пациентке 60 лет, пульс покоя 80, сопутствующих болезней нет. Тренировочный пульс по Карвонену, 60–70 %:'],
    build: blanks([
      { parts: ['Максимальная ЧСС: ', { box: '160' }], why: '220 − 60.' },
      { parts: ['Резерв ЧСС: ', { box: '80' }], why: '160 − 80.' },
      { parts: ['Тренировочный пульс: от ', { box: '128' }, ' до ', { box: '136' }, ' уд/мин'], why: '0,6 × 80 + 80 = 128; 0,7 × 80 + 80 = 136.' },
    ]),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-progress', prompt: ['Пациент легко выполняет 20 минут ходьбы 3 раза в неделю при 60 % резерва ЧСС. Что увеличить первым?'],
    build: choice([
      ['Время занятия'],
      ['Интенсивность до 80 % резерва'],
      ['Частоту до ежедневных занятий'],
      ['Всё сразу, раз ему легко'],
    ], 0, 'Обычно сначала увеличивают время, затем частоту и в последнюю очередь — интенсивность.',
    [null, 'Интенсивность повышают в последнюю очередь.', 'Частоту — после времени.', 'Прогрессия — постепенная и по одному параметру; время или повторения — не больше +10 % в неделю.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
