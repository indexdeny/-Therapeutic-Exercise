<script>
'use strict';
const CHAPTER = { number: 86, title: 'Равновесие: центр масс и площадь опоры', minutes: 8, language: 'ru', next: '../ch087/' };
// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch086/cards.ru.json
const CARDS_SHORT = {
  "центр масс\nцентр всей массы тела: в этой точке тело в полном равновесии": "тело в полном равновесии",
  "линейный импульс (linear momentum)\nскорость тела по прямой — например, в сагиттальной или горизонтальной плоскости": "скорость по прямой",
  "угловой импульс (angular momentum)\nскорость вращения тела": "скорость вращения тела",
  "центр давления\nпроекция вертикальной силы реакции опоры; средневзвешенное всех сил, давящих вниз": "проекция вертикальной силы реакции",
};
// cards-short end

function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
// A gentle sway between lo and hi (degrees or units): a sum of slow sines of the beat progress q.
const sway = (q, lo, hi, k = 1) => lo + (hi - lo) * (.5 + .32 * Math.sin(q * 6.1 * k) + .18 * Math.sin(q * 15.7 * k + 1));
// Segment centres of a side-view figure with their mass shares (the same parts as comOf), on the stage.
function segCentres(f) {
  const P = f.pts, mid = (a, b) => [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], s = st(f.g);
  return [[P.Hc, .08], [mid(P.H, P.Sh), .46], [mid(P.H, P.KN), .1], [mid(P.H, P.KF), .1], [mid(P.KN, P.AN), .05], [mid(P.KF, P.AF), .05],
    [mid(P.Sh, P.WN), .05], [mid(P.Sh, P.WF), .05], [P.AN, .03], [P.AF, .03]].map(([q, w]) => ({ x: s.x + q[0] * f.s, y: s.y + q[1] * f.s, w }));
}
// A vertical arrow from (x, y1) to (x, y2) with its head at y2.
const vArrow = (x, y1, y2) => { const k = y2 > y1 ? 1 : -1; return `M${x} ${y1}V${y2}M${x - 10} ${y2 - 14 * k}L${x} ${y2}L${x + 10} ${y2 - 14 * k}`; };
let PTS = [];

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Равновесие', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 8 · Урок 86', { x: 800, y: 150, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'Равновесие', { x: 800, y: 235, size: 56, weight: 600, anchor: 'middle' });
    T(g, 'центр масс и площадь опоры', { x: 800, y: 300, size: 42, weight: 600, anchor: 'middle', fill: COL.dim });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'падения — при самых разных диагнозах; равновесие проверяют и тренируют', 800, 385, m('sub'), { size: 30, fill: COL.task, anchor: 'middle', weight: 600 });
    const art = G(scene, { o: 0 }), GY = 850, S = .9, X0 = 790;
    path(art, `M560 ${GY}H1040`, { stroke: COL.faint, 'stroke-width': 3 });
    const f = fig(art, { x: X0, y: GY - 182 * S, s: S });
    const [ax] = onStage(f, 'AN');
    balanceOverlay(art, f, GY, .6);
    prog(q => { f.set(LEAN(sway(q, -1, 6, 1.4))); plant(f, 'AN', ax, GY); }, .4, Math.max(4, D - 1.2), lin);
    show(art, .3);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);
  }],

  ['terms', 'Что такое равновесие', (m, D) => {
    const p = panel(0), GY = 760, S = 1;
    txt(p, 'равновесие (balance) — постуральная устойчивость (postural stability)', 800, 70, m('bal'), { size: 28, weight: 700, anchor: 'middle' });
    txt(p, 'динамический процесс: положение тела удерживается в равновесном состоянии (equilibrium)', 800, 116, m('bal', 2.5), { size: 23, fill: COL.dim, anchor: 'middle' });
    ground(p, 160, 660, GY, m('eq'));
    ground(p, 880, 1520, GY, m('eq'));
    // static: the body at rest
    const a = fig(p, { x: 410, y: GY - 182 * S, s: S, o: 0 });
    show(a.g, m('stat'));
    txt(p, 'статическое (static)', 410, 805, m('stat'), { size: 26, weight: 700, fill: COL.task, anchor: 'middle' });
    txt(p, 'тело в покое', 410, 842, m('stat', .4), { size: 23, fill: COL.dim, anchor: 'middle' });
    // dynamic: steady walking
    const b = fig(p, { x: 960, y: GY - 182 * S, s: S, o: 0 });
    show(b.g, m('dyn'));
    const wt = m('dyn', .3), wd = Math.max(3, D - wt - .4);
    walk(b, wt, wd, { cycles: Math.max(2, Math.round(wd / 1.1)), dx: 430 });
    const ar = G(p, { o: 0 });
    path(ar, 'M0 0H100M86 -10L100 0L86 10', { stroke: COL.whole, 'stroke-width': 5 });
    T(ar, 'v = const', { x: 50, y: -16, size: 22, weight: 700, fill: COL.whole, anchor: 'middle' });
    prog(q => { const s0 = st(b.g); put(ar, { x: s0.x - 20, y: s0.y - 222 * S }); }, wt, wd, lin);
    show(ar, m('dyn', .5));
    txt(p, 'динамическое (dynamic)', 1200, 805, m('dyn'), { size: 26, weight: 700, fill: COL.whole, anchor: 'middle' });
    txt(p, 'равномерное движение', 1200, 842, m('dyn', .4), { size: 23, fill: COL.dim, anchor: 'middle' });
    // the best stability: the COM over the base of support
    const ov = balanceOverlay(p, a, GY, m('best'));
    txt(p, 'устойчивость наибольшая: центр масс над площадью опоры', 800, 200, m('best', .3), { size: 27, weight: 700, fill: COL.good, anchor: 'middle' });
    const [cx, cy] = comOf(a);
    txt(p, 'центр масс', cx + 30, cy - 18, m('best', .6), { size: 21, fill: COM_C, weight: 600 });
    txt(p, 'площадь опоры', 470, GY - 8, m('best', .9), { size: 20, fill: BOS_C, weight: 600 });
    ov.g.parentNode.appendChild(ov.g);
  }],

  ['com', 'Центр масс', (m, D) => {
    const p = panel(0), GY = 850, S = 1.08, X0 = 380;
    txt(p, 'центр масс (center of mass) и центр тяжести (center of gravity)', 800, 60, m('com'), { size: 28, weight: 700, anchor: 'middle' });
    ground(p, 150, 640, GY, m('com'));
    const f = fig(p, { x: X0, y: GY - 182 * S, s: S, o: 0 });
    show(f.g, m('com'));
    const [cx, cy] = comOf(f);
    infoCard(p, 760, 96, 780, 124, 'центр масс', 'центр всей массы тела: в этой точке тело в полном равновесии', COM_C, m('com', .5), { size: 22 });
    // the segment centres, sized by their share of the mass, average into one point
    const segs = segCentres(f), lines = G(p, { o: 0 });
    segs.forEach(q => path(lines, `M${q.x.toFixed(1)} ${q.y.toFixed(1)}L${cx.toFixed(1)} ${cy.toFixed(1)}`, { stroke: COM_C, 'stroke-width': 1.6, 'stroke-dasharray': '4 5', opacity: .75 }));
    segs.forEach((q, i) => {
      const d = mk('circle', { cx: q.x, cy: q.y, r: 4 + 20 * Math.sqrt(q.w), fill: mix(COM_C, COL.board, .5), stroke: COM_C, 'stroke-width': 2 }, p);
      put(d, { o: 0 }); show(d, m('seg', .2 + i * .14), .3);
    });
    show(lines, m('seg', 2.6));
    const cs = comSym(p, cx, cy, 16);
    put(cs, { s: 0, o: 0 }); pop(cs, m('seg', 3.2));
    infoCard(p, 760, 236, 780, 104, 'как его найти', 'взвешенное среднее центров масс головы, туловища, рук и ног', COM_C, m('seg'), { size: 22 });
    txt(p, 'туловище тяжелее руки — тянет точку сильнее', 760, 378, m('seg', 3.5), { size: 21, fill: COL.chalk });
    NOTE(p, 1420, 371, m('seg', 3.5));
    // close-up: the lower spine in its body outline; the COM just in front of S2
    const box = G(p, { o: 0 });
    roundBox(box, 900, 405, 640, 330, EDGE, PANEL, 2);
    T(box, 'чуть впереди второго крестцового позвонка (S2)', { x: 1220, y: 446, size: 21, weight: 700, fill: COL.chalk, anchor: 'middle' });
    const ins = G(box, { x: 1200, y: 640, s: .78 });
    const faint = mix(COL.chalk, COL.board, .62);
    path(ins, 'M-170 -230C-150 -160 -138 -110 -150 -50C-160 0 -175 50 -150 96C-130 130 -90 140 -60 150', { stroke: faint, 'stroke-width': 3 });
    path(ins, 'M150 -230C160 -170 168 -110 160 -60C150 -10 120 30 110 90', { stroke: faint, 'stroke-width': 3 });
    T(ins, 'спина', { x: -186, y: -150, size: 22, fill: COL.dim, anchor: 'end' });
    T(ins, 'живот', { x: 178, y: -150, size: 22, fill: COL.dim });
    [[-30, -214, -6], [-34, -172, -10], [-34, -130, -16]].forEach(([x, y, r], i) => {
      mk('rect', { x: x - 34, y: y - 17, width: 68, height: 34, rx: 8, fill: ANAT.bone, stroke: mix(ANAT.bone, '#000000', .3), 'stroke-width': 1.5, transform: `rotate(${r} ${x} ${y})` }, ins);
      path(ins, `M${x - 34} ${y}L${x - 66} ${y + 8}`, { stroke: ANAT.bone, 'stroke-width': 10, transform: `rotate(${r} ${x} ${y})` });
      T(ins, 'L' + (i + 3), { x: x + 50, y: y + 8, size: 19, fill: COL.dim });
    });
    path(ins, 'M-70 -100L4 -92C2 -60 -10 -26 -32 6C-46 26 -60 40 -74 52C-88 40 -98 10 -98 -24C-96 -60 -86 -84 -70 -100Z', { fill: ANAT.bone, stroke: mix(ANAT.bone, '#000000', .3), 'stroke-width': 2 });
    path(ins, 'M-74 52L-66 80', { stroke: ANAT.bone, 'stroke-width': 9 });
    const lv = [[-96, -66, 0, -60], [-98, -32, -12, -26], [-94, 0, -30, 6], [-86, 26, -48, 32]];
    lv.forEach(([x1, y1, x2, y2]) => path(ins, `M${x1} ${y1}L${x2} ${y2}`, { stroke: mix(ANAT.bone, '#000000', .35), 'stroke-width': 2 }));
    path(ins, 'M-96 -66L0 -60L-10 -26L-98 -32Z', { fill: '#fff4d8', stroke: COM_C, 'stroke-width': 3 });
    ['S1', 'S2', 'S3', 'S4', 'S5'].forEach((n, i) => T(ins, n, { x: -110, y: [-80, -42, -10, 18, 44][i], size: 19, weight: i === 1 ? 700 : 500, fill: i === 1 ? COM_C : COL.dim, anchor: 'end' }));
    mk('circle', { cx: 40, cy: 40, r: 22, fill: mix(ANAT.bone, COL.board, .4), stroke: mix(ANAT.bone, COL.board, .2), 'stroke-width': 2 }, ins);
    T(ins, 'тазобедренный сустав', { x: 40, y: 92, size: 18, fill: COL.dim, anchor: 'middle' });
    comSym(ins, 46, -44, 17);
    T(ins, 'центр масс', { x: 72, y: -36, size: 23, weight: 700, fill: COM_C });
    path(ins, 'M110 118H190M176 108L190 118L176 128', { stroke: COL.dim, 'stroke-width': 3 });
    T(ins, 'вперёд', { x: 150, y: 102, size: 20, fill: COL.dim, anchor: 'middle' });
    show(box, m('s2'));
    show(put(path(p, `M${cx + 20} ${cy}L900 600`, { stroke: COM_C, 'stroke-width': 2, 'stroke-dasharray': '6 6' }), { o: 0 }), m('s2'));
    // the height: about 55 % from the floor
    const top = onStage(f, 'Hc')[1] - RIG.hr * S, RX = 170;
    const rul = G(p, { o: 0 });
    path(rul, `M${RX} ${GY}V${top}M${RX - 10} ${GY}H${RX + 10}M${RX - 10} ${top}H${RX + 10}`, { stroke: COL.dim, 'stroke-width': 3 });
    T(rul, 'рост', { x: RX - 14, y: top + 7, size: 19, fill: COL.dim, anchor: 'end' });
    T(rul, '0', { x: RX - 14, y: GY, size: 19, fill: COL.dim, anchor: 'end' });
    path(rul, `M${RX - 12} ${cy}H${cx - 18}`, { stroke: COM_C, 'stroke-width': 2, 'stroke-dasharray': '5 5' });
    T(rul, '≈ 55 %', { x: RX - 14, y: cy + 7, size: 22, weight: 700, fill: COM_C, anchor: 'end' });
    show(rul, m('h55'));
    // the centre of gravity: the plumb point of the COM on the support
    draw(path(p, `M${cx} ${cy + 16}V${GY}`, { stroke: COL.chalk, 'stroke-width': 2.5, 'stroke-dasharray': '7 7' }, { d: 0 }), m('cog'), .6);
    const cg = G(p, { x: cx, y: GY, o: 0, s: 0 });
    mk('ellipse', { rx: 20, ry: 7, fill: COL.board, stroke: COM_C, 'stroke-width': 3 }, cg);
    mk('path', { d: 'M0 0V-7A20 7 0 0 1 20 0ZM0 0V7A20 7 0 0 1 -20 0Z', fill: COM_C }, cg);
    pop(cg, m('cog', .5));
    infoCard(p, 760, 750, 780, 106, 'центр тяжести (center of gravity)', 'вертикальная проекция центра масс на опору', COM_C, m('cog', .3), { size: 22 });
  }],

  ['mom', 'Импульс', (m, D) => {
    const p = panel(0), GY = 590, S = .88;
    txt(p, 'количество движения, импульс (momentum) = масса × скорость', 800, 70, m('mom'), { size: 28, weight: 700, anchor: 'middle' });
    // linear momentum: steady walking
    ground(p, 80, 760, GY, m('lin'));
    const a = fig(p, { x: 170, y: GY - 182 * S, s: S, o: 0 });
    show(a.g, m('lin'));
    const wt = m('lin', .3), wd = Math.max(3.5, m('ang') - wt + 1.5);
    walk(a, wt, wd, { cycles: Math.max(3, Math.round(wd / 1.1)), dx: 400 });
    const ar = G(p, { o: 0 });
    path(ar, 'M0 0H110M96 -10L110 0L96 10', { stroke: COL.whole, 'stroke-width': 5 });
    T(ar, 'm · v', { x: 55, y: -14, size: 24, weight: 700, fill: COL.whole, anchor: 'middle' });
    prog(q => { const s0 = st(a.g); put(ar, { x: s0.x - 30, y: s0.y - 222 * S }); }, wt, wd, lin);
    show(ar, m('lin', .5));
    infoCard(p, 80, 668, 680, 160, 'линейный импульс (linear momentum)', 'скорость тела по прямой — например, в сагиттальной или горизонтальной плоскости', COL.whole, m('lin', .6), { size: 22 });
    // angular momentum: the body rotating about the ankles
    ground(p, 900, 1520, GY, m('ang'));
    const b = fig(p, { x: 1150, y: GY - 182 * S, s: S, o: 0 });
    show(b.g, m('ang'));
    const [ax] = onStage(b, 'AN');
    poseTo(b, LEAN(16), m('ang', .4), 1.6, io, ['AN', ax, GY]);
    const R = 420 * S, a0 = rad(-3), a1 = rad(24), arc0 = G(p, { o: 0 });
    path(arc0, `M${(ax + R * Math.sin(a0)).toFixed(1)} ${(GY - R * Math.cos(a0)).toFixed(1)}A${R} ${R} 0 0 1 ${(ax + R * Math.sin(a1)).toFixed(1)} ${(GY - R * Math.cos(a1)).toFixed(1)}`, { stroke: COL.real, 'stroke-width': 5 });
    const hx = ax + R * Math.sin(a1), hy = GY - R * Math.cos(a1);
    const ux = Math.cos(a1), uy = Math.sin(a1), hd = k => [(hx - 18 * ux + k * 10 * uy).toFixed(1), (hy - 18 * uy - k * 10 * ux).toFixed(1)];
    path(arc0, `M${hd(1).join(' ')}L${hx} ${hy}L${hd(-1).join(' ')}`, { stroke: COL.real, 'stroke-width': 5 });
    T(arc0, 'вращение', { x: ax + (R + 34) * Math.sin(rad(10)), y: GY - (R + 34) * Math.cos(rad(10)), size: 24, weight: 700, fill: COL.real, anchor: 'middle' });
    show(arc0, m('ang', .8));
    show(put(mk('circle', { cx: ax, cy: GY - 4, r: 7, fill: COL.real }, p), { o: 0 }), m('ang'));
    infoCard(p, 880, 668, 660, 160, 'угловой импульс (angular momentum)', 'скорость вращения тела', COL.real, m('ang', .6), { size: 22 });
  }],

  ['bos', 'Площадь опоры', (m, D) => {
    const p = panel(0), SX = 470, SY = 470, SS = 2.2;
    txt(p, 'площадь опоры (base of support)', 800, 60, m('bos'), { size: 28, weight: 700, anchor: 'middle' });
    txt(p, 'периметр площади контакта тела с опорой', 800, 102, m('bos', 1), { size: 23, fill: COL.dim, anchor: 'middle' });
    const sp = stanceTop(p, SX, SY, SS, m('bos', .3), { marks: false });
    txt(p, 'вид сверху, носки вперёд ↑', SX, 850, m('bos', .3), { size: 19, fill: COL.dim, anchor: 'middle' });
    const hl = G(p, { o: 0 });
    path(hl, `M${SX} 760V${SY + 12}M${SX - 9} ${SY + 26}L${SX} ${SY + 12}L${SX + 9} ${SY + 26}`, { stroke: BOS_C, 'stroke-width': 3 });
    T(hl, 'и пространство между стопами', { x: SX, y: 800, size: 22, weight: 600, fill: BOS_C, anchor: 'middle' });
    show(hl, m('hull'));
    hide(hl, m('feet', 1.5));
    // the area of each stance, relative to the usual one (from the drawn feet)
    const area = k => { const t = stanceTop(p, -3000, -3000, 1, null, { stance: k, marks: false }); const v = t.area(); t.g.remove(); return v; };
    const A0 = area('apart'), ROWS = [['обычная стойка', 'apart', 'feet', COL.chalk], ['широкая стойка', 'wide', 'wide', COL.good], ['стопа за стопой', 'tandem', 'narrow', COL.bad], ['ходьба: опора на одну стопу', 'single', 'walk', COL.bad]];
    const AMAX = area('wide');
    ROWS.forEach(([lab, k, mark, col], i) => {
      const g = G(p, { o: 0 }), y = 200 + i * 120, v = area(k), w = 520 * v / AMAX;
      T(g, lab, { x: 900, y, size: 24, weight: 700, fill: col });
      mk('rect', { x: 900, y: y + 16, width: w, height: 34, rx: 8, fill: mix(BOS_C, COL.board, .55), stroke: BOS_C, 'stroke-width': 2 }, g);
      T(g, Math.round(100 * v / A0) + ' %', { x: 900 + w + 14, y: y + 42, size: 22, weight: 700, fill: COL.chalk });
      show(g, m(mark, .3));
    });
    pill(p, 'схема', 1480, 160, m('feet'), { col: COL.dim, size: 18 });
    txt(p, 'устойчивость ↑ · часто у пожилых', 1540, 320, m('wide', 1), { size: 20, weight: 700, fill: COL.good, anchor: 'end' });
    txt(p, 'устойчивость ↓', 1540, 440, m('narrow', 1), { size: 20, weight: 700, fill: COL.bad, anchor: 'end' });
    sp.to('together', m('feet', .4), .9);
    sp.to('apart', m('feet', 1.6), .9);
    sp.to({ ...STANCES.wide, cog: [0, -2] }, m('wide'), .9);
    sp.to({ ...STANCES.tandem, cog: [0, 0] }, m('narrow'), 1);
    sp.to({ ...STANCES.single, upL: 1, cog: [44, -4] }, m('walk'), .9);
    sp.to({ ...STANCES.apart, upL: 0, cog: [0, -2] }, m('los'), .9);
    // the COG wanders to the toes and past them: the base turns red
    show(sp.cog, m('los', .9));
    sp.to({ cog: [8, -96] }, m('los', 1.6), 1.6);
    sp.to({ cog: [12, -136] }, m('los', 3.4), .8);
    sp.to({ cog: [0, -10] }, m('los', 4.6), 1);
    txt(p, 'центр тяжести внутри — человек не падает', 1200, 720, m('los', .5), { size: 23, weight: 700, fill: COL.good, anchor: 'middle' });
    txt(p, 'эти пределы — границы устойчивости (limits of stability)', 1200, 762, m('los', 5), { size: 22, weight: 600, fill: LOS_C, anchor: 'middle' });
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-bos', prompt: ['По сравнению с обычной стойкой — устойчивее или менее устойчиво?'],
    build: grid([
      { parts: ['Широкая стойка'], ans: ['more'], why: 'Шире площадь опоры.' },
      { parts: ['Стойка «стопа за стопой»'], ans: ['less'], why: 'Узкая площадь опоры.' },
      { parts: ['Сидя на табурете без спинки'], ans: ['more'], why: 'Центр масс ниже, а опора больше.' },
      { parts: ['Ходьба'], ans: ['less'], why: 'В книге ходьба — пример узкой площади опоры.' },
      { parts: ['Стойка на одной ноге'], ans: ['less'], why: 'Опора — одна стопа.' },
