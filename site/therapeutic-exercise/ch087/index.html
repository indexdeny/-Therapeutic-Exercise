const VIS_C = COL.whole, SOM_C = COL.rat, VEST_C = COL.real, NERVE = '#f3d36b', SKIN = '#d8d1c1';
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
function row(p, x, y, w, s, col, t0, { size = 21, h = 64 } = {}) {
  const g = G(p, { o: 0 });
  mk('rect', { x, y, width: w, height: h, rx: 12, fill: PANEL, stroke: col, 'stroke-width': 2 }, g);
  mk('circle', { cx: x + 24, cy: y + h / 2, r: 8, fill: col }, g);

  put(t, { o: 1, y: -(t._h - size * 1.32) / 2 });
  show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;

// A head in profile facing right, rotating about the top of the neck at (0, 0): put(h.g, { r }) nods it.
function headSide(p, x, y, r, t0) {

  mk('circle', { cx: 0, cy: -r * .8, r, fill: `url(#${id})`, stroke: '#6f685d', 'stroke-width': 2 }, g);
  path(g, `M${r * .92} ${-r * .85}L${r * 1.22} ${-r * .58}L${r * .95} ${-r * .5}`, { fill: SKIN, stroke: '#6f685d', 'stroke-width': 2 });
  mk('ellipse', { cx: -r * .08, cy: -r * .75, rx: r * .16, ry: r * .26, fill: '#cfc7b8', stroke: '#6f685d', 'stroke-width': 2 }, g);
  mk('path', { d: `M${r * .44} ${-r}Q${r * .58} ${-r * 1.1} ${r * .72} ${-r}Q${r * .58} ${-r * .9} ${r * .44} ${-r}Z`, fill: '#f2efe6', stroke: '#6f685d', 'stroke-width': 1.5 }, g);
  mk('circle', { cx: r * .62, cy: -r, r: r * .06, fill: '#3d3a35' }, g);

}
// The inner ear (labyrinth) from the side: three semicircular canals as tubes, the vestibule with the utricle and
// the saccule, the cochlea faint. lab.flow(q) moves the fluid dots round the lateral canal.
function labyrinth(p, x, y, s = 1, t0 = null) {
  const g = G(p, { x, y, s, o: 0 }), wall = mix(VEST_C, COL.board, .25);
  const canal = (cx, cy, rx, ry, r) => { const c = G(g, { x: cx, y: cy, r }); tube(c, `M${-rx} 0A${rx} ${ry} 0 1 1 ${rx} 0A${rx} ${ry} 0 1 1 ${-rx} 0`, wall, 18); return c; };
  canal(-10, -84, 44, 70, 14); canal(-104, -26, 40, 66, -56);
  const lat = canal(-86, 34, 66, 22, -6);
  [[24, -26], [-66, 40], [-30, 36]].forEach(([cx, cy]) => mk('circle', { cx, cy, r: 13, fill: wall, stroke: mix(wall, '#000000', .3), 'stroke-width': 2 }, g));
  mk('ellipse', { cx: 2, cy: 34, rx: 50, ry: 32, fill: mix(VEST_C, COL.board, .55), stroke: wall, 'stroke-width': 3 }, g);
  mk('ellipse', { cx: -8, cy: 24, rx: 22, ry: 12, fill: VEST_C }, g);
  mk('ellipse', { cx: 18, cy: 48, rx: 16, ry: 10, fill: VEST_C }, g);
  [[-16, 20], [-8, 18], [0, 21], [12, 45], [20, 44]].forEach(([cx, cy]) => mk('circle', { cx, cy, r: 2.6, fill: '#ffffff' }, g));
  let sp = 'M80 70';
  for (let i = 1; i <= 50; i++) { const a = i * .3, r = 34 - i * .55; sp += `L${(80 + r * Math.cos(a)).toFixed(1)} ${(70 + r * Math.sin(a)).toFixed(1)}`; }
  path(g, sp, { stroke: mix(COL.chalk, COL.board, .6), 'stroke-width': 6 });
  const dots = [0, 1, 2, 3, 4, 5].map(() => mk('circle', { r: 4, fill: '#ffffff' }, lat));
  const lab = { g, lat };
  lab.flow = q => dots.forEach((d, i) => { const a = q * 2 * Math.PI + i * Math.PI / 3; d.setAttribute('cx', (66 * Math.cos(a)).toFixed(1)); d.setAttribute('cy', (22 * Math.sin(a)).toFixed(1)); });
  lab.flow(0);
  if (t0 !== null) show(g, t0);
  return lab;
}
// An otolith organ (macula) in section: hair cells under a gel layer with crystals. mac.set(tilt) tilts it; the
// heavy layer slides downhill and bends the hairs.
function macula(p, x, y, s = 1, t0 = null) {
  const g = G(p, { x, y, s, o: 0 }), pl = G(g);
  mk('rect', { x: -120, y: 0, width: 240, height: 22, rx: 6, fill: mix(VEST_C, COL.board, .5), stroke: VEST_C, 'stroke-width': 2 }, pl);
  const hairs = [], N = 9;
  for (let i = 0; i < N; i++) { const hx = -96 + i * 24; mk('rect', { x: hx - 7, y: 2, width: 14, height: 18, rx: 4, fill: mix(VEST_C, '#ffffff', .3) }, pl); hairs.push(path(pl, '', { stroke: NERVE, 'stroke-width': 3 })); }
  const gel = G(pl);
  mk('rect', { x: -120, y: -46, width: 240, height: 26, rx: 8, fill: mix('#b9d8e8', COL.board, .45), stroke: '#b9d8e8', 'stroke-width': 2 }, gel);
  for (let i = 0; i < 16; i++) mk('rect', { x: -112 + i * 14, y: -58 + (i % 3) * 3, width: 9, height: 12, rx: 2, fill: '#f2efe6', transform: `rotate(${(i * 37) % 50 - 25} ${-108 + i * 14} ${-52})` }, gel);
  const mac = { g, pl, gel };
  mac.set = tilt => {
    const dx = 22 * Math.sin(rad(tilt)) / Math.sin(rad(25));
    put(pl, { r: tilt }); put(gel, { x: dx });
    hairs.forEach((h, i) => { const hx = -96 + i * 24; h.setAttribute('d', `M${hx} 2Q${hx} -10 ${(hx + dx).toFixed(1)} -20`); });
  };
  mac.set(0);
  if (t0 !== null) show(g, t0);
  return mac;
}
// The lower leg close up (side view, facing right): tibia, foot bones, calf muscle (gastrocnemius–soleus with the
// Achilles tendon), tibialis anterior, the ankle capsule front and back, and the receptors: a muscle spindle in the
// calf, a Golgi tendon organ at its tendon, joint receptors on the capsule, skin receptors in the sole.
// leg.set(a): the shank tilts forward by a degrees over the flat foot (dorsiflexion); returns the calf strain.
function calfModel(p, x, gy, s = 1, t0 = null) {
  const g = G(p, { x, y: gy, s, o: 0 }), defs = mk('defs', {}, g), A = [0, -46], L = 300, C = [-58, -28];
  const skinF = mk('path', { d: 'M-74 -30C-76 -70 -44 -84 -14 -80L20 -70C60 -50 110 -30 168 -22C188 -18 192 0 178 6L-52 6C-68 4 -74 -10 -74 -30Z', fill: '#4b5f57', stroke: '#6f857b', 'stroke-width': 2, opacity: .9 }, g);
  const skinS = limbEl(g, defs, '#4b5f57', 34, 50, '#6f857b');
  skinS.e.setAttribute('opacity', .9);
  mk('path', { d: 'M-58 -32C-60 -52 -40 -62 -20 -60L12 -54C28 -52 42 -42 60 -34L150 -16C162 -14 170 -10 176 -6L176 2L130 0L40 -8L-40 -4C-56 -6 -60 -18 -58 -32Z', fill: ANAT.bone, stroke: mix(ANAT.bone, '#000000', .3), 'stroke-width': 2 }, g);
  const tib = boneEl(g, 15), fem = boneEl(g, 18), cond = mk('circle', { r: 20, fill: ANAT.bone }, g);
  const at = (P, v, k) => [P[0] + v[0] * k, P[1] + v[1] * k];
  const geo = a => { const u = [Math.sin(rad(a)), -Math.cos(rad(a))], n = [-Math.cos(rad(a)), -Math.sin(rad(a))], K = at(A, u, L); return { u, n, K }; };
  const att = a => {
    const { u, n, K } = geo(a);
    return { calf: [at(at(K, n, 26), u, 14), C], ta: [at(at(A, u, 230), n, -18), [34, -50]],
      capF: [at(at(A, u, 22), n, -17), [26, -52]], capB: [at(at(A, u, 22), n, 17), [-28, -46]] };
  };
  const len = ([P, Q]) => Math.hypot(Q[0] - P[0], Q[1] - P[1]);
  const capB = ligEl(g, { rest: len(att(14).capB), w: 5 }), capF = ligEl(g, { rest: len(att(-22).capF), w: 5 });
  const ta = muscleEl(g, { rest: len(att(0).ta), w: 13, tendon: .25 });
  const calf = muscleEl(g, { rest: len(att(0).calf), w: 30, tendon: .3 });
  const rec = G(g);
  const spin = G(rec), gto = G(rec);
  mk('ellipse', { rx: 26, ry: 7, fill: '#f6dcd3', stroke: NERVE, 'stroke-width': 2.5 }, spin);
  path(spin, 'M-10 0q2.5 -7 5 0t5 0t5 0t5 0', { stroke: NERVE, 'stroke-width': 2 });
  path(gto, 'M-8 -10q8 3 0 6t0 6t0 6', { stroke: NERVE, 'stroke-width': 3 });
  const jr = [0, 1, 2].map(() => mk('circle', { r: 4.5, fill: NERVE }, rec));
  const sk = [-40, -6, 40, 90, 136].map(xx => mk('circle', { cx: xx, cy: 0, r: 5, fill: NERVE }, rec));
  const nerve = path(g, '', { stroke: NERVE, 'stroke-width': 3, 'stroke-dasharray': '2 5', opacity: .9 });
  const leg = { g, calf, ta, capF, capB, spin, gto, jr, sk, pts: {} };
  leg.set = a => {
    const { u, n, K } = geo(a), T0 = att(a);
    skinS.set(at(A, u, -4), at(K, u, 10));
    tib.set(at(A, u, 12), at(K, u, -10));
    fem.set(at(K, u, 6), at(K, u, 90));
    cond.setAttribute('cx', K[0].toFixed(1)); cond.setAttribute('cy', K[1].toFixed(1));
    calf.set(...T0.calf); ta.set(...T0.ta); capF.set(...T0.capF); capB.set(...T0.capB);
    const [P, Q] = T0.calf, M = [lerp(P[0], Q[0], .42), lerp(P[1], Q[1], .42)], J = [lerp(P[0], Q[0], .7), lerp(P[1], Q[1], .7)];
    const ang = Math.atan2(Q[1] - P[1], Q[0] - P[0]) * 180 / Math.PI;
    put(spin, { x: M[0], y: M[1], r: ang, s: 1 + 2.5 * Math.max(0, calf.strain) });
    put(gto, { x: J[0], y: J[1], r: ang - 90 });
    const [B0, B1] = T0.capB;
    jr.forEach((d, i) => { d.setAttribute('cx', lerp(B0[0], B1[0], .25 + i * .25).toFixed(1)); d.setAttribute('cy', lerp(B0[1], B1[1], .25 + i * .25).toFixed(1)); });
    const top = at(at(K, n, 46), u, 60);
    nerve.setAttribute('d', `M${M[0].toFixed(1)} ${M[1].toFixed(1)}Q${at(M, n, 30)[0].toFixed(1)} ${at(M, n, 30)[1].toFixed(1)} ${top[0].toFixed(1)} ${top[1].toFixed(1)}`);
    Object.assign(leg.pts, { M, J, K, cap: [lerp(B0[0], B1[0], .5), lerp(B0[1], B1[1], .5)], top, u, n });
    return calf.strain;
  };
  leg.set(0);
  if (t0 !== null) show(g, t0);
  return leg;
}

      T(sp, `${k}. ${s}`, { x: 300 + i * 270, y: 770, size: 21, weight: 700, fill: col });
    });
    show(sp, m('speed'));
    pill(p, 'только порядок', 1260, 763, m('speed', 1), { col: COL.dim, size: 17 });
    // one input is wrong: it is suppressed, the other two carry the weight
    const foam = G(p, { o: 0 });
    mk('rect', { x: 60, y: 485, width: 120, height: 26, rx: 9, fill: mix(FOAM, COL.board, .45), stroke: FOAM, 'stroke-width': 2 }, foam);
    T(foam, 'поролон', { x: 120, y: 538, size: 18, fill: FOAM, anchor: 'middle' });
    show(foam, m('sup'));
    tw(lines[1].ln, { 'a_stroke-width': 2, c_stroke: COL.bad }, m('sup', .5), .8);
    tw(lines[0].ln, { 'a_stroke-width': 13 }, m('sup', 1.5), .8);
    tw(lines[2].ln, { 'a_stroke-width': 13 }, m('sup', 1.5), .8);
    const x = G(p, { o: 0 });
    cross(x, 520, 446, 18, m('sup', .6));
    show(x, m('sup', .5));
    txt(p, 'неточный вход подавлен — опора на два других', 800, 640, m('sup', 2), { size: 23, weight: 700, fill: COL.bad, anchor: 'middle' });
    txt(p, 'большинство хорошо компенсируют нарушение одной системы → основа многих программ лечения', 800, 830, m('comp'), { size: 23, weight: 700, fill: COL.good, anchor: 'middle' });
  }],

  ['types', 'Типы контроля', (m, D) => {
    const p = panel(0);
    txt(p, 'типы контроля равновесия', 800, 56, m('types'), { size: 28, weight: 700, anchor: 'middle' });
    const GY = 410, S = .6;
    const card3 = (x, title, sub, col, t0) => { const g = G(p, { o: 0 }); roundBox(g, x, 90, 480, 400, col, PANEL, 2.5); T(g, title, { x: x + 240, y: 130, size: 24, weight: 700, fill: col, anchor: 'middle' }); T(g, sub, { x: x + 240, y: 462, size: 19, fill: COL.chalk, anchor: 'middle' }); show(g, t0); return g; };
    card3(60, 'статический', 'удержать позу в покое', COL.good, m('st'));
    card3(560, 'динамический', 'опора или тело движется', COL.whole, m('dy'));
    card3(1060, 'автоматические реакции', 'неожиданный внешний толчок', COL.task, m('re'));
    // static: standing and sitting still
    const a = fig(p, { x: 220, y: GY - 182 * S, s: S, o: 0 }); show(a.g, m('st', .3));
    const b = fig(p, { x: 380, y: 0, s: S, o: 0, pose: { ...SIT, t: 4, aN: 10, aF: 10, eN: 60, eF: 60 } });
    plant(b, 'AN', 430, GY); show(b.g, m('st', .6));
    const [bhx, bhy] = onStage(b, 'H');
    const stool = path(p, `M${bhx - 40} ${bhy + 14}H${bhx + 30}M${bhx - 32} ${bhy + 14}V${GY}M${bhx + 22} ${bhy + 14}V${GY}`, { stroke: COL.dim, 'stroke-width': 5 }, { o: 0 });
    p.insertBefore(stool, b.g); show(stool, m('st', .6));
    ground(p, 100, 500, GY, m('st'));
    // dynamic: rising from a chair, then walking
    const c = fig(p, { x: 700, y: 0, s: S, o: 0, pose: { ...SIT, aN: 30, aF: 30 } });
    plant(c, 'AN', 740, GY);
    const [chx, chy] = onStage(c, 'H');
    const ch = chair(p, chx, chy + 14, GY, m('dy'));
    show(c.g, m('dy'));
    poseTo(c, { ...STAND }, m('dy', 1), 1.4, io, ['AN', 740, GY]);
    walk(c, m('dy', 2.6), 3, { cycles: 3, dx: 220 });
    ground(p, 600, 1000, GY, m('dy'));
    // automatic reactions: the bus floor jerks, the rider steps
    const bus = G(p, { o: 0 });
    mk('rect', { x: 1110, y: GY, width: 340, height: 14, rx: 4, fill: mix('#e8c25a', COL.board, .4), stroke: '#e8c25a', 'stroke-width': 2 }, bus);
    show(bus, m('re'));
    const d = fig(p, { x: 1290, y: GY - 182 * S, s: S, o: 0 }); show(d.g, m('re'));
    const [dax] = onStage(d, 'AN');
    prog(q => {
      const dx = 60 * out(Math.min(1, q * 2.5)), lean = q < .3 ? -10 * out(q / .3) : -10 * (1 - io(Math.min(1, (q - .3) / .5)));
      put(bus, { x: dx }); d.set(LEAN(lean)); plant(d, 'AN', dax + dx, GY);
    }, m('re', 1), 2.4, lin);
    arrowTo(p, [1180, 360], [1250, 360], m('re', 1), { col: '#e8c25a', w: 4 });
    // feedforward: back and leg muscles switch on before the pull
    const fg = G(p, { o: 0 });
    roundBox(fg, 60, 520, 980, 340, EDGE, PANEL, 2);
    T(fg, 'упреждающий контроль (прямая связь)', { x: 440, y: 566, size: 23, weight: 700, fill: NERVE });
    show(fg, m('ff'));
    const GY2 = 830, e = fig(p, { x: 220, y: GY2 - 182 * .78, s: .78, o: 0 });
    show(e.g, m('ff'));
    const door = G(p, { o: 0 });
    path(door, `M392 ${GY2}V600`, { stroke: COL.dim, 'stroke-width': 6 });
    const handle = mk('rect', { x: 352, y: 680, width: 34, height: 14, rx: 5, fill: COL.task }, door);
    show(door, m('ff'));
    reach(e, 'N', 360, 687);
    const em = ['hamstrings', 'gastroc', 'parasp'].map(k => muscleOn(e, ...MUSCLE[k], { w: k === 'parasp' ? 11 : 12, after: k === 'parasp' ? 'torso' : k === 'gastroc' ? 'shN' : 'thN' }));
    // the timeline: postural muscles start first, the arm pulls after
    const tl = G(p, { o: 0 }), X0 = 470, W = 520;
    path(tl, `M${X0} 790H${X0 + W}`, { stroke: COL.dim, 'stroke-width': 2 });
    T(tl, 'время →', { x: X0 + W, y: 815, size: 17, fill: COL.dim, anchor: 'end' });
    const bar = (y, x1, x2, col, s) => { mk('rect', { x: X0 + x1 * W, y, width: (x2 - x1) * W, height: 30, rx: 8, fill: mix(col, COL.board, .4), stroke: col, 'stroke-width': 2 }, tl); T(tl, s, { x: X0 + x1 * W + 10, y: y + 22, size: 18, weight: 700, fill: COL.chalk }); };
    bar(620, .1, .95, '#ff5a3c', 'задние мышцы ног, разгибатели спины');
    bar(690, .35, .95, COL.task, 'рука тянет ручку');
    show(tl, m('ant'));
    const qT = m('ant', .5);
    prog(q => { em.forEach(mu => mu.act(q > .1 ? .9 : 0)); const pull = q > .35 ? io(Math.min(1, (q - .35) / .4)) : 0; e.set({ t: -5 * pull }); reach(e, 'N', 360, 687); }, qT, 3, lin);
    txt(p, '+ планирование обхода препятствий', 520, 760, m('ant', 4), { size: 19, fill: COL.dim });
    // closed loop: sitting on a ball
    const cl = G(p, { o: 0 });
    roundBox(cl, 1060, 520, 480, 340, EDGE, PANEL, 2);
    T(cl, 'обратная связь', { x: 1300, y: 560, size: 23, weight: 700, fill: COL.whole, anchor: 'middle' });
    T(cl, 'точные движения: мяч, бревно', { x: 1300, y: 594, size: 19, fill: COL.chalk, anchor: 'middle' });
    path(cl, 'M1110 828H1490', { stroke: COL.faint, 'stroke-width': 3 });
    path(cl, 'M1440 650A70 70 0 1 1 1440 780', { stroke: COL.whole, 'stroke-width': 4 });
    path(cl, 'M1426 772L1440 780L1434 764', { stroke: COL.whole, 'stroke-width': 4 });
    T(cl, 'ощущения → поправка', { x: 1300, y: 640, size: 18, fill: COL.whole, anchor: 'middle' });
    show(cl, m('cl'));
    const fb = fig(p, { x: 1280, y: 0, s: .62, o: 0, pose: { ...SIT, t: 0, aN: 70, aF: 70, eN: 10, eF: 10, hN: 88, hF: 88, kN: 92, kF: 92, fN: 4, fF: 4 } });
    plant(fb, 'AN', 1340, 828);
    const [bx, by] = onStage(fb, 'H'), br = (828 - by - 6) / 2;
    const ball = mk('circle', { cx: bx - 4, cy: 828 - br, r: br, fill: mix('#e07a5f', COL.board, .45), stroke: '#e07a5f', 'stroke-width': 3 }, cl);
    show(fb.g, m('cl'));
    prog(q => fb.set({ t: 6 * Math.sin(q * 14) }), m('cl'), Math.max(3, D - m('cl')), lin);
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-types', prompt: ['Какой контроль равновесия нужен?'],
    build: grid([
      { parts: ['Стоять в очереди'], ans: ['st'], why: 'Устойчивая поза в покое — статический контроль.' },
      { parts: ['Встать со стула'], ans: ['dy'], why: 'Тело движется на неподвижной опоре — динамический.' },
      { parts: ['Устоять, когда автобус резко тронулся'], ans: ['re'], why: 'Неожиданный внешний толчок — автоматические реакции.' },
      { parts: ['Идти по коридору'], ans: ['dy'], why: 'Ходьба — динамический контроль.' },
      { parts: ['Сидеть на стуле'], ans: ['st'], why: 'Поза в покое — статический.' },
    ], [['st', 'Статический', COL.good], ['dy', 'Динамический', COL.whole], ['re', 'Автоматические реакции', COL.task]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Равновесие — нервная система + опорно-двигательный аппарат; условия повышают или снижают требования.', 'w1'],
     ['Зрение — голова и окружение; соматосенсорная — части тела и опора; вестибулярная — голова и гравитация.', 'w2'],
     ['Неточный вход подавляется, работают два других — сенсорная организация.', 'w3'],
     ['Контроль: статический, динамический, реактивный; упреждающий включает мышцы заранее.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 30, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-foam', prompt: ['Пациент стоит на толстом поролоне с закрытыми глазами. На сигналы какой системы ему приходится опираться?'],
    build: choice([
      ['Вестибулярной'],
      ['Зрительной'],
      ['Соматосенсорной'],
      ['Ни одной — устоять невозможно'],
    ], 0, 'Глаза закрыты, а поролон искажает сигналы опоры: точной остаётся только вестибулярная информация.',
    [null, 'Глаза закрыты — зрительных сигналов нет.', 'Поролон искажает сигналы о положении тела относительно опоры.', 'Вестибулярная система работает; многие люди так стоят, хотя и труднее.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-neuro', prompt: ['У пациента снижена чувствительность стоп (полинейропатия). Что, по материалу урока, поможет ему стоять устойчивее?'],
    build: choice([
      ['Фиксировать взгляд на неподвижном предмете'],
      ['Закрыть глаза, чтобы сосредоточиться на ощущениях стоп'],
      ['Встать на мягкий коврик'],
      ['Быстро поворачивать голову, чтобы «разбудить» вестибулярный аппарат'],
    ], 0, 'Когда проприоцептивные сигналы ненадёжны, фиксация взгляда на предмете повышает устойчивость.',
    [null, 'Так он лишится зрения — одной из двух оставшихся надёжных систем.', 'Мягкая опора ещё больше искажает и без того сниженные сигналы стоп.', 'Быстрые движения головы не заменят сигналов стоп и скорее затруднят задачу.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
