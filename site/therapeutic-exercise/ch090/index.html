};
// cards-short end

const IN_C = COL.whole, INT_C = '#f3d36b', OUT_C = '#ff8a6a', ACT = '#ff5a3c';
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
function row(p, x, y, w, s, col, t0, { size = 21, h = 64 } = {}) {
  const g = G(p, { o: 0 });
  mk('rect', { x, y, width: w, height: h, rx: 12, fill: PANEL, stroke: col, 'stroke-width': 2 }, g);
  mk('circle', { cx: x + 24, cy: y + h / 2, r: 8, fill: col }, g);
  const t = para(g, s, x + 44, y + h / 2 + size * .35, null, { size, maxW: w - 60 });
  put(t, { o: 1, y: -(t._h - size * 1.32) / 2 });
  show(g, t0);
  return g;
}
const sway = (q, lo, hi, k = 1) => lo + (hi - lo) * (.5 + .32 * Math.sin(q * 6.1 * k) + .18 * Math.sin(q * 15.7 * k + 1));
// A red zigzag: damage.
const bolt = (p, x, y, t0, k = 1) => { const e = path(p, `M${x} ${y - 26 * k}l${-10 * k} ${22 * k}h${14 * k}l${-10 * k} ${24 * k}`, { stroke: COL.bad, 'stroke-width': 5 }, { o: 0 }); show(e, t0); return e; };
// Small icons.
function eyeIcon(p, x, y, s = 1, col = IN_C) { const g = G(p, { x, y, s }); mk('path', { d: 'M-34 0Q0 -30 34 0Q0 30 -34 0Z', fill: '#f2efe6', stroke: col, 'stroke-width': 3 }, g); mk('circle', { r: 12, fill: col }, g); mk('circle', { r: 5, fill: COL.board }, g); return g; }
function earIcon(p, x, y, s = 1, col = COL.real) { const g = G(p, { x, y, s }); [[0, -14, 14, 22, 15], [-16, -2, 12, 20, -55], [-12, 10, 20, 8, 0]].forEach(([cx, cy, rx, ry, r]) => mk('ellipse', { cx, cy, rx, ry, fill: 'none', stroke: col, 'stroke-width': 4, transform: `rotate(${r} ${cx} ${cy})` }, g)); mk('ellipse', { cx: 6, cy: 12, rx: 12, ry: 9, fill: col }, g); return g; }
function footIcon(p, x, y, s = .5, col = COL.rat) { const g = G(p, { x, y, s }); mk('path', { d: footD(1), fill: mix(col, COL.board, .5), stroke: col, 'stroke-width': 5 }, g); return g; }
function brainIcon(p, x, y, s = 1, col = INT_C) {
  const g = G(p, { x, y, s });
  mk('path', { d: 'M-80 10C-96 -30 -70 -70 -30 -72C-10 -92 30 -90 46 -70C80 -66 98 -30 86 0C96 26 70 52 40 46C20 62 -24 62 -40 46C-70 52 -90 34 -80 10Z', fill: mix(col, COL.board, .7), stroke: col, 'stroke-width': 3 }, g);
  path(g, 'M-50 -40C-30 -30 -40 -10 -20 0M10 -60C0 -40 20 -30 10 -10M40 -40C60 -30 50 -10 70 0M-60 20C-40 14 -30 30 -10 24M20 20C30 36 50 30 60 20', { stroke: col, 'stroke-width': 2.5 });
  mk('ellipse', { cx: 50, cy: 52, rx: 26, ry: 14, fill: mix(col, COL.board, .55), stroke: col, 'stroke-width': 2.5 }, g);
  return g;
}
// An ankle-foot orthosis on the near leg of a side-view figure: a shell behind the calf and under the foot.
function afoOn(p, f, col = '#9fc8e0') {
  const e = path(p, '', { stroke: col, 'stroke-width': 9, 'stroke-linejoin': 'round', opacity: .9 });
  const upd = () => {
    const P = f.pts, K = P.KN, A = P.AN, dx = A[0] - K[0], dy = A[1] - K[1], L = Math.hypot(dx, dy), nx = -dy / L * f.dir, ny = dx / L * f.dir;
    const top = figPt(f, [K[0] + dx * .3 - nx * 13, K[1] + dy * .3 - ny * 13]), back = figPt(f, [A[0] - nx * 11, A[1] - ny * 11]);
    const heel = figPt(f, [P.heelN[0], P.heelN[1] + 4]), toe = figPt(f, [P.toeN[0], P.toeN[1] + 4]), v = q => q.map(n => n.toFixed(1)).join(' ');
    e.setAttribute('d', `M${v(top)}L${v(back)}L${v(heel)}L${v(toe)}`);
  };
  f.onSet.push(upd); upd();
  return e;
}

/* ---------- beats ---------- */
const BEATS = [
