function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
const sway = (q, lo, hi, k = 1) => lo + (hi - lo) * (.5 + .32 * Math.sin(q * 6.1 * k) + .18 * Math.sin(q * 15.7 * k + 1));
// An eye, open or closed.
function eyeMark(p, x, y, open, s = 1, col = COL.whole) {
  const g = G(p, { x, y, s });
  if (open) { mk('path', { d: 'M-22 0Q0 -18 22 0Q0 18 -22 0Z', fill: '#f2efe6', stroke: col, 'stroke-width': 2.5 }, g); mk('circle', { r: 7, fill: col }, g); }
  else { path(g, 'M-22 -2Q0 14 22 -2', { stroke: col, 'stroke-width': 3 }); path(g, 'M-14 6l-4 7M0 9v8M14 6l4 7', { stroke: col, 'stroke-width': 2 }); }
  return g;
}
// A lantern dome over the head of a side-view figure.
function domeOn(p, f) {
  const g = G(p);
  mk('path', { d: 'M-34 6A34 40 0 0 1 34 6Z', fill: mix('#e8c25a', COL.board, .35), stroke: '#e8c25a', 'stroke-width': 2 }, g);
  path(g, 'M-26 -10H26M-30 -2H30M-18 -22H18', { stroke: '#e8c25a', 'stroke-width': 1.5 });
  const upd = () => { const [x, y] = onStage(f, 'Hc'); put(g, { x, y: y + 6 * f.s, s: f.s * 1.25 }); };
  f.onSet.push(upd); upd();
  return g;
}
