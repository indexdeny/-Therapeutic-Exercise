<script>
'use strict';
const CHAPTER = { number: 92, title: 'Тренировка равновесия: принципы и прогрессия', minutes: 10, language: 'ru', next: '../ch093/' };
// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch092/cards.ru.json
const CARDS_SHORT = {
  "внешний фокус — на предмете\n«держите доску горизонтально» · «держите палку горизонтально»": "«держите доску горизонтально»",
  "внутренний фокус — на своём теле\n«держите стопы горизонтально» · «держите туловище прямо»": "«держите туловище прямо»",
  "внешний фокус эффективнее для обучения\nзапускает бессознательные, быстрые, рефлекторные процессы (автоматизм) и ускоряет обучение": "автоматизм, ускоряет обучение",
  "когнитивные нарушения, не следует инструкциям\nотдельные упражнения небезопасны → многократно повторять повседневные действия": "повторять повседневные действия",
  "подскоки, прыжки, скакалка\nспрыгнуть с низкой скамейки и удержать равновесие": "спрыгнуть и удержать равновесие",
  "функциональные задачи для всего тела\nподнимать разный вес в разных позах и темпе · открывать разные двери · полоса препятствий": "поднимать, двери, препятствия",
  "если дефицит не изменить\nизменить среду · вспомогательные средства · больше помощи семьи и других людей": "среда, средства, помощь семьи",
  "роллатор (rollator walker)\nчасто назначают для компенсации; неправильно подобранный или неправильно используемый сам вызывает падения → подогнать и научить": "подогнать и научить",
};
// cards-short end

const ST_C = COL.good, DY_C = COL.whole, AN_C = COL.task, RE_C = COL.rat, SO_C = COL.real, EXT = COL.good, INT = COL.dim, ACT = '#ff5a3c';
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
function row(p, x, y, w, s, col, t0, { size = 21, h = 64 } = {}) {
  const g = G(p, { o: 0 });
  mk('rect', { x, y, width: w, height: h, rx: 12, fill: PANEL, stroke: col, 'stroke-width': 2 }, g);
  mk('circle', { cx: x + 24, cy: y + h / 2, r: 8, fill: col }, g);
  const t = para(g, s, x + 44, y + h / 2 + size * .35, null, { size, maxW: w - 60 });
  put(t, { o: 1, y: -(t._h - size * 1.32) / 2 });
  show(g, t0);
  return g;
}
const sway = (q, lo, hi, k = 1) => lo + (hi - lo) * (.5 + .32 * Math.sin(q * 6.1 * k) + .18 * Math.sin(q * 15.7 * k + 1));
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
// Postures for the static progression (side view). Kneeling figures are planted by a knee.
const HALFK = { ...STAND, hN: 88, kN: 90, fN: 2, hF: 0, kF: 92, fF: -40, aN: 10, aF: -6 };
const TALLK = { ...STAND, hN: 0, kN: 92, fN: -40, hF: 0, kF: 92, fF: -40 };
const LUNGE = { ...STAND, t: 6, hN: 78, kN: 84, fN: 18, hF: -22, kF: 60, fF: 30, aN: 6, aF: 2 };
const TANDEM = { ...STAND, hN: 9, hF: -9 };
const SIT0 = { ...SIT, t: 2, aN: 10, aF: 10, eN: 20, eF: 20 };
// A small figure at x on the ground gy in a pose, planted by `by` (an ankle or a knee).
function mini(p, x, gy, s, pose, t0, by = 'AN', o = {}) {
  const f = fig(p, { x, y: 0, s, o: 0, pose, ...o });
  plant(f, by, x, gy);
  if (t0 !== null) show(f.g, t0);
  return f;
}
// A rollator (side view) with its handle at (x, y).
function rollator(p, x, gy, s = 1, t0 = null) {
  const g = G(p, { o: 0 }), c = '#9fb0bf';
  path(g, `M${x} ${gy - 160 * s}L${x - 10 * s} ${gy - 22 * s}M${x} ${gy - 160 * s}L${x + 70 * s} ${gy - 22 * s}M${x - 4 * s} ${gy - 90 * s}H${x + 44 * s}`, { stroke: c, 'stroke-width': 5 * s });
  path(g, `M${x - 14 * s} ${gy - 164 * s}H${x + 16 * s}`, { stroke: '#2c353d', 'stroke-width': 9 * s });
  [[x - 10 * s], [x + 70 * s]].forEach(([cx]) => mk('circle', { cx, cy: gy - 14 * s, r: 14 * s, fill: '#2c353d', stroke: c, 'stroke-width': 3 }, g));
  if (t0 !== null) show(g, t0);
  return g;
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Тренировка равновесия', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 8 · Урок 92', { x: 800, y: 150, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'Тренировка равновесия', { x: 800, y: 235, size: 56, weight: 600, anchor: 'middle' });
    T(g, 'принципы и прогрессия', { x: 800, y: 300, size: 42, weight: 600, anchor: 'middle', fill: COL.dim });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'внешний фокус, безопасность, упражнения по типам контроля', 800, 385, m('sub'), { size: 30, fill: COL.task, anchor: 'middle', weight: 600 });
    const art = G(scene, { o: 0 }), GY = 840;
    const wb = wobbleBoard(art, 800, GY, 260);
    const f = fig(art, { x: 800, y: 0, s: .72, pose: { aN: 90, eN: 4, aF: 90, eF: 4 } });
    prog(q => { const a = 7 * Math.sin(q * 9); wb.set(a); const [x, y] = wb.at(0); f.set({ fN: a, fF: a, t: 0 }); plant(f, 'AN', x, y); }, .4, Math.max(3, D - 1), lin);
    show(art, .3);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);
  }],

  ['multi', 'Многосистемный подход', (m, D) => {
    const p = panel(0), GY = 620;
    txt(p, 'программа затрагивает несколько систем', 800, 60, m('multi'), { size: 28, weight: 700, anchor: 'middle' });
    txt(p, 'пример: после долгого постельного режима или бездействия', 800, 104, m('ex'), { size: 22, fill: COL.dim, anchor: 'middle' });
    const card = (x, title, sub, col, t0) => { const g = G(p, { o: 0 }); roundBox(g, x, 140, 460, 600, col, PANEL, 2.5); T(g, title, { x: x + 230, y: 184, size: 25, weight: 700, fill: col, anchor: 'middle' }); T(g, sub, { x: x + 230, y: 700, size: 20, fill: COL.chalk, anchor: 'middle' }); show(g, t0); };
    card(80, 'растяжка ног и туловища', 'осанка и подвижность', COL.good, m('ex', 1));
    card(570, 'силовые упражнения', 'мышечная работоспособность', ACT, m('str'));
    card(1060, 'функциональное равновесие', 'безопасность в повседневных делах', COL.whole, m('fun'));
    // a calf stretch against a wall, a squat with dumbbells, a single-leg stance
    ground(p, 120, 500, GY, m('ex', 1));
    const CALF = { ...STAND, t: 14, hN: -20, kN: 0, fN: 34, hF: 40, kF: 40, fF: 14, aN: 100, eN: 10, aF: 96, eF: 10 };
    const a = mini(p, 230, GY, .9, CALF, m('ex', 1));
    const [ash, asy] = onStage(a, 'Sh');
    path(p, `M${ash + 120} ${GY}V300`, { stroke: COL.dim, 'stroke-width': 6 }, { o: 0 }); show(p.lastChild, m('ex', 1));
    reach(a, 'N', ash + 114, asy + 10); reach(a, 'F', ash + 114, asy + 10);
    muscleOn(a, ...MUSCLE.gastroc, { after: 'shN', w: 11 });
    txt(p, 'икроножная растягивается', 300, 655, m('ex', 2), { size: 18, fill: ANAT.stretch, anchor: 'middle' });
    ground(p, 610, 990, GY, m('str'));
    const b = mini(p, 800, GY, .9, { ...STAND, aN: 6, eN: 8, aF: 6, eF: 8 }, m('str'));
    const db = carry(p, b, c => dumbbell(c, 1.1)); put(db, { o: 0 }); show(db, m('str'));
    const SQ = { ...STAND, t: 28, hN: 82, hF: 82, kN: 86, kF: 86, fN: 32, fF: 32, aN: 34, aF: 30, eN: 6, eF: 6 };
    const MQ = muscleOn(b, ...MUSCLE.quads, { after: 'thN', w: 12 });
    prog(q => { const k = cyc(q, 3); b.set({ ...blendPose({ ...STAND, aN: 6, eN: 8, aF: 6, eF: 8 }, SQ, k) }); plant(b, 'AN', 800, GY); MQ.act(.9); }, m('str', .5), 6, lin);
    ground(p, 1100, 1480, GY, m('fun'));
    const fp = foamPad(p, 1290, GY, 200, 36, m('fun'));
    const c = mini(p, 1290, fp.top, .9, { ...SINGLE, aN: 80, eN: 6, aF: 80, eF: 6 }, m('fun'));
    const [cx0] = onStage(c, 'AN');
    prog(q => { c.set({ t: sway(q, -3, 3, 2) }); plant(c, 'AN', cx0, fp.top); }, m('fun'), Math.max(3, D - m('fun')), lin);
    txt(p, 'методики силы, подвижности, гибкости, осанки — в своих главах', 800, 800, m('ref'), { size: 21, fill: COL.dim, anchor: 'middle' });
    NOTE(p, 1400, 836, m('ex', 2));
    txt(p, 'упражнения на рисунках — примеры', 1270, 843, m('ex', 2), { size: 17, fill: COL.dim, anchor: 'end' });
  }],

  ['focus', 'Внешний фокус внимания', (m, D) => {
    const p = panel(0), GY = 640;
    txt(p, 'куда направлено внимание (focus of attention)', 800, 60, m('focus'), { size: 28, weight: 700, anchor: 'middle' });
    // the wobble board: two instructions
    const wb = wobbleBoard(p, 360, GY, 280, m('focus'));
    const f = fig(p, { x: 360, y: 0, s: 1, o: 0, pose: { aN: 70, eN: 4, aF: 70, eF: 4 } });
    show(f.g, m('focus'));
    prog(q => { const a = 8 * Math.sin(q * 10) * (1 - .7 * clamp((q - .5) * 3, 0, 1)); wb.set(a); const [x, y] = wb.at(0); f.set({ fN: a, fF: a }); plant(f, 'AN', x, y); }, m('focus'), Math.max(3, D - m('focus')), lin);
    const lvl = path(p, `M190 ${GY - 34}H520`, { stroke: EXT, 'stroke-width': 3, 'stroke-dasharray': '10 8' }, { o: 0 });
    show(lvl, m('ext'));
    infoCard(p, 980, 120, 560, 230, 'внешний фокус — на предмете', '«держите доску горизонтально» · «держите палку горизонтально»', EXT, m('ext'), { size: 22 });
    infoCard(p, 980, 380, 560, 200, 'внутренний фокус — на своём теле', '«держите стопы горизонтально» · «держите туловище прямо»', INT, m('int'), { size: 22 });
    // a bar held out in the hand, kept level
    const fr = frontStand(p, 720, GY, .62, m('ext', 2), { pose: { w: 22, aR: 88, eR: 0 }, muscles: false });
    const bar = path(p, '', { stroke: '#c9a97a', 'stroke-width': 8 });
    put(bar, { o: 0 }); show(bar, m('ext', 2));
    prog(q => { fr.set({ shift: 6 * Math.sin(q * 7) }); const [hx, hy] = fr.at(fr.pts.arms[1][2]); bar.setAttribute('d', `M${hx - 60} ${hy}H${hx + 60}`); }, m('ext', 2), Math.max(3, D - m('ext', 2)), lin);
    infoCard(p, 980, 610, 560, 240, 'внешний фокус эффективнее для обучения', 'запускает бессознательные, быстрые, рефлекторные процессы (автоматизм) и ускоряет обучение', COL.good, m('better'), { size: 21 });
  }],

  ['safe', 'Безопасность', (m, D) => {
    const p = panel(0), GY = 800, S = .98;
    txt(p, 'безопасность при тренировке равновесия', 800, 56, m('safe'), { size: 28, weight: 700, anchor: 'middle' });
    // the patient with a gait belt, the therapist slightly behind and to the side
    ground(p, 120, 640, GY, m('b1'));
    const th = fig(p, { x: 260, y: GY - 182 * S, s: S, o: 0, col: '#b9cfe0' });
    const pt = fig(p, { x: 400, y: GY - 182 * S, s: S, o: 0, pose: SINGLE });
    show(pt.g, m('b1'));
    const belt = gaitBelt(pt);
    put(belt.e, { o: 0 }); show(belt.e, m('b1'));
    show(th.g, m('b2'));
    const [px] = onStage(pt, 'AN');
    const target = () => { const [sx, sy] = onStage(pt, 'Sh'); return [sx - 18, sy + 4]; };
    holdHand(th, 'N', pt, () => belt.handle());
    holdHand(th, 'F', pt, target);
    prog(q => { pt.set({ t: sway(q, -3, 4, 2) }); plant(pt, 'AN', px, GY); }, m('b1'), Math.max(3, D - m('b1')), lin);
    txt(p, 'пояс', 470, 610, m('b1', .5), { size: 19, weight: 700, fill: '#6fa8c8' });
    txt(p, 'сзади и сбоку; рука на поясе, другая у плеча', 380, 850, m('b2', 1), { size: 19, fill: COL.chalk, anchor: 'middle' });
    const L = ['страховочный пояс', 'сзади и сбоку: пояс + верх плеча (туловище, не рука)', 'рядом поручень или брусья', 'без острых краёв рядом', 'высокий риск: двое — спереди и сзади', 'исправное оборудование', 'страховать на входе и сходе с тренажёра', 'чистый пол'];
    L.forEach((s, i) => row(p, 720, 96 + i * 76, 820, `${i + 1}. ${s}`, COL.good, m('b' + (i + 1)), { h: 64, size: 20 }));
    infoCard(p, 720, 712, 820, 150, 'когнитивные нарушения, не следует инструкциям', 'отдельные упражнения небезопасны → многократно повторять повседневные действия', COL.task, m('cog'), { size: 19 });
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-guard', prompt: ['Пациент стоит на качающейся доске. Где и как стоит терапевт?'],
    build: choice([
      ['Чуть позади и сбоку; одна рука на поясе, другая у верха плеча'],
      ['Спереди, держа пациента за обе руки'],
      ['Сзади на расстоянии шага, чтобы не мешать'],
      ['Сбоку, держа пациента за предплечье'],
    ], 0, 'Страхуют за туловище: пояс и верх плеча, стоя чуть позади и сбоку.',
    [null, 'За руки не страхуют: рука — не туловище, и пациент тянет терапевта на себя.', 'На расстоянии шага не успеть: рука должна быть на поясе или рядом.', 'Держат туловище (пояс, плечо), а не руку.']),
  }], done) }],

  ['stat', 'Статический контроль', (m, D) => {
    const p = panel(0), GY = 470, S = .62;
    txt(p, 'статический контроль: позы на твёрдой опоре', 800, 56, m('stat'), { size: 28, weight: 700, anchor: 'middle', fill: ST_C });
    const X = [130, 315, 500, 685, 870, 1055, 1240, 1420];
    const steps = [['сидя', SIT0, 'AN', 'stat'], ['на одном колене', HALFK, 'KF', 'stat'], ['на коленях', TALLK, 'KN', 'stat'], ['стоя', STAND, 'AN', 'stat'], ['тандем', TANDEM, 'AN', 'hard'], ['одна нога', SINGLE, 'AN', 'hard'], ['выпад', LUNGE, 'AF', 'hard'], ['присед', SQUAT, 'AN', 'hard']];
    ground(p, 60, 1540, GY, m('stat'));
    steps.forEach(([lab, pose, by, mark], i) => {
      const t0 = m(mark, (i % 4) * .8 + (mark === 'stat' ? .5 : 0));
      const f = mini(p, X[i], GY, S, pose, t0, by);
      if (lab === 'сидя') { const [hx, hy] = onStage(f, 'H'); const st0 = path(p, `M${hx - 40} ${hy + 14}H${hx + 26}M${hx - 32} ${hy + 14}V${GY}M${hx + 18} ${hy + 14}V${GY}`, { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 }); p.insertBefore(st0, f.g); show(st0, t0); }
      txt(p, lab, X[i], GY + 34, t0, { size: 19, weight: 700, fill: i < 4 ? COL.chalk : ST_C, anchor: 'middle' });
    });
    path(p, 'M80 560H1520M1500 548L1520 560L1500 572', { stroke: ST_C, 'stroke-width': 3 }, { o: 0 }); show(p.lastChild, m('hard'));
    txt(p, 'сложнее →', 1520, 594, m('hard'), { size: 18, fill: ST_C, anchor: 'end' });
    // the bar held level
    const bf = frontStand(p, 220, 860, .5, m('bar'), { pose: { w: 18, aR: 88, eR: 0 }, muscles: false });
    const [bx, by] = bf.at(bf.pts.arms[1][2]);
    path(p, `M${bx - 50} ${by}H${bx + 50}`, { stroke: '#c9a97a', 'stroke-width': 7 }, { o: 0 }); show(p.lastChild, m('bar'));
    txt(p, 'палка горизонтально — внешний фокус', 220, 640, m('bar'), { size: 18, weight: 700, fill: EXT, anchor: 'middle' });
    // how to make it harder
    txt(p, 'усложнение:', 460, 650, m('prog'), { size: 22, weight: 700, fill: COL.chalk });
    pillRow(p, ['мягкая опора: поролон, песок, трава', 'уже опора', 'движения рук', 'глаза закрыты'], 1000, 700, m('prog', .5), { col: ST_C, size: 19, gap: 1.2, space: 10 });
    pillRow(p, ['сопротивление: гантели, эластичная лента'], 800, 770, m('res'), { col: ACT, size: 19 });
    pillRow(p, ['вторая задача: поймать мяч, считать в уме'], 1220, 770, m('dual'), { col: COL.whole, size: 19 });
  }],

  ['dyn', 'Динамический контроль', (m, D) => {
    const p = panel(0), GY = 470;
    txt(p, 'динамический контроль: подвижная опора и движения', 800, 56, m('dyn'), { size: 28, weight: 700, anchor: 'middle', fill: DY_C });
    // a ball, a wobble board, a mini-trampoline
    const ball = G(p, { o: 0 }); show(ball, m('dyn'));
    const fb = mini(p, 250, GY, .62, { ...SIT, t: 0, aN: 10, aF: 10, eN: 10, eF: 10, hN: 88, hF: 88, kN: 92, kF: 92, fN: 4, fF: 4 }, m('dyn'));
    const [bhx, bhy] = onStage(fb, 'H'), br = (GY - bhy - 6) / 2;
    mk('circle', { cx: bhx - 4, cy: GY - br, r: br, fill: mix('#e07a5f', COL.board, .45), stroke: '#e07a5f', 'stroke-width': 3 }, ball);
    p.insertBefore(ball, fb.g);
    ground(p, 120, 1500, GY, m('dyn'));
    txt(p, 'мяч: «чтобы не катился»', 250, GY + 34, m('dyn'), { size: 18, fill: EXT, anchor: 'middle' });
    const wb = wobbleBoard(p, 640, GY, 220, m('dyn', 1.2));
    const fw = fig(p, { x: 640, y: 0, s: .62, o: 0 }); show(fw.g, m('dyn', 1.2));
    const tA = m('add');
    prog(q => { const T = m('dyn', 1.2) + q * (D - m('dyn', 1.2)), a = 7 * Math.sin(T * 1.6); wb.set(a); const [x, y] = wb.at(0); const arms = T < tA + 2 ? 10 : T < tA + 5 ? 90 : 170; fw.set({ fN: a, fF: a, aN: arms, aF: arms, eN: 4, eF: 4, t: T > tA ? 8 * Math.sin(T * .9) : 0 }); plant(fw, 'AN', x, y); }, m('dyn', 1.2), Math.max(3, D - m('dyn', 1.2)), lin);
    txt(p, 'доска: «держите горизонтально»', 640, GY + 34, m('dyn', 1.2), { size: 18, fill: EXT, anchor: 'middle' });
    const tr = G(p, { o: 0 });
    path(tr, `M930 ${GY - 30}H1150`, { stroke: '#7f909c', 'stroke-width': 8 });
    path(tr, `M945 ${GY - 30}L930 ${GY}M1135 ${GY - 30}L1150 ${GY}`, { stroke: '#7f909c', 'stroke-width': 5 });
    show(tr, m('dyn', 2.4));
    const ft = fig(p, { x: 1040, y: 0, s: .6, o: 0 }); show(ft.g, m('dyn', 2.4));
    prog(q => { const h = 30 * Math.abs(Math.sin(q * 18)); plant(ft, 'AN', 1040, GY - 34 - h); }, m('dyn', 2.4), Math.max(3, D - m('dyn', 2.4)), lin);

  ['ant', 'Упреждающий контроль', (m, D) => {
