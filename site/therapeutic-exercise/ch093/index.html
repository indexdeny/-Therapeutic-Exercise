const T1 = COL.good, T2 = COL.task, T3 = COL.bad, OT = COL.whole, ACT = '#ff5a3c', CUFF = '#6fa8c8';
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
function mini(p, x, gy, s, pose, t0, by = 'AN', o = {}) {
  const f = fig(p, { x, y: 0, s, o: 0, pose, ...o });
  plant(f, by, x, gy);
  if (t0 !== null) show(f.g, t0);
  return f;
}
// An ankle cuff weight on the near leg of a side-view figure.
function cuffOn(p, f) {
  const e = mk('rect', { x: -13, y: -30, width: 26, height: 22, rx: 6, fill: CUFF, stroke: mix(CUFF, '#000000', .4), 'stroke-width': 2 }, p);
  const upd = () => { const [x, y] = onStage(f, 'AN'), [kx, ky] = onStage(f, 'KN'); put(e, { x, y, r: Math.atan2(y - ky, x - kx) * 180 / Math.PI - 90 }); };
  f.onSet.push(upd); upd();
  return e;
}

    infoCard(p, 440, 560, 520, 150, 'первые 2 месяца', 'обследование, обучение упражнениям, прогрессия упражнений и ходьбы', OT, m('year', 1), { size: 19 });
    infoCard(p, 1000, 560, 520, 150, 'пособие с рисунками', 'описание каждого упражнения; есть видео', COL.chalk, m('man'), { size: 19 });
    txt(p, 'недорогая · снижает падения у ослабленных пожилых', 800, 790, m('ot', 2), { size: 22, weight: 700, fill: COL.good, anchor: 'middle' });

  ['otstr', 'Отаго: сила', (m, D) => {
    const p = panel(0), GY = 560, S = .82;
    txt(p, 'Отаго: силовые упражнения', 800, 56, m('cuff'), { size: 28, weight: 700, anchor: 'middle', fill: OT });
    // seated knee extension with an ankle cuff

    const a = mini(p, 230, GY, S, { ...SIT, t: 0, aN: 20, aF: 20, eN: 30, eF: 30 }, m('cuff'));
    const [ahx, ahy] = onStage(a, 'H');
    chair(p, ahx, ahy + 20 * S, GY, m('cuff')); p.insertBefore(p.lastChild, a.g);
    const ca = cuffOn(p, a); put(ca, { o: 0 }); show(ca, m('cuff', .5));
    const qa = muscleOn(a, ...MUSCLE.quads, { after: 'thN', w: 12 });
    // standing knee flexion and hip abduction at a table
    const tb = (x) => { const g = G(p, { o: 0 }); mk('rect', { x: x - 10, y: GY - 150, width: 120, height: 14, rx: 4, fill: PANEL, stroke: COL.dim, 'stroke-width': 3 }, g); path(g, `M${x + 4} ${GY - 136}V${GY}M${x + 96} ${GY - 136}V${GY}`, { stroke: COL.dim, 'stroke-width': 4 }); return g; };
    const t1 = tb(580); show(t1, m('cuff', 1));
    const b = mini(p, 530, GY, S, STAND, m('cuff', 1));
    reach(b, 'N', 590, GY - 154); reach(b, 'F', 596, GY - 154);
    const cb = cuffOn(p, b); put(cb, { o: 0 }); show(cb, m('cuff', 1.5));
    const hb = muscleOn(b, ...MUSCLE.hamstrings, { after: 'thN', w: 12 });
    const c = frontStand(p, 880, GY, S * 1.02, m('cuff', 2), { pose: { w: 22, aL: 12, eL: 10, aR: 12, eR: 10 } });
    const ccuff = mk('rect', { width: 26, height: 22, rx: 6, fill: CUFF, stroke: mix(CUFF, '#000000', .4), 'stroke-width': 2 }, p);
    put(ccuff, { o: 0 }); show(ccuff, m('cuff', 2.5));
    // calf raises and toe raises with body weight
    const d = mini(p, 1180, GY, S, STAND, m('ank'));
    const dg = muscleOn(d, ...MUSCLE.gastroc, { after: 'shN', w: 12 });
    const e = mini(p, 1410, GY, S, STAND, m('ank', .8));
    const et = muscleOn(e, ...MUSCLE.tibAnt, { after: 'shN', w: 11 });
    ground(p, 80, 1520, GY, m('cuff'));
    const [dx] = onStage(d, 'toeN'), [ex] = onStage(e, 'heelN');
    // tempo: 2–3 s up, 4–6 s down
    const T0 = m('cuff', .5);
    prog(q => {
      const T = T0 + q * (D - T0), per = 7.5, u = ((T - T0) % per) / per, k = u < 2.5 / 7.5 ? io(u * 3) : 1 - io((u - 2.5 / 7.5) / (5 / 7.5));
      a.set({ kN: lerp(95, 10, k), fN: lerp(5, -10, k) }); qa.act(.9 * (k > .02 ? 1 : 0));
      if (T > m('cuff', 1)) { b.set({ kN: lerp(2, 90, k), fN: lerp(0, -20, k) }); plant(b, 'AF', onStage(b, 'AF')[0], GY); reach(b, 'N', 590, GY - 154); reach(b, 'F', 596, GY - 154); hb.act(.9 * (k > .02 ? 1 : 0)); }
