const ANK = COL.task, KNEE = COL.whole, BACK = COL.rat, ACT = '#ff5a3c', BAND_C = '#e07a9a';
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
const sway = (q, lo, hi, k = 1) => lo + (hi - lo) * (.5 + .32 * Math.sin(q * 6.1 * k) + .18 * Math.sin(q * 15.7 * k + 1));
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
// A single-leg stance on a wobble board (side view): the near foot on the board, the far leg lifted.
function sbBoard(p, x, gy, s, t0, pose = {}) {
  const wb = wobbleBoard(p, x, gy, 220 * s / .8, t0);
  const f = fig(p, { x, y: 0, s, o: 0, pose: { ...SINGLE, ...pose } });
  if (t0 !== null) show(f.g, t0);
  const set = (a, extra = {}) => { wb.set(a); const [bx, by] = wb.at(0); f.set({ ...extra, fN: (extra.fN ?? 0) + a }); plant(f, 'AN', bx, by); };
  set(0);
  return { wb, f, set };
}
// The right ankle from behind (frontal plane): tibia and fibula, talus and calcaneus, the lateral ligament (fibula to
// calcaneus) and the peroneal tendons behind the lateral malleolus. ak.set(inv): the foot tips into inversion (deg);
// the lateral ligament tightens, the peroneals pull back.
function ankleBack(p, x, y, s = 1, t0 = null) {
  const g = G(p, { x, y, s, o: 0 });
  const bone = ANAT.bone, line = mix(bone, '#000000', .35);
  mk('path', { d: 'M-28 -230L-26 -70C-30 -50 -44 -36 -42 -16C-40 -6 -30 -4 -24 -10L-10 -18H22C28 -24 30 -40 28 -70L24 -230Z', fill: bone, stroke: line, 'stroke-width': 2 }, g);
  mk('path', { d: 'M40 -228L44 -60C46 -36 54 -18 58 0C60 12 52 18 44 12C38 4 36 -14 34 -40L32 -228Z', fill: mix(bone, COL.board, .12), stroke: line, 'stroke-width': 2 }, g);
  T(g, 'большеберцовая', { x: -40, y: -160, size: 16, fill: COL.dim, anchor: 'end' });
  T(g, 'малоберцовая', { x: 84, y: -120, size: 16, fill: COL.dim });
  const foot = G(g, { x: 0, y: -10 });
  mk('path', { d: 'M-24 0C-24 -14 -6 -16 10 -16C28 -16 36 -8 36 2L32 22H-22Z', fill: bone, stroke: line, 'stroke-width': 2 }, foot);
  mk('path', { d: 'M-26 24H34C38 40 34 66 20 80C6 88 -10 86 -20 72C-28 58 -30 40 -26 24Z', fill: bone, stroke: line, 'stroke-width': 2 }, foot);
  T(foot, 'таранная', { x: 6, y: 12, size: 13, fill: COL.board, anchor: 'middle' });
  T(foot, 'пяточная', { x: 4, y: 58, size: 13, fill: COL.board, anchor: 'middle' });
  // the foot turns about the ankle at (0, -10); points of the foot in the leg's frame
  const geo = inv => { const at = P => { const [u, v] = rotPt(P[0], P[1], inv); return [u, v - 10]; }; return { lig: [[52, 10], at([32, 50])], per: [[72, -200], at([36, 40])] }; };
  const len = ([A, B]) => Math.hypot(B[0] - A[0], B[1] - A[1]);
  const lig = ligEl(g, { rest: len(geo(12).lig), w: 6 }), per = muscleEl(g, { rest: len(geo(0).per), w: 15, tendon: .22 });
  const ak = { g, foot, lig, per };
  ak.set = (inv, act = 0) => { put(foot, { x: 0, y: -10, r: inv }); const q = geo(inv); lig.set(...q.lig); per.act(act); per.set(...q.per); return ak; };
  ak.set(0);
  if (t0 !== null) show(g, t0);
  return ak;
}

    const f = fig(p, { x: X0, y: GY - 182 * S, s: S, o: 0 });
    show(f.g, m('lbp'));
    const M = { abdom: muscleOn(f, ...MUSCLE.abdom, { w: 11, after: 'torso' }), parasp: muscleOn(f, ...MUSCLE.parasp, { w: 11, after: 'torso' }) };
    const [ax] = onStage(f, 'AN');
    const push = G(p, { o: 0 }); path(push, 'M170 380H230M216 370L230 380L216 390', { stroke: COL.bad, 'stroke-width': 6 }); show(push, m('cc'));
    prog(q => { const u = (q * 3) % 1, k = Math.sin(Math.PI * Math.min(1, u / .5)) * (u < .5 ? 1 : 0); f.set(LEAN(4 * k)); plant(f, 'AN', ax, GY); const a = q > 0 ? .9 : 0; M.abdom.act(a); M.parasp.act(a); }, m('cc', .3), Math.max(3, D - m('cc', .3)), lin);
    txt(p, 'мышцы живота + разгибатели спины одновременно', 380, 180, m('cc', 1), { size: 21, weight: 700, fill: ACT, anchor: 'middle' });
    txt(p, '→ позвоночник жёстче', 380, 212, m('cc', 1.5), { size: 21, fill: COL.chalk, anchor: 'middle' });
    infoCard(p, 760, 140, 780, 110, 'выявить нарушения', 'тесты равновесия, например звёздный тест (SEBT)', BACK, m('sebt'), { size: 20 });
    // the trunk is about half the body mass
    const pie = G(p, { x: 900, y: 420, o: 0 });
    mk('circle', { r: 90, fill: mix(COL.chalk, COL.board, .8), stroke: COL.chalk, 'stroke-width': 2 }, pie);
    mk('path', { d: 'M0 0V-90A90 90 0 0 1 0 90Z', fill: mix(BACK, COL.board, .3), stroke: BACK, 'stroke-width': 2 }, pie);
    T(pie, '≈ ½', { x: 40, y: 10, size: 28, weight: 700, fill: COL.board, anchor: 'middle' });
    T(pie, 'туловище — примерно половина массы тела', { x: 120, y: 8, size: 20, weight: 700, fill: COL.chalk });
    show(pie, m('half'));
    txt(p, '→ равновесие — часть многокомпонентного лечения', 1020, 470, m('half', 2), { size: 19, fill: COL.chalk });
    infoCard(p, 760, 560, 780, 200, 'данные пока', 'нервно-мышечный контроль туловища: боль ↓ и функция ↑ (по оценке пациентов); улучшение равновесия и постуральных реакций не доказано', COL.task, m('ev'), { size: 20 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-region', prompt: ['О какой области речь?'],
    build: grid([
      { parts: ['Прыжки на одной ноге в паре с наблюдателем'], ans: ['k'], why: 'Тренировка в парах предложена для профилактики травм ПКС.' },
      { parts: ['Удары свободной ногой против эластичной ленты'], ans: ['a'], why: 'Элемент успешных программ при растяжениях голеностопа.' },
      { parts: ['Одновременное напряжение мышц туловища в ответ на толчок'], ans: ['b'], why: 'Частая компенсация при хронической боли в пояснице.' },
      { parts: ['Травм примерно вдвое меньше'], ans: ['k'], why: 'Проприоцептивные программы — для ПКС.' },
      { parts: ['−38 % у школьных футболистов и баскетболистов'], ans: ['a'], why: 'Программа Макгуайна и Кина — голеностоп.' },
    ], [['a', 'Голеностоп', ANK], ['k', 'ПКС', KNEE], ['b', 'Поясница', BACK]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Голеностоп: стойка на одной ноге на неустойчивой опоре + бедро и туловище; BESS, SEBT, Y-тест.', 'w1'],
     ['Макгуайн и Кин: −38 %; по 30 с на ногу; 5 дней × 5 недель, затем 3 дня в неделю.', 'w2'],
     ['ПКС: травм примерно вдвое меньше; тренировка в парах с внешним фокусом.', 'w3'],
     ['Поясница: напряжение мышц туловища; боль ↓ и функция ↑, но улучшение равновесия не доказано.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 30, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-sprain', prompt: ['Футболистка, растяжение голеностопа три недели назад, острый период прошёл. Что из урока подходит?'],
    build: choice([
      ['Стойка на одной ноге на неустойчивой опоре + упражнения для бедра и туловища, 2–3 раза в неделю ≈ 6–8 недель'],
      ['Только покой до конца сезона'],
      ['Стойка на двух ногах на полу, раз в неделю'],
      ['Только упражнения для голеностопа — бедро и туловище не важны'],
    ], 0, 'В постостром периоде — стойка на одной ноге на неустойчивой опоре, с работой бедра и туловища; после травмы — 2–3 раза в неделю около 6–8 недель.',
    [null, 'Тренировка равновесия снижает риск повторных растяжений — покой её не заменит.', 'Слишком легко и редко: нужна неустойчивая опора и 2–3 раза в неделю.', 'Сегменты связаны: нужна работа мышц бедра и туловища.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-lbp', prompt: ['Что показывают данные о тренировке нервно-мышечного контроля туловища при боли в пояснице?'],
    build: choice([
      ['Меньше боли и лучше функция по оценке пациентов, но улучшение равновесия не доказано'],
      ['Доказано улучшение равновесия и постуральных реакций'],
      ['Никакого эффекта — тренировка бесполезна'],
      ['Боль усиливается из-за напряжения мышц'],
    ], 0, 'Пациенты отмечают меньше боли и лучшую функцию; а вот улучшение равновесия и постуральных реакций пока не доказано.',
    [null, 'Как раз это пока не удаётся доказать.', 'Эффект есть: меньше боли и лучше функция.', 'В книге об этом не говорится; боль по оценке пациентов уменьшается.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
