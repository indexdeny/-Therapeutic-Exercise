const CARDS_SHORT = {
  "горячая вода\nнагрузка на сердце и сосуды ↑ — и в покое, и при упражнениях": "нагрузка на сердце ↑",
  "≥ 37 °C\nсердечный выброс заметно растёт уже в покое": "сердечный выброс растёт в покое",
  "ревматоидный артрит\nвода теплее — кроме острой стадии": "вода теплее — кроме острой стадии",
  "спастичность\nвода прохладнее (и при погружении 20–45 мин)": "вода прохладнее (и при погружении 20–45 мин)",

// cards-short end

const AQ = COL.whole, HOT = '#e2574c', COOL = '#4f9cc8', HEAT = '#ff8a5c', SKIN = '#d8d1c1', SKL = mix('#d8d1c1', COL.board, .6);
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
// A thermometer with a value label.
function thermo(p, x, y, val, lab, col, t0) {
  const g = G(p, { x, y, o: 0 });
  mk('rect', { x: -12, y: -150, width: 24, height: 156, rx: 12, fill: PANEL, stroke: COL.chalk, 'stroke-width': 2.5 }, g);
  mk('circle', { cy: 20, r: 22, fill: col, stroke: COL.chalk, 'stroke-width': 2.5 }, g);
  const h = (val - 20) * 6.5;
  mk('rect', { x: -6, y: 6 - h, width: 12, height: h + 8, fill: col }, g);
  T(g, val + ' °C', { x: 0, y: -168, size: 26, weight: 700, fill: col, anchor: 'middle' });
  T(g, lab, { x: 0, y: 72, size: 20, weight: 700, fill: COL.chalk, anchor: 'middle' });
  if (t0 !== null) show(g, t0);
  return g;
}
// A horizontal temperature scale from 20 to 40 °C, cool to hot; returns X(t).
function tempScale(p, x0, x1, y, t0) {
  const g = G(p, { o: 0 }), defs = mk('defs', {}, g), X = t => lerp(x0, x1, (t - 20) / 20);
  const gr = mk('linearGradient', { id: 'ts' + (++SHADE_ID), x1: 0, y1: 0, x2: 1, y2: 0 }, defs);
  mk('stop', { offset: 0, 'stop-color': COOL }, gr); mk('stop', { offset: .6, 'stop-color': '#e8c35a' }, gr); mk('stop', { offset: 1, 'stop-color': HOT }, gr);
  mk('rect', { x: x0, y: y - 8, width: x1 - x0, height: 16, rx: 8, fill: `url(#${gr.id})` }, g);
  for (let t = 20; t <= 40; t += 1) {
    path(g, `M${X(t)} ${y + 10}V${y + (t % 2 ? 16 : 22)}`, { stroke: COL.dim, 'stroke-width': 2 });
    if (t % 2 === 0) T(g, String(t), { x: X(t), y: y + 44, size: 18, fill: COL.dim, anchor: 'middle' });
  }
  T(g, '°C', { x: x1 + 18, y: y + 44, size: 18, fill: COL.dim });
  if (t0 !== null) show(g, t0);
  return X;
}
// A band from a to b °C above the scale (row y, height h) with a label.
function band(p, X, a, b, y, h, col, lab, t0, { size = 19, sub = null, scaleY = 760 } = {}) {
  const g = G(p, { o: 0, y: 10 });
  path(g, `M${X(a)} ${y + h}V${scaleY - 12}M${X(b)} ${y + h}V${scaleY - 12}`, { stroke: col, 'stroke-width': 2, 'stroke-dasharray': '5 6' });
  mk('rect', { x: X(a), y, width: X(b) - X(a), height: h, rx: 10, fill: mix(col, COL.board, .62), stroke: col, 'stroke-width': 2.5 }, g);
  const tx = X(b) - X(a) < 300 ? X(b) + 16 : X(a) + 12;
  T(g, `${a}–${b} °C`, { x: tx, y: y + 26, size: size + 1, weight: 700, fill: col });
  T(g, lab, { x: tx, y: y + 52, size, weight: 600, fill: COL.chalk });
  if (sub) T(g, sub, { x: tx, y: y + 76, size: size - 2, fill: COL.dim });
  tw(g, { o: 1, y: 0 }, t0, .5);
  return g;
}
// Equipment, drawn small and shaded.
const DEV = FLOAT_C, DEVL = mix(FLOAT_C, '#000000', .42);
function glove(p, x, y, s = 1) {
  const g = G(p, { x, y, s }), defs = mk('defs', {}, g);
  mk('path', { d: 'M-30 -18L-34 -70L-14 -78L0 -84L16 -78L32 -66L34 -20Z', fill: AQ, 'fill-opacity': .35, stroke: AQ, 'stroke-width': 2 }, g);
  [[-30, -20, -36, -74], [-12, -24, -14, -88], [6, -24, 6, -92], [22, -20, 28, -82]].forEach(([a, b, c, d]) => limbEl(g, defs, SKIN, 8, 7, SKL).set([a, b], [c, d]));
  limbEl(g, defs, SKIN, 9, 8, SKL).set([30, 6], [56, -18]);
  limbEl(g, defs, SKIN, 34, 30, SKL).set([0, -4], [0, 26]);
  return g;
}
function paddle(p, x, y, k = 1) {
  const g = G(p, { x, y, s: k });
  mk('rect', { x: -38, y: -56, width: 76, height: 112, rx: 24, fill: '#e07a5f', stroke: mix('#e07a5f', '#000000', .4), 'stroke-width': 2.5 }, g);
  [[-14, -30], [14, -30], [-14, 0], [14, 0], [-14, 30], [14, 30]].forEach(([a, b]) => mk('circle', { cx: a, cy: b, r: 5, fill: COL.board }, g));
  mk('rect', { x: -26, y: -8, width: 52, height: 10, rx: 4, fill: '#3d4a52' }, g);
  return g;
}
function bell(p, x, y, s = 1) {
  const g = G(p, { x, y, s }), col = '#7fb0d0', ln = mix(col, '#000000', .45);
  path(g, 'M-40 0H40', { stroke: '#9fb0bf', 'stroke-width': 9 });
  [-1, 1].forEach(k => {
    mk('path', { d: `M${k * 34} -12C${k * 46} -46 ${k * 92} -50 ${k * 100} -44V44C${k * 92} 50 ${k * 46} 46 ${k * 34} 12Z`, fill: col, stroke: ln, 'stroke-width': 2.5 }, g);
    [-26, -9, 9, 26].forEach(v => path(g, `M${k * 56} ${v}H${k * 92}`, { stroke: COL.board, 'stroke-width': 5 }));
  });
  return g;
}
function fin(p, x, y, s = 1) {
  const g = G(p, { x, y, s });
  mk('path', { d: 'M-40 -14C-40 -30 -6 -30 10 -24L110 -40L120 20L10 18C-10 22 -40 14 -40 -14Z', fill: '#4fb38a', stroke: mix('#4fb38a', '#000000', .45), 'stroke-width': 2.5 }, g);
  [30, 60, 90].forEach(v => path(g, `M${v} ${-28 + v * .02}L${v + 6} 14`, { stroke: mix('#4fb38a', '#000000', .3), 'stroke-width': 2 }));
  return g;
}
function hBoot(p, x, y, s = 1) {
  const g = G(p, { x, y, s }), col = '#6d9cbf';
  mk('path', { d: 'M-34 -70H10V-20L60 -10C76 -6 80 14 66 20L-34 24Z', fill: col, stroke: mix(col, '#000000', .45), 'stroke-width': 2.5 }, g);
  [-50, -36, -22].forEach(v => path(g, `M-24 ${v}H0`, { stroke: COL.board, 'stroke-width': 5 }));
  [10, 30, 50].forEach(v => path(g, `M${v} -6V14`, { stroke: COL.board, 'stroke-width': 5 }));
  return g;
}
function kickboard(p, x, y, s = 1, r = 0) {
  const g = G(p, { x, y, s, r });
  mk('path', { d: 'M-46 70V-40C-46 -76 46 -76 46 -40V70Z', fill: DEV, stroke: DEVL, 'stroke-width': 2.5 }, g);
  mk('rect', { x: -30, y: -46, width: 22, height: 12, rx: 6, fill: COL.board }, g); mk('rect', { x: 8, y: -46, width: 22, height: 12, rx: 6, fill: COL.board }, g);
  return g;
}
function swimBar(p, x, y, long = false, s = 1, r = 0) {
  const g = G(p, { x, y, s, r }), defs = mk('defs', {}, g);
  if (long) { limbEl(g, defs, DEV, 16, 16, DEVL).set([-110, 0], [110, 0]); return g; }
  path(g, 'M-46 0H46', { stroke: '#9fb0bf', 'stroke-width': 6 });
  [-1, 1].forEach(k => limbEl(g, defs, DEV, 18, 18, DEVL).set([k * 30, 0], [k * 62, 0]));
  return g;
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Температура, бассейны, снаряды', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 9 · Урок 97', { x: 800, y: 130, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'Температура, бассейны, снаряды', { x: 800, y: 215, size: 54, weight: 600, anchor: 'middle' });
    T(g, 'и безопасность', { x: 800, y: 278, size: 40, weight: 600, anchor: 'middle', fill: COL.dim });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'как выбрать воду, бассейн и снаряды', 800, 356, m('sub'), { size: 30, fill: AQ, anchor: 'middle', weight: 600 });
    const art = G(scene, { o: 0 });
    const w = pool(art, 380, 1220, 620, 850, null, { rim: 40 });
    w.wave(.3, D, 4);
    const f = floater(w.mid, 760, 620, .72, null, {}, { collar: true, belt: true, rings: true }); put(f.g, { o: 1 });
    const kb = kickboard(art, 1060, 614, .55, 90), sb = swimBar(art, 520, 612, false, .8);
    thermo(art, 1300, 760, 30, 'вода', COOL, null); put(art.lastChild, { o: 1 });
    prog(q => { const T0 = q * D; put(kb, { y: 614 + 3 * Math.sin(T0 * 1.6) }); put(sb, { y: 612 + 3 * Math.sin(T0 * 1.6 + 1) }); }, .3, D, lin);
    show(art, .3);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);
  }],

  ['temp', 'Как выбрать температуру', (m, D) => {
    const p = panel(0);
    txt(p, 'температура воды и терморегуляция', 800, 56, m('temp'), { size: 28, weight: 700, anchor: 'middle', fill: AQ });
    txt(p, 'выбор — по нарушениям пациента и целям', 400, 104, m('temp', .5), { size: 21, fill: COL.dim, anchor: 'middle' });
    pill(p, 'интенсивнее нагрузка → вода прохладнее', 400, 150, m('rule'), { col: COOL, size: 21 });
    pill(p, 'подвижность, гибкость, расслабление → теплее', 400, 196, m('rule', 1.5), { col: HOT, size: 21 });
    thermo(p, 260, 470, 30, 'вода', COOL, m('air'));
    thermo(p, 520, 470, 33, 'воздух', HEAT, m('air', .6));
    txt(p, '+3 °C', 390, 330, m('air', .6), { size: 30, weight: 700, fill: HEAT, anchor: 'middle' });
    // heat into deeper tissue: thin and thick subcutaneous fat
    const xs = [[200, 10, 'тонкий жир'], [520, 30, 'толстый жир']].map(([x, fat, lab]) => {
      const g = G(p, { o: 0 }), y = 720, R = 100;
      mk('circle', { cx: x, cy: y, r: R, fill: mix(SKIN, COL.board, .2), stroke: SKIN, 'stroke-width': 3 }, g);

      mk('circle', { cx: x, cy: y, r: R - 6 - fat, fill: ANAT.muscle }, g);
      mk('circle', { cx: x, cy: y, r: 22, fill: ANAT.bone }, g);

      show(g, m('deep'));
      return { wave, R, fat };

    prog(q => xs.forEach(c => { const u = (q * 3) % 1, depth = c.fat === 10 ? 80 : 40; c.wave.setAttribute('r', (c.R - u * depth).toFixed(1)); c.wave.setAttribute('stroke-opacity', (.85 * (1 - u)).toFixed(2)); }), m('deep'), Math.max(3, D - m('deep')), lin);
    txt(p, 'внутренняя температура меняется обратно толщине жира', 360, 590, m('deep'), { size: 18, fill: COL.chalk, anchor: 'middle' });
    // regulation in water
    const w = pool(p, 820, 1540, 530, 800, m('reg'), { rim: 170 });
    w.wave(m('reg'), Math.max(3, D - m('reg')), 3);
    const f = fig(w.mid, { s: 1.05, o: 0 }); plant(f, 'AN', 1000, 800); show(f.g, m('reg'));
    const sw = G(p, { o: 0 });
    const [hcx, hcy] = onStage(f, 'Hc');
    [[hcx - 10, hcy - 10], [hcx + 14, hcy + 4], [hcx - 24, hcy + 34]].forEach(([x, y]) => mk('path', { d: `M${x} ${y}C${x - 6} ${y + 10} ${x - 6} ${y + 16} ${x} ${y + 16}C${x + 6} ${y + 16} ${x + 6} ${y + 10} ${x} ${y}Z`, fill: '#bfe6f5' }, sw));
    show(sw, m('skin'));
    txt(p, 'меньше кожи на воздухе → хуже потоотделение', 1180, 300, m('skin'), { size: 19, weight: 700, fill: COL.chalk, anchor: 'middle' });
    const ha = G(p, { o: 0 });
    [[1040, 570], [1050, 630], [1040, 690], [1040, 750]].forEach(([x, y]) => { const e = mk('path', { d: '', stroke: HEAT, 'stroke-width': 3.5, fill: 'none' }, ha); let d = `M${x} ${y}`; for (let i = 1; i <= 14; i++) d += `L${x + i * 7} ${y + 5 * Math.sin(i * .9)}`; d += `M${x + 88} ${y - 7}L${x + 98} ${y + 4}L${x + 86} ${y + 11}`; e.setAttribute('d', d); });
    show(ha, m('cond'));
    prog(q => ha.setAttribute('transform', `translate(${(14 * ((q * 4) % 1)).toFixed(1)} 0)`), m('cond'), Math.max(3, D - m('cond')), lin);
    txt(p, 'вода проводит тепло × 25', 1330, 600, m('cond'), { size: 22, weight: 700, fill: HEAT, anchor: 'middle' });

    txt(p, 'чем ±1 °C в воздухе', 1330, 428, m('feel'), { size: 19, weight: 700, fill: COL.chalk, anchor: 'middle' });

    // waist-deep at 37 °C: heat wins over the central shift of blood
    const w = pool(p, 100, 560, 640, 840, m('hr'), { rim: 30 });
    const f = fig(w.mid, { s: 1, o: 0 }); plant(f, 'AN', 300, 840); show(f.g, m('hr'));
    const ht = heartEl(p, ...figPt(f, [16, -96]), .13, m('hr'));
    const hrT = txt(p, '', 760, 560, m('hr'), { size: 30, weight: 700, fill: HOT, anchor: 'middle' });

    prog(q => { const T = T0 + q * (D - T0), bpm = Math.round(lerp(72, 96, clamp((T - T0) / 4, 0, 1))); ht.beat((1 - Math.cos(2 * Math.PI * T * bpm / 60)) / 2); hrT.textContent = bpm + ' уд/мин'; }, T0, Math.max(3, D - T0), lin);

    txt(p, 'тепло учащает пульс сильнее,', 760, 650, m('hr', .5), { size: 19, fill: COL.chalk, anchor: 'middle' });
    txt(p, 'чем давление смещает кровь', 760, 676, m('hr', .5), { size: 19, fill: COL.chalk, anchor: 'middle' });
    txt(p, 'к центру', 760, 702, m('hr', .5), { size: 19, fill: COL.chalk, anchor: 'middle' });
  }],

  ['ranges', 'Диапазоны температуры', (m, D) => {

    T(t33, '33 °C — острая болезненная травма', { x: X(33) + 6, y: 282, size: 21, weight: 700, fill: COL.task });

    band(p, X, 26, 28, 400, 110, AQ, 'аэробная тренировка', m('aer'), { sub: 'эффективнее, ударный объём ↑, ЧСС ниже' });

  }],

  ['tip', 'Время и температура: советы', (m, D) => {
    const p = panel(0);

    items.forEach((s, i) => { const x = 110 + (i % 3) * 480, y = 700 + Math.floor(i / 3) * 70, t0 = m('first', .5 + i * .7); checkMark(p, x, y - 6, t0); txt(p, s, x + 26, y, t0, { size: 21, fill: COL.chalk }); });
  }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 100, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Интенсивнее — прохладнее; подвижность и расслабление — теплее; воздух на 3 °C теплее воды.', 'w1'],
     ['26–35 °C — гибкость, сила, ходьба; 33 °C — острая боль; 26–28 °C — аэробная; 22–26 °C — интенсивная.', 'w2'],
     ['Начинают с 10 минут, обычно не больше 20.', 'w3'],
     ['Снаряды — опора или сопротивление; перчатки и лопатки не плавучие; Hydro-tone сильнее всего.', 'w4'],
     ['Безопасность: чистка, хлор и pH, нескользкий пол, правила, круги, сотрудник с навыком СЛР.', 'w5']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 190 + i * 135, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: AQ }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 28, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-acute', prompt: ['Острая болезненная травма плеча, мышцы в спазме; сердце и лёгкие здоровы. Что выбрать для первого занятия в воде?'],
    build: choice([
      ['Тёплая вода ≈ 33 °C; начать с 10 минут и увеличивать по переносимости'],
      ['Прохладная вода 22–26 °C: холод снимет боль'],
      ['Горячая вода 38 °C на 45 минут'],
      ['26–28 °C, сразу 30 минут интенсивной работы'],
    ], 0, 'При острой болезненной травме полезна тёплая вода 33 °C; начинают с 10 минут, обычно не больше 20.',
    [null, '22–26 °C — для интенсивной аэробной тренировки, а не для расслабления.', 'Выше 37 °C долгое погружение может навредить; и 45 минут — слишком долго.', 'Это режим аэробной тренировки; и начинают с 10 минут.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-safe', prompt: ['Что из этого — обязательное требование безопасности по книге?'],
    build: choice([
      ['Всё время рядом хотя бы один сотрудник с навыком сердечно-лёгочной реанимации'],
      ['Проверять хлор раз в неделю'],
      ['Чистить бассейн раз в месяц'],
      ['Держать спасательные круги на складе, чтобы не мешали'],
    ], 0, 'Сотрудник с навыком СЛР должен быть рядом всё время; круги — под рукой.',
    [null, 'Хлор и кислотность проверяют дважды в день.', 'Чистят не реже двух раз в неделю.', 'Круги должны быть под рукой.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
