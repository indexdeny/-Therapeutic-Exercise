// bio begin: places of the biomechanics layer (B switches); made by tools/therapeutic-exercise/bio.py from content/therapeutic-exercise/ch098/bio.ru.json
const BIO = [
  {"beat": "knee", "fig": 1, "level": "angle", "joint": "kN", "load": {"type": "none"}},
];
// bio end
// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch098/cards.ru.json
const CARDS_SHORT = {

  "разгибание бедра\nтот же захват стопы бедром терапевта; рука на поясе ведёт пациента к ногам; колено ниже → прямая мышца бедра": "колено ниже → прямая мышца бедра",
  "ротация бедра\nбедро 70°, колено 90°; терапевт вращает бедро, тело пациента отстаёт в воде": "тело отстаёт в воде",
  "на ступеньках\nпациент полулёжа: разгибание — руки выше и ниже колена; сгибание — хват за нижнюю часть голени": "полулёжа: разгибание и сгибание",

};
// cards-short end

const AQ = COL.whole, FIX = COL.good, MOVE = COL.task, STR = ANAT.stretch, TH_C = '#b9cfe0';
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const mixPt = (A, B, k) => [lerp(A[0], B[0], k), lerp(A[1], B[1], k)];
// Gluteus maximus on a side-view figure: from the back of the pelvis to the back of the femur.
const GLUT = [['H', 'Sh', 8, -24], ['H', 'KN', 36, 14]];
// The therapist standing in the water (side view): a pale figure.
const therapist = (p, s, pose = {}, dir = -1) => fig(p, { s, dir, o: 0, col: TH_C, pose: { ...STAND, ...pose } });
// Hamstring stretch: the patient's heel on the therapist's shoulder; k 0..1 — from a squat to standing.
function hamScene(w, xT, SY, GY, t0, { sP = .85, sT = 1.1 } = {}) {
  const th = therapist(w.mid, sT);
  const pt = floater(w.mid, 0, SY, sP, null, {}, { collar: true, belt: true });
  const ham = muscleOn(pt, ...MUSCLE.hamstrings, { w: 13, after: 'thN' });
  const L = 182 * sP, hipY = SY + 2 * sP;
  const SQ = { t: 18, hd: -14, hN: 74, kN: 100, fN: 30, hF: 74, kF: 100, fF: 30 }, UP = { t: 6, hd: -8, hN: 4, kN: 2, fN: 0, hF: -4, kF: 2, fF: 0 };
  const o = { th, pt, ham, hip: 0 };
  o.set = (k, pull = 0) => {
    th.set(blendPose(SQ, UP, k)); plant(th, 'AN', xT, GY);
    const [sx, sy] = onStage(th, 'Sh'), tx = sx - 6 - pull * 10, ty = sy - 14 * sT;
    const a = Math.asin(clamp((hipY - ty) / L, 0, .99)) * 180 / Math.PI;
    o.hip = a;
    pt.set({ hN: a, kN: 0, fN: -10 }); plant(pt, 'AN', tx, ty);
    const P = figPt(pt, mixPt(pt.pts.H, pt.pts.KN, .8));
    reach(th, 'N', P[0] + 4, P[1] - 4); reach(th, 'F', P[0] + 18, P[1] + 2);
  };
  o.set(0);
  if (t0 !== null) { show(th.g, t0); show(pt.g, t0); }
  return o;
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Растяжка в воде', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 9 · Урок 98', { x: 800, y: 130, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'Растяжка в воде', { x: 800, y: 215, size: 56, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'ручная растяжка и самостоятельная — с поплавками', 800, 300, m('sub'), { size: 30, fill: AQ, anchor: 'middle', weight: 600 });
    const art = G(scene, { o: 0 });
    const w = pool(art, 300, 1300, 640, 860, null, { rim: 40 });
    w.wave(.3, D, 4);
    const hs = hamScene(w, 1060, 640, 860, null);
    put(hs.th.g, { o: 1 }); put(hs.pt.g, { o: 1 });
    prog(q => hs.set(cyc(q, 1.2)), .3, Math.max(3, D - .3), lin);

    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);
  }],

    pill(p, 'но плавучесть → среда менее устойчива', 800, 150, m('but'), { col: COL.bad, size: 20 });

    const th = therapist(w.mid, 1.05, { aN: 40, eN: 40, aF: 30, eF: 30 }); plant(th, 'AN', 540, 652); show(th.g, m('setup'));
    w.mid.insertBefore(th.g, pt.g);
    holdHand(th, 'N', pt, () => figPt(pt, [0, -50])); holdHand(th, 'F', pt, () => figPt(pt, [0, -10]));
    txt(p, 'по пояс; на спине: поплавки у шеи, на поясе, у стоп', 610, 260, m('setup'), { size: 20, weight: 700, fill: COL.chalk, anchor: 'middle' });
    const sit = fig(w.mid, { s: .62, o: 0, pose: { ...SIT, t: -8, aN: 20, eN: 20, aF: 20, eF: 20 } }); plant(sit, 'AN', 352, 545); show(sit.g, m('setup', 2));
    txt(p, 'или сидя на ступеньках', 230, 700, m('setup', 2), { size: 19, weight: 700, fill: COL.chalk, anchor: 'middle' });
    prog(q => { const T = q * D; put(pt.g, { y: SY + 1.8 + 3 * Math.sin(T * 1.7) }); pt.set({}); }, m('setup'), Math.max(3, D - m('setup')), lin);
    infoCard(p, 1000, 230, 550, 200, '+ на спине с поддержкой воды', 'доступ к пациенту, контроль терапевта и положение пациента лучше, чем на суше', COL.good, m('plus'), { size: 21 });
    infoCard(p, 1000, 450, 550, 230, '− трудности', 'волны мешают; тонкости растяжки в конце объёма и стабилизацию лопатки трудно удержать и почувствовать', COL.bad, m('minus'), { size: 21 });
    infoCard(p, 1000, 700, 550, 140, 'приёмы пассивные', '+ можно торможение мышц; принципы — как в главе 4', AQ, m('princ'), { size: 21 });
  }],

  ['terms', 'Термины', (m, D) => {
    const p = panel(0);
    txt(p, 'термины ручной растяжки', 800, 56, m('terms'), { size: 28, weight: 700, anchor: 'middle', fill: AQ });

    const up = fig(w.mid, { s: .62, o: 0 }); plant(up, 'AN', 170, 560); show(up.g, m('pos'));
    floater(w.mid, 520, 420, .62, m('pos', 1.2), {}, { collar: true, belt: true, rings: true });

    txt(p, 'сидя или вертикально', 170, 636, m('pos'), { size: 19, fill: COL.chalk, anchor: 'middle' });
    txt(p, 'с поддержкой плавучести (BS):', 520, 610, m('pos', 1.2), { size: 19, weight: 700, fill: AQ, anchor: 'middle' });
    txt(p, 'лёжа на спине', 520, 636, m('pos', 1.2), { size: 19, fill: COL.chalk, anchor: 'middle' });
    txt(p, 'положение терапевта — как он стоит относительно пациента', 410, 250, m('pos'), { size: 19, fill: COL.dim, anchor: 'middle' });
    // the two hands, from above: the patient's right arm is affected
    const tp = poolTop(p, 820, 110, 720, 600, m('fix'));
    const f = flatFig(tp.mid, 1100, 470, .62, null); f.face(true); f.arm(40); put(f.g, { o: 1 });
    const thG = G(tp.top, { s: .6 }), th = therapistTop(thG, null); put(th, { o: 1 });
    const c1 = contact(tp.top), c2 = contact(tp.top);
    put(c1, { o: 0 }); put(c2, { o: 0 }); show(c1, m('fix')); show(c2, m('move'));
    const st0 = P => f.stage(P);
    const upd = () => {
      const E = st0(f.pts.E), Wr = st0(f.pts.W), Sx = st0(f.S), Pp = mixPt(Sx, E, .55), Pd = mixPt(E, Wr, .7);
      c1.at(Pp, false, 0); c2.at(Pd, false, 0);

    };
    upd();
    prog(q => { f.arm(40 + 50 * cyc(q, 1.5)); upd(); }, m('dir'), Math.max(3, D - m('dir')), lin);
    const lf = G(p, { o: 0 }); T(lf, 'фиксирующая рука', { x: 1500, y: 170, size: 21, weight: 700, fill: FIX, anchor: 'end' }); T(lf, 'на той же стороне · проксимально · стабилизирует', { x: 1500, y: 196, size: 17, fill: COL.chalk, anchor: 'end' }); show(lf, m('fix'));
    const lm = G(p, { o: 0 }); T(lm, 'двигающая рука', { x: 1500, y: 650, size: 21, weight: 700, fill: MOVE, anchor: 'end' }); T(lm, 'противоположная · дистально · ведёт и растягивает', { x: 1500, y: 676, size: 17, fill: COL.chalk, anchor: 'end' }); show(lm, m('move'));
    put(c1, {}); c1.setAttribute('fill', FIX); c2.setAttribute('fill', MOVE);
    txt(p, 'направление движения — движение двигающей руки', 1180, 760, m('dir'), { size: 20, weight: 700, fill: MOVE, anchor: 'middle' });
    pill(p, 'поражена правая рука пациента', 1180, 820, m('fix'), { col: COL.dim, size: 18 });
  }],

  ['spine', 'Позвоночник', (m, D) => {
    const p = panel(0);
    txt(p, 'растяжка позвоночника', 800, 56, m('spine'), { size: 28, weight: 700, anchor: 'middle', fill: AQ });
    txt(p, 'сгибание шеи: у головы, лицом к ногам; без воротника; ладони обхватывают голову; медленно — иначе пациент уплывает', 800, 98, m('cflex'), { size: 19, fill: COL.chalk, anchor: 'middle' });
    // lateral flexion of the neck (from above): the fixed hand under the back holds the far arm
    const t1 = poolTop(p, 60, 130, 700, 580, m('clat'));
    const a = flatFig(t1.mid, 380, 470, .58, null); a.face(true); put(a.g, { o: 1 });

    const ca1 = contact(t1.top), ca2 = contact(t1.top);
    ca1.setAttribute('fill', FIX); ca2.setAttribute('fill', MOVE);
    const neck = mk('path', { stroke: STR, 'stroke-width': 7, 'stroke-linecap': 'round', fill: 'none', 'stroke-opacity': 0 }, t1.top);
    const setA = lat => {
      a.head(-lat);
      const arm = a.stage([-96, -96]), hd = a.stage([0, -180]), [hx, hy] = rotPt(0, -70 * .58, -lat);

      ca1.at(arm, true, 0); ca2.at(head, false, 90);
      const k = 1 / .84; th1.set([476 * k, 392 * k], [arm[0] * k, arm[1] * k], [head[0] * k, head[1] * k]);
      const n0 = a.stage([26, -186]), n1 = a.stage([60, -168]);
      neck.setAttribute('d', `M${(n0[0] + 4).toFixed(1)} ${(n0[1] - 26).toFixed(1)}Q${(n0[0] + 14).toFixed(1)} ${(n0[1] - 4).toFixed(1)} ${n1[0].toFixed(1)} ${n1[1].toFixed(1)}`);
      neck.setAttribute('stroke-opacity', (clamp(lat / 25, 0, 1) * .9).toFixed(2));
    };
    setA(0);
    prog(q => setA(28 * io(clamp(q * 1.6, 0, 1))), m('clat', 1.5), 4);
    txt(p, 'боковое сгибание шеи', 410, 170, m('clat'), { size: 21, weight: 700, fill: AQ, anchor: 'middle' });
    txt(p, 'фиксирующая рука — под спиной, держит другую руку пациента', 410, 740, m('clat', 1), { size: 17, weight: 700, fill: FIX, anchor: 'middle' });
    txt(p, 'растягивается сторона шеи у терапевта', 410, 772, m('clat', 3), { size: 17, weight: 700, fill: STR, anchor: 'middle' });
    NOTE(p, 410, 808, m('clat', 3));
    // lateral flexion of the trunk: the hip in contact, the abducted arm held, the leg pulled toward the therapist
    const t2 = poolTop(p, 800, 130, 740, 580, m('tlat'));
    const b = flatFig(t2.mid, 1200, 470, .58, null); b.face(true); b.arm(120); put(b.g, { o: 1 });
    const hipT = G(t2.top, { o: 0 }); mk('ellipse', { cx: 0, cy: 0, rx: 26, ry: 40, fill: TH_C, 'fill-opacity': .5, stroke: TH_C, 'stroke-width': 2.5, 'stroke-dasharray': '6 4' }, hipT); show(hipT, m('tlat', 1));
    const pullA = fArrow(t2.top, 0, 0, 0, 0, MOVE, { w: 5, head: 14 }); put(pullA, { o: 0 }); show(pullA, m('tpull'));
    const cb1 = contact(t2.top), cb2 = contact(t2.top); cb1.setAttribute('fill', FIX); cb2.setAttribute('fill', MOVE);
    put(cb1, { o: 0 }); put(cb2, { o: 0 }); show(cb1, m('thand')); show(cb2, m('thand'));
    const flank = mk('path', { stroke: STR, 'stroke-width': 8, 'stroke-linecap': 'round', fill: 'none', 'stroke-opacity': 0 }, t2.top);
    const setB = k => {

      b.leg(3 - th); b.legF(3 + th);

      cb1.at(hand, false, 0); cb2.at([leg[0] + 18, leg[1]], false, 90);
      put(hipT, { x: hipC[0] - 8, y: hipC[1] + 6 }); pullA.set(leg[0] + 40, leg[1] + 30, -90, 0);
      const s0 = b.stage([66, -150]), s1 = b.stage([64, 10]), mid = b.stage([92 + 40 * k, -70]);
      flank.setAttribute('d', `M${s0[0].toFixed(1)} ${s0[1].toFixed(1)}Q${mid[0].toFixed(1)} ${mid[1].toFixed(1)} ${s1[0].toFixed(1)} ${s1[1].toFixed(1)}`);
      flank.setAttribute('stroke-opacity', (k * .9).toFixed(2));
    };
    setB(0);
    prog(q => setB(io(clamp(q * 1.5, 0, 1))), m('tpull'), 4);
    txt(p, 'боковое сгибание туловища', 1170, 170, m('tlat'), { size: 21, weight: 700, fill: AQ, anchor: 'middle' });
    txt(p, 'бедро терапевта (пунктир) — у бедра пациента; рука отведена', 1170, 740, m('tlat', 1), { size: 17, weight: 700, fill: COL.chalk, anchor: 'middle' });
    txt(p, 'растягивается правая сторона туловища', 1170, 772, m('tpull'), { size: 17, weight: 700, fill: STR, anchor: 'middle' });
    txt(p, 'дистальнее хват — больше рычаг; разные хваты — разные сегменты', 1170, 804, m('tpull', 1.5), { size: 17, fill: COL.chalk, anchor: 'middle' });
  }],

  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-hand', prompt: ['Фиксирующая или двигающая рука?'],
    build: grid([

  ['knee', 'Колено и бедро', (m, D) => {
    const p = panel(0);
    txt(p, 'сгибание колена лёжа на спине', 800, 56, m('knee'), { size: 28, weight: 700, anchor: 'middle', fill: AQ });
    // the therapist half-kneels with the patient's foot hooked under the front thigh
    const SY = 470, sT = 1.05, sP = .95, GY = SY + 92 * sT + 6, w = pool(p, 60, 1000, SY, GY + 120, m('knee'), { rim: 40, alpha: .3 });
    w.wave(m('knee'), Math.max(3, D - m('knee')), 3);
    const th = therapist(w.mid, sT, { t: 6, hN: 88, kN: 90, fN: 0, hF: -4, kF: 96, fF: -50 }); plant(th, 'KF', 820, GY);
    show(th.g, m('knee'));
    const [tkx, tky] = onStage(th, 'KN'), [thx, thy] = onStage(th, 'H');
    const F = [tkx - 30, (thy + tky) / 2 + 16 * sT];   // the foot under the therapist's front thigh
    const pt = floater(w.mid, 500, SY, sP, null, { kN: 60, fN: 20 }, { collar: true, belt: true });
    show(pt.g, m('knee'));
    const rf = muscleOn(pt, ...MUSCLE.rectus, { w: 13, after: 'thN' });
    const TH = 92 * sP, SH = 90 * sP, hipY = SY + 2 * sP, dy = F[1] - hipY;
    const kOf = a => a - Math.asin(clamp(-(dy + TH * Math.sin(rad(a))) / SH, -1, 1)) * 180 / Math.PI;
    const K2 = kOf(50);
    const place = (a, k, keepFoot) => {
      pt.set({ hN: a, kN: k });
      if (keepFoot) plant(pt, 'AN', F[0], F[1]); else { const s0 = st(pt.g); put(pt.g, { x: s0.x, y: hipY }); }
    };
    place(15, kOf(15), true);
    holdHand(th, 'N', pt, () => onStage(pt, 'AN').map((v, i) => i ? v - 18 : v - 14));
    holdHand(th, 'F', pt, () => figPt(pt, [0, -32]));
    const T1 = m('pull'), T2 = m('lower');
    prog(q => {
      const T = q * D;
      if (T < T2) { const a = lerp(15, 50, io(clamp((T - T1) / 3, 0, 1))); place(a, kOf(a), true); }
      else { place(50, K2, true); const a = lerp(50, 22, io(clamp((T - T2) / 2.5, 0, 1))); place(a, K2, false); }
    }, 0, D, lin);
    const kl = txt(p, '', 300, 250, m('pull'), { size: 30, weight: 700, fill: STR, anchor: 'middle' });
    prog(q => { kl.textContent = 'сгибание колена ≈ ' + Math.round(pt.pose.kN / 5) * 5 + '°'; }, m('pull'), Math.max(2, D - m('pull')), lin);
    txt(p, 'фиксирующая рука — на голени, двигающая — на поясе', 530, 150, m('hands'), { size: 20, weight: 700, fill: COL.chalk, anchor: 'middle' });
    txt(p, 'тело — над зафиксированной стопой', 530, 190, m('pull'), { size: 20, weight: 700, fill: MOVE, anchor: 'middle' });
    txt(p, 'опустить колено → бедро разгибается →', 400, 330, m('lower'), { size: 20, weight: 700, fill: STR, anchor: 'middle' });
    txt(p, 'прямая мышца бедра растягивается сильнее; медленно', 400, 360, m('lower'), { size: 19, fill: COL.chalk, anchor: 'middle' });
    infoCard(p, 1040, 110, 510, 230, 'разгибание бедра', 'тот же захват стопы бедром терапевта; рука на поясе ведёт пациента к ногам; колено ниже → прямая мышца бедра', MOVE, m('hipext'), { size: 20 });
    infoCard(p, 1040, 360, 510, 210, 'ротация бедра', 'бедро 70°, колено 90°; терапевт вращает бедро, тело пациента отстаёт в воде', MOVE, m('rot'), { size: 20 });
    infoCard(p, 1040, 590, 510, 210, 'на ступеньках', 'пациент полулёжа: разгибание — руки выше и ниже колена; сгибание — хват за нижнюю часть голени', MOVE, m('steps'), { size: 20 });
  }],
