<script>
'use strict';
const CHAPTER = { number: 99, title: 'Силовые упражнения в воде', minutes: 9, language: 'ru', next: '../ch100/' };
// bio begin: places of the biomechanics layer (B switches); made by tools/therapeutic-exercise/bio.py from content/therapeutic-exercise/ch099/bio.ru.json
const BIO = [
  {"beat": "ue", "fig": 1, "level": "angle", "joint": "aN", "load": {"type": "none"}},
];
// bio end
// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch099/cards.ru.json
const CARDS_SHORT = {
  "ноги — над, руки — от\nтело проходит над зафиксированным сегментом ноги или уходит от сегмента руки": "тело проходит над ногой",
  "лёжа на спине — нельзя\nэксцентрика и ритмическая стабилизация: тело наклоняется и вращается, мало силы и трения; горизонтальное приведение и отведение плеча — избегать": "эксцентрика и ритмическая стабилизация",
  "руки терапевта\nнаправляющая — на той же стороне, проксимальнее; сопротивления — противоположная, дистально; дистальнее → больше сопротивление": "дистальнее → больше сопротивление",
  "ротации бедра (колено 90°)\nтело уходит от зафиксированного сегмента; не делать при возможной нестабильности колена": "нестабильность колена — не делать",
  "разгибание колена\nтерапевт у стоп; четырёхглавая уводит тело от терапевта": "уводит тело от терапевта",
  "голеностоп: короткий рычаг, движется всё тело\nтыльное сгибание → к терапевту, подошвенное → от; инверсия → к, эверсия → от; при слабых связках — не в полную силу": "при слабых связках — не в полную силу",
  "фронтальная плоскость\nтерапевт держит за плечи или за стопы и ведёт из стороны в сторону": "из стороны в сторону",
  "✗ боковой изгиб туловища\nстабилизация потеряна — подсказка": "стабилизация потеряна — подсказка",
  "интенсивнее\nбыстрее движение; держать дистальнее (за стопы)": "быстрее, дистальнее",
  "многонаправленный вариант\nконечность зафиксирована; схемы с сопротивлением при нейтральном позвоночнике; одна конечность тяжелее двух; скорость и длительность ↑": "одна конечность тяжелее двух",
  "положение\nруки — по плечи; ноги — до середины туловища; многое — вертикально на глубине; на спине или на животе — для прогрессии и спорта; диагонали двух ног — на спине, на животе или вертикально на глубине": "руки по плечи, ноги до середины туловища",
};
// cards-short end

const AQ = COL.whole, GUIDE = COL.good, RES = COL.task, ACT = '#ff5a3c', TH_C = '#b9cfe0', AWAY = COL.rat, TOWARD = COL.irr;
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const mixPt = (A, B, k) => [lerp(A[0], B[0], k), lerp(A[1], B[1], k)];
// Stage point of a local point of a flatFig that has been moved (and turned) with put.
const stg = (f, P) => { const s0 = st(f.g), [u, v] = rotPt(P[0] * f.s, P[1] * f.s, s0.r || 0); return [s0.x + u, s0.y + v]; };
const therapist = (p, s, pose = {}, dir = -1) => fig(p, { s, dir, o: 0, col: TH_C, pose: { ...STAND, ...pose } });
// Shoulder flexion against the hand (side view): the forearm stays where the therapist holds it, the body slides away.
// r.set(a) — shoulder flexion in degrees.
function flexRig(w, SY, GY, xSh, t0, { sP = .9, sT = 1.05 } = {}) {
  const th = therapist(w.mid, sT, { t: 8 }, 1);
  const pt = floater(w.mid, 0, SY, sP, null, { aN: 30, eN: 6 }, { collar: true, belt: true, rings: true });
  const fl = muscleOn(pt, ['Sh', 'H', 4, -24], ['Sh', 'EN', 36, -9], { w: 12, after: 'torso' });
  const y0 = SY + 2 * sP;
  const r = { th, pt, fl };
  // the hand's x is fixed; at a = 30 the shoulder is at xSh
  pt.set({ aN: 30 }); put(pt.g, { x: 0, y: y0 }); const W0 = onStage(pt, 'WN'), S0 = onStage(pt, 'Sh'), HX = xSh + (W0[0] - S0[0]);
  plant(th, 'AN', xSh - 10, GY);
  r.set = (a, act = 0) => {
    pt.set({ aN: a, eN: 6 });
    const W = onStage(pt, 'WN'), s0 = st(pt.g); put(pt.g, { x: s0.x + HX - W[0], y: y0 }); pt.set({});
    fl.act(act);
  };
  holdHand(th, 'N', pt, () => onStage(pt, 'WN'));
  holdHand(th, 'F', pt, () => { const [x, y] = onStage(pt, 'Sh'); return [x + 4, y - 18]; });
  r.set(30);
  if (t0 !== null) { show(th.g, t0); show(pt.g, t0); }
  return r;
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Силовые упражнения в воде', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 9 · Урок 99', { x: 800, y: 130, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'Силовые упражнения в воде', { x: 800, y: 215, size: 56, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'ручное сопротивление · стабилизация туловища · самостоятельно', 800, 300, m('sub'), { size: 28, fill: AQ, anchor: 'middle', weight: 600 });
    const art = G(scene, { o: 0 });
    const w = pool(art, 300, 1300, 640, 640 + 182 * 1.05 + 40, null, { rim: 40 });
    w.wave(.3, D, 4);
    const r = flexRig(w, 640, 640 + 182 * 1.05 + 40, 640, null);
    put(r.th.g, { o: 1 }); put(r.pt.g, { o: 1 });
    prog(q => { const k = cyc(q, 1.3); r.set(lerp(30, 150, k), .8); }, .3, Math.max(3, D - .3), lin);
    show(art, .3);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);
  }],

  ['why', 'Почему раньше, чем на суше', (m, D) => {
    const p = panel(0);
    txt(p, 'силовые упражнения в воде', 800, 56, m('why'), { size: 28, weight: 700, anchor: 'middle', fill: AQ });
    pillRow(p, ['сжатие суставов ↓', 'сопротивление в 3D', 'боль приглушена'], 800, 104, m('why', .5), { col: COL.good, size: 21, gap: .8 });
    txt(p, '→ можно начать раньше, чем на суше', 800, 150, m('why', 3), { size: 22, weight: 700, fill: COL.good, anchor: 'middle' });
    // the buoyed arm: the shoulder girdle works differently
    const w = pool(p, 60, 640, 440, 820, m('mech'), { rim: 30 });
    const f = fig(w.mid, { s: 1.15, o: 0, pose: { ...STAND, aN: 70, eN: 6 } }); plant(f, 'AN', 300, 820); show(f.g, m('mech'));
    const up = fArrow(p, 0, 0, 0, -70, BUOY_C); put(up, { o: 0 }); show(up, m('mech'));
    prog(q => { const [x, y] = onStage(f, 'EN'); up.set(x + 14, y + 4, 0, -64); }, m('mech'), .1, lin);
    txt(p, 'плавучесть поддерживает руку →', 350, 250, m('mech'), { size: 20, weight: 700, fill: BUOY_C, anchor: 'middle' });
    txt(p, 'иная нагрузка на плечевой пояс', 350, 280, m('mech'), { size: 20, weight: 700, fill: COL.chalk, anchor: 'middle' });
    txt(p, 'обычно — по пояс; механические — и на глубине', 350, 860, m('depth'), { size: 19, fill: COL.chalk, anchor: 'middle' });
    // closed-chain leg work: deeper → less load
    const GY = 820, S = .6;
    [[820, 'по грудь', IMM.xiph, 60], [1080, 'по бёдра', 0, 100], [1340, 'по колено', -100, 140]].forEach(([x, lab, lv, h], i) => {
      const t0 = m('inv', .4 + i * .5), H = GY - 182 * S;
      const w2 = pool(p, x - 100, x + 100, H - lv * S, GY, t0, { rim: Math.max(20, H - lv * S - 500) });
      const g2 = fig(w2.mid, { s: S, o: 0 }); plant(g2, 'AN', x, GY); show(g2.g, t0);
      repeatPose(g2, { ...SQUAT, t: 20, aN: 90, aF: 90 }, t0 + .6, Math.max(2, D - t0 - .6), Math.max(1, Math.round((D - t0) / 2.4)), ['AN', x, GY]);
      txt(p, lab, x, GY + 34, t0, { size: 20, weight: 700, fill: COL.chalk, anchor: 'middle' });
      const bar = G(p, { o: 0 }); mk('rect', { x: x - 26, y: 470 - h, width: 52, height: h, rx: 6, fill: mix(ACT, COL.board, .35), stroke: ACT, 'stroke-width': 2 }, bar); show(bar, t0 + .4);
    });
    txt(p, 'нагрузка на ноги в замкнутой цепи', 1080, 260, m('inv'), { size: 21, weight: 700, fill: ACT, anchor: 'middle' });
    txt(p, 'обратно пропорциональна глубине', 1080, 290, m('inv'), { size: 21, weight: 700, fill: COL.chalk, anchor: 'middle' });
    pill(p, 'схема', 1440, 230, m('inv'), { col: COL.dim, size: 17 });
  }],

  ['manual', 'Ручное сопротивление', (m, D) => {
    const p = panel(0);
    txt(p, 'ручное сопротивление: замкнутая цепь', 800, 56, m('manual'), { size: 28, weight: 700, anchor: 'middle', fill: AQ });
    txt(p, 'концентрическое; терапевт фиксирует дистальный сегмент — движется тело пациента', 800, 98, m('manual', 1), { size: 20, fill: COL.dim, anchor: 'middle' });
    // shoulder abduction from above: the elbow is held, the body glides away
    const tp = poolTop(p, 60, 130, 900, 560, m('body'));
    const f = flatFig(tp.mid, 0, 0, .55, null); floatsTop(f); f.face(true); put(f.g, { o: 1 });
    const C = [700, 340], k = .55;
    const thG = G(tp.top, { s: .62 }), th = therapistTop(thG, null); put(th, { o: 1 });
    const cG = contact(tp.top), cR = contact(tp.top); cG.setAttribute('fill', GUIDE); cR.setAttribute('fill', RES);
    put(cG, { o: 0 }); put(cR, { o: 0 }); show(cG, m('hands')); show(cR, m('hands', 1));
    const drg = fArrow(tp.top, 0, 0, 0, 0, DRAG_C, { w: 6 }); put(drg, { o: 0 }); show(drg, m('drag'));
    const delt = mk('path', { stroke: ACT, 'stroke-width': 9, 'stroke-linecap': 'round', fill: 'none', 'stroke-opacity': 0 }, tp.top);
    const setF = (th0, dth) => {
      f.arm(th0);
      const E = f.pts.E;
      put(f.g, { x: C[0] - E[0] * k, y: C[1] - E[1] * k });
      const Pp = stg(f, mixPt(f.S, E, .35)), Pd = stg(f, mixPt(f.S, E, .9));
      cG.at(Pp, false, 0); cR.at([Pd[0] + 10, Pd[1]], false, 0);
      const ks = 1 / .62; th.set([(C[0] + 112) * ks, (C[1] + 34) * ks], [Pp[0] * ks, Pp[1] * ks], [(Pd[0] + 10) * ks, Pd[1] * ks]);
      const hip = stg(f, [0, -60]); drg.set(hip[0] + 60 * Math.sign(dth), hip[1], 70 * Math.sign(dth), 0); put(drg, { o: Math.abs(dth) > .2 ? 1 : 0 });
      const a0 = stg(f, [70, -176]), a1 = stg(f, mixPt(f.S, E, .55));
      delt.setAttribute('d', `M${a0[0].toFixed(1)} ${a0[1].toFixed(1)}L${a1[0].toFixed(1)} ${a1[1].toFixed(1)}`);
      delt.setAttribute('stroke-opacity', dth > .2 ? .85 : 0);
    };
    setF(12, 0);
    const T0 = m('body', .5), ang = T => T < T0 ? 12 : lerp(12, 80, cyc((T - T0) / 4, 1));
    prog(q => { const T = q * D, a = ang(T), da = ang(T + .05) - ang(T - .05); setF(a, da); }, 0, D, lin);
    txt(p, 'отведение плеча: локоть держат — тело уходит от терапевта', 510, 740, m('body'), { size: 20, weight: 700, fill: AWAY, anchor: 'middle' });
    txt(p, 'стрелка — сопротивление воды телу пациента', 510, 772, m('drag'), { size: 19, fill: DRAG_C, anchor: 'middle' });
    txt(p, 'работают отводящие мышцы плеча', 510, 804, m('body', 2), { size: 19, weight: 700, fill: ACT, anchor: 'middle' });
    NOTE(p, 510, 840, m('body', 2));
    infoCard(p, 1000, 130, 550, 150, 'ноги — над, руки — от', 'тело проходит над зафиксированным сегментом ноги или уходит от сегмента руки', AQ, m('body'), { size: 20 });
    infoCard(p, 1000, 295, 550, 90, 'подсказки голосом: «сокращай» — «расслабься»', null, COL.good, m('cue'), { size: 20 });
    infoCard(p, 1000, 400, 550, 210, 'лёжа на спине — нельзя', 'эксцентрика и ритмическая стабилизация: тело наклоняется и вращается, мало силы и трения; горизонтальное приведение и отведение плеча — избегать', COL.bad, m('limit'), { size: 19 });
    infoCard(p, 1000, 625, 550, 220, 'руки терапевта', 'направляющая — на той же стороне, проксимальнее; сопротивления — противоположная, дистально; дистальнее → больше сопротивление', RES, m('hands'), { size: 20 });
  }],

  ['ue', 'Руки', (m, D) => {
    const p = panel(0);
    txt(p, 'ручное сопротивление: руки', 800, 56, m('ue'), { size: 28, weight: 700, anchor: 'middle', fill: AQ });
    const SY = 430, GY = SY + 182 * 1.05 + 40, w = pool(p, 60, 1000, SY, GY, m('ue'), { rim: 40 });
    w.wave(m('ue'), Math.max(3, D - m('ue')), 3);
    const r = flexRig(w, SY, GY, 380, m('ue'));
    const T1 = m('flex'), T2 = m('ext');
    prog(q => { const T = q * D; if (T < T1) r.set(30); else if (T < T2) r.set(lerp(30, 150, io(clamp((T - T1) / 2.6, 0, 1))), .85); else r.set(lerp(150, 40, io(clamp((T - T2) / 2.6, 0, 1))), 0); }, 0, D, lin);
    const aw = G(p, { o: 0 }); fArrow(aw, 560, 520, 200, 0, AWAY, { w: 6 }); T(aw, 'сгибание → тело от терапевта', { x: 560, y: 560, size: 20, weight: 700, fill: AWAY }); show(aw, m('flex')); hide(aw, m('ext'));
    const tw0 = G(p, { o: 0 }); fArrow(tw0, 760, 520, -200, 0, TOWARD, { w: 6 }); T(tw0, 'разгибание → тело к терапевту', { x: 560, y: 560, size: 20, weight: 700, fill: TOWARD }); show(tw0, m('ext'));
    txt(p, 'направляющая рука — на акромиально-ключичном суставе,', 690, 150, m('ue', 2), { size: 19, fill: COL.chalk, anchor: 'middle' });
    txt(p, 'рука сопротивления — на нижней части предплечья', 690, 178, m('ue', 2), { size: 19, fill: COL.chalk, anchor: 'middle' });
    txt(p, 'нужно активное сгибание ≥ 120°', 690, 222, m('ext', 2), { size: 20, weight: 700, fill: COL.task, anchor: 'middle' });
    txt(p, 'работают сгибатели плеча', 690, 262, m('flex', .5), { size: 19, weight: 700, fill: ACT, anchor: 'middle' });
    NOTE(p, 690, 296, m('flex', .5));
    const row = (y, t0, name, a, b) => { const g = G(p, { o: 0 }); roundBox(g, 1030, y, 520, 128, EDGE, PANEL, 2); T(g, name, { x: 1052, y: y + 38, size: 22, weight: 700, fill: COL.chalk }); if (a) T(g, a, { x: 1052, y: y + 72, size: 19, weight: 700, fill: a.includes('от') ? AWAY : TOWARD }); if (b) T(g, b, { x: 1052, y: y + 104, size: 19, weight: 700, fill: b.includes('от') ? AWAY : TOWARD }); show(g, t0); };
    row(110, m('abd'), 'отведение', 'тело уходит от руки и от терапевта');
    row(250, m('rot'), 'ротации (локоть 90°)', 'внутренняя → к поражённой руке', 'наружная → от поражённой руки');
    row(390, m('diag'), 'D1, D2 одной руки', 'сгибание → от терапевта', 'D2 разгибание → к терапевту');
    row(530, m('diag', 3), 'D2 обеих рук (терапевт у головы)', 'сгибание → от терапевта', 'разгибание → к терапевту');
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-glide', prompt: ['Конечность зафиксирована. Куда скользит тело пациента?'],
    build: grid([
      { parts: ['Сгибание плеча против руки терапевта'], ans: ['a'], why: 'Сгибание уводит тело от терапевта.' },
      { parts: ['Разгибание плеча из согнутого положения'], ans: ['t'], why: 'Разгибание возвращает тело к терапевту.' },
      { parts: ['Отведение бедра'], ans: ['a'], why: 'Тело скользит от поражённой ноги и от терапевта.' },
      { parts: ['Приведение бедра'], ans: ['t'], why: 'Тело скользит к поражённой ноге и к терапевту.' },
      { parts: ['Сгибание бедра и колена (стопа зафиксирована)'], ans: ['t'], why: 'Тело скользит к терапевту и к зафиксированной стопе.' },
    ], [['t', 'К терапевту', TOWARD], ['a', 'От терапевта', AWAY]], { multi: false, text: true }),
  }], done) }],

  ['le', 'Ноги', (m, D) => {
    const p = panel(0);
    txt(p, 'ручное сопротивление: ноги', 800, 56, m('le'), { size: 28, weight: 700, anchor: 'middle', fill: AQ });
    // hip abduction and adduction from above: the leg is held, the body glides
    const tp = poolTop(p, 60, 100, 700, 430, m('add'));
    const f = flatFig(tp.mid, 0, 0, .45, null); floatsTop(f); f.face(true); put(f.g, { o: 1 });
    const C = [560, 400], k = .45;
    const thG = G(tp.top, { s: .66 }), th = therapistTop(thG, null); put(th, { o: 1 });
    const cG = contact(tp.top), cR = contact(tp.top); cG.setAttribute('fill', GUIDE); cR.setAttribute('fill', RES);
    const lbl = txt(p, '', 410, 570, m('add'), { size: 20, weight: 700, fill: AWAY, anchor: 'middle' });
    const setL = (a, da) => {
      f.leg(a);
      const P = mixPt(f.pts.K, f.pts.A, .75);
      put(f.g, { x: C[0] - P[0] * k, y: C[1] - P[1] * k });
      const R0 = stg(f, P), G0 = stg(f, [0, -50]);
      cR.at([R0[0] + 8, R0[1]], false, 90); cG.at([G0[0] + 40, G0[1]], false, 90);
      const ks = 1 / .66; th.set([(R0[0] + 120) * ks, (R0[1] - 70) * ks], [(R0[0] + 8) * ks, R0[1] * ks], [(G0[0] + 40) * ks, G0[1] * ks]);
      lbl.textContent = da > .2 ? 'отведение → тело от терапевта' : da < -.2 ? 'приведение → тело к терапевту' : '';
      lbl.setAttribute('fill', da > 0 ? AWAY : TOWARD);
    };
    setL(3, 0);
    const T0 = m('add', .5), ang = T => T < T0 ? 3 : lerp(3, 32, cyc((T - T0) / 5, 1));
    prog(q => { const T = q * D, a = ang(T), da = ang(T + .05) - ang(T - .05); setL(a, da); }, 0, D, lin);
    // hip and knee flexion, side view: the foot is held, the body glides toward it
    const SY = 640, GY = SY + 182 + 30, w = pool(p, 800, 1540, SY, GY, m('flex'), { rim: 40 });
    const pt = floater(w.mid, 1000, SY, .8, null, {}, { collar: true, belt: true });
    const thS = therapist(w.mid, 1, { t: 10 }); plant(thS, 'AN', 1440, GY);
    w.mid.insertBefore(thS.g, pt.g);

      put(para(g, str, 260, 0, null, { size: 30, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-res', prompt: ['Ручное сопротивление разгибанию колена в воде. Как увеличить сопротивление, не меняя упражнение?'],
    build: choice([
      ['Положить руку сопротивления дистальнее на сокращающемся сегменте'],
      ['Сделать упражнение эксцентрическим лёжа на спине'],
      ['Убрать подсказки голосом'],
      ['Положить направляющую руку дистально, а руку сопротивления — проксимально'],
    ], 0, 'Чем дистальнее рука сопротивления, тем больше общее сопротивление.',
    [null, 'Лёжа на спине эксцентрику толком не стабилизировать: тело наклоняется и вращается.', 'Подсказки обязательны: они синхронизируют пациента и терапевта.', 'Наоборот: направляющая — проксимальнее, сопротивления — дистально.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-trunk', prompt: ['Пациент с болью в пояснице хорошо держит нейтральный позвоночник, пока терапевт за плечи медленно ведёт его из стороны в сторону. Как усложнить?'],
    build: choice([
      ['Вести быстрее или держать дистальнее — за стопы'],
      ['Держать ближе к центру тела и медленнее'],
      ['Разрешить боковой изгиб туловища'],
      ['Перейти от одной конечности к двум в многонаправленном варианте'],
    ], 0, 'Быстрее — больше лобовое сопротивление; дистальнее хват — больше интенсивность.',
    [null, 'Так интенсивность снизится.', 'Боковой изгиб — признак, что стабилизация потеряна.', 'Две конечности нагружают меньше, чем одна.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
