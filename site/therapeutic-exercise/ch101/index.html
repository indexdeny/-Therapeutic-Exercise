'use strict';
const CHAPTER = { number: 101, title: 'Повреждения мягких тканей и их тяжесть', minutes: 10, language: 'ru', next: '../ch102/' };
// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch101/cards.ru.json
const CARDS_SHORT = {
  "растяжение мышцы\nперерастяжение, перенапряжение или перегрузка мягкой ткани": "перерастяжение мягкой ткани",
  "обычно легче, чем растяжение связки\nнебольшая травма или непривычные повторяющиеся мелкие нагрузки; чаще — частичное нарушение мышечно-сухожильной единицы": "частичное нарушение единицы",
  "растяжение связки\nсильная нагрузка, растяжение или разрыв: капсула, связка, сухожилие или мышца; чаще — травма связки": "капсула, связка, сухожилие",
  "подвывих\nнеполный, частичный вывих; часто тоже со вторичной травмой окружающих мягких тканей": "неполный вывих",
  "частичный разрыв\nболь в месте разрыва — при растяжении мышцы и при сокращении против сопротивления": "боль при растяжении и сокращении",
  "полный разрыв\nмышца не тянет за место повреждения: ни растяжение, ни сокращение не болят": "ни растяжение, ни сокращение не болят",
  "теносиновит\nвоспаление синовиальной оболочки, покрывающей сухожилие": "синовиальная оболочка сухожилия",
  "тендинит\nвоспаление самого сухожилия; могут остаться рубцы или отложения кальция": "воспаление сухожилия",
  "тендовагинит\nвоспаление с утолщением влагалища сухожилия": "воспаление с утолщением влагалища сухожилия",
  "тендиноз\nдегенерация сухожилия из-за повторяющейся микротравмы": "дегенерация от микротравмы",
  "синовит (synovitis)\nвоспаление синовиальной оболочки: лишняя синовиальная жидкость в суставе или во влагалище сухожилия — травма или болезнь": "лишняя синовиальная жидкость",
  "гемартроз (hemarthrosis)\nкровоизлияние в сустав, обычно после тяжёлой травмы": "кровоизлияние в сустав",
  "ганглий (ganglion)\nвыпячивание стенки суставной капсулы или влагалища сухожилия — как воздушный шарик": "выпячивание капсулы — как шарик",
  "бурсит (bursitis)\nвоспаление синовиальной сумки": "воспаление синовиальной сумки",
  "ушиб (contusion)\nпрямой удар: рвутся капилляры → кровоизлияние, отёк, воспалительный ответ": "прямой удар → кровоизлияние, отёк",
  "синдромы перегрузки\nперегрузка, кумулятивная травма, повторяющееся напряжение: повторяющаяся субмаксимальная перегрузка или трение мышцы или сухожилия → воспаление и боль": "повторяющаяся перегрузка → воспаление",
  "собственный мышечный спазм\nдлительное сокращение в ответ на местные изменения кровообращения и обмена в долго сокращённой мышце": "местные изменения кровообращения",
  "миофасциальный компартмент-синдром\nдавление растёт в замкнутом нерастяжимом футляре → сосуды, мышцы, нервы страдают → ишемия и необратимая гибель мышцы": "давление в футляре → ишемия",
  "I степень\nлёгкая боль в момент травмы или в первые 24 часа; небольшой отёк, местная болезненность; боль при нагрузке на ткань": "лёгкая боль, небольшой отёк",
  "II степень\nсредняя боль — занятие приходится прекратить; нагрузка и пальпация резко усиливают боль. Связка: часть волокон порвана → подвижность сустава немного больше": "средняя боль, занятие прекратить",

// cards-short end

const HEAD = COL.nat, PAIN = '#ff5a3c', LIGC = ANAT.tendon;
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
// A red star of pain at (x, y); set(k): 0 hidden … 1 full size.
function painMark(p, x, y, r = 22) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r: r * 1.6, fill: PAIN, 'fill-opacity': .2 }, g);
  let d = '';
  for (let i = 0; i < 16; i++) { const a = i / 16 * 2 * Math.PI, rr = i % 2 ? r * .45 : r; d += `${i ? 'L' : 'M'}${(rr * Math.cos(a)).toFixed(1)} ${(rr * Math.sin(a)).toFixed(1)}`; }
  mk('path', { d: d + 'Z', fill: PAIN, stroke: '#ffd2c4', 'stroke-width': 2 }, g);
  const pm = { g, x, y };
  pm.at = (X, Y) => { pm.x = X; pm.y = Y; return pm; };
  pm.set = k => put(g, { x: pm.x, y: pm.y, o: clamp(k * 1.6, 0, 1), s: .35 + .65 * clamp(k, 0, 1) });
  return pm;
}

// A joint from the side with a ligament of eight fibres on its right: the upper bone is fixed, the lower one turns about
// the far (left) edge of its plateau, so the gap opens on the ligament side. set({ open, torn }): open in degrees;
// torn 0..1 — share of fibres torn (two frayed stubs each). lm.lowAt(P): a point of the lower bone (pivot frame) in the
// model frame; lm.stage(P): model frame → parent.
function ligModel(p, x, y, s, t0) {
  const g = G(p, { x, y, s, o: 0 }), defs = mk('defs', {}, g), B = ANAT.bone, line = mix(B, '#000000', .5), f = v => v.toFixed(1);
  const PV = [-74, 10], low = G(g, { x: PV[0], y: PV[1] });
  limbEl(low, defs, B, 62, 34, line).set([74, 36], [74, 250]);
  mk('rect', { x: 0, y: -4, width: 148, height: 36, rx: 12, fill: B, stroke: line, 'stroke-width': 2 }, low);
  path(low, 'M8 -4H140', { stroke: CART, 'stroke-width': 6 });
  limbEl(g, defs, B, 44, 36, line).set([0, -60], [0, -270]);
  const cg = mk('radialGradient', { id: 'lm' + (++SHADE_ID), cx: .38, cy: .3, r: .8 }, defs);
  [[0, mix(B, '#ffffff', .5)], [.55, B], [1, mix(B, '#000000', .4)]].forEach(([o, c]) => mk('stop', { offset: o, 'stop-color': c }, cg));
  mk('ellipse', { cx: 0, cy: -36, rx: 80, ry: 40, fill: `url(#${cg.id})`, stroke: line, 'stroke-width': 2 }, g);
  path(g, 'M-70 -16.6A80 40 0 0 0 70 -16.6', { stroke: CART, 'stroke-width': 6 });
  const N = 8, ORDER = [3, 6, 1, 5, 0, 7, 2, 4];
  const fibs = Array.from({ length: N }, (_, i) => {
    const u = [62 + i * 4, -60 + i * 2.4], l = [124 + i * 4.2, 50 + i * 4.5];
    const fg = G(g, {}), L0 = Math.hypot(PV[0] + l[0] - u[0], PV[1] + l[1] - u[1]);
    const le = ligEl(fg, { rest: L0 * 1.03, w: 4.2 });
    const sg = G(g, { o: 0 }), s1 = path(sg, '', { stroke: mix(LIGC, PAIN, .45), 'stroke-width': 4.5 }), s2 = path(sg, '', { stroke: mix(LIGC, PAIN, .45), 'stroke-width': 4.5 });
    return { u, l, fg, le, sg, s1, s2, rank: ORDER.indexOf(i) };
  });
  const lm = { g, st: { open: 0, torn: 0 } };
  lm.lowAt = P => { const [a, b] = rotPt(P[0], P[1], lm.st.open); return [PV[0] + a, PV[1] + b]; };
  lm.stage = P => [x + P[0] * s, y + P[1] * s];
  const stub = (e, A, Bp, k) => {
    const dx = Bp[0] - A[0], dy = Bp[1] - A[1], E = [A[0] + dx * k, A[1] + dy * k], n = [-dy * .12, dx * .12];
    e.setAttribute('d', `M${f(A[0])} ${f(A[1])}Q${f(A[0] + dx * k * .5 + n[0])} ${f(A[1] + dy * k * .5 + n[1])} ${f(E[0])} ${f(E[1])}l${f(n[0] * .5 - 4)} ${f(n[1] * .5 + 5)}M${f(E[0])} ${f(E[1])}l${f(-n[0] * .5 + 5)} ${f(-n[1] * .5 + 4)}`);
  };
  lm.set = o => {
    const S = Object.assign(lm.st, o);
    put(low, { x: PV[0], y: PV[1], r: S.open });
    fibs.forEach(F => {
      const L = lm.lowAt(F.l), torn = F.rank < Math.round(S.torn * N);
      put(F.fg, { o: torn ? 0 : 1 }); put(F.sg, { o: torn ? 1 : 0 });
      if (torn) { stub(F.s1, F.u, L, .38); stub(F.s2, L, F.u, .34); } else F.le.set(F.u, L);
    });
    return lm;
  };
  lm.set({});
  if (t0 !== null) show(g, t0);
  return lm;
}

// A muscle–tendon unit between two bones (side view). The left bone is fixed at x0; the right one sits at x1 + d.
// set({ d, act, notch, full }): d — the right bone moves right (stretch); act 0..1 — contraction; notch 0..1 — a partial
// tear; full 0..1 — a complete tear: the belly parts and both ends retract. u.tear — stage point of the tear site.
function mtu(p, x0, x1, y, t0, { w = 30 } = {}) {
  const g = G(p, { o: 0 }), defs = mk('defs', {}, g), B = ANAT.bone, line = mix(B, '#000000', .5), f = v => v.toFixed(1);
  const bA = limbEl(g, defs, B, 22, 22, line), bB = limbEl(g, defs, B, 22, 22, line);
  bA.set([x0, y - 90], [x0, y + 90]);
  const O = [x0 + 22, y], rest = x1 - x0 - 44, TX = O[0] + rest * .66;
  const m0 = muscleEl(g, { rest, w, tendon: .16 });
  const mA = muscleEl(g, { rest: (TX - O[0]) * .98, w: w * .95, tendon: .22 }), mB = muscleEl(g, { rest: rest * .34, w: w * .8, tendon: .34 });
  const notch = path(g, '', { stroke: PAIN, 'stroke-width': 4, 'stroke-linejoin': 'round' });
  const rag = path(g, '', { stroke: PAIN, 'stroke-width': 3.5, 'stroke-linejoin': 'round' });
  const u = { g, st: { d: 0, act: 0, notch: 0, full: 0 }, tear: [TX, y - w * .5], m0, mA };
  u.set = o => {
    const S = Object.assign(u.st, o), XB = x1 + S.d, I = [XB - 22, y];
    bB.set([XB, y - 90], [XB, y + 90]);
    const whole = S.full < .01;
    put(m0.g, { o: whole ? 1 : 0 }); put(mA.g, { o: whole ? 0 : 1 }); put(mB.g, { o: whole ? 0 : 1 });
    if (whole) {
      m0.act(S.act); m0.set(O, I);
      const tx = O[0] + (I[0] - O[0]) * .66, hh = w * .9;
      notch.setAttribute('d', `M${f(tx - 6)} ${f(y - hh * 1.1)}L${f(tx + 5)} ${f(y - hh * .75)}L${f(tx - 5)} ${f(y - hh * .4)}L${f(tx + 6)} ${f(y - hh * .05)}`);
      notch.setAttribute('opacity', S.notch.toFixed(2)); rag.setAttribute('d', '');
      u.tear = [tx, y - hh * .6];
    } else {
      const EA = [TX - 8 - 46 * S.full - 34 * S.act, y], EB = [TX + 8 + 30 * S.full + S.d, y];
      mA.act(S.act); mA.set(O, EA); mB.set(EB, I);
      notch.setAttribute('opacity', 0);
      rag.setAttribute('d', [EA, EB].map(([X, Y], k) => { const sg = k ? -1 : 1; return `M${f(X)} ${f(Y - 18)}l${8 * sg} 7l${-6 * sg} 6l${8 * sg} 6l${-6 * sg} 6l${8 * sg} 6`; }).join(''));
      u.tear = [(EA[0] + EB[0]) / 2, y - 30];
    }
    return u;
  };
  u.set({});
  if (t0 !== null) show(g, t0);
  return u;
}

// A ball-and-socket joint from the front: the socket on the left, the head with its shaft on the right; the capsule has an
// upper and a lower band. set({ k, torn }): k 0 — in place, ≈ .45 — subluxation, 1 — dislocation; torn breaks the lower band.
function ballJoint(p, x, y, s, t0) {
  const g = G(p, { x, y, s, o: 0 }), defs = mk('defs', {}, g), B = ANAT.bone, line = mix(B, '#000000', .5), f = v => v.toFixed(1);
  const sg = mk('linearGradient', { id: 'bj' + (++SHADE_ID), x1: 0, y1: 0, x2: 1, y2: 0 }, defs);
  [[0, mix(B, '#000000', .35)], [1, mix(B, '#ffffff', .25)]].forEach(([o, c]) => mk('stop', { offset: o, 'stop-color': c }, sg));
  mk('path', { d: 'M-230 -200L-40 -128L-40 -54A67 67 0 0 0 -40 54L-40 128L-230 200Z', fill: `url(#${sg.id})`, stroke: line, 'stroke-width': 2 }, g);
  path(g, 'M-40 -54A67 67 0 0 0 -40 54', { stroke: CART, 'stroke-width': 7 });
  const shaft = limbEl(g, defs, B, 34, 27, line);
  const hg = mk('radialGradient', { id: 'bh' + (++SHADE_ID), cx: .38, cy: .32, r: .8 }, defs);
  [[0, mix(B, '#ffffff', .5)], [.6, B], [1, mix(B, '#000000', .4)]].forEach(([o, c]) => mk('stop', { offset: o, 'stop-color': c }, hg));
  const head = mk('circle', { r: 58, fill: `url(#${hg.id})`, stroke: line, 'stroke-width': 2 }, g);
  const hc = mk('path', { fill: 'none', stroke: CART, 'stroke-width': 6 }, g);
  const HP = k => [-6 + 52 * k, 150 * k];
  const UP0 = [-58, -134], LO0 = [-58, 134], up = k => { const H = HP(k); return [H[0] + 46, H[1] - 40]; }, lo = k => { const H = HP(k); return [H[0] + 14, H[1] + 56]; };
  const bandU = ligEl(g, { rest: Math.hypot(up(0)[0] - UP0[0], up(0)[1] - UP0[1]) * 1.05, w: 6 });
  const loG = G(g, {}), bandL = ligEl(loG, { rest: Math.hypot(lo(0)[0] - LO0[0], lo(0)[1] - LO0[1]) * 1.05, w: 6 });
  const tornG = G(g, { o: 0 }), t1 = path(tornG, '', { stroke: mix(LIGC, PAIN, .45), 'stroke-width': 5 }), t2 = path(tornG, '', { stroke: mix(LIGC, PAIN, .45), 'stroke-width': 5 });
  const bj = { g, st: { k: 0, torn: 0 }, headAt: () => HP(bj.st.k), stage: P => [x + P[0] * s, y + P[1] * s] };
  bj.set = o => {
    const S = Object.assign(bj.st, o), H = HP(S.k);
    shaft.set([H[0] + 28, H[1] + 36], [H[0] + 120, H[1] + 300]);
    head.setAttribute('cx', f(H[0])); head.setAttribute('cy', f(H[1]));
    hc.setAttribute('d', `M${f(H[0] - 30)} ${f(H[1] - 50)}A58 58 0 0 0 ${f(H[0] - 30)} ${f(H[1] + 50)}`);
    bandU.set(UP0, up(S.k));
    const L = lo(S.k);
    put(loG, { o: S.torn > .5 ? 0 : 1 }); put(tornG, { o: S.torn > .5 ? 1 : 0 });
    if (S.torn > .5) {
      t1.setAttribute('d', `M${LO0[0]} ${LO0[1]}q14 22 30 16l6 9`);
      t2.setAttribute('d', `M${f(L[0])} ${f(L[1])}q-20 -4 -26 12l-8 4`);
    } else bandL.set(LO0, L);
    return bj;
  };
  bj.set({});
  if (t0 !== null) show(g, t0);
  return bj;
}

// A synovial joint in section (schematic): two bone ends with cartilage, the capsule with its synovial lining and the joint
// fluid; a tendon runs down the right side over a bursa; skin on both sides. set({ … }) 0..1: syn — synovitis (more fluid,
// thick red lining); blood — the fluid turns to blood; gang — a ganglion balloons out of the capsule on the left; burs — the
// bursa swells and reddens; bruise — bleeding and swelling under the skin on the left; glide — the tendon slides (px).
function synJoint(p, x, y, s, t0) {
  const g = G(p, { x, y, s, o: 0 }), defs = mk('defs', {}, g), B = ANAT.bone, line = mix(B, '#000000', .5), f = v => v.toFixed(1);
  const skinF = mk('path', { fill: '#2c3c37' }, g), skin = mk('path', { fill: 'none', stroke: '#c9b9a6', 'stroke-width': 4 }, g);
  const bruise = G(g, { o: 0 }), spots = [];
  for (let i = 0; i < 16; i++) spots.push({ e: mk('circle', { r: 4 + (i % 4) * 2.2, fill: i % 3 ? '#8f2c3a' : '#5a2a5e', 'fill-opacity': .75 }, bruise), a: i * 2.4, k: (i % 5) / 5 });
  const fluid = mk('path', {}, g), lining = mk('path', { fill: 'none', 'stroke-linejoin': 'round' }, g), caps = mk('path', { fill: 'none', stroke: LIGC, 'stroke-width': 5, 'stroke-linejoin': 'round' }, g);
  const gang = G(g, {}), gStalk = path(gang, '', { stroke: LIGC, 'stroke-width': 5 }), gBall = mk('circle', { fill: FLUID, 'fill-opacity': .45, stroke: LIGC, 'stroke-width': 4 }, gang);
  limbEl(g, defs, B, 50, 42, line).set([0, -80], [0, -262]);
  limbEl(g, defs, B, 48, 42, line).set([0, 70], [0, 262]);
  const eg = mk('radialGradient', { id: 'sj' + (++SHADE_ID), cx: .38, cy: .3, r: .8 }, defs);
  [[0, mix(B, '#ffffff', .5)], [.55, B], [1, mix(B, '#000000', .4)]].forEach(([o, c]) => mk('stop', { offset: o, 'stop-color': c }, eg));
  mk('ellipse', { cx: 0, cy: -44, rx: 74, ry: 40, fill: `url(#${eg.id})`, stroke: line, 'stroke-width': 2 }, g);
  mk('ellipse', { cx: 0, cy: 46, rx: 74, ry: 32, fill: `url(#${eg.id})`, stroke: line, 'stroke-width': 2 }, g);
  path(g, 'M-64 -24A74 40 0 0 0 64 -24', { stroke: CART, 'stroke-width': 6 });
  path(g, 'M-64 30A74 32 0 0 1 64 30', { stroke: CART, 'stroke-width': 6 });
  const burs = mk('ellipse', { cx: 84, cy: 170 }, g);
  const tend = mk('path', { d: 'M150 -300C152 -100 146 60 116 300', fill: 'none', stroke: LIGC, 'stroke-width': 30, 'stroke-linecap': 'butt' }, g);
  const tfib = mk('path', { d: 'M150 -300C152 -100 146 60 116 300', fill: 'none', stroke: mix(LIGC, '#000000', .35), 'stroke-width': 2.5, 'stroke-dasharray': '22 10' }, g);
  const sj = { g, st: { syn: 0, blood: 0, gang: 0, burs: 0, bruise: 0, glide: 0 }, stage: P => [x + P[0] * s, y + P[1] * s] };
  const side = (k, b) => `${f(54 * k)} -100C${f((100 + b) * k)} -96 ${f((106 + b) * k)} -40 ${f((104 + b) * k)} 0S${f((100 + b) * k)} 96 ${f(52 * k)} 100`;
  sj.set = o => {
    const S = Object.assign(sj.st, o), b = 26 * S.syn;
    const sk = 20 * S.bruise;
    const lft = `M-175 -300C-175 -200 ${f(-180 - sk)} -170 ${f(-178 - sk)} -130S-172 -40 -172 0S-170 200 -168 300`;
    skinF.setAttribute('d', `${lft}H200C204 200 210 0 204 -300Z`);
    skin.setAttribute('d', `${lft}M200 300C204 200 210 0 204 -300`);
    spots.forEach(sp => { const r = 8 + 52 * S.bruise * (.4 + .6 * sp.k); put(sp.e, { x: -140 + r * Math.cos(sp.a) * .55, y: -130 + r * Math.sin(sp.a) }); });
    put(bruise, { o: S.bruise });
    fluid.setAttribute('d', `M${side(-1, b)}L52 100C${f(100 + b)} 96 ${f(106 + b)} 40 ${f(104 + b)} 0S${f(100 + b)} -96 54 -100Z`);
    fluid.setAttribute('fill', mix(FLUID, '#b3262b', S.blood)); fluid.setAttribute('fill-opacity', (.4 + .4 * S.blood).toFixed(2));
    const both = `M${side(-1, b)}M${side(1, b)}`;
    lining.setAttribute('d', both); lining.setAttribute('stroke', mix(SYNOV_C, PAIN, S.syn * .8)); lining.setAttribute('stroke-width', f(3 + 6 * S.syn));
    caps.setAttribute('d', `M${side(-1, b + 9)}M${side(1, b + 9)}`);
    const gx = -(113 + b), R = 4 + 32 * S.gang;
    gStalk.setAttribute('d', `M${f(gx)} -30L${f(gx - 8 - R * .4)} -44`);

// A schematic cross-section of the lower leg: skin, the deep fascia with its septa, two bones, muscles in closed fascial
// compartments; the front compartment holds an artery, a vein and a nerve. set(k): pressure in that compartment rises —
// the muscle swells against the fascia and darkens, the vessels and the nerve are squeezed.
function legSection(p, cx, cy, s, t0) {
  const g = G(p, { x: cx, y: cy, s, o: 0 }), f = v => v.toFixed(1);
  mk('ellipse', { rx: 168, ry: 140, fill: '#344640', stroke: '#c9b9a6', 'stroke-width': 4 }, g);
  const others = [[4, 90, 98, 28], [12, 44, 58, 22], [118, 2, 24, 42]].map(([x, y, rx, ry]) => mk('ellipse', { cx: x, cy: y, rx, ry, fill: ANAT.muscle, stroke: mix(ANAT.muscle, '#000000', .3), 'stroke-width': 2 }, g));
  const ant = mk('ellipse', { cx: 52, cy: -74 }, g);
  mk('ellipse', { rx: 156, ry: 128, fill: 'none', stroke: '#d6dfd9', 'stroke-width': 3.5 }, g);
  path(g, 'M86 6L120 -86M86 22L132 82M-30 -12C10 18 50 26 86 14', { stroke: '#d6dfd9', 'stroke-width': 3.5 });
  path(g, 'M-24 -40L80 4', { stroke: '#d6dfd9', 'stroke-width': 2.5, 'stroke-dasharray': '6 5' });
  mk('path', { d: 'M-80 -96L-20 -112L-4 -36L-40 -6L-86 -40Z', fill: ANAT.bone, stroke: mix(ANAT.bone, '#000000', .45), 'stroke-width': 2, 'stroke-linejoin': 'round' }, g);
  mk('circle', { cx: 92, cy: 12, r: 17, fill: ANAT.bone, stroke: mix(ANAT.bone, '#000000', .45), 'stroke-width': 2 }, g);
  const art = mk('circle', { cx: 24, cy: -34, fill: BLOOD_A, stroke: COL.board, 'stroke-width': 1.5 }, g);
  const vein = mk('circle', { cx: 42, cy: -30, fill: BLOOD_V, stroke: COL.board, 'stroke-width': 1.5 }, g);
  const nerve = mk('circle', { cx: 32, cy: -50, fill: '#f3d35c', stroke: COL.board, 'stroke-width': 1.5 }, g);
  const arr = G(g, { o: 0 }), arrows = [[-30, -104], [52, -126], [118, -80], [40, -36]].map(([ax, ay]) => fArrow(arr, ax, ay, 0, 0, PAIN, { w: 5, head: 12 }));
  const ls = { g, stage: P => [cx + P[0] * s, cy + P[1] * s] };
  ls.set = k => {
    ant.setAttribute('rx', f(64 + 6 * k)); ant.setAttribute('ry', f(38 + 4 * k));
    ant.setAttribute('fill', mix(ANAT.muscle, '#6c5a78', k * .85)); ant.setAttribute('stroke', mix(mix(ANAT.muscle, '#000000', .3), PAIN, k));
    art.setAttribute('r', f(9 * (1 - .65 * k))); vein.setAttribute('r', f(9 * (1 - .8 * k))); nerve.setAttribute('r', f(7 * (1 - .4 * k)));
    put(arr, { o: k > .05 ? 1 : 0 });
    [[-30, -104, 14, 18], [52, -126, 0, 22], [118, -80, -18, 14], [40, -36, 0, -18]].forEach(([ax, ay, dx, dy], i) => arrows[i].set(ax, ay, dx * k * 1.2, dy * k * 1.2));
    return ls;
  };
  ls.set(0);
  if (t0 !== null) show(g, t0);
  return ls;
}

// A hinge in close-up: bone A from (x, y) to the joint J = (x + len, y); bone B turns at J (deg: + = down, flexion).
// A muscle crosses the joint on the flexion side; a capsule band (rest = capRest × its length at deg0) may limit extension.
function hingeModel(p, x, y, len, t0, { deg0 = 60, capRest = null, mus = true } = {}) {
  const g = G(p, { o: 0 }), defs = mk('defs', {}, g), B = ANAT.bone, line = mix(B, '#000000', .5);
  const J = [x + len, y], bA = limbEl(g, defs, B, 17, 15, line), bB = limbEl(g, defs, B, 15, 13, line);
  bA.set([x, y], [J[0] - 8, y]);
  const dirB = d => [Math.cos(rad(d)), Math.sin(rad(d))], at = (d, k, n) => { const u = dirB(d); return [J[0] + u[0] * k - u[1] * n, J[1] + u[1] * k + u[0] * n]; };
  const capPts = d => [[J[0] - 40, y + 16], at(d, 40, 16)];
  const len0 = d => { const [A, C] = capPts(d); return Math.hypot(C[0] - A[0], C[1] - A[1]); };
  const cap = capRest ? ligEl(g, { rest: len0(deg0) * capRest, w: 5.5 }) : null;
  const musPts = d => [[x + len * .3, y + 18], at(d, len * .45, 20)];
  const mu = mus ? muscleEl(g, { rest: Math.hypot(...[0, 1].map(i => musPts(deg0)[1][i] - musPts(deg0)[0][i])), w: 18 }) : null;
  const jc = mk('circle', { cx: J[0], cy: J[1], r: 11, fill: COL.board, stroke: B, 'stroke-width': 4 }, g);
  const h = { g, J, deg: deg0, cap, mu };
  h.set = d => { h.deg = d; bB.set([J[0] + dirB(d)[0] * 8, J[1] + dirB(d)[1] * 8], at(d, len * .9, 0)); if (cap) cap.set(...capPts(d)); if (mu) mu.set(...musPts(d)); g.appendChild(jc); return h; };
  h.tip = () => at(h.deg, len * .9, 0);
  h.set(deg0);
  if (t0 !== null) show(g, t0);
  return h;
}

// A label at (x, y) with a thin leader line to the point (tx, ty).
function lab(p, str, x, y, tx, ty, col, t0, { size = 19 } = {}) {
  const g = G(p, { o: 0 }), right = tx > x;
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: right ? 'end' : 'start' });
  path(g, `M${x + (right ? 8 : -8)} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}

      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 30, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-tear', prompt: ['Футболист почувствовал боль сзади бедра на рывке. Когда он сгибает колено против сопротивления и когда мышцу растягивают, болит одно и то же место. Что вероятнее?'],
    build: choice([
      ['Частичный разрыв мышцы'],
      ['Полный разрыв мышцы'],
      ['Тендиноз'],
      ['Гемартроз коленного сустава'],
    ], 0, 'При частичном разрыве место повреждения болит и при растяжении, и при сокращении против сопротивления.',
    [null, 'При полном разрыве мышца не тянет за место повреждения — растяжение и сокращение не болят.', 'Тендиноз — дегенерация сухожилия от повторяющейся микротравмы, а здесь острая травма.', 'Гемартроз — кровь в суставе; боль при сокращении и растяжении мышцы его не отличает.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-spasm', prompt: ['Ушиб поясницы почти зажил, но мышцы спины остаются напряжёнными и болят. Как это объяснить?'],
    build: choice([
      ['Самоподдерживающийся спазм: сокращение → застой кровообращения → боль → сокращение'],
      ['Это защитное напряжение: оно не проходит, даже когда боль устранена'],
      ['Компартмент-синдром мышц спины'],
      ['Контрактура суставной капсулы'],
    ], 0, 'Собственный мышечный спазм поддерживает себя сам, даже если первичное повреждение уже не раздражено.',
    [null, 'Защитное напряжение как раз проходит, когда устранён болевой стимул.', 'Компартмент-синдром — рост давления в замкнутом футляре с ишемией; здесь нет такой картины.', 'Контрактура — укорочение ткани, а не длительное сокращение мышцы.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
