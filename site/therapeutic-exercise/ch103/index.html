const CHAPTER = { number: 103, title: 'Острая стадия: максимальная защита', minutes: 9, language: 'ru', next: '../ch104/' };
// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch103/cards.ru.json
const CARDS_SHORT = {
  "ручные методы\nмассаж и мягкие колебания в суставе I степени — против боли и отёка": "массаж и колебания — против боли",
  "поэтому уже в острой стадии\nесли пациент переносит, начинают осторожно дозированные пассивные движения": "осторожные пассивные движения",

  "повреждён сустав → положение по боли\nобычно удобнее всего положение покоя сустава": "обычно удобнее всего положение покоя сустава",

  "повреждённая мышца\nпри массаже её держат укороченной, чтобы не разводить края заживающего разрыва": "держат укороченной",
  "объём движений\nактивно или пассивно — смотря как близко сустав и как движение влияет на повреждение": "активно или пассивно",
  "сопротивление\nмышцам, не связанным с повреждением: например, подготовка к костылям или ходункам": "подготовка к костылям",

// cards-short end

const HEAD = STG[0], PAIN = '#ff5a3c', ICE = '#bfe6f7';
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
function numLine(p, n, str, x, y, col, t0, { size = 22, maxW = 860 } = {}) {
  const g = G(p, { o: 0 });
  mk('circle', { cx: x + 20, cy: y - 8, r: 19, fill: col }, g);
  T(g, String(n), { x: x + 20, y: y, size: 22, weight: 700, fill: COL.board, anchor: 'middle' });
  put(para(g, str, x + 54, y, null, { size, maxW }), { o: 1 });
  if (t0 !== null) show(g, t0);
  return g;
}
function painMark(p, x, y, r = 22) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r: r * 1.6, fill: PAIN, 'fill-opacity': .2 }, g);
  let d = '';
  for (let i = 0; i < 16; i++) { const a = i / 16 * 2 * Math.PI, rr = i % 2 ? r * .45 : r; d += `${i ? 'L' : 'M'}${(rr * Math.cos(a)).toFixed(1)} ${(rr * Math.sin(a)).toFixed(1)}`; }
  mk('path', { d: d + 'Z', fill: PAIN, stroke: '#ffd2c4', 'stroke-width': 2 }, g);
  const pm = { g, x, y };
  pm.at = (X, Y) => { pm.x = X; pm.y = Y; return pm; };
  pm.set = k => put(g, { x: pm.x, y: pm.y, o: clamp(k * 1.6, 0, 1), s: .35 + .65 * clamp(k, 0, 1) });
  return pm;
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19 } = {}) {
  const g = G(p, { o: 0 }), right = tx > x;
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: right ? 'end' : 'start' });
  path(g, `M${x + (right ? 8 : -8)} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
// A patient supine on a table with the near leg up on a pillow; ankle with orthosis, ice and a compression wrap.
// parts: pt (the figure), pillow, brace, ice, wrap — groups the lesson reveals; legUp() → the pose.
function elevScene(p, hx, top, s, t0) {
  const g = G(p, { o: 0 });
  bench(g, hx - 300 * s, hx + 330 * s, top, null, COL.dim, 120 * s); put(g.lastChild, { o: 1 });
  const pillow = G(g, {}), pt = supine(g, hx, top, s, null, { hN: 26, kN: 4 }); put(pt.g, { o: 1 });
  const [kx, ky] = onStage(pt, 'KN'), [ax, ay] = onStage(pt, 'AN');
  const mx = (kx + ax) / 2, my = (ky + ay) / 2 + 12 * s;
  mk('path', { d: `M${(kx - 30 * s).toFixed(1)} ${top}Q${(kx - 20 * s).toFixed(1)} ${(my + 4).toFixed(1)} ${mx.toFixed(1)} ${(my + 2).toFixed(1)}T${(ax + 40 * s).toFixed(1)} ${(ay + 22 * s).toFixed(1)}L${(ax + 50 * s).toFixed(1)} ${top}Z`, fill: '#5b6f8a', stroke: '#9fb3cf', 'stroke-width': 2.5 }, pillow);
  g.insertBefore(pillow, pt.g);
  const ang = Math.atan2(ay - ky, ax - kx), u = [Math.cos(ang), Math.sin(ang)], n = [-u[1], u[0]], P = (k, o) => [kx + (ax - kx) * k + n[0] * o * s, ky + (ay - ky) * k + n[1] * o * s];
  const wrap = G(g, { o: 0 });
  for (let i = 0; i < 6; i++) { const A = P(.38 + i * .09, -14), B = P(.46 + i * .09, 14); path(wrap, `M${A[0].toFixed(1)} ${A[1].toFixed(1)}L${B[0].toFixed(1)} ${B[1].toFixed(1)}`, { stroke: '#e7c58a', 'stroke-width': 6 * s }); }
  const brace = G(g, { o: 0 });
  mk('rect', { x: ax - 22 * s, y: ay - 24 * s, width: 70 * s, height: 46 * s, rx: 12 * s, fill: '#3d4a52', 'fill-opacity': .8, stroke: '#9aa7ad', 'stroke-width': 2.5 }, brace);
  const ice = G(g, { o: 0 }), I = P(.86, -22);
  mk('rect', { x: I[0] - 34 * s, y: I[1] - 20 * s, width: 68 * s, height: 30 * s, rx: 10 * s, fill: ICE, stroke: '#ffffff', 'stroke-width': 2 }, ice);
  [[-16, -8], [0, -4], [14, -10], [-6, 2]].forEach(([dx, dy]) => mk('rect', { x: I[0] + dx * s, y: I[1] + dy * s, width: 8 * s, height: 8 * s, fill: '#ffffff', 'fill-opacity': .8, transform: `rotate(45 ${(I[0] + dx * s + 4).toFixed(1)} ${(I[1] + dy * s + 4).toFixed(1)})` }, ice));
  if (t0 !== null) show(g, t0);
  return { g, pt, pillow, wrap, brace, ice, pts: { ankle: [ax, ay], calf: P(.55, 0), ice: I, knee: [kx, ky] } };
}
// A figure on two crutches (side view), the near (injured) leg held off the floor.
function crutchFig(p, x, gy, s, t0) {
  const back = G(p, { o: 0 }), cF = crutch(back);
  const f = fig(p, { x, y: gy - 182 * s, s, o: 0, pose: { t: 8, hN: 22, kN: 48, fN: -12, hF: -2, kF: 2, fF: 0 } });
  plant(f, 'AF', x, gy);
  const front = G(p, { o: 0 }), cN = crutch(front);
  const set = sway => {
    const [sx, sy] = onStage(f, 'Sh'), [fx] = onStage(f, 'AF');
    cF.set([sx + 10 * s, sy + 26 * s], [fx + 58 * s, gy]); cN.set([sx + 4 * s, sy + 28 * s], [fx + 70 * s, gy]);
    reach(f, 'F', ...cF.grip); reach(f, 'N', ...cN.grip);
  };
  set(0);
  if (t0 !== null) { show(back, t0); show(f.g, t0); show(front, t0); }
  return { f, set, groups: [back, f.g, front] };
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Острая стадия', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 10 · Урок 103', { x: 800, y: 130, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'Острая стадия', { x: 800, y: 215, size: 56, weight: 600, anchor: 'middle' });
    T(g, 'фаза I — максимальная защита', { x: 800, y: 280, size: 40, weight: 600, anchor: 'middle', fill: COL.dim });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'защитить ткань и не навредить покоем', 800, 360, m('sub'), { size: 30, fill: HEAD, anchor: 'middle', weight: 600 });
    const art = G(scene, { o: 0 });
    const hv = healView(art, 330, 430, 440, 280, null); put(hv.g, { o: 1 });
    const es = elevScene(art, 1050, 610, .7, null); put(es.g, { o: 1 }); [es.wrap, es.brace, es.ice].forEach(e => put(e, { o: 1 }));
    prog(q => hv.set({ exud: clamp(q * 3, 0, 1), clot: clamp(q * 3 - .5, 0, 1), cells: clamp(q * 3 - 1, 0, 1), debris: 1 - clamp(q * 2 - 1, 0, 1) * .7 }), .5, D - 1.5, lin);
    stageChips(art, 800, 790, 0, null).forEach(c => put(c, { o: 1 }));
    show(art, .3);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);
  }],

  ['resp', 'Ответ ткани', (m, D) => {
    const p = panel(0);
    txt(p, 'ответ ткани: воспаление', 800, 56, m('resp'), { size: 28, weight: 700, anchor: 'middle', fill: HEAD });
    txt(p, 'клетки, сосуды, химические вещества', 800, 96, m('resp', .5), { size: 21, fill: COL.dim, anchor: 'middle' });
    const hv = healView(p, 60, 130, 700, 440, m('resp'));
    hv.set({ debris: 1 });
    pill(p, 'схема', 700, 600, m('resp', .5), { col: COL.dim, size: 18 });
    prog(q => hv.set({ exud: q }), m('vasc', .3), 1.5);
    prog(q => hv.set({ clot: q, cells: clamp(q * 1.6, 0, 1) }), m('exud', .3), 2);

    prog(q => hv.set({ fib: .4 * q, cap: .35 * q }), m('fib', .2), 1.5);
    labelBox(p, 410, 680, 520, ['первые 48 часов', 'преобладают изменения сосудов'], STG[0], m('vasc'), { size: 25 });
    numLine(p, 1, 'выходят клетки и растворённые вещества', 820, 170, STG[0], m('exud'), { size: 22, maxW: 640 });
    numLine(p, 2, 'образуется сгусток', 820, 240, STG[0], m('exud', 1.5), { size: 22, maxW: 640 });
    numLine(p, 3, 'раздражители обезвреживаются; фагоцитоз — уборка погибшей ткани', 820, 310, STG[0], m('phag'), { size: 22, maxW: 640 });
    numLine(p, 4, 'первые фибробласты и новые капиллярные сети', 820, 410, STG[0], m('fib'), { size: 22, maxW: 640 });

    labelBox(p, 1180, 720, 440, ['обычно 4–6 дней', 'если повреждение не повторяется'], STG[0], m('dur'), { size: 26 });
  }],

  ['role', 'Задачи терапевта и обучение', (m, D) => {

    R.forEach(([s, c], i) => {
      const g = G(p, { o: 0, y: 10 }), x = 60 + i * 500;

    });
    txt(p, 'обучение пациента (patient education)', 60, 300, m('edu'), { size: 25, weight: 700, fill: COL.whole });
    const E = ['сколько продлятся симптомы: 4–6 дней', 'что можно делать', 'предосторожности и противопоказания', 'чего ждать, когда симптомы стихнут'];
    E.forEach((s, i) => numLine(p, i + 1, s, 60, 360 + i * 70, COL.whole, m('edu', .6 + i * 1.1), { size: 23, maxW: 800 }));
    // reassurance: a speech bubble
    const b = G(p, { o: 0 });
    mk('path', { d: 'M1000 330H1520Q1540 330 1540 350V560Q1540 580 1520 580H1150L1100 640L1110 580H1000Q980 580 980 560V350Q980 330 1000 330Z', fill: PANEL, stroke: COL.good, 'stroke-width': 3 }, b);
    put(para(b, 'острые симптомы обычно недолги', 1260, 400, null, { size: 26, weight: 700, fill: COL.good, maxW: 500, anchor: 'middle' }), { o: 1 });
    put(para(b, 'важно знать, что безопасно на этой стадии', 1260, 480, null, { size: 23, fill: COL.chalk, maxW: 480, anchor: 'middle' }), { o: 1 });

  }],

  ['protect', 'Защита поражённой части', (m, D) => {

    cart(0); show(cg, m('harm', 4));

    txt(p, 'изменения суставного хряща', 890, 340, m('harm', 4.5), { size: 19, weight: 600, fill: COL.chalk, anchor: 'middle' });

    infoCard(p, 1050, 420, 490, 300, 'поэтому уже в острой стадии', 'если пациент переносит, начинают осторожно дозированные пассивные движения', COL.good, m('early'), { size: 23 });

    [['Острая стадия: изменения сосудов, сгусток, уборка погибшей ткани; 4–6 дней.', 'w1'],
     ['Защита: обучение, покой, холод, компрессия, возвышенное положение, разгрузка ноги.', 'w2'],
     ['Не обездвиживать полностью: мягкое пассивное движение — точно на повреждённую структуру, без роста боли.', 'w3'],
     ['Пассивный объём, мобилизация I–II, установочное напряжение (мышцы — в укороченном положении); растяжка и сопротивление в месте воспаления — нет.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: HEAD }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-plan', prompt: ['Сутки назад пациент подвернул голеностоп: отёк, боль, ходит с трудом. Какой план подходит для фазы I?'],
    build: choice([
      ['Обучение, ортез, холод, компрессия, возвышенное положение, костыли; мягкие пассивные движения в пределах боли'],
      ['Растяжка икроножной мышцы, чтобы сохранить объём'],
      ['Упражнения с эластичной лентой на сопротивление для голеностопа'],
      ['Гипс на три недели без всяких движений'],
    ], 0, 'В острой стадии защищают ткань и не допускают вреда покоя: обучение, покой, холод, компрессия, возвышение, разгрузка и мягкие движения в пределах боли.',
    [null, 'Растяжка в острой стадии противопоказана.', 'Сопротивление в месте отёка противопоказано.', 'Полной иммобилизации по возможности избегают: волокна прилипают, ткань слабеет, хрящ меняется.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-dose', prompt: ['После занятия с пассивными движениями к вечеру боль и отёк усилились. Что это значит?'],
    build: choice([
      ['Доза движения слишком велика — или это движение не надо делать'],
      ['Так и должно быть: движения разрабатывают сустав'],
      ['Нужно добавить растяжку'],
      ['Нужно перейти к активным движениям в месте повреждения'],
    ], 0, 'Если движение усиливает боль или воспаление, его доза слишком велика или его не надо делать.',
    [null, 'В острой стадии движение не должно усиливать боль и воспаление.', 'Растяжка в острой стадии противопоказана.', 'Активное движение в месте активного процесса обычно противопоказано.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
