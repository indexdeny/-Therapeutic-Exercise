<script>
'use strict';
const CHAPTER = { number: 106, title: 'Кумулятивная травма и хроническое воспаление', minutes: 9, language: 'ru', next: '../ch107/' };
// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch106/cards.ru.json
const CARDS_SHORT = {
  "миофибробласты продолжают работать\nподвижность может прогрессивно уменьшаться": "подвижность может прогрессивно уменьшаться",
  "повторяющиеся микротравмы\nили повторная перегрузка со временем ослабляют структуру: ткань разрушается от усталости, рвутся поперечные связи коллагена, возникает воспаление": "ткань разрушается от усталости",
  "накопление\nвоспалительный ответ сначала ниже порога ощущения, но постепенно нарастает до боли и нарушения функции": "ниже порога → до боли",
  "травма + повторная травма\nсостояние так и не заживает: например, рано вернулся к высоким нагрузкам": "рано вернулся к нагрузкам",
  "старый рубец\nменее податлив; прирос или выровнен не по нагрузке → травмируется от обычных нагрузок": "травма от обычных нагрузок",
  "контрактуры, плохая подвижность\nнеправильная осанка или долгая неподвижность укорачивают ткани; повторная или энергичная активность их перегружает": "укорачивают → перегружает",
  "лечат как острое состояние\nзатем — нарушения и ограничения функции": "затем — нарушения и ограничения функции",
  "найти и изменить механизм раздражения\nфизические факторы и покой + биомеханические советы; без участия пациента не получится": "физические факторы + биомеханика",
  "объяснить\nкак ткань разрушается и как будем лечить": "как разрушается и как лечим",
  "вначале — только щадящие занятия\nупражнения: безопасная интенсивность для поражённых тканей, корригирующая — для соседних областей": "безопасная интенсивность",
  "старый сократившийся рубец\nограничивает объём или надрывается → фрикционный массаж, мобилизация мягких тканей, растяжка": "фрикционный массаж, мобилизация, растяжка",
  "защитное напряжение\nтело оберегает часть → стабилизация и безопасные приспособительные движения": "стабилизация",
  "причина и выносливость\nисправить механику: укрепление, стабилизация, изменения на работе и в отдыхе; выносливость стабилизаторов и главных мышц": "укрепление, стабилизация, выносливость",
  "дальше — специфично\nвремя, координация, навык; программы подготовки к труду и спортивные упражнения": "программы подготовки к труду и спорту",
  "осторожно\nобъём уменьшается от растяжки → не растягивать; переоценить: воспаление со сжимающимся рубцом или защитное напряжение; упор — стабилизация": "не растягивать; упор — стабилизация",
};
// cards-short end

const HEAD = COL.nat, PAIN = '#ff5a3c', BRUISE = '#6a3a6e';
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
function numLine(p, n, str, x, y, col, t0, { size = 22, maxW = 860 } = {}) {
  const g = G(p, { o: 0 });
  mk('circle', { cx: x + 20, cy: y - 8, r: 19, fill: col }, g);
  T(g, String(n), { x: x + 20, y: y, size: 22, weight: 700, fill: COL.board, anchor: 'middle' });
  put(para(g, str, x + 54, y, null, { size, maxW }), { o: 1 });
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
// Cumulative microdamage over repeated loads (schematic): every load adds damage, the rest between loads takes back only
// part of it; returns the level 0..1 after time u (0..1) for n loads.
const dmg = (u, n = 9) => { let v = 0; for (let i = 0; i < n; i++) { const t = (i + .5) / n; if (u >= t) v += .13 * Math.exp(-(u - t) * 6) + .075; } return Math.min(1, v); };
// A card with a number, a title line and a small picture drawn by pic(g, cx, cy).
function factorCard(p, x, y, w, h, n, title, col, t0, pic) {
  const g = G(p, { o: 0, y: 10 });
  roundBox(g, x, y, w, h, col, PANEL, 2.2);
  mk('circle', { cx: x + 30, cy: y + 32, r: 18, fill: col }, g);
  T(g, String(n), { x: x + 30, y: y + 40, size: 20, weight: 700, fill: COL.board, anchor: 'middle' });
  put(para(g, title, x + 58, y + 38, null, { size: 20, weight: 600, maxW: w - 76 }), { o: 1 });
  if (pic) pic(g, x + w / 2, y + h - 70);
  tw(g, { o: 1, y: 0 }, t0, .5);
  return g;
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Кумулятивная травма', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 10 · Урок 106', { x: 800, y: 130, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'Кумулятивная травма', { x: 800, y: 215, size: 56, weight: 600, anchor: 'middle' });
    T(g, 'и хроническое воспаление', { x: 800, y: 280, size: 40, weight: 600, anchor: 'middle', fill: COL.dim });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'боль, которая возвращается снова и снова', 800, 360, m('sub'), { size: 30, fill: HEAD, anchor: 'middle', weight: 600 });
    const art = G(scene, { o: 0 });
    const X0 = 420, Y0 = 760, W = 760, H = 300;
    chartAxes(art, X0, Y0, W, H, 'повреждение ткани', 'время, повторы нагрузки', null); put(art.lastChild, { o: 1 });
    path(art, `M${X0} ${Y0 - H * .62}H${X0 + W}`, { stroke: PAIN, 'stroke-width': 3, 'stroke-dasharray': '8 7' });
    T(art, 'порог боли', { x: X0 + W - 6, y: Y0 - H * .62 - 12, size: 20, fill: PAIN, anchor: 'end', weight: 700 });
    const cv = path(art, fnPath(X0, Y0, W, H, u => dmg(u), 0, 1, 240), { stroke: COL.task, 'stroke-width': 4 }, { d: 0 });
    draw(cv, .6, D - 1.8);
    show(art, .3);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);
  }],

  ['resp', 'Ответ ткани: хроническое воспаление', (m, D) => {
    const p = panel(0);
    txt(p, 'ответ ткани: хроническое воспаление', 800, 56, m('resp'), { size: 28, weight: 700, anchor: 'middle', fill: HEAD });
    const hv = healView(p, 60, 110, 700, 400, m('resp')); hv.set({ coll: 1, align: 1, thick: 1 });
    txt(p, 'обычно ткань проходит весь путь восстановления', 410, 550, m('resp'), { size: 21, fill: COL.chalk, anchor: 'middle' });
    const L = [fArrow(p, 0, 0, 0, 0, COL.task, { w: 7, head: 17 }), fArrow(p, 0, 0, 0, 0, COL.task, { w: 7, head: 17 })];
    prog(q => { const T = q * (D - m('rep')), k = .5 + .5 * Math.sin(T * 5); L[0].set(52, 310, -60 * k, 0); L[1].set(768, 310, 60 * k, 0); }, m('rep'), D - m('rep'), lin);
    txt(p, 'снова и снова — сверх способности восстанавливаться', 410, 590, m('rep'), { size: 21, weight: 700, fill: COL.task, anchor: 'middle' });
    prog(q => hv.set({ fib: q, cells: .5 * q, exud: .3 * q }), m('rep', .5), 1.5);
    prog(q => hv.set({ align: 1 - q, thick: 1 - q }), m('pro', .3), 1.6);
    prog(q => hv.set({ degrade: q }), m('deg', .2), 1.6);
    prog(q => hv.set({ shrink: .45 * q }), m('myo', .3), 1.6);
    // a balance: much new collagen made, the mature broken down
    const bal = G(p, { o: 0 }), beam = G(bal, { x: 1160, y: 330 });
    path(bal, 'M1160 330V470M1100 470H1220', { stroke: COL.dim, 'stroke-width': 5 });
    path(beam, 'M-230 0H230', { stroke: COL.chalk, 'stroke-width': 6 });
    [[-1, 'новый, незрелый', '#c9c3a0'], [1, 'зрелый', ANAT.tendon]].forEach(([k, s, c]) => { path(beam, `M${k * 210} 0V60`, { stroke: COL.dim, 'stroke-width': 2.5 }); mk('rect', { x: k * 210 - 70, y: 60, width: 140, height: 20, rx: 8, fill: c }, beam); T(beam, s, { x: k * 210, y: 112, size: 20, weight: 700, fill: c, anchor: 'middle' }); });
    show(bal, m('pro'));
    prog(q => put(beam, { x: 1160, y: 330, r: -12 * io(q) }), m('deg', .5), 1.5);
    txt(p, 'фибробласты размножаются, коллагена больше', 1160, 160, m('pro'), { size: 21, fill: COL.chalk, anchor: 'middle' });
    txt(p, 'а зрелый коллаген распадается', 1160, 196, m('deg'), { size: 21, fill: COL.bad, anchor: 'middle' });
    labelBox(p, 1160, 580, 660, ['незрелый коллаген преобладает →', 'ткань в целом слабеет'], COL.bad, m('imm'), { size: 25 });
    infoCard(p, 830, 680, 660, 160, 'миофибробласты продолжают работать', 'подвижность может прогрессивно уменьшаться', COL.real, m('myo'), { size: 21 });
  }],

  ['overuse', 'Перегрузка и усталостное разрушение', (m, D) => {
    const p = panel(0);
    txt(p, 'перегрузка, кумулятивная травма, повторяющееся напряжение', 800, 56, m('cause'), { size: 28, weight: 700, anchor: 'middle', fill: HEAD });
    txt(p, 'нагрузка, на которую ткань не может ответить, — повторяющаяся или чрезмерная', 800, 96, m('cause', .5), { size: 21, fill: COL.dim, anchor: 'middle' });
    // cross-links break, load after load (schematic)
    const g = G(p, { o: 0 }), rods = [], links = [];
    for (let i = 0; i < 5; i++) rods.push(path(g, `M120 ${200 + i * 40}H620`, { stroke: ANAT.tendon, 'stroke-width': 10 }));
    for (let i = 0; i < 4; i++) for (let k = 0; k < 6; k++) links.push(path(g, `M${170 + k * 80 + (i % 2) * 30} ${208 + i * 40}V${232 + i * 40}`, { stroke: COL.chalk, 'stroke-width': 4 }));
    show(g, m('micro'));
    const order = links.map((_, i) => (i * 7) % links.length);
    prog(q => { const n = Math.floor(q * 14); order.forEach((li, j) => { const e = links[li]; e.setAttribute('stroke', j < n ? PAIN : COL.chalk); e.setAttribute('opacity', j < n ? .25 : 1); }); }, m('micro', .5), Math.max(2, m('thr') - m('micro', .5)), lin);
    txt(p, 'рвутся поперечные связи коллагена — разрушение от усталости', 370, 420, m('micro', .5), { size: 20, weight: 700, fill: PAIN, anchor: 'middle' });
    pill(p, 'схема', 650, 160, m('micro'), { col: COL.dim, size: 18 });
    // damage builds load after load and crosses the threshold of pain
    const X0 = 840, Y0 = 470, W = 680, H = 300;
    chartAxes(p, X0, Y0, W, H, 'воспалительный ответ', 'повторы нагрузки →', m('over'));
    const thr = G(p, { o: 0 }); path(thr, `M${X0} ${Y0 - H * .62}H${X0 + W}`, { stroke: PAIN, 'stroke-width': 3, 'stroke-dasharray': '8 7' });
    T(thr, 'порог ощущения', { x: X0 + 10, y: Y0 - H * .62 - 12, size: 19, fill: PAIN, weight: 700 }); show(thr, m('thr'));
    const cv = path(p, fnPath(X0, Y0, W, H, u => dmg(u), 0, 1, 240), { stroke: COL.task, 'stroke-width': 4 }, { d: 0 });
    draw(cv, m('over', .5), Math.max(2, m('thr', 2) - m('over', .5)));
    txt(p, 'сначала ниже порога', X0 + W * .3, Y0 - H * .2, m('thr', .5), { size: 19, fill: COL.chalk, anchor: 'middle' });
    txt(p, 'боль и нарушение функции', X0 + W * .8, Y0 - H * .9, m('thr', 2), { size: 20, weight: 700, fill: PAIN, anchor: 'middle' });
    pill(p, 'схема', X0 + W - 40, Y0 - H - 14, m('over'), { col: COL.dim, size: 18 });
    infoCard(p, 60, 540, 720, 300, 'повторяющиеся микротравмы', 'или повторная перегрузка со временем ослабляют структуру: ткань разрушается от усталости, рвутся поперечные связи коллагена, возникает воспаление', COL.task, m('micro'), { size: 22 });
    infoCard(p, 820, 560, 720, 280, 'накопление', 'воспалительный ответ сначала ниже порога ощущения, но постепенно нарастает до боли и нарушения функции', PAIN, m('thr'), { size: 22 });
  }],

  ['tend', 'Тендинопатия: дегенерация', (m, D) => {
    const p = panel(0);
    txt(p, 'тендинопатия: от воспаления к дегенерации', 800, 56, m('tend'), { size: 28, weight: 700, anchor: 'middle', fill: HEAD });
    const a = tendonSheath(p, 80, 220, 620, m('tend'), { r: 32 });
    txt(p, 'здоровое сухожилие', 390, 150, m('tend'), { size: 22, weight: 700, fill: ANAT.tendon, anchor: 'middle' });
    const b = tendonSheath(p, 860, 220, 620, m('tend', 1)); b.set({});
    txt(p, 'тендинопатия', 1170, 150, m('tend', 1), { size: 22, weight: 700, fill: COL.bad, anchor: 'middle' });
    prog(q => b.set({ inflT: q, inflS: .5 * q }), m('early'), 1);
    prog(q => b.set({ inflT: 1 - q, inflS: .5 * (1 - q), degen: q }), m('late'), 2);
    // inflammation early, degeneration later (schematic)
    const X0 = 900, Y0 = 620, W = 600, H = 220;
    chartAxes(p, X0, Y0, W, H, '', 'время →', m('early'));
    draw(path(p, fnPath(X0, Y0, W, H, u => .8 * Math.exp(-(((u - .2) / .16) ** 2)), 0, 1, 120), { stroke: PAIN, 'stroke-width': 4 }, { d: 0 }), m('early', .3), 1.5);
    txt(p, 'воспаление', X0 + W * .2, Y0 - H * .88, m('early', .5), { size: 19, weight: 700, fill: PAIN, anchor: 'middle' });
    draw(path(p, fnPath(X0, Y0, W, H, u => .85 / (1 + Math.exp(-(u - .55) * 10)), 0, 1, 120), { stroke: COL.dim, 'stroke-width': 4 }, { d: 0 }), m('late', .3), 1.5);
    txt(p, 'дегенерация', X0 + W * .8, Y0 - H * .95, m('late', .5), { size: 19, weight: 700, fill: COL.dim, anchor: 'middle' });
    pill(p, 'схема', X0 + 60, Y0 - H - 14, m('early'), { col: COL.dim, size: 18 });
    txt(p, 'поэтому некоторые считают её невоспалительной', 1200, 860, m('late', 2), { size: 20, fill: COL.chalk, anchor: 'middle' });
    txt(p, 'под микроскопом:', 60, 400, m('hist'), { size: 23, weight: 700, fill: COL.chalk });
    ['распад коллагена', 'волокна тоньше и беспорядочны', 'избыток клеток', 'разрозненное врастание сосудов'].forEach((s, i) => numLine(p, i + 1, s, 60, 460 + i * 64, COL.bad, m('hist', .5 + i * .9), { size: 22, maxW: 700 }));
    labelBox(p, 420, 770, 700, ['изменения быстро не проходят →', 'сухожилие теряет функцию'], COL.bad, m('slow'), { size: 23 });
  }],

  ['other', 'Другие причины', (m, D) => {
    const p = panel(0);
    txt(p, 'ещё три причины хронической боли', 800, 56, m('tr'), { size: 28, weight: 700, anchor: 'middle', fill: HEAD });
    // 1: trauma with superimposed repetitive trauma: healing keeps being knocked back (schematic)
    const X0 = 80, Y0 = 430, W = 420, H = 240;
    chartAxes(p, X0, Y0, W, H, 'прочность ткани', 'время', m('tr'));
    path(p, `M${X0} ${Y0 - H * .85}H${X0 + W}`, { stroke: COL.good, 'stroke-width': 2.5, 'stroke-dasharray': '6 6' }, { o: 0 });
    const heal = u => { let v = .15 + .7 * (1 - Math.exp(-u * 3)); if (u > .3) v -= .25 * Math.exp(-(u - .3) * 8); if (u > .55) v -= .25 * Math.exp(-(u - .55) * 8); if (u > .8) v -= .25 * Math.exp(-(u - .8) * 8); return Math.max(.08, v); };
    draw(path(p, fnPath(X0, Y0, W, H, heal, 0, 1, 160), { stroke: COL.task, 'stroke-width': 4 }, { d: 0 }), m('early'), 2.5);
    txt(p, 'слишком ранний возврат → снова и снова', X0 + W / 2, Y0 + 70, m('early', 1), { size: 19, fill: COL.task, anchor: 'middle' });
    infoCard(p, 60, 540, 480, 300, 'травма + повторная травма', 'состояние так и не заживает: например, рано вернулся к высоким нагрузкам', COL.task, m('tr'), { size: 21 });
    // 2: an old scar: stiff, adherent, misaligned
    const hv = healView(p, 580, 150, 440, 280, m('re')); hv.set({ coll: 1, thick: 1, align: .15, shrink: .3, adhere: 1 });
    const A1 = fArrow(p, 0, 0, 0, 0, COL.whole, { w: 6, head: 15 }), A2 = fArrow(p, 0, 0, 0, 0, COL.whole, { w: 6, head: 15 });
    const hot = G(p, { o: 0 }); [[700, 240], [900, 330]].forEach(([x, y]) => mk('circle', { cx: x, cy: y, r: 22, fill: PAIN, 'fill-opacity': .35, stroke: PAIN, 'stroke-width': 3 }, hot));
    prog(q => { const k = .5 + .5 * Math.sin(q * 30); A1.set(572, 290, -40 * k, 0); A2.set(1028, 290, 40 * k, 0); put(hot, { o: k > .7 ? 1 : 0 }); }, m('scar'), Math.max(2, m('con') - m('scar')), lin);
    infoCard(p, 580, 540, 440, 300, 'старый рубец', 'менее податлив; прирос или выровнен не по нагрузке → травмируется от обычных нагрузок', COL.bad, m('re'), { size: 21 });
    // 3: contracture from posture or immobility, then repeated activity
    chair(p, 1300, 380, 470, m('con'));
    const f = fig(p, { s: .78, o: 0, pose: { ...SIT, t: 26, hd: 28, aN: 62, eN: 60, aF: 62, eF: 60 } });
    put(f.g, { x: 1300, y: 380 - 20 }); f.set({}); show(f.g, m('con'));
    path(p, 'M1370 330H1520M1440 330V470', { stroke: COL.dim, 'stroke-width': 5 }, { o: 0 });
    show(p.lastChild, m('con'));
    prog(q => f.set({ eN: 60 + 6 * Math.sin(q * 60), eF: 60 + 6 * Math.cos(q * 60) }), m('con', .3), Math.max(1, D - m('con', .3)), lin);
    infoCard(p, 1060, 540, 480, 300, 'контрактуры, плохая подвижность', 'неправильная осанка или долгая неподвижность укорачивают ткани; повторная или энергичная активность их перегружает', COL.real, m('con'), { size: 21 });
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-cause', prompt: ['Какая это причина хронической боли?'],
    build: grid([
      { parts: ['Бегун удвоил недельный объём, через месяц заболело ахиллово сухожилие'], ans: ['o'], why: 'Повторяющаяся перегрузка (с фактором — резким изменением нагрузки).' },
      { parts: ['Вернулся в футбол через неделю после растяжения — колено так и не успокоилось'], ans: ['t'], why: 'Травма, на которую наложилась повторная травма из-за раннего возврата.' },
      { parts: ['Связка порвана год назад; рубец прирос и снова травмируется от обычной нагрузки'], ans: ['s'], why: 'Повторная травма старого рубца.' },
      { parts: ['Годы сутулости: укороченные ткани плеча раздражаются при работе над головой'], ans: ['c'], why: 'Контрактура от неправильной осанки.' },
    ], [['o', 'Перегрузка', COL.task], ['t', 'Травма + повторная', PAIN], ['s', 'Старый рубец', COL.bad], ['c', 'Контрактура', COL.real]], { multi: false, text: true }),
  }], done) }],

    const hm = G(g, {});
    mk('rect', { x: 0, y: -10, width: 210, height: 20, rx: 8, fill: '#b98a5a', stroke: COL.board, 'stroke-width': 2 }, hm);

    const tT = m('tip'), tS = m('stop');
    prog(q => {
      const T = q * (D - tT), hits = T < tS - tT, ph = (T * 1.6) % 1, gone = hits ? 0 : clamp((T - (tS - tT)) / 1, 0, 1);

      put(hm, { x: 162, y: 404, r: -55 * lift, o: 1 - gone });
      const n = hits ? Math.floor(T * 1.6) : Math.floor((tS - tT) * 1.6), heal = hits ? 0 : clamp((T - (tS - tT) - 1) / 3, 0, 1);
      const r = Math.min(30, 4 + n * 4) * (1 - heal);
      br.setAttribute('rx', r.toFixed(1)); br.setAttribute('ry', (r * .5).toFixed(1)); br.setAttribute('opacity', (1 - heal).toFixed(2));
    }, tT, D - tT, lin);
    txt(p, 'бить по ногтю снова и снова — рана не заживёт', 380, 620, m('tip', .5), { size: 21, weight: 700, fill: PAIN, anchor: 'middle' });
    txt(p, 'перестать «бить по больному» — и ткань заживает', 380, 670, m('stop'), { size: 22, weight: 700, fill: COL.good, anchor: 'middle' });
