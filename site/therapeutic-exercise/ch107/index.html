// cards-short end

const HEAD = COL.nat, PAIN = '#ff5a3c', RA = '#e6738c';
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
function numLine(p, n, str, x, y, col, t0, { size = 22, maxW = 860 } = {}) {
  const g = G(p, { o: 0 });
  mk('circle', { cx: x + 20, cy: y - 8, r: 19, fill: col }, g);
  T(g, String(n), { x: x + 20, y: y, size: 22, weight: 700, fill: COL.board, anchor: 'middle' });
  put(para(g, str, x + 54, y, null, { size, maxW }), { o: 1 });
  if (t0 !== null) show(g, t0);
  return g;
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19 } = {}) {
  const g = G(p, { o: 0 }), right = tx > x;
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: right ? 'end' : 'start' });
  path(g, `M${x + (right ? 8 : -8)} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
// A range dial: the full range dashed, the available part solid, a stop bar at its end (degrees from the start).
function romDial(p, cx, cy, R, full, avail, col, t0) {
  const g = G(p, { o: 0 });
  path(g, romArc([cx, cy], R, 0, full, 180, 1), { stroke: COL.faint, 'stroke-width': 4, 'stroke-dasharray': '6 6' });
  path(g, romArc([cx, cy], R, 0, avail, 180, 1), { stroke: col, 'stroke-width': 7 });
  const a = rad(180 + avail);
  path(g, `M${(cx + (R - 16) * Math.cos(a)).toFixed(1)} ${(cy + (R - 16) * Math.sin(a)).toFixed(1)}L${(cx + (R + 16) * Math.cos(a)).toFixed(1)} ${(cy + (R + 16) * Math.sin(a)).toFixed(1)}`, { stroke: COL.bad, 'stroke-width': 6 });
  mk('circle', { cx, cy, r: 8, fill: COL.chalk }, g);
  if (t0 !== null) show(g, t0);
  return g;
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Артрит и ревматоидный артрит', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 11 · Урок 107', { x: 800, y: 130, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });

    const sub = txt(scene, 'общие признаки, разрушение сустава, ведение', 800, 360, m('sub'), { size: 30, fill: HEAD, anchor: 'middle', weight: 600 });

      sw.forEach(e => put(e, { o: clamp(k * 2, 0, 1) })); hm.set({ ulnar: 14 * clamp(k * 2 - 1, 0, 1) });
    }, .5, D - 1.5, lin);

    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);

    infoCard(p, 1000, 120, 540, 300, 'причина неизвестна?', 'не было недавней травмы или иммобилизации → диагноз и медицинское лечение — от врача', COL.whole, m('med'), { size: 23 });
    infoCard(p, 1000, 450, 540, 250, 'травматический артрит', 'кровянистый выпот → иногда нужна пункция сустава', PAIN, m('asp'), { size: 23 });

  }],

  ['signs', 'Общие признаки артритов', (m, D) => {

    txt(p, 'общие признаки артритов', 800, 56, m('signs'), { size: 28, weight: 700, anchor: 'middle', fill: HEAD });
    const card = (x, y, w, h, t, b, c, t0) => infoCard(p, x, y, w, h, t, b, c, t0, { size: 20, textW: w - 44 });

    card(60, 100, 720, 330, 'подвижность', 'ограничение по капсулярному паттерну; конечное ощущение обычно плотное (в острой стадии — защитное); суставная игра снижена, может болеть; отёк', COL.whole, m('mob'));

    const cast = G(p, { o: 0 }), dd = mk('defs', {}, cast);

    mk('rect', { x: 1080, y: 322, width: 170, height: 56, rx: 18, fill: '#e9e6dd', stroke: '#9a958a', 'stroke-width': 2 }, cast);
    for (let i = 0; i < 7; i++) path(cast, `M${1094 + i * 22} 326l14 46`, { stroke: '#c9c4b8', 'stroke-width': 2 });
    show(cast, m('arthrosis', .6));
    // muscles
    card(60, 460, 720, 380, 'мышцы', 'слабость от бездействия или рефлекторного торможения при отёке и боли; дисбаланс силы и гибкости; несимметричная тяга деформирует сустав; хорошая поддержка защищает', ANAT.muscle, m('mus'));

    const setM = k => { const a = rad(90 + 14 * k), E = [520 + 110 * Math.cos(a), 760 + 110 * Math.sin(a)]; lowB.set([520, 768], E); mL.set([496, 660], [E[0] - 20, E[1] - 30]); mR.set([544, 660], [E[0] + 20, E[1] - 30]); mL.act(.8); };

    card(820, 660, 720, 180, 'активность и участие', 'ограничения дома, на работе, в обществе — от минимальных до значительных', COL.real, m('act'));

  ['ra', 'Ревматоидный артрит', (m, D) => {

    const DOM = [['суставы: сколько и какие', 5, 3], ['антитела в крови', 3, 2], ['острая фаза воспаления', 1, 1], ['симптомы ≥ 6 недель', 1, 1]];

  ['path', 'Что происходит в суставе', (m, D) => {

    lab(p, 'анкилоз', 640, 470, ...aj.stage([30, 4]), ANAT.bone, m('late', 1.2));
    infoCard(p, 820, 100, 720, 160, 'начало', 'синовиальная оболочка, края хряща, костномозговые пространства под хрящом', SYNOV_C, m('early'), { size: 21 });
    infoCard(p, 820, 275, 720, 160, 'паннус (pannus)', 'грануляционная ткань покрывает и разрушает хрящ, кость, связки капсулы; спайки', PANNUS_C, m('pannus'), { size: 21 });

    const L = handMap(p, 300, 470, 1.25, m('active')), R = handMap(G(p, { x: 1600 - 0, s: 1 }), 0, 0, 1, null);
