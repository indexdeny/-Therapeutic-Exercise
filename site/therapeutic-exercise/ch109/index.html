// A standing figure for body maps; back = true draws the spine, the shoulder blades and the gluteal fold.
// f.loc(name, side) gives a local point (side −1 = the figure's left on screen, 1 = right).
function bodyFig(p, x, gy, s, t0, back = false) {
  const f = frontStand(p, x, gy, s, null, { muscles: false }), q = f.pts, line = mix('#d8d1c1', COL.board, .62);
  if (back) {

    path(f.g, `M${C[0]} ${C[1] - 8}L${P[0]} ${P[1] - 10}`, a);
    [-1, 1].forEach(k => {
      path(f.g, `M${C[0] + k * 12} ${C[1] + 6}L${C[0] + k * 40} ${C[1] + 4}L${C[0] + k * 18} ${C[1] + 46}Z`, { ...a, 'stroke-width': 1.6 });
      path(f.g, `M${P[0] + k * 4} ${P[1] + 26}Q${P[0] + k * 20} ${P[1] + 34} ${P[0] + k * 38} ${P[1] + 24}`, a);
    });
    path(f.g, `M${P[0]} ${P[1] - 6}V${P[1] + 26}`, a);
  }
  const L = {
    cerv: k => [q.Sc[0] + k * 8, q.Sc[1] - 8], rib: k => [q.Sc[0] + k * 25, q.Sc[1] + 20],
    epi: k => { const E = q.arms[k < 0 ? 0 : 1][0]; return [E[0] + k * 9, E[1]]; },
    knee: k => { const K = q.legs[k < 0 ? 0 : 1][0]; return [K[0] - k * 9, K[1] - 4]; },
    occ: k => [q.Hc[0] + k * 11, q.Hc[1] + 21], trap: k => [q.Sc[0] + k * 25, q.Sc[1] - 4], supra: k => [q.Sc[0] + k * 27, q.Sc[1] + 17],
    glut: k => [q.P[0] + k * 26, q.P[1] - 2], troch: k => [q.P[0] + k * 46, q.P[1] + 16],

}
// Tender points (dots) on a body figure; returns the group.
function tenderDots(f, names, t0, { col = TPC, r = 6, gap = .12 } = {}) {

    if (t0 !== null) pop(d, t0 + (i * 2 + j) * gap);

}
// A soft glow along body parts of a figure (local points), e.g. where it hurts.

}

  const fib = mk('path', { fill: 'none', stroke: mix(ANAT.muscle, '#ffffff', .45), 'stroke-width': 1.6, 'stroke-opacity': .75 }, g);

  const halo = mk('circle', { r: 0, fill: PAIN, 'fill-opacity': .28 }, g);

    Object.assign(s, q);

    ten.setAttribute('d', `M${f(x1 - tend)} 0H${f(x2 + tend)}`);
    belly.setAttribute('d', `M${f(x1)} 0C${f(x1 + a)} ${f(-hh * 1.33)} ${f(x2 - a)} ${f(-hh * 1.33)} ${f(x2)} 0C${f(x2 - a)} ${f(hh * 1.33)} ${f(x1 + a)} ${f(hh * 1.33)} ${f(x1)} 0Z`);

}

    prog(q => tr.act(.35 + .45 * wave(q * 26)), m('cause', 1), Math.max(2, D - m('cause', 1)), lin);
    txt(p2, 'долгое сидение, голова вперёд:', 330, 830, m('cause', 1), { size: 19, weight: 700, fill: MPS, anchor: 'middle' });
    txt(p2, 'мышцы шеи и плеча перегружены', 330, 858, m('cause', 1), { size: 19, weight: 700, fill: MPS, anchor: 'middle' });
    NOTE(p2, 330, 330, m('cause', 1));
    txt(p2, 'связаны с:', 640, 660, m('ev'), { size: 21, weight: 700, fill: COL.chalk });
    pillRow(p2, ['головные боли напряжения', 'боль в шее и плече'], 1090, 710, m('ev', .4), { col: COL.real, size: 20, gap: .6 });
    txt(p2, 'боль в пояснице: больше точек → сильнее боль и хуже сон', 1090, 780, m('ev', 3), { size: 20, weight: 700, fill: COL.bad, anchor: 'middle' });
  }],

  ['mmgmt', 'Лечение триггерных точек', (m, D) => {
    const p = panel(0);
    txt(p, 'что делает триггерная точка', 800, 56, m('imp'), { size: 28, weight: 700, anchor: 'middle', fill: MPS });
    // stretch: the band stops the muscle short and the point hurts
    const tm = tpMuscle(p, 420, 380, 420, m('imp'), { h: 56 });
    tm.set({ band: 1, tp: 1 });
    const st0 = m('imp', .5), stD = Math.max(3, m('three') - st0 - 4);
    prog(q => { const c = cyc(q, 2); tm.set({ stretch: .45 * c, hot: c }); }, st0, stD, lin);
    const arL = G(p, { o: 0 }), arR = G(p, { o: 0 });
    path(arL, 'M0 0h-60m14 -12l-14 12l14 12', { stroke: COL.chalk, 'stroke-width': 4, fill: 'none' }); path(arR, 'M0 0h60m-14 -12l14 12l-14 12', { stroke: COL.chalk, 'stroke-width': 4, fill: 'none' });
    put(arL, { x: 100, y: 380 }); put(arR, { x: 740, y: 380 }); show(arL, st0); show(arR, st0);
    pillRow(p, ['объём при растяжке меньше', 'сила меньше', 'растяжка болит'], 420, 500, m('imp', 1), { col: [COL.task, COL.whole, COL.bad], size: 19, gap: .8, space: 10 });
    // active vs latent
    const ta = tpMuscle(p, 1060, 300, 300, m('imp', 5.5), { h: 42, tend: 50 }), tl = tpMuscle(p, 1060, 570, 300, m('imp', 5.5), { h: 42, tend: 50 });
    ta.set({ band: 1, tp: 1 }); tl.set({ band: 1, tp: 1 });
    txt(p, 'активная', 860, 220, m('imp', 6), { size: 22, weight: 700, fill: PAIN });
    txt(p, 'латентная', 860, 490, m('imp', 8.2), { size: 22, weight: 700, fill: COL.whole });
    prog(q => ta.set({ hot: .55 + .45 * Math.sin(q * 50) }), m('imp', 6), Math.max(2, m('three') - m('imp', 6)), lin);
    const [kx, ky] = ta.knot(), ref = path(p, `M${kx} ${ky - 30}c20 -30 50 -30 70 -10s50 20 80 -10`, { stroke: PAIN, 'stroke-width': 3.5, fill: 'none', 'stroke-dasharray': '7 6' }, { d: 0 });
    draw(ref, m('imp', 6.3), 1);
    txt(p, 'своя схема боли', kx + 160, ky - 54, m('imp', 6.5), { size: 18, weight: 600, fill: PAIN });
    txt(p, 'молчит, пока на неё не надавят', 1060, 665, m('imp', 8.2), { size: 19, fill: COL.chalk, anchor: 'middle', weight: 600 });
    const [lx, ly] = tl.knot(), fg = finger(p, m('imp', 8.8));
    put(fg, { x: lx, y: ly - 90 }); tw(fg, { y: ly - 6 }, m('imp', 9.1), .6);
    prog(q => tl.set({ hot: q }), m('imp', 9.7), .5);
    // the three parts of treatment on a fresh panel
    const p2 = panel(m('three'));
    txt(p2, 'лечение: три части', 800, 56, m('three'), { size: 28, weight: 700, anchor: 'middle', fill: MPS });
    const C = [[60, '1', 'убрать перегрузку', 'осанка, повторяющиеся действия, подъём тяжестей; короткие перерывы; при необходимости — оценить рабочее место', COL.task, 't1'],
      [565, '2', 'устранить триггерную точку', 'сокращение – расслабление – пассивная растяжка (повторять, пока мышца не удлинится); то же с активной растяжкой; освобождение триггерной точки; охлаждающий спрей + растяжка; физические факторы; сухая игла или инъекция', MPS, 't2'],
      [1070, '3', 'укрепить мышцы', 'упражнения на выносливость: мышцы кора и стабилизаторы лопатки', COL.good, 't3']];
    C.forEach(([x, n, h, s, c, k]) => {
      const g0 = G(p2, { o: 0 });
      roundBox(g0, x, 100, 470, 330, c, PANEL, 2.5);
      mk('circle', { cx: x + 40, cy: 140, r: 22, fill: c }, g0);
      T(g0, n, { x: x + 40, y: 149, size: 24, weight: 700, fill: COL.board, anchor: 'middle' });
      put(para(g0, h, x + 74, 149, null, { size: 23, weight: 700, fill: c, maxW: 380 }), { o: 1 });
      put(para(g0, s, x + 24, 210, null, { size: 20, maxW: 426 }), { o: 1 });
      show(g0, m(k));
    });
    // dry needling: the needle goes into the point and the knot lets go
    const nm = tpMuscle(p2, 800, 580, 340, m('dn'), { h: 44, tend: 46 });
    nm.set({ band: 1, tp: 1, hot: .8 });
    const [nx, ny] = nm.knot(), nd = G(p2, { x: nx + 70, y: ny - 110, o: 0 });
    path(nd, 'M0 0L-70 110', { stroke: '#d9dde0', 'stroke-width': 2 }); path(nd, 'M0 0l14 -22', { stroke: '#9fb0bf', 'stroke-width': 9, 'stroke-linecap': 'round' });
    show(nd, m('dn', .3)); tw(nd, { x: nx + 50, y: ny - 80 }, m('dn', .8), .7);
    prog(q => nm.set({ ease: q, hot: .8 * (1 - q) }), m('dn', 1.6), 1.6);
    hide(nd, m('dn', 3.4));
    txt(p2, 'сухая игла: низкий риск; боль меньше, функция лучше', 800, 670, m('dn', 1), { size: 20, weight: 700, fill: COL.chalk, anchor: 'middle' });
    // strengthen last
    pillRow(p2, ['1 · убрать перегрузку', '2 · устранить точку', '3 · укреплять'], 800, 770, m('tip'), { col: [COL.task, MPS, COL.good], size: 21, gap: .5, space: 60 });
    txt(p2, 'укреплять — когда объём восстановлен и с триггерной точкой справились', 800, 860, m('tip', .5), { size: 22, weight: 700, fill: COL.good, anchor: 'middle' });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-order', prompt: ['Миофасциальный синдром от хронической перегрузки. В каком порядке?'],
    build: grid([
      { parts: ['Исправить осанку и рабочее место, научить делать перерывы'], ans: ['1'], why: 'Сначала — убрать перегрузку.' },
      { parts: ['Сокращение – расслабление – растяжка, сухая игла'], ans: ['2'], why: 'Затем — устранить триггерную точку.' },
      { parts: ['Упражнения на выносливость для мышц кора'], ans: ['3'], why: 'Укреплять — когда объём восстановлен.' },
      { parts: ['Охлаждающий спрей с растяжкой'], ans: ['2'], why: 'Это способ устранить триггерную точку.' },
      { parts: ['Упражнения для стабилизаторов лопатки'], ans: ['3'], why: 'Это укрепление — последний шаг.' },
    ], [['1', 'Сначала', COL.task], ['2', 'Затем', MPS], ['3', 'В конце', COL.good]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Фибромиалгия — распространённая боль дольше 3 месяцев, болезненные точки, неосвежающий сон и усталость: нервная система иначе обрабатывает боль.', 'w1'],
     ['Ведение: распределять активность; аэробные и силовые упражнения — начинать ниже обычных норм и наращивать медленно.', 'w2'],
     ['Миофасциальный синдром — триггерные точки в тугом тяже мышцы с отражённой болью по своей схеме.', 'w3'],
     ['Лечение: убрать перегрузку → устранить триггерную точку → укреплять мышцы на выносливость.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: i < 2 ? FM : MPS }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-fm', prompt: ['Женщина 45 лет: распространённая боль полгода, неосвежающий сон, усталость. В хорошие дни делает всё сразу, потом 2–3 дня лежит. С чего начать?'],
    build: choice([
      ['Аэробные упражнения ниже обычных рекомендаций с медленным ростом и обучение распределять активность'],
      ['Сразу силовая программа по полным рекомендациям ACSM'],
      ['Покой, пока боль не пройдёт'],
      ['Только растяжка: аэробная нагрузка вызовет обострение'],
    ], 0, 'Нагрузку начинают ниже обычных норм и наращивают медленно; распределение активности сглаживает «хорошие» и «плохие» дни.',
    [null, 'Переносимость нагрузки низкая: начинают ниже обычных рекомендаций.', 'Упражнения уменьшают симптомы; покой не лечит фибромиалгию.', 'Аэробные упражнения как раз лучше всего изучены и уменьшают симптомы.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-mps', prompt: ['Офисный работник: боль в шее и плече. В верхней части трапециевидной мышцы — тугой тяж с точкой, надавливание на которую вызывает привычную боль. Что делать в первую очередь?'],
    build: choice([
      ['Оценить рабочее место и осанку, научить коротким перерывам; затем — устранять триггерную точку'],
      ['Сразу силовые упражнения для трапециевидной мышцы с большим весом'],
      ['Это фибромиалгия: только аэробная программа'],
      ['Ничего не делать: такие точки безвредны'],
    ], 0, 'Сначала убирают хроническую перегрузку, затем устраняют триггерную точку, укрепляют — в конце.',
    [null, 'Укреплять начинают, когда объём восстановлен и с точкой справились.', 'Регионарная боль с тугим тяжем и триггерной точкой — миофасциальный синдром.', 'Активная точка вызывает боль, уменьшает объём и силу — её лечат.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
