const HEAD = COL.whole, PAIN = '#ff5a3c', OP = '#e8b04a', CLAST = '#9b6fd0', BLAST = '#5aa7d6';
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19 } = {}) {
  const g = G(p, { o: 0 }), right = tx > x;
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: right ? 'end' : 'start' });
  path(g, `M${x + (right ? 8 : -8)} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
let SEED = 7;
const rnd = () => (SEED = SEED * 16807 % 2147483647) / 2147483647;
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
function glowSpot(f, P, rx, ry, t0, col = PAIN) {
  const e = mk('ellipse', { cx: P[0], cy: P[1], rx, ry, fill: col, 'fill-opacity': .45, opacity: 0 }, f.g);
  if (t0 !== null) show(e, t0, .6);
  return e;
}

// Spongy bone in section: a cortical shell round a lattice of trabeculae over dark marrow.
// set({ loss }) 0..1: the trabeculae thin and some vanish, the cortex thins.
function lattice(p, x, y, w, h, t0 = null, { seed = 3, n = 7 } = {}) {
  const g = G(p, { o: 0 }), B = ANAT.bone, line = mix(B, '#000000', .45);
  mk('rect', { x, y, width: w, height: h, rx: 18, fill: '#5b3833' }, g);
  SEED = seed;
  const rows = Math.max(2, Math.round(n * h / w)), dx = w / n, dy = h / rows, N = [];
  for (let r = 0; r <= rows; r++) {
    N.push([]);
    for (let c = 0; c <= n; c++) {
      const edge = r === 0 || c === 0 || r === rows || c === n;
      N[r].push([x + c * dx + (edge ? 0 : (rnd() - .5) * dx * .55), y + r * dy + (edge ? 0 : (rnd() - .5) * dy * .55)]);
    }
  }
  const S = [], f = v => v.toFixed(1), gO = mk('g', {}, g), gC = mk('g', {}, g);
  const strut = (A, Bq) => {
    const d = `M${f(A[0])} ${f(A[1])}L${f(Bq[0])} ${f(Bq[1])}`;
    S.push({ o: mk('path', { d, stroke: line, 'stroke-linecap': 'round' }, gO), c: mk('path', { d, stroke: B, 'stroke-linecap': 'round' }, gC), r: rnd() });
  };
  for (let r = 0; r <= rows; r++) for (let c = 0; c <= n; c++) {
    if (c < n && r > 0 && r < rows) strut(N[r][c], N[r][c + 1]);
    if (r < rows && c > 0 && c < n) strut(N[r][c], N[r + 1][c]);
    if (r < rows && c < n && rnd() < .35) strut(N[r][c], N[r + 1][c + 1]);
  }
  const cort = mk('rect', { x, y, width: w, height: h, rx: 18, fill: 'none', stroke: B }, g);
  const cortL = mk('rect', { x, y, width: w, height: h, rx: 18, fill: 'none', stroke: line, 'stroke-width': 2 }, g);
  const L = { g, set({ loss = 0 }) {
    const wd = 8 * (1 - .62 * loss);
    S.forEach(s => {
      const o = clamp((s.r - .55 * loss) / .08, 0, 1);
      s.o.setAttribute('stroke-width', f(wd + 3)); s.c.setAttribute('stroke-width', f(wd));
      s.o.setAttribute('opacity', f(o)); s.c.setAttribute('opacity', f(o));
    });
    cort.setAttribute('stroke-width', f(22 * (1 - .6 * loss)));
    return L;
  } };
  L.set({});
  if (t0 !== null) show(g, t0);
  return L;
}
// A column of vertebral bodies in side view (front to the right), built up from the lower back corner (x, y).
// set({ wedge, load }): wedge 0..1 — the middle bodies lose front height and the column bends forward (kyphosis);
// load 0..1 — the front of the middle body is squeezed (red).
function vertStack(p, x, y, s = 1, t0 = null, { n = 5 } = {}) {
  const g = G(p, { x, y, s, o: 0 }), defs = mk('defs', {}, g), B = ANAT.bone, line = mix(B, '#000000', .5);
  const D = 70, HP = 46, DISC = 13, discs = [], posts = [], bodies = [];
  for (let i = 0; i < n; i++) {
    if (i) discs.push(mk('path', { fill: '#8fb8c8', 'fill-opacity': .85, stroke: '#5d8797', 'stroke-width': 1.5 }, g));
    posts.push(mk('path', { fill: 'none', stroke: mix(B, '#000000', .15), 'stroke-width': 11, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g));
    const sh = shadeGrad(defs, B);
    bodies.push({ e: mk('path', { fill: sh.url, stroke: line, 'stroke-width': 2, 'stroke-linejoin': 'round' }, g), sh });
  }
  const sq = mk('path', { fill: PAIN, opacity: 0 }, g);
  const st0 = { wedge: 0, load: 0 }, v = { g, st: st0, mid: [0, 0] };
  const f = q => q[0].toFixed(1) + ' ' + q[1].toFixed(1), add = (A, d, k) => [A[0] + d[0] * k, A[1] + d[1] * k];
  v.set = o => {
    Object.assign(st0, o);
    let P = [0, 0], th = 0, prev = null;
    for (let i = 0; i < n; i++) {
      const a = [Math.cos(rad(th)), Math.sin(rad(th))], u = [Math.sin(rad(th)), -Math.cos(rad(th))];
      const mid = i > 0 && i < n - 1, ha = HP * (1 - (mid ? .42 * st0.wedge : 0) - (i === 2 ? .1 * st0.load : 0));
      const PB = P, AB = add(PB, a, D), AT = add(AB, u, ha), PT = add(PB, u, HP);
      if (prev) discs[i - 1].setAttribute('d', `M${f(prev[0])}L${f(prev[1])}L${f(AB)}L${f(PB)}Z`);
      bodies[i].e.setAttribute('d', `M${f(PB)}L${f(AB)}Q${f(add(add(AB, u, ha / 2), a, 6))} ${f(AT)}L${f(PT)}Q${f(add(add(PB, u, HP / 2), a, -4))} ${f(PB)}Z`);
      bodies[i].sh.aim(add(PB, a, D / 2), add(PT, a, D / 2), D / 2);
      const pm = add(PB, u, HP * .55);
      posts[i].setAttribute('d', `M${f(pm)}L${f(add(pm, a, -26))}L${f(add(add(pm, a, -54), u, -20))}`);
      if (i === 2) {
        sq.setAttribute('d', `M${f(add(PB, a, D * .55))}L${f(AB)}L${f(AT)}L${f(add(add(PB, a, D * .55), u, (HP + ha) / 2))}Z`);
        v.mid = add(add(PB, a, D), u, ha / 2);
      }
      prev = [PT, AT];
      th += Math.atan2(HP - ha, D) * 180 / Math.PI;
      P = add(PT, [Math.sin(rad(th)), -Math.cos(rad(th))], DISC);
    }

    return v;
  };

  v.set({});
  if (t0 !== null) show(g, t0);
  return v;
}
// The bone surface in close-up: an osteoclast digs a pit, osteoblasts fill it with new bone.
// set({ dig, fill }) 0..1 each.
function remodel(p, x, y, w, t0 = null, { h = 130 } = {}) {
  const g = G(p, { o: 0 }), B = ANAT.bone, line = mix(B, '#000000', .45), cx = x + w / 2, pw = 130, f = v => v.toFixed(1);
  const bone = mk('path', { fill: B, stroke: line, 'stroke-width': 2 }, g);
  [[.16, .55], [.32, .78], [.72, .6], [.88, .74], [.5, .86]].forEach(([u, v]) => [16, 9, 3].forEach(r => mk('circle', { cx: x + w * u, cy: y + h * v, r, fill: 'none', stroke: line, 'stroke-width': 1.3, 'stroke-opacity': .6 }, g)));
  const neo = mk('path', { fill: '#bfe0ec', stroke: '#7fb0c4', 'stroke-width': 1.5 }, g);
  const oc = G(g, { o: 0 });
  mk('path', { d: 'M-52 0C-52 -34 52 -34 52 0C40 8 30 2 20 8C10 2 0 8 -10 2C-20 8 -30 2 -40 8C-46 6 -52 4 -52 0Z', fill: CLAST, stroke: '#5b3b8a', 'stroke-width': 2 }, oc);
  [-28, -10, 8, 26].forEach(dx => mk('circle', { cx: dx, cy: -12, r: 6, fill: '#4a2c74' }, oc));
  const obs = [-2, -1, 0, 1, 2].map(i => { const e = G(g, { o: 0 }); mk('rect', { x: -11, y: -20, width: 22, height: 20, rx: 6, fill: BLAST, stroke: '#2f6f99', 'stroke-width': 1.5 }, e); mk('circle', { cx: 0, cy: -11, r: 4.5, fill: '#1f4d6b' }, e); return { e, i }; });
  const s0 = { dig: 0, fill: 0 }, r = { g, st: s0 };
  r.set = o => {
    Object.assign(s0, o);
    const d = 50 * s0.dig, top = d * (1 - s0.fill), x0 = cx - pw / 2;
    bone.setAttribute('d', `M${x} ${y + h}V${y}H${f(x0)}Q${cx} ${f(y + 2 * d)} ${f(cx + pw / 2)} ${y}H${x + w}V${y + h}Z`);
    neo.setAttribute('d', s0.fill > 0 && d > 0 ? `M${f(x0)} ${y}Q${cx} ${f(y + 2 * d)} ${f(cx + pw / 2)} ${y}Q${cx} ${f(y + 2 * top)} ${f(x0)} ${y}Z` : '');
    put(oc, { x: cx, y: y + d * .8, o: s0.dig > 0 ? clamp(1 - s0.fill * 5, 0, 1) : 0 });
    obs.forEach(({ e, i }) => { const t = .5 + i * .19; put(e, { x: x0 + pw * t, y: y + 4 * t * (1 - t) * top, o: s0.fill > 0 ? clamp(s0.fill * 5, 0, 1) * clamp((1 - s0.fill) * 12, 0, 1) : 0 }); });
    return r;
  };
  r.set({});
  if (t0 !== null) show(g, t0);
  return r;
}
// A long bone standing upright (centre x, y; length L). set({ bend, build }): bend 0..1 — the shaft bows under load and
// its surface glows (strain); build 0..1 — osteoblasts line the shaft and the cortex thickens.
function bendBone(p, x, y, L, t0 = null, { r = 30 } = {}) {
  const g = G(p, { o: 0 }), defs = mk('defs', {}, g), B = ANAT.bone, line = mix(B, '#000000', .5), f = v => v.toFixed(1), id = 'bb' + (++SHADE_ID);
  const gr = mk('linearGradient', { id, x1: 0, y1: 0, x2: 1, y2: 0 }, defs);
  [[0, mix(B, '#ffffff', .35)], [.45, B], [1, mix(B, '#000000', .42)]].forEach(([o, c]) => mk('stop', { offset: o, 'stop-color': c }, gr));
  const glow = mk('path', { fill: 'none', stroke: ANAT.taut, 'stroke-opacity': .55, 'stroke-linecap': 'round' }, g);
  const shaft = mk('path', { fill: `url(#${id})`, stroke: line, 'stroke-width': 2 }, g);
  const ends = [-1, 1].map(k => mk('ellipse', { cx: x, cy: y + k * L / 2, rx: r * 1.5, ry: r * .85, fill: `url(#${id})`, stroke: line, 'stroke-width': 2 }, g));
  const cells = [-3, -2, -1, 0, 1, 2, 3].map(i => mk('circle', { r: 5.5, fill: BLAST, stroke: '#1f4d6b', 'stroke-width': 1.5, opacity: 0 }, g));
  const s0 = { bend: 0, build: 0 }, b = { g, st: s0 };
  b.set = o => {
    Object.assign(s0, o);
    const bow = 22 * s0.bend, rr = r * (1 + .22 * s0.build), y0 = y - L / 2 + r * .5, y1 = y + L / 2 - r * .5;
    shaft.setAttribute('d', `M${f(x - rr)} ${f(y0)}Q${f(x - rr + 2 * bow)} ${y} ${f(x - rr)} ${f(y1)}H${f(x + rr)}Q${f(x + rr + 2 * bow)} ${y} ${f(x + rr)} ${f(y0)}Z`);
    glow.setAttribute('d', `M${f(x + rr)} ${f(y0 + 30)}Q${f(x + rr + 2 * bow)} ${y} ${f(x + rr)} ${f(y1 - 30)}`);
    glow.setAttribute('stroke-width', f(14 * s0.bend));
    cells.forEach((c, i) => { const t = (i + 3.5) / 7.5, yy = y0 + (y1 - y0) * t, xx = x + rr + 2 * bow * 2 * t * (1 - t) + 8; c.setAttribute('cx', f(xx)); c.setAttribute('cy', f(yy)); c.setAttribute('opacity', f(s0.build)); });
    return b;
  };
  b.set({});
  if (t0 !== null) show(g, t0);
  return b;
}
// A weighted vest on a side-view figure (drawn under the near arm): w = [back, front] numbers of weight blocks.
function vest(f, w = [1, 2]) {
  const g = mk('g', {}, f.g), H = f.pts.H, S = f.pts.Sh;
  f.g.insertBefore(g, f.parts.uaN.e);
  const dx = S[0] - H[0], dy = S[1] - H[1], L = Math.hypot(dx, dy), u = [dx / L, dy / L], n = [-u[1] * f.dir, u[0] * f.dir];
  const P = (al, of) => [H[0] + u[0] * al + n[0] * of, H[1] + u[1] * al + n[1] * of], fv = q => q[0].toFixed(1) + ' ' + q[1].toFixed(1);
  // n points to the front of a figure facing right
  mk('path', { d: `M${fv(P(30, -31))}L${fv(P(L - 6, -33))}L${fv(P(L - 6, 33))}L${fv(P(30, 30))}Z`, fill: '#3f5d7a', stroke: '#26394b', 'stroke-width': 2, 'stroke-linejoin': 'round' }, g);
  const blk = (al, of, k) => mk('path', { d: `M${fv(P(al, of))}L${fv(P(al + 18, of))}L${fv(P(al + 18, of + k * 12))}L${fv(P(al, of + k * 12))}Z`, fill: '#a9b5bd', stroke: '#5f6b72', 'stroke-width': 1.5 }, g);
  for (let i = 0; i < w[0]; i++) blk(70 + i * 22, -30, -1);
  for (let i = 0; i < w[1]; i++) blk(56 + i * 22, 30, 1);
  return g;
}

    txt(p, 'сгибание с поворотом туловища', 1330, 560, m('rot', .5), { size: 19, weight: 600, fill: COL.chalk, anchor: 'middle' });
    infoCard(p, 60, 640, 860, 220, 'почему', 'сгибание повышает риск компрессионного перелома позвонка; без поворота меньше нагрузка на позвонки и диски', COL.bad, m('flex', 3), { size: 21 });
    infoCard(p, 960, 640, 580, 220, 'сопротивление', 'увеличивать постепенно, но в пределах прочности кости', COL.task, m('prog'), { size: 21 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-op', prompt: ['Подходит ли это при остеопорозе?'],
    build: grid([
      { parts: ['Скручивания лёжа на спине для пресса'], ans: ['n'], why: 'Нет: сгибание повышает риск компрессионного перелома позвонка.' },
      { parts: ['Быстрая ходьба 30 минут 5 дней в неделю'], ans: ['y'], why: 'Да.' },
      { parts: ['Наклон вперёд с поворотом, чтобы поднять груз'], ans: ['n'], why: 'Нет: сгибание с поворотом нагружает позвонки и диски.' },
      { parts: ['Силовые 2–3 раза в неделю, 8–12 повторений'], ans: ['y'], why: 'Да.' },
      { parts: ['Рюкзак 5 кг на спине после перелома позвонка'], ans: ['n'], why: 'Нет: на спине — не больше 1 кг.' },
    ], [['y', 'Подходит', COL.good], ['n', 'Нет', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Остеопороз — потеря минералов и слабость кости: Т-критерий −2,5 и ниже.', 'w1'],
     ['Остеокласты рассасывают, остеобласты строят; пик костной массы — к 30 годам, дальше рассасывание преобладает, особенно в менопаузе.', 'w2'],
     ['Нагрузка весом и сила мышц деформируют кость и стимулируют её построение: упражнения с весом, силовые, аэробные, на равновесие.', 'w3'],
     ['Избегать сгибания позвоночника и сгибания с поворотом.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: OP }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-op', prompt: ['Женщина 68 лет, остеопороз (Т = −2,8), год назад — компрессионный перелом позвонка. Какую программу выбрать?'],
    build: choice([
      ['Ходьба и лестница, силовые 2–3 раза в неделю, тренировка равновесия; без сгибания позвоночника'],
      ['Скручивания и подъёмы туловища, чтобы укрепить пресс'],
      ['Только велоэргометр, чтобы не нагружать кость'],
      ['Покой, чтобы не было нового перелома'],
    ], 0, 'Нагрузка весом, сопротивление и равновесие укрепляют кость и снижают риск падений; сгибания позвоночника избегают.',
    [null, 'Сгибание повышает риск компрессионного перелома позвонка.', 'Кости нужна нагрузка весом и сопротивление; велоэргометр — без нагрузки весом.', 'Бездействие ускоряет потерю кости.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-vest', prompt: ['Пациентка с остеопорозом и переломом позвонка в анамнезе хочет ходить с утяжелённым жилетом. Что посоветовать?'],
    build: choice([
      ['Можно: не больше 1 кг сзади или 2 кг спереди'],
      ['Чем тяжелее, тем лучше: 10 кг на спине'],
      ['Жилеты при остеопорозе запрещены'],
      ['Лучше носить груз в руках, наклоняясь вперёд'],
    ], 0, 'Утяжелённый жилет повышает плотность кости; после перелома позвонка вес ограничивают: до 1 кг сзади или до 2 кг спереди.',
    [null, 'После перелома позвонка на спине — не больше 1 кг.', 'Жилеты и рюкзаки повышают плотность кости — их рекомендуют с ограничением веса.', 'Наклон вперёд с грузом — сгибание позвоночника, его избегают.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
