// A tendon lengthened by a Z-cut (horizontal, from x, half-width r): set({ cut, slide }) — cut 0..1 draws the Z;

function zTendon(p, x, y, L, t0 = null, { r = 22 } = {}) {

  const sut = G(g, { o: 0 });
  const S0 = { cut: 0, slide: 0 }, e = { g, st: S0 };
  e.set = o => {
    Object.assign(S0, o);
    const d = S0.slide;
    left.setAttribute('d', d > 0 ? `M${x} ${y - r}H${a}V${y}H${b}V${y + r}H${x}Z` : `M${x} ${y - r}H${x + L}V${y + r}H${x}Z`);
    right.setAttribute('d', d > 0 ? `M${f1(a + d)} ${y - r}H${f1(x + L + d)}V${y + r}H${f1(b + d)}V${y}H${f1(a + d)}Z` : '');
    zl.setAttribute('d', `M${a} ${y - r}V${y}H${b}V${y + r}`);
    zl.setAttribute('stroke-dasharray', `${f1(S0.cut)} 1`);
    zl.setAttribute('opacity', d > 0 ? 0 : 1);
    sut.replaceChildren();

    put(sut, { o: d > 0 ? 1 : 0 });
    return e;
  };
  e.set({});
  if (t0 !== null) show(g, t0);
  return e;
}
// The carpal tunnel in section: the transverse ligament arches over tendons and the median nerve; set({ squeeze, release }).

  const nerve = mk('ellipse', { cx: -10, cy: -18, rx: 18, ry: 18, fill: NERVE, stroke: '#8a7a40', 'stroke-width': 2 }, g);
  const lig = mk('path', { fill: 'none', stroke: '#c9d2d8', 'stroke-width': 12, 'stroke-linecap': 'round' }, g);
  const S0 = { squeeze: 0, release: 0 }, e = { g, st: S0 };
  e.set = o => {
    Object.assign(S0, o);
    const sq = S0.squeeze * (1 - S0.release), top = -40 + 14 * sq;

// Articular cartilage over subchondral bone with a defect. set({ holes, blood, fibro, patch, cells, plugs }).
function cartDefect(p, x, y, w, t0) {

// A total hip replacement in section (right hip, front view): pelvis with a cup, the femur with a stem and a ball.
// set({ arth, impl, cement, porous }): arth — a worn joint; impl — the components; cement / porous — the fixation.
function hipTHA(p, x, y, s, t0) {

  const cupBone = mk('path', { d: 'M-60 -70A62 62 0 0 1 60 -70', fill: 'none', stroke: '#a8d4e0', 'stroke-width': 8 }, g);
  const fem = G(g, {});
  mk('path', { d: 'M-30 -30L40 40L50 260H110L100 20L60 -20Z', fill: ANAT.bone, stroke: line, 'stroke-width': 2 }, fem);
  const head = mk('circle', { cx: 0, cy: -60, r: 56, fill: ANAT.bone, stroke: line, 'stroke-width': 2 }, fem);
  const worn = G(g, { o: 0 }); path(worn, 'M-50 -90L-30 -78M10 -112L22 -96M40 -86L30 -70', { stroke: '#8a3a32', 'stroke-width': 3 });
  const imp = G(g, { o: 0 });

  const porous = G(imp, { o: 0 }); for (let i = 0; i < 18; i++) mk('circle', { cx: 64 + (i % 3) * 10, cy: 40 + Math.floor(i / 3) * 34, r: 3, fill: '#6f7c85' }, porous);
  mk('path', { d: 'M-70 -66A70 70 0 0 1 70 -66', fill: 'none', stroke: METAL, 'stroke-width': 12 }, imp);
  mk('path', { d: 'M-58 -66A58 58 0 0 1 58 -66', fill: 'none', stroke: PLAST, 'stroke-width': 8 }, imp);
  mk('circle', { cx: 0, cy: -60, r: 46, fill: METAL, stroke: '#6f7c85', 'stroke-width': 2 }, imp);
