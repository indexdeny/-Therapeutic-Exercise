  "мышечно-кожный (C5, 6)\nне согнуть локоть с супинированным предплечьем": "не согнуть локоть с супинированным предплечьем",
  "срединный (C6–8)\nкруглый пронатор: как запястный канал + мышцы предплечья; в кисть — через запястный канал": "круглый пронатор, запястный канал",
  "локтевой (C8, T1)\nкубитальный канал, головки локтевого сгибателя запястья, канал Гийона → частичная когтеобразная кисть": "частичная когтеобразная кисть",

const HEAD = COL.whole, NV = NERVE_C, PAIN = '#ff5a3c';
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19 } = {}) {
  const g = G(p, { o: 0 }), right = tx > x;
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: right ? 'end' : 'start' });
  path(g, `M${x + (right ? 8 : -8)} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
// Two vertebrae in side view (front to the left) with the intervertebral foramen and the root in it.
// set({ narrow, ext }): narrow 0..1 — the disc bulges and a spur grows into the foramen; ext 0..1 — the upper vertebra
// tips back (extension) and closes the foramen further. The root reddens as it is squeezed.
function foramen(p, x, y, s, t0) {
  const g = G(p, { x, y, s, o: 0 }), B = ANAT.bone, line = mix(B, '#000000', .45);
  const low = G(g, {}), up = G(g, {});
  const body = (gg, yy) => { mk('rect', { x: -150, y: yy, width: 150, height: 90, rx: 14, fill: B, stroke: line, 'stroke-width': 2 }, gg); mk('path', { d: `M0 ${yy + 10}H40V${yy + 30}H120L150 ${yy + 50}L120 ${yy + 70}H40V${yy + 80}H0Z`, fill: B, stroke: line, 'stroke-width': 2 }, gg); };
  body(low, 30); body(up, -100);
  const disc = mk('path', { fill: '#8fb8c8', stroke: '#5d8797', 'stroke-width': 1.5 }, g);
  const spur = mk('path', { fill: B, stroke: line, 'stroke-width': 2 }, g);
  const hole = mk('ellipse', { cx: 30, cy: -2, rx: 26, ry: 40, fill: COL.board, stroke: '#5c6b68', 'stroke-width': 2 }, g);
  const root = mk('circle', { cx: 30, cy: -2, r: 15, fill: NV, stroke: '#9b7d24', 'stroke-width': 2 }, g);
  g.appendChild(up);
  const S = { narrow: 0, ext: 0 }, e = { g, st: S };
  e.set = o => {
    Object.assign(S, o);
    const b = 18 * S.narrow, sq = clamp(S.narrow * .6 + S.ext * .5, 0, 1);
    disc.setAttribute('d', `M-150 -10H0Q${f1(8 + b)} 10 0 30H-150Z`);
    spur.setAttribute('d', `M44 30L${f1(44 - 18 * S.narrow)} ${f1(30 - 22 * S.narrow)}L70 30Z`);
    put(up, { r: -6 * S.ext });
    hole.setAttribute('rx', f1(26 - 8 * sq)); hole.setAttribute('ry', f1(40 - 16 * sq));
    root.setAttribute('r', f1(15 - 3 * sq)); root.setAttribute('fill', mix(NV, PAIN, clamp(sq * 1.4 - .2, 0, 1)));
    return e;
  };
  e.set({});
  if (t0 !== null) show(g, t0);
  return e;
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Где повреждаются нервы', (m, D) => {

  ['roots', 'Корешки', (m, D) => {

    lab(p, 'диск и костный шип сужают отверстие', 640, 600, 330 + 20 * 1.6, 400 + 10 * 1.6, '#8fb8c8', m('sten', 1.8));

    pillRow(p, ['дегенерация диска и суставов', 'грыжа диска', 'спондилолистез'], 1180, 160, m('sten', .5), { col: COL.task, size: 19, gap: .8, space: 10 });
    infoCard(p, 820, 210, 720, 170, 'если корешок натягивают спайки', 'тесты подвижности нерва воспроизводят симптомы при наклоне позвоночника в противоположную сторону', COL.real, m('adh'), { size: 21 });
    // dermatome bands on an arm (schematic)
    const f = frontStand(p, 1180, 870, 1.05, m('derm'), { muscles: false, pose: { aR: 24, eR: 4 } }), Q = f.pts;
    const S = P => f.at(P), arm = Q.arms[1], mid = (A, B, k) => [A[0] + (B[0] - A[0]) * k, A[1] + (B[1] - A[1]) * k];
    const bands = [['C5', [Q.Sh[1], mid(Q.Sh[1], arm[0], .6)], '#e2574c'], ['C6', [mid(arm[0], arm[1], .3), arm[2]], '#f0a04b'], ['T1', [mid(Q.Sh[1], arm[0], .6), mid(arm[0], arm[1], .3)], '#5aa7d6']];
    bands.forEach(([s, [A, B], c], i) => { const e = path(p, `M${S(A).map(f1).join(' ')}L${S(B).map(f1).join(' ')}`, { stroke: c, 'stroke-width': 16, 'stroke-opacity': .6 }, { o: 0 }); show(e, m('derm', .6 + i * .5)); });
    pillRow(p, ['C5', 'C6', 'T1'], 1430, 560, m('derm', .6), { col: ['#e2574c', '#f0a04b', '#5aa7d6'], size: 19, gap: .5, space: 8 });
    pill(p, 'схема', 1430, 610, m('derm'), { col: COL.dim, size: 17 });
    infoCard(p, 60, 750, 680, 120, 'верхний квадрант C5–T1, нижний L1–S3', 'симптомы — по дерматомам и миотомам', NV, m('derm'), { size: 21 });
  }],

  ['myo', 'Миотомы', (m, D) => {
    const p = panel(0);
    txt(p, 'ключевые мышцы для проверки миотомов (блок 13.2)', 800, 56, m('myo'), { size: 28, weight: 700, anchor: 'middle', fill: NV });
    const U = [['C5', 'отведение плеча', 'c5'], ['C6', 'сгибание локтя, разгибание кисти', 'c6'], ['C7', 'разгибание локтя, сгибание кисти', 'c7'], ['C8', 'разгибание большого пальца', 'c8'], ['T1', 'отведение пальцев', 't1']];
    const L = [['L1–2', 'сгибание бедра', 'l3'], ['L3', 'разгибание колена', 'l3'], ['L4', 'тыльное сгибание стопы', 'l4'], ['L5', 'разгибание большого пальца стопы', 'l5'], ['S1', 'пронация и подошвенное сгибание стопы, разгибание бедра', 's1'], ['S2', 'сгибание колена', 's1']];
    const row = (x, y, r, s, k, i, c) => { const g0 = G(p, { o: 0 }); put(pill(g0, r, x + 40, y, null, { col: c, size: 21 }), { o: 1 }); put(para(g0, s, x + 96, y + 7, null, { size: 21, maxW: 560 }), { o: 1 }); show(g0, m(k, (k === 'l3' || k === 's1') ? i * .8 : 0)); };
    U.forEach(([r, s, k], i) => row(60, 140 + i * 66, r, s, k, 0, COL.whole));
    L.forEach(([r, s, k], i) => row(820, 140 + i * 66, r, s, k, i === 1 || i === 5 ? 1 : 0, COL.task));
    txt(p, 'верхний квадрант', 380, 116, m('myo'), { size: 20, weight: 700, fill: COL.whole, anchor: 'middle' });
    txt(p, 'нижний квадрант', 1180, 116, m('l3'), { size: 20, weight: 700, fill: COL.task, anchor: 'middle' });
    // C5: shoulder abduction; L3: knee extension sitting
    const fa = frontStand(p, 380, 860, .7, m('c5'), { muscles: false });
    prog(q => fa.set({ aR: 8 + 80 * cyc(q, 2) }), m('c5', .3), Math.max(1, m('c6') - m('c5', .3)), lin);
    const fk = fig(p, { s: .7, o: 0, pose: { ...SIT, t: 0 } }); plant(fk, 'H', 1130, 760); show(fk.g, m('l3'));
    chair(p, 1130, 774, 870, m('l3'));
    prog(q => fk.set({ kN: 95 - 85 * cyc(q, 2) }), m('l3', .3), Math.max(1, m('l4') - m('l3', .3)), lin);
    prog(q => fk.set({ kN: 95, fN: 5 + 25 * cyc(q, 2) }), m('l4', .2), Math.max(1, m('l5') - m('l4', .2)), lin);
  }],

  ['plexus', 'Плечевое сплетение', (m, D) => {
    const p = panel(0);
    txt(p, 'плечевое сплетение (по мотивам рис. 13.3)', 800, 56, m('plexus'), { size: 28, weight: 700, anchor: 'middle', fill: NV });
    const R = ['C5', 'C6', 'C7', 'C8', 'T1'].map((s, i) => [120, 150 + i * 80]);
    const TR = [[330, 190], [330, 310], [330, 430]], CO = [[530, 220], [530, 330], [530, 440]];
    const NN = [['подмышечный', [760, 170]], ['мышечно-кожный', [760, 240]], ['лучевой', [760, 310]], ['срединный', [760, 380]], ['локтевой', [760, 450]]];
    const nl = [];
    [[0, 0], [1, 0], [2, 1], [3, 2], [4, 2]].forEach(([r, t]) => nl.push(nerveLine(p, [R[r], TR[t]], m('plexus'), { w: 8, n: 3 })));
    [[0, 0], [0, 1], [1, 0], [1, 1], [1, 2], [2, 1], [2, 2]].forEach(([t, c]) => nl.push(nerveLine(p, [TR[t], CO[c]], m('plexus', .5), { w: 7, n: 3 })));
    [[1, 0], [1, 1], [1, 2], [0, 3], [2, 3], [2, 4]].forEach(([c, n2]) => nl.push(nerveLine(p, [CO[c], NN[n2][1]], m('plexus', 1), { w: 7, n: 3 })));
    ['C5', 'C6', 'C7', 'C8', 'T1'].forEach((s, i) => txt(p, s, 96, 157 + i * 80, m('plexus'), { size: 20, weight: 700, fill: COL.dim, anchor: 'end' }));
    NN.forEach(([s, P]) => txt(p, s, P[0] + 14, P[1] + 7, m('plexus', 1), { size: 19, weight: 600, fill: NV }));
    pillRow(p, ['корешки', 'стволы', 'пучки', 'нервы'], 440, 560, m('plexus', .5), { col: COL.dim, size: 18, gap: .3, space: 40 });
    prog(q => nl.forEach((n, i) => n.set({ taut: q * (i < 5 ? .8 : .5) })), m('weave', .5), 1.5);
    txt(p, 'натяжение одного нерва → на несколько корешков', 440, 620, m('weave'), { size: 21, weight: 700, fill: ANAT.taut, anchor: 'middle' });
    infoCard(p, 960, 100, 580, 150, 'передние ветви C5–T1', 'волокна переплетаются и распределяются по нервам', NV, m('plexus'), { size: 21 });
    infoCard(p, 960, 270, 580, 300, 'грудной выход: три места', 'межлестничный треугольник · рёберно-ключичное пространство · пространство под малой грудной мышцей; аномалии — шейное ребро, длинный отросток C7, неправильно сросшаяся ключица', COL.task, m('out'), { size: 21 });
    pill(p, 'подробнее — в уроке 123', 1250, 610, m('out', 2), { col: COL.dim, size: 18 });

  ['plexinj', 'Травмы сплетения', (m, D) => {

    // the mechanism of an upper trunk injury: the head goes one way, the shoulder is pushed down
    const f = frontStand(p, 360, 860, 1.5, m('up'), { muscles: false }), Q = f.pts, S = P => f.at(P);
    const up = nerveLine(p, [S([Q.Nk[0], Q.Nk[1] + 8]), S(Q.Sh[1]), S(Q.arms[1][0])], m('up'), { w: 9, n: 6 });
    const arw = G(p, { o: 0 }); show(arw, m('up', .5));
    prog(q => {
      f.set({ hd: -32 * q, aR: 6, eR: 4 });
      const sh = S(Q.Sh[1]);
      arw.replaceChildren(); path(arw, `M${f1(sh[0] + 10)} ${f1(sh[1] - 90)}V${f1(sh[1] - 20)}m-12 -14l12 14l12 -14`, { stroke: PAIN, 'stroke-width': 5 });
      up.reroute([S([Q.Nk[0], Q.Nk[1] + 8]), [sh[0], sh[1] + 30 * q], S(Q.arms[1][0])]); up.set({ taut: q, hot: q * .6 });

    txt(p, 'рука вверх — натяжение нижнего ствола', 360, 150, m('low', .6), { size: 21, weight: 700, fill: COL.whole, anchor: 'middle' });
    infoCard(p, 700, 100, 840, 210, 'верхний ствол (C5, C6) — чаще всего', 'нет отведения и наружной ротации плеча, слабы сгибание локтя и супинация — рука висит ладонью назад: поза «официанта, просящего чаевые»', NV, m('up'), { size: 21 });
    pillRow(p, ['родовая травма — паралич Эрба', '«жгучая» травма в американском футболе'], 1120, 350, m('erb'), { col: COL.task, size: 19, gap: 2.5, space: 12 });
    pill(p, 'C7 изолированно — редко', 1120, 410, m('mid'), { col: COL.dim, size: 19 });
    infoCard(p, 700, 450, 840, 200, 'нижний ствол (C8, T1)', 'шейное ребро или вытяжение руки вверх; при родах — паралич Клюмпке: слабость мелких мышц кисти', COL.whole, m('low'), { size: 21 });
    infoCard(p, 700, 680, 840, 170, 'полный родовой паралич сплетения', 'у трети тяжёлых больных — с синдромом Горнера', COL.bad, m('total'), { size: 21 });
    prog(q => { f.set({ hd: -32 * (1 - q), aR: 6 + 160 * q }); up.reroute([S([Q.Nk[0], Q.Nk[1] + 8]), S(Q.Sh[1]), S(Q.arms[1][0])]); up.set({ taut: q * .5, hot: 0 }); }, m('low', .5), 1.5);
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-myo', prompt: ['Какой корешок проверяет это движение?'],
    build: grid([
