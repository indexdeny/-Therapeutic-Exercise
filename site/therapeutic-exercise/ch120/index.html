const HEAD = COL.whole, NV = NERVE_C, PAIN = '#ff5a3c', PH = [COL.bad, COL.task, COL.good];
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
function numLine(p, n, str, x, y, col, t0, { size = 22, maxW = 860 } = {}) {
  const g = G(p, { o: 0 });
  mk('circle', { cx: x + 20, cy: y - 8, r: 19, fill: col }, g);
  T(g, String(n), { x: x + 20, y: y, size: 22, weight: 700, fill: COL.board, anchor: 'middle' });
  put(para(g, str, x + 54, y, null, { size, maxW }), { o: 1 });
  if (t0 !== null) show(g, t0);
  return g;
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19 } = {}) {
  const g = G(p, { o: 0 }), right = tx > x;
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: right ? 'end' : 'start' });
  path(g, `M${x + (right ? 8 : -8)} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
// One myelinated axon along its length (x … x + L at y) in its endoneurial tube, a lesion at fraction lx.
// set({ demy, cut, wall, tube, grow, block }): demy — myelin gone at the lesion; cut — the axon is broken there;
// wall — wallerian degeneration of the distal part (it fades in pieces); tube — the endoneurial tube is broken too;
// grow 0..1 — the sprout grows down the tube; block 0..1 — an impulse stops at the lesion (run(q) moves it).
function axonLong(p, x, y, L, t0 = null, { lx = .4 } = {}) {
  const g = G(p, { o: 0 }), X = x + L * lx;
  const tube = mk('path', { fill: 'none', stroke: ENDO_C, 'stroke-width': 2.5 }, g);
  const segs = [];
  for (let i = 0; i < 12; i++) { const a = x + i * L / 12 + 4, b = a + L / 12 - 8; segs.push({ e: mk('rect', { x: a, y: y - 13, width: b - a, height: 26, rx: 12, fill: MYEL_C, stroke: '#b9b2a2', 'stroke-width': 1.5 }, g), a, b }); }
  const axon = mk('path', { fill: 'none', stroke: NV, 'stroke-width': 8, 'stroke-linecap': 'round' }, g);
  const dist = mk('path', { fill: 'none', stroke: NV, 'stroke-width': 8, 'stroke-dasharray': '1 0' }, g);
  const sprout = mk('path', { fill: 'none', stroke: mix(NV, '#ffffff', .3), 'stroke-width': 7, 'stroke-linecap': 'round' }, g);
  const imp = mk('circle', { r: 10, fill: '#ffffff', opacity: 0 }, g);
  const S = { demy: 0, cut: 0, wall: 0, tube: 0, grow: 0 }, e = { g, X };
  e.set = o => {
    Object.assign(S, o);
    const gap = 14 * S.tube;
    tube.setAttribute('d', `M${x} ${y - 20}H${f1(X - gap)}M${f1(X + gap)} ${y - 20}H${x + L}M${x} ${y + 20}H${f1(X - gap)}M${f1(X + gap)} ${y + 20}H${x + L}`);
    tube.setAttribute('stroke', mix(ENDO_C, '#e2574c', S.tube));
    segs.forEach(sg => {
      const near = Math.abs((sg.a + sg.b) / 2 - X) < L / 12;
      sg.e.setAttribute('opacity', f1(near ? 1 - S.demy : (sg.a > X ? 1 - .85 * S.wall : 1)));
    });
    const c = 6 * S.cut;
    axon.setAttribute('d', `M${x} ${y}H${f1(X - c)}`);
    dist.setAttribute('d', `M${f1(X + c)} ${y}H${x + L}`);
    dist.setAttribute('stroke-dasharray', S.wall > 0 ? `${f1(26 - 18 * S.wall)} ${f1(4 + 20 * S.wall)}` : 'none');
    dist.setAttribute('stroke', mix(NV, '#5b5550', S.wall));
    sprout.setAttribute('d', S.grow > 0 ? `M${f1(X - c)} ${y}H${f1(X - c + (L * (1 - lx)) * S.grow)}` : '');
    return e;
  };
  e.run = (q, stopAtLesion) => { const xx = x + L * q, lim = stopAtLesion ? Math.min(xx, X - 8) : xx; imp.setAttribute('cx', f1(lim)); imp.setAttribute('cy', y); imp.setAttribute('opacity', q > 0 && q < 1 ? 1 : 0); };
  e.set({});
  if (t0 !== null) show(g, t0);
  return e;
}
// An axon ending at a target: kind 'ok' (right target, works), 'dead' (right target, degenerated), 'wrongR' (wrong
// receptor, own territory), 'wrongT' (receptor in another territory), 'none' (no target). Centre (x, y).
function outcome(p, x, y, kind, t0) {
  const g = G(p, { x, y, o: 0 });
  path(g, 'M-120 0H-30', { stroke: NV, 'stroke-width': 7 });
  const tgt = (cx, cy, col, shape) => shape === 'm' ? mk('ellipse', { cx, cy, rx: 30, ry: 18, fill: col, stroke: mix(col, '#000000', .35), 'stroke-width': 2 }, g) : mk('circle', { cx, cy, r: 16, fill: col, stroke: mix(col, '#000000', .35), 'stroke-width': 2 }, g);
  if (kind === 'ok') { path(g, 'M-30 0H20', { stroke: NV, 'stroke-width': 7 }); tgt(50, 0, ANAT.muscle, 'm'); }
  if (kind === 'dead') { path(g, 'M-30 0H20', { stroke: NV, 'stroke-width': 7 }); tgt(50, 0, '#7d7a72', 'm'); }
  if (kind === 'wrongR') { path(g, 'M-30 0C0 0 10 30 30 34', { stroke: NV, 'stroke-width': 7 }); tgt(50, -22, ANAT.muscle, 'm'); tgt(46, 36, '#5aa7d6', 'r'); }
  if (kind === 'wrongT') { path(g, 'M-30 0C10 0 30 -40 60 -44', { stroke: NV, 'stroke-width': 7 }); mk('rect', { x: 20, y: -10, width: 60, height: 50, rx: 8, fill: 'none', stroke: COL.dim, 'stroke-dasharray': '5 4' }, g); tgt(76, -48, '#5aa7d6', 'r'); }
  if (kind === 'none') { path(g, 'M-30 0C-10 -6 0 6 10 0', { stroke: NV, 'stroke-width': 7 }); tgt(60, 0, ANAT.muscle, 'm'); }
  if (t0 !== null) show(g, t0);
  return g;
}

const BEATS = [

  ['mech', 'Механизмы', (m, D) => {

    M.forEach(([h, s, c], i) => { const x = 60 + (i % 3) * 500, y = 100 + Math.floor(i / 3) * 150; infoCard(p, x, y, 470, 130, h, s || null, c, m('m' + (i + 1)), { size: 20 }); });

    txt(p, 'чаще всего:', 1300, 570, m('bio'), { size: 20, weight: 700, fill: COL.chalk, anchor: 'middle' });

  }],

  ['sites', 'Уязвимые места', (m, D) => {
    const p = panel(0);
    txt(p, 'где нерв уязвим', 800, 56, m('sites'), { size: 28, weight: 700, anchor: 'middle', fill: NV });
    // a tunnel, a branch at a sharp angle, a fixed point over a bony prominence

    const adh = G(p, { o: 0 }); [960, 1010, 1060, 1110, 1160].forEach(x => path(adh, `M${x} 570L${x + 8} 600`, { stroke: '#d9cfb8', 'stroke-width': 4 })); show(adh, m('extra', .8));
    prog(q => ne.set({ slide: 8 * Math.sin(q * 30) * (1 - q * .9) }), m('extra', 1), 2, lin);
    infoCard(p, 1260, 470, 280, 270, 'снаружи', 'кровь в ложе, сращение эпиневрия со связкой, отёк рядом — нерв хуже смещается', COL.task, m('extra'), { size: 19 });
  }],

  ['class', 'Седдон и Сандерленд', (m, D) => {

    const al = axonLong(p, 520, 330, 1000, m('class'), { lx: .3 });
    const C = [['нейропраксия', 'демиелинизация на участке; проведение блокировано только там; мышцы не атрофируются; восстановление обычно полное', COL.good, 'neura'],

    C.forEach(([h, s, c, k], i) => infoCard(p, 60 + i * 500, 520, 470, 250, h, s, c, m(k), { size: 19 }));
