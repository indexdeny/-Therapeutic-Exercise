const HEAD = COL.whole, PAIN = '#ff5a3c', WARM = '#e8734f', COLD = '#6f9fd8', CR = '#d98ab0';
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
function numLine(p, n, str, x, y, col, t0, { size = 22, maxW = 860 } = {}) {
  const g = G(p, { o: 0 });
  mk('circle', { cx: x + 20, cy: y - 8, r: 19, fill: col }, g);
  T(g, String(n), { x: x + 20, y: y, size: 22, weight: 700, fill: COL.board, anchor: 'middle' });
  put(para(g, str, x + 54, y, null, { size, maxW }), { o: 1 });
  if (t0 !== null) show(g, t0);
  return g;
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19 } = {}) {
  const g = G(p, { o: 0 }), right = tx > x;
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: right ? 'end' : 'start' });
  path(g, `M${x + (right ? 8 : -8)} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
// A hand (handMap) whose skin can change: set({ warm, cold, swell, shiny, sweat, pit }) 0..1 — warm red or cold blue
// tint, a puffy dorsum (pitting edema with a lasting dent when pit > 0), shiny thin skin, sweat beads.
function crpsHand(p, x, y, s, t0) {
  const hm = handMap(p, x, y, s, null), g = hm.g;
  const tint = mk('path', { d: 'M-66 40C-78 0 -80 -60 -70 -96C-40 -110 32 -112 72 -92C82 -44 78 0 64 40C30 58 -30 58 -66 40Z', fill: WARM, opacity: 0 }, g);
  const puff = mk('ellipse', { cx: 0, cy: -40, rx: 0, ry: 0, fill: '#e7b3a0', 'fill-opacity': .55, stroke: '#c98a76', 'stroke-width': 2 }, g);
  const dent = mk('ellipse', { cx: 10, cy: -46, rx: 0, ry: 0, fill: '#b98070', 'fill-opacity': .7 }, g);
  const shine = mk('path', { d: 'M-40 -70C-20 -84 20 -84 40 -70', fill: 'none', stroke: '#ffffff', 'stroke-width': 5, 'stroke-linecap': 'round', opacity: 0 }, g);
  const drops = [[-30, -20], [20, -60], [40, 0], [-10, 20], [50, -40]].map(([cx, cy]) => mk('ellipse', { cx, cy, rx: 4, ry: 6, fill: '#bfe6f5', opacity: 0 }, g));
  const S = { warm: 0, cold: 0, swell: 0, shiny: 0, sweat: 0, pit: 0 }, e = { hm, g, st: S };
  e.set = o => {
    Object.assign(S, o);
    tint.setAttribute('fill', S.cold > S.warm ? COLD : WARM);
    tint.setAttribute('opacity', f1(.45 * Math.max(S.warm, S.cold)));
    puff.setAttribute('rx', f1(62 * S.swell)); puff.setAttribute('ry', f1(46 * S.swell));
    dent.setAttribute('rx', f1(12 * S.pit)); dent.setAttribute('ry', f1(8 * S.pit));
    shine.setAttribute('opacity', f1(.7 * S.shiny));
    drops.forEach(d => d.setAttribute('opacity', f1(S.sweat)));
    return e;
  };
  e.set({});
  if (t0 !== null) show(g, t0);
  return e;
}

    B.forEach(([s, v, c], i) => { const y = 180 + i * 90, g0 = G(p, { o: 0 }); T(g0, s, { x: 330, y: y + 30, size: 20, fill: COL.chalk, anchor: 'end' }); const r = mk('rect', { x: 350, y, width: 0, height: 44, rx: 10, fill: c }, g0); const tv = T(g0, `${v} %`, { x: 360, y: y + 32, size: 24, weight: 700, fill: c }); show(g0, m('pct', .5 + i * 1.5)); prog(q => { r.setAttribute('width', f1(v * 4.2 * q)); put(tv, { x: 360 + v * 4.2 * q }); }, m('pct', .6 + i * 1.5), 1, out); });

  ['pt', 'Физическая терапия', (m, D) => {

  }],

  ['mirror', 'Зеркальная терапия', (m, D) => {
    const p = panel(0);
    txt(p, 'зеркальная терапия и двигательная визуализация', 800, 56, m('mirror'), { size: 28, weight: 700, anchor: 'middle', fill: CR });
    // the box (hidden hand behind the mirror) and the visible hand with its reflection
    const box = G(p, { o: 0 });
    mk('rect', { x: 140, y: 230, width: 300, height: 340, rx: 10, fill: '#3d4a52', stroke: '#9fb0bf', 'stroke-width': 3 }, box);
    const mir = mk('rect', { x: 440, y: 200, width: 14, height: 400, fill: '#cfe6f0', stroke: '#9fb0bf', 'stroke-width': 2 }, box);
    show(box, m('set'));
    const hid = crpsHand(p, 290, 430, .9, m('set')); hid.set({ warm: .7, swell: .7 });
    const vis = handMap(p, 620, 430, .9, m('set'));
    const refl = G(p, { o: 0 }); const rh = handMap(refl, 0, 0, .9, null); put(rh.g, { o: .45 }); put(refl, { x: 290, y: 430 }); show(refl, m('set', 1.5));
    txt(p, 'спрятана', 290, 640, m('set'), { size: 19, weight: 700, fill: COL.dim, anchor: 'middle' });
    txt(p, 'видна в зеркале', 620, 640, m('set'), { size: 19, weight: 700, fill: COL.chalk, anchor: 'middle' });
    txt(p, 'в зеркале — «больная» рука здорова', 380, 180, m('set', 1.5), { size: 20, weight: 700, fill: COL.good, anchor: 'middle' });
    pill(p, 'украшения и часы снять', 450, 690, m('set', 2), { col: COL.dim, size: 18 });
    // progression: both still → visible moves → hidden moves a little while visible moves a lot → both equal
    const t0 = m('prog'), span = Math.max(4, m('gmi') - t0);
    prog(q => { const ph = Math.floor(q * 4), c = cyc(q * 4 % 1, 1); put(vis.g, { r: ph >= 1 ? 20 * c : 0 }); put(rh.g, { r: ph >= 1 ? -20 * c : 0 }); put(hid.g, { r: ph >= 2 ? (ph === 2 ? 6 : 20) * c : 0 }); }, t0, span, lin);
    const P = ['обе неподвижны', 'двигается видимая', 'спрятанная — в своих пределах, видимая — крупно', 'обе одинаково'];
    P.forEach((s, i) => numLine(p, i + 1, s, 760, 150 + i * 70, CR, t0 + span * i / 4, { size: 21, maxW: 720 }));
    // graded motor imagery: left/right, imagined movement, mirror
    txt(p, 'градуированная двигательная визуализация:', 760, 480, m('gmi'), { size: 22, weight: 700, fill: COL.chalk });
    const lr = G(p, { o: 0 }); const a = handMap(lr, 900, 600, .45, null); put(a.g, { o: 1 }); const b = handMap(lr, 1000, 600, .45, null); put(b.g, { o: 1, r: 180 }); show(lr, m('g1'));
    show(T(p, 'правая? левая?', { x: 950, y: 745, size: 18, weight: 700, fill: COL.whole, anchor: 'middle', o: 0 }), m('g1'));
    const think = G(p, { x: 1200, y: 600, o: 0 }); [[0, 0, 40], [-40, 46, 12], [-56, 66, 7]].forEach(([dx, dy, r]) => mk('circle', { cx: dx, cy: dy, r, fill: 'none', stroke: COL.real, 'stroke-width': 3 }, think)); show(think, m('g2'));
    show(T(p, 'представить движение', { x: 1200, y: 745, size: 18, weight: 700, fill: COL.real, anchor: 'middle', o: 0 }), m('g2'));
    const mm = G(p, { o: 0 }); mk('rect', { x: 1380, y: 560, width: 10, height: 90, fill: '#cfe6f0' }, mm); show(mm, m('g3'));
    show(T(p, 'зеркало', { x: 1385, y: 745, size: 18, weight: 700, fill: COL.good, anchor: 'middle', o: 0 }), m('g3'));
    pill(p, 'схема', 1150, 800, m('gmi'), { col: COL.dim, size: 17 });
  }],

     ['Тёплая острая фаза переходит в холодную хроническую; лечение в первый год помогает 80 %.', 'w2'],
     ['Лечение — восстановление функции: отёк и боль, частые короткие движения, опора, зеркальная терапия, двигательная визуализация.', 'w3'],

      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });

  }], done, 'Практика урока   1 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
