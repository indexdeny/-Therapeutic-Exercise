const SP = '#8fd6b0', ANTC = '#86c9e8', POSTC = '#bba8ee', SAME = COL.good, OPP = '#f0a04b';
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19 } = {}) {
  const g = G(p, { o: 0 }), right = tx > x;

  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const swing = (q, n) => Math.sin(2 * Math.PI * n * q);
const f1 = v => v.toFixed(1);
const BN = ANAT.bone, BL = mix(ANAT.bone, '#000000', .45);
// Two vertebral bodies seen from behind with the disc; set({ sb (deg, + to the right), lsh (px, + right) }).
function frontSeg(p, x, y, s, t0) {
  const g = G(p, { x, y, s, o: 0 });
  const body = (par, cy) => {
    [-1, 1].forEach(k => mk('path', { d: `M${k * 70} ${cy - 24}L${k * 128} ${cy - 30}L${k * 130} ${cy - 10}L${k * 70} ${cy - 2}Z`, fill: BN, stroke: BL, 'stroke-width': 2 }, par));
    mk('rect', { x: -80, y: cy - 46, width: 160, height: 92, rx: 16, fill: BN, stroke: BL, 'stroke-width': 2 }, par);
    mk('ellipse', { cx: 0, cy: cy - 4, rx: 13, ry: 22, fill: mix(BN, '#000000', .12), stroke: BL, 'stroke-width': 2 }, par);
  };
  const low = G(g, {}); body(low, 62);
  const disc = mk('path', { fill: DISC_C, stroke: mix(DISC_C, '#000000', .35), 'stroke-width': 2 }, g);
  const up = G(g, {}); body(up, -62);
  const S = { sb: 0, lsh: 0 }, e = { g };
  e.set = o => {
    Object.assign(S, o);
    put(up, { x: S.lsh, r: S.sb });
    const U = P => { const [a, b] = rotPt(P[0], P[1], S.sb); return [a + S.lsh, b]; };
    const a = U([-80, -16]), b = U([80, -16]);
    disc.setAttribute('d', `M${f1(a[0])} ${f1(a[1])}L${f1(b[0])} ${f1(b[1])}Q${f1(b[0] + 6)} 0 80 16L-80 16Q${f1(a[0] - 6)} 0 ${f1(a[0])} ${f1(a[1])}Z`);
    return e;
  };
  e.set({});
  if (t0 !== null) show(g, t0);
  return e;
}
// A vertebra seen from above (anterior up) over a dimmed lower one; set({ rot }) turns the upper one about the body
// centre (+ = to the right: the body goes right, the spinous process left).
function topVert(p, x, y, s, t0) {
  const g = G(p, { x, y, s, o: 0 });
  const shape = (par, op) => {
    const a = { fill: BN, stroke: BL, 'stroke-width': 2, 'stroke-linejoin': 'round', 'fill-opacity': op, 'stroke-opacity': op };
    mk('path', { d: 'M-30 40L-40 74L-62 70L-112 62L-114 80L-58 92L-26 116L-10 172L10 172L26 116L58 92L114 80L112 62L62 70L40 74L30 40Z', ...a }, par);
    mk('path', { d: 'M-70 16Q-76 -36 0 -40Q76 -36 70 16Q62 36 30 40L-30 40Q-62 36 -70 16Z', ...a }, par);
    mk('circle', { cx: 0, cy: 78, r: 24, fill: COL.board, stroke: BL, 'stroke-width': 2, 'stroke-opacity': op }, par);
  };
  const low = G(g, { x: 6, y: 6 }); shape(low, .3);
  const pivot = G(g, { x: 0, y: 0 }), up = G(pivot, {}); shape(up, 1);
  const e = { g };
  e.set = ({ rot = 0 }) => { put(pivot, { r: rot }); return e; };
  if (t0 !== null) show(g, t0);
  return e;
}
// The atlanto-occipital joint from the side: the convex occipital condyle rocks in the concave atlas (nodding).
function oaJoint(p, x, y, s, t0) {
  const g = G(p, { x, y, s, o: 0 });
  mk('path', { d: 'M-96 -6Q0 54 96 -6L96 56Q0 74 -96 56Z', fill: BN, stroke: BL, 'stroke-width': 2 }, g);
  const sk = G(g, { x: 0, y: -62 });
  mk('path', { d: 'M-150 -10Q-176 -170 -10 -196Q160 -200 186 -60L150 -30Q120 -6 80 -4L66 0A66 66 0 0 1 -66 0L-150 -10Z', fill: mix(BN, COL.board, .55), stroke: BL, 'stroke-width': 2 }, sk);
  mk('path', { d: 'M-66 0A66 66 0 0 0 66 0Z', fill: BN, stroke: BL, 'stroke-width': 2.5 }, sk);
  mk('path', { d: 'M150 -96L196 -96M184 -106L198 -96L184 -86', stroke: COL.dim, 'stroke-width': 3, fill: 'none' }, sk);
  T(sk, 'лицо', { x: 112, y: -110, size: 18, fill: COL.dim, weight: 600 });
  const e = { g, set: ({ nod = 0 }) => { put(sk, { r: nod }); return e; } };
  if (t0 !== null) show(g, t0);
  return e;
}
// The atlanto-axial joint from above (anterior up): the atlas ring turns about the dens; the right lateral mass moves
// back with a turn to the right (Fig. 14.5).
function aaJoint(p, x, y, s, t0) {
  const g = G(p, { x, y, s, o: 0 });
  mk('path', { d: 'M-80 30Q-86 -40 0 -46Q86 -40 80 30Q60 70 0 74Q-60 70 -80 30Z', fill: BN, 'fill-opacity': .25, stroke: BL, 'stroke-width': 2, 'stroke-opacity': .5 }, g);

  T(g, 'зуб', { x: 0, y: -8, size: 15, fill: COL.board, weight: 700, anchor: 'middle' });
  const ring = G(g, { x: 0, y: -14 }), a = { fill: BN, stroke: BL, 'stroke-width': 2, 'stroke-linejoin': 'round' };
  mk('path', { d: 'M-40 -30Q0 -56 40 -30L34 -20Q0 -42 -34 -20Z', ...a }, ring);
  mk('path', { d: 'M-60 40Q0 104 60 40L52 32Q0 86 -52 32Z', ...a }, ring);
  const lm = [-1, 1].map(k => mk('ellipse', { cx: k * 64, cy: 4, rx: 26, ry: 38, ...a }, ring));

  const e = { g, lm, set: ({ rot = 0 }) => { put(ring, { r: rot }); return e; } };
  e.at = k => { const s0 = st(g), [rx, ry] = rotPt(k * 64, 4, st(ring).r); return [s0.x + rx * s0.s, s0.y + (ry - 14) * s0.s]; };
  if (t0 !== null) show(g, t0);
  return e;
}
// A typical cervical segment from the side (anterior right) with the facet plane at 45° to the horizontal.
function cervFacet(p, x, y, s, t0) {

  path(g, 'M-26 14A36 36 0 0 0 -36 -11', { stroke: SP, 'stroke-width': 2.5 });
  T(g, '45°', { x: -24, y: -14, size: 20, fill: SP, weight: 700, anchor: 'end' });
  if (t0 !== null) show(g, t0);
  return { g, jl };
}
// A cervical body from the front with the uncovertebral lips (joints of Luschka) rising at its upper corners.
function luschka(p, x, y, s, t0) {
  const g = G(p, { x, y, s, o: 0 }), a = { fill: BN, stroke: BL, 'stroke-width': 2, 'stroke-linejoin': 'round' };
  mk('path', { d: 'M-70 -56H70L74 -14Q60 -6 50 -8H-50Q-60 -6 -74 -14Z', ...a }, g);
  mk('path', { d: 'M-56 -4H56Q62 -2 66 -10L76 -24L82 -4L80 50H-80L-82 -4L-76 -24L-66 -10Q-62 -2 -56 -4Z', ...a }, g);
  mk('path', { d: 'M-50 -8H50Q56 -8 56 -4H-56Q-56 -8 -50 -8Z', fill: DISC_C }, g);
  const lips = [-1, 1].map(k => mk('path', { d: `M${k * 66} -10L${k * 76} -24L${k * 82} -4Z`, fill: SP, stroke: SP, 'stroke-width': 2 }, g));
  if (t0 !== null) show(g, t0);

}
// A vertebra from above with its facets: 'T' — in the frontal plane, with a rib meeting the body and the transverse
// process; 'L' — in the sagittal plane, the upper facets concave and the lower convex.
function facetTop(p, x, y, s, t0, kind) {
  const g = G(p, { x, y, s, o: 0 }), a = { fill: BN, stroke: BL, 'stroke-width': 2, 'stroke-linejoin': 'round' };
  mk('path', { d: 'M-66 10Q-72 -46 0 -50Q72 -46 66 10Q58 30 28 34L-28 34Q-58 30 -66 10Z', ...a }, g);
  mk('path', { d: 'M-28 34L-38 70L-108 58L-112 76L-50 92L-22 116L-10 176L10 176L22 116L50 92L112 76L108 58L38 70L28 34Z', ...a }, g);
  mk('circle', { cx: 0, cy: 72, r: 22, fill: COL.board, stroke: BL, 'stroke-width': 2 }, g);
  const fc = { stroke: SP, 'stroke-width': 7, fill: 'none', 'stroke-linecap': 'round' };
  if (kind === 'T') {
    [-1, 1].forEach(k => {
      path(g, `M${k * 30} 98L${k * 62} 98`, fc);
      path(g, `M${k * 66} 4Q${k * 150} 0 ${k * 170} 80Q${k * 172} 130 ${k * 150} 170`, { stroke: BN, 'stroke-width': 9, 'stroke-opacity': .7 });
      mk('circle', { cx: k * 110, cy: 66, r: 7, fill: SP }, g);
      mk('circle', { cx: k * 70, cy: 6, r: 7, fill: SP }, g);
    });
  } else {
    [-1, 1].forEach(k => {
      path(g, `M${k * 34} 82Q${k * 50} 108 ${k * 40} 128`, fc);
      path(g, `M${k * 52} 84Q${k * 66} 108 ${k * 56} 130`, { ...fc, stroke: mix(SP, '#ffffff', .4), 'stroke-width': 5 });
    });
  }
  if (t0 !== null) show(g, t0);
  return g;
}
// A small curved arrow (a turn) around (x, y).
function turnArrow(p, x, y, r, col, t0, ccw = false) {
  const g = G(p, { x, y, o: 0 }), k = ccw ? -1 : 1;
  path(g, `M${-r} 0A${r} ${r * .45} 0 0 ${ccw ? 1 : 0} ${r} 0`, { stroke: col, 'stroke-width': 3.5 });
  path(g, `M${r - 10 * k} ${-8}L${r} 0L${r - 12 * k} 6`, { stroke: col, 'stroke-width': 3.5 });
  if (t0 !== null) show(g, t0);
  return g;
}
