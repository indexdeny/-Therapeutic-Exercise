const SP = '#8fd6b0', KYP = '#f4a48c', LOR = '#86c9e8', PAS = ANAT.tendon, ACT = ANAT.muscle, NEU = '#bba8ee', GRAV = COL.whole;
function lab(p, str, x, y, tx, ty, col, t0, { size = 19 } = {}) {
  const g = G(p, { o: 0 }), right = tx > x;
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: right ? 'end' : 'start' });
  path(g, `M${x + (right ? 8 : -8)} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const swing = (q, n) => Math.sin(2 * Math.PI * n * q);
const f1 = v => v.toFixed(1);
const BN = ANAT.bone, BL = mix(ANAT.bone, '#000000', .45);
// The column alone, from the sacrum up (anterior to the right), coloured by region; set({ phi0, lord, kyph, cerv })
// bends it the way postureFig does (an infant's single C curve: a negative lordosis). at(u, k) — a stage point.
function spineLine(p, x, y, s, t0) {
  const g = G(p, { x, y, s, o: 0 });
  const sac = mk('path', { fill: REG_C.S, stroke: BL, 'stroke-width': 1.5 }, g);
  const vs = SEG_L.map((_, i) => mk('path', { fill: i < 5 ? REG_C.L : i < 17 ? REG_C.T : REG_C.C, stroke: BL, 'stroke-width': 1.2 }, g));
  const S = { phi0: 30, lord: 46, kyph: 42, cerv: 34 }, e = { g, pts: [], phis: [] };
  e.set = o => {
    Object.assign(S, o);
    let phi = S.phi0, P = [0, 0];
    const pts = [P], phis = [];
    for (let i = 0; i < 24; i++) {
      phi += i < 5 ? -S.lord * WL[i] : i < 17 ? S.kyph * WK[i - 5] : -S.cerv * WC[i - 17];
      phis.push(phi);
      P = [P[0] + SEG_L[i] * Math.sin(rad(phi)), P[1] - SEG_L[i] * Math.cos(rad(phi))];
      pts.push(P);
    }
    vs.forEach((v, i) => {
      const a = rad(phis[i]), d = [Math.sin(a), -Math.cos(a)], n = [Math.cos(a), Math.sin(a)], w = SEG_W[i] / 2, Lu = SEG_L[i];
      const P0 = [pts[i][0] + d[0] * Lu * .12, pts[i][1] + d[1] * Lu * .12], P1 = [pts[i][0] + d[0] * Lu * .88, pts[i][1] + d[1] * Lu * .88];
      v.setAttribute('d', `M${f1(P0[0] + n[0] * w)} ${f1(P0[1] + n[1] * w)}L${f1(P1[0] + n[0] * w)} ${f1(P1[1] + n[1] * w)}L${f1(P1[0] - n[0] * w)} ${f1(P1[1] - n[1] * w)}L${f1(P0[0] - n[0] * w)} ${f1(P0[1] - n[1] * w)}Z`);
    });
    // the sacrum: a curved wedge below S1, tilted with the start angle
    const R = v => rotPt(v[0], v[1], S.phi0 - 30);
    sac.setAttribute('d', 'M' + [[17, 10], [-17, -10], [-26, 16], [-28, 46], [-20, 74], [-8, 88], [-2, 76], [-6, 46], [4, 18]].map(v => { const [a, b] = R(v); return f1(a) + ' ' + f1(b); }).join('L') + 'Z');
    e.pts = pts; e.phis = phis;
    return e;
  };
  e.at = (u, k = 0) => {
    const i = Math.min(23, Math.floor(u)), f = u - i, A = e.pts[i], B = e.pts[i + 1], a = rad(e.phis[i]);
    const P = [lerp(A[0], B[0], f) + k * Math.cos(a), lerp(A[1], B[1], f) + k * Math.sin(a)], s0 = st(g);
    return [s0.x + P[0] * s0.s, s0.y + P[1] * s0.s];
  };
  e.set({});
  if (t0 !== null) show(g, t0);
  return e;
}
// A weight-bearing joint as a pole on a pivot with a mass on top; set({ off }) tilts it: the gravity line moves off the
// axis. mus(t, k) — a muscle on the other side contracts; lig(t) — a ligament on the far side goes taut.
function jointBal(p, x, y, s, t0) {
  const g = G(p, { x, y, s, o: 0 });
  mk('rect', { x: -16, y: 0, width: 32, height: 180, rx: 14, fill: BN, stroke: BL, 'stroke-width': 2 }, g);
  const top = G(g, {}), pole = mk('rect', { x: -14, y: -230, width: 28, height: 220, rx: 12, fill: BN, stroke: BL, 'stroke-width': 2 }, top);
  mk('circle', { cx: 0, cy: -262, r: 40, fill: mix(BN, '#000000', .1), stroke: BL, 'stroke-width': 2 }, top);
  mk('circle', { cx: 0, cy: 0, r: 16, fill: COL.board, stroke: COL.task, 'stroke-width': 4 }, g);
  const gl = path(g, '', { stroke: GRAV, 'stroke-width': 3, 'stroke-dasharray': '10 7' }), ga = path(g, '', { stroke: GRAV, 'stroke-width': 4 });
  const musE = path(g, '', { stroke: ACT, 'stroke-width': 12 }), ligE = path(g, '', { stroke: PAS, 'stroke-width': 5 });
  put(musE, { o: 0 }); put(ligE, { o: 0 });
  const S = { off: 0, act: 0, taut: 0 }, e = { g };
  e.set = o => {
    Object.assign(S, o);
    put(top, { r: S.off });
    const [mx, my] = rotPt(0, -262, S.off);
    gl.setAttribute('d', `M${f1(mx)} ${f1(my)}V200`); ga.setAttribute('d', `M${f1(mx - 12)} ${f1(my + 70)}L${f1(mx)} ${f1(my + 92)}L${f1(mx + 12)} ${f1(my + 70)}`);
    const [ax, ay] = rotPt(-14, -150, S.off), [bx, by] = rotPt(14, -150, S.off);
    musE.setAttribute('d', `M${f1(ax)} ${f1(ay)}Q-60 -40 -16 90`); musE.setAttribute('stroke', mix(ACT, '#ff5a3c', S.act));
    ligE.setAttribute('d', `M${f1(bx)} ${f1(by)}Q40 -40 16 90`); ligE.setAttribute('stroke', mix(PAS, ANAT.taut, S.taut)); ligE.setAttribute('stroke-width', f1(4 + 4 * S.taut));
    return e;
  };
  e.mus = t => show(musE, t); e.lig = t => show(ligE, t);
  e.set({});
  if (t0 !== null) show(g, t0);
  return e;
}
// A three-legged stool: passive, active and neural subsystems; set({ weak }) shortens the middle (active) leg.
function stool(p, x, y, s, t0) {
  const g = G(p, { x, y, s, o: 0 }), W = '#b48a5a', WL2 = mix(W, '#000000', .35);
  const seat = G(g, {});
  mk('ellipse', { cx: 0, cy: 0, rx: 190, ry: 46, fill: W, stroke: WL2, 'stroke-width': 3 }, seat);
  mk('ellipse', { cx: 0, cy: 0, rx: 150, ry: 32, fill: mix(W, '#ffffff', .15) }, seat);
  const legs = [[-150, 10, PAS, 'пассивная'], [0, 36, ACT, 'активная'], [150, 10, NEU, 'нервная']].map(([lx, ly, c, n]) => {
    const e2 = path(g, '', { stroke: c, 'stroke-width': 22 });
    const tx = T(g, n, { x: lx * 1.25, y: 330, size: 24, fill: c, weight: 700, anchor: 'middle' });
    return { lx, ly, e: e2 };
  });
  const S = { weak: 0 }, e = { g };
  e.set = o => {
    Object.assign(S, o);
    const tilt = 7 * S.weak;
    put(seat, { r: 0, y: 26 * S.weak * .5 });
    legs.forEach(({ lx, ly, e: le }, i) => {
      const [sx, sy] = rotPt(lx, ly, tilt), len = i === 1 ? 240 * (1 - .28 * S.weak) : 240;
      le.setAttribute('d', `M${f1(sx)} ${f1(sy + 13 * S.weak)}L${f1(lx * 1.25)} ${f1(sy + len)}`);
    });
    put(seat, { r: tilt });
    return e;
  };
  e.set({});
  if (t0 !== null) show(g, t0);
  return e;
}

  ['zones', 'Нейтральная и эластическая зоны', (m, D) => {

    const ezR = [-1, 1].map(k => { const r = mk('rect', { x: k < 0 ? X0 : X0 + W / 2 + .15 * W, y: Y0 - H / 2, width: .35 * W, height: H, fill: PAS, 'fill-opacity': .1 }, ch); put(r, { o: 0 }); show(r, m('el')); return r; });
    path(ch, d, { stroke: COL.chalk, 'stroke-width': 4 });
