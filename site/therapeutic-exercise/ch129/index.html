    mk('rect', { x: 980, y: 210, width: 150, height: 230, rx: 10, fill: DEEP }, fb); mk('rect', { x: 1290, y: 320, width: 150, height: 120, rx: 10, fill: COL.task }, fb);
    T(fb, 'I тип — больше', { x: 1055, y: 480, size: 21, fill: DEEP, weight: 700, anchor: 'middle' }); T(fb, 'II тип', { x: 1365, y: 480, size: 21, fill: COL.task, weight: 700, anchor: 'middle' });
    pill(p, 'схема: соотношение без чисел', 1210, 560, m('t1', .5), { col: COL.dim, size: 16 });
    infoCard(p, 860, 600, 700, 170, 'постуральная роль', 'выносливость важнее максимальной силы', SP, m('t1', 1), { size: 21 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-mus', prompt: ['Какая это мышца?'],
    build: grid([
      { parts: ['Натягивает пояс поддержки вокруг живота и поясницы'], ans: ['t'], why: 'Поперечная мышца живота.' },
      { parts: ['Быстро атрофируется на уровне поражённого сегмента'], ans: ['m'], why: 'Многораздельная.' },
      { parts: ['Поднимает голову, когда глубокие сгибатели шеи слабы'], ans: ['s'], why: 'Грудино-ключично-сосцевидная.' },
      { parts: ['Отвечает за осевое вытяжение — втягивание подбородка'], ans: ['l'], why: 'Длинная мышца шеи.' },
      { parts: ['Активна и при сгибании, и при разгибании против сопротивления'], ans: ['t'], why: 'Поперечная мышца живота.' },
    ], [['t', 'Поперечная', ANAT.taut], ['m', 'Многораздельная', DEEP], ['s', 'Грудино-ключ.-сосц.', GLOB], ['l', 'Длинная шеи', SP]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Глобальные мышцы — большие растяжки: двигают туловище и отвечают на толчки, но сегмент стабилизируют лишь сжатием.', 'w1'],
     ['Глубокие — поперечная живота, многораздельная, длинная мышца шеи — держат каждый сегмент и выносливы.', 'w2'],
     ['Пояснично-грудная фасция передаёт натяжение мышц на позвонки и помогает стабильности.', 'w3'],
     ['Для обычной стабильности хватает ≈ 10 % силы; с болью в пояснице сильнее всего связана слабая выносливость разгибателей.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SP }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-nums', prompt: ['Числа из урока:'],
    build: blanks([
      { parts: ['Для стабильности хватает ≈ ', { box: '10' }, ' % от максимума'], why: 'Около десяти процентов максимального сокращения.' },
      { parts: ['Здоровые: поперечная ', { box: '60' }, ' %, многоразд. ', { box: '30' }, ' %'], why: 'Утолщение при стабилизирующем сокращении.' },
      { parts: ['Боль в пояснице: ', { box: '40' }, ' % и ', { box: '20' }, ' %'], why: 'Поперечная — 40 %, многораздельная — 20 %.' },
    ]),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-glob', prompt: ['У пациента с нестабильным поясничным сегментом боль усиливается, когда он изо всех сил напрягает прямую мышцу живота и разгибатели спины. Почему так бывает и что нужно тренировать?'],
    build: choice([
      ['Глобальные мышцы лишь сжимают позвоночник и толкают нестабильный сегмент к концу объёма; нужно учить контроль глубоких сегментарных мышц'],
      ['Мышцы слишком слабые: нужно ещё сильнее напрягать прямую мышцу живота'],
      ['Боль от глубоких мышц: их надо расслабить'],
      ['Мышцы туловища на стабильность не влияют'],
    ], 0, 'Глобальные мышцы почти не крепятся к позвонкам: сегмент они стабилизируют только сжатием, а при нестабильности сжатие нагружает пассивные ткани.',
    [null, 'Ещё больше сжатия усилит нагрузку на пассивные ткани.', 'Глубокие мышцы как раз удерживают сегмент.', 'Без мышц позвоночник стоя сложился бы.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
