}

      at.textContent = `${Math.round(a)}°`; put(at, { x: S1[0] + k * 1.2, y: S1[1] - 8 });
    });
    f.set({});

    pillRow(p, ['укорочена', 'растянута'], 520, 120, m('sm', 2), { col: ANAT_ON ? [ANAT3.col.focus, ANAT3.col.str] : [SHORT, LONG], size: 17 });
