const SP = '#8fd6b0', MU = ANAT.muscle, PAIN = '#ff5a3c', SHORT = '#e2574c', LONG = ANAT.taut, ROUND = '#f0a04b', FLATU = '#86c9e8', SCO = '#bba8ee', LL = '#f3c95c', SL = '#86c9e8';
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : x + (right ? 8 : -8);
  path(g, `M${lx} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const f1 = v => v.toFixed(1);
const BN = ANAT.bone, BL = mix(ANAT.bone, '#000000', .45);
const musMid = (f, mu) => { const [A, B] = mu.last; return f.stage([(A[0] + B[0]) / 2, (A[1] + B[1]) / 2]); };
function painStar(p, x, y, t0, r = 1) {
  const g = G(p, { x, y, s: 0, o: 0 });
  let d = ''; for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, rr = (i % 2 ? 9 : 22) * r; d += (i ? 'L' : 'M') + f1(rr * Math.cos(a)) + ' ' + f1(rr * Math.sin(a)); }
  mk('path', { d: d + 'Z', fill: PAIN, stroke: '#ffd2c4', 'stroke-width': 2 }, g);
  if (t0 !== null) pop(g, t0);
  return g;
}
// A spine drawn on a frontStand figure seen from behind (the patient's right on the viewer's right), with both scapulae.
// set({ lum, tho, cer, prom }): lateral offsets (px, + to the right) of the lumbar, thoracic and cervical curves;
// prom — the right scapula and ribs stand out. side(k, col, t) — bands along one side of the column (k −1 left, 1 right).
function backSpine(fs, t0) {
  const g = G(fs.top, { o: 0 }), N = 22, vs = [];
  const line = path(g, '', { stroke: BN, 'stroke-width': 3, 'stroke-opacity': .5 });
  for (let i = 0; i < N; i++) vs.push(mk('rect', { x: -7, y: -5, width: 14, height: 10, rx: 3, fill: BN, stroke: BL, 'stroke-width': 1.2 }, g));
  const scap = [-1, 1].map(() => mk('path', { fill: BN, 'fill-opacity': .25, stroke: BN, 'stroke-width': 2 }, g));
  const S = { lum: 0, tho: 0, cer: 0, prom: 0 }, e = { g, pts: [] };
  const at = u => {   // u: 0 sacrum … 1 top of the neck
    const P = fs.pts.P, C = fs.pts.Sc, top = [C[0], C[1] - 26];
    let dx = 0;
    if (u < .34) dx = S.lum * Math.sin(Math.PI * u / .34);
    else if (u < .86) dx = S.tho * Math.sin(Math.PI * (u - .34) / .52);
    else dx = S.cer * Math.sin(Math.PI * (u - .86) / .14);
    return [lerp(P[0], top[0], u) + dx, lerp(P[1] - 8, top[1], u)];
  };
  e.set = o => {
    Object.assign(S, o);
    const pts = []; for (let i = 0; i <= N; i++) pts.push(at(i / N));
    line.setAttribute('d', 'M' + pts.map(P => f1(P[0]) + ' ' + f1(P[1])).join('L'));
    vs.forEach((v, i) => { const A = pts[i], B = pts[i + 1], a = Math.atan2(B[0] - A[0], A[1] - B[1]) * 180 / Math.PI; v.setAttribute('transform', `translate(${f1((A[0] + B[0]) / 2)} ${f1((A[1] + B[1]) / 2)}) rotate(${f1(a)})`); });
    const C = fs.pts.Sc;
    [-1, 1].forEach((k, j) => {
      const pr = k > 0 ? S.prom : 0, x0 = C[0] + k * 10, y0 = C[1] + 6 - (k > 0 ? 0 : 0);
      scap[j].setAttribute('d', `M${f1(x0)} ${f1(y0)}L${f1(x0 + k * (34 + 4 * pr))} ${f1(y0 - 2)}L${f1(x0 + k * (14 + 3 * pr))} ${f1(y0 + 46 + 4 * pr)}Z`);
      scap[j].setAttribute('fill-opacity', f1(.25 + .4 * pr)); scap[j].setAttribute('stroke', mix(BN, ANAT.taut, pr));
    });
    e.pts = pts;
    return e;
  };
  e.side = (k, col, t, u0 = .34, u1 = .86) => {
    const b = path(g, '', { stroke: col, 'stroke-width': 6, 'stroke-opacity': .85 }, { o: 0 });
    const upd = () => { let d = ''; for (let i = 0; i <= 20; i++) { const P = at(lerp(u0, u1, i / 20)); d += (i ? 'L' : 'M') + f1(P[0] + k * 11) + ' ' + f1(P[1]); } b.setAttribute('d', d); };
    prog(upd, t, 30, lin); upd(); show(b, t);
    return b;
  };
  e.stage = u => { const P = at(u); return fs.at(P); };
  e.set({});
  if (t0 !== null) show(g, t0);
  return e;
}
// The chest in cross-section from above (anterior up): a thoracic vertebra and the ribs. set({ rot }) — structural
// scoliosis: the body turns toward the convexity (right), the ribs bulge behind on that side and in front on the other.
function axialHump(p, x, y, s, t0) {
  const g = G(p, { x, y, s, o: 0 });
  const cage = mk('path', { fill: mix('#d8d1c1', COL.board, .55), stroke: BN, 'stroke-width': 3 }, g);
  const vt = G(g, { x: 0, y: 70 });
  mk('path', { d: 'M-24 -14L-30 20L-62 14L-62 26L-26 34L-8 74L8 74L26 34L62 26L62 14L30 20L24 -14Z', fill: BN, stroke: BL, 'stroke-width': 2 }, vt);
  mk('ellipse', { cx: 0, cy: -36, rx: 34, ry: 26, fill: BN, stroke: BL, 'stroke-width': 2 }, vt);
  T(g, 'вперёд ↑', { x: 0, y: -126, size: 16, fill: COL.dim, weight: 600, anchor: 'middle' });
  const S = { rot: 0 }, e = { g };
  e.set = o => {
    Object.assign(S, o);
    const k = S.rot, pts = [];
    for (let i = 0; i < 36; i++) {
      const a = i / 36 * 2 * Math.PI, ux = Math.sin(a), uy = -Math.cos(a);
      let r = 1 + .3 * k * Math.max(0, ux) * Math.max(0, uy) * 2.2 + .16 * k * Math.max(0, -ux) * Math.max(0, -uy) * 2.2 - .08 * k * Math.max(0, -ux) * Math.max(0, uy) * 2;
      pts.push([ux * 170 * r, uy * 110 * r + (uy > .6 ? -10 * uy : 0)]);
    }
    cage.setAttribute('d', 'M' + pts.map(P => f1(P[0]) + ' ' + f1(P[1])).join('L') + 'Z');
    put(vt, { x: 0, y: 70, r: 20 * k });
    return e;
  };
  e.set({});
  if (t0 !== null) show(g, t0);
  return e;
}
