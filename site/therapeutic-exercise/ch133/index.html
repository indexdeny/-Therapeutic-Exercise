const SP = '#8fd6b0', MU = ANAT.muscle, PAIN = '#ff5a3c', CUE = '#86c9e8', STR = ANAT.stretch, ERG = '#f3c95c';
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
function numLine(p, n, str, x, y, col, t0, { size = 22, maxW = 860 } = {}) {
  const g = G(p, { o: 0 });
  mk('circle', { cx: x + 20, cy: y - 8, r: 19, fill: col }, g);
  T(g, String(n), { x: x + 20, y: y, size: 22, weight: 700, fill: COL.board, anchor: 'middle' });
  put(para(g, str, x + 54, y, null, { size, maxW }), { o: 1 });
  if (t0 !== null) show(g, t0);
  return g;
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19 } = {}) {
  const g = G(p, { o: 0 }), right = tx > x;
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: right ? 'end' : 'start' });
  path(g, `M${x + (right ? 8 : -8)} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const swing = (q, n) => Math.sin(2 * Math.PI * n * q);
const f1 = v => v.toFixed(1);
function painStar(p, x, y, t0, r = 1) {
  const g = G(p, { x, y, s: 0, o: 0 });
  let d = ''; for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, rr = (i % 2 ? 9 : 22) * r; d += (i ? 'L' : 'M') + f1(rr * Math.cos(a)) + ' ' + f1(rr * Math.sin(a)); }
  mk('path', { d: d + 'Z', fill: PAIN, stroke: '#ffd2c4', 'stroke-width': 2 }, g);
  if (t0 !== null) pop(g, t0);
  return g;
}
// Simple icons for the three kinds of cues: a speech bubble, a hand, a mirror.
function cueIcon(p, kind, x, y, t0) {
  const g = G(p, { x, y, o: 0 }), a = { stroke: CUE, 'stroke-width': 4, fill: 'none' };
  if (kind === 'say') { path(g, 'M-36 -26H36Q46 -26 46 -16V14Q46 24 36 24H-6L-24 40V24H-36Q-46 24 -46 14V-16Q-46 -26 -36 -26Z', a); path(g, 'M-26 -6H26M-26 8H12', a); }
  else if (kind === 'hand') { path(g, 'M-30 30V-4Q-30 -14 -22 -14Q-14 -14 -14 -4V-30Q-14 -40 -6 -40Q2 -40 2 -30V-36Q2 -46 10 -46Q18 -46 18 -36V-28Q18 -38 26 -38Q34 -38 34 -28V12Q34 34 12 40H-12Q-30 40 -30 30Z', a); }
  else { mk('rect', { x: -30, y: -46, width: 60, height: 84, rx: 8, ...a }, g); path(g, 'M-14 -30L10 -6M-4 -34L14 -16', { stroke: CUE, 'stroke-width': 3 }); path(g, 'M0 38V50M-20 50H20', a); }
  if (t0 !== null) show(g, t0);
  return g;
}

/* ---------- beats ---------- */
const BEATS = [

    [['say', 'словами', 'что пациент должен чувствовать', 'cues'], ['hand', 'руками', 'поставить голову и туловище, коснуться мышц', 'cues'], ['mirror', 'зеркалом', 'увидеть себя и запомнить ощущение', 'cues']].forEach(([k, h, s, mk2], i) => {
      cueIcon(p, k, 720 + i * 310, 610, m(mk2, i * 2));

  ['drills', 'Приёмы обучения', (m, D) => {

    const touch = G(p, { o: 0 }), tc = mk('circle', { r: 10, fill: CUE }, touch), str = path(touch, '', { stroke: CUE, 'stroke-width': 3, 'stroke-dasharray': '6 6' });

      const P = f.unit(u, 0), r = G(p, { x: P[0], y: P[1], s: 0, o: 0 });
