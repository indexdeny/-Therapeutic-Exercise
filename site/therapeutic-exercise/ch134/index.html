const SP = '#8fd6b0', PAIN = '#ff5a3c', ANN = '#7fb0cc', CEN = COL.good, PER = COL.bad, ST = ['#86c9e8', '#f3c95c', '#f0a04b', '#e2574c'];
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : x + (right ? 8 : -8);
  path(g, `M${lx} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const swing = (q, n) => Math.sin(2 * Math.PI * n * q);
const f1 = v => v.toFixed(1);
function turnArrow(p, x, y, r, col, t0, ccw = false) {
  const g = G(p, { x, y, o: 0 }), k = ccw ? -1 : 1;
  path(g, `M${-r} 0A${r} ${r * .45} 0 0 ${ccw ? 1 : 0} ${r} 0`, { stroke: col, 'stroke-width': 4 });
  path(g, `M${r - 10 * k} -8L${r} 0L${r - 12 * k} 6`, { stroke: col, 'stroke-width': 4 });
  if (t0 !== null) show(g, t0);
  return g;
}
// Symptom zones on a frontStand figure seen from behind (the patient's right = the viewer's right): the low back, the
// buttock, the thigh, the calf and the foot of one leg. set(level 0..4, 0 = only the back): spreading down is
// peripheralization, receding up is centralization.
function painZones(fs, k = 1) {
  const g = G(fs.top, {}), i = k > 0 ? 1 : 0, Z = [];
  const zone = () => { const e = mk('ellipse', { fill: PAIN, 'fill-opacity': .45, stroke: PAIN, 'stroke-width': 2, opacity: 0 }, g); Z.push(e); return e; };
  for (let j = 0; j < 5; j++) zone();
  const e = { g };
  e.set = lv => {
    const q = fs.pts, P = q.P, H = q.H[i], [K, A] = q.legs[i], mid = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
    const C = [[P[0], P[1] - 42, 30, 22], [H[0] + k * 4, H[1] + 4, 20, 18], [...mid(H, K, .5), 14, 38], [...mid(K, A, .45), 11, 34], [A[0] + k * 2, A[1] + 2, 14, 9]];
    Z.forEach((z, j) => { const [cx, cy, rx, ry] = C[j]; z.setAttribute('cx', f1(cx)); z.setAttribute('cy', f1(cy)); z.setAttribute('rx', rx); z.setAttribute('ry', ry); z.setAttribute('opacity', f1(clamp(lv - j + 1, 0, 1))); });
    return e;
  };
  e.set(0);
  return e;
}

  }],
