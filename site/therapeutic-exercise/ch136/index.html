function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);

  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });

// A labelled bar for a percentage on a horizontal axis.
function pctBar(p, x, y, w, v, col, label, t0, { h = 40 } = {}) {
  const g = G(p, { o: 0 });
  mk('rect', { x, y, width: w, height: h, rx: 10, fill: PANEL, stroke: COL.dim, 'stroke-width': 2 }, g);
  const b = mk('rect', { x, y, width: 0, height: h, rx: 10, fill: col }, g);
  T(g, label, { x, y: y - 12, size: 19, fill: COL.chalk, weight: 600 });
  const tv = T(g, '', { x: x + w + 14, y: y + h * .72, size: 22, fill: col, weight: 700 });
  show(g, t0);
  prog(q => { b.setAttribute('width', f1(w * v / 100 * q)); tv.textContent = `${Math.round(v * q)} %`; }, t0 + .3, 1.2);
  return g;
}

      { parts: ['Онемение промежности и нарушение мочеиспускания'], ans: ['d'], why: 'К врачу: признаки сдавления нервных структур.' },
      { parts: ['Сильная боль будит ночью и не меняется от положения'], ans: ['d'], why: 'К врачу: боль не объясняется механикой.' },
      { parts: ['Боль в пояснице централизуется при повторных прогибах'], ans: ['t'], why: 'Физическая терапия: разгибательная категория.' },
      { parts: ['Недавнее падение, перелом не исключён'], ans: ['d'], why: 'К врачу.' },
      { parts: ['Боль усиливается сидя и проходит при ходьбе'], ans: ['t'], why: 'Механическая картина — физическая терапия.' },
    ], [['t', 'Лечить', STB], ['d', 'К врачу', RED]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Большинство острых болей в спине проходит за шесть недель.', 'w1'],
     ['Красные флаги — признаки поражения спинного мозга, травма с неисключённым переломом, необъяснимая ночная боль — повод направить к врачу.', 'w2'],
     ['Стадии: острая — до 4 недель, подострая — до 12, хроническая — дольше.', 'w3'],
     ['Категории и направленное предпочтение подсказывают подход; централизация — хороший признак.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SP }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-stage', prompt: ['Боль в пояснице 10 дней: приходит и уходит, сидеть может минут двадцать, стоять — десять. Повторные прогибы назад уменьшают боль в ноге. Стадия и категория?'],
    build: choice([
      ['Острая без воспаления, разгибательная категория'],
      ['Острая с воспалением: ни одно положение не помогает'],
      ['Хроническая, постуральный синдром'],
      ['Подострая, сгибательная категория'],
    ], 0, 'Меньше четырёх недель, симптомы механические и перемежающиеся, критерии Делитто, разгибание централизует.',
    [null, 'При воспалении боль постоянная и положение её не снимает.', 'Хроническая — дольше 12 недель.', 'Прогибы облегчают — значит, не сгибательная.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-infl', prompt: ['Острая боль в шее после травмы: постоянная, ни одно положение не облегчает, есть признаки воспаления. Что уместно в первую очередь?'],
    build: choice([
      ['Врач и противовоспалительные средства, функциональное положение и обучение; позже — подход по категории'],
      ['Повторные прогибы шеи, пока боль не централизуется'],
      ['Высокоскоростная манипуляция'],
      ['Интенсивная тренировка силы'],
    ], 0, 'Острая стадия с воспалением: постоянная боль, положение не помогает — обычно нужны противовоспалительные средства; категорию определяют, когда симптомы станут механическими.',
    [null, 'Механический подход не работает, пока воспаление держит боль постоянной.', 'После травмы сначала исключают перелом и нестабильность.', 'Рано: острая воспалительная стадия.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
