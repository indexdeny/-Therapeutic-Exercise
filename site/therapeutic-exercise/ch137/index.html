  "на спине\nколени согнуты — сгибание поясницы; ноги прямые — разгибание; подушка под головой сгибает шею, валик под шеей держит лёгкий лордоз": "колени согнуты",
  "на животе\nподушка под животом — сгибание, без неё — разгибание; валик под лбом — шея прямо": "подушка — сгибание",
  "сидя\nобычно сгибание; подставка под ноги — больше сгибания; валик за поясницу — разгибание; подлокотники и откинутая спинка разгружают": "валик — разгибание",

  "включить глубокие мышцы\nпоясница — втягивание живота (поперечная) и выпячивание многораздельной; шея — мягкие кивки и лёгкое уплощение лордоза лёжа на спине": "втягивание живота; мягкие кивки",
  "базовая стабилизация\nсначала втягивание, потом лёгкие движения рук без боли; ноги — когда пациент держит таз; если трудно — пассивная поддержка": "втягивание → движения рук → ноги",
  "функциональные движения\nповороты, из положения лёжа в положение сидя, вставание, ходьба — с защищённым позвоночником": "повороты, вставание, ходьба",
  "когда\nвоспаление под контролем, боль не постоянная; риск — перегрузиться, потому что хорошо, или бояться и не двигаться": "риск — перегрузиться или бояться",
  "процедуры от боли — уже не нужны\nакцент: поза, сила, подвижность, контроль": "акцент: поза, сила, подвижность, контроль",
  "прогрессия\nесли направленное предпочтение сохраняется — упражнения под него; скольжение по стене, неполные приседания и выпады, толкание и тяга; когда контроль освоен — динамика: скручивания, разгибания спины, движения шеей; следить за симптомами": "под предпочтение → динамика",

// cards-short end

const SP = '#8fd6b0', EXT = '#86c9e8', FLX = '#f0a04b', NWB = '#bba8ee', PH = [COL.bad, COL.task, COL.good], TRA = ANAT.taut;
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
function numLine(p, n, str, x, y, col, t0, { size = 22, maxW = 860 } = {}) {
  const g = G(p, { o: 0 });
  mk('circle', { cx: x + 20, cy: y - 8, r: 19, fill: col }, g);
  T(g, String(n), { x: x + 20, y: y, size: 22, weight: 700, fill: COL.board, anchor: 'middle' });
  put(para(g, str, x + 54, y, null, { size, maxW }), { o: 1 });
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
// A posture figure lying on a table top at y: 'supine' (head left) or 'prone' (head right).
function lying(p, x, y, s, t0, kind, pose = {}) {
  const f = postureFig(p, 0, 0, s, t0, { pose });
  put(f.g, kind === 'supine' ? { x, y: y - 75 * s, r: -90 } : { x, y: y - 78 * s, r: 90 });
  return f;
}
// A seated posture figure on a stool at the seat height: thighs horizontal, feet on the floor at gy.
function seated(p, x, gy, s, t0, pose = {}) {
  const f = postureFig(p, x, gy, s, t0, { pose: { shank: 0, thigh: -90, ...pose } });
  const H = f.at('hip');
  const ch = path(p, `M${f1(H[0] - 70 * s)} ${f1(H[1] + 34 * s)}H${f1(H[0] + 40 * s)}M${f1(H[0] - 60 * s)} ${f1(H[1] + 34 * s)}V${gy}M${f1(H[0] + 30 * s)} ${f1(H[1] + 34 * s)}V${gy}`, { stroke: COL.dim, 'stroke-width': 5 }, { o: 0 });
  p.insertBefore(ch, f.g);
  if (t0 !== null) show(ch, t0);
  return f;
}
const table = (p, x1, x2, y, t0) => show(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.dim, 'stroke-width': 6 }, { o: 0 }), t0);
const pillow = (p, x, y, rx, ry, t0) => { const e = mk('ellipse', { cx: x, cy: y, rx, ry, fill: '#c8b8e8', 'fill-opacity': .75, stroke: '#a090c8', 'stroke-width': 2, opacity: 0 }, p); if (t0 !== null) show(e, t0); return e; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Ведение по фазам', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 15 · Урок 137', { x: 800, y: 130, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'Ведение по фазам восстановления', { x: 800, y: 215, size: 56, weight: 600, anchor: 'middle' });
    T(g, 'защита · контролируемое движение · функция', { x: 800, y: 280, size: 40, weight: 600, anchor: 'middle', fill: COL.dim });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'острые, подострые и хронические нарушения позвоночника', 800, 360, m('sub'), { size: 30, fill: SP, anchor: 'middle', weight: 600 });

    ['защита', 'контролируемое движение', 'возвращение к функции'].forEach((s, i) => { const b = G(art, {}); mk('rect', { x: 260 + i * 370, y: 560, width: 350, height: 80, rx: 14, fill: PH[i], 'fill-opacity': .85 }, b); T(b, s, { x: 435 + i * 370, y: 610, size: 22, fill: COL.board, weight: 700, anchor: 'middle' }); });

    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);

  ['acute', 'Острая фаза', (m, D) => {

    infoCard(p, 60, 500, 720, 120, 'главное — пациент участвует сам', null, COL.chalk, m('mod', 3), { size: 20 });
  }],

  ['bias', 'Три категории в острой фазе', (m, D) => {
    const p = panel(0);
    txt(p, 'разгибательная, сгибательная, разгрузочная', 800, 56, m('ext'), { size: 28, weight: 700, anchor: 'middle', fill: SP });
    table(p, 80, 560, 330, m('ext'));

    table(p, 620, 1000, 330, m('flx'));

    b.to({ shank: 30, thigh: -110, lord: 20, tilt: -10 }, m('flx', 1), 1.6);
    infoCard(p, 590, 360, 440, 230, 'сгибательная', 'легче в сгибании, хуже в разгибании: стеноз, спондилёз, спондилолистез', FLX, m('flx'), { size: 18 });
    table(p, 1060, 1540, 330, m('nwb'));
    const c = lying(p, 1510, 330, .46, m('nwb'), 'supine', { shank: 0, thigh: 0 });
    const tr = G(p, { o: 0 }); path(tr, 'M1330 230H1470M1456 220L1472 230L1456 240', { stroke: NWB, 'stroke-width': 5 }); T(tr, 'тракция', { x: 1400, y: 212, size: 18, fill: NWB, weight: 700, anchor: 'middle' }); show(tr, m('nwb', 1));
    infoCard(p, 1060, 360, 500, 230, 'разгрузочная', 'легче лёжа, на тракции, с опорой на руки, в бассейне; хуже стоя, при ходьбе, кашле', NWB, m('nwb'), { size: 18 });
    infoCard(p, 60, 640, 1500, 180, 'направленное предпочтение', 'при острой и хронической боли в пояснице упражнения по нему — сгибание, разгибание или боковое скольжение с поворотом — лучше общих упражнений', SP, m('tip'), { size: 20 });
  }],

  ['pos', 'Пассивное позиционирование', (m, D) => {
    const p = panel(0);
    txt(p, 'пассивное позиционирование (блок 15.6)', 800, 56, m('kin'), { size: 28, weight: 700, anchor: 'middle', fill: SP });
    pillRow(p, ['наклоны таза — поясница', 'кивки и втягивание подбородка — шея'], 800, 110, m('kin', .5), { col: COL.whole, size: 19 });
    txt(p, 'корсет или воротник — только в тяжёлых случаях, ненадолго, после операции', 800, 160, m('kin', 3), { size: 18, fill: COL.dim, anchor: 'middle', weight: 600 });
    // supine: knees bent flex the lumbar spine, legs straight extend it
    table(p, 60, 520, 400, m('sup'));
    const a = lying(p, 470, 400, .44, m('sup'), 'supine', { shank: 0, thigh: 0 });
    a.to({ shank: 50, thigh: -50, lord: 26, tilt: -6 }, m('sup', 1.5), 1.4);
    txt(p, 'на спине: колени согнуты → сгибание', 290, 440, m('sup', 1.5), { size: 18, fill: FLX, anchor: 'middle', weight: 700 });
    // prone: a pillow under the abdomen flexes
    table(p, 580, 1040, 400, m('pro'));
    const pl = pillow(p, 830, 382, 60, 18, null);
    const b = lying(p, 620, 400, .44, m('pro'), 'prone', { shank: 0, thigh: 0, arm: 10 });

    // sitting: a lumbar roll extends
    const c = seated(p, 1300, 450, .42, m('sit'), { tilt: -16, lord: 22, kyph: 50 });
    const roll = mk('ellipse', { rx: 10, ry: 18, fill: '#c8b8e8', stroke: '#a090c8', 'stroke-width': 2, opacity: 0 }, p);
    const R = c.unit(2, -P_BACK[2] - 10); roll.setAttribute('cx', f1(R[0] - 4)); roll.setAttribute('cy', f1(R[1]));
    show(roll, m('sit', 2)); c.to({ tilt: 0, lord: 46, kyph: 42 }, m('sit', 2), 1.2);
    txt(p, 'сидя: валик за поясницей → разгибание', 1300, 490, m('sit', 2), { size: 18, fill: EXT, anchor: 'middle', weight: 700 });
    const C = [['на спине', 'колени согнуты — сгибание поясницы; ноги прямые — разгибание; подушка под головой сгибает шею, валик под шеей держит лёгкий лордоз', 'sup'],
      ['на животе', 'подушка под животом — сгибание, без неё — разгибание; валик под лбом — шея прямо', 'pro'],
      ['сидя', 'обычно сгибание; подставка под ноги — больше сгибания; валик за поясницу — разгибание; подлокотники и откинутая спинка разгружают', 'sit'],
      ['стоя', 'обычно разгибание; нога на низкой подставке — сгибание', 'std']];

  ['stab', 'Глубокие мышцы и базовая стабилизация', (m, D) => {

    f.to({ arm: 150, hd: 0, cerv: 34 }, m('bas', 1.5), 1.6);
    txt(p, 'потом — движения рук, затем ног', 380, 480, m('bas', 1.5), { size: 19, fill: COL.good, anchor: 'middle', weight: 700 });
    infoCard(p, 720, 100, 840, 200, 'включить глубокие мышцы', 'поясница — втягивание живота (поперечная) и выпячивание многораздельной; шея — мягкие кивки и лёгкое уплощение лордоза лёжа на спине', TRA, m('deep'), { size: 19 });
    infoCard(p, 720, 320, 840, 200, 'базовая стабилизация', 'сначала втягивание, потом лёгкие движения рук без боли; ноги — когда пациент держит таз; если трудно — пассивная поддержка', COL.good, m('bas'), { size: 19 });
    infoCard(p, 720, 540, 840, 200, 'функциональные движения', 'повороты, из положения лёжа в положение сидя, вставание, ходьба — с защищённым позвоночником', COL.whole, m('fun'), { size: 19 });
    const go = G(p, { o: 0 }); show(go, m('fun', 3));
    [['сидеть', '> 30 мин'], ['стоять', '> 15 мин'], ['ходьба', '> 1,6 км']].forEach(([a, b], i) => { roundBox(go, 80 + i * 200, 560, 180, 110, SP, PANEL, 2.5); T(go, a, { x: 170 + i * 200, y: 600, size: 20, fill: COL.chalk, weight: 600, anchor: 'middle' }); T(go, b, { x: 170 + i * 200, y: 645, size: 26, fill: SP, weight: 700, anchor: 'middle' }); });
    T(go, 'в книге — 1 миля', { x: 570, y: 700, size: 16, fill: COL.dim, weight: 600, anchor: 'end' });
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-pos', prompt: ['Как это положение влияет на поясницу?'],
    build: grid([
      { parts: ['Лёжа на спине, колени согнуты'], ans: ['f'], why: 'Сгибание.' },
      { parts: ['Лёжа на животе без подушки'], ans: ['e'], why: 'Разгибание.' },
      { parts: ['Сидя с валиком за поясницей'], ans: ['e'], why: 'Разгибание.' },
      { parts: ['Стоя, одна нога на низкой подставке'], ans: ['f'], why: 'Сгибание.' },
      { parts: ['Лёжа на животе с подушкой под животом'], ans: ['f'], why: 'Сгибание.' },
    ], [['f', 'Сгибание', FLX], ['e', 'Разгибание', EXT]], { multi: false, text: true }),
  }], done) }],

  ['sub', 'Подострая фаза', (m, D) => {
    const p = panel(0);
    txt(p, 'подострая фаза — контролируемое движение (блок 15.7)', 800, 56, m('sa'), { size: 28, weight: 700, anchor: 'middle', fill: PH[1] });
    infoCard(p, 60, 90, 720, 210, 'когда', 'воспаление под контролем, боль не постоянная; риск — перегрузиться, потому что хорошо, или бояться и не двигаться', PH[1], m('sa'), { size: 19 });
    infoCard(p, 60, 315, 720, 130, 'процедуры от боли — уже не нужны', 'акцент: поза, сила, подвижность, контроль', COL.dim, m('pm'), { size: 19 });

    P.forEach((s, i) => numLine(p, i + 1, s, 820, 120 + i * 82, PH[1], m('box', i * 1.2), { size: 19, maxW: 680 }));
    infoCard(p, 60, 470, 720, 400, 'прогрессия', 'если направленное предпочтение сохраняется — упражнения под него; скольжение по стене, неполные приседания и выпады, толкание и тяга; когда контроль освоен — динамика: скручивания, разгибания спины, движения шеей; следить за симптомами', PH[1], m('tip'), { size: 19 });
  }],

  ['chr', 'Хроническая фаза', (m, D) => {
    const p = panel(0);
    txt(p, 'хроническая фаза — возвращение к функции (блок 15.8)', 800, 56, m('rf'), { size: 28, weight: 700, anchor: 'middle', fill: PH[2] });
    const f = fig(p, { s: 1, o: 0, pose: SQUAT }); plant(f, 'AN', 360, 780); show(f.g, m('rf'));
    const bx = G(p, { o: 0 }); boxProp(bx, 90, 70);
    f.onSet.push(() => { const [wx, wy] = onStage(f, 'WN'); put(bx, { x: wx - 10, y: wy - 20 }); }); f.set({});
    show(bx, m('rf'));
    prog(q => { const e = cyc(q, 1.75); const ps = {}; for (const k in SQUAT) ps[k] = lerp(SQUAT[k], STAND[k], e); f.set({ ...ps, aN: lerp(SQUAT.aN, 40, e), aF: lerp(SQUAT.aF, 40, e), eN: lerp(SQUAT.eN || 0, 60, e) }); plant(f, 'AN', 360, 780); }, m('rf', 1), 4, lin);
    txt(p, 'грузчики, пожарные, уход за людьми, спорт', 360, 840, m('rf', .5), { size: 19, fill: COL.chalk, anchor: 'middle', weight: 700 });
    const P = ['контроль при интенсивных, повторяющихся нагрузках и в переходах на равновесие', 'подвижность мышц, суставов, фасции, нервов', 'динамическая сила, координация, выносливость', 'аэробная нагрузка — интенсивнее', 'привычка расслабляться и исправлять позу', 'эргономика работы и дома', 'тренировка задач: контроль, выносливость, равновесие, ловкость, точность, скорость', 'здоровые привычки на будущее'];
    P.forEach((s, i) => numLine(p, i + 1, s, 700, 120 + i * 92, PH[2], m('b8', i * 1.1), { size: 19, maxW: 800 }));
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-phase', prompt: ['Какая это фаза?'],
    build: grid([
      { parts: ['Боль постоянная, ищем функциональное положение'], ans: ['a'], why: 'Острая фаза — защита.' },
      { parts: ['Скольжение по стене и неполные выпады с контролем позвоночника'], ans: ['s'], why: 'Подострая — контролируемое движение.' },
      { parts: ['Тренировка подъёма грузов на скорость и выносливость'], ans: ['c'], why: 'Хроническая — возвращение к функции.' },
      { parts: ['Процедуры для снятия боли уже не рекомендуются'], ans: ['s'], why: 'Подострая.' },
      { parts: ['Покой — только первые пару дней, если нужен'], ans: ['a'], why: 'Острая.' },
    ], [['a', 'Острая', PH[0]], ['s', 'Подострая', PH[1]], ['c', 'Хроническая', PH[2]]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Острая фаза: обучение, функциональное положение, включение глубоких мышц, безопасные базовые движения.', 'w1'],
     ['Подострая: выносливость, сила, стабилизация с движениями конечностей, без процедур от боли.', 'w2'],
     ['Хроническая: контроль при интенсивных и повторяющихся нагрузках и тренировка конкретных задач.', 'w3'],
     ['Во всех фазах учитывают направленное предпочтение.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SP }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-sit', prompt: ['Пациенту с разгибательной категорией надо три часа ехать в машине. Как поддержать позвоночник?'],
    build: choice([
      ['Валик за поясницу; по возможности остановки с прогибами назад'],
      ['Подставка под ноги, чтобы сильнее согнуться'],
      ['Наклониться вперёд к рулю'],
      ['Подушка под голову, чтобы согнуть шею'],
    ], 0, 'Сидя позвоночник сгибается; валик за поясницей даёт разгибание — нужное при разгибательной категории.',
    [null, 'Подставка усиливает сгибание.', 'Наклон вперёд повышает давление в диске.', 'Шея здесь ни при чём.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-overdo', prompt: ['Через пять недель после острой боли пациентке гораздо лучше, и она сразу вскопала весь огород. Наутро боль вернулась. Какую ошибку подострой фазы это иллюстрирует?'],
    build: choice([
      ['Перегрузка из-за хорошего самочувствия — нужна постепенная, контролируемая прогрессия'],
      ['Слишком долгий постельный режим'],
      ['Страх движения'],
      ['Неправильный выбор процедур от боли'],
    ], 0, 'В подострой фазе опасны две крайности: перегрузка, когда стало лучше, и страх движения; обе тормозят восстановление.',
    [null, 'Пациентка как раз была активна.', 'Страх ведёт к недостатку движения, а здесь — избыток.', 'Процедуры на этом этапе уже не главное.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
