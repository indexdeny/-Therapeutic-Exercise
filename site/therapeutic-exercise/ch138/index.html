const SP = '#8fd6b0', EXT = '#86c9e8', NWB = '#bba8ee', PAIN = '#ff5a3c', CEN = COL.good, PER = COL.bad, SH = '#f0a04b';
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, g = pill(p, s, x + ws[i] / 2, y, t0 === null ? null : t0 + i * gap, { col: c, size }); x += ws[i] + space; return g; });
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
function lying(p, x, y, s, t0, kind, pose = {}) {
  const f = postureFig(p, 0, 0, s, t0, { pose });
  put(f.g, kind === 'supine' ? { x, y: y - 75 * s, r: -90 } : { x, y: y - 78 * s, r: 90 });
  return f;
}
const table = (p, x1, x2, y, t0) => show(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.dim, 'stroke-width': 6 }, { o: 0 }), t0);

  path(g, 'M0 0V40M-6 40L-14 150L-10 260L-30 290H10L6 260L12 150L8 40', { stroke: COL.dim, 'stroke-width': 3 });

  T(g, 'симптомы', { x: 0, y: -24, size: 16, fill: COL.dim, weight: 600, anchor: 'middle' });
  const e = { g, set: lv => { bar.setAttribute('height', f1(20 + lv * 70)); return e; } };
  e.set(3);
  if (t0 !== null) show(g, t0);
  return e;
}

// Prone press-up: the hand stays planted at HAND (the figure's standing frame, where the table is the line x = 78);
// the arm angles come from two-link IK — upper arm 150, forearm 132, the arm angle is measured from hanging + 4°.
const UA = 150, FA = 132, D2R = Math.PI / 180, HAND = [72, -769];
function pressPose(lord, kyph, W, extra = {}) {
  const q = { ...PSTD, shank: 0, thigh: 0, cerv: 34, ...extra, lord, kyph };
  const S = postureGeo(q).Sh, dx = W[0] - S[0], dy = W[1] - S[1], d = Math.min(Math.hypot(dx, dy), UA + FA - .01);
  const th = Math.atan2(dx, dy) / D2R, al = Math.acos((UA * UA + d * d - FA * FA) / (2 * UA * d)) / D2R, be = Math.acos((FA * FA + d * d - UA * UA) / (2 * FA * d)) / D2R;
  return { ...q, arm: th - al - 4, elb: al + be, wr: 180 - (th - al) - (al + be) - 4 }; // the palm flat on the table, fingers to the head
}

    infoCard(p, 680, 90, 880, 230, 'терапевт', 'со стороны сдвига; плечом — в локоть пациента у рёбер; обхватывает таз с другой стороны: таз к себе, грудь от себя; при перекоррекции сдвиг уходит на другую сторону; сразу после — прогиб назад стоя, потом лёжа', SH, m('man', 4.5), { size: 19 });
    infoCard(p, 680, 340, 880, 150, 'самокоррекция (рис. 15.8)', 'ладонь — на смещённые рёбра, другая — на гребень противоположной подвздошной кости; сдвинуть к середине и держать', COL.whole, m('self'), { size: 19 });
    infoCard(p, 680, 510, 880, 360, 'обучение', 'разгибания часто: например 10 раз каждый час в первые дни, после пробуждения, после сидения и наклонов; стоп при периферизации; валик в машине и мягком кресле, полотенце вокруг талии на ночь; перед наклоном или натуживанием — сначала разогнуться, после — прогибы', EXT, m('edu'), { size: 19 });
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-resp', prompt: ['Пациент делает прогибы. Что делать при таком ответе?'],
    build: grid([
      { parts: ['Боль в ноге уменьшилась, в пояснице чуть усилилась'], ans: ['g'], why: 'Это централизация — продолжать.' },
      { parts: ['Онемение спустилось к стопе'], ans: ['s'], why: 'Периферизация — остановиться и переоценить.' },
      { parts: ['Туловище смещено вбок, прогиб усиливает боль'], ans: ['c'], why: 'Сначала исправить боковой сдвиг.' },
      { parts: ['С каждым прогибом боль поднимается выше по ноге'], ans: ['g'], why: 'Централизация — продолжать.' },
      { parts: ['Ни одно положение не уменьшает боль'], ans: ['s'], why: 'Разгибательный подход не применяют; нужна оценка.' },
    ], [['g', 'Продолжать', CEN], ['s', 'Стоп, переоценить', PER], ['c', 'Исправить сдвиг', SH]], { multi: false, text: true }),
  }], done) }],

  ['trac', 'Тракция и дальше', (m, D) => {
    const p = panel(0);
    txt(p, 'тракция, мобилизация, обучение', 800, 56, m('lt'), { size: 28, weight: 700, anchor: 'middle', fill: EXT });
    table(p, 80, 760, 330, m('lt'));
    const f = lying(p, 720, 330, .64, m('lt'), 'supine', { shank: 0, thigh: 0 });
    const ar = G(p, { o: 0 }); path(ar, 'M560 250H700M686 238L702 250L686 262', { stroke: NWB, 'stroke-width': 6 }); T(ar, '> ½ веса тела', { x: 630, y: 230, size: 19, fill: NWB, weight: 700, anchor: 'middle' }); show(ar, m('lt', .5));
    pillRow(p, ['прерывистая < 15 мин', 'постоянная < 10 мин'], 420, 390, m('lt', 1), { col: NWB, size: 18 });
    infoCard(p, 60, 430, 700, 130, 'дома', 'близкий тянет за ногу больной стороны по 10–15 с', NWB, m('lt', 11.5), { size: 19 });
    infoCard(p, 820, 90, 740, 150, 'мобилизация I–IV — да, толчок — нет', 'высокоскоростной толчок может вызвать воспаление и включает ротацию', COL.task, m('mob'), { size: 19 });
    infoCard(p, 820, 255, 740, 260, 'дальше', 'наклоны таза без боли в разных положениях — заканчивать наклоном таза вперёд и разгибанием; стабилизация без задержки дыхания; ходьба, плавание; пассивный подъём прямой ноги с движениями стопы', CEN, m('kin'), { size: 19 });
    infoCard(p, 60, 580, 700, 290, 'улучшение и ухудшение', 'лучше: нет деформации, больше движения, тесты оболочки отрицательны; хуже: боль в спине прошла, а неврологические признаки нарастают', PER, m('impr'), { size: 19 });
    infoCard(p, 820, 530, 740, 340, 'профилактика', 'после сгибательных упражнений — разгибательные; в долгом сгибании — прогиб хотя бы раз в час и наклоны таза; почувствовал протрузию — сразу прогибы лёжа, наклон таза на четвереньках или прогиб стоя', EXT, m('later'), { size: 19 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-tf', prompt: ['Верно или неверно?'],
    build: grid([
      { parts: ['Прерывистую поясничную тракцию держат меньше 15 минут'], ans: ['t'], why: 'Верно.' },
      { parts: ['Высокоскоростной толчок перед прогибами — хорошая идея'], ans: ['f'], why: 'Неверно: может вызвать воспаление.' },
      { parts: ['Боль в спине ушла, а слабость в ноге нарастает — это улучшение'], ans: ['f'], why: 'Неверно: это ухудшение.' },
      { parts: ['Комплекс заканчивают наклоном таза вперёд и разгибанием'], ans: ['t'], why: 'Верно.' },
      { parts: ['Строгий постельный режим ускоряет восстановление диска'], ans: ['f'], why: 'Неверно: при подъёме давление резко растёт.' },
    ], [['t', 'Верно', CEN], ['f', 'Неверно', PER]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Разгрузочная категория — тракция и бассейн.', 'w1'],
     ['Давление в диске растёт сидя и в наклоне, при натуживании и изометрии; строгий постельный режим не нужен.', 'w2'],
     ['Разгибание — от подушек до прогибов на руках, пока симптомы централизуются; периферизация — стоп.', 'w3'],
     ['Боковой сдвиг исправляют до разгибания.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SP }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-shift', prompt: ['У пациентки грудная клетка смещена вправо, таз влево; попытка прогнуться назад усиливает боль в ноге. С чего начать?'],
    build: choice([
      ['Исправить боковой сдвиг, затем сразу прогиб назад и прогрессия разгибания'],
      ['Повторять прогибы, пока боль не пройдёт'],
      ['Наклоны вперёд до касания пола'],
      ['Высокоскоростной толчок в пояснице'],
    ], 0, 'При боковом сдвиге одно разгибание не уменьшит протрузию — сначала коррекция сдвига, затем разгибание.',
    [null, 'Пока сдвиг не исправлен, прогибы усиливают боль.', 'Сгибание противопоказано, если разгибание даёт централизацию.', 'Толчок с ротацией нагружает диск и может вызвать воспаление.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-lift', prompt: ['Пациенту прогибы помогли, но на работе ему нужно поднять несколько коробок. Что посоветовать?'],
    build: choice([
      ['Перед подъёмом разогнуться, поднимать осторожно, а после — повторить прогибы'],
      ['Задержать дыхание и натужиться'],
      ['Поднимать с прямыми ногами и согнутой спиной'],
      ['Перед подъёмом сделать двадцать наклонов вперёд'],
    ], 0, 'Если сгибание или натуживание неизбежно, позвоночник предварительно разгибают, а после выполняют повторные разгибания.',
    [null, 'Натуживание повышает давление в диске.', 'Наклон со сгибанием спины перегружает диск.', 'Сгибание усилит симптомы.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
function lab0(p, str, x, y, tx, ty, col, t0, size = 19) {
  const g = G(p, { o: 0 }), right = tx > x;
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: 'start' });
  path(g, `M${x + uiW(str, size) + 8} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}

boot();
</script>
