'use strict';
const CHAPTER = { number: 139, title: 'Шейный диск, операции, сгибательный подход', minutes: 9, language: 'ru', next: '../ch140/' };
// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch139/cards.ru.json

// cards-short end

const SP = '#8fd6b0', EXT = '#86c9e8', FLX = '#f0c060', SURG = '#c9b8e8', PAIN = '#ff5a3c', OSTEO = '#d9cfb8', MEN = '#e8a0a8';
const METAL = '#a9b8c6', GRAFT = '#e6d6a8';
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : x + (right ? 8 : -8);
  path(g, `M${lx} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const swing = (q, n) => Math.sin(2 * Math.PI * n * q);
const f1 = v => v.toFixed(1);
const BN = ANAT.bone, BL = mix(ANAT.bone, '#000000', .45);
function lying(p, x, y, s, t0, kind, pose = {}) {
  const f = postureFig(p, 0, 0, s, t0, { pose });
  put(f.g, kind === 'supine' ? { x, y: y - 75 * s, r: -90 } : { x, y: y - 78 * s, r: 90 });
  return f;
}
function seated(p, x, gy, s, t0, pose = {}) {
  const f = postureFig(p, x, gy, s, t0, { pose: { shank: 0, thigh: -90, ...pose } });
  const H = f.at('hip');
  const ch = path(p, `M${f1(H[0] - 70 * s)} ${f1(H[1] + 34 * s)}H${f1(H[0] + 40 * s)}M${f1(H[0] - 60 * s)} ${f1(H[1] + 34 * s)}V${gy}M${f1(H[0] + 30 * s)} ${f1(H[1] + 34 * s)}V${gy}`, { stroke: COL.dim, 'stroke-width': 5 }, { o: 0 });
  p.insertBefore(ch, f.g);
  if (t0 !== null) show(ch, t0);
  return f;
}
const table = (p, x1, x2, y, t0) => show(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.dim, 'stroke-width': 6 }, { o: 0 }), t0);
// Supine with the hip flexed phi degrees and the heel kept on the table (heel slide, hook-lying). The figure hangs from
// its ankle, so the group is shifted to keep the hip where it was: x0 is the x the figure was laid at.
function hook(f, x0, s, phi) {
  const sg = Math.asin(216 * Math.sin(rad(phi)) / 221) / rad(1);
  f.set({ thigh: -phi, shank: sg });
  const Hy = -41 - 221 * Math.cos(rad(sg)) - 216 * Math.cos(rad(phi));
  put(f.g, { x: x0 + (-478 - Hy) * s });
}
// A facet joint in close-up with its meniscoid fold (as in lesson 135). set({ trap, glide }).
function facetZoom(p, x, y, s, t0) {
  const g = G(p, { x, y, s, o: 0 }), a = { fill: BN, stroke: BL, 'stroke-width': 2.5, 'stroke-linejoin': 'round' };
  const low = G(g, {});
  mk('path', { d: 'M-170 220L-150 40Q-140 18 -110 14L110 14Q140 18 150 40L170 220Z', ...a }, low);
  mk('path', { d: 'M-118 20Q0 4 118 20', fill: 'none', stroke: CART, 'stroke-width': 12, 'stroke-linecap': 'round' }, low);
  const up = G(g, {});
  mk('path', { d: 'M-170 -220L-150 -40Q-140 -18 -110 -14L110 -14Q140 -18 150 -40L170 -220Z', ...a }, up);
  mk('path', { d: 'M-118 -20Q0 -4 118 -20', fill: 'none', stroke: CART, 'stroke-width': 12, 'stroke-linecap': 'round' }, up);
  const fluid = mk('ellipse', { cx: 0, cy: 0, rx: 120, ry: 6, fill: '#7fc4e8', opacity: .6 }, g);
  const cap = [-1, 1].map(() => path(g, '', { stroke: ANAT.tendon, 'stroke-width': 6 }));
  const men = mk('path', { fill: MEN, stroke: mix(MEN, '#000000', .3), 'stroke-width': 2 }, g);
  const pain = G(g, { o: 0 }); mk('circle', { r: 26, fill: PAIN, 'fill-opacity': .35, stroke: PAIN, 'stroke-width': 4 }, pain);
  const S = { trap: 0, glide: 0 }, e = { g };
  e.set = o => {
    Object.assign(S, o);
    const gy = -30 * S.glide;
    put(up, { y: gy });
    [-1, 1].forEach((k, i) => {
      cap[i].setAttribute('d', `M${k * 150} ${f1(-60 + gy)}Q${k * 176} 0 ${k * 150} 60`);
      cap[i].setAttribute('stroke', mix(ANAT.tendon, ANAT.taut, clamp(S.trap, 0, 1)));
    });
    fluid.setAttribute('cy', f1(gy / 2));
    const tx = lerp(190, 110, S.trap);
    men.setAttribute('d', `M176 -18Q${f1(tx)} ${f1(-12 + gy / 2)} ${f1(tx - 26 * S.trap)} ${f1(gy / 2)}Q${f1(tx)} ${f1(12 + gy / 2)} 176 18Z`);
    put(pain, { x: 150, y: 0, o: clamp(S.trap * 1.2, 0, 1) });
    return e;
  };
  e.at = (px, py) => { const s0 = st(g); return [s0.x + px * s0.s, s0.y + py * s0.s]; };
  e.set({});
  if (t0 !== null) show(g, t0);
  return e;
}
// Hardware over a spineSeg at stage (x, y), scale s, in the segment's own frame (bodies at y ∓62, anterior +x).
function hw(p, x, y, s, draw) { const g = G(p, { x, y, s, o: 0 }); draw(g); return g; }
const screw = (g, x1, y1, x2, y2) => {
  path(g, `M${x1} ${y1}L${x2} ${y2}`, { stroke: mix(METAL, '#000000', .35), 'stroke-width': 13, 'stroke-linecap': 'round' });
  path(g, `M${x1} ${y1}L${x2} ${y2}`, { stroke: METAL, 'stroke-width': 8, 'stroke-linecap': 'round', 'stroke-dasharray': '6 4' });
};

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Шея, операции, сгибание', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 15 · Урок 139', { x: 800, y: 130, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'Шейный диск, операции', { x: 800, y: 215, size: 56, weight: 600, anchor: 'middle' });
    T(g, 'и сгибательный подход', { x: 800, y: 280, size: 40, weight: 600, anchor: 'middle', fill: COL.dim });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'втягивание подбородка, тракция, ламинэктомия, спондилодез', 800, 360, m('sub'), { size: 30, fill: SP, anchor: 'middle', weight: 600 });
    const art = G(scene, { o: 0 });
    const f = seated(art, 860, 860, .62, null, { arm: 12, elb: 60 });
    [...art.children].forEach(c => put(c, { o: 1 }));
    prog(q => f.set({ fh: -cyc(q, 2) }), 1, Math.max(3, D - 2), lin);
    show(art, .3);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);
  }],

  ['cerv', 'Шейный диск', (m, D) => {
    const p = panel(0);
    txt(p, 'шейный диск: вытяжение, разгибание, тракция', 800, 56, m('c67'), { size: 28, weight: 700, anchor: 'middle', fill: EXT });
    const st0 = postureFig(p, 200, 860, .8, m('c67'), { regions: true });
    const C67 = st0.unit(18, 0);
    const ring = G(p, { x: C67[0], y: C67[1], o: 0 }); mk('circle', { r: 14, fill: 'none', stroke: PAIN, 'stroke-width': 4 }, ring);
    show(ring, m('c67', 1.5)); pulse(ring, m('c67', 2));
    lab(p, 'C6–C7', 330, 400, ...C67, PAIN, m('c67', 1.5), { size: 22 });
    infoCard(p, 440, 90, 580, 230, 'чаще всего C6–C7', 'на переходе лордоза в кифоз; дегенерация, остеофиты, осанка; хуже при сгибании нижней шеи и верхней груди, легче при осевом вытяжении; экструзия — часто операция', EXT, m('c67'), { size: 19 });
    // supine without a pillow: axial extension (retraction), then extension
    table(p, 460, 1040, 560, m('ret'));
    const sup = lying(p, 1010, 560, .58, m('ret'), 'supine', { shank: 0, thigh: 0 });
    prog(q => sup.set({ fh: -q }), m('ret', 1), 2);
    txt(p, 'голова отклонена или повёрнута → сначала к середине (иногда 10–20 мин)', 750, 380, m('ret', 5.5), { size: 17, fill: COL.dim, anchor: 'middle', weight: 600 });
    prog(q => sup.set({ fh: -1 + q, hd: -16 * q, cerv: 34 + 14 * q }), m('ret', 12), 2);
    pillRow(p, ['осевое вытяжение', 'переразгибание', 'ротация'], 750, 610, [m('ret'), m('ret', 12), m('ret', 13.5)], { col: EXT, size: 18 });
    pill(p, 'симптомы вниз по руке — стоп', 750, 652, m('ret', 15), { col: COL.bad, size: 18 });
    // seated chin tucks
    const sf = seated(p, 1330, 560, .6, m('self'), { arm: 12, elb: 60 });
    prog(q => sf.set({ fh: -cyc(q, 3) }), m('self', .5), 6);
    const ch = sf.at('chin');
    arrowTo(p, [ch[0] + 70, ch[1] + 4], [ch[0] + 22, ch[1] + 4], m('self', .5), { col: EXT });
    pill(p, 'не сжимать ВНЧС · H-рефлекс ↑', 1310, 605, m('self', 6.6), { col: EXT, size: 17 });
    // traction
    sup.set({ fh: 0, hd: 0, cerv: 34 });
    const hd0 = sup.at('head');
    const tr = G(p, { o: 0 }); path(tr, `M${f1(hd0[0] - 50)} ${f1(hd0[1])}H${f1(hd0[0] - 130)}M${f1(hd0[0] - 116)} ${f1(hd0[1] - 12)}L${f1(hd0[0] - 132)} ${f1(hd0[1])}L${f1(hd0[0] - 116)} ${f1(hd0[1] + 12)}`, { stroke: SURG, 'stroke-width': 6 }); show(tr, m('tr'));
    T(tr, '≥ 7 кг', { x: hd0[0] - 90, y: hd0[1] - 26, size: 19, fill: SURG, weight: 700, anchor: 'middle' });
    infoCard(p, 440, 690, 580, 180, 'тракция шеи', 'постоянная — до 10 мин, прерывистая — до 15; сила ≥ 7 кг (в книге — 15 фунтов); дома близкий тянет 10–30 с', SURG, m('tr'), { size: 19 });
    infoCard(p, 1060, 690, 500, 180, 'Шельман и Оберг, n = 77', 'через год все группы ≈ 70 % улучшения; первые 3 недели разгибательные упражнения лучше', COL.dim, m('ev'), { size: 19 });
  }],

  ['sx', 'Операции', (m, D) => {
    const p = panel(0);
    txt(p, 'ламинэктомия и спондилодез', 800, 56, m('ind'), { size: 28, weight: 700, anchor: 'middle', fill: SURG });
    const X = 400, Y = 500, S = 1.25;
    const sg = spineSeg(p, X, Y, S, m('ind'), { ligs: false });
    pill(p, 'схема: один поясничный сегмент, вперёд →', 330, 120, m('ind'), { col: COL.dim, size: 16 });
    infoCard(p, 640, 90, 920, 120, 'показания', 'корешковые симптомы в руке или ноге, когда не помогли физическая терапия, лекарства и инъекции', SURG, m('ind'), { size: 19 });
    // laminectomy: the arch and spinous process of the upper vertebra go; the segment still moves
    const ghost = G(p, { x: X, y: Y - 62 * S, s: S, o: 0 });
    ['M-112 -40L-170 -38L-178 10L-150 14L-118 -6Z', 'M-168 -34L-244 -22Q-262 -6 -246 14L-170 22Z'].forEach(d => mk('path', { d, fill: PAIN, 'fill-opacity': .18, stroke: PAIN, 'stroke-width': 2.5, 'stroke-dasharray': '7 5' }, ghost));
    show(ghost, m('lam', .5));
    const gone = [sg.part.archU, sg.part.spinU];
    gone.forEach(el => tw(el, { o: 0 }, m('lam', 2.5), .8));
    lab(p, 'дужка и остистый отросток', 70, 250, X - 200 * S, Y - 62 * S - 12 * S, PAIN, m('lam', .5), { anchor: 'start' });
    prog(q => sg.set({ flex: 6 * swing(q, 2) }), m('lam', 6.5), 4);
    hide(txt(p, 'движение сохраняется', 300, 720, m('lam', 6.5), { size: 20, fill: COL.good, anchor: 'middle', weight: 700 }), m('fus'), .4);
    infoCard(p, 640, 225, 920, 150, 'ламинэктомия', 'удалить дужку (частично или полностью) с остистым отростком и жёлтой связкой; стабильность ниже, движение есть; чаще при небольшой односторонней протрузии; повторные операции — 14–34 %', SURG, m('lam'), { size: 18 });
    // fusion: posterior screws and a rod — the segment no longer moves
    gone.forEach(el => tw(el, { o: 1 }, m('fus'), .6)); hide(ghost, m('fus'), .5);
    const post = hw(p, X, Y, S, g => {
      screw(g, -150, -88, -10, -72); screw(g, -150, 40, -10, 56);
      path(g, 'M-160 -100V54', { stroke: mix(METAL, '#000000', .4), 'stroke-width': 12, 'stroke-linecap': 'round' });
      path(g, 'M-160 -100V54', { stroke: METAL, 'stroke-width': 7, 'stroke-linecap': 'round' });
      [-88, 40].forEach(yy => mk('circle', { cx: -158, cy: yy, r: 11, fill: METAL, stroke: mix(METAL, '#000000', .45), 'stroke-width': 2 }, g));
    });
    show(post, m('fus', 6.9));
    const adj = G(p, { o: 0 });
    [Y - 175 * S, Y + 175 * S].forEach(yy => { mk('ellipse', { cx: X, cy: yy, rx: 70 * S, ry: 14, fill: PAIN, 'fill-opacity': .25, stroke: PAIN, 'stroke-width': 3 }, adj); });
    T(adj, 'соседние уровни перегружаются', { x: X - 90, y: Y + 175 * S + 40, size: 18, fill: PAIN, weight: 700, anchor: 'middle' });
    show(adj, m('fus', 10)); hide(adj, m('acdf'), .5);
    txt(p, 'движения нет', 300, 720, m('fus', 6.9), { size: 20, fill: COL.bad, anchor: 'middle', weight: 700 });
    infoCard(p, 640, 390, 920, 150, 'спондилодез', 'осевая боль с нестабильностью, тяжёлый артроз, неконтролируемая боль в конечности; убирает движение и нагрузку на диск, реже повторная грыжа; ускоряет износ соседних сегментов', SURG, m('fus'), { size: 18 });
    // anterior: the disc out, a bone graft in, a plate with screws in front
    hide(post, m('acdf'), .5);
    [sg.part.disc, sg.part.nuc].forEach(el => tw(el, { o: 0 }, m('acdf', 1.5), .6));
    const graft = hw(p, X, Y, S, g => mk('rect', { x: -66, y: -14, width: 130, height: 28, rx: 4, fill: GRAFT, stroke: mix(GRAFT, '#000000', .4), 'stroke-width': 2 }, g));
    show(graft, m('acdf', 2.2));
    const plate = hw(p, X, Y, S, g => {
      screw(g, 92, -62, 20, -62); screw(g, 92, 62, 20, 62);
      mk('rect', { x: 78, y: -100, width: 16, height: 200, rx: 6, fill: METAL, stroke: mix(METAL, '#000000', .45), 'stroke-width': 2.5 }, g);
    });
    show(plate, m('acdf', 3));
    infoCard(p, 640, 555, 920, 140, 'передний шейный спондилодез', 'спереди: удалить диск, пластина с винтами на телах; боль в горле, осиплость, трудно глотать; хорошо и отлично — до 92 %', SURG, m('acdf'), { size: 18 });
    // TLIF: from behind — the arch out again, screws and rods, a cage in the disc space
    hide(plate, m('tlif'), .5);
    gone.forEach(el => tw(el, { o: 0 }, m('tlif', 2), .6)); show(ghost, m('tlif', 2));
    show(post, m('tlif', 3));
    const cage = hw(p, X, Y, S, g => { mk('rect', { x: -40, y: -13, width: 80, height: 26, rx: 5, fill: METAL, stroke: mix(METAL, '#000000', .45), 'stroke-width': 2 }, g); path(g, 'M-28 -13V13M-14 -13V13M0 -13V13M14 -13V13M28 -13V13', { stroke: mix(METAL, '#000000', .3), 'stroke-width': 2 }); });
    show(cage, m('tlif', 3.5));
    infoCard(p, 640, 710, 920, 160, 'TLIF: поясничный, сзади', 'отвести мышцы, удалить дужку, остистый отросток и жёлтую связку, сращение костью; сращение 70–96 %; через год лучше у 84 %, на работе 71 %', SURG, m('tlif'), { size: 18 });
  }],

  ['post', 'После операции', (m, D) => {
    const p = panel(0);
    txt(p, 'после операции: от защиты к стабилизации', 800, 56, m('mp'), { size: 28, weight: 700, anchor: 'middle', fill: SP });
    table(p, 80, 740, 420, m('mp'));
    const X0 = 720, s = .5, f = lying(p, X0, 420, s, m('mp'), 'supine', { shank: 0, thigh: 0 });
    const B = [f.unit(0, 82), f.unit(7, 82), f.unit(7, -44), f.unit(0, -44)];
    const brace = mk('path', { d: 'M' + B.map(P => f1(P[0]) + ' ' + f1(P[1])).join('L') + 'Z', fill: SURG, 'fill-opacity': .35, stroke: SURG, 'stroke-width': 3, opacity: 0 }, p);
    show(brace, m('mp', 10));
    lab(p, 'корсет', 160, 300, ...f.unit(4, 82), SURG, m('mp', 10));
    prog(q => hook(f, X0, s, 50 * cyc(q, 3)), m('mp', 14), 6);
    txt(p, 'скольжение пяткой', 560, 470, m('mp', 14), { size: 19, fill: SP, anchor: 'middle', weight: 700 });
    // a timeline in weeks
    const T0 = 120, T1 = 720, wk = w => T0 + (T1 - T0) * w / 14, ty = 560;
    const axis = G(p, { o: 0 });
    path(axis, `M${T0} ${ty}H${T1}`, { stroke: COL.dim, 'stroke-width': 3 });
    [0, 2, 4, 6, 8, 10, 12, 14].forEach(w => { path(axis, `M${f1(wk(w))} ${ty - 6}V${ty + 6}`, { stroke: COL.dim, 'stroke-width': 2 }); T(axis, String(w), { x: wk(w), y: ty + 28, size: 16, fill: COL.dim, anchor: 'middle' }); });
    T(axis, 'недели после операции', { x: T1, y: ty - 16, size: 16, fill: COL.dim, anchor: 'end', weight: 600 });
    show(axis, m('mp', 3.4));
    const band = (w0, w1, row, col, str, t0) => {
      const g = G(p, { o: 0 }), yy = ty + 50 + row * 48;
      mk('rect', { x: wk(w0), y: yy, width: wk(w1) - wk(w0), height: 30, rx: 8, fill: col, 'fill-opacity': .35, stroke: col, 'stroke-width': 2 }, g);
      const inside = wk(w1) - wk(w0) > uiW(str, 17) + 20;
      T(g, str, { x: inside ? wk(w0) + 10 : wk(w1) + 10, y: yy + 22, size: 17, fill: COL.chalk, weight: 600 });
      show(g, t0);
    };
    band(0, 13, 0, SURG, 'не поднимать > 4,5 кг (в книге — 10 фунтов): до 3 мес', m('mp', 6));
    band(0, 13, 1, SURG, 'корсет или воротник: до 3 мес', m('mp', 10));
    band(0, 2, 2, COL.task, 'рану не мочить: 1–2 нед', m('mp', 26.3));
    const r6 = G(p, { o: 0 }), r12 = G(p, { o: 0 }), yR = ty + 50 + 3 * 48 + 14;
    T(r6, 'начало реабилитации:', { x: T0, y: yR + 6, size: 17, fill: COL.dim, weight: 600 }); mk('circle', { cx: wk(6), cy: yR, r: 10, fill: COL.dim }, r6); T(r6, '6 нед', { x: wk(6), y: yR + 36, size: 17, fill: COL.dim, anchor: 'middle', weight: 600 });
    mk('circle', { cx: wk(12), cy: yR, r: 12, fill: COL.good }, r12); T(r12, '12 нед — результаты лучше', { x: wk(12), y: yR + 36, size: 17, fill: COL.good, anchor: 'middle', weight: 700 });
    show(r6, m('ev')); show(r12, m('ev', 1.5));
    infoCard(p, 800, 90, 760, 330, 'максимальная защита', 'обучение и ограничения хирурга; следить за раной; двигаться в постели в корсете; ходьба; лёжа — скольжение пяткой, короткие дуги для четырёхглавой, изометрия, «насос» стопами; после ламинэктомии — без сильного разгибания', SURG, m('mp', 3.4), { size: 20 });
    infoCard(p, 800, 440, 760, 210, 'умеренная и минимальная защита', 'мобилизация рубца; растяжка и мобилизации I–II на соседних уровнях; стабилизация от сегментарной к глобальной, от простого к сложному; ходьба с опорой', SP, m('mid'), { size: 20 });
    infoCard(p, 800, 670, 760, 200, 'противопоказано', 'манипуляции на уровне сращения; разгибательные упражнения после ламинэктомии', COL.bad, m('ci'), { size: 20 });
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-surg', prompt: ['К какой операции это относится?'],
    build: grid([
      { parts: ['Подвижность сегмента сохраняется'], ans: ['l'], why: 'Ламинэктомия убирает дужку, но не сращивает позвонки.' },
      { parts: ['Убирает движение и нагрузку на больной диск'], ans: ['f'], why: 'Спондилодез сращивает позвонки.' },
      { parts: ['Может перегрузить соседние сегменты'], ans: ['f'], why: 'Неподвижный уровень перекладывает нагрузку на соседей.' },
      { parts: ['Чаще при небольшой односторонней протрузии'], ans: ['l'], why: 'Верно для ламинэктомии.' },
      { parts: ['После неё избегают сильного разгибания'], ans: ['l'], why: 'Разгибательные упражнения противопоказаны после ламинэктомии.' },
    ], [['l', 'Ламинэктомия', SURG], ['f', 'Спондилодез', FLX]], { multi: false, text: true }),
  }], done) }],

  ['flex', 'Сгибательный подход', (m, D) => {
    const p = panel(0);
    txt(p, 'сгибательный подход: сгибание расширяет отверстие', 800, 56, m('who'), { size: 28, weight: 700, anchor: 'middle', fill: FLX });
    const sg = spineSeg(p, 420, 430, 1.15, m('who'));
    sg.set({ osteo: .5 });
    lab(p, 'межпозвонковое отверстие', 70, 160, ...sg.at('for'), FLX, m('pr'), { anchor: 'start' });
    // room for the root
    const BX = 110, BW = 560, BY = 720;
    const meter = G(p, { o: 0 });
    T(meter, 'высота отверстия (схема)', { x: BX, y: BY - 16, size: 18, fill: COL.dim, weight: 600 });
    mk('rect', { x: BX, y: BY, width: BW, height: 26, rx: 13, fill: 'none', stroke: COL.dim, 'stroke-width': 2 }, meter);
    const fill = mk('rect', { x: BX, y: BY, width: 10, height: 26, rx: 13, fill: COL.good }, meter);
    const upd = () => { const a = sg.P.pedU, b = sg.P.pedL, k = clamp((Math.hypot(a[0] - b[0], a[1] - b[1]) - 100) / 50, 0, 1); fill.setAttribute('width', f1(Math.max(14, k * BW))); fill.setAttribute('fill', mix(COL.bad, COL.good, k)); };
    sg.onSet.push(upd); upd();
    show(meter, m('pr'));
    prog(q => sg.set({ flex: -9 * q }), m('pr', 4), 1.5);
    const tE = txt(p, 'разгибание — уже', 390, 800, m('pr', 4), { size: 20, fill: COL.bad, anchor: 'middle', weight: 700 });
    prog(q => sg.set({ flex: lerp(-9, 10, q) }), m('pr', 7), 2);
    hide(tE, m('pr', 7), .4);
    const tF = txt(p, 'сгибание — шире', 390, 800, m('pr', 7.5), { size: 20, fill: COL.good, anchor: 'middle', weight: 700 });
    hide(tF, m('trc'), .4);
    prog(q => sg.set({ comp: -8 * q }), m('trc', 1), 1.5);
    txt(p, 'тракция в сгибании — шире всего', 390, 800, m('trc', 1), { size: 20, fill: COL.good, anchor: 'middle', weight: 700 });
    pill(p, 'позиционная тракция: наклон от больной стороны + поворот к ней', 390, 850, m('trc', 5), { col: FLX, size: 16 });
    infoCard(p, 800, 90, 760, 160, 'сгибательная категория', 'стоит согнувшись, не может разогнуться из-за неврологии: спондилёз, стеноз, травма с разгибанием, ущемление капсулы, отёк фасеток', FLX, m('who'), { size: 19 });
    infoCard(p, 800, 265, 760, 160, 'цель — шире отверстие', 'онемение и покалывание при разгибании — механическое сдавление; постоянные симптомы — скорее воспаление и отёк', FLX, m('pr'), { size: 19 });
    const fz = facetZoom(p, 980, 570, .48, m('men'));
    prog(q => fz.set({ trap: q }), m('men', .8), 1.2);
    prog(q => fz.set({ trap: 1 - q, glide: .5 * q }), m('men', 3.5), 1.4);
    lab(p, 'складка', 1130, 470, ...fz.at(176, 0), MEN, m('men', .5), { size: 18 });
    infoCard(p, 1120, 490, 440, 200, 'менискоидная складка', 'ущемлена — блок разгибания и наклона в её сторону; помогают манипуляция и тракция', MEN, m('men'), { size: 18 });
    infoCard(p, 800, 710, 760, 160, 'противопоказано', 'разгибание (и с ротацией) — если усиливает симптомы; сгибание — если периферизует', COL.bad, m('ci'), { size: 19 });
  }],

  ['ftech', 'Приёмы сгибательного подхода', (m, D) => {
    const p = panel(0);
    txt(p, 'положение, тракция, коррекция сдвига в сгибании', 800, 56, m('fp'), { size: 28, weight: 700, anchor: 'middle', fill: FLX });
    table(p, 80, 740, 350, m('fp'));
    const X0 = 700, s = .5, f = lying(p, X0, 350, s, m('fp'), 'supine', { shank: 0, thigh: 0 });
    hook(f, X0, s, 50);
    txt(p, 'бёдра и колени согнуты', 410, 400, m('fp', .5), { size: 19, fill: FLX, anchor: 'middle', weight: 700 });
    // lateral shift corrected in flexion: the foot on a chair, lean toward the raised thigh, hold the ankle
    const GY = 860, chair = G(p, { o: 0 });
    mk('rect', { x: 420, y: 700, width: 150, height: 16, rx: 4, fill: '#8a7a64', stroke: '#5a4e40', 'stroke-width': 2 }, chair);
    path(chair, 'M430 716V860M560 716V860M560 700V560', { stroke: '#8a7a64', 'stroke-width': 8 });
    show(path(p, `M80 ${GY}H740`, { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 }), m('shift'));
    show(chair, m('shift'));
    const fg = fig(p, { x: 300, y: GY - 182 * .9, s: .9, o: 0, pose: { ...STAND } });
    show(fg.g, m('shift'));
    const pose = t => { fg.set({ t, hF: t, kF: 0, fF: 0 }); legTo(fg, 'N', 480, 700); const A = onStage(fg, 'AN'); reach(fg, 'N', A[0] + 6, A[1] - 8); reach(fg, 'F', A[0] - 8, A[1] - 4); };
    pose(8);

    infoCard(p, 800, 90, 760, 170, 'функциональное положение', 'поясница — бёдра и колени согнуты; шея — осевое вытяжение со сгибанием внизу; корсет и воротник — лишь при РА и нестабильности', FLX, m('fp'), { size: 19 });
    infoCard(p, 800, 275, 760, 175, 'тракции и скольжения I–II', 'меньше боль, движется синовиальная жидкость; стеноз без воспаления — тракция сильнее; при ревматоидном артрите тракция и манипуляции запрещены', COL.task, m('gt'), { size: 19 });
    infoCard(p, 800, 465, 760, 190, 'боковой сдвиг, если легче в сгибании', 'нога со стороны, противоположной сдвигу, — на стуле, бедро ≈ 90°, другая прямая; наклон к поднятому бедру, тянуть за лодыжку', FLX, m('shift'), { size: 19 });
    infoCard(p, 800, 670, 760, 200, 'позже', 'растягивать тугоподвижные сегменты, не нагружая гипермобильные; укреплять туловище, бёдра, плечевой пояс; при остеофитах — без долгой работы над головой, подставка', SP, m('sub'), { size: 19 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-dir', prompt: ['Какой подход подходит?'],
    build: grid([
      { parts: ['Боль в ноге централизуется при прогибах лёжа'], ans: ['e'], why: 'Разгибание централизует — разгибательный подход.' },
      { parts: ['Стеноз: легче сидя и в наклоне вперёд'], ans: ['f'], why: 'Сгибание расширяет отверстия.' },
      { parts: ['Онемение появляется при разгибании'], ans: ['f'], why: 'Разгибание сдавливает корешок.' },
      { parts: ['Протрузия, повторные прогибы уменьшают боль в ноге'], ans: ['e'], why: 'Разгибательный подход.' },
      { parts: ['Спондилёз с остеофитами, хуже при работе над головой'], ans: ['f'], why: 'Избегать переразгибания — сгибательный подход.' },
    ], [['e', 'Разгибательный', EXT], ['f', 'Сгибательный', FLX]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Шейный диск: осевое вытяжение, затем разгибание и ротация, тракция; периферизация — стоп.', 'w1'],
     ['Ламинэктомия сохраняет движение, спондилодез его убирает; после операции — защита, затем стабилизация.', 'w2'],
     ['Сгибательный подход — при стенозе и спондилёзе: сгибание расширяет отверстия.', 'w3'],
     ['При ревматоидном артрите — без тракции и манипуляций.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SP }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-lam', prompt: ['Две недели после ламинэктомии L4–L5, рана ещё не закрылась. Что подходит?'],
    build: choice([
      ['Ходьба, скольжение пяткой, изометрия, «насос» стопами; рану не мочить; без сильного разгибания'],
      ['Повторные прогибы лёжа на руках'],
      ['Подъём коробок по 10 кг'],
      ['Манипуляция на уровне операции'],
    ], 0, 'Фаза максимальной защиты: мягкие упражнения лёжа и ходьба, ограничения хирурга, без разгибательных упражнений после ламинэктомии.',
    [null, 'После ламинэктомии разгибательные упражнения противопоказаны.', 'Обычно нельзя поднимать больше 4,5 кг до трёх месяцев.', 'Манипуляции на оперированном уровне противопоказаны.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-sten', prompt: ['Пожилому пациенту со стенозом легче сидя, а при разгибании немеет нога. Что выбрать?'],
    build: choice([
      ['Сгибательный подход: положение со сгибанием, тракция в сгибании, мягкие скольжения'],
      ['Повторные прогибы на руках до централизации'],
      ['Манипуляция с ротацией в разгибании'],
      ['Долгие упражнения с руками над головой'],
    ], 0, 'Сгибание расширяет межпозвонковые отверстия; тракция в сгибании расширяет их сильнее всего.',
    [null, 'Разгибание сужает отверстия и усилит онемение.', 'Разгибание с ротацией противопоказано, если усиливает симптомы.', 'Это переразгибание — его избегают.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
