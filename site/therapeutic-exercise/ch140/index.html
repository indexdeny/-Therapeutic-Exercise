const SP = '#8fd6b0', STB = COL.good, MAN = '#86c9e8', SOFT = '#f0a04b', PAIN = '#ff5a3c', TRA = '#e0a0c8', CUFF = '#9fc0e0';
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : x + (right ? 8 : -8);
  path(g, `M${lx} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const swing = (q, n) => Math.sin(2 * Math.PI * n * q);
const f1 = v => v.toFixed(1);
function lying(p, x, y, s, t0, kind, pose = {}) {
  const f = postureFig(p, 0, 0, s, t0, { pose });
  put(f.g, kind === 'supine' ? { x, y: y - 75 * s, r: -90 } : { x, y: y - 78 * s, r: 90 });
  return f;
}
function seated(p, x, gy, s, t0, pose = {}) {
  const f = postureFig(p, x, gy, s, t0, { pose: { shank: 0, thigh: -90, arm: 12, elb: 60, ...pose } });
  const H = f.at('hip');
  const ch = path(p, `M${f1(H[0] - 70 * s)} ${f1(H[1] + 34 * s)}H${f1(H[0] + 40 * s)}M${f1(H[0] - 60 * s)} ${f1(H[1] + 34 * s)}V${gy}M${f1(H[0] + 30 * s)} ${f1(H[1] + 34 * s)}V${gy}`, { stroke: COL.dim, 'stroke-width': 5 }, { o: 0 });
  p.insertBefore(ch, f.g);
  if (t0 !== null) show(ch, t0);
  return f;
}
const table = (p, x1, x2, y, t0) => show(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.dim, 'stroke-width': 6 }, { o: 0 }), t0);
// Supine with the hip flexed phi degrees and the heel on the table; the group shifts to keep the hip in place.
function hook(f, x0, s, phi) {
  const sg = Math.asin(216 * Math.sin(rad(phi)) / 221) / rad(1);
  f.set({ thigh: -phi, shank: sg });
  const Hy = -41 - 221 * Math.cos(rad(sg)) - 216 * Math.cos(rad(phi));
  put(f.g, { x: x0 + (-478 - Hy) * s });
}
// A pressure dial: ticks without numbers, a needle at angle a (deg from the top); set(a).
function dial(p, x, y, r, t0) {
  const g = G(p, { x, y, o: 0 });
  mk('circle', { r, fill: PANEL, stroke: CUFF, 'stroke-width': 4 }, g);
  for (let i = 0; i <= 10; i++) { const a = rad(-120 + 24 * i); path(g, `M${f1(Math.sin(a) * (r - 6))} ${f1(-Math.cos(a) * (r - 6))}L${f1(Math.sin(a) * (r - 16))} ${f1(-Math.cos(a) * (r - 16))}`, { stroke: COL.dim, 'stroke-width': 2.5 }); }
  const zone = path(g, '', { stroke: COL.good, 'stroke-width': 7, 'stroke-opacity': .7 });
  const za = [rad(-14), rad(14)];
  zone.setAttribute('d', `M${f1(Math.sin(za[0]) * (r - 11))} ${f1(-Math.cos(za[0]) * (r - 11))}A${r - 11} ${r - 11} 0 0 1 ${f1(Math.sin(za[1]) * (r - 11))} ${f1(-Math.cos(za[1]) * (r - 11))}`);
  const nd = G(g, {}); path(nd, `M0 8L0 ${-(r - 14)}`, { stroke: PAIN, 'stroke-width': 4 }); mk('circle', { r: 7, fill: COL.chalk }, g);
  const e = { g, set: a => { put(nd, { r: a }); return e; } };
  e.set(-60);
  if (t0 !== null) show(g, t0);
  return e;
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Стабилизация и мягкие ткани', (m, D) => {

  ['stab', 'Нестабильность', (m, D) => {

    infoCard(p, 800, 90, 760, 200, 'кому стабилизация', 'гипермобильность, разболтанные связки, спондилолиз, спондилолистез, плохой контроль глубоких и глобальных мышц; в анамнезе — травма, повторные манипуляции, ранний спондилёз', STB, m('who'), { size: 19 });

    infoCard(p, 800, 600, 760, 270, 'хорошо предсказывают', '', STB, m('q', 12.3));
    ['пассивный тест разгибания поясницы', 'тест нагрузки разгибанием', 'активный подъём прямой ноги'].forEach((s, i) => numLine(p, i + 1, s, 830, 700 + i * 56, STB, m('q', 12.6 + i * .6)));

  ['stab2', 'Тренировка стабилизации', (m, D) => {

    pill(p, 'стрелка в зелёной зоне — сразу видно', 410, 495, m('cuff', 5), { col: COL.good, size: 17 });

    txt(p, '→ манипуляция перед стабилизацией вероятнее поможет', 410, 740, m('fly', 12.5), { size: 19, fill: COL.good, anchor: 'middle', weight: 700 });
    pillRow(p, ['Чайлдс: n = 131, подтвердил'], 410, 790, m('fly', 13.7), { col: COL.dim, size: 17 });
    pillRow(p, ['гипомобильность → манипуляция', 'гипермобильность → стабилизация'], 410, 838, m('fly', 17.3), { col: [MAN, STB], size: 16, space: 12 });
    infoCard(p, 800, 90, 760, 165, 'термины главы', 'манипуляция — колебания I–IV; толчок — высокая скорость, малая амплитуда на пределе; записывают степень, уровень, направление силы, положение', MAN, m('term'), { size: 19 });
    infoCard(p, 800, 270, 760, 170, 'поясница', 'гипомобильный сегмент: общая манипуляция техникой поясничного валика до двух раз → упражнения на объём; два занятия, потом стабилизация', MAN, m('lum'), { size: 19 });
    infoCard(p, 800, 455, 760, 210, 'шея', 'манипуляция вместе с упражнениями: меньше боль, больше объём, сила и выносливость', MAN, m('cerv'), { size: 19, textW: 500 });
    pill(p, 'серьёзные осложнения: от 1 на 20 000 до 5 на 10 000 000', 1180, 690, m('cerv', 6.2), { col: COL.bad, size: 17 });
    infoCard(p, 800, 720, 760, 150, 'грудной отдел', 'оценивать всегда: его манипуляция часто улучшает результат при боли в шее', SP, m('cerv', 11.1), { size: 19, textW: 500 });
    const pf = postureFig(p, 1450, 652, .2, m('cerv'), { regions: true });
    const tR = G(p, { o: 0 }), TT = pf.unit(10, 0); mk('ellipse', { cx: TT[0], cy: TT[1], rx: 20, ry: 38, fill: 'none', stroke: SP, 'stroke-width': 4 }, tR); show(tR, m('cerv', 11.1));
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-sm', prompt: ['Что вероятнее поможет первым?'],
    build: grid([
      { parts: ['«Зацепка» в середине объёма при наклоне вперёд'], ans: ['s'], why: 'Признак нестабильности — стабилизация.' },
      { parts: ['Боль 10 дней, ниже колена не отдаёт, сегмент гипомобилен'], ans: ['m'], why: 'Признаки правила Флинна — манипуляция.' },
      { parts: ['Спондилолистез, разболтанные связки'], ans: ['s'], why: 'Нестабильность — стабилизация.' },
      { parts: ['Ротация бедра внутрь > 35°, низкий страх движения'], ans: ['m'], why: 'Признаки правила Флинна.' },
      { parts: ['Много манипуляций в анамнезе, сегмент гипермобилен'], ans: ['s'], why: 'При гипермобильности лучше стабилизация.' },
    ], [['s', 'Стабилизация', STB], ['m', 'Манипуляция', MAN]], { multi: false, text: true }),
  }], done) }],

  ['soft', 'Повреждения мягких тканей', (m, D) => {
    const p = panel(0);
    txt(p, 'мышцы и мягкие ткани', 800, 56, m('st'), { size: 28, weight: 700, anchor: 'middle', fill: SOFT });
    infoCard(p, 60, 90, 700, 260, 'острая фаза', 'повреждено сразу несколько тканей; боль, отёк, болезненность, защитное напряжение; долгое напряжение само болит; связка болит при нагрузке, при разрыве — гипермобильность; при заживлении — укорочение и спайки', SOFT, m('st'), { size: 19 });
    const fs = frontStand(p, 220, 860, 1.15, m('lum'), { muscles: false });
    txt(p, 'вид сзади', 220, 400, m('lum'), { size: 17, fill: COL.dim, anchor: 'middle', weight: 600 });
    const P = fs.pts.P, crest = fs.at([P[0] + 30, P[1] - 46]);
    const zone = G(p, { x: crest[0], y: crest[1], o: 0 }); mk('ellipse', { rx: 34, ry: 15, fill: PAIN, 'fill-opacity': .45, stroke: PAIN, 'stroke-width': 3 }, zone); put(zone, { r: -12 });
    show(zone, m('lum', 1)); pulse(zone, m('lum', 1.5), 1.3);
    ['боковой шов фасции', 'квадратная мышца поясницы', 'выпрямитель позвоночника', 'подвздошно-поясничная связка'].forEach((s, i) => {
      const y = 470 + i * 52; pill(p, s, 560, y, m('lum', 3 + i * .9), { col: SOFT, size: 17 });
    });
    lab(p, '', 430, 600, crest[0] + 30, crest[1], SOFT, m('lum', 3));
    pill(p, 'падения, подъём тяжестей, скручивание', 560, 700, m('lum', 10.7), { col: COL.bad, size: 17 });
    // whiplash: two seated figures, extension and flexion
    const E = seated(p, 960, 620, .5, m('wh'));
    const Fx = seated(p, 1340, 620, .5, m('wh', 11.3));
    const mE = [E.mus('scm', { w: 8 }), E.mus('dnf', { w: 7 })], mF = [Fx.mus('trapU', { w: 8 }), Fx.mus('subocc', { w: 7 })];
    prog(q => E.set({ cerv: 34 + 40 * q, hd: -34 * q, fh: -.4 * q }), m('wh', 2), 1.2, out);
    prog(q => Fx.set({ cerv: 34 - 50 * q, hd: 30 * q, fh: .4 * q }), m('wh', 12), 1.2, out);
    txt(p, 'резкое разгибание', 960, 660, m('wh', 1.5), { size: 19, fill: SOFT, anchor: 'middle', weight: 700 });
    txt(p, 'резкое сгибание', 1340, 660, m('wh', 11.3), { size: 19, fill: SOFT, anchor: 'middle', weight: 700 });
    infoCard(p, 800, 690, 370, 180, 'разгибание', 'задние структуры сжаты, передние мышцы растянуты; челюсть раскрывается, головка уходит вперёд', SOFT, m('wh', 1.5), { size: 17 });
    infoCard(p, 1190, 690, 370, 180, 'сгибание', 'растянуты задние мышцы, связки, капсулы; головка челюсти вдавлена назад', SOFT, m('wh', 11.3), { size: 17 });
    pill(p, 'перенапряжение: компьютер, телефон, стресс', 1180, 110, m('ps'), { col: COL.task, size: 18 });
  }],

  ['soft2', 'Ведение повреждений мягких тканей', (m, D) => {
    const p = panel(0);
    txt(p, 'мягкие ткани: опора, напряжение, удлинение', 800, 56, m('col'), { size: 28, weight: 700, anchor: 'middle', fill: SOFT });
    infoCard(p, 60, 90, 700, 220, 'опора — ненадолго', 'воротник — лишь при тяжёлой острой хлыстовой травме или после операции; корсет — после серьёзной травмы или операции; отучать как можно раньше — укреплять глубокие мышцы живота', COL.dim, m('col'), { size: 19 });
    // muscle setting in the shortened range, then lengthening after each contraction (schematic)
    const MX0 = 880, MY = 230, mus = G(p, { o: 0 });
    mk('rect', { x: MX0 - 60, y: MY - 40, width: 60, height: 80, rx: 10, fill: ANAT.bone, stroke: mix(ANAT.bone, '#000000', .45), 'stroke-width': 2 }, mus);
    const bone2 = G(mus, {}); mk('rect', { x: 0, y: MY - 40, width: 60, height: 80, rx: 10, fill: ANAT.bone, stroke: mix(ANAT.bone, '#000000', .45), 'stroke-width': 2 }, bone2);
    const belly = mk('path', { fill: ANAT.muscle, stroke: mix(ANAT.muscle, '#000000', .35), 'stroke-width': 2 }, mus);
    const drawM = (L, k) => { const w = 34 + 10 * k - (L - 260) * .05; belly.setAttribute('d', `M${MX0} ${MY - 12}C${f1(MX0 + L * .3)} ${f1(MY - w)} ${f1(MX0 + L * .7)} ${f1(MY - w)} ${f1(MX0 + L)} ${MY - 12}V${MY + 12}C${f1(MX0 + L * .7)} ${f1(MY + w)} ${f1(MX0 + L * .3)} ${f1(MY + w)} ${MX0} ${MY + 12}Z`); put(bone2, { x: MX0 + L }); };
    drawM(260, 0);
    show(mus, m('set'));
    pill(p, 'схема', 1500, 130, m('set'), { col: COL.dim, size: 15 });
    const feather = G(p, { x: 1360, y: 130, o: 0, r: -30 });
    path(feather, 'M0 40C-10 10 -6 -20 10 -44C16 -20 14 10 0 40ZM0 40V-30', { stroke: COL.chalk, 'stroke-width': 2, fill: 'none' });
    show(feather, m('set', 6));
    txt(p, 'сила — едва сдвинуть пёрышко', 1180, 345, m('set', 6), { size: 19, fill: COL.chalk, anchor: 'middle', weight: 600 });
    prog(q => drawM(260, cyc(q, 3) * .9), m('set', 1), 5, lin);
    prog(q => { const n = q * 3, step = Math.floor(n), fr = n - step, k = fr < .5 ? cyc(fr * 2, 1) : 0; drawM(260 + 40 * Math.min(3, step + (fr >= .5 ? (fr - .5) * 2 : 0)), k * .9); }, m('set', 10.1), 7.5, lin);
    txt(p, 'после каждого сокращения — чуть длиннее', 1180, 385, m('set', 10.1), { size: 19, fill: SP, anchor: 'middle', weight: 700 });
    infoCard(p, 800, 420, 760, 210, 'мягкое изометрическое напряжение', 'в функциональном, обычно укороченном положении; плавно напрячь и расслабить; несколько дней — укороченно, потом удлинять; при защитном напряжении не растягивать', SOFT, m('set'), { size: 19 });
    // reverse action for the neck, prone lifts for the low back
    const sf = seated(p, 200, 860, .5, m('alt'));
    prog(q => sf.set({ scap: -.8 * cyc(q, 3), arm: 12 - 14 * cyc(q, 3) }), m('alt', 1), 5);
    txt(p, 'двигаются лопатки, шея держит голову', 250, 470, m('alt', 1), { size: 18, fill: SOFT, anchor: 'middle', weight: 700 });
    table(p, 400, 760, 860, m('alt', 6.3));
    const pr = lying(p, 410, 860, .4, m('alt', 6.3), 'prone', { shank: 0, thigh: 0 });
    prog(q => pr.set({ cerv: 34 + 30 * q, hd: -14 * q }), m('alt', 7.5), 1.5);
    prog(q => pr.set({ lord: 46 + 22 * q, kyph: 42 - 10 * q }), m('alt', 10.5), 1.8);
    pillRow(p, ['голова', 'голова и грудь'], 580, 600, [m('alt', 7.5), m('alt', 10.5)], { col: SOFT, size: 17 });
    infoCard(p, 800, 650, 760, 220, 'мягкая колебательная тракция', 'ткань укорочена, сила меньше той, что разводит позвонки; неверная укладка или сильная тяга усугубят повреждение; главное — найти и изменить причину', SOFT, m('tr'), { size: 19 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-tf', prompt: ['Верно или неверно?'],
    build: grid([
      { parts: ['После хлыстовой травмы воротник носят как можно дольше'], ans: ['f'], why: 'Неверно: отучают как можно раньше.' },
      { parts: ['Повреждённую мышцу сначала мягко напрягают в укороченном положении'], ans: ['t'], why: 'Верно.' },
      { parts: ['При защитном напряжении мышцу сразу растягивают'], ans: ['f'], why: 'Неверно: при защитном напряжении не растягивают.' },
      { parts: ['При боли в шее оценивают и грудной отдел'], ans: ['t'], why: 'Верно.' },
      { parts: ['Мягкая тракция слабее той, что разводит позвонки'], ans: ['t'], why: 'Верно.' },
    ], [['t', 'Верно', COL.good], ['f', 'Неверно', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Нестабильность видна по качеству движения и контролю мышц; сначала глубокие мышцы, потом глобальные.', 'w1'],
     ['Манипуляция помогает при гипомобильности; правило Флинна подсказывает, кому вероятнее.', 'w2'],
     ['При боли в шее оценивают и грудной отдел.', 'w3'],
     ['Повреждённую мышцу мягко напрягают укороченной, потом удлиняют; от воротника и корсета отучают рано.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SP }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-fly', prompt: ['Боль в пояснице 9 дней, ниже колена не отдаёт, движений не боится, L4–L5 гипомобилен, ротация бедра внутрь 40°. С чего начать?'],
    build: choice([
      ['Манипуляция, затем упражнения на объём, потом стабилизация'],
      ['Только корсет'],
      ['Строгий постельный режим'],
      ['Силовые упражнения с большим весом'],
    ], 0, 'Все пять признаков правила Флинна: манипуляция перед стабилизацией вероятнее поможет.',
    [null, 'Корсет при такой картине не нужен.', 'Покой не лечит гипомобильный сегмент.', 'Сначала восстановить движение и контроль.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-wh', prompt: ['Через два дня после хлыстовой травмы мышцы шеи болят и в защитном напряжении. Что подходит?'],
    build: choice([
      ['Мягкое изометрическое напряжение с минимальным сопротивлением в укороченном положении'],
      ['Сильная растяжка мышц шеи'],
      ['Воротник постоянно на несколько месяцев'],
      ['Тракция с силой, разводящей позвонки'],
    ], 0, 'В острой фазе мышцу мягко напрягают в укороченном положении; растягивают позже и не при защитном напряжении.',
    [null, 'При защитном напряжении не растягивают.', 'От воротника отучают как можно раньше.', 'Сильная тяга может усугубить повреждение.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
function numLine(p, n, str, x, y, col, t0, { size = 20, maxW = 640 } = {}) {
  const g = G(p, { o: 0 });
  mk('circle', { cx: x + 18, cy: y - 7, r: 17, fill: col }, g);
  T(g, String(n), { x: x + 18, y: y, size: 20, weight: 700, fill: COL.board, anchor: 'middle' });
  put(para(g, str, x + 50, y, null, { size, maxW }), { o: 1 });
  if (t0 !== null) show(g, t0);
  return g;
}

boot();
</script>
