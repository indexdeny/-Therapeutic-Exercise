// cards-short end

const SP = '#8fd6b0', CFX = '#f0a04b', SPL = '#c9b8e8', ASC = '#86c9e8', SCH = '#e8a0a8', RIB = '#f0c060', SIJ = '#8fd6b0', PAIN = '#ff5a3c';
const BN = ANAT.bone, BL = mix(ANAT.bone, '#000000', .45);
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : x + (right ? 8 : -8);
  path(g, `M${lx} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
function numLine(p, n, str, x, y, col, t0, { size = 19, maxW = 640 } = {}) {
  const g = G(p, { o: 0 });
  mk('circle', { cx: x + 16, cy: y - 7, r: 15, fill: col }, g);
  T(g, String(n), { x: x + 16, y: y, size: 18, weight: 700, fill: COL.board, anchor: 'middle' });
  put(para(g, str, x + 44, y, null, { size, maxW }), { o: 1 });
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
function lying(p, x, y, s, t0, kind, pose = {}) {
  const f = postureFig(p, 0, 0, s, t0, { pose });
  put(f.g, kind === 'supine' ? { x, y: y - 75 * s, r: -90 } : { x, y: y - 78 * s, r: 90 });
  return f;
}
const table = (p, x1, x2, y, t0) => show(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.dim, 'stroke-width': 6 }, { o: 0 }), t0);
// Supine leg pose with the hip kept in place: thigh and shank are the figure's absolute segment angles
// (hip flexion φ → thigh −φ; knee flexion → shank − thigh). x0, y0: where the figure was laid.
function legPose(f, x0, y0, s, thigh, shank) {
  f.set({ thigh, shank });
  const Hx = -12 + 221 * Math.sin(rad(shank)) + 216 * Math.sin(rad(thigh)), Hy = -41 - 221 * Math.cos(rad(shank)) - 216 * Math.cos(rad(thigh));
  put(f.g, { x: x0 + (-478 - Hy) * s, y: y0 - 75 * s + (Hx + 12) * s });
}
// Three vertebral bodies in side view (anterior to the right); set(k): the middle one collapses in front (wedge),
// the one above tips forward.
function wedgeStack(p, x, y, s, t0) {
  const g = G(p, { x, y, s, o: 0 }), sh = shadeGrad(mk('defs', {}, g), BN);
  const body = (par, d) => mk('path', { d, fill: sh.url, stroke: BL, 'stroke-width': 2.5, 'stroke-linejoin': 'round' }, par);
  sh.aim([0, -48], [0, 48], 70);
  const disc = d => mk('path', { d, fill: DISC_C, stroke: mix(DISC_C, '#000000', .35), 'stroke-width': 2 }, g);
  body(g, 'M-70 76H66Q72 124 66 172H-70Q-64 124 -70 76Z');
  disc('M-68 48H64V76H-68Z');
  const mid = body(g, '');
  const up = G(g, {}), d2 = mk('path', { fill: DISC_C, stroke: mix(DISC_C, '#000000', .35), 'stroke-width': 2 }, up);
  d2.setAttribute('d', 'M-68 -76H64V-48H-68Z');
  body(up, 'M-70 -172H66Q72 -124 66 -76H-70Q-64 -124 -70 -172Z');
  const crack = path(g, '', { stroke: '#3a2a20', 'stroke-width': 2.5, opacity: 0 });
  const e = { g, set: k => {
    const t = -48 + 24 * k, b = 48 - 20 * k;
    mid.setAttribute('d', `M-70 -48L66 ${f1(t)}Q70 0 66 ${f1(b)}L-70 48Q-64 0 -70 -48Z`);
    crack.setAttribute('d', `M66 ${f1(t + 8)}L40 ${f1(t + 22)}L52 ${f1(t + 34)}L24 ${f1(t + 46)}`); crack.setAttribute('opacity', f1(clamp(k * 3, 0, 1)));
    up.setAttribute('transform', `rotate(${f1(10 * k)} -70 -48)`);
    return e;
  } };
  e.set(0);
  if (t0 !== null) show(g, t0);
  return e;
}

    infoCard(p, 800, 570, 760, 160, 'лечение', 'стабилизация нейтрального грудопоясничного перехода и лопаток; растяжка горизонтальных приводящих и внутренних ротаторов плеча, сгибателей и внутренних ротаторов бедра; правильный подъём', SP, m('int'), { size: 18 });

  ['sp', 'Спондилолистез', (m, D) => {
    const p = panel(0);
    txt(p, 'спондилолистез: степени по смещению', 800, 56, m('def'), { size: 28, weight: 700, anchor: 'middle', fill: SPL });

    setSh(0);
    [[4.5, 20], [6.5, 50], [8.4, 86], [10.5, 116]].forEach(([dt, v], i, a) => { const from = i ? a[i - 1][1] : 0; prog(q => setSh(lerp(from, v, q)), m('def', dt), 1.2); });
    pill(p, 'схема: задний край верхнего тела по отношению к нижнему', 420, 130, m('def', 4), { col: COL.dim, size: 15 });
    infoCard(p, 800, 90, 760, 250, 'степени', 'I — до 25 %, II — 26–50 %, III — 51–75 %, IV — больше 75 % глубины нижнего позвонка', SPL, m('def', 4), { size: 21 });

  }],

  ['as', 'Анкилозирующий спондилит', (m, D) => {
    const p = panel(0);
    txt(p, 'анкилозирующий спондилит', 800, 56, m('as'), { size: 28, weight: 700, anchor: 'middle', fill: ASC });

    const stripe = (k, t0) => {
      const pts = []; for (let u = 0; u <= 24; u += .5) pts.push(f.unit(u, SEG_W[Math.min(23, Math.floor(u))] * k));

    lab(p, '«бамбуковый» позвоночник', 420, 180, ...f.unit(14, SEG_W[14] * .7), ASC, m('as', 6), { anchor: 'start' });

    txt(p, 'цель — срастись с лордозом', 560, 410, m('int', 5), { size: 19, fill: COL.good, anchor: 'middle', weight: 700 });
    pill(p, 'шея: атлантоосевой подвывих — крайняя осторожность', 560, 820, m('pre'), { col: COL.bad, size: 16 });
    infoCard(p, 800, 90, 760, 330, 'Рудвалайт: 3 признака из 4 → ОПП+ = 12,4', '', ASC, m('rud'));
    ['скованность дольше 30 минут', 'боль уменьшается от упражнений, не от покоя', 'будит во второй половине ночи', 'чередующаяся боль в ягодицах'].forEach((s, i) => numLine(p, i + 1, s, 830, 200 + i * 52, ASC, m('rud', .8 + i * 2.2)));

  ['rib', 'Рёбра', (m, D) => {

    infoCard(p, 800, 90, 760, 190, 'растяжение или смещение', 'скручивание (выгрузить багажник, удар клюшкой), травма, долгий сильный кашель; возможна межрёберная боль', RIB, m('rib'), { size: 19 });
    infoCard(p, 800, 300, 760, 270, 'ребро застряло сзади', 'сидя; рука снаружи от угла ребра; пациент приводит плечо против сопротивления другой руки; во время сокращения ребро — вперёд и внутрь, 3–5 с × 3–5', COL.good, m('post'), { size: 19 });
    infoCard(p, 800, 590, 760, 190, 'ребро застряло спереди', 'рука внутри от угла; сопротивление отведению плеча; смещение назад и наружу', ASC, m('ant'), { size: 19 });

  ['si', 'Крестцово-подвздошный сустав', (m, D) => {

    infoCard(p, 60, 90, 700, 170, 'растяжение: 10–33 % пациентов', 'боль локальная, иногда по ходу седалищного нерва; легче в покое и при разгрузке', SIJ, m('si'), { size: 19 });

    const place = () => { const P = fs.pts.P, t = fs.pose.tilt; dots.forEach(d => { const [rx, ry] = rotPt(d.dx, d.dy, t); put(d.g, { x: fs.at([P[0] + rx, P[1] + ry])[0], y: fs.at([P[0] + rx, P[1] + ry])[1] }); }); };

    dots.forEach((d, i) => show(d.g, m('obs', i < 2 ? .5 : 2)));

     ['смещение вверх → высокоскоростной рывок за лодыжку на выдохе', 18.3]].forEach(([s, dt], i) => numLine(p, i + 1, s, 830, 510 + i * 90, SP, m('tech', dt), { size: 18, maxW: 660 }));
