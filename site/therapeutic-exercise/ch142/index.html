// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch142/cards.ru.json

const SP = '#8fd6b0', ART = '#e2574c', NRV = NERVE_C, HA = '#f0a04b', NK = '#86c9e8', RAD = '#c9b8e8', PAIN = '#ff5a3c';
const BN = ANAT.bone, BL = mix(ANAT.bone, '#000000', .45);
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : x + (right ? 8 : -8);
  path(g, `M${lx} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
function numLine(p, n, str, x, y, col, t0, { size = 19, maxW = 640 } = {}) {
  const g = G(p, { o: 0 });
  mk('circle', { cx: x + 16, cy: y - 7, r: 15, fill: col }, g);
  T(g, String(n), { x: x + 16, y: y, size: 18, weight: 700, fill: COL.board, anchor: 'middle' });
  put(para(g, str, x + 44, y, null, { size, maxW }), { o: 1 });
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
function lying(p, x, y, s, t0, kind, pose = {}) {
  const f = postureFig(p, 0, 0, s, t0, { pose });
  put(f.g, kind === 'supine' ? { x, y: y - 75 * s, r: -90 } : { x, y: y - 78 * s, r: 90 });
  return f;
}
const table = (p, x1, x2, y, t0) => show(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.dim, 'stroke-width': 6 }, { o: 0 }), t0);
// The cervical column from the front (schematic): C7 at the bottom up to C1, transverse foramina, the vertebral arteries
// from the subclavian arteries up through C6–C1, over the atlas into the foramen magnum. set({ turn }): 0..1 —
// rotation with side bend away: the right artery kinks and narrows above C2.
function cervFront(p, x, y, s, t0) {
  const g = G(p, { x, y, s, o: 0 }), Y = i => -i * 62;   // i = 0 for C7 … 6 for C1
  // the skull base and the foramen magnum
  mk('path', { d: 'M-190 -470Q0 -560 190 -470L170 -430Q0 -480 -170 -430Z', fill: BN, stroke: BL, 'stroke-width': 2.5 }, g);
  mk('ellipse', { cx: 0, cy: -452, rx: 46, ry: 14, fill: '#101a17', stroke: BL, 'stroke-width': 1.5 }, g);
  for (let i = 0; i < 7; i++) {
    const yy = Y(i), w = i === 6 ? 120 : 92;
    if (i < 6) mk('rect', { x: -48, y: yy - 22, width: 96, height: 44, rx: 10, fill: BN, stroke: BL, 'stroke-width': 2.2 }, g);
    mk('path', { d: `M${-w} ${yy - 12}H${w}V${yy + 12}H${-w}Z`, fill: BN, stroke: BL, 'stroke-width': 2, 'stroke-linejoin': 'round' }, g);
    if (i >= 1) [-1, 1].forEach(k => mk('circle', { cx: k * 72, cy: yy, r: 9, fill: '#101a17', stroke: BL, 'stroke-width': 1.5 }, g));
    if (i < 6) mk('path', { d: `M-46 ${yy + 22}H46V${yy + 40}H-46Z`, fill: DISC_C, stroke: mix(DISC_C, '#000000', .35), 'stroke-width': 1.5 }, g);
    T(g, i === 6 ? 'C1' : 'C' + (7 - i), { x: i === 6 ? -150 : -120, y: yy + 6, size: 16, fill: COL.dim, anchor: 'end', weight: 600 });
  }
  mk('path', { d: 'M-12 -330L-12 -400L0 -416L12 -400L12 -330Z', fill: BN, stroke: BL, 'stroke-width': 2 }, g);   // the dens
  const arts = [-1, 1].map(k => {
    const glow = path(g, '', { stroke: ART, 'stroke-width': 18, 'stroke-opacity': .2 });
    const e = path(g, '', { stroke: ART, 'stroke-width': 10 });
    return { k, e, glow };
  });
  path(g, 'M-260 120Q-130 90 -80 110M260 120Q130 90 80 110', { stroke: ART, 'stroke-width': 14, 'stroke-opacity': .65 });
  T(g, 'подключичные', { x: 0, y: 150, size: 16, fill: ART, anchor: 'middle', weight: 600 });
  const S = { turn: 0 }, e = { g };
  e.set = o => {
    Object.assign(S, o);
    arts.forEach(({ k, e: el, glow }) => {
      const kink = k > 0 ? S.turn : 0, top = Y(6), bend = 30 * kink;
      const d = `M${k * 90} 108Q${k * 72} 60 ${k * 72} ${Y(1) + 20}L${k * 72} ${top + 8}Q${k * (96 + bend)} ${top - 40} ${k * 60} ${top - 58}Q${k * 30} ${top - 80} ${k * 18} -450`;
      el.setAttribute('d', d); glow.setAttribute('d', d);
      el.setAttribute('stroke-width', f1(10 - 7 * kink));
    });
    return e;
  };
  e.at = (px, py) => { const s0 = st(g); return [s0.x + px * s0.s, s0.y + py * s0.s]; };
  e.set({});
  if (t0 !== null) show(g, t0);
  return e;
}

    infoCard(p, 800, 720, 370, 150, 'факторы риска', 'травма шеи за месяц, инфекция, гипертония, мигрень без ауры, низкий холестерин и ИМТ', HA, m('ci', 8.9), { size: 15 });
    infoCard(p, 1190, 720, 370, 150, 'признаки расслоения', 'преходящая неврология, нечёткое зрение, неустойчивость, головокружение, речь, слабость руки', COL.bad, m('ci', 17.2), { size: 15 });

  ['ha', 'Головная боль', (m, D) => {
    const p = panel(0);
    txt(p, 'головная боль: какая и когда к врачу', 800, 56, m('cls'), { size: 28, weight: 700, anchor: 'middle', fill: HA });

    T(big, 'хронических головных болей — шейные', { x: 410, y: 350, size: 19, fill: COL.chalk, weight: 600, anchor: 'middle' });

    // the vicious circle
    const CX = 410, CY = 620, R = 150, cg = G(p, { o: 0 });

    prog(q => { const a = rad(-90 + 360 * 2 * q); dot.setAttribute('cx', f1(CX + R * Math.cos(a))); dot.setAttribute('cy', f1(CY + R * Math.sin(a))); }, m('et', 14), 5, lin);
    infoCard(p, 800, 90, 760, 230, 'причины шейной головной боли', 'травма мягких тканей; долгие неудобные позы; раздражение большого затылочного нерва; постоянное напряжение с ишемией; триггерные точки; воспаление суставов и связок верха шеи; ВНЧС; тугой грудной отдел', HA, m('et'), { size: 17 });
    infoCard(p, 800, 335, 760, 230, 'типично', 'с одной стороны (или сильнее с одной); от шеи или из-под затылка — на голову; провоцируют поза и движения шеи; травма, артроз, сидячий образ жизни; чаще у женщин, без семейной предрасположенности', SP, m('box'), { size: 17 });
    infoCard(p, 800, 580, 760, 210, 'к врачу', 'первая или самая сильная боль в жизни; резкие пики; боли «пачками» в течение дня; изменение личности или поведения', COL.bad, m('red'), { size: 18 });

      { parts: ['Изменились личность и поведение'], ans: ['d'], why: 'Красный флаг — к врачу.' },
      { parts: ['С одной стороны, провоцируется поворотом головы'], ans: ['n'], why: 'Типично для шейной головной боли.' },

  ['hamg', 'Лечение шейной головной боли', (m, D) => {
    const p = panel(0);
    txt(p, 'шейная головная боль: глубокие сгибатели и лопатка', 800, 56, m('imp'), { size: 28, weight: 700, anchor: 'middle', fill: SP });

    txt(p, 'кивок: глубокие сгибатели шеи', 330, 390, m('ex', 3), { size: 19, fill: SP, anchor: 'middle', weight: 700 });

    pill(p, 'профилактика: осанка, баланс мышц, изменить окружение', 410, 820, m('prev'), { col: SP, size: 17 });
    infoCard(p, 800, 90, 760, 280, 'нарушения', 'суставы верха шеи; слабая тоническая выносливость глубоких сгибателей (и, возможно, многораздельной и подзатылочных); поза лопаток и поясницы; раздражение нервов; нервно-мышечный контроль; тугой верхнегрудной отдел', SP, m('imp'), { size: 19 });
    infoCard(p, 800, 385, 760, 140, 'боль', 'процедуры, массаж, изометрия; техники мягких тканей, сухие иглы', HA, m('pm'), { size: 19 });
    infoCard(p, 800, 540, 760, 330, 'упражнения', 'подвижность шеи и гибкость подзатылочных; кивок и втягивание подбородка для глубоких сгибателей; стабилизация шеи — глубокие отдельно от глобальных; стабилизация лопатки на выносливость', SP, m('ex'), { size: 20 });
  }],

  ['neck', 'Боль в шее', (m, D) => {
    const p = panel(0);
    txt(p, 'боль в шее: насколько сильны рекомендации', 800, 56, m('epi'), { size: 28, weight: 700, anchor: 'middle', fill: NK });
    [['22–70 %', 'хоть раз в жизни', 0], ['≈ 37 %', 'дольше года', 4], ['≈ ¼', 'пациентов амбулаторной ФТ', 7]].forEach(([a, b, dt], i) => {
      const g = G(p, { o: 0 }), x = 60 + i * 238;
      roundBox(g, x, 90, 222, 140, NK, PANEL, 2);
      T(g, a, { x: x + 111, y: 160, size: 40, fill: NK, weight: 700, anchor: 'middle' });
      put(para(g, b, x + 111, 198, null, { size: 16, maxW: 200, anchor: 'middle', fill: COL.chalk }), { o: 1 });
      show(g, m('epi', dt));
    });
    pillRow(p, ['оценить грудной отдел', 'чаще и дисфункция ВНЧС'], 410, 270, [m('epi', 11.5), m('epi', 17.1)], { col: SP, size: 16, space: 10 });
    // guideline strength: three dots
    const rows = [['мобилизация и манипуляция шеи', 3], ['то же для грудного отдела', 1], ['прицельная растяжка', 1], ['координация, сила, выносливость', 3], ['мобилизация нервов руки', 2], ['тракция', 2], ['обучение и консультирование', 3]];
    const tg = G(p, { o: 0 }); T(tg, 'сила данных', { x: 690, y: 330, size: 16, fill: COL.dim, anchor: 'end', weight: 600 }); show(tg, m('cpg'));
    rows.forEach(([s, n], i) => {
      const g = G(p, { o: 0 }), y = 380 + i * 66, col = [null, COL.bad, HA, COL.good][n];
      T(g, s, { x: 80, y, size: 19, fill: COL.chalk, weight: 600 });
      [0, 1, 2].forEach(j => mk('circle', { cx: 620 + j * 30, cy: y - 7, r: 10, fill: j < n ? col : 'none', stroke: col, 'stroke-width': 2 }, g));
      show(g, m('cpg', 1 + i * 2));
    });
    pillRow(p, ['●●● сильные', '●●○ умеренные', '●○○ слабые'], 410, 860, m('cpg', 1), { col: [COL.good, HA, COL.bad], size: 15, space: 10 });
    infoCard(p, 800, 90, 760, 500, 'Рейни: 4 признака из 5', '→ механическая тракция по 15 минут успешна у 90 %', NK, m('rn'), { size: 20 });
    ['периферизация при проверке подвижности C4–C7', 'положительный симптом отведения', 'возраст ≥ 55 лет', 'положительный тест натяжения срединного нерва', 'облегчение при вытяжении руками'].forEach((s, i) => numLine(p, i + 1, s, 830, 260 + i * 62, NK, m('rn', 6 + i * 1.6), { size: 19, maxW: 660 }));
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-cpg', prompt: ['Насколько сильны данные рекомендаций при боли в шее?'],
    build: grid([
      { parts: ['Мобилизация и манипуляция шеи'], ans: ['s'], why: 'Сильные данные.' },
      { parts: ['Тракция'], ans: ['m'], why: 'Умеренные данные.' },
      { parts: ['Прицельная растяжка'], ans: ['w'], why: 'Слабые данные.' },
      { parts: ['Координация, сила и выносливость'], ans: ['s'], why: 'Сильные данные.' },
      { parts: ['Мобилизация нервов руки'], ans: ['m'], why: 'Умеренные данные.' },
    ], [['s', 'Сильные', COL.good], ['m', 'Умеренные', HA], ['w', 'Слабые', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['rad', 'Радикулопатия и миелопатия', (m, D) => {
    const p = panel(0);
    txt(p, 'шейная радикулопатия и миелопатия', 800, 56, m('rad'), { size: 28, weight: 700, anchor: 'middle', fill: RAD });
    const sg = spineSeg(p, 400, 300, .9, m('rad'), { ligs: false });
    prog(q => sg.set({ osteo: .7 * q, flex: -6 * q }), m('rad', 1.5), 2);
    lab(p, 'отверстие сужено — корешок раздражён', 80, 520, ...sg.at('root'), PAIN, m('rad', 3), { anchor: 'start' });
    pill(p, 'схема', 640, 110, m('rad'), { col: COL.dim, size: 15 });
    // the canal seen from above: spurs narrow it, the cord flattens, a bright spot — myelomalacia
    const CX = 400, CY = 720, cn = G(p, { x: CX, y: CY, o: 0 });
    mk('path', { d: 'M-110 -70Q0 -110 110 -70L120 70Q0 100 -120 70Z', fill: BN, stroke: BL, 'stroke-width': 2.5 }, cn);
    mk('ellipse', { rx: 70, ry: 50, fill: '#101a17', stroke: BL, 'stroke-width': 2 }, cn);
    const cord = mk('ellipse', { rx: 44, ry: 30, fill: mix(NRV, COL.board, .3), stroke: NRV, 'stroke-width': 2.5 }, cn);
    const spur = mk('path', { fill: BN, stroke: BL, 'stroke-width': 2 }, cn);
    const spot = mk('ellipse', { rx: 10, ry: 6, fill: '#ffffff', opacity: 0 }, cn);
    const setC = k => { cord.setAttribute('ry', f1(30 - 14 * k)); cord.setAttribute('rx', f1(44 + 6 * k)); spur.setAttribute('d', `M-40 -50Q0 ${f1(-50 + 30 * k)} 40 -50ZM-40 50Q0 ${f1(50 - 22 * k)} 40 50Z`); spot.setAttribute('opacity', f1(clamp(k * 2 - 1, 0, 1))); };
    setC(0);
    show(cn, m('my'));
    prog(q => setC(q), m('my', 1), 2.5);
    T(cn, 'канал, вид сверху', { x: 0, y: -90, size: 15, fill: COL.dim, anchor: 'middle', weight: 600 });
    lab(p, 'миеломаляция на МРТ', 560, 830, CX + 10, CY, '#ffffff', m('my', 11.5), { anchor: 'start' });
    infoCard(p, 800, 90, 760, 170, 'радикулопатия', 'боль в шее с болью или неврологией в руке; сужение отверстия при воспалении и дегенерации фасеток или дисков; понять, какие позы вызывают и какие облегчают', RAD, m('rad'), { size: 18 });
    infoCard(p, 800, 275, 760, 140, 'лечение', 'тракция; стабилизация — глубокие сгибатели, осевое вытяжение; поза лопатки и облегчающие позы', SP, m('rad', 13.5), { size: 18 });
    infoCard(p, 800, 430, 370, 200, 'Фриц, n = 86', 'упражнения + механическая тракция лёжа — лучше индекс через 6 и 12 мес', NK, m('fritz'), { size: 17 });
    infoCard(p, 1190, 430, 370, 200, 'обзор', 'естественное течение благоприятное; воротник не лучше терапии, тракция — не лучше имитации', COL.dim, m('rev'), { size: 17 });
    infoCard(p, 800, 645, 760, 225, 'миелопатия', 'дегенерация или стеноз канала: кисти и стопы, неуклюжая походка, признаки центрального мотонейрона, тазовые нарушения; ведение как при стенозе; следить за неврологией — даже лёгкая травма опасна', COL.bad, m('my'), { size: 18 });
  }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Позвоночная артерия уязвима при повороте, наклоне в другую сторону и разгибании; при головокружении и нестабильности — без манипуляций вверху шеи.', 'w1'],
     ['Шейная головная боль идёт от шеи и связана с позой; красные флаги — к врачу.', 'w2'],
     ['Основа — глубокие сгибатели шеи, лопатка, осанка, подвижный грудной отдел.', 'w3'],
     ['Радикулопатия — тракция и стабилизация; миелопатию отслеживают.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SP }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-va', prompt: ['Перед манипуляцией верха шеи пациент говорит о головокружении и неустойчивости; месяц назад была травма шеи. Что делать?'],
    build: choice([
      ['Не манипулировать в краниовертебральной области и направить к врачу'],
      ['Толчок с поворотом на 45°'],
      ['Сильная тракция с разгибанием'],
      ['Мышечная энергия в разгибании и наклоне'],
    ], 0, 'Головокружение, неустойчивость и недавняя травма шеи — противопоказания и факторы риска для позвоночной артерии.',
    [null, 'Поворот на 45° перегибает артерию.', 'Тракция и разгибание сужают артерию.', 'Разгибание и наклон сужают просвет.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-my', prompt: ['У 60-летнего пациента немеют кисти, походка стала неуклюжей, появились проблемы с мочеиспусканием. Что вероятнее?'],
    build: choice([
      ['Шейная миелопатия: направить к врачу, следить за неврологией, беречь от травм'],
      ['Шейная головная боль: кивки и осанка'],
      ['Радикулопатия одного корешка: только тракция'],
      ['Растяжение мышц: массаж и покой'],
    ], 0, 'Симптомы в кистях и стопах, походка и тазовые нарушения — признаки поражения спинного мозга.',
    [null, 'Головная боль не объясняет походку и тазовые нарушения.', 'Корешок не даёт симптомов в стопах и тазовых нарушений.', 'Это неврологическая картина, не мышечная.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
