const SP = '#8fd6b0', KIN = '#86c9e8', STB = '#8fd6b0', FUN = '#f0c060', MOB = '#c9b8e8', AER = '#f4a48c', TRA = '#e0a0c8';
const PH = ['#f4a48c', '#f0c060', '#8fd6b0'];
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function numLine(p, n, str, x, y, col, t0, { size = 19, maxW = 640 } = {}) {
  const g = G(p, { o: 0 });
  mk('circle', { cx: x + 16, cy: y - 7, r: 15, fill: col }, g);
  T(g, String(n), { x: x + 16, y: y, size: 18, weight: 700, fill: COL.board, anchor: 'middle' });
  put(para(g, str, x + 44, y, null, { size, maxW }), { o: 1 });
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
// A seated mannequin on a chair with its ankle planted at (ax, GY); sitStand — n sit-to-stand repetitions (as in lesson 11).
function chairFig(p, ax, GY, s, t0, col) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: SIT, col });
  plant(f, 'AN', ax, GY);
  const [hx, hy] = onStage(f, 'H');
  chair(p, hx, hy + 22 * s / .5 * .32, GY, t0);
  show(f.g, t0);
  return f;
}
function sitStand(f, t0, dur, n, ax, GY) {
  prog(q => {
    const e = cyc(q, n), o = {};
    for (const k in SIT) o[k] = lerp(SIT[k], STAND[k], e);
    o.t += 26 * Math.sin(Math.PI * e);
    o.aN += 30 * Math.sin(Math.PI * e); o.aF += 30 * Math.sin(Math.PI * e);
    f.set(o); plant(f, 'AN', ax, GY);
  }, t0, dur, lin);
}
// The transversus abdominis as a belt round the lumbar part of a lying figure.
function trBelt(p, f, t0, k = 22) {
  const B = f.unit(2.5, k), e = mk('ellipse', { cx: f1(B[0]), cy: f1(B[1]), rx: 18, ry: 40, fill: 'none', stroke: TRA, 'stroke-width': 6, opacity: 0 }, p);
  show(e, t0);
  return e;
}

    heads.forEach((h, j) => {

      mk('rect', { x: x + 4, y: Y0, width: CW - 8, height: HH - 10, rx: 12, fill: PH[j], 'fill-opacity': .25, stroke: PH[j], 'stroke-width': 2 }, g);
      T(g, h, { x: x + CW / 2, y: Y0 + 38, size: 20, fill: PH[j], weight: 700, anchor: 'middle' });
      rows.forEach((r, i) => { const y = Y0 + HH + i * RH; mk('rect', { x: x + 4, y: y + 6, width: CW - 8, height: RH - 12, rx: 10, fill: PANEL, stroke: mix(PH[j], COL.board, .45), 'stroke-width': 1.5 }, g); put(para(g, cells[i][j], x + 18, y + 36, null, { size: 16, maxW: CW - 36 }), { o: 1 }); });
      show(g, m(['p1', 'p2', 'p3'][j]));
    });
  }],

  ['terms', 'Термины и данные', (m, D) => {
    const p = panel(0);
    txt(p, 'манипуляция и толчок; что рекомендуют', 800, 56, m('term'), { size: 28, weight: 700, anchor: 'middle', fill: MOB });
    const X0 = 100, X1 = 660, Y = 330, g = G(p, { o: 0 });
    path(g, `M${X0} ${Y}H${X1}`, { stroke: COL.dim, 'stroke-width': 3 });
    path(g, `M${X1 - 40} ${Y - 150}V${Y + 14}`, { stroke: COL.bad, 'stroke-width': 3, 'stroke-dasharray': '6 4' });
    T(g, 'патологический предел', { x: X1 - 40, y: Y + 40, size: 16, fill: COL.bad, anchor: 'middle', weight: 600 });
    let d = ''; for (let i = 0; i <= 60; i++) { const x = lerp(X0 + 140, X1 - 60, i / 60); d += (i ? 'L' : 'M') + f1(x) + ' ' + f1(Y - 60 + 26 * Math.sin(i / 60 * Math.PI * 8)); }
    path(g, d, { stroke: MOB, 'stroke-width': 4 });
    T(g, 'манипуляция: колебания по степеням', { x: X0 + 140, y: Y - 110, size: 19, fill: MOB, weight: 700 });
    show(g, m('term'));
    const th = G(p, { o: 0 });
    path(th, `M${X1 - 90} ${Y - 160}H${X1 - 22}M${X1 - 36} ${Y - 172}L${X1 - 20} ${Y - 160}L${X1 - 36} ${Y - 148}`, { stroke: COL.bad, 'stroke-width': 6 });
    T(th, 'толчок: быстро, малая амплитуда, у предела', { x: X1 - 10, y: Y - 190, size: 19, fill: COL.bad, weight: 700, anchor: 'end' });
    show(th, m('term', 4));
    infoCard(p, 800, 90, 760, 780, 'сильные данные (рекомендации по шее и пояснице)', '', SP, m('ev'));
    [['манипуляции и толчки при нарушенной подвижности', 0], ['координация, сила и выносливость туловища', 4], ['постепенная выносливость и физическая форма', 7], ['направленное предпочтение при централизации', 10]].forEach(([s, dt], i) => {
      const g2 = G(p, { o: 0 }), y = 240 + i * 150;
      [0, 1, 2].forEach(j => mk('circle', { cx: 850 + j * 30, cy: y - 8, r: 11, fill: COL.good }, g2));
      put(para(g2, s, 960, y, null, { size: 21, maxW: 560, weight: 600 }), { o: 1 });
      show(g2, m('ev', dt));
    });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-phase', prompt: ['К какой фазе это относится?'],
    build: grid([
      { parts: ['Манипуляции I–II степени, растяжка туловища только в облегчающих положениях'], ans: ['1'], why: 'Первая фаза — защита.' },
      { parts: ['Упражнения против толчков, аэробика малой интенсивности'], ans: ['2'], why: 'Вторая фаза — контролируемое движение.' },
      { parts: ['Аэробика с целевым пульсом несколько раз в неделю'], ans: ['3'], why: 'Третья фаза — возврат к функции.' },
      { parts: ['Перекат и вставание с устойчивой спиной'], ans: ['1'], why: 'Базовые навыки первой фазы.' },
      { parts: ['Стабилизация в переходах с упором на силу'], ans: ['3'], why: 'Третья фаза.' },
    ], [['1', 'I', PH[0]], ['2', 'II', PH[1]], ['3', 'III', PH[2]]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Базовые вмешательства для всех: кинестетика, стабилизация, механика устойчивого позвоночника.', 'w1'],
     ['Пациент — активный участник: знает ограничения, сам управляет симптомами, учится профилактике.', 'w2'],
     ['Пять составляющих: осознание, подвижность, мышцы, аэробика, функция.', 'w3'],
     ['Они меняются от защиты к контролируемому движению и возврату к функции.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SP }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-start', prompt: ['Пациентка с хронической болью в пояснице хочет сразу начать скручивания и бег. С чего начать?'],
    build: choice([
      ['С базовых вмешательств: безопасные движения и нейтраль, глубокие мышцы, механика тела'],
      ['Сразу с динамических скручиваний'],
      ['Только с пассивных процедур'],
      ['С длительного бега'],
    ], 0, 'Базовые вмешательства — основа для любого уровня; динамика и интенсивная аэробика — позже.',
    [null, 'Динамика без стабилизации может усилить симптомы.', 'Пациент должен быть активным участником.', 'Сначала безопасная поза и контроль.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-edu', prompt: ['Пациент в острой стадии боится, что боль навсегда, и хочет только «лечиться» у терапевта. Что важно в обучении?'],
    build: choice([
      ['Объяснить благоприятный прогноз и ограничения стадии, сделать его активным участником'],
      ['Строгий покой до полного исчезновения боли'],
      ['Сказать, что самому ничего делать не нужно'],
      ['Сразу дать нагрузки третьей фазы'],
    ], 0, 'Обучение: прогноз, ограничения стадии, самоуправление и ранний возврат к активности.',
    [null, 'Рекомендации советуют раньше вернуться к обычным делам.', 'Пациент учится сам управлять симптомами.', 'В начале подострой фазы перегружать себя не стоит.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
