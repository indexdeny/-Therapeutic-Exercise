const SP = '#8fd6b0', THX = '#86c9e8', SCA = '#f4a48c', SUB = '#c9b8e8', TRC = '#f0c060', PIL = '#c8b8e8', ROLL = '#9fb8c8';
const BN = ANAT.bone, BL = mix(ANAT.bone, '#000000', .45);
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : x + (right ? 8 : -8);
  path(g, `M${lx} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const swing = (q, n) => Math.sin(2 * Math.PI * n * q);
const f1 = v => v.toFixed(1);
const sitPose = { shank: 0, thigh: -90, arm: 12, elb: 60 };
function sitFig(p, x, gy, s, t0, pose = {}) {
  const f = postureFig(p, x, gy, s, t0, { pose: { ...sitPose, ...pose } });
  const H = f.at('hip');
  const ch = path(p, `M${f1(H[0] - 70 * s)} ${f1(H[1] + 34 * s)}H${f1(H[0] + 40 * s)}M${f1(H[0] - 60 * s)} ${f1(H[1] + 34 * s)}V${gy}M${f1(H[0] + 30 * s)} ${f1(H[1] + 34 * s)}V${gy}M${f1(H[0] - 66 * s)} ${f1(H[1] + 34 * s)}V${f1(H[1] - 200 * s)}`, { stroke: COL.dim, 'stroke-width': 5 }, { o: 0 });
  p.insertBefore(ch, f.g);
  if (t0 !== null) show(ch, t0);
  return f;
}
const hand = (p, t0) => { const g = G(p, { o: 0 }); mk('ellipse', { rx: 30, ry: 14, fill: mix(ANAT.skin, '#c08060', .3), stroke: BL, 'stroke-width': 2 }, g); if (t0 !== null) show(g, t0); return g; };
// The neck from the front (schematic): C7 at (0, 0) up to C1, the head, the first two ribs and the scalenes from the
// transverse processes to the ribs. set({ tilt, ribs }): tilt (deg) leans the head and upper neck; ribs 0..1 presses the
// right-hand (viewer's) ribs down. e.mus[1] — the right scalene.
function neckFront(p, x, y, s, t0) {
  const g = G(p, { x, y, s, o: 0 }), bone = { fill: BN, stroke: BL, 'stroke-width': 2.2, 'stroke-linejoin': 'round' };

  mk('rect', { x: -32, y: -14, width: 64, height: 40, rx: 8, ...bone }, g);   // T1
  const up = G(g, {});
  for (let i = 0; i < 7; i++) { const yy = -40 - i * 38; mk('rect', { x: -60, y: yy - 6, width: 120, height: 12, rx: 6, ...bone }, up); mk('rect', { x: -30, y: yy - 15, width: 60, height: 30, rx: 8, ...bone }, up); }
  const hg = mk('radialGradient', { id: 'nk' + (++SHADE_ID), cx: .4, cy: .35, r: .8 }, mk('defs', {}, g));
  [[0, mix(ANAT.skin, '#ffffff', .4)], [.6, ANAT.skin], [1, mix(ANAT.skin, '#000000', .35)]].forEach(([o, c]) => mk('stop', { offset: o, 'stop-color': c }, hg));
  mk('ellipse', { cx: 0, cy: -430, rx: 110, ry: 140, fill: `url(#${hg.id})`, stroke: BL, 'stroke-width': 2 }, up);
  [-1, 1].forEach(k => mk('ellipse', { cx: k * 40, cy: -440, rx: 14, ry: 7, fill: '#3a4a48' }, up));
  const mus = [-1, 1].map(() => [muscleEl(g, { rest: 150, w: 11 }), muscleEl(g, { rest: 190, w: 11 })]);
  const S = { tilt: 0, ribs: 0 }, e = { g, mus: mus.map(m => m[0]) };
  e.set = o => {
    Object.assign(S, o);
    up.setAttribute('transform', `rotate(${f1(S.tilt)} 0 -20)`);
    ribs[1].setAttribute('transform', `translate(0 ${f1(14 * S.ribs)})`);
    [-1, 1].forEach((k, i) => {
      const tp = yy => { const [rx, ry] = rotPt(k * 60, yy + 20, S.tilt); return [rx, ry - 20]; }, dr = i ? 14 * S.ribs : 0;
      mus[i][0].set(tp(-154), [k * 150, 52 + dr]);
      mus[i][1].set(tp(-116), [k * 186, 112 + dr]);
    });
    return e;
  };
  e.at = (px, py) => { const s0 = st(g); return [s0.x + px * s0.s, s0.y + py * s0.s]; };
  e.set({});
  if (t0 !== null) show(g, t0);
  return e;
}

    build: grid([
      { parts: ['Сидя, второй позвонок фиксирован, медленный кивок'], ans: ['o'], why: 'Подзатылочные.' },
      { parts: ['Голова фиксирована, верхние рёбра прижаты на вдохе'], ans: ['s'], why: 'Лестничные.' },
      { parts: ['На валике, руки в положении «девяносто на девяносто»'], ans: ['p'], why: 'Большая грудная и подлопаточная.' },
      { parts: ['Втянуть подбородок, повернуть на 45° и кивнуть'], ans: ['o'], why: 'Подзатылочные с одной стороны.' },
      { parts: ['Стоя у стола, держась снизу, отклониться'], ans: ['s'], why: 'Лестничные, самостоятельно.' },
    ], [['o', 'Подзатылочные', SUB], ['s', 'Лестничные', SCA], ['p', 'Грудные', THX]], { multi: false, text: true }),
  }], done) }],

  ['trac', 'Ручная тракция', (m, D) => {
    const p = panel(0);
    txt(p, 'ручная тракция шеи', 800, 56, m('why'), { size: 28, weight: 700, anchor: 'middle', fill: TRC });
    const TY = 520, GY = 860;
    show(path(p, `M470 ${TY}H1000M500 ${TY}V${GY}M970 ${TY}V${GY}M80 ${GY}H1000`, { stroke: COL.dim, 'stroke-width': 5 }, { o: 0 }), m('pos'));
    const f = lieFig(p, 980, TY, .55, m('pos'), 'supine');
    const th = fig(p, { x: 330, y: GY - 182 * .9, s: .9, o: 0, col: '#b9c9dc', pose: { ...STAND } });
    show(th.g, m('pos'));
    const occ = f.at('occ');
    const grip = t => { th.set({ t }); reach(th, 'N', occ[0] - 4, occ[1] + 6); reach(th, 'F', occ[0] - 10, occ[1] + 2); };
    grip(6);
    prog(q => { grip(lerp(6, -10, cyc(q, 2))); }, m('proc', 4), 6, lin);
    const ar = G(p, { o: 0 }); path(ar, `M${f1(occ[0] - 40)} ${f1(occ[1] - 60)}H${f1(occ[0] - 140)}M${f1(occ[0] - 126)} ${f1(occ[1] - 72)}L${f1(occ[0] - 142)} ${f1(occ[1] - 60)}L${f1(occ[0] - 126)} ${f1(occ[1] - 48)}`, { stroke: TRC, 'stroke-width': 6 }); show(ar, m('proc', 4));
    pillRow(p, ['пальцы под затылком', 'лоб + затылок', 'вокруг остистого — ниже уровня', 'пояс на бёдрах терапевта'], 540, 140, [m('pos', 6), m('pos', 9), m('pos', 11), m('pos', 16)], { col: TRC, size: 15, space: 8 });
    // flexion moves the pull lower in the neck
    prog(q => f.set({ cerv: lerp(34, -10, q), hd: 18 * q }), m('tip', .5), 1.5);
    const zone = mk('ellipse', { rx: 22, ry: 40, fill: TRC, 'fill-opacity': .35, stroke: TRC, 'stroke-width': 3, opacity: 0 }, p);
    show(zone, m('tip', 2));
    prog(q => { const P = f.unit(lerp(21.5, 18, q), 0); zone.setAttribute('cx', f1(P[0])); zone.setAttribute('cy', f1(P[1])); }, m('tip', .5), 1.5);
    txt(p, 'больше сгибания → ниже в шее', 740, 450, m('tip', 2), { size: 19, fill: TRC, anchor: 'middle', weight: 700 });
    infoCard(p, 1040, 90, 520, 260, 'зачем', 'растянуть мышцы и капсулы фасеток, расширить отверстия; терапевт сам задаёт угол, положение головы и место силы', TRC, m('why'), { size: 19 });
    infoCard(p, 1040, 365, 520, 230, 'как', 'положение головы — до натяжения нужной ткани; терапевт устойчиво стоит и плавно отклоняется назад; прерывисто, мягко нарастая и отпуская', TRC, m('proc'), { size: 19 });
    infoCard(p, 1040, 610, 520, 260, 'осторожно', 'чем больше сгибание — тем ниже действие; при наклоне вбок на вогнутой стороне сближаются фасетки и отверстия — корешковые или фасеточные симптомы', COL.bad, m('tip'), { size: 19 });
  }],

  ['self', 'Самовытяжение', (m, D) => {
    const p = panel(0);
    txt(p, 'самовытяжение шеи', 800, 56, m('st'), { size: 28, weight: 700, anchor: 'middle', fill: TRC });
    const f = sitFig(p, 360, 860, .72, m('st'));
    const O = f.local('occ'), W = [O[0] - 30, O[1] + 26];
    f.set(armIK(f.q, W, 200));
    const hh = hand(p, m('st', 1)); const OS = f.at('occ'); put(hh, { x: OS[0] - 6, y: OS[1] + 14, r: 10 });
    const ar = G(p, { o: 0 }); path(ar, `M${f1(OS[0] + 40)} ${f1(OS[1] - 40)}V${f1(OS[1] - 130)}M${f1(OS[0] + 28)} ${f1(OS[1] - 116)}L${f1(OS[0] + 40)} ${f1(OS[1] - 132)}L${f1(OS[0] + 52)} ${f1(OS[1] - 116)}`, { stroke: TRC, 'stroke-width': 6 }); show(ar, m('st', 2));
    infoCard(p, 800, 90, 760, 300, 'сидя или лёжа', 'пальцы сцеплены за шеей, локтевые края кистей — под затылком и сосцевидными отростками; мягко приподнять голову; положение головы — для точности; прерывисто или с удержанием, несколько раз в день', TRC, m('st'), { size: 20 });
    infoCard(p, 800, 410, 760, 210, 'вес головы достаточен', 'в упражнениях на растяжку шеи; при болезни шеи тянуть голову руками не нужно', COL.bad, m('note'), { size: 20 });
    infoCard(p, 800, 640, 760, 160, 'механическая тракция', 'в клинике и дома; положение, дозу и длительность определяет терапевт', COL.dim, m('mech'), { size: 20 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-trac', prompt: ['Куда придётся тракция?'],
    build: grid([
      { parts: ['Голова сильно согнута'], ans: ['l'], why: 'Чем больше сгибание, тем ниже действие.' },
      { parts: ['Голова почти в нейтрали'], ans: ['h'], why: 'Меньше сгибания — выше в шее.' },
      { parts: ['Пальцы обхватили остистый отросток пятого шейного'], ans: ['l'], why: 'Тракция идёт на сегменты ниже пальцев.' },
      { parts: ['Наклон вбок: на вогнутой стороне корешковые симптомы'], ans: ['c'], why: 'Сближение фасеток и отверстий на вогнутой стороне.' },
      { parts: ['Наклон с поворотом, боль на вогнутой стороне'], ans: ['c'], why: 'Осторожно с наклоном.' },
    ], [['l', 'Ниже в шее', TRC], ['h', 'Выше в шее', THX], ['c', 'Осторожно', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Разгибание груди: лёжа на валике и сидя на стуле, вместе с дыханием.', 'w1'],
     ['Лестничные: голова зафиксирована, верхние рёбра прижаты на вдохе.', 'w2'],
     ['Подзатылочные: кивок при фиксированном втором позвонке или втягивание подбородка с кивком.', 'w3'],
     ['Ручная тракция точна: больше сгибания — ниже действие; вес головы — достаточная сила.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SP }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-thx', prompt: ['У офисного работника круглая спина и тугие грудные мышцы. Что дать на дом?'],
    build: choice([
      ['Лёжа на продольном валике: руки вверх, затем «девяносто на девяносто», с дыханием'],
      ['Сгибание шеи с грузом'],
      ['Скручивания туловища лёжа'],
      ['Только тракцию шеи у терапевта'],
    ], 0, 'Валик вдоль позвоночника разгибает грудной отдел, а «девяносто на девяносто» растягивает большую грудную и подлопаточную.',
    [null, 'Это не растяжка и опасно для шеи.', 'Скручивания сгибают, а нужно разгибание груди.', 'Нужна самостоятельная растяжка.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-sca', prompt: ['Растяжка тугой правой лестничной мышцы. Что делает терапевт?'],
    build: choice([
      ['Голова в осевом вытяжении, наклоне влево и повороте вправо; на вдохе прижимает верхние рёбра справа'],
      ['Тянет голову вверх изо всех сил'],
      ['Давит на нижнюю челюсть'],
      ['Наклоняет голову вправо'],
    ], 0, 'Голову фиксируют, а сила приложена к верхним рёбрам; наклон — в другую сторону, поворот — к мышце.',
    [null, 'Нужна фиксация головы, а не сильная тяга.', 'Челюсть не трогают.', 'Наклон в сторону мышцы её укорачивает.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
