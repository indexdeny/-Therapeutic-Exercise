const CHAPTER = { number: 147, title: 'Шея: манипуляции и мышечная энергия', minutes: 8, language: 'ru', next: '../ch148/' };
// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch147/cards.ru.json

// cards-short end

const SP = '#8fd6b0', MAN = '#86c9e8', ME = '#f0c060', PAIN = '#ff5a3c', PIL = '#c8b8e8';
const GR = ['#9fd0e8', '#86c9e8', '#c9b8e8', '#bba8ee', '#ff6b5a'];
const BN = ANAT.bone, BL = mix(ANAT.bone, '#000000', .45);
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : x + (right ? 8 : -8);
  path(g, `M${lx} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
function numLine(p, n, str, x, y, col, t0, { size = 19, maxW = 640 } = {}) {
  const g = G(p, { o: 0 });
  mk('circle', { cx: x + 16, cy: y - 7, r: 15, fill: col }, g);
  T(g, String(n), { x: x + 16, y: y, size: 18, weight: 700, fill: COL.board, anchor: 'middle' });
  put(para(g, str, x + 44, y, null, { size, maxW }), { o: 1 });
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const swing = (q, n) => Math.sin(2 * Math.PI * n * q);
const f1 = v => v.toFixed(1);
const thumb = (p, t0) => { const g = G(p, { o: 0 }); mk('ellipse', { rx: 14, ry: 22, fill: mix(ANAT.skin, '#c08060', .3), stroke: BL, 'stroke-width': 2 }, g); if (t0 !== null) show(g, t0); return g; };
const arw = (p, x1, y1, x2, y2, col, t0, w = 6) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 14, g = G(p, { o: 0 }); path(g, `M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}M${f1(x2 - h * Math.cos(a - .5))} ${f1(y2 - h * Math.sin(a - .5))}L${f1(x2)} ${f1(y2)}L${f1(x2 - h * Math.cos(a + .5))} ${f1(y2 - h * Math.sin(a + .5))}`, { stroke: col, 'stroke-width': w }); if (t0 !== null) show(g, t0); else put(g, { o: 1 }); return g; };
// A cervical facet joint from the side: the upper articular pillar slides along a 45° plane over the lower one;
// set(u): u > 0 — up-glide, u < 0 — down-glide; the foramen on that side opens or narrows.
function facet45(p, x, y, s, t0) {
  const g = G(p, { x, y, s, o: 0 }), bone = { fill: BN, stroke: BL, 'stroke-width': 2.5, 'stroke-linejoin': 'round' };
  path(g, 'M-170 120L170 -120', { stroke: COL.dim, 'stroke-width': 2, 'stroke-dasharray': '7 6' });
  mk('path', { d: 'M-150 130L110 -54L150 30L150 150L-150 150Z', ...bone }, g);
  mk('path', { d: 'M-128 116L108 -50', stroke: CART, 'stroke-width': 8, fill: 'none', 'stroke-linecap': 'round' }, g);
  const up = G(g, {});
  mk('path', { d: 'M-110 74L150 -110L150 -150L-150 -150L-150 40Z', ...bone }, up);
  mk('path', { d: 'M-104 64L132 -102', stroke: CART, 'stroke-width': 8, fill: 'none', 'stroke-linecap': 'round' }, up);
  const fo = mk('ellipse', { cx: -60, cy: 210, rx: 40, ry: 26, fill: '#101a17', stroke: BL, 'stroke-width': 2 }, g);
  T(g, 'отверстие', { x: -60, y: 268, size: 17, fill: COL.dim, weight: 600, anchor: 'middle' });
  const e = { g, set: u => { const d = 40 * u; up.setAttribute('transform', `translate(${f1(d * .82)} ${f1(-d * .58)})`); fo.setAttribute('rx', f1(40 + 16 * u)); fo.setAttribute('ry', f1(26 + 12 * u)); return e; } };
  e.set(0);
  if (t0 !== null) show(g, t0);
  return e;
}
// A vertebra seen from above (front up) for rotation, and a head from above with the nose.
function vertTop(p, x, y, s, t0) {
  const g = G(p, { x, y, s, o: 0 }), v = G(g, {}), bone = { fill: BN, stroke: BL, 'stroke-width': 2.2, 'stroke-linejoin': 'round' };
  mk('ellipse', { cx: 0, cy: -30, rx: 46, ry: 32, ...bone }, v);
  mk('path', { d: 'M-30 0L-90 -6L-96 12L-40 24L-14 70L0 96L14 70L40 24L96 12L90 -6L30 0Z', ...bone }, v);
  mk('ellipse', { cx: 0, cy: 22, rx: 18, ry: 14, fill: '#101a17', stroke: BL, 'stroke-width': 1.5 }, v);
  T(g, 'вперёд ↑', { x: 0, y: -84, size: 15, fill: COL.dim, anchor: 'middle', weight: 600 });
  const e = { g, v, set: r => { v.setAttribute('transform', `rotate(${f1(r)})`); return e; } };
  if (t0 !== null) show(g, t0);
  return e;
}
function headTop(p, x, y, s, t0) {
  const g = G(p, { x, y, s, o: 0 }), h = G(g, {});
  mk('ellipse', { cx: 0, cy: 0, rx: 80, ry: 96, fill: ANAT.skin, stroke: BL, 'stroke-width': 2.5 }, h);
  mk('path', { d: 'M-14 -94L0 -122L14 -94Z', fill: ANAT.skin, stroke: BL, 'stroke-width': 2 }, h);
  [-1, 1].forEach(k => mk('ellipse', { cx: k * 82, cy: 0, rx: 10, ry: 22, fill: ANAT.skin, stroke: BL, 'stroke-width': 2 }, h));
  const e = { g, h, set: r => { h.setAttribute('transform', `rotate(${f1(r)})`); return e; } };
  if (t0 !== null) show(g, t0);
  return e;
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Манипуляции на шее', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });

    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'степени, противопоказания, скольжения фасеток, мягкие изометрические приёмы', 800, 360, m('sub'), { size: 28, fill: SP, anchor: 'middle', weight: 600 });

    T(v, 'V · толчок', { x: gx(.86) - 14, y: yv + 7, size: 21, fill: GR[4], weight: 700, anchor: 'end' });
    show(v, m('g5'));
    [['I–II: боль', MAN], ['III–IV: объём', '#bba8ee'], ['V: объём, один раз', GR[4]]].forEach(([s, c], i) => pill(p, s, 200 + i * 210, 700, m(['g2', 'g4', 'g5'][i], 1), { col: c, size: 17 }));
    pill(p, 'по мотивам главы 5 · схема', 400, 770, m('use'), { col: COL.dim, size: 15 });
    infoCard(p, 800, 90, 760, 190, 'зачем и сколько', 'уменьшить боль и улучшить движение; все, кроме толчка, — одна–две минуты, затем переоценка; закончить при результате или по переносимости', MAN, m('use'), { size: 19 });
    infoCard(p, 800, 295, 760, 120, 'I и II', 'малые и большие колебания от боли, обычно в острой стадии', GR[1], m('g1'), { size: 19 });
    infoCard(p, 800, 430, 760, 140, 'III', 'большие колебания до барьера — для объёма; подострая и хроническая стадии', GR[2], m('g3'), { size: 19 });
    infoCard(p, 800, 585, 760, 120, 'IV', 'малые колебания через барьер — только хроническая стадия', GR[3], m('g4'), { size: 19 });
    infoCard(p, 800, 720, 760, 150, 'V — толчок', 'высокая скорость, малая амплитуда на физиологическом пределе; один раз и только ради объёма', GR[4], m('g5'), { size: 19 });
  }],

  ['prec', 'Предосторожности', (m, D) => {
    const p = panel(0);
    txt(p, 'когда остановиться и когда нельзя', 800, 56, m('pre'), { size: 28, weight: 700, anchor: 'middle', fill: PAIN });
    const stop = G(p, { x: 400, y: 330, o: 0 });

    pill(p, 'крайняя осторожность: кортикостероиды, очень сильная боль', 400, 790, m('pre', 9), { col: COL.task, size: 17 });
    infoCard(p, 800, 90, 760, 780, 'противопоказания', '', COL.bad, m('ci'));
    ['несросшийся перелом', 'разболтанность суставов или связок после травмы или при системных болезнях — например, ревматоидном артрите', 'болезнь или закупорка позвоночной артерии', 'острое воспаление или раздражение сустава', 'симптомы конского хвоста'].forEach((s, i) => numLine(p, i + 1, s, 830, 210 + i * 120, COL.bad, m('ci', 1 + i * 1.5), { size: 21, maxW: 660 }));
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-grade', prompt: ['Какая это степень?'],
    build: grid([

      { parts: ['Большие колебания до барьера в подострой стадии'], ans: ['3'], why: 'Третья степень.' },
      { parts: ['Малые колебания через барьер, хроническая стадия'], ans: ['4'], why: 'Четвёртая степень.' },
      { parts: ['Однократный быстрый толчок на пределе'], ans: ['5'], why: 'Пятая степень — толчок.' },
      { parts: ['Большие колебания от боли'], ans: ['2'], why: 'Вторая степень.' },
    ], [['1', 'I', GR[0]], ['2', 'II', GR[1]], ['3', 'III', GR[2]], ['4', 'IV', GR[3]], ['5', 'V', GR[4]]], { multi: false, text: true }),
  }], done) }],

  ['prone', 'Лёжа на животе', (m, D) => {
    const p = panel(0);
    txt(p, 'лёжа на животе: сгибание, разгибание, поворот', 800, 56, m('pos'), { size: 28, weight: 700, anchor: 'middle', fill: MAN });
    matLine(p, 80, 760, 300, m('pos'));
    const f = lieFig(p, 100, 300, .5, m('pos'), 'prone', { cerv: 28 });
    const cl = f.unit(15, 40); show(mk('ellipse', { cx: f1(cl[0]), cy: 288, rx: 40, ry: 12, fill: PIL, stroke: mix(PIL, '#000000', .35), 'stroke-width': 2, opacity: 0 }, p), m('pos', 1));
    txt(p, 'подушка под ключицы', 560, 340, m('pos', 1), { size: 17, fill: PIL, anchor: 'middle', weight: 600 });
    // the segment in close-up: thumbs on the spinous process of the upper vertebra
    const X = 430, Y = 640, S = .9, sg = spineSeg(p, X, Y, S, m('pos', 4), { ligs: false });

    prog(q => sg.set({ flex: 8 * cyc(q, 2) }), m('fl', 1.5), 5, lin);
    const fx = G(p, { o: 0 }); arw(fx, SPU[0] - 110, SPU[1] - 40, SPU[0] - 110, SPU[1] + 30, ME, null); show(fx, m('ex', 1));
    prog(q => sg.set({ flex: -8 * cyc(q, 2) }), m('ex', 1.5), 4, lin);
    const vt = vertTop(p, 670, 660, .62, m('rot'));
    const tp = thumb(p, m('rot', 1)); put(tp, { x: 670 + 76 * .62, y: 660 - 8, r: 90 });

    infoCard(p, 800, 315, 760, 180, 'сгибание', 'терапевт сбоку лицом к голове; два больших пальца на остистом отростке — сдвиг к голове и вперёд', MAN, m('fl'), { size: 19 });

  ['sup', 'Скольжения фасеток', (m, D) => {

  ['me', 'Мышечная энергия', (m, D) => {

    let d = `M${X0} ${Y0 - 120}`;
    for (let i = 0; i < 4; i++) { const a = gx(i * .25), b = gx(i * .25 + .14), c = gx((i + 1) * .25), yy = Y0 - 120 - i * 60; d += `L${f1(b)} ${yy}L${f1(c)} ${yy - 60}`; const box = mk('rect', { x: a, y: Y0 - 380, width: b - a, height: 380, fill: ME, 'fill-opacity': .12, opacity: 0 }, p); show(box, m('def', 4 + i * 1.6)); }

    infoCard(p, 800, 90, 760, 330, 'что это', 'мягкие неполные изометрические сокращения мышц, чья тяга даёт нужное дополнительное движение; удержание против дозированного сопротивления 3–5 с, затем расслабление; 3–5 повторов; безопасно и подходит на любой стадии заживления', ME, m('def'), { size: 20 });

    infoCard(p, 800, 355, 760, 280, 'вариант 2', 'терапевт сидит, предплечья на столе; второй шейный — между большим и указательным; пассивный кивок до натяжения; пациент поднимает глаза вверх, 3–5 с, расслабился — новый объём; 3–5 раз', ME, m('f2'), { size: 19 });

  ['wrap', 'Итоги', (m) => {

     ['Скольжение фасетки вверх расширяет отверстие на своей стороне, вниз — сужает.', 'w3'],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
