const SP = '#8fd6b0', FLX = '#f0a04b', EXT = '#86c9e8', LAT = '#c9b8e8', TRC = '#f0c060', PIL = '#c8b8e8', PAIN = '#ff5a3c';
const BN = ANAT.bone, BL = mix(ANAT.bone, '#000000', .45);
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : x + (right ? 8 : -8);
  path(g, `M${lx} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
// Hands and knees: the prone posture figure with its knees on the mat (line FY) and the hands planted where they
// first land; q.set(o) re-poses the trunk and hips and keeps the hands on the floor.
function quadFig(p, x, FY, s, t0, pose = {}) {
  const f = lieFig(p, x, FY, s, t0, 'prone', {});
  f.set({ thigh: -90, shank: 0, tilt: -10, ft: 90 });
  const K = f.at('knee'), s0 = st(f.g); put(f.g, { y: s0.y + (FY - 36 * s - K[1]) });
  const W = [f.geo.K[0] + 28, f.geo.Sh[1] - 10];
  f.qset = o => { f.set(o); f.set(armIK(f.q, W, 180)); return f; };
  f.qset(pose);
  return f;
}
const ROCK = { thigh: -150, tilt: -22, lord: 0, kyph: 48, cerv: 44 }, QUAD = { thigh: -90, tilt: -10, lord: 46, kyph: 42, cerv: 34 };
const mixPose = (a, b, k) => { const o = {}; for (const key in b) o[key] = lerp(a[key], b[key], k); return o; };
// The spine drawn on a back-view figure (as in lesson 132): set({ lum, tho }) bends a lumbar and a thoracic curve;
// side(k, col, t) — a band along the curve on one side (k −1 left, +1 right).
function backSpine(fs, t0) {
  const g = G(fs.top, { o: 0 }), N = 22, vs = [];
  const line = path(g, '', { stroke: BN, 'stroke-width': 3, 'stroke-opacity': .5 });
  for (let i = 0; i < N; i++) vs.push(mk('rect', { x: -7, y: -5, width: 14, height: 10, rx: 3, fill: BN, stroke: BL, 'stroke-width': 1.2 }, g));
  const S = { lum: 0, tho: 0 }, e = { g };
  const at = u => {
    const P = fs.pts.P, C = fs.pts.Sc, top = [C[0], C[1] - 26];
    let dx = 0;
    if (u < .34) dx = S.lum * Math.sin(Math.PI * u / .34);
    else if (u < .86) dx = S.tho * Math.sin(Math.PI * (u - .34) / .52);
    return [lerp(P[0], top[0], u) + dx, lerp(P[1] - 8, top[1], u)];
  };
  e.set = o => {
    Object.assign(S, o);
    const pts = []; for (let i = 0; i <= N; i++) pts.push(at(i / N));
    line.setAttribute('d', 'M' + pts.map(P => f1(P[0]) + ' ' + f1(P[1])).join('L'));
    vs.forEach((v, i) => { const A = pts[i], B = pts[i + 1], a = Math.atan2(B[0] - A[0], A[1] - B[1]) * 180 / Math.PI; v.setAttribute('transform', `translate(${f1((A[0] + B[0]) / 2)} ${f1((A[1] + B[1]) / 2)}) rotate(${f1(a)})`); });
    return e;
  };
  e.side = (k, col, t, u0 = .34, u1 = .86) => {
    const b = path(g, '', { stroke: col, 'stroke-width': 6, 'stroke-opacity': .85 }, { o: 0 });
    let d = ''; for (let i = 0; i <= 20; i++) { const P = at(lerp(u0, u1, i / 20)); d += (i ? 'L' : 'M') + f1(P[0] + k * 11) + ' ' + f1(P[1]); }
    b.setAttribute('d', d);
    show(b, t);
    return b;
  };
  e.at = u => fs.at(at(u));
  e.set({});
  if (t0 !== null) show(g, t0);
  return e;
}
