const SP = '#8fd6b0', MAN = '#86c9e8', THR = '#ff6b5a', RIB = '#f0c060', LUM = '#c9b8e8', SI = '#8fd6b0', BR = '#9fd0e8';
const BN = ANAT.bone, BL = mix(ANAT.bone, '#000000', .45), SKN = mix(ANAT.skin, '#c08060', .3);
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : x + (right ? 8 : -8);
  path(g, `M${lx} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
function numLine(p, n, str, x, y, col, t0, { size = 19, maxW = 640 } = {}) {
  const g = G(p, { o: 0 });
  mk('circle', { cx: x + 16, cy: y - 7, r: 15, fill: col }, g);
  T(g, String(n), { x: x + 16, y: y, size: 18, weight: 700, fill: COL.board, anchor: 'middle' });
  put(para(g, str, x + 44, y, null, { size, maxW }), { o: 1 });
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const swing = (q, n) => Math.sin(2 * Math.PI * n * q);
const f1 = v => v.toFixed(1);
const arw = (p, x1, y1, x2, y2, col, t0, w = 6) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 14, g = G(p, { o: 0 }); path(g, `M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}M${f1(x2 - h * Math.cos(a - .5))} ${f1(y2 - h * Math.sin(a - .5))}L${f1(x2)} ${f1(y2)}L${f1(x2 - h * Math.cos(a + .5))} ${f1(y2 - h * Math.sin(a + .5))}`, { stroke: col, 'stroke-width': w }); if (t0 !== null) show(g, t0); else put(g, { o: 1 }); return g; };
const tip = (p, x, y, t0, col = SKN, r = 13) => { const g = G(p, { x, y, o: 0 }); mk('circle', { r, fill: col, stroke: BL, 'stroke-width': 2 }, g); if (t0 !== null) show(g, t0); return g; };
// Two thoracic vertebrae seen from behind (schematic): spinous processes in the middle, transverse processes to the
// sides; e.tp(i, k) — the stage point of the transverse process of vertebra i (0 upper, 1 lower) on side k (−1 viewer's
// left = patient's left, +1 right); set(r) rotates the upper vertebra (seen as a shift of its spinous process).
function backPair(p, x, y, s, t0, names = ['T6', 'T7']) {
  const g = G(p, { x, y, s, o: 0 }), bone = { fill: BN, stroke: BL, 'stroke-width': 2.2, 'stroke-linejoin': 'round' }, vs = [];
  [0, 1].forEach(i => {
    const v = G(g, { y: i * 150 });
    mk('path', { d: 'M-150 -14L-60 -24L-30 -40H30L60 -24L150 -14L150 14L60 6L30 30H-30L-60 6L-150 14Z', ...bone }, v);
    mk('path', { d: 'M-16 10L-12 80L12 80L16 10Z', ...bone }, v);
    T(v, names[i], { x: -200, y: 8, size: 20, fill: COL.dim, weight: 700, anchor: 'end' });
    vs.push(v);
  });
  T(g, 'вид сзади: слева — левая сторона пациента', { x: 0, y: -80, size: 16, fill: COL.dim, anchor: 'middle', weight: 600 });
  const e = { g, tp: (i, k) => { const s0 = st(g); return [s0.x + k * 120 * s0.s, s0.y + (i * 150) * s0.s]; }, set: r => { vs[0].setAttribute('transform', `translate(0 0) rotate(${f1(r)})`); return e; } };
  if (t0 !== null) show(g, t0);
  return e;
}
// A breathing trace: volume over time, three or four breaths; win(i, a, b, col, t0) shades a window in breath i.
function breath(p, x, y, w, h, n, t0) {
  const g = G(p, { o: 0 }), pts = [];
  for (let i = 0; i <= 120; i++) { const u = i / 120; pts.push([x + w * u, y - h * (1 - Math.cos(2 * Math.PI * n * u)) / 2]); }
  path(g, 'M' + pts.map(P => f1(P[0]) + ' ' + f1(P[1])).join('L'), { stroke: BR, 'stroke-width': 4 });
  path(g, `M${x} ${y + 10}H${x + w}`, { stroke: COL.dim, 'stroke-width': 2 });
  T(g, 'вдох ↑', { x: x - 10, y: y - h + 6, size: 15, fill: COL.dim, anchor: 'end', weight: 600 });
  T(g, 'выдох ↓', { x: x - 10, y: y + 6, size: 15, fill: COL.dim, anchor: 'end', weight: 600 });
  if (t0 !== null) show(g, t0);
  const e = { g, win: (i, a, b, col, t1) => { const bw = w / n, r = mk('rect', { x: x + bw * (i + a), y: y - h - 10, width: bw * (b - a), height: h + 20, fill: col, 'fill-opacity': .25, stroke: col, 'stroke-width': 2, opacity: 0 }, p); show(r, t1); return r; }, xAt: (i, u) => x + w / n * (i + u) };
  return e;
}

const BEATS = [
  ['intro', 'Манипуляции на туловище', (m, D) => {

    const GY = 860, pt = fig(p, { x: 600, y: GY - 182 * .55, s: .55, o: 0, pose: { ...STAND, aN: 40, eN: 110 } }), tt = fig(p, { x: 560, y: GY - 182 * .55, s: .55, o: 0, col: '#b9c9dc', pose: { ...STAND } });
