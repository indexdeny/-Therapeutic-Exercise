}
function numLine(p, n, str, x, y, col, t0, { size = 19, maxW = 640 } = {}) {

  e.set(v0);

}
const trBelt = (p, f, t0, k = 22, ry = 40) => { const B = f.unit(2.5, k), e = mk('ellipse', { cx: f1(B[0]), cy: f1(B[1]), rx: 18, ry, fill: 'none', stroke: DEEP, 'stroke-width': 6, opacity: 0 }, p); show(e, t0); return e; };
// The waist from the front: drawing-in narrows it, bracing widens it to the sides.
function waist(p, x, y, s, t0) {
  const g = G(p, { x, y, s, o: 0 }), body = mk('path', { fill: ANAT.skin, stroke: BL, 'stroke-width': 2.5 }, g);

  e.set(0);

}

    pillRow(p, ['20 → 22 → 24 … 30', 'держать 10 с', 'выносливость — до 10 удержаний'], 400, 820, [m('cuff', 4), m('cuff', 8), m('cuff', 14)], { col: CUFF, size: 16, space: 8 });
    infoCard(p, 800, 90, 760, 160, 'осевое вытяжение', 'кивок головы + лёгкое уплощение шейного лордоза и верхнегрудного кифоза', KIN, m('ax'), { size: 19 });
    infoCard(p, 800, 265, 760, 200, 'глубокие сгибатели', 'лёжа, медленный кивок «да»; голова выдвинута — полотенце под затылок; пальцами проверить: работает длинная мышца шеи, грудино-ключично-сосцевидная в покое', KIN, m('nod'), { size: 19 });
    infoCard(p, 800, 480, 760, 210, 'индекс выполнения', 'прирост давления × число 10-секундных удержаний; максимум 100 (10 × 10); Джулл: правильный кивок — до 30 мм рт. ст.; у 50 здоровых высокая повторяемость теста', CUFF, m('idx'), { size: 19 });
    infoCard(p, 800, 705, 760, 165, 'разгибатели', 'лёжа на животе, лоб на столе: чуть оторвать лоб, подбородок втянут, взгляд в стол', GLOB, m('ext'), { size: 19 });
  }],

  ['lumb', 'Втягивание живота', (m, D) => {
    const p = panel(0);
    txt(p, 'поясница: втягивание живота', 800, 56, m('three'), { size: 28, weight: 700, anchor: 'middle', fill: DEEP });
    const w1 = waist(p, 170, 280, .8, m('three', 1)), w2 = waist(p, 420, 280, .8, m('three', 2.5));
    prog(q => w1.set(-cyc(q, 2)), m('three', 3), 5, lin);
    prog(q => w2.set(cyc(q, 2)), m('three', 4), 5, lin);
    pill(p, 'втягивание', 170, 420, m('three', 1), { col: DEEP, size: 17 });
    pill(p, '«корсет»', 420, 420, m('three', 2.5), { col: GLOB, size: 17 });
    const pt = postureFig(p, 640, 470, .3, m('three', 4)); prog(q => pt.set({ tilt: -10 * cyc(q, 2), lord: 46 - 26 * cyc(q, 2) }), m('three', 5), 5, lin);
    pill(p, 'наклон таза назад', 640, 500, m('three', 4), { col: KIN, size: 15 });
    pillRow(p, ['на четвереньках — легче', 'лёжа, колени 70–90°', 'на животе', 'полулёжа', '→ сидя и стоя'], 400, 560, m('pos'), { col: STB, size: 14, space: 6, gap: 1 });
    // prone on a cuff: the pressure drops 6–10 mm Hg
    matLine(p, 60, 760, 790, m('fb'));
    const f = lieFig(p, 80, 790, .5, m('fb'), 'prone');
    const U = f.unit(1.5, 50); const cuff = mk('rect', { x: U[0] - 60, y: 776, width: 120, height: 14, rx: 6, fill: CUFF, stroke: mix(CUFF, '#000000', .4), 'stroke-width': 2, opacity: 0 }, p); p.insertBefore(cuff, f.g); show(cuff, m('fb'));
    const gg = gauge(p, 640, 690, 70, 50, 80, m('fb', 2));
    prog(q => gg.set(70 - 8 * Math.min(1, q * 3)), m('fb', 5), 4);
    infoCard(p, 800, 90, 760, 200, 'три способа', 'втягивание, «корсет», наклон таза назад; втягивание избирательнее всего включает поперечную и многораздельную, улучшает упреждение и повышает давление в животе', DEEP, m('three'), { size: 19 });
    infoCard(p, 800, 305, 760, 140, 'прощупать', 'чуть ниже передней верхней ости, снаружи от прямой: косая — выпуклость, поперечная — плоское натяжение', DEEP, m('palp'), { size: 19 });
    infoCard(p, 800, 460, 760, 230, 'как', 'вдох, выдох — мягко подтянуть пупок к позвоночнику и дышать дальше; без наклона таза, без движения рёбер, без выпячивания живота и давления стопами; в нейтрали — сильнее, чем сутулясь', DEEP, m('how'), { size: 19 });
    infoCard(p, 800, 705, 760, 165, 'обратная связь', 'на животе, манометр 70 мм рт. ст. — падение на 6–10; держать до 10 с, до 10 раз; датчики на прямой и косой — почти тихо', CUFF, m('fb'), { size: 18 });
  }],

  ['brace', '«Корсет» и наклон таза', (m, D) => {
    const p = panel(0);
    txt(p, '«корсет» и наклон таза назад', 800, 56, m('br'), { size: 28, weight: 700, anchor: 'middle', fill: GLOB });
    const w = waist(p, 300, 420, 1.1, m('br'));
    prog(q => w.set(.9 * q), m('br', 1), 1.5);
    const obl = G(p, { o: 0 }); [-1, 1].forEach(k => path(obl, `M${300 + k * 60} 300L${300 + k * 100} 520`, { stroke: GLOB, 'stroke-width': 10, 'stroke-opacity': .7, 'stroke-linecap': 'round' })); show(obl, m('br', 6));
    txt(p, 'косые — глобальная роль', 300, 620, m('br', 6), { size: 19, fill: GLOB, anchor: 'middle', weight: 700 });
    pill(p, '10 лет: напрягать живот в делах — лучше', 300, 680, m('br', 12), { col: SP, size: 17 });
    const f = postureFig(p, 640, 860, .5, m('ppt'));
    f.mus('rectus', { w: 11 });
    prog(q => f.set({ tilt: -12 * cyc(q, 2), lord: 46 - 28 * cyc(q, 2) }), m('ppt', 1), 6, lin);
    txt(p, 'прямая мышца живота', 640, 880 - 6, m('ppt', 2), { size: 16, fill: GLOB, anchor: 'middle', weight: 700 });
    infoCard(p, 800, 90, 760, 330, '«корсет»', 'напрячь живот так, чтобы талия расширилась в стороны — без сгибания, подъёма рёбер, выпячивания и давления стопами, дыхание спокойное; включает косые мышцы; в десятилетнем наблюдении частое напряжение в течение дня — лучше исход', GLOB, m('br'), { size: 19 });
    infoCard(p, 800, 440, 760, 280, 'наклон таза назад', 'включает в основном прямую мышцу — поверхностную, без сегментарных креплений; для стабилизации не выделяют, но он помогает почувствовать таз и найти нейтраль', KIN, m('ppt'), { size: 19 });
  }],

  ['mf', 'Многораздельная', (m, D) => {
    const p = panel(0);
    txt(p, 'многораздельная мышца: «надуть» под пальцами', 800, 56, m('palp'), { size: 28, weight: 700, anchor: 'middle', fill: STB });
    const fs = frontStand(p, 330, 880, 1.15, m('palp'), { muscles: false });
    txt(p, 'вид сзади', 330, 380, m('palp'), { size: 17, fill: COL.dim, anchor: 'middle', weight: 600 });
    const P = fs.pts.P, pts = [[-14, -30], [14, -30], [-14, -54], [14, -54], [-14, -78], [14, -78]].map(([dx, dy]) => fs.at([P[0] + dx, P[1] + dy]));
    const bumps = pts.map(([x, y]) => mk('ellipse', { cx: f1(x), cy: f1(y), rx: 9, ry: 12, fill: DEEP, 'fill-opacity': .6, stroke: DEEP, 'stroke-width': 2, opacity: 0 }, p));
    bumps.forEach((b, i) => show(b, m('sw', i * .2)));
    prog(q => bumps.forEach(b => b.setAttribute('rx', f1(9 + 6 * cyc(q, 2)))), m('sw', 2), 5, lin);
    pts.forEach(([x, y], i) => { const t = mk('circle', { cx: f1(x + (i % 2 ? 16 : -16)), cy: f1(y), r: 8, fill: SKN, stroke: BL, 'stroke-width': 1.5, opacity: 0 }, p); show(t, m('palp', 2)); });
    // sitting self-check: lean forward a couple of degrees
    const sf = postureFig(p, 640, 860, .4, m('selfp'), { pose: { shank: 0, thigh: -90, arm: -30, elb: 100 } });
    prog(q => sf.set({ tilt: 4 * q }), m('selfp', 6), 1);
    txt(p, 'сидя: наклон на пару градусов', 640, 880 - 6, m('selfp', 6), { size: 15, fill: STB, anchor: 'middle', weight: 700 });
    infoCard(p, 800, 90, 760, 200, 'прощупать', 'лёжа на животе или на боку: пальцы сразу снаружи от остистых отростков поясницы; сравнить уровни и стороны', STB, m('palp'), { size: 19 });
    infoCard(p, 800, 305, 760, 200, '«надуть» мышцу', 'помогают втягивание живота и мягкое напряжение тазового дна; на боку — лёгкое сопротивление грудной клетке или тазу на вращение', DEEP, m('sw'), { size: 19 });
    infoCard(p, 800, 520, 760, 180, 'самоконтроль', 'сидя, найти нейтраль, пальцы вдоль остистых, наклон вперёд на пару градусов — мышца включается; не путать с натяжением апоневроза разгибателей', STB, m('selfp'), { size: 19 });
    infoCard(p, 800, 715, 760, 155, 'дальше', 'тренировать в течение дня и соединять с глобальной стабилизацией под нагрузкой', SP, m('next'), { size: 19 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-drawin', prompt: ['Правильное втягивание или замена?'],
    build: grid([
      { parts: ['Таз наклоняется назад'], ans: ['s'], why: 'Замена — таз должен стоять.' },
      { parts: ['Талия мягко втягивается, дыхание спокойное'], ans: ['o'], why: 'Правильно.' },
      { parts: ['Нижние рёбра расходятся'], ans: ['s'], why: 'Замена.' },
      { parts: ['Давление манометра под животом падает на 8 мм'], ans: ['o'], why: 'Правильно: падение на 6–10.' },
      { parts: ['Стопы давят в мат'], ans: ['s'], why: 'Замена.' },
    ], [['o', 'Правильно', COL.good], ['s', 'Замена', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Стабилизация — моторное обучение: осознание, простые движения, сложные, автоматизм.', 'w1'],
     ['Семь правил: от нейтрали и глубоких мышц к нагрузке, выносливости, ритмической стабилизации, переходам и неустойчивой опоре.', 'w2'],
     ['Шея: кивок с манометром 20–30 мм рт. ст. по 10 секунд.', 'w3'],
     ['Поясница: втягивание с падением давления на 6–10 и «надувание» многораздельной.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SP }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-idx', prompt: ['Пациент держит кивком 24 мм рт. ст. десять секунд, на 26 включается грудино-ключично-сосцевидная; 24 мм он удерживает шесть раз. Индекс выполнения?'],
    build: blanks([
      { parts: ['Прирост: 24 − 20 = ', { box: '4' }, ' мм рт. ст.'], why: 'Исходное давление — 20.' },
      { parts: ['Индекс: прирост × удержания = ', { box: '24' }], why: '4 × 6 = 24 из 100 возможных.' },
    ]),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-sub', prompt: ['При втягивании пациентка выпячивает живот и упирается стопами. Что сделать?'],
    build: choice([
      ['Объяснить заново, прощупать поперечную у передней ости, дать манометр, начать на четвереньках'],
      ['Сильнее напрягать пресс'],
      ['Перейти к скручиваниям'],
      ['Наклонять таз назад'],
    ], 0, 'Это замены; помогают объяснение, пальпация, обратная связь и положение на четвереньках.',
    [null, 'Нужна мягкая избирательная работа, а не сила.', 'Динамика — позже.', 'Наклон таза — тоже замена.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
