// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch151/cards.ru.json

const SP = '#8fd6b0', FLX = '#86c9e8', EXT = '#f4a48c', BALL = '#9fb8c8', PH = ['#f4a48c', '#f0c060', '#8fd6b0'], RES = '#c9b8e8';
const BN = ANAT.bone, BL = mix(ANAT.bone, '#000000', .45);
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : x + (right ? 8 : -8);
  path(g, `M${lx} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
const sitPose = { shank: 0, thigh: -90, arm: 12, elb: 60 };
function sitFig(p, x, gy, s, t0, pose = {}, { chairBack = true } = {}) {
  const f = postureFig(p, x, gy, s, t0, { pose: { ...sitPose, ...pose } });
  const H = f.at('hip');
  const ch = path(p, `M${f1(H[0] - 70 * s)} ${f1(H[1] + 34 * s)}H${f1(H[0] + 40 * s)}M${f1(H[0] - 60 * s)} ${f1(H[1] + 34 * s)}V${gy}M${f1(H[0] + 30 * s)} ${f1(H[1] + 34 * s)}V${gy}` + (chairBack ? `M${f1(H[0] - 66 * s)} ${f1(H[1] + 34 * s)}V${f1(H[1] - 200 * s)}` : ''), { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 });
  p.insertBefore(ch, f.g);
  if (t0 !== null) show(ch, t0);
  return f;
}
// Seated on a gym ball: the figure's buttocks on top of the ball.
function ballFig(p, x, gy, s, t0, pose = {}) {
  const f = postureFig(p, x, gy, s, t0, { pose: { ...sitPose, ...pose } });
  const H = f.at('hip'), r = 114 * s;
  const b = mk('circle', { cx: f1(H[0]), cy: f1(gy - r), r: f1(r), fill: BALL, 'fill-opacity': .55, stroke: BALL, 'stroke-width': 3, opacity: 0 }, p);
  p.insertBefore(b, f.g);
  if (t0 !== null) show(b, t0);
  return f;
}
function quadFig(p, x, FY, s, t0, pose = {}) {
  const f = lieFig(p, x, FY, s, t0, 'prone', {});
  f.set({ thigh: -90, shank: 0, tilt: -10, ft: 90 });
  const K = f.at('knee'), s0 = st(f.g); put(f.g, { y: s0.y + (FY - 36 * s - K[1]) });
  const W = [f.geo.K[0] + 28, f.geo.Sh[1] - 10];
  f.qset = o => { f.set(o); f.set(armIK(f.q, W, 180)); return f; };
  f.qset(pose);
  return f;
}

/* ---------- beats ---------- */

    x = box(3, ts[3], 'сидя на мяче'); ballFig(p, x + 120, 420, .2, ts[3]);
    x = box(4, ts[4], 'стоя у стены');
    show(path(p, `M${x + 60} 150V420M${x + 20} 420H${x + 215}`, { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 }), ts[4]); postureFig(p, x + 110, 420, .2, ts[4]);
    x = box(5, ts[5], 'стоя, неустойчиво');

    infoCard(p, 1080, 540, 460, 330, 'две таблицы', 'акцент на сгибатели — лёжа на спине; на разгибатели — лёжа на животе; мышцы не изолируются — акцент задаёт сила тяжести', SP, m('tab'), { size: 20 });
  }],

    prog(q => f.set({ arm: 90 * cyc(q, 2), elb: 6 }), m('max', 1), 6, lin);
    prog(q => f.set({ arm: 178 * cyc(q, 2), elb: 6 }), m('mod', 1), 6, lin);
    const ph = [['максимальная–умеренная защита', 'сгибание и отведение плеч до 90°, вращение наружу у тела', PH[0], 'max'], ['умеренная–минимальная', 'сгибание и отведение с вращением до конца объёма, диагонали', PH[1], 'mod'], ['минимальная — без защиты', 'тянуться вперёд, в стороны, вверх; толкать, тянуть, поднимать', PH[2], 'min']];

    pillRow(p, ['лёжа', 'сидя', 'на мяче', 'у стены', 'стоя', 'неустойчиво'], 1180, 370, m('sup', 1), { col: SP, size: 16, space: 8, gap: .5 });

    txt(p, 'осанка шеи начинается с таза', 800, 56, m('chain'), { size: 28, weight: 700, anchor: 'middle', fill: SP });
    const f = postureFig(p, 300, 860, .78, m('chain'), { pose: 'round' });
    const steps = [['таз и поясница', { tilt: 0, lord: 46 }, 1], ['грудная клетка приподнята', { kyph: 42 }, 4], ['лопатки удобно сведены', { scap: 0 }, 7], ['осевое вытяжение', { fh: 0 }, 9.5]];
    steps.forEach(([s, o, dt], i) => { f.to(o, m('chain', dt), 1.2); pill(p, s, 610, 300 + i * 60, m('chain', dt), { col: [EXT, '#f0c060', FLX, SP][i], size: 17 }); });
    infoCard(p, 800, 90, 760, 200, 'цепочка', 'таз и поясница → грудь → лопатки → шея; грудная клетка приподнята над тазом, лопатки сведены — тогда шея легко принимает осевое вытяжение', SP, m('chain'), { size: 19 });
    infoCard(p, 800, 305, 760, 170, 'порядок', 'при необходимости начать с контроля таза, затем разгибание груди и сведение лопаток; во время движений рук следить за лопаткой и плечом', FLX, m('order'), { size: 19 });
    infoCard(p, 800, 490, 760, 170, 'одного укрепления мало', 'нужны подкрепление — словом, взглядом, касанием — и изменение окружения (глава 14)', EXT, m('alone'), { size: 19 });
    infoCard(p, 800, 675, 760, 195, 'дальше', 'когда стабилизация держится при разной нагрузке руками — изометрические и динамические упражнения для шеи', RES, m('next'), { size: 19 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-next', prompt: ['Что делать дальше?'],
    build: grid([
      { parts: ['С гантелями голова уходит вперёд'], ans: ['d'], why: 'Потеря нейтрали — уменьшить сопротивление.' },
      { parts: ['30 повторов без потери нейтрали и симптомов'], ans: ['u'], why: 'Добавить сопротивление для силы.' },
      { parts: ['Нейтраль лёжа не удержать'], ans: ['s'], why: 'Маленький валик под шею.' },
      { parts: ['На новом уровне усилились симптомы шеи'], ans: ['d'], why: 'Уменьшить нагрузку.' },
      { parts: ['Сидя стабильно, без симптомов'], ans: ['u'], why: 'Перейти к меньшей опоре.' },
    ], [['u', 'Усложнить', SP], ['d', 'Облегчить', COL.bad], ['s', 'Дать опору', BALL]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Каждое упражнение — с кивка и осевого вытяжения в нейтраль.', 'w1'],
     ['Прогрессия: лёжа → сидя → у стены → стоя → неустойчиво; руки от 90° к полному объёму и диагоналям.', 'w2'],
     ['Потеря нейтрали или симптомы — меньше сопротивления; выносливость — 20–30 повторов или минута.', 'w3'],
     ['Осанка шеи строится снизу: таз, грудь, лопатки.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SP }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-cs', prompt: ['Пациентка с болью в шее уверенно делает лёжа сгибание плеч до 90° с удержанным кивком. Что дальше?'],
    build: choice([
      ['Сгибание и отведение до конца объёма и диагонали, затем сидя'],
      ['Сразу стоя на неустойчивой поверхности с гантелями'],
      ['Вес на голову через блок'],
      ['Отменить упражнения'],
    ], 0, 'Прогрессия по одному шагу: объём рук, затем меньше опоры.',
    [null, 'Слишком большой шаг.', 'Груз на голову противопоказан.', 'Она готова к следующему шагу.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-chain', prompt: ['У пациента голова вперёд, но таз завален назад и грудь опущена. С чего начать работу над осанкой шеи?'],
    build: choice([
      ['С контроля таза и поясницы, затем разгибание груди и сведение лопаток'],
      ['Только с укрепления сгибателей шеи'],
      ['С воротника'],
      ['С растяжки шеи в разгибание'],
    ], 0, 'Осанка шеи строится снизу; одно укрепление позу не исправит.',
    [null, 'Без основы шея не встанет в нейтраль.', 'Пассивная опора — не решение.', 'Проблема начинается ниже.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
