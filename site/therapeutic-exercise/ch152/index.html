const SP = '#8fd6b0', DEEP = '#e0a0c8', CUFF = '#9fc0e0', LV = ['#9fd0e8', '#86c9e8', '#8fd6b0', '#f0c060', '#f0a04b', '#f4a48c'], EXT = '#f4a48c', BALL = '#9fb8c8', QL = '#c9b8e8', PAIN = '#ff5a3c';
const BN = ANAT.bone, BL = mix(ANAT.bone, '#000000', .45);
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : x + (right ? 8 : -8);
  path(g, `M${lx} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
function numLine(p, n, str, x, y, col, t0, { size = 19, maxW = 640 } = {}) {
  const g = G(p, { o: 0 });
  mk('circle', { cx: x + 16, cy: y - 7, r: 15, fill: col }, g);
  T(g, String(n), { x: x + 16, y: y, size: 18, weight: 700, fill: COL.board, anchor: 'middle' });
  put(para(g, str, x + 44, y, null, { size, maxW }), { o: 1 });
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
const dg = 180 / Math.PI;
// Rig-v2 mannequin legs, supine: the knee angle that keeps the heel on the table for hip flexion h, and a flat foot.
const heelK = h => h - Math.asin(clamp((-12 - 92 * Math.sin(h / dg)) / 90, -1, 1)) * dg;
const hookLeg = (h, side) => { const k = heelK(h); return { ['h' + side]: h, ['k' + side]: k, ['f' + side]: k - h - 90 }; };
const HOOK = { ...hookLeg(35, 'N'), ...hookLeg(35, 'F') };
// A pressure gauge v0..v1 mm Hg; set(v).
function gauge(p, x, y, r, v0, v1, t0, { ticks = 4 } = {}) {
  const g = G(p, { x, y, o: 0 }), ang = v => -120 + 240 * (v - v0) / (v1 - v0);
  mk('circle', { r, fill: PANEL, stroke: CUFF, 'stroke-width': 4 }, g);
  for (let i = 0; i <= ticks; i++) { const v = lerp(v0, v1, i / ticks), a = rad(ang(v)); path(g, `M${f1(Math.sin(a) * (r - 6))} ${f1(-Math.cos(a) * (r - 6))}L${f1(Math.sin(a) * (r - 16))} ${f1(-Math.cos(a) * (r - 16))}`, { stroke: COL.dim, 'stroke-width': 2.5 }); T(g, String(Math.round(v)), { x: Math.sin(a) * (r - 32), y: -Math.cos(a) * (r - 32) + 6, size: 14, fill: COL.chalk, weight: 600, anchor: 'middle' }); }
  const zone = path(g, '', { stroke: COL.good, 'stroke-width': 7, 'stroke-opacity': .6 });
  const nd = G(g, {}); path(nd, `M0 8L0 ${-(r - 14)}`, { stroke: PAIN, 'stroke-width': 4 }); mk('circle', { r: 7, fill: COL.chalk }, g);
  const e = { g, set: v => { put(nd, { r: ang(v) }); return e; }, band: (a, b) => { const A = rad(ang(a)), B = rad(ang(b)), R = r - 11; zone.setAttribute('d', `M${f1(Math.sin(A) * R)} ${f1(-Math.cos(A) * R)}A${R} ${R} 0 0 1 ${f1(Math.sin(B) * R)} ${f1(-Math.cos(B) * R)}`); return e; } };
  e.set(v0);
  if (t0 !== null) show(g, t0);
  return e;
}
// The rig mannequin on hands and knees over the mat line FY; hands stay on the floor.
function quadRig(p, x, FY, s, t0) {
  const f = fig(p, { x, y: FY - (92 + 12) * s, s, o: 0, pose: { ...STAND, t: 66, hN: 66, kN: 90, hF: 66, kF: 90, aN: 66, aF: 66, eN: 0, eF: 0, fN: -90, fF: -90 } });
  const Sh = onStage(f, 'Sh'), Wn = [Sh[0] + 4, FY - 28 * s], Wf = [Sh[0], FY - 28 * s];
  f.hands = (n = true, fa = true) => { if (n) reach(f, 'N', ...Wn); if (fa) reach(f, 'F', ...Wf); };
  f.hands();
  if (t0 !== null) show(f.g, t0);
  return f;
}

    const p = panel(0);
    txt(p, 'выносливость, палка на спине, сопротивление, положения', 800, 56, m('endu'), { size: 28, weight: 700, anchor: 'middle', fill: SP });
    const ld = G(p, { o: 0 }); show(ld, m('endu', 1));
    [['уровень, где нейтраль держится', SP], ['наращивать повторы или время', SP], ['минута получилась → вес, меньше повторов', LV[4]], ['следующий уровень — снова выносливость', SP]].forEach(([s, c], i) => { roundBox(ld, 60 + i * 30, 100 + i * 52, 560, 42, c, PANEL, 2); T(ld, s, { x: 80 + i * 30, y: 128 + i * 52, size: 17, fill: c, weight: 700 }); });
    matLine(p, 80, 760, 640, m('rod'));
    const f = quadRig(p, 300, 640, 1, m('rod'));
    const Hs = onStage(f, 'H'), Ss = onStage(f, 'Sh');
    const rod = path(p, `M${f1(Hs[0] - 50)} ${f1(Hs[1] - 30)}L${f1(Ss[0] + 40)} ${f1(Ss[1] - 32)}`, { stroke: '#c9a97a', 'stroke-width': 8, 'stroke-linecap': 'round' }, { o: 0 });
    show(rod, m('rod'));
    prog(q => { const k = cyc(q, 2); f.set({ hF: lerp(66, -24, k), kF: lerp(90, 0, k), fF: lerp(-90, 0, k) }); }, m('rod', 2), 5, lin);
    txt(p, 'палка не скатывается — туловище не скручивается', 420, 690, m('rod', 1), { size: 17, fill: '#c9a97a', anchor: 'middle', weight: 700 });
    prog(q => { const k = cyc(q, 2), j = cyc(q + .25, 2); f.set({ aN: lerp(66, 176, k), eN: 0, hF: lerp(66, -24, k), kF: lerp(90, 0, k), fF: lerp(-90, 0, k) }); }, m('alt', 2), 6, lin);
    pillRow(p, ['поочерёдно', 'все четыре', 'вперёд-назад → поперёк → диагонали'], 420, 740, m('alt'), { col: SP, size: 15, space: 8, gap: 1.2 });
    pillRow(p, ['гантели', 'лента', 'блоки'], 420, 790, m('res'), { col: QL, size: 16, space: 10 });
    pillRow(p, ['сидя', 'на коленях', 'стоя', 'мостик', 'планка', 'стена', 'выпад'], 420, 840, m('pos'), { col: SP, size: 15, space: 6, gap: .3 });
    infoCard(p, 800, 90, 760, 200, 'сначала выносливость', 'держать, потом укреплять; выносливость разгибателей в подострой стадии связана с меньшей болью и лучшей функцией', SP, m('endu'), { size: 19 });
    infoCard(p, 800, 305, 760, 160, 'палка вдоль спины', 'подсказка: не переносить вес при движении рукой или ногой — так включаются стабилизаторы', '#c9a97a', m('rod'), { size: 19 });
    infoCard(p, 800, 480, 760, 200, 'сопротивление', 'тяга вниз, руки вперёд против ленты, диагонали сидя и стоя; таз или поясница начали двигаться — снизить нагрузку или отдохнуть', QL, m('res'), { size: 19 });
    infoCard(p, 800, 695, 760, 175, 'положения', 'сидя (с опорой и без), на коленях, стоя; мостики и планки; скольжение по стене, неполные выпады', SP, m('pos'), { size: 19 });
  }],

  ['uns', 'Неустойчивая опора', (m, D) => {
    const p = panel(0);
    txt(p, 'неустойчивая опора: мяч, валик, качающаяся платформа', 800, 56, m('ball'), { size: 28, weight: 700, anchor: 'middle', fill: BALL });
    const GY = 780;
    show(path(p, `M80 ${GY}H760`, { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 }), m('ball'));
    const f = postureFig(p, 330, GY, .62, m('ball'), { pose: { shank: 0, thigh: -90, arm: 12, elb: 60 } });
    const H = f.at('hip'), r = 114 * .62;
    const b = mk('circle', { cx: f1(H[0]), cy: f1(GY - r), r: f1(r), fill: BALL, 'fill-opacity': .55, stroke: BALL, 'stroke-width': 3, opacity: 0 }, p); p.insertBefore(b, f.g); show(b, m('ball'));
    const mf = mk('ellipse', { rx: 12, ry: 26, fill: DEEP, 'fill-opacity': .6, stroke: DEEP, 'stroke-width': 2, opacity: 0 }, p); const M = f.unit(2, -26); mf.setAttribute('cx', f1(M[0])); mf.setAttribute('cy', f1(M[1])); show(mf, m('ball', 3));
    prog(q => mf.setAttribute('rx', f1(12 + 6 * Math.min(1, q * 2))), m('ball', 3.5), 2);
    lab(p, 'многораздельная толще (Скотт)', 250, 160, ...M, DEEP, m('ball', 3.5), { anchor: 'start' });
    prog(q => f.set({ arm: lerp(12, 150, cyc(q, 2)), elb: lerp(60, 6, cyc(q, 2)) }), m('v', .5), 6, lin);
    infoCard(p, 800, 90, 760, 230, 'Скотт и соавторы', 'сидя на большом мяче многораздельная мышца толще, чем сидя на твёрдом', DEEP, m('ball'), { size: 21 });
    infoCard(p, 800, 340, 760, 330, 'варианты', 'сидя на мяче, стопы на полу; лёжа спиной на мяче; стопы на низком мате или платформе; лёжа на валике, на коленях, на четвереньках или стоя; гантели и лента на разной высоте', BALL, m('v'), { size: 21 });
  }],

  ['ql', 'Квадратная мышца поясницы', (m, D) => {
    const p = panel(0);
    txt(p, 'боковая планка: квадратная мышца поясницы', 800, 56, m('why'), { size: 28, weight: 700, anchor: 'middle', fill: QL });
    // side plank seen from the front: a frontStand figure rotated onto its side
    const fs = frontStand(p, 0, 0, 1, m('how'), { muscles: false, pose: { w: 6, aL: 67, eL: 90, aR: 8, eR: 10 } });
    const RR = -67, loc = P => rotPt(P[0], P[1], RR);
    { const Q = fs.pts, low = [Q.legs[0][1], Q.legs[1][1], Q.arms[0][0], Q.arms[0][1]].map(loc), dy = 756 - Math.max(...low.map(v => v[1])) - 8;
      put(fs.g, { x: 640, y: dy, r: RR }); }
    const atR = P => { const s0 = st(fs.g), [x, y] = loc(P); return [s0.x + x, s0.y + y]; };
    const ql = mk('path', { fill: QL, 'fill-opacity': .55, stroke: QL, 'stroke-width': 3, opacity: 0 }, fs.top);
    const P = fs.pts.P; ql.setAttribute('d', `M${f1(P[0] - 40)} ${f1(P[1] - 40)}L${f1(P[0] - 26)} ${f1(P[1] - 110)}L${f1(P[0] - 8)} ${f1(P[1] - 108)}L${f1(P[0] - 14)} ${f1(P[1] - 44)}Z`);
    show(ql, m('how', 2));
    lab(p, 'квадратная мышца — нижняя сторона', 120, 300, ...atR([P[0] - 26, P[1] - 76]), QL, m('how', 2.5), { anchor: 'start' });
    show(path(p, 'M80 760H760', { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 }), m('how'));
    txt(p, 'на локте и колене → на кисти и стопе', 420, 830, m('how', 3), { size: 18, fill: QL, anchor: 'middle', weight: 700 });
    pill(p, 'вид спереди · схема', 420, 110, m('how'), { col: COL.dim, size: 15 });
    infoCard(p, 800, 90, 760, 170, 'зачем', 'квадратная мышца стабилизирует во фронтальной и поперечной плоскостях; сильнее всего — в боковой планке, вместе с наружной косой', QL, m('why'), { size: 19 });
    infoCard(p, 800, 275, 760, 190, 'как', 'на боку: опереться на локоть и поднять таз, опора — наружная сторона колена; держать или повторять; сложнее — кисть и стопа; затем движения рук и ног, с весом', QL, m('how'), { size: 19 });
    infoCard(p, 800, 480, 760, 190, 'Тейхен и соавторы', 'по ультразвуку боковая планка сильнее всего утолщает поперечную и внутреннюю косую при наименьшей нагрузке на поясницу — среди шести упражнений', DEEP, m('ev'), { size: 19 });
    infoCard(p, 800, 685, 760, 185, 'дальше', 'контроль, выносливость и сила есть — лёгкие динамические упражнения; напрягать живот в делах — в 10 лет меньше рецидивов', SP, m('dyn'), { size: 19 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-tf', prompt: ['Верно или неверно?'],
    build: grid([
      { parts: ['Разгибатели начинают тренировать лёжа на животе'], ans: ['f'], why: 'Неверно: на четвереньках — меньше сжатия.' },
      { parts: ['Манометр под поясницей держат на 40 ± 10'], ans: ['t'], why: 'Верно.' },
      { parts: ['Боковая планка утолщает поперечную при малой нагрузке на поясницу'], ans: ['t'], why: 'Верно, по данным Тейхен.' },
      { parts: ['Если таз начал двигаться, нагрузку повышают'], ans: ['f'], why: 'Неверно: снижают.' },
      { parts: ['Сначала выносливость, потом сила'], ans: ['t'], why: 'Верно.' },
    ], [['t', 'Верно', COL.good], ['f', 'Неверно', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Нейтраль, втягивание, нагрузка — и стоп, как только нейтраль теряется.', 'w1'],
     ['Лёжа на спине — шесть уровней нагрузки ногами под манометром на 40.', 'w2'],
     ['Разгибатели начинают на четвереньках: лёжа на животе сжатие больше.', 'w3'],
     ['Сначала выносливость, потом сила; мяч и боковая планка усиливают стабилизаторы.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SP }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-lvl', prompt: ['На уровне 4 (другая нога 90°, держат руки) манометр прыгает с 40 до 58. Что делать?'],
    build: choice([
      ['Вернуться к уровню 3 и наращивать время, держа 40 ± 10'],
      ['Перейти к уровню 6'],
      ['Задержать дыхание для устойчивости'],
      ['Продолжать — это нормально'],
    ], 0, 'Давление за пределами 40 ± 10 — потеря контроля: уровень ниже и выносливость.',
    [null, 'Контроля нет — усложнять рано.', 'Натуживание не нужно.', 'Устойчивое положение потеряно.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-quad', prompt: ['У пациента сгибательная контрактура бедра и боль при нагрузке на диск. С чего начать тренировку разгибателей?'],
    build: choice([
      ['На четвереньках: рука, нога скользит, нога вверх, рука и противоположная нога'],
      ['Лёжа на животе: поднять голову, руки и туловище'],
      ['Подъём обеих ног лёжа на животе'],
      ['Разгибание с грузом стоя'],
    ], 0, 'На четвереньках меньше сжатие и легче нейтраль; лёжа на животе мешает контрактура.',
    [null, 'Это конец объёма и большое сжатие.', 'Тоже большое сжатие.', 'Слишком рано.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
