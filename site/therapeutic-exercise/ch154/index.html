const SP = '#8fd6b0', EXT = '#f4a48c', FLX = '#86c9e8', LAT = '#c9b8e8', AER = '#f0c060', HR = '#ff7a6b', TBAND = '#c9a97a';

function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {

  path(g, `M${lx} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}

    const wk = G(p, { o: 0 }); show(wk, m('safe', 1));
    for (let i = 0; i < 6; i++) { const h = 40 * Math.pow(1.1, i); mk('rect', { x: 180 + i * 80, y: 820 - h, width: 50, height: h, rx: 6, fill: AER, 'fill-opacity': .5, stroke: AER, 'stroke-width': 2 }, wk); T(wk, String(i + 1), { x: 205 + i * 80, y: 845, size: 15, fill: COL.dim, anchor: 'middle', weight: 600 }); }
    T(wk, 'неделя', { x: 140, y: 845, size: 15, fill: COL.dim, anchor: 'end', weight: 600 });
    infoCard(p, 800, 90, 760, 220, 'польза и начало', 'выносливость, самочувствие, облегчение симптомов; после травмы или операции — когда ушли признаки воспаления; малая–средняя интенсивность; с учётом предпочтения позвоночника', AER, m('ben'), { size: 19 });
    infoCard(p, 800, 325, 760, 140, 'пульс', 'максимальный: 220 − возраст или пульс появления симптомов; целевой — 60–80 %', HR, m('box'), { size: 19 });
    infoCard(p, 800, 480, 760, 190, 'программа', 'разминка 10–15 мин с движениями шеи и туловища; индивидуально — не каждый может выполнить любое упражнение; обувь для нагрузок стоя', SP, m('wu'), { size: 19 });
    infoCard(p, 800, 685, 760, 185, 'нагрузка', 'до целевого пульса на 20–30 мин; заминка 5–10 мин; 3–5 раз в неделю; не больше +10 % в неделю; боль — снизить', AER, m('main'), { size: 19 });
  }],

  ['act', 'Виды нагрузки', (m, D) => {
    const p = panel(0);
    txt(p, 'что каждый вид нагрузки делает с позвоночником', 800, 56, m('bike'), { size: 28, weight: 700, anchor: 'middle', fill: AER });
    // road bike vs upright bike
    const GY = 330;
    show(path(p, `M80 ${GY}H760`, { stroke: COL.dim, 'stroke-width': 3 }, { o: 0 }), m('bike'));
    const a = postureFig(p, 260, GY, .3, m('bike'), { pose: { ...sitPose, tilt: 40, kyph: 66, cerv: 60, hd: -26, arm: 70, elb: 10 } });
    const b = postureFig(p, 560, GY, .3, m('bike', 3), { pose: { ...sitPose, tilt: 8, kyph: 44, arm: 40, elb: 30 } });
    const bike = (f, t0) => { const g = G(p, { o: 0 }), H = f.at('hip'), W = f.stage(f.geo.W), r = 34, w1 = [H[0] - 60, GY - r], w2 = [W[0] + 30, GY - r];
      [w1, w2].forEach(c => mk('circle', { cx: f1(c[0]), cy: f1(c[1]), r, fill: 'none', stroke: COL.dim, 'stroke-width': 3 }, g));
      path(g, `M${f1(w1[0])} ${f1(w1[1])}L${f1(H[0])} ${f1(H[1] + 14)}L${f1(w2[0] - 20)} ${f1(W[1] + 8)}L${f1(w2[0])} ${f1(w2[1])}M${f1(H[0])} ${f1(H[1] + 14)}L${f1(H[0] + 40)} ${f1(GY - r)}L${f1(w1[0])} ${f1(w1[1])}M${f1(w2[0] - 20)} ${f1(W[1] + 8)}L${f1(W[0])} ${f1(W[1])}`, { stroke: COL.dim, 'stroke-width': 3, fill: 'none' });
      p.insertBefore(g, f.g); show(g, t0); };
    bike(a, m('bike')); bike(b, m('bike', 3));
    pill(p, 'шоссейный: сгибание + шея назад', 260, 370, m('bike', 1), { col: FLX, size: 14 });
    pill(p, 'прямая посадка, велотренажёр', 560, 370, m('bike', 3), { col: SP, size: 14 });
    const acts = [['ходьба и бег', 'изгибы естественные, разгибание в конце опоры; бег — ударная нагрузка (диск, артроз)', 'walk', EXT], ['ступени, лыжи', 'держать таз против вращения; толчок ногой разгибает — нейтраль и пресс', 'stair', LAT], ['плавание', 'брасс — голова с грудью «блоком»; кроль — вдох поворотом тела', 'swim', FLX], ['ручной эргометр', 'вперёд — сгибание, назад — разгибание; лучше стоя', 'erg', SP]];
    acts.forEach(([t, b2, mk2, c], i) => infoCard(p, 60, 420 + i * 112, 700, 104, t, b2, c, m(mk2), { size: 15 }));
    infoCard(p, 800, 90, 760, 240, 'велосипед', 'шоссейный сгибает грудопоясничный отдел и переразгибает верх шеи — при сгибательном предпочтении, если шея не болит; горный, гибридный или велотренажёр — посадка прямее', FLX, m('bike'), { size: 19 });
    infoCard(p, 800, 345, 760, 330, 'кроссфит', 'Смит и соавт.: 43 человека, 10 недель — выросло максимальное потребление кислорода, снизился жир. Хак и соавт.: из 132 ответивших 97 травмировались, 9 — с операцией; 3,1 травмы на 1000 часов — как в тяжёлой атлетике и гимнастике', AER, m('cf'), { size: 19 });
    infoCard(p, 800, 690, 760, 180, '«модное» занятие', 'судить по механике: крайние положения и баллистические махи опасны для восстанавливающегося позвоночника', COL.bad, m('fad'), { size: 19 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-act', prompt: ['Что посоветовать?'],
    build: grid([
      { parts: ['Боль в шее при кроле'], ans: ['l'], why: 'Вдох с поворотом всего тела «бревном».' },
      { parts: ['Сгибательное предпочтение в пояснице, шея здорова'], ans: ['b'], why: 'Шоссейный велосипед подходит.' },
      { parts: ['Поражение диска, хочется бегать'], ans: ['w'], why: 'Бег — ударная нагрузка; ходьба.' },
      { parts: ['Боль в шее на шоссейном велосипеде'], ans: ['u'], why: 'Прямая посадка или велотренажёр.' },
      { parts: ['Брасс усиливает боль в шее'], ans: ['l'], why: 'Поднимать голову вместе с грудью, без переразгибания.' },
    ], [['b', 'Шоссейный велосипед', FLX], ['u', 'Прямая посадка', SP], ['w', 'Ходьба вместо бега', EXT], ['l', 'Изменить технику', LAT]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Слабые относительно сгибателей разгибатели — фактор риска; тренируют интенсивно, прогиб — без противопоказаний.', 'w1'],
     ['При сколиозе укрепляют выпуклую сторону; одни упражнения дугу не остановят.', 'w2'],
     ['Аэробика: 60–80 % максимального пульса, 20–30 мин, 3–5 раз в неделю, прирост ≤ 10 %.', 'w3'],
     ['Вид нагрузки подбирают под предпочтение позвоночника и следят за нейтралью.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SP }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-hr', prompt: ['Пациенту 50 лет. Какой пульс держать в основной части аэробики?'],
    build: blanks([
      { parts: ['Максимальный пульс: 220 − 50 = ', { box: '170' }], why: '220 − возраст.' },
      { parts: ['Целевая зона: от ', { box: '102' }, ' до ', { box: '136' }, ' уд/мин'], why: '60 % и 80 % от 170.' },
    ]),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-prog', prompt: ['Пациент ходит 30 минут без симптомов. Как увеличить нагрузку на следующей неделе?'],
    build: choice([
      ['Не больше чем на 10 %: например, 33 минуты'],
      ['Сразу удвоить — до часа'],
      ['Перейти на бег с ускорениями'],
      ['Добавить, даже если появится боль'],
    ], 0, 'Перегрузка возникает при росте времени или усилия без отдыха; прирост — не больше 10 % в неделю.',
    [null, 'Слишком резкий рост.', 'Ударная нагрузка — не первый шаг.', 'Боль — сигнал снизить нагрузку.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
