const SP = '#8fd6b0', FUN = '#f0c060', BOX = '#c9a97a', TRN = '#86c9e8', BAD = COL.bad, LIG = '#f1dfa0', ENV = '#c9b8e8';
const BN = ANAT.bone, BL = mix(ANAT.bone, '#000000', .45);
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : x + (right ? 8 : -8);
  path(g, `M${lx} ${y - size * .35}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
const floorLn = (p, x1, x2, y, t0) => show(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 }), t0);
// A seated mannequin on a chair, ankle planted at (ax, GY); sitStand — n repetitions with a stable trunk.
function chairFig(p, ax, GY, s, t0) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: SIT });
  plant(f, 'AN', ax, GY);
  const [hx, hy] = onStage(f, 'H');
  chair(p, hx, hy + 22 * s / .5 * .32, GY, t0);
  show(f.g, t0);
  return f;
}
function sitStand(f, t0, dur, n, ax, GY) {
  prog(q => {
    const e = cyc(q, n), o = {};
    for (const k in SIT) o[k] = lerp(SIT[k], STAND[k], e);
    o.t += 30 * Math.sin(Math.PI * e);
    f.set(o); plant(f, 'AN', ax, GY);
  }, t0, dur, lin);
}
const boxProp2 = (p, w, h) => { const g = G(p, { o: 0 }); mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 4, fill: BOX, stroke: mix(BOX, '#000000', .5), 'stroke-width': 2 }, g); path(g, `M${-w / 2} ${-h / 2 + 8}H${w / 2}`, { stroke: mix(BOX, '#000000', .35), 'stroke-width': 2 }); return g; };

const BEATS = [
