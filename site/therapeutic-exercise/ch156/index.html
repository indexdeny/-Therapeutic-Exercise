<script>
'use strict';
const CHAPTER = { number: 156, title: 'Суставы плечевого комплекса', minutes: 8, language: 'ru', next: '../ch157/' };
// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch156/cards.ru.json
const CARDS_SHORT = {
  "одно место крепления\nключица сочленяется с грудиной маленьким грудино-ключичным суставом — поэтому рука так подвижна": "грудино-ключичный сустав → подвижность",
  "цена подвижности\nустойчивость держится на равновесии мышц лопатки и плечевого сустава и на мягких тканях всех суставов": "равновесие мышц + мягкие ткани",
  "шар в мелкой чаше\nтрёхосный, неконгруэнтный, просторная капсула; держат манжета и связки: верхняя, средняя, нижняя плечевые и клювовидно-плечевая": "держат манжета и связки",
  "впадина\nсмотрит наружу, немного вперёд и вверх, почти не даёт устойчивости; губа углубляет её и держит капсулу": "губа углубляет впадину",
  "головка\nполушарие, с впадиной соприкасается малая часть — подвижность и склонность к нестабильности": "подвижность → нестабильность",
  "выпуклое на вогнутом\nплечевая кость движется — головка катится в ту же сторону, скользит в противоположную: при отведении катится вверх и скользит вниз": "катится вверх, скользит вниз",
  "статическая\nформа поверхностей, связки, губа, сцепление суставной жидкости и отрицательное давление; в покое натянуты верхняя капсула, верхняя плечевая и клювовидно-плечевая связки": "форма, связки, губа, давление",
  "динамическая\nсухожилия манжеты вплетены в связки и губу: сокращаясь, мышцы натягивают ограничители": "мышцы натягивают ограничители",
  "двуглавая и трёхглавая\nукрепляют капсулу сверху и снизу; двуглавая против подъёма головки и помогает спереди при отведении с наружной ротацией": "укрепляют капсулу",
  "акромиально-ключичный\nплоский, трёхосный, иногда с диском; слабую капсулу держат акромиально-ключичные связки и мощная клювовидно-ключичная": "клювовидно-ключичная связка",
  "скольжение\nвогнутый акромион скользит туда же, куда движется лопатка": "акромион скользит туда же",
  "грудино-ключичный\nседловидный, трёхосный, с диском; связки — передняя и задняя грудино-ключичные, межключичная, рёберно-ключичная": "седловидный, с диском",
  "ключица\nподнимается и опускается, выдвигается вперёд и назад; вращение вокруг длинной оси — только когда рука выше горизонтали, отдельно его не сделать": "вращение — только выше горизонтали",
  "не настоящий сустав\nмягкие ткани дают лопатке скользить по грудной клетке; она участвует во всех движениях руки": "лопатка скользит по рёбрам",
  "поднимание / опускание\nфронтальная плоскость, как при пожимании плечами": "фронтальная плоскость, как при пожимании плечами",
  "выдвижение вперёд / назад\nот позвоночника и к нему, как при доставании вперёд": "доставание вперёд",
  "поворот вверх / вниз\nвпадина поворачивается вверх вместе с подъёмом руки; в конце — наклон назад и поворот наружу": "впадина вверх с подъёмом руки",
  "отход края, наклон · удержание\nкрай отходит от рёбер или прижимается; наклон вперёд — кисть за спиной. Против веса руки — верхняя и средняя трапециевидная, передняя зубчатая, ромбовидные": "трапециевидная, зубчатая, ромбовидные",
};
// cards-short end

const SH = '#86c9e8', MU = '#f4a48c', LG = '#f1dfa0', FUN = '#f0c060', SP = '#8fd6b0', ENV = '#c9b8e8', BAD = COL.bad;
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : an === 'middle' ? x : x + (right ? 8 : -8), ly = an === 'middle' ? y + (ty > y ? 8 : -size) : y - size * .35;
  path(g, `M${lx} ${ly}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
const arw = (p, x1, y1, x2, y2, col, t0, w = 6) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 14, g = G(p, { o: 0 }); path(g, `M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}M${f1(x2 - h * Math.cos(a - .5))} ${f1(y2 - h * Math.sin(a - .5))}L${f1(x2)} ${f1(y2)}L${f1(x2 - h * Math.cos(a + .5))} ${f1(y2 - h * Math.sin(a + .5))}`, { stroke: col, 'stroke-width': w }); if (t0 !== null) show(g, t0); else put(g, { o: 1 }); return g; };
const ring = (p, P, r, col, t0) => { const c = mk('circle', { cx: f1(P[0]), cy: f1(P[1]), r, fill: 'none', stroke: col, 'stroke-width': 4, opacity: 0 }, p); show(c, t0); return c; };
// an arc of the glenoid or the head (radius rr about the centre C of the joint, angles a0..a1) in stage coordinates
const arcOn = (j, conv, rr, a0, a1) => { const P = []; for (let a = a0; a <= a1; a += 4) P.push(j.at(conv(polar([0, 0], rr, a)))); return P; };

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Плечевой комплекс', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 17 · Урок 156', { x: 800, y: 130, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'Суставы плечевого комплекса', { x: 800, y: 215, size: 56, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'плечевой · акромиально-ключичный · грудино-ключичный · лопатка на рёбрах', 800, 300, m('sub'), { size: 28, fill: SH, anchor: 'middle', weight: 600 });
    const art = G(scene, { o: 0 });
    const b = scapBack(art, 880, 660, .5, null, {}); b.only(['utr', 'ltr', 'sa']); put(b.g, { o: 1 });
    prog(q => b.set({ arm: 160 * cyc(q, 2) }), 1, Math.max(3, D - 2), lin);
    show(art, .3);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);
  }],

  ['over', 'Подвижность и её цена', (m, D) => {
    const p = panel(0);
    txt(p, 'одно соединение с туловищем — и пять сочленений', 800, 56, m('one'), { size: 28, weight: 700, anchor: 'middle', fill: SH });
    const a = girdleAnt(p, 130, 290, 1.02, m('one'));
    ring(p, a.at('SC'), 28, FUN, m('one', 1));
    lab(p, 'грудино-ключичный сустав', 60, 180, ...a.at('SC'), FUN, m('one', 1), { anchor: 'start' });
    // the cost: the arm swings up with the scapula, then back
    prog(q => a.set({ elev: 165 * cyc(q, 1) }), m('cost', 1), Math.max(2, m('five') - m('cost') - 1.4));
    pillRow(p, ['подвижность', '↔', 'устойчивость'], 400, 860, m('cost'), { col: [SP, COL.dim, BAD], size: 20, gap: .3 });
    // five joints: three synovial, two functional
    const mark = (k, n, col, t) => { const P = a.at(k), gg = G(p, { x: P[0], y: P[1], o: 0 }); mk('circle', { r: 17, fill: col, stroke: COL.board, 'stroke-width': 3 }, gg); T(gg, String(n), { x: 0, y: 7, size: 20, fill: COL.board, weight: 700, anchor: 'middle' }); show(gg, t); pulse(gg, t + .3, 1.3); };
    [['H', 1], ['AC', 2], ['SC', 3]].forEach(([k, n], i) => mark(k, n, SH, m('five', 1 + i * 1.2)));
    [['st', 4], ['sub', 5]].forEach(([k, n], i) => mark(k, n, FUN, m('five', 6 + i * 1.6)));
    infoCard(p, 800, 90, 760, 150, 'одно место крепления', 'ключица сочленяется с грудиной маленьким грудино-ключичным суставом — поэтому рука так подвижна', FUN, m('one'), { size: 21 });
    infoCard(p, 800, 255, 760, 150, 'цена подвижности', 'устойчивость держится на равновесии мышц лопатки и плечевого сустава и на мягких тканях всех суставов', BAD, m('cost'), { size: 21 });
    infoCard(p, 800, 420, 760, 400, 'пять сочленений', null, SH, m('five'));
    [['1  плечевой', SH], ['2  акромиально-ключичный', SH], ['3  грудино-ключичный', SH], ['4  лопаточно-грудное', FUN], ['5  надплечевое (подакромиальное)', FUN]].forEach(([s, c], i) =>
      txt(p, s, 830, 520 + i * 50, m('five', i < 3 ? 1 + i * 1.2 : 6 + (i - 3) * 1.6), { size: 22, fill: c, weight: 600 }));
    pillRow(p, ['синовиальные', 'функциональные'], 1180, 790, [m('five', 1), m('five', 6)], { col: [SH, FUN], size: 17 });
  }],

  ['gh', 'Плечевой сустав', (m, D) => {
    const p = panel(0);
    txt(p, 'мелкая впадина — большая головка', 800, 56, m('ball'), { size: 28, weight: 700, anchor: 'middle', fill: SH });
    const j = ghJoint(p, 430, 440, 1.3, m('ball'), { rhythm: false, delt: false });
    const labs = [lab(p, 'головка', 640, 640, ...j.at('H'), COL.chalk, m('ball', 1), { anchor: 'start' }),
      lab(p, 'впадина', 60, 520, ...j.at('gl'), SH, m('ball', 1.5), { anchor: 'start' }),
      lab(p, 'капсула', 120, 700, ...j.at('capI'), LG, m('ball', 2), { anchor: 'start' })];
    lab(p, 'надостная', 60, 170, ...j.at('sspM'), MU, m('ball', 2.5), { anchor: 'start' });
    pillRow(p, ['шаровидный', 'трёхосный', 'неконгруэнтный'], 400, 840, m('ball', 1), { col: SH, size: 19 });
    // the glenoid and the labrum
    const gl = path(p, 'M' + arcOn(j, j.scp, j.R + 4, 150, 210).map(P => f1(P[0]) + ' ' + f1(P[1])).join('L'), { stroke: SH, 'stroke-width': 8, 'stroke-linecap': 'round' }, { o: 0 });
    show(gl, m('fossa')); pulse(gl, m('fossa', .4), 1.02);
    [j.at('labS'), j.at('labI')].forEach((P, i) => ring(p, P, 16, SH, m('fossa', 5 + i * .4)));
    lab(p, 'хрящевая губа', 60, 300, ...j.at('labS'), SH, m('fossa', 5), { anchor: 'start' });
    // the head: only a small part touches the glenoid
    const hd = path(p, 'M' + arcOn(j, P => [j.H[0] + P[0], j.H[1] + P[1]], j.R + 1, 158, 202).map(P => f1(P[0]) + ' ' + f1(P[1])).join('L'), { stroke: FUN, 'stroke-width': 9, 'stroke-linecap': 'round' }, { o: 0 });
    show(hd, m('head', 2));
    labs.push(lab(p, 'в контакте — малая часть', 560, 250, ...j.at(polar(j.H, j.R, 200)), FUN, m('head', 2)));
    // convex on concave: abduction — the head rolls up and glides down
    hide(gl, m('roll')); hide(hd, m('roll')); labs.forEach(l => hide(l, m('roll')));
    prog(q => j.set({ elev: 80 * cyc(q, 1), scap: 0 }), m('roll', 1), 6);
    const C = j.at('H');
    arw(p, C[0] - 34, C[1] + 26, C[0] - 34, C[1] - 46, FUN, m('roll', 2));
    arw(p, 120, 760, 120, 724, FUN, m('roll', 2), 5); txt(p, 'катится вверх', 140, 756, m('roll', 2), { size: 20, fill: FUN, weight: 700 });
    arw(p, C[0] + 20, C[1] - 30, C[0] + 20, C[1] + 44, SP, m('roll', 3));
    arw(p, 400, 724, 400, 760, SP, m('roll', 3), 5); txt(p, 'скользит вниз', 420, 756, m('roll', 3), { size: 20, fill: SP, weight: 700 });
    infoCard(p, 800, 90, 760, 200, 'шар в мелкой чаше', 'трёхосный, неконгруэнтный, просторная капсула; держат манжета и связки: верхняя, средняя, нижняя плечевые и клювовидно-плечевая', SH, m('ball'), { size: 20 });
    infoCard(p, 800, 305, 760, 175, 'впадина', 'смотрит наружу, немного вперёд и вверх, почти не даёт устойчивости; губа углубляет её и держит капсулу', SH, m('fossa'), { size: 20 });
    infoCard(p, 800, 495, 760, 150, 'головка', 'полушарие, с впадиной соприкасается малая часть — подвижность и склонность к нестабильности', FUN, m('head'), { size: 20 });
    infoCard(p, 800, 660, 760, 210, 'выпуклое на вогнутом', 'плечевая кость движется — головка катится в ту же сторону, скользит в противоположную: при отведении катится вверх и скользит вниз', SP, m('roll'), { size: 20 });
  }],

  ['stab', 'Устойчивость', (m, D) => {
    const p = panel(0);
    txt(p, 'статическая и динамическая устойчивость', 800, 56, m('stat'), { size: 28, weight: 700, anchor: 'middle', fill: SH });
    const j = ghJoint(p, 430, 430, 1.25, m('stat'), { rhythm: false, delt: false, bic: true });
    lab(p, 'верхняя капсула и связки — натянуты в покое', 60, 110, ...j.at('capS'), LG, m('stat', 6), { anchor: 'start', size: 18 });
    lab(p, 'губа', 60, 600, ...j.at('labI'), SH, m('stat', 3), { anchor: 'start' });
    const neg = pill(p, '− давление', ...j.at(polar(j.H, -j.R * .55, 0)).map((v, i) => i ? v + 4 : v), m('stat', 9), { col: SH, size: 15 });
    // the cuff contracts and presses the head into the glenoid
    prog(q => j.ssp.act(q), m('dyn'), 1.2);
    const H = j.at('H');
    arw(p, H[0] + 60, H[1] - 6, H[0] - 6, H[1] - 6, MU, m('dyn', 1));
    txt(p, 'манжета прижимает головку', H[0] + 100, H[1] + 6, m('dyn', 1), { size: 19, fill: MU, weight: 700, anchor: 'start' });
    lab(p, 'надостная', 60, 190, ...j.at('sspM'), MU, m('dyn', .5), { anchor: 'start' });
    // the long head of the biceps over the top; the triceps' long head below
    prog(q => { j.ssp.act(1 - q); j.bic.act(q); }, m('bic'), 1);
    lab(p, 'длинная головка двуглавой', 470, 800, ...j.at('bic'), LG, m('bic', .5), { anchor: 'start' });
    const tri = bandEl(j.root, { col: MU, w: 14 }); tri.set([j.scp(polar([0, 0], j.R + 14, 150)), j.hum([-.15 * j.R, 3.6 * j.R])]);
    put(tri.g, { o: 0 }); show(tri.g, m('bic', 5));
    lab(p, 'длинная головка трёхглавой', 60, 830, ...j.at(j.hum([-.12 * j.R, 2.6 * j.R])), MU, m('bic', 5), { anchor: 'start' });
    arw(p, H[0] + 40, H[1] - 30, H[0] + 40, H[1] + 30, LG, m('bic', 8));
    txt(p, 'не даёт головке подняться', H[0] + 100, H[1] + 50, m('bic', 8), { size: 18, fill: LG, weight: 700, anchor: 'start' });
    infoCard(p, 800, 90, 760, 230, 'статическая', 'форма поверхностей, связки, губа, сцепление суставной жидкости и отрицательное давление; в покое натянуты верхняя капсула, верхняя плечевая и клювовидно-плечевая связки', SH, m('stat'), { size: 20 });
    infoCard(p, 800, 335, 760, 150, 'динамическая', 'сухожилия манжеты вплетены в связки и губу: сокращаясь, мышцы натягивают ограничители', MU, m('dyn'), { size: 20 });
    infoCard(p, 800, 500, 760, 175, 'двуглавая и трёхглавая', 'укрепляют капсулу сверху и снизу; двуглавая против подъёма головки и помогает спереди при отведении с наружной ротацией', LG, m('bic'), { size: 20 });
    infoCard(p, 800, 690, 760, 180, 'нервно-мышечный контроль', null, SH, m('nm'), { size: 20 });
    // neuromuscular control: sensing and answering
    const loop = G(p, { x: 1180, y: 805, o: 0 });
    path(loop, 'M-60 0A60 24 0 0 1 60 0', { stroke: SH, 'stroke-width': 4, fill: 'none' }); path(loop, 'M60 0A60 24 0 0 1 -60 0', { stroke: MU, 'stroke-width': 4, fill: 'none' });
    T(loop, 'чувство движения', { x: -76, y: 7, size: 19, fill: SH, weight: 700, anchor: 'end' }); T(loop, 'ответ мышц', { x: 76, y: 7, size: 19, fill: MU, weight: 700, anchor: 'start' });
    show(loop, m('nm', 1));
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-stab', prompt: ['Статическая или динамическая устойчивость?'],
    build: grid([
      { parts: ['Форма суставных поверхностей'], ans: ['s'], why: 'Статическая — пассивная структура.' },
      { parts: ['Сокращение манжеты натягивает капсулу'], ans: ['d'], why: 'Динамическая: работа мышц.' },
      { parts: ['Хрящевая губа'], ans: ['s'], why: 'Статическая.' },
      { parts: ['Отрицательное давление в суставе'], ans: ['s'], why: 'Статическая.' },
      { parts: ['Длинная головка двуглавой против подъёма головки'], ans: ['d'], why: 'Динамическая: мышца.' },
    ], [['s', 'Статическая', SH], ['d', 'Динамическая', MU]], { multi: false, text: true }),
  }], done) }],

  ['ac', 'Ключица и её суставы', (m, D) => {
    const p = panel(0);
    txt(p, 'суставы, которые держат только связки', 800, 56, m('ac'), { size: 28, weight: 700, anchor: 'middle', fill: LG });
    const a = girdleAnt(p, 70, 330, 1.4, m('ac'), { arm: false });
    const acR = ring(p, a.at('AC'), 34, FUN, m('ac', 1));
    lab(p, 'акромиально-ключичный', 460, 170, ...a.at('AC'), FUN, m('ac', 1));
    lab(p, 'клювовидно-ключичная: коническая и трапециевидная', 330, 640, ...a.at('CC'), LG, m('ac', 7), { anchor: 'middle', size: 18 });
    txt(p, 'мышц через сустав нет', 470, 120, m('ac', 13), { size: 18, fill: BAD, weight: 700, anchor: 'middle' });
    // the scapula turns under the clavicle at the AC joint
    prog(q => a.set({ elev: 150 * cyc(q, 1) }), m('acm', 1), Math.max(3, m('sc') - m('acm') - 1.5));
    pillRow(p, ['поворот вверх и вниз', 'отход края', 'наклон'], 400, 860, m('acm', 4), { col: FUN, size: 18 });
    hide(acR, m('sc'));
    ring(p, a.at('SC'), 30, SH, m('sc'));
    lab(p, 'грудино-ключичный: диск', 80, 210, ...a.at('SC'), SH, m('sc', .5), { anchor: 'start' });
    lab(p, 'рёберно-ключичная', 80, 560, ...a.at([70, 20]), LG, m('sc', 5), { anchor: 'start' });
    // clavicular motions; the long-axis rotation shows up above the horizontal
    prog(q => a.set({ elev: 170 * cyc(q, 1) }), m('scm', 5), 7);
    const rot = G(p, { o: 0 }); const CC = a.at([200, -60]);
    path(rot, `M${f1(CC[0] - 30)} ${f1(CC[1] - 10)}A34 16 0 1 0 ${f1(CC[0] + 30)} ${f1(CC[1] - 10)}`, { stroke: FUN, 'stroke-width': 4, fill: 'none' });
    T(rot, 'вращение вокруг оси', { x: CC[0], y: CC[1] - 40, size: 18, fill: FUN, weight: 700, anchor: 'middle' });
    show(rot, m('scm', 8.5)); hide(rot, m('scm', 11.5), .4);
    infoCard(p, 800, 90, 760, 200, 'акромиально-ключичный', 'плоский, трёхосный, иногда с диском; слабую капсулу держат акромиально-ключичные связки и мощная клювовидно-ключичная', FUN, m('ac'), { size: 20 });
    infoCard(p, 800, 305, 760, 150, 'скольжение', 'вогнутый акромион скользит туда же, куда движется лопатка', FUN, m('acm'), { size: 20 });
    infoCard(p, 800, 470, 760, 175, 'грудино-ключичный', 'седловидный, трёхосный, с диском; связки — передняя и задняя грудино-ключичные, межключичная, рёберно-ключичная', SH, m('sc'), { size: 20 });
    infoCard(p, 800, 660, 760, 210, 'ключица', 'поднимается и опускается, выдвигается вперёд и назад; вращение вокруг длинной оси — только когда рука выше горизонтали, отдельно его не сделать', SH, m('scm'), { size: 20 });
  }],

  ['st', 'Лопатка на рёбрах', (m, D) => {
    const p = panel(0);
    txt(p, 'лопаточно-грудное сочленение — скольжение по рёбрам', 800, 56, m('st'), { size: 28, weight: 700, anchor: 'middle', fill: SP });
    const b = scapBack(p, 470, 540, .8, m('st'), { rhythm: false });
    b.only([]);
    txt(p, 'вид сзади', 300, 860, m('st'), { size: 17, fill: COL.dim, weight: 600, anchor: 'middle' });
    const lb = txt(p, '', 470, 150, m('el'), { size: 22, fill: SP, weight: 700, anchor: 'middle' });
    const seg = (mk2, next, fn, label) => { whenAt(m(mk2), () => { lb.textContent = label; }); prog(q => fn(cyc(q, 1.5)), m(mk2, .5), Math.max(2, m(next) - m(mk2) - 1)); };
    seg('el', 'pro', k => b.set({ elev: 45 * k }), 'поднимание и опускание');
    seg('pro', 'up', k => b.set({ elev: 0, pro: 50 * k }), 'выдвижение вперёд и назад');
    prog(q => { const k = cyc(q, 1); b.set({ pro: 0, arm: 160 * k, up: rhythmUp(160 * k) }); }, m('up', .5), Math.max(3, m('tilt') - m('up') - 1));
    whenAt(m('up'), () => { lb.textContent = 'поворот вверх — вместе с рукой'; });
    whenAt(m('tilt'), () => { lb.textContent = 'отход медиального края · наклон вперёд'; });
    prog(q => b.set({ arm: 0, up: 0, wing: cyc(q, 1) }), m('tilt', .3), 3);
    prog(q => b.set({ wing: 0, tilt: cyc(q, 1) }), m('tilt', 4), 3);
    // at rest the arm's weight pulls the scapula down, forward and into tilt; muscles hold it
    whenAt(m('hold'), () => { lb.textContent = 'удерживают мышцы'; });
    b.only(['utr', 'sa', 'rh', 'mtr'], m('hold', 2));
    prog(q => ['utr', 'sa', 'rh', 'mtr'].forEach(k => b.mus[k].act(.6 * q)), m('hold', 2), 1);
    const W = b.at('W');
    arw(p, W[0] + 30, W[1] - 40, W[0] + 30, W[1] + 40, BAD, m('hold', .5));
    txt(p, 'вес руки', W[0] + 40, W[1] + 66, m('hold', .5), { size: 18, fill: BAD, weight: 700, anchor: 'middle' });
    infoCard(p, 800, 90, 760, 150, 'не настоящий сустав', 'мягкие ткани дают лопатке скользить по грудной клетке; она участвует во всех движениях руки', SP, m('st'), { size: 20 });
    infoCard(p, 800, 255, 760, 110, 'поднимание / опускание', 'фронтальная плоскость, как при пожимании плечами', SP, m('el'), { size: 20 });
    infoCard(p, 800, 380, 760, 110, 'выдвижение вперёд / назад', 'от позвоночника и к нему, как при доставании вперёд', SP, m('pro'), { size: 20 });
    infoCard(p, 800, 505, 760, 145, 'поворот вверх / вниз', 'впадина поворачивается вверх вместе с подъёмом руки; в конце — наклон назад и поворот наружу', FUN, m('up'), { size: 20 });
    infoCard(p, 800, 665, 760, 205, 'отход края, наклон · удержание', 'край отходит от рёбер или прижимается; наклон вперёд — кисть за спиной. Против веса руки — верхняя и средняя трапециевидная, передняя зубчатая, ромбовидные', MU, m('tilt'), { size: 19 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-scap', prompt: ['Какое это движение лопатки?'],
    build: grid([
      { parts: ['Пожать плечами'], ans: ['e'], why: 'Поднимание лопатки.' },
      { parts: ['Дотянуться до предмета перед собой'], ans: ['p'], why: 'Выдвижение вперёд.' },
      { parts: ['Поднять руку над головой'], ans: ['u'], why: 'Поворот вверх — впадина смотрит вверх.' },
      { parts: ['Завести кисть за спину'], ans: ['t'], why: 'Наклон лопатки вперёд.' },
      { parts: ['Свести лопатки'], ans: ['p'], why: 'Выдвижение назад — к позвоночнику.' },
    ], [['e', 'Поднимание', SP], ['p', 'Выдвижение / сведение', SH], ['u', 'Поворот вверх', FUN], ['t', 'Наклон', MU]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['С туловищем плечевой пояс соединяет только грудино-ключичный сустав — отсюда подвижность и уязвимость.', 'w1'],
     ['Плечевой сустав — мелкая впадина и большая головка; держат связки, губа, манжета и нервно-мышечный контроль.', 'w2'],
     ['Акромиально-ключичный и грудино-ключичный суставы держат только связки.', 'w3'],
     ['Лопатка поднимается, выдвигается, поворачивается вверх и вниз, отходит от рёбер и наклоняется.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-ac', prompt: ['Велосипедист упал на плечо: боль сверху над плечом, «ступенька» в конце ключицы. Какой сустав и что его держит?'],
    build: choice([
      ['Акромиально-ключичный — его держат только связки, прежде всего клювовидно-ключичная'],
      ['Плечевой — его держит манжета'],
      ['Грудино-ключичный — его держит большая грудная мышца'],
      ['Лопаточно-грудное сочленение — его держит капсула'],
    ], 0, 'Через акромиально-ключичный сустав не проходят мышцы; устойчивость дают акромиально-ключичные и клювовидно-ключичная связки.',
    [null, 'Ступенька — в конце ключицы, у акромиона.', 'Мышц через грудино-ключичный сустав нет, и боль не там.', 'У лопаточно-грудного сочленения нет капсулы.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-gh', prompt: ['Почему плечевой сустав так склонен к нестабильности?'],
    build: choice([
      ['Головка большая, впадина мелкая — контакт мал, устойчивость дают мягкие ткани и мышцы'],
      ['Впадина глубже, чем у тазобедренного сустава'],
      ['У сустава нет капсулы'],
      ['Его держит только кость'],
    ], 0, 'Неконгруэнтность: с впадиной соприкасается малая часть головки, поэтому устойчивость — это связки, губа, манжета и нервно-мышечный контроль.',
    [null, 'Наоборот — мелкая.', 'Капсула есть, и просторная.', 'Кости почти не держат.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
