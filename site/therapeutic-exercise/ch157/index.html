const SH = '#86c9e8', MU = '#f4a48c', LG = '#f1dfa0', FUN = '#f0c060', SP = '#8fd6b0', ENV = '#c9b8e8', BAD = COL.bad;
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : an === 'middle' ? x : x + (right ? 8 : -8), ly = an === 'middle' ? y + (ty > y ? 8 : -size) : y - size * .35;
  path(g, `M${lx} ${ly}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
const arw = (p, x1, y1, x2, y2, col, t0, w = 6) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 14, g = G(p, { o: 0 }); path(g, `M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}M${f1(x2 - h * Math.cos(a - .5))} ${f1(y2 - h * Math.sin(a - .5))}L${f1(x2)} ${f1(y2)}L${f1(x2 - h * Math.cos(a + .5))} ${f1(y2 - h * Math.sin(a + .5))}`, { stroke: col, 'stroke-width': w }); if (t0 !== null) show(g, t0); else put(g, { o: 1 }); return g; };
const floorLn = (p, x1, x2, y, t0) => show(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 }), t0);
const ring = (p, P, r, col, t0) => { const c = mk('circle', { cx: f1(P[0]), cy: f1(P[1]), r, fill: 'none', stroke: col, 'stroke-width': 4, opacity: 0 }, p); show(c, t0); return c; };
// an arc of the glenoid or the head (radius rr about the centre C of the joint, angles a0..a1) in stage coordinates
const arcOn = (j, conv, rr, a0, a1) => { const P = []; for (let a = a0; a <= a1; a += 4) P.push(j.at(conv(polar([0, 0], rr, a)))); return P; };

// a dial with a live number (degrees) under a caption
function dial(p, x, y, cap, col, t0) {
  const g = G(p, { x, y, o: 0 });
  mk('rect', { x: -96, y: -40, width: 192, height: 84, rx: 16, fill: PANEL, stroke: col, 'stroke-width': 2.5 }, g);
  T(g, cap, { x: 0, y: -12, size: 17, fill: col, weight: 700, anchor: 'middle' });
  const v = T(g, '0°', { x: 0, y: 30, size: 30, fill: COL.chalk, weight: 700, anchor: 'middle' });
  show(g, t0);
  return d => { v.textContent = Math.round(d) + '°'; };
}

  ['space', 'Подакромиальное пространство', (m, D) => {

    const j = ghJoint(p, 400, 450, 1.25, m('arch'), { delt: false });

    pillRow(p, ['ключица ~ 30°', '+ акромиально-ключичный ~ 30°'], 400, 858, m('crank', 10), { col: [SH, FUN], size: 17 });
    infoCard(p, 800, 90, 760, 140, 'первые 30°', 'поворот лопатки вверх — за счёт подъёма ключицы в грудино-ключичном суставе', SH, m('c30'), { size: 20 });
    infoCard(p, 800, 245, 760, 260, 'коленчатый вал', 'клювовидно-ключичная связка натягивается, ключица поворачивается вокруг оси на 38–55°; изогнутый наружный конец поднимается — лопатка ещё на 30° в акромиально-ключичном суставе. Потеря звена — меньше объём', FUN, m('crank'), { size: 19 });
    infoCard(p, 800, 520, 760, 230, 'Людевиг и соавт.', 'датчики на коже, 30 человек без жалоб и 9 с патологией, подъём руки до 115°: ключица поднималась на 11–15°, уходила назад на 15–29°, поворачивалась назад на 15–31°', COL.task, m('ev'), { size: 19 });
  }],

  ['rot', 'Вращение и пары сил', (m, D) => {
    const p = panel(0);
    txt(p, 'наружная ротация и баланс дельтовидной с манжетой', 800, 56, m('er'), { size: 28, weight: 700, anchor: 'middle', fill: SP });
    const ok = ghJoint(p, 210, 330, .72, m('er'), { delt: false }), no = ghJoint(p, 560, 330, .72, m('er'), { delt: false });
    const top = [txt(p, 'с наружной ротацией', 210, 120, m('er'), { size: 18, fill: SP, weight: 700, anchor: 'middle' }),
      txt(p, 'без неё', 560, 120, m('er'), { size: 18, fill: BAD, weight: 700, anchor: 'middle' })];
    prog(q => { const e = 75 * q; ok.set({ elev: e, er: 55 * q }); no.set({ elev: e, er: -60 * q, dy: -3 * q }); }, m('er', 1), 4);
    top.push(txt(p, 'проходит', 210, 600, m('er', 5.2), { size: 21, fill: SP, weight: 700, anchor: 'middle' }), txt(p, 'сдавление', 560, 600, m('er', 5.2), { size: 21, fill: BAD, weight: 700, anchor: 'middle' }));
    const v = txt(p, 'наружная ротация ≈ 55°', 210, 640, m('ev'), { size: 19, fill: SP, weight: 700, anchor: 'middle' });
    // forces on the head: the deltoid pulls up, the cuff presses in and down
    const j = ghJoint(p, 420, 470, 1.05, m('delt'), { delt: true, rhythm: false });
    j.set({ elev: 30 }); [ok.g, no.g, v, ...top].forEach(e => hide(e, m('delt'), .3));
    prog(q => j.delt.act(q), m('delt'), .8);
    const H = j.at('H');
    arw(p, H[0] + 10, H[1] - 10, H[0] + 40, H[1] - 120, BAD, m('delt', 1), 7);
    txt(p, 'дельтовидная — вверх', 60, 790, m('delt', 1), { size: 19, fill: BAD, weight: 700 });
    prog(q => j.ssp.act(q), m('cuff'), .8);
    arw(p, H[0] + 10, H[1] + 10, H[0] - 70, H[1] + 70, SP, m('cuff', .5), 7);
    txt(p, 'подостная, малая круглая, подлопаточная — внутрь и вниз', 60, 825, m('cuff', .5), { size: 19, fill: SP, weight: 700 });
    txt(p, 'надостная — прижимает и чуть вверх', 60, 860, m('cuff', 7), { size: 19, fill: MU, weight: 700 });
    infoCard(p, 800, 90, 760, 220, 'бугорок проходит под дугой', 'при подъёме руки плечо поворачивается наружу; мало ротации или слабы подостная и малая круглая — сдавление: боль, воспаление, потеря функции', SP, m('er'), { size: 19 });
    infoCard(p, 800, 325, 760, 110, 'наружная ротация', 'при подъёме во всех плоскостях — около 55°', SP, m('ev'), { size: 19 });
    infoCard(p, 800, 450, 760, 140, 'дельтовидная', 'тянет головку в основном вверх; без противодействия ткани ущемляются под дугой', BAD, m('delt'), { size: 19 });
    infoCard(p, 800, 605, 760, 265, 'манжета', 'подостная, малая круглая и подлопаточная прижимают и тянут головку вниз; надостная прижимает и слегка тянет вверх — вместе с дельтовидной поднимают руку и держат головку. Баланс нарушен — микротравма', SP, m('cuff'), { size: 19 });
  }],

  ['ref', 'Отражённая боль', (m, D) => {
    const p = panel(0);
    txt(p, 'боль в плече — не всегда из плеча', 800, 56, m('src'), { size: 28, weight: 700, anchor: 'middle', fill: ENV });
    const GY = 860, f = frontStand(p, 400, GY, 1.75, m('src'), { muscles: false });
    const zone = (P, rx, ry, col, t, r = 0) => { const e = mk('ellipse', { cx: f1(P[0]), cy: f1(P[1]), rx, ry, fill: col, 'fill-opacity': .45, stroke: col, 'stroke-width': 2, opacity: 0, transform: `rotate(${r} ${f1(P[0])} ${f1(P[1])})` }, p); show(e, t); return e; };
    const Sh = f.at(f.pts.Sh[0]), Sc = f.at(f.pts.Sc), E = f.at(f.pts.arms[0][0]);
    // dermatomes C4 and C5 on the viewer's left shoulder
    zone([lerp(Sc[0], Sh[0], .55), Sh[1] - 16], 70, 22, SH, m('src', 6), -12);
    lab(p, 'C4', 90, 300, lerp(Sc[0], Sh[0], .55), Sh[1] - 16, SH, m('src', 6), { anchor: 'start', size: 22 });
    zone([lerp(Sh[0], E[0], .45), lerp(Sh[1], E[1], .45)], 30, 70, FUN, m('src', 10));
    lab(p, 'C5', 90, 420, lerp(Sh[0], E[0], .45), lerp(Sh[1], E[1], .45), FUN, m('src', 10), { anchor: 'start', size: 22 });
    // organs
    const ShR = f.at(f.pts.Sh[1]);
    zone([lerp(Sc[0], ShR[0], .5), ShR[1] - 14], 60, 18, ENV, m('org'), 12);
    lab(p, 'диафрагма', 600, 260, lerp(Sc[0], ShR[0], .5), ShR[1] - 14, ENV, m('org'), { anchor: 'end', size: 18 });
    zone([ShR[0] - 30, ShR[1] + 80], 40, 50, BAD, m('org', 3));
    lab(p, 'сердце', 600, 470, ShR[0] - 30, ShR[1] + 80, BAD, m('org', 3), { anchor: 'start', size: 19 });
    zone([Sh[0] + 4, Sh[1] - 4], 26, 20, MU, m('org', 6.5));
    lab(p, 'желчный пузырь', 60, 210, Sh[0] + 4, Sh[1] - 4, MU, m('org', 6.5), { anchor: 'start', size: 19 });
    // nerve entrapment sites
    const nv = (P, t) => { const g = G(p, { x: P[0], y: P[1], o: 0 }); mk('circle', { r: 11, fill: '#f3c95c', stroke: COL.board, 'stroke-width': 3 }, g); show(g, t); return g; };
    nv([lerp(Sc[0], Sh[0], .25), Sh[1] - 40], m('nerve', 1)); nv([lerp(Sc[0], Sh[0], .55), Sh[1] + 10], m('nerve', 3)); nv([lerp(Sc[0], Sh[0], .85), Sh[1] + 30], m('nerve', 5));
    nv([E[0] + 10, lerp(Sh[1], E[1], .2)], m('nerve', 11));
    infoCard(p, 800, 90, 760, 220, 'из шеи', 'суставы C3–C4 и C4–C5, корешки C4 и C5. Дерматом C4 — над трапециевидной до края плеча, C5 — над дельтовидной и снаружи плеча', SH, m('src'), { size: 19 });
    infoCard(p, 800, 325, 760, 175, 'от органов', 'диафрагма — область верхней трапециевидной; сердце — левая подмышка и грудь; желчный пузырь — край плеча и область лопатки', ENV, m('org'), { size: 19 });
    infoCard(p, 800, 515, 760, 355, 'нервы', 'сплетение: межлестничный треугольник, рёберно-ключичный промежуток, под клювовидным отростком и малой грудной; надлопаточный — в вырезке лопатки (тяжёлый рюкзак на одном плече); лучевой — в подмышке на подмышечных костылях', '#f3c95c', m('nerve'), { size: 19 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-ref', prompt: ['Откуда эта боль?'],
    build: grid([
      { parts: ['Над трапециевидной до края плеча'], ans: ['c4'], why: 'Дерматом C4.' },
      { parts: ['Над дельтовидной и снаружи плеча'], ans: ['c5'], why: 'Дерматом C5.' },
      { parts: ['Левая подмышка и грудь при нагрузке'], ans: ['o'], why: 'Сердце — орган.' },
      { parts: ['Край правого плеча и лопатка после жирной еды'], ans: ['o'], why: 'Желчный пузырь.' },
      { parts: ['Онемение руки на подмышечных костылях'], ans: ['n'], why: 'Сдавление лучевого нерва в подмышке.' },
    ], [['c4', 'C4', SH], ['c5', 'C5', FUN], ['o', 'Орган', ENV], ['n', 'Нерв', '#f3c95c']], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Сутулость и короткая малая грудная уменьшают наклон лопатки назад и поворот наружу.', 'w1'],
     ['Ритм два к одному: лопатка поворачивается вверх, наклоняется назад и наружу — пространство под дугой сохраняется.', 'w2'],
     ['Ключица поднимается и проворачивается как коленчатый вал.', 'w3'],
     ['Наружная ротация и баланс дельтовидной с манжетой берегут ткани; боль может быть отражённой.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-sa', prompt: ['Пассивно рука поднимается полностью, сила отводящих мышц нормальная, но активно пациент поднимает её лишь до 90°, и лопатка «проваливается» вниз. Что вероятнее всего?'],
    build: choice([
      ['Слабость мышц, поворачивающих лопатку вверх: трапециевидной и передней зубчатой'],
      ['Разрыв дельтовидной мышцы'],
      ['Капсульное ограничение плечевого сустава'],
      ['Нормальный ритм'],
    ], 0, 'Без пары сил трапециевидная — передняя зубчатая дельтовидная и надостная поворачивают лопатку вниз и укорачиваются.',
    [null, 'Сила отведения нормальная.', 'Пассивный объём полный.', 'Лопатка должна поворачиваться вверх.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-er', prompt: ['При подъёме руки над головой у пациента боль в середине дуги. Плечо при этом почти не поворачивается наружу. Почему это важно?'],
    build: choice([
      ['Без наружной ротации большой бугорок не проходит под дугой и сдавливает сумку и сухожилие'],
      ['Наружная ротация ослабляет дельтовидную'],
      ['Ротация не влияет на подакромиальное пространство'],
      ['Нужна внутренняя ротация, чтобы освободить место'],
    ], 0, 'При подъёме плечо поворачивается наружу (около 55°): бугорок уходит назад из-под дуги.',
    [null, 'Нет.', 'Влияет напрямую.', 'Внутренняя ротация, наоборот, подводит бугорок под дугу.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
