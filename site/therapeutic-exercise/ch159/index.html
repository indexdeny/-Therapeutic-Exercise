  ['comp', 'Осложнения', (m, D) => {
    const p = panel(0);

    col(400, 'во время операции', ['мало удлинили тугую подлопаточную', 'подмышечный нерв → дельтовидная', 'надлопаточный нерв → над- и подостная', 'перелом плечевой кости'], m('c', 2), FUN);

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-impl', prompt: ['Какой протез?'],
    build: grid([
      { parts: ['Артроз, манжета цела, впадина изношена'], ans: ['t'], why: 'Тотальный: функция лучше.' },
      { parts: ['Массивный неисправимый разрыв манжеты с артропатией'], ans: ['r'], why: 'Реверсивный.' },
      { parts: ['Ревматоидный артрит, кости для впадины мало'], ans: ['h'], why: 'Гемиартропластика.' },
      { parts: ['Манжета не работает, головка смещена вверх'], ans: ['r'], why: 'Обычная впадина расшатается.' },
      { parts: ['Ревматоидный артрит, ткани восстановимы'], ans: ['t'], why: 'Полусвязанный тотальный.' },

  ['spec', 'Цели и положение', (m, D) => {
    const p = panel(0);
    txt(p, 'цели объёма и положение после операции', 800, 56, m('cuff'), { size: 28, weight: 700, anchor: 'middle', fill: SH });
    pillRow(p, ['манжета цела → подвижность', 'манжету шили или были вывихи → устойчивость'], 400, 120, m('cuff', 4), { col: [SP, MU], size: 16, space: 8 });
    // range goals: two gauges
    const gauge = (cx, cy, title, segs, t0) => {
      const g = G(p, { o: 0 }); show(g, t0);
      T(g, title, { x: cx, y: cy - 150, size: 20, fill: COL.chalk, weight: 700, anchor: 'middle' });
      path(g, `M${cx - 120} ${cy}A120 120 0 0 1 ${cx + 120} ${cy}`, { stroke: COL.faint, 'stroke-width': 14, fill: 'none' });
      segs.forEach(([a0, a1, c, s, k]) => {   // angles 0..180 along the arc
        const P0 = polar([cx, cy], 120, 180 + a0), P1 = polar([cx, cy], 120, 180 + a1);
        path(g, `M${f1(P0[0])} ${f1(P0[1])}A120 120 0 0 1 ${f1(P1[0])} ${f1(P1[1])}`, { stroke: c, 'stroke-width': 14, fill: 'none' });
        const L = polar([cx, cy], 160, 180 + (a0 + a1) / 2);
        T(g, s, { x: L[0], y: L[1] + (k || 0), size: 16, fill: c, weight: 700, anchor: 'middle' });
      });
      return g;
    };
    const g1 = gauge(210, 400, 'тотальный', [[140, 150, SP, 'подъём 140–150°', -6], [45, 50, FUN, 'НР 45–50°', 14]], m('rom', 1));
    const g2 = gauge(590, 400, 'реверсивный, 3 мес', [[90, 120, MU, 'подъём 90–120°', -6], [0, 20, BAD, 'НР 0–20°', 20]], m('rom', 7));
    // position in bed: arm in a sling, forearm on the belly, a towel roll under the elbow
    [g1, g2].forEach(e => hide(e, m('pos')));
    matLine(p, 80, 720, 700, m('pos'));
    const f = lieFig(p, 640, 700, .62, m('pos'), 'supine', { arm: 18, elb: -8 });
    const E = f.at ? f.stage(f.geo.E || f.geo.W) : [0, 0];
    const roll = mk('ellipse', { cx: f1(E[0]), cy: 682, rx: 18, ry: 14, fill: ENV, stroke: mix(ENV, '#000000', .35), 'stroke-width': 2, opacity: 0 }, p); show(roll, m('pos', 6));
    lab(p, 'валик под локтем, предплечье на животе', 120, 560, E[0], 682, ENV, m('pos', 6), { anchor: 'start', size: 17 });
    txt(p, 'изголовье поднято на 30°', 400, 790, m('pos', 9), { size: 18, fill: FUN, weight: 700, anchor: 'middle' });
    infoCard(p, 800, 90, 760, 175, 'индивидуально, с хирургом', 'манжета была цела — быстрее вернуть подвижность; манжету шили или были вывихи — акцент на устойчивости', SH, m('cuff'), { size: 19 });
    infoCard(p, 800, 280, 760, 220, 'цели объёма', 'тотальный: активный объём как на операции, в идеале 140–150° подъёма и 45–50° наружной ротации; реверсивный: наружная ротация 0–20°, подъём 90–120° на 3 месяца', FUN, m('rom'), { size: 19 });
    infoCard(p, 800, 515, 760, 255, 'положение лёжа', 'рука в косынке, локоть под 90°, предплечье на животе, валик под локтем — плечо в небольшом сгибании и отведении; изголовье на 30°. Реверсивный: косынка с бандажом постоянно 3–4 недели', ENV, m('pos'), { size: 19 });
  }],

  ['ph1', 'Максимальная защита', (m, D) => {
    const p = panel(0);

    sec(-60, 30, SP, m('pre', 8)); sec(30, 90, BAD, m('pre', 8));
    prog(q => r.set(30 * cyc(q, 1.5)), m('pre', 9), 4);
    kg(p, 'наружная ротация < 30°', 250, 140, m('pre', 8), SP);
    kg(p, 'реверсивный — только до нейтрали', 250, 170, m('pre', 11), MU);
    pillRow(p, ['без переразгибания', 'без горизонтального отведения за нейтраль', 'нет активной внутренней ротации'], 400, 500, m('pre', 18), { col: BAD, size: 14, space: 6, gap: 1 });

    txt(p, 'в книге — 1 фунт', 520, 626, m('adl', 5), { size: 15, fill: COL.dim, weight: 600 });

    // exercises: passive elevation in the plane of the scapula, supine
    matLine(p, 80, 720, 860, m('ex'));
    const f = lieFig(p, 640, 860, .5, m('ex'), 'supine');
    prog(q => f.set({ arm: 120 * cyc(q, 2), elb: 10 }), m('ex', 1), 9);
    txt(p, 'пассивно, в плоскости лопатки', 400, 760, m('ex', 1), { size: 17, fill: SP, weight: 700, anchor: 'middle' });
    infoCard(p, 800, 90, 760, 300, 'ограничения', 'занятия короткие, 4–5 раз в день; только пассивные и вспомогательные движения в безопасных пределах, без растяжки в конце объёма; наружная ротация < 30° (реверсивный — до нейтрали), чтобы не растянуть подлопаточную; плечо на полотенце; нет активной внутренней ротации и сопротивления', BAD, m('pre'), { size: 18 });
    infoCard(p, 800, 405, 760, 160, 'в быту', 'есть, писать; не за спину, не опираться, не тяжелее чашки (≈ 0,5 кг); косынка во сне и в толпе; не водить 4–6 недель', FUN, m('adl'), { size: 18 });
    infoCard(p, 800, 580, 760, 155, 'упражнения', 'лопатка и позвоночник, кисть, локоть; пассивный подъём, ротации, маятник; затем помощь здоровой рукой, палка, стол, блок', SP, m('ex'), { size: 18 });
    infoCard(p, 800, 750, 760, 120, 'дальше', '≥ 90° пассивного подъёма, 45° НР, 70° ВР без боли; изометрия подлопаточной без боли', SH, m('crit'), { size: 18 });
  }],

  ['ph23', 'Умеренная защита и возврат', (m, D) => {
    const p = panel(0);
    txt(p, 'от 4–6 до 12–16 недель и дальше', 800, 56, m('ph2'), { size: 28, weight: 700, anchor: 'middle', fill: SH });
    const X0 = 80, X1 = 720, wk = w => lerp(X0, X1, w / 26), Y = 140;
    path(p, `M${X0} ${Y}H${X1}`, { stroke: COL.dim, 'stroke-width': 3 }, { o: 0 });
    [[0, 5, BAD, 'защита'], [5, 14, FUN, 'умеренная'], [14, 26, SP, 'возврат к функции']].forEach(([a, b, c, s], i) => {
      const t0 = [m('ph2') - 1, m('ph2'), m('ph3')][i], r2 = mk('rect', { x: wk(a), y: Y - 14, width: wk(b) - wk(a), height: 28, rx: 8, fill: c, opacity: 0 }, p);
      show(r2, Math.max(.1, t0)); txt(p, s, (wk(a) + wk(b)) / 2, Y - 26, Math.max(.1, t0), { size: 16, fill: c, weight: 700, anchor: 'middle' });
    });
    [0, 6, 16, 26].forEach(w => txt(p, w + ' нед', wk(w), Y + 40, m('ph2'), { size: 15, fill: COL.dim, weight: 600, anchor: 'middle' }));
    // lifting limits (pounds in the book)
    const lim = (y, s, book, col, t0) => { pill(p, s, 280, y, t0, { col, size: 17 }); txt(p, 'в книге — ' + book, 480, y + 6, t0, { size: 15, fill: COL.dim, weight: 600 }); };
    lim(250, 'одной рукой ≤ 1,4 кг', '3 фунта', FUN, m('ph2', 18));
    lim(300, 'реверсивный ≤ 2,7 кг после 12–16 нед', '6 фунтов', MU, m('ph2', 21));
    lim(560, 'двумя руками 4,5–7 кг', '10–15 фунтов', SP, m('ph3', 11));
    pillRow(p, ['плавание', 'гольф', 'без тяжёлых и ударных нагрузок'], 400, 615, m('ph3', 7), { col: SP, size: 16, gap: 1 });
    // outcome: flexion before and after (osteoarthritis)
    const ev = G(p, { o: 0 }); show(ev, m('out', 5));

      const v2 = T(ev, '', { x: 190, y: y + 3, size: 18, fill: COL.chalk, weight: 700 });
      prog(q => { b.setAttribute('width', f1(3 * v * q)); put(v2, { x: 190 + 3 * v * q }); v2.textContent = Math.round(v * q) + '°'; }, m('out', 5.5 + i * .5), 1);
    });
    txt(p, 'ключ — работающая манжета', 400, 850, m('out', 14), { size: 20, fill: SH, weight: 700, anchor: 'middle' });
    infoCard(p, 800, 90, 760, 270, 'умеренная защита', 'мягкая растяжка до объёма с операции, активные движения без поднимания плеча, изометрия манжеты, стабилизация с лёгкой опорой (реверсивный — без опоры до 12 нед), лёгкие гантели и лента до 90°, ручной эргометр', FUN, m('ph2'), { size: 18 });
    infoCard(p, 800, 375, 760, 130, 'дальше, если', 'сгибание 130–140°, отведение 120°, активный подъём 100–120° без поднимания плеча, сила 4/5', SH, m('crit2'), { size: 18 });
    infoCard(p, 800, 520, 760, 170, 'возврат к функции', 'растяжка в конце объёма, многократные лёгкие упражнения с сопротивлением, опора; тяжёлое и ударное изменить, чтобы протез не расшатался', SP, m('ph3'), { size: 18 });
    infoCard(p, 800, 705, 760, 165, 'итог', 'боль уходит почти у всех (артроз — у 90%); объём меньше: при артрозе сгибание 105° → 161°, при РА 75–105°', COL.task, m('out'), { size: 18 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-adl', prompt: ['Можно или нельзя в первые недели?'],
    build: grid([
      { parts: ['Писать и есть за столом'], ans: ['y'], why: 'Можно: дела на уровне пояса.' },
      { parts: ['Заправить рубашку за спиной'], ans: ['n'], why: 'Нельзя: разгибание, приведение и внутренняя ротация вместе.' },
      { parts: ['Поднять чашку чая'], ans: ['y'], why: 'Можно — не тяжелее чашки.' },
      { parts: ['Опереться на руку, вставая со стула'], ans: ['n'], why: 'Нельзя.' },
      { parts: ['Активная внутренняя ротация против сопротивления'], ans: ['n'], why: 'Нельзя: подлопаточная пришита.' },
    ], [['y', 'Можно', COL.good], ['n', 'Нельзя', COL.bad]], { multi: false, text: true }),

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Тотальный протез — при целой манжете; реверсивный — при неисправимой; гемиартропластика — когда впадина цела или кости мало.', 'w1'],
     ['Подлопаточную отсекают и пришивают — поэтому ограничена наружная ротация и нельзя активную внутреннюю.', 'w2'],
     ['Первые недели — пассивные движения в безопасных пределах, дела на уровне пояса, ничего тяжелее чашки.', 'w3'],
     ['Главный итог — уход боли; объём зависит от манжеты.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });

      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-sub', prompt: ['Через 2 недели после тотального эндопротезирования пациент просит упражнение «кисть за спину», чтобы самому одеваться. Ответ?'],
    build: choice([
      ['Пока нельзя: подлопаточная пришита — без сочетания разгибания, приведения и внутренней ротации, без активной внутренней ротации'],
      ['Можно, если делать медленно'],
      ['Можно с лёгкой гантелью'],
      ['Нужно делать как можно раньше, иначе будет контрактура'],
    ], 0, 'В фазе максимальной защиты берегут шов подлопаточной: эти позиции её растягивают и нагружают.',
    [null, 'Скорость не меняет натяжения шва.', 'Сопротивление тем более нельзя.', 'Сначала — защита шва.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-rev', prompt: ['Пациент после реверсивного протеза спрашивает, какой объём реален через 3 месяца. Что ответить?'],
    build: choice([
      ['Подъём руки около 90–120°, наружная ротация 0–20°; главное — уход боли'],
      ['Полный объём, как у здорового плеча'],
      ['Наружная ротация 45–50°, подъём 150°'],
      ['Рука не будет подниматься выше 30°'],
    ], 0, 'Реверсивный протез даёт устойчивость при неисправимой манжете, но объём меньше.',
    [null, 'Без манжеты так не бывает.', 'Это цели для тотального протеза.', 'Слишком пессимистично.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
