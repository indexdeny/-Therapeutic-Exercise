function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);

  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {

  if (t0 !== null) show(g, t0);

}

const floorLn = (p, x1, x2, y, t0) => show(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 }), t0);

// an arc of the glenoid or the head (radius rr about the centre C of the joint, angles a0..a1) in stage coordinates
const arcOn = (j, conv, rr, a0, a1) => { const P = []; for (let a = a0; a <= a1; a += 4) P.push(j.at(conv(polar([0, 0], rr, a)))); return P; };

// an arc 0..180° of arm elevation with a highlighted painful part
function arcGauge(p, cx, cy, r, t0, segs, { label = 'подъём руки' } = {}) {

  path(g, arcD(0, 180), { stroke: COL.faint, 'stroke-width': 16, fill: 'none' });
  segs.forEach(([a0, a1, col, s]) => { path(g, arcD(a0, a1), { stroke: col, 'stroke-width': 16, fill: 'none' }); const L = polar([cx, cy], r + 30, 90 - (a0 + a1) / 2); T(g, s, { x: L[0] + 6, y: L[1] + 6, size: 18, fill: col, weight: 700 }); });

}

}

// the acromion in a side (outlet) view over the humeral head: 1 flat, 2 curved, 3 hooked (front — to the right)
function acrProfile(p, cx, cy, type, t0, col) {

  const U = []; for (let x = -95; x <= 95; x += 5) U.push([x, under(x)]);
  mk('path', { d: ptsD([[-100, -45], [100, -45], ...U.slice().reverse()], true), fill: boneGrad(defs, 0, 0, 0, 1), stroke: mix(ANAT.bone, '#000000', .5), 'stroke-width': 2, 'stroke-linejoin': 'round' }, g);

  const T2 = []; for (let a = 236; a <= 304; a += 4) T2.push(polar([0, 175], 151, a));
  path(g, ptsD(T2), { stroke: ANAT.tendon, 'stroke-width': 14, 'stroke-linecap': 'round' });
  if (type === 3) mk('circle', { cx: 74, cy: 34, r: 16, fill: 'none', stroke: BAD, 'stroke-width': 3 }, g);
  show(g, t0); return g;
}
