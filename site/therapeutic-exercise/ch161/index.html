const SH = '#86c9e8', MU = '#f4a48c', LG = '#f1dfa0', FUN = '#f0c060', SP = '#8fd6b0', ENV = '#c9b8e8', BAD = COL.bad;
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : an === 'middle' ? x : x + (right ? 8 : -8), ly = an === 'middle' ? y + (ty > y ? 8 : -size) : y - size * .35;
  path(g, `M${lx} ${ly}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
const arw = (p, x1, y1, x2, y2, col, t0, w = 6) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 14, g = G(p, { o: 0 }); path(g, `M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}M${f1(x2 - h * Math.cos(a - .5))} ${f1(y2 - h * Math.sin(a - .5))}L${f1(x2)} ${f1(y2)}L${f1(x2 - h * Math.cos(a + .5))} ${f1(y2 - h * Math.sin(a + .5))}`, { stroke: col, 'stroke-width': w }); if (t0 !== null) show(g, t0); else put(g, { o: 1 }); return g; };
const floorLn = (p, x1, x2, y, t0) => show(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 }), t0);
const ring = (p, P, r, col, t0) => { const c = mk('circle', { cx: f1(P[0]), cy: f1(P[1]), r, fill: 'none', stroke: col, 'stroke-width': 4, opacity: 0 }, p); show(c, t0); return c; };
// an arc of the glenoid or the head (radius rr about the centre C of the joint, angles a0..a1) in stage coordinates
const arcOn = (j, conv, rr, a0, a1) => { const P = []; for (let a = a0; a <= a1; a += 4) P.push(j.at(conv(polar([0, 0], rr, a)))); return P; };

// zig-zag strokes across a point: transverse friction massage
function friction(p, P, ang, col, t0, dur = 4) {
  const g = G(p, { x: P[0], y: P[1], r: ang, o: 0 });
  path(g, 'M-26 -18L-14 18L-2 -18L10 18L22 -18', { stroke: col, 'stroke-width': 4, 'stroke-linejoin': 'round' });
  arw(g, -30, 30, 30, 30, col, null, 3); arw(g, 30, 38, -30, 38, col, null, 3);
  show(g, t0); prog(q => put(g, { x: P[0] + 6 * Math.sin(q * 40), y: P[1] }), t0, dur, lin);
  return g;
}
// a timer ring filling to a fraction, with a caption in the middle
function timer(p, cx, cy, r, cap, col, t0, dur, to = 1) {
  const g = G(p, { o: 0 }); show(g, t0);
  mk('circle', { cx, cy, r, fill: PANEL, stroke: COL.faint, 'stroke-width': 10 }, g);
  const arc = path(g, '', { stroke: col, 'stroke-width': 10, fill: 'none', 'stroke-linecap': 'round' });
  T(g, cap, { x: cx, y: cy + 10, size: 28, fill: col, weight: 700, anchor: 'middle' });
  prog(q => { const a = 359.9 * to * q, A = polar([cx, cy], r, -90), B = polar([cx, cy], r, -90 + a); arc.setAttribute('d', a < .5 ? '' : `M${f1(A[0])} ${f1(A[1])}A${r} ${r} 0 ${a > 180 ? 1 : 0} 1 ${f1(B[0])} ${f1(B[1])}`); }, t0 + .3, dur);
  return g;
}
const QUAD = { ...STAND, t: 66, hN: 66, kN: 90, hF: 66, kF: 90, aN: 66, aF: 66, eN: 0, eF: 0, fN: -90, fF: -90 };

  ['post', 'Осанка и тейп', (m, D) => {
    const p = panel(0);
    txt(p, 'коррекция осанки', 800, 56, m('aw'), { size: 28, weight: 700, anchor: 'middle', fill: SH });

    floorLn(p, 80, 720, GY, m('aw'));

  ['bal', 'Баланс мышц', (m, D) => {

    infoCard(p, 800, 230, 760, 95, 'манжета', 'с акцентом на наружные вращатели', SH, m('cuff'), { size: 18 });

    infoCard(p, 800, 515, 760, 190, 'закрытая цепь', 'стена, стол, пол на четвереньках; чередующаяся изометрия или ритмическая стабилизация; лопатка «отходит крылом» — облегчить положение или угол', MU, m('cc'), { size: 18 });

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-bal', prompt: ['Растягивать или укреплять?'],
    build: grid([
      { parts: ['Малая грудная'], ans: ['s'], why: 'Растягивать — она укорочена.' },
      { parts: ['Передняя зубчатая'], ans: ['u'], why: 'Укреплять — наклон назад и поворот вверх.' },
      { parts: ['Широчайшая'], ans: ['s'], why: 'Растягивать.' },
      { parts: ['Нижняя трапециевидная'], ans: ['u'], why: 'Укреплять.' },
      { parts: ['Наружные вращатели'], ans: ['u'], why: 'Укреплять — акцент в манжете.' },
    ], [['s', 'Растягивать', MU], ['u', 'Укреплять', SP]], { multi: false, text: true }),
  }], done) }],

  ['ret', 'Возврат к функции', (m, D) => {
    const p = panel(0);

    pillRow(p, ['эксцентрика до максимума', 'спокойно → ускорения и торможения'], 400, 440, m('func'), { col: MU, size: 16, gap: 2, space: 8 });
    const bx = infoCard(p, 60, 500, 680, 370, 'блок 17.7 — профилактика', null, SH, m('box'));
    ['перед работой: массаж сухожилия, изометрия, полный объём, растяжка', 'перерывы в повторной работе, чередовать движения', 'правильная поза, удобное рабочее место', 'тренер и подходящий инвентарь', 'перед новой нагрузкой — подготовительная программа'].forEach((s, i) => txt(p, '• ' + s, 90, 590 + i * 54, m('box', 2 + i * 2.4), { size: 18, fill: COL.chalk, weight: 600 }));
    infoCard(p, 800, 90, 760, 130, 'когда', 'пациент контролирует позу и выполняет элементы нужных действий без обострения', SP, m('spec'), { size: 19 });

    infoCard(p, 800, 355, 760, 150, 'быстрые ответы', 'стабилизация быстрее, короткие удержания, быстрая смена направления; при необходимости мощности — плиометрика в открытой и закрытой цепи', FUN, m('fast'), { size: 19 });
    infoCard(p, 800, 520, 760, 175, 'нужные действия', 'эксцентрика до максимальной нагрузки; сначала спокойно, потом с ускорениями и торможениями; пациент сам оценивает безопасность, симптомы, позу и исправляет ошибки', MU, m('func'), { size: 19 });

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-phase', prompt: ['Какая это фаза?'],
    build: grid([
      { parts: ['Поперечный массаж, безболезненная изометрия, временно косынка'], ans: ['p'], why: 'Защита.' },
      { parts: ['Движение с мобилизацией при болезненной дуге'], ans: ['c'], why: 'Контролируемое движение.' },
      { parts: ['Удерживать стабилизацию около 3 минут'], ans: ['c'], why: 'Цель фазы контролируемого движения.' },
      { parts: ['Плиометрика и быстрая смена направления'], ans: ['r'], why: 'Возврат к функции.' },
      { parts: ['Эксцентрика до максимальной нагрузки'], ans: ['r'], why: 'Возврат к функции.' },
    ], [['p', 'Защита', BAD], ['c', 'Контролируемое', FUN], ['r', 'Возврат', SP]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Сначала — погасить воспаление и исключить провоцирующие позиции.', 'w1'],
     ['Коррекция осанки и тейпирование увеличивают безболезненный подъём руки.', 'w2'],
     ['Растянуть грудные и широчайшую, укрепить переднюю зубчатую, трапециевидную и наружные вращатели; стабилизация — до 3, затем 5 минут.', 'w3'],
     ['В конце — скорость, эксцентрика, нужные действия и профилактика.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SP }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-swim', prompt: ['Пловчиха с острой болью под акромионом: ночью болит, дуга 60–120°. С чего начать?'],
    build: choice([
      ['Погасить воспаление: процедуры, поперечный массаж, безболезненные движения и изометрия, исключить провоцирующие позиции'],
      ['Сразу плиометрика, чтобы вернуться к соревнованиям'],
      ['Растяжка «кисть за спиной» до боли'],
      ['Маятник с тяжёлой гантелью'],
    ], 0, 'Даже при давней боли сначала гасят воспаление — фаза защиты.',
    [null, 'Это фаза возврата к функции.', 'Конец объёма с растянутой мышцей — провоцирует.', 'Без груза, только II степень.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-prev', prompt: ['Маляр вернулся к работе над головой. Что из блока профилактики ему подходит?'],
    build: choice([
      ['Перед сменой — изометрия, полный объём и растяжка; перерывы и чередование движений; удобное положение и инструмент'],
      ['Работать без перерывов, чтобы закончить быстрее'],
      ['Отказаться от упражнений после выздоровления'],
      ['Начать с максимального объёма работы в первый же день'],
    ], 0, 'Блок 17.7: разогрев, перерывы, чередование, эргономика и постепенная подготовка к нагрузке.',
    [null, 'Перерывы — часть профилактики.', 'Программа продолжается.', 'Нужна подготовительная программа.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
