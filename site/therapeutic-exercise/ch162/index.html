<script>
'use strict';
const CHAPTER = { number: 162, title: 'Субакромиальная декомпрессия', minutes: 8, language: 'ru', next: '../ch163/' };
// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch162/cards.ru.json
const CARDS_SHORT = {
  "что это\nесли консервативное лечение не помогло, при первичном соударении увеличивают подакромиальное пространство; обычно с акромиопластикой — изменением формы акромиона": "+ акромиопластика",
  "показания\nболь над головой и потеря подвижности 3–6 месяцев и дольше, несмотря на лечение; II стадия по Ниру с необратимым фиброзом или костными изменениями, кальцинаты, болезненный хруст; манжета цела или почти цела": "3–6 месяцев, несмотря на лечение",
  "не одна\nгипермобильность или нестабильность с разрывом манжеты — декомпрессию сочетают со швом, иначе нестабильность может усилиться": "+ шов манжеты",
  "доступ\nсегодня — артроскопия: дельтовидную не отсекают, рука быстрее возвращается в дело; открытый (с отсечением) — для массивных разрывов с открытым швом; «мини-открытый» — дельтовидную расслаивают": "артроскопия: дельтовидную не отсекают",
  "шаги\nудалить утолщённую сумку, освободить и частично удалить клювовидно-акромиальную связку, сбрить передний выступ и выровнять акромион, удалить остеофиты АК сустава; при выраженном артрозе — конец ключицы": "сумка, связка, выступ, остеофиты",
  "после операции\nрука в косынке у тела или в лёгком отведении и внутренней ротации, локоть 90°; косынка 1–2 недели, упражнения — со следующего дня": "косынка 1–2 недели",
  "цель\nпочти полный пассивный объём к 4–6 неделям; активные движения — когда безболезненны и лопатка под контролем, иногда через 2 недели": "полный пассивный объём к 4–6 неделям",
  "движение\nс помощью — здоровой рукой, затем палкой; лёжа на спине, плечо на полотенце в лёгком отведении и сгибании; подъём, отведение, ротации; затем полулёжа, сидя, стоя; разгибание — палка за спиной; рука поперёк груди, если не больно": "здоровой рукой, палкой",
  "изометрия\nчерез неделю — безболезненно под несколькими углами с опорой, лёгкое сопротивление здоровой рукой; стабилизация лопатки с поддержкой руки": "через неделю, безболезненно",
  "мобилизация и растяжка\nзаднее и нижнее скольжение, подвижность лопатки; поднимающая лопатку, ромбовидные, подлопаточная, широчайшая, большая круглая, грудные; задняя капсула; разгибание груди на валике": "скольжения + растяжка + валик",

  "сначала ниже плеча\nнад головой — если не больно; сопротивление выше плеча — только когда рука поднимается без подъёма лопатки": "выше плеча — без подъёма лопатки",
  "финальная фаза\nобычно с 8 недель до 12–16: сила и выносливость в отдельных движениях и в имитации нужных дел; спортсменам — плиометрика; функция улучшается до 6 месяцев": "плиометрика; до 6 месяцев",
  "итоги\nоткрытая и артроскопическая операции в отдалённом периоде не различаются: 85–95% хороших и отличных через 1–2,5 года; меньше довольны метатели и получающие компенсацию": "85–95% хороших",
  "артроскопия\nменьше боли, раньше полный объём и сила, на работу иногда через неделю, дешевле и косметичнее": "меньше боли, раньше на работу",
  "рандомизированное\n6 недель раз в неделю с терапевтом против инструктажа перед выпиской: через 6 недель, 3, 6 и 12 месяцев результаты не различались; через 3 месяца боль даже выше в группе с терапевтом": "результаты не различались",

// cards-short end

const SH = '#86c9e8', MU = '#f4a48c', LG = '#f1dfa0', FUN = '#f0c060', SP = '#8fd6b0', ENV = '#c9b8e8', BAD = COL.bad;
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : an === 'middle' ? x : x + (right ? 8 : -8), ly = an === 'middle' ? y + (ty > y ? 8 : -size) : y - size * .35;
  path(g, `M${lx} ${ly}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
const arw = (p, x1, y1, x2, y2, col, t0, w = 6) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 14, g = G(p, { o: 0 }); path(g, `M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}M${f1(x2 - h * Math.cos(a - .5))} ${f1(y2 - h * Math.sin(a - .5))}L${f1(x2)} ${f1(y2)}L${f1(x2 - h * Math.cos(a + .5))} ${f1(y2 - h * Math.sin(a + .5))}`, { stroke: col, 'stroke-width': w }); if (t0 !== null) show(g, t0); else put(g, { o: 1 }); return g; };
const floorLn = (p, x1, x2, y, t0) => show(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 }), t0);
const ring = (p, P, r, col, t0) => { const c = mk('circle', { cx: f1(P[0]), cy: f1(P[1]), r, fill: 'none', stroke: col, 'stroke-width': 4, opacity: 0 }, p); show(c, t0); return c; };
// an arc of the glenoid or the head (radius rr about the centre C of the joint, angles a0..a1) in stage coordinates
const arcOn = (j, conv, rr, a0, a1) => { const P = []; for (let a = a0; a <= a1; a += 4) P.push(j.at(conv(polar([0, 0], rr, a)))); return P; };

// acromioplasty on the joint model: the hooked acromion and the AC spur are shaved, the bursa removed
function decompress(j, t0) { whenAt(t0, () => { j.acType = 1; j.spur = false; j.drawArch(); j.set(); }); }
// a checklist of criteria that tick one by one
function checklist(p, x, y, items, t0, gap, col = SP, { size = 18, dy = 40 } = {}) {
  return items.map((s, i) => { const t = t0 + i * gap, g = G(p, {}); checkMark(g, x + 12, y + i * dy - 6, t, col, .9); txt(g, s, x + 34, y + i * dy, t, { size, fill: COL.chalk, weight: 600 }); return g; });
}
// a standing figure turning an arm ergometer (hands at shoulder height or lower)
function ergoFig(p, ax, GY, s, t0) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...STAND, t: 6 } }); plant(f, 'AN', ax, GY);
  const Sh = onStage(f, 'Sh'), C = [Sh[0] + 120 * s, Sh[1] + 40 * s], r = 28 * s;
  const dv = G(p, { o: 0 }); path(dv, `M${f1(C[0])} ${f1(C[1])}L${f1(C[0] + 20 * s)} ${GY}M${f1(C[0] - 30 * s)} ${GY}H${f1(C[0] + 70 * s)}`, { stroke: COL.dim, 'stroke-width': 6 });
  mk('circle', { cx: f1(C[0]), cy: f1(C[1]), r: f1(r), fill: 'none', stroke: COL.dim, 'stroke-width': 3 }, dv);
  p.insertBefore(dv, f.g);
  const set = k => { const a = 2 * Math.PI * k, A = [C[0] + r * Math.cos(a), C[1] + r * Math.sin(a)], B = [C[0] - r * Math.cos(a), C[1] - r * Math.sin(a)]; reach(f, 'N', ...A); reach(f, 'F', ...B); };
  set(0); show(f.g, t0); show(dv, t0);
  return set;
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Декомпрессия', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 17 · Урок 162', { x: 800, y: 130, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'Субакромиальная декомпрессия', { x: 800, y: 215, size: 56, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'кому операция · что делает хирург · восстановление по фазам', 800, 300, m('sub'), { size: 28, fill: SH, anchor: 'middle', weight: 600 });
    const art = G(scene, { o: 0 });
    const j = ghJoint(art, 800, 620, .62, null, { acType: 3, spur: true }); put(j.g, { o: 1 });
    j.set({ elev: 60, er: -30 });
    decompress(j, 4);
    show(art, .3);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);
  }],

  ['ind', 'Показания', (m, D) => {
    const p = panel(0);
    txt(p, 'освободить место под дугой', 800, 56, m('what'), { size: 28, weight: 700, anchor: 'middle', fill: SH });
    const j = ghJoint(p, 380, 420, 1.0, m('what'), { acType: 3, spur: true });
    prog(q => j.set({ elev: 65 * q, er: -30 * q }), m('what', 1), 2);
    const st = txt(p, 'до: сдавление', 380, 760, m('what', 3), { size: 20, fill: BAD, weight: 700, anchor: 'middle' });
    decompress(j, m('what', 8));
    whenAt(m('what', 8), () => { st.textContent = 'после акромиопластики: просторно'; st.setAttribute('fill', SP); });
    lab(p, 'передний выступ сбрит', 560, 150, ...j.at('acro'), SP, m('what', 8.5), { anchor: 'start', size: 17 });
    pillRow(p, ['3–6 мес и дольше', 'Нир II: фиброз, костные изменения'], 400, 810, m('ind', 1), { col: FUN, size: 15, gap: 2, space: 8 });
    pillRow(p, ['кальцинаты, хруст', 'манжета цела'], 400, 855, m('ind', 6), { col: FUN, size: 15, gap: 2, space: 8 });
    infoCard(p, 800, 90, 760, 205, 'что это', 'если консервативное лечение не помогло, при первичном соударении увеличивают подакромиальное пространство; обычно с акромиопластикой — изменением формы акромиона', SH, m('what'), { size: 19 });
    infoCard(p, 800, 310, 760, 250, 'показания', 'боль над головой и потеря подвижности 3–6 месяцев и дольше, несмотря на лечение; II стадия по Ниру с необратимым фиброзом или костными изменениями, кальцинаты, болезненный хруст; манжета цела или почти цела', FUN, m('ind'), { size: 19 });
    infoCard(p, 800, 575, 760, 175, 'не одна', 'гипермобильность или нестабильность с разрывом манжеты — декомпрессию сочетают со швом, иначе нестабильность может усилиться', BAD, m('no'), { size: 19 });
  }],

  ['proc', 'Операция', (m, D) => {
    const p = panel(0);
    txt(p, 'доступы и что делает хирург', 800, 56, m('app'), { size: 28, weight: 700, anchor: 'middle', fill: SH });
    // three approaches: the deltoid intact (portals), split along its fibres, detached and sewn back
    const ap = [['артроскопия', SP], ['мини-открытый', FUN], ['открытый', BAD]].map(([s, c], i) => {
      const x = 140 + i * 230, g = G(p, { o: 0 }); show(g, m('app', [0, 9, 6][i] + .5));
      mk('path', { d: `M${x - 50} 150Q${x} 120 ${x + 50} 150L${x + 40} 330Q${x} 345 ${x - 40} 330Z`, fill: ANAT.muscle, stroke: mix(ANAT.muscle, '#000000', .4), 'stroke-width': 2 }, g);
      for (let k = -2; k <= 2; k++) path(g, `M${x + k * 16} 140L${x + k * 14} 330`, { stroke: mix(ANAT.muscle, '#ffffff', .4), 'stroke-width': 1.5 });
      if (i === 0) [[-20, 200], [22, 230], [0, 280]].forEach(([dx, y]) => mk('circle', { cx: x + dx, cy: y, r: 6, fill: COL.board, stroke: SP, 'stroke-width': 2 }, g));
      if (i === 1) path(g, `M${x} 150L${x} 270`, { stroke: COL.board, 'stroke-width': 6 });
      if (i === 2) { path(g, `M${x - 46} 160H${x + 46}`, { stroke: COL.board, 'stroke-width': 7 }); }
      T(g, s, { x, y: 380, size: 19, fill: c, weight: 700, anchor: 'middle' });
      T(g, ['не отсекают', 'расслаивают вдоль', 'отсекают и пришивают'][i], { x, y: 408, size: 15, fill: COL.chalk, weight: 600, anchor: 'middle' });
      return g;
    });
    ap.forEach(g => hide(g, m('comp')));
    // the steps on the model
    const j = ghJoint(p, 380, 470, .95, m('comp'), { acType: 3, spur: true });
    j.set({ elev: 20 });
    const steps = [['сумка удалена', 1, () => put(j.bursa, { o: 0 })], ['связка освобождена', 4.5, () => {}], ['передний выступ сбрит', 9, () => { j.acType = 1; j.drawArch(); j.set(); }], ['остеофиты АК сустава удалены', 11.5, () => { j.spur = false; j.drawArch(); j.set(); }]];
    steps.forEach(([s, t, fn]) => whenAt(m('comp', t), fn));
    const lst = checklist(p, 70, 720, steps.map(s => s[0]), m('comp', 1), 3.4, SP, { size: 17, dy: 36 });
    // after: sling with the arm at the side, elbow at 90°
    hide(j.g, m('imm')); lst.forEach(e => hide(e, m('imm')));
    const f = frontStand(p, 400, 860, 1.25, m('imm', .5), { muscles: false, pose: { aL: 10, eL: -85 } });
    const sl = G(p, { o: 0 }), Nk = f.at(f.pts.Nk), W = f.at(f.pts.arms[0][1]), E = f.at(f.pts.arms[0][0]);
    path(sl, `M${f1(Nk[0] + 20)} ${f1(Nk[1])}L${f1(W[0])} ${f1(W[1])}M${f1(Nk[0] - 6)} ${f1(Nk[1] + 4)}L${f1(E[0])} ${f1(E[1] + 10)}`, { stroke: ENV, 'stroke-width': 12, 'stroke-linecap': 'round', 'stroke-opacity': .85 });
    path(sl, `M${f1(E[0] - 6)} ${f1(E[1] + 10)}Q${f1((E[0] + W[0]) / 2)} ${f1(Math.max(E[1], W[1]) + 40)} ${f1(W[0] + 6)} ${f1(W[1] + 6)}`, { stroke: ENV, 'stroke-width': 16, fill: 'none', 'stroke-opacity': .85 });
    show(sl, m('imm', 1.5));
    pillRow(p, ['косынка 1–2 недели для удобства', 'упражнения — со следующего дня'], 400, 130, m('imm', 4), { col: ENV, size: 16, gap: 3 });
    infoCard(p, 800, 90, 760, 220, 'доступ', 'сегодня — артроскопия: дельтовидную не отсекают, рука быстрее возвращается в дело; открытый (с отсечением) — для массивных разрывов с открытым швом; «мини-открытый» — дельтовидную расслаивают', SH, m('app'), { size: 19 });
    infoCard(p, 800, 325, 760, 250, 'шаги', 'удалить утолщённую сумку, освободить и частично удалить клювовидно-акромиальную связку, сбрить передний выступ и выровнять акромион, удалить остеофиты АК сустава; при выраженном артрозе — конец ключицы', FUN, m('comp'), { size: 19 });
    infoCard(p, 800, 590, 760, 175, 'после операции', 'рука в косынке у тела или в лёгком отведении и внутренней ротации, локоть 90°; косынка 1–2 недели, упражнения — со следующего дня', ENV, m('imm'), { size: 19 });
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-sad', prompt: ['Подходит ли одна декомпрессия?'],
    build: grid([
      { parts: ['Первичное соударение, манжета цела, 6 месяцев лечения без успеха'], ans: ['y'], why: 'Да — классическое показание.' },
      { parts: ['Нестабильность с разрывом манжеты'], ans: ['n'], why: 'Нет — вместе со швом манжеты.' },
      { parts: ['II стадия по Ниру с костными изменениями'], ans: ['y'], why: 'Да.' },
      { parts: ['Боль 3 недели, лечения ещё не было'], ans: ['n'], why: 'Нет — сначала консервативное лечение.' },
      { parts: ['Кальцинаты, болезненный хруст, манжета почти цела'], ans: ['y'], why: 'Да.' },
    ], [['y', 'Да', COL.good], ['n', 'Нет', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['ph1', 'Максимальная защита', (m, D) => {
    const p = panel(0);
    txt(p, 'день 1 — 3–4 недели: движение и осанка', 800, 56, m('ph'), { size: 28, weight: 700, anchor: 'middle', fill: BAD });
    pillRow(p, ['косынка, когда рука висит', 'холод', 'лекарства', 'шея, локоть, кисть'], 400, 120, m('pain'), { col: BAD, size: 15, gap: 1, space: 8 });
    const GY = 560;
    floorLn(p, 60, 340, GY, m('post'));
    const f = postureFig(p, 190, GY, .45, m('post'), { pose: 'round' }); f.to('std', m('post', 1), 2);
    pillRow(p, ['подбородок назад', 'грудь вверх', 'лопатки сведены'], 560, 200, m('post', 1), { col: SH, size: 15, gap: 1, space: 6 });
    // assisted elevation supine with a wand, the shoulder on a folded towel
    matLine(p, 380, 760, 520, m('rom'));
    const s = lieFig(p, 700, 520, .38, m('rom'), 'supine');
    prog(q => s.set({ arm: 140 * cyc(q, 2), elb: 6 }), m('rom', 2), 8);
    txt(p, 'с палкой, лёжа, плечо на полотенце', 570, 560, m('rom', 2), { size: 15, fill: SP, weight: 700, anchor: 'middle' });
    pillRow(p, ['изометрия с опорой', 'больше повторов, не силы'], 400, 640, m('iso'), { col: FUN, size: 16, gap: 2 });
    checklist(p, 70, 700, ['без опоры почти не болит, мах рукой при ходьбе', 'пассивный подъём ≥ 150°, полные ротации', 'активная НР ≈ 45°, сила ≥ 3/5 (лучше 4/5)'], m('crit', 1), 3, SP, { size: 16, dy: 38 });
    infoCard(p, 800, 90, 760, 175, 'цель', 'почти полный пассивный объём к 4–6 неделям; активные движения — когда безболезненны и лопатка под контролем, иногда через 2 недели', BAD, m('ph'), { size: 19 });
    infoCard(p, 800, 280, 760, 250, 'движение', 'с помощью — здоровой рукой, затем палкой; лёжа на спине, плечо на полотенце в лёгком отведении и сгибании; подъём, отведение, ротации; затем полулёжа, сидя, стоя; разгибание — палка за спиной; рука поперёк груди, если не больно', SP, m('rom'), { size: 18 });

    checklist(p, 70, 770, ['провокационные тесты отрицательные', 'полный активный объём без замен', 'сила ≥ 75% здоровой стороны'], m('crit', .5), 1.8, SP, { size: 16, dy: 34 });
    infoCard(p, 800, 90, 760, 230, 'мобилизация и растяжка', 'заднее и нижнее скольжение, подвижность лопатки; поднимающая лопатку, ромбовидные, подлопаточная, широчайшая, большая круглая, грудные; задняя капсула; разгибание груди на валике', SP, m('mob'), { size: 18 });
    infoCard(p, 800, 335, 760, 175, 'укрепление', 'стабилизация против растущего сопротивления и с опорой; передняя зубчатая и трапециевидная; эргометр стоя; гантели 0,5–2,3 кг или лёгкая лента — лёжа, сидя, стоя', FUN, m('str'), { size: 18 });
    infoCard(p, 800, 525, 760, 150, 'сначала ниже плеча', 'над головой — если не больно; сопротивление выше плеча — только когда рука поднимается без подъёма лопатки', BAD, m('pre'), { size: 18 });
  }],

    infoCard(p, 800, 90, 760, 200, 'финальная фаза', 'обычно с 8 недель до 12–16: сила и выносливость в отдельных движениях и в имитации нужных дел; спортсменам — плиометрика; функция улучшается до 6 месяцев', SP, m('ph'), { size: 19 });

    infoCard(p, 800, 650, 760, 220, 'рандомизированное', '6 недель раз в неделю с терапевтом против инструктажа перед выпиской: через 6 недель, 3, 6 и 12 месяцев результаты не различались; через 3 месяца боль даже выше в группе с терапевтом', COL.task, m('ev'), { size: 18 });

    id: 'c-crit', prompt: ['Можно ли переходить к следующей фазе?'],

      { parts: ['Пассивный подъём 150°, полные ротации, активная НР 45°, сила 4/5'], ans: ['y'], why: 'Да — критерии первой фазы выполнены.' },
      { parts: ['Рука без опоры сильно болит'], ans: ['n'], why: 'Нет.' },

     ['Артроскопия сохраняет дельтовидную и ускоряет восстановление.', 'w2'],
     ['Сначала движения и осанка, затем манжета и мышцы лопатки; выше плеча — только без подъёма лопатки.', 'w3'],

    build: choice([
      ['Косынка для удобства, движения шеи, локтя, кисти, вспомогательный подъём лёжа с палкой в пределах боли, осанка'],
      ['Гантели над головой'],
      ['Полная неподвижность две недели'],
      ['Растяжка через сильную боль'],
    ], 0, 'Фаза максимальной защиты: упражнения со следующего дня, без боли, и осанка.',
    [null, 'Сопротивление выше плеча — намного позже.', 'Косынку снимают для упражнений уже на следующий день.', 'В пределах боли.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-over', prompt: ['Когда давать сопротивление выше уровня плеча?'],
    build: choice([
      ['Когда руку поднимают против силы тяжести без подъёма лопатки'],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
