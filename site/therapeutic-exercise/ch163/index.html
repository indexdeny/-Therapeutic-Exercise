const SH = '#86c9e8', MU = '#f4a48c', LG = '#f1dfa0', FUN = '#f0c060', SP = '#8fd6b0', ENV = '#c9b8e8', BAD = COL.bad;
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : an === 'middle' ? x : x + (right ? 8 : -8), ly = an === 'middle' ? y + (ty > y ? 8 : -size) : y - size * .35;
  path(g, `M${lx} ${ly}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
const arw = (p, x1, y1, x2, y2, col, t0, w = 6) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 14, g = G(p, { o: 0 }); path(g, `M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}M${f1(x2 - h * Math.cos(a - .5))} ${f1(y2 - h * Math.sin(a - .5))}L${f1(x2)} ${f1(y2)}L${f1(x2 - h * Math.cos(a + .5))} ${f1(y2 - h * Math.sin(a + .5))}`, { stroke: col, 'stroke-width': w }); if (t0 !== null) show(g, t0); else put(g, { o: 1 }); return g; };
const floorLn = (p, x1, x2, y, t0) => show(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 }), t0);
const ring = (p, P, r, col, t0) => { const c = mk('circle', { cx: f1(P[0]), cy: f1(P[1]), r, fill: 'none', stroke: col, 'stroke-width': 4, opacity: 0 }, p); show(c, t0); return c; };
// an arc of the glenoid or the head (radius rr about the centre C of the joint, angles a0..a1) in stage coordinates
const arcOn = (j, conv, rr, a0, a1) => { const P = []; for (let a = a0; a <= a1; a += 4) P.push(j.at(conv(polar([0, 0], rr, a)))); return P; };

// a gap drawn across the supraspinatus tendon near its insertion (a tear)
function tearMark(p, j, t0) {
  const P = j.at(j.pts.GT), Q = j.at(polar(j.H, j.R + 10, 296 - j.q.elev));
  const e = path(p, `M${f1(Q[0] - 8)} ${f1(Q[1] - 14)}L${f1(Q[0] + 6)} ${f1(Q[1] + 12)}`, { stroke: COL.board, 'stroke-width': 9, 'stroke-linecap': 'round' }, { o: 0 });
  show(e, t0); return e;
}

// a checklist of criteria that tick one by one
function checklist(p, x, y, items, t0, gap, col = SP, { size = 18, dy = 40 } = {}) {
  return items.map((s, i) => { const t = t0 + i * gap, g = G(p, {}); checkMark(g, x + 12, y + i * dy - 6, t, col, .9); txt(g, s, x + 34, y + i * dy, t, { size, fill: COL.chalk, weight: 600 }); return g; });
}
// a tendon in cross-section (bursal side up): a partial tear on the bursal or articular side, or a full-thickness one
function tendonX(p, cx, cy, kind, t0, col) {
  const g = G(p, { x: cx, y: cy, o: 0 }), w = 190, h = 56;
  mk('rect', { x: -w / 2, y: -h / 2, width: w, height: h, rx: 10, fill: ANAT.tendon, stroke: mix(ANAT.tendon, '#000000', .4), 'stroke-width': 2 }, g);
  for (let k = -2; k <= 2; k++) path(g, `M${-w / 2 + 8} ${k * 10}H${w / 2 - 8}`, { stroke: mix(ANAT.tendon, '#ffffff', .45), 'stroke-width': 1.5 });
  const notch = kind === 'bursal' ? `M-22 ${-h / 2 - 1}L0 4L22 ${-h / 2 - 1}Z` : kind === 'artic' ? `M-22 ${h / 2 + 1}L0 -4L22 ${h / 2 + 1}Z` : `M-16 ${-h / 2 - 1}L-6 0L-16 ${h / 2 + 1}H16L6 0L16 ${-h / 2 - 1}Z`;
  mk('path', { d: notch, fill: COL.board, stroke: BAD, 'stroke-width': 2.5 }, g);
  T(g, 'сумка', { x: w / 2 + 10, y: -h / 2 + 6, size: 13, fill: BURSA_C, weight: 600 }); T(g, 'сустав', { x: w / 2 + 10, y: h / 2 + 4, size: 13, fill: CART_C, weight: 600 });
  T(g, ['со стороны сумки', 'со стороны сустава', 'полный'][['bursal', 'artic', 'full'].indexOf(kind)], { x: 0, y: -h / 2 - 16, size: 17, fill: col, weight: 700, anchor: 'middle' });
  show(g, t0); return g;
}
// suture anchors in the greater tubercle with stitches over the tendon end (the joint model, current pose)
function anchors(p, j, t0) {
  const g = G(p, { o: 0 });
  [-10, 4].forEach(da => {
    const A = j.at(polar(j.H, j.rg - 6, 322 - j.q.elev + da)), B = j.at(polar(j.H, j.rg + 12, 322 - j.q.elev + da - 6));
    mk('circle', { cx: f1(A[0]), cy: f1(A[1]), r: 6, fill: '#b8c4cc', stroke: '#5e6a74', 'stroke-width': 2 }, g);
    path(g, `M${f1(A[0])} ${f1(A[1])}L${f1(B[0])} ${f1(B[1])}`, { stroke: '#4fa3e0', 'stroke-width': 2.5 });
  });
  show(g, t0); return g;
}
// a small line chart (schematic): pts in 0..1 fractions of the box
function miniChart(p, x, y, w, h, pts, col, t0, { xl = '', yl = '', ticks = [] } = {}) {
  const g = G(p, { o: 0 }); show(g, t0);
  path(g, `M${x} ${y}V${y + h}H${x + w}`, { stroke: COL.dim, 'stroke-width': 2.5 });

  ticks.forEach(([k, s]) => T(g, s, { x: x + w * k, y: y + h + 22, size: 14, fill: COL.dim, weight: 600, anchor: 'middle' }));
  const c = path(g, ptsD(pts.map(([u, v]) => [x + w * u, y + h - h * v])), { stroke: col, 'stroke-width': 5, fill: 'none' }, { d: 0 });
  draw(c, t0 + .3, 1.2);
  return g;
}

    const rows = [['разрыв', 'косынка или подушка', 'упражнения с'], ['малый', '1–2 нед', '1-го дня'], ['средний, большой', '3–6 нед', '1–2-го дня'], ['массивный', '4–8 нед', '1–3-го дня']];
    rows.forEach((r, i) => r.forEach((c, k) => T(tb, c, { x: [90, 350, 560][k], y: 430 + i * 44, size: i ? 18 : 16, fill: i ? COL.chalk : COL.dim, weight: i ? 600 : 700 })));
    path(tb, 'M80 442H720', { stroke: COL.faint, 'stroke-width': 2 });
    // why an abduction pillow: the repaired tendon is slack at about 45°
    hide(tb, m('why'));
    const a = ghJoint(p, 200, 640, .55, m('why'), { delt: false, rhythm: false }), b = ghJoint(p, 560, 640, .55, m('why'), { delt: false, rhythm: false });
    b.set({ elev: 45, er: -30 });
    const pw = mk('path', { d: '', fill: ENV, 'fill-opacity': .8, stroke: mix(ENV, '#000000', .35), 'stroke-width': 2, opacity: 0 }, p);
    const P1 = b.at(b.hum([-.1 * b.R, 1.5 * b.R])), P2 = b.at(b.hum([-.1 * b.R, 3.2 * b.R]));
    pw.setAttribute('d', `M${f1(P1[0])} ${f1(P1[1] + 8)}L${f1(P2[0])} ${f1(P2[1] + 8)}L${f1(P2[0] - 50)} ${f1(P2[1] + 70)}L${f1(P1[0] - 30)} ${f1(P1[1] + 60)}Z`);
    show(pw, m('why', 2));
    txt(p, 'у тела: шов натянут', 200, 470, m('why', 3), { size: 17, fill: BAD, weight: 700, anchor: 'middle' });
    txt(p, '≈ 45°, ВР: шов расслаблен', 560, 470, m('why', 3), { size: 17, fill: SP, weight: 700, anchor: 'middle' });
    infoCard(p, 800, 90, 760, 260, 'медленнее, если', 'хроническое соударение, большой разрыв, нестабильность или перелом, слабость и тугоподвижность до операции, плохое здоровье, курение, стероиды, прошлые операции, пожилой возраст, открытый доступ, шов сухожилия к сухожилию; высокие планы — дольше программа', BAD, m('t'), { size: 17 });
    infoCard(p, 800, 365, 760, 175, 'иммобилизация', 'после артроскопического и мини-открытого шва — по размеру разрыва: косынка или отводящая подушка, упражнения с первых дней', FUN, m('imm'), { size: 18 });
    infoCard(p, 800, 555, 760, 205, 'отводящая шина', 'около 45° в плоскости лопатки с внутренней ротацией: мышцы расслаблены и не сокращаются рефлекторно, натяжение шва меньше, возможно, лучше кровоток', SP, m('why'), { size: 18 });
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{

    infoCard(p, 800, 690, 760, 180, 'мягкая изометрия', 'с 1–3 недель, минимальное сопротивление; безопаснее — внутренняя ротация и около 45° подъёма в плоскости лопатки, локоть согнут', FUN, m('iso'), { size: 18 });
  }],

  ['ph2', 'Умеренная защита', (m, D) => {

    infoCard(p, 800, 255, 760, 230, 'Томсон и соавт.', '11 рандомизированных: ранние движения немного лучше вначале и не вредят потом; аппарат пассивных движений безопасен, уменьшает боль и скованность ненадолго', COL.task, m('ev'), { size: 18 });

  ['ph3', 'Возврат и результаты', (m, D) => {

    infoCard(p, 800, 580, 760, 165, 'сила', 'около 80% здоровой стороны к 6 месяцам и 90% к году', MU, m('str'), { size: 18 });

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{

      ['С движениями кисти и локтя'],
      ['С маятником'],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
