<script>

// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch164/cards.ru.json

  "многонаправленная\nбольше одного направления: врождённо растяжимые ткани или постоянное растяжение капсулы": "больше одного направления",

  "следы\nБанкарт — губа оторвана от переднего края впадины, иногда с костью; Хилл-Сакс — вдавленный перелом задне-наружной части головки": "губа оторвана; вдавленный перелом",
  "после 40 лет\nчаще полный разрыв манжеты — руку не отвести; нерв — чаще подмышечный": "разрыв манжеты; подмышечный нерв",
  "задний вывих\nпадение на вытянутую руку в сгибании, приведении и ВР; больно отжиматься, толкать дверь": "падение на вытянутую руку",
  "ограничение\nвправляет только обученный специалист; молодым — 6–8 недель ограничения, косынку снимают для упражнений; старше 40 — около 2 недель; положение вывиха избегают во всём": "молодым 6–8 недель; старше 40 — 2",
  "данные\nобычная косынка себя не оправдала; ограничение на 6–8 недель у людей до 30 лет снижает повторные вывихи; приведение с наружной ротацией лучше сближает губу с краем впадины": "до 30 лет — снижает повторные вывихи",
  "как только можно\nзащищённые движения, напряжение манжеты, дельтовидной и двуглавой, мобилизация II": "напряжение манжеты, мобилизация II",
  "наружная ротация\nлокоть у тела, при сгибании или в положении покоя (55° отведения), не при 90°; от полной ВР до 0 или 10–15° НР; разгибание за 0° — нельзя": "у тела, не при 90°",

  "после заднего вывиха\nто же, но без сгибания с приведением и ВР; косынка неудобна — руке лучше висеть; заднее скольжение запрещено; ВР — положение покоя, ВР до предела и вытяжение III": "заднее скольжение запрещено",

// cards-short end

const SH = '#86c9e8', MU = '#f4a48c', LG = '#f1dfa0', FUN = '#f0c060', SP = '#8fd6b0', ENV = '#c9b8e8', BAD = COL.bad;
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : an === 'middle' ? x : x + (right ? 8 : -8), ly = an === 'middle' ? y + (ty > y ? 8 : -size) : y - size * .35;
  path(g, `M${lx} ${ly}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
const arw = (p, x1, y1, x2, y2, col, t0, w = 6) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 14, g = G(p, { o: 0 }); path(g, `M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}M${f1(x2 - h * Math.cos(a - .5))} ${f1(y2 - h * Math.sin(a - .5))}L${f1(x2)} ${f1(y2)}L${f1(x2 - h * Math.cos(a + .5))} ${f1(y2 - h * Math.sin(a + .5))}`, { stroke: col, 'stroke-width': w }); if (t0 !== null) show(g, t0); else put(g, { o: 1 }); return g; };
const floorLn = (p, x1, x2, y, t0) => show(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 }), t0);
const ring = (p, P, r, col, t0) => { const c = mk('circle', { cx: f1(P[0]), cy: f1(P[1]), r, fill: 'none', stroke: col, 'stroke-width': 4, opacity: 0 }, p); show(c, t0); return c; };
// an arc of the glenoid or the head (radius rr about the centre C of the joint, angles a0..a1) in stage coordinates
const arcOn = (j, conv, rr, a0, a1) => { const P = []; for (let a = a0; a <= a1; a += 4) P.push(j.at(conv(polar([0, 0], rr, a)))); return P; };

// a sector of allowed (or forbidden) external rotation drawn round the elbow of topRot (angles: + external)
function rotSector(p, r, a0, a1, col, t0, R = 150) {
  const E = r.at('E'), P0 = polar(E, R, 270 + a0), P1 = polar(E, R, 270 + a1);
  const e = path(p, `M${f1(E[0])} ${f1(E[1])}L${f1(P0[0])} ${f1(P0[1])}A${R} ${R} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${f1(P1[0])} ${f1(P1[1])}Z`, { fill: col, 'fill-opacity': .22, stroke: col, 'stroke-width': 2 }, { o: 0 });
  show(e, t0); return e;
}
// a checklist of criteria that tick one by one
function checklist(p, x, y, items, t0, gap, col = SP, { size = 18, dy = 40 } = {}) {
  return items.map((s, i) => { const t = t0 + i * gap, g = G(p, {}); checkMark(g, x + 12, y + i * dy - 6, t, col, .9); txt(g, s, x + 34, y + i * dy, t, { size, fill: COL.chalk, weight: 600 }); return g; });
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Нестабильность', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 17 · Урок 164', { x: 800, y: 130, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'Нестабильность плеча', { x: 800, y: 215, size: 56, weight: 600, anchor: 'middle' });

    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'виды нестабильности · вывих и его последствия · ведение по фазам', 800, 340, m('sub'), { size: 28, fill: MU, anchor: 'middle', weight: 600 });
    const art = G(scene, { o: 0 });
    const x = ghAxial(art, 830, 640, .75, null); put(x.g, { o: 1 });
    prog(q => { const k = cyc(q, 2); x.set({ rot: 80 * k, ty: -32 * Math.max(0, k - .5) * 2 }); }, 1, Math.max(3, D - 2), lin);
    txt(art, 'вид сверху · перёд — вверху', 830, 860, null, { size: 17, fill: COL.dim, weight: 600, anchor: 'middle' });
    show(art, .3);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);
  }],

  ['kinds', 'Виды нестабильности', (m, D) => {
    const p = panel(0);
    txt(p, 'направление и происхождение', 800, 56, m('two'), { size: 28, weight: 700, anchor: 'middle', fill: MU });
    pillRow(p, ['атравматическая: слабость тканей, микротравма', 'травматическая: удар, вывих'], 400, 120, m('two', 2), { col: [FUN, BAD], size: 15, gap: 6, space: 8 });
    const x = ghAxial(p, 400, 470, .95, m('uni'));
    txt(p, 'вид сверху · перёд — вверху', 400, 840, m('uni'), { size: 16, fill: COL.dim, weight: 600, anchor: 'middle' });
    const H = x.at('H'), dir = (dx, dy, col, t, s) => { const a = arw(p, H[0] + dx * .4, H[1] + dy * .4, H[0] + dx * 1.5, H[1] + dy * 1.5, col, t, 8); const l = txt(p, s, H[0] + dx * 1.9, H[1] + dy * 1.9 + 6, t, { size: 19, fill: col, weight: 700, anchor: 'middle' }); return [a, l]; };
    // anterior: abducted and externally rotated, pushed back — the head goes forward

    prog(q => x.set({ ty: -26 * cyc(q, 1.5) }), m('uni', 5), 4);
    const A = dir(0, -110, BAD, m('uni', 5), 'вперёд');

    // posterior
    prog(q => x.set({ rot: 85 - 125 * q, ty: 0 }), m('post'), 1.2);

    const P = dir(0, 110, FUN, m('post', 1.5), 'назад');
    [...A].forEach(e => hide(e, m('post')));
    // inferior: the sulcus under the acromion — switch to the frontal section
    [x.g, ...P].forEach(e => hide(e, m('inf')));
    const j = ghJoint(p, 400, 430, .95, m('inf', .3), { delt: false, rhythm: false });
    prog(q => j.set({ dy: 26 * q }), m('inf', 1), 1.5);
    const sl = lab(p, 'борозда под акромионом', 600, 200, ...j.at([j.R * 1.1, -1.2 * j.R]), MU, m('inf', 2.5), { anchor: 'start', size: 17 });

    // multidirectional
    [j.g, sl].forEach(e => hide(e, m('multi')));
    const y = ghAxial(p, 400, 470, .95, m('multi', .3));
    prog(q => { const a = 2 * Math.PI * 2 * q; y.set({ tx: 16 * Math.cos(a), ty: 22 * Math.sin(a) }); }, m('multi', 1), 6, lin);
    const Hy = y.at('H');
    [[0, -1], [0, 1], [1, 0]].forEach(([u, v]) => arw(p, Hy[0] + u * 60, Hy[1] + v * 60, Hy[0] + u * 140, Hy[1] + v * 140, SH, m('multi', 1.5), 6));
    infoCard(p, 800, 90, 760, 175, 'атравматическая и травматическая', 'атравматическая — общая слабость соединительной ткани или микротравма; травматическая — сильный удар, часто вывих, полное разобщение поверхностей', MU, m('two'), { size: 18 });
    infoCard(p, 800, 280, 760, 170, 'передняя', 'отведение и наружная ротация, сила назад — у метателей перегружена передняя капсула; опасение, «нагрузка и сдвиг», передний ящик', BAD, m('uni'), { size: 18 });
    infoCard(p, 800, 465, 760, 105, 'задняя', 'редко: сила назад на согнутую руку; задний ящик', FUN, m('post'), { size: 18 });
    infoCard(p, 800, 585, 760, 135, 'нижняя', 'слабость или паралич манжеты (гемиплегия), работа над головой, пловцы; борозда под акромионом', MU, m('inf'), { size: 18 });
    infoCard(p, 800, 735, 760, 135, 'многонаправленная', 'больше одного направления: врождённо растяжимые ткани или постоянное растяжение капсулы', SH, m('multi'), { size: 18 });
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-dir', prompt: ['Какое это направление нестабильности?'],
    build: grid([
      { parts: ['Метатель: в отведении с наружной ротацией, опасение +'], ans: ['a'], why: 'Передняя.' },
      { parts: ['Толчок назад на согнутую вперёд руку, задний ящик +'], ans: ['p'], why: 'Задняя.' },
      { parts: ['Гемиплегия, борозда под акромионом'], ans: ['i'], why: 'Нижняя.' },
      { parts: ['Пловец: головка смещается в разные стороны'], ans: ['m'], why: 'Многонаправленная.' },
      { parts: ['Положительны «нагрузка и сдвиг» и передний ящик'], ans: ['a'], why: 'Передняя.' },
    ], [['a', 'Передняя', BAD], ['p', 'Задняя', FUN], ['i', 'Нижняя', MU], ['m', 'Много', SH]], { multi: false, text: true }),
  }], done) }],

  ['disl', 'Вывих', (m, D) => {
    const p = panel(0);
    txt(p, 'передний вывих и его следы', 800, 56, m('ant'), { size: 28, weight: 700, anchor: 'middle', fill: BAD });
    const x = ghAxial(p, 420, 480, 1.0, m('ant'));
    prog(q => x.set({ rot: 95 * q }), m('ant', 1), 2);
    prog(q => x.set({ ty: -85 * q, tx: -10 * q }), m('ant', 5), 2);
    const sub = lab(p, 'подлопаточная', 90, 240, ...x.at('sub'), MU, m('ant', 4), { anchor: 'start', size: 17 });
    const cap = lab(p, 'передняя капсула и связки', 90, 280, ...x.at('capA'), LG, m('ant', 4.5), { anchor: 'start', size: 17 });
    txt(p, 'вид сверху · перёд — вверху', 420, 860, m('ant'), { size: 16, fill: COL.dim, weight: 600, anchor: 'middle' });
    // back in place: the lesions
    [sub, cap].forEach(e => hide(e, m('les')));
    prog(q => x.set({ ty: -85 * (1 - q), tx: -10 * (1 - q), rot: 95 * (1 - q) }), m('les'), 1.5);
    whenAt(m('les', 2), () => { put(x.musG, { o: .25 }); x.lesion({ bankart: 1, hs: 1 }); });
    lab(p, 'Банкарт: губа оторвана', 90, 330, ...x.at('labA').map((v, i) => v + (i ? -14 : -20)), BAD, m('les', 2.5), { anchor: 'start', size: 18 });
    lab(p, 'Хилл-Сакс: вмятина головки', 560, 760, ...x.at(polar([0, 0], x.R - 8, 40)), BAD, m('les', 6), { anchor: 'start', size: 18 });
    pillRow(p, ['после 40: разрыв манжеты', 'подмышечный нерв'], 400, 130, m('cuff', 1), { col: MU, size: 16, gap: 4 });
    pillRow(p, ['задний вывих: сгибание + приведение + ВР'], 400, 175, m('back'), { col: FUN, size: 16 });
    pillRow(p, ['до 30 лет: > 3 нед иммобилизации', 'старше: 1–2 нед'], 400, 220, m('rec', 2), { col: SH, size: 16, gap: 2 });
    infoCard(p, 800, 90, 760, 205, 'передний вывих', 'рука поднята, отведена и повёрнута наружу, сила толкает назад; держат подлопаточная, связки — особенно передний пучок нижней — и длинная головка двуглавой', BAD, m('ant'), { size: 18 });
    infoCard(p, 800, 310, 760, 170, 'следы', 'Банкарт — губа оторвана от переднего края впадины, иногда с костью; Хилл-Сакс — вдавленный перелом задне-наружной части головки', BAD, m('les'), { size: 18 });
    infoCard(p, 800, 495, 760, 120, 'после 40 лет', 'чаще полный разрыв манжеты — руку не отвести; нерв — чаще подмышечный', MU, m('cuff'), { size: 18 });
    infoCard(p, 800, 630, 760, 120, 'задний вывих', 'падение на вытянутую руку в сгибании, приведении и ВР; больно отжиматься, толкать дверь', FUN, m('back'), { size: 18 });
    infoCard(p, 800, 765, 760, 105, 'рецидивы', 'чаще всего до 30 лет — иммобилизация дольше', SH, m('rec'), { size: 18 });
  }],

  ['prot', 'Фаза защиты', (m, D) => {
    const p = panel(0);
    txt(p, 'фаза защиты: ограничить активность и положение вывиха', 800, 56, m('restr'), { size: 28, weight: 700, anchor: 'middle', fill: BAD });
    pillRow(p, ['молодым — 6–8 нед ограничения', 'старше 40 — ≈ 2 нед'], 400, 120, m('restr', 4), { col: BAD, size: 16, gap: 3 });
    // immobilisation in adduction and external rotation brings the torn labrum back to the rim
    const x = ghAxial(p, 400, 430, .85, m('ev'));
    put(x.musG, { o: .25 }); x.lesion({ bankart: 1 });
    prog(q => { x.set({ rot: 35 * q }); x.lesion({ bankart: 1 - .8 * q }); }, m('ev', 9), 3);
    const evL = txt(p, 'наружная ротация сближает губу с краем', 400, 680, m('ev', 10), { size: 17, fill: SP, weight: 700, anchor: 'middle' });
    // allowed external rotation: elbow at the side, from full internal to 0–15°
    [x.g, evL].forEach(e => hide(e, m('pre')));
    const r = topRot(p, 330, 560, .78, m('pre', .5));
    rotSector(p, r, -62, 15, SP, m('pre', 1)); rotSector(p, r, 15, 90, BAD, m('pre', 1));
    prog(q => r.set(-60 + 75 * cyc(q, 1.5)), m('pre', 2), 5);
    txt(p, 'до 0–15° НР', 330, 330, m('pre', 2), { size: 19, fill: SP, weight: 700, anchor: 'middle' });
    txt(p, 'разгибание за 0° — нельзя', 330, 800, m('pre', 12), { size: 19, fill: BAD, weight: 700, anchor: 'middle' });
    infoCard(p, 800, 90, 760, 210, 'ограничение', 'вправляет только обученный специалист; молодым — 6–8 недель ограничения, косынку снимают для упражнений; старше 40 — около 2 недель; положение вывиха избегают во всём', BAD, m('restr'), { size: 18 });
    infoCard(p, 800, 315, 760, 215, 'данные', 'обычная косынка себя не оправдала; ограничение на 6–8 недель у людей до 30 лет снижает повторные вывихи; приведение с наружной ротацией лучше сближает губу с краем впадины', COL.task, m('ev'), { size: 18 });
    infoCard(p, 800, 545, 760, 130, 'как только можно', 'защищённые движения, напряжение манжеты, дельтовидной и двуглавой, мобилизация II', SP, m('rom'), { size: 18 });
    infoCard(p, 800, 690, 760, 180, 'наружная ротация', 'локоть у тела, при сгибании или в положении покоя (55° отведения), не при 90°; от полной ВР до 0 или 10–15° НР; разгибание за 0° — нельзя', FUN, m('pre'), { size: 18 });
  }],

  ['ctrl', 'Контролируемое движение', (m, D) => {
    const p = panel(0);

    const x = ghAxial(p, 400, 420, .85, m('glide'));
    prog(q => x.set({ rot: 60 * q }), m('glide', 7), 1.5);
    const H = x.at('H');
    const fa = arw(p, H[0], H[1] - 40, H[0], H[1] - 120, BAD, m('glide', 1), 7); const fx = cross(p, H[0] + 40, H[1] - 90, 16, m('glide', 1.5), 6);
    txt(p, 'переднее скольжение', H[0] + 70, H[1] - 120, m('glide', 1), { size: 17, fill: BAD, weight: 700 });
    const da = arw(p, H[0] + 40, H[1] + 10, H[0] + 140, H[1] + 50, SP, m('glide', 9), 7);
    txt(p, 'вытяжение III', H[0] + 150, H[1] + 74, m('glide', 9), { size: 17, fill: SP, weight: 700 });
    // internal and external rotators both hold the head
    prog(q => { x.sub.act(.8 * q); x.isp.act(.8 * q); }, m('str'), 1);
    lab(p, 'внутренние и приводящие', 70, 230, ...x.at('sub'), MU, m('str', 1), { anchor: 'start', size: 17 });
    lab(p, 'наружные', 70, 740, ...x.at('isp'), MU, m('str', 3), { anchor: 'start', size: 17 });
    pill(p, 'НР ≤ 50°', 600, 760, m('str', 14), { col: FUN, size: 18 });
    pillRow(p, ['3 нед: изокинетика ВР и приведения ≥ 180°/с', '5 нед: всё, кроме 90° отведения + НР'], 400, 830, m('iso'), { col: SH, size: 15, gap: 6, space: 6 });
    infoCard(p, 800, 90, 760, 120, 'косынка', 'всё меньше времени; когда плечо устало или нужна защита от толчков', SH, m('sling'), { size: 18 });
    infoCard(p, 800, 225, 760, 215, 'мобилизация', 'все скольжения, кроме переднего; наружную ротацию — в положении покоя: ротация до предела и вытяжение III перпендикулярно впадине; задние структуры — горизонтальное приведение', SP, m('glide'), { size: 18 });
    infoCard(p, 800, 455, 760, 235, 'укрепление', 'внутренние и приводящие поддерживают переднюю капсулу, наружные удерживают головку и работают с дельтовидной; изометрия у тела, частичная опора, стабилизация; динамика — НР не больше 50°, без положения вывиха', MU, m('str'), { size: 18 });
    infoCard(p, 800, 705, 760, 165, 'изокинетика', 'с 3 недель: ВР и приведение ≥ 180°/с — локоть 90°, кисть поперёк живота; затем при сгибании 90°, не при отведении', SH, m('iso'), { size: 18 });
  }],

  ['ret', 'Возврат к функции', (m, D) => {
    const p = panel(0);
    txt(p, 'возврат к функции', 800, 56, m('func'), { size: 28, weight: 700, anchor: 'middle', fill: SP });
    pillRow(p, ['баланс силы', 'согласованные движения', 'выносливость'], 400, 130, m('func', 1), { col: SP, size: 16, gap: 1 });
    pillRow(p, ['эксцентрика до максимума', 'скорость и сочетания', 'имитация действий'], 400, 180, m('func', 5), { col: FUN, size: 16, gap: 1 });
    checklist(p, 80, 270, ['нет дисбаланса силы', 'движения координированы', 'тест опасения отрицателен'], m('crit', 1), 2.2, SP, { size: 20, dy: 50 });
    pill(p, '2,5–4 месяца', 400, 450, m('crit', 7), { col: SP, size: 20 });
    txt(p, 'замечать усталость и соударение — снижать нагрузку', 400, 510, m('crit', 10), { size: 17, fill: FUN, weight: 700, anchor: 'middle' });
    // after a posterior dislocation
    const x = ghAxial(p, 400, 720, .55, m('postd'));
    const H = x.at('H');
    arw(p, H[0], H[1] + 30, H[0], H[1] + 90, BAD, m('postd', 9), 6); cross(p, H[0] + 30, H[1] + 70, 12, m('postd', 9.5), 5);
    txt(p, 'заднее скольжение — нельзя', H[0] + 60, H[1] + 100, m('postd', 9), { size: 16, fill: BAD, weight: 700 });

    infoCard(p, 800, 305, 760, 175, 'к обычным делам', 'нет дисбаланса, движения координированы, тест опасения отрицателен; полная реабилитация — 2,5–4 месяца', SP, m('crit'), { size: 18 });
    infoCard(p, 800, 495, 760, 230, 'после заднего вывиха', 'то же, но без сгибания с приведением и ВР; косынка неудобна — руке лучше висеть; заднее скольжение запрещено; ВР — положение покоя, ВР до предела и вытяжение III', FUN, m('postd'), { size: 18 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-ant', prompt: ['Можно или нельзя после переднего вывиха?'],
    build: grid([
      { parts: ['Наружная ротация с локтем у тела до 10°'], ans: ['y'], why: 'Можно.' },
      { parts: ['Переднее скольжение'], ans: ['n'], why: 'Нельзя.' },
      { parts: ['Наружная ротация при отведении 90° на 3-й неделе'], ans: ['n'], why: 'Нельзя: положение вывиха.' },
      { parts: ['Изометрия манжеты у тела'], ans: ['y'], why: 'Можно.' },
      { parts: ['Разгибание плеча за 0°'], ans: ['n'], why: 'Нельзя.' },
    ], [['y', 'Можно', COL.good], ['n', 'Нельзя', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Нестабильность бывает атравматической и травматической, одно- и многонаправленной.', 'w1'],
     ['Передний вывих — в отведении и наружной ротации; следы — Банкарт и Хилл-Сакс.', 'w2'],
     ['Молодым — ограничение 6–8 недель; наружная ротация — в безопасных положениях, переднее скольжение запрещено.', 'w3'],
     ['Укрепляют вращатели и мышцы лопатки; возврат — при отрицательном тесте опасения, через 2,5–4 месяца.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: MU }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-young', prompt: ['Хоккеисту 19 лет вправили первый передний вывих. Сколько ограничивать активность?'],
    build: choice([
      ['6–8 недель, избегая положения вывиха'],
      ['3 дня'],
      ['Около 2 недель, как пожилым'],
      ['Не ограничивать — сразу на лёд'],
    ], 0, 'У людей до 30 лет ограничение на 6–8 недель заметно снижает число повторных вывихов.',
    [null, 'Слишком мало.', 'Две недели — для старше 40.', 'Высокий риск рецидива.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-back', prompt: ['Когда ему можно вернуться к игре?'],
    build: choice([
      ['Когда нет дисбаланса силы, движения координированы и тест опасения отрицателен — обычно через 2,5–4 месяца'],
      ['Когда боль ушла'],
      ['Ровно через 6 недель'],
      ['Когда наружная ротация полная'],
    ], 0, 'Критерии — сила, координация и отрицательный тест опасения, а не только срок.',
    [null, 'Одной боли мало.', 'Срок без критериев не решает.', 'Объём — не единственный критерий.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
