const SH = '#86c9e8', MU = '#f4a48c', LG = '#f1dfa0', FUN = '#f0c060', SP = '#8fd6b0', ENV = '#c9b8e8', BAD = COL.bad;
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : an === 'middle' ? x : x + (right ? 8 : -8), ly = an === 'middle' ? y + (ty > y ? 8 : -size) : y - size * .35;
  path(g, `M${lx} ${ly}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
const arw = (p, x1, y1, x2, y2, col, t0, w = 6) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 14, g = G(p, { o: 0 }); path(g, `M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}M${f1(x2 - h * Math.cos(a - .5))} ${f1(y2 - h * Math.sin(a - .5))}L${f1(x2)} ${f1(y2)}L${f1(x2 - h * Math.cos(a + .5))} ${f1(y2 - h * Math.sin(a + .5))}`, { stroke: col, 'stroke-width': w }); if (t0 !== null) show(g, t0); else put(g, { o: 1 }); return g; };
const floorLn = (p, x1, x2, y, t0) => show(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 }), t0);
const ring = (p, P, r, col, t0) => { const c = mk('circle', { cx: f1(P[0]), cy: f1(P[1]), r, fill: 'none', stroke: col, 'stroke-width': 4, opacity: 0 }, p); show(c, t0); return c; };
// an arc of the glenoid or the head (radius rr about the centre C of the joint, angles a0..a1) in stage coordinates
const arcOn = (j, conv, rr, a0, a1) => { const P = []; for (let a = a0; a <= a1; a += 4) P.push(j.at(conv(polar([0, 0], rr, a)))); return P; };

/* ---------- exercise helpers (chapter 17, lessons 166–171) ---------- */
// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.
function fsReach(f, side, X, Y, flip = false) {
  const S = st(f.g), i = side === 'L' ? 0 : 1, k = i ? 1 : -1, Sh = f.pts.Sh[i];
  const tx = (X - S.x) / S.s - Sh[0], ty = (Y - S.y) / S.s - Sh[1], D = clamp(Math.hypot(tx, ty), 8, 137.5), dg = 180 / Math.PI;
  const phi = Math.atan2(k * tx, ty) * dg, be = Math.acos(clamp((72 * 72 + D * D - 66 * 66) / (2 * 72 * D), -1, 1)) * dg, ga = Math.acos(clamp((72 * 72 + 66 * 66 - D * D) / (2 * 72 * 66), -1, 1)) * dg;
  const sg = flip ? -1 : 1;
  f.set({ ['a' + side]: phi + sg * be, ['e' + side]: -sg * (180 - ga) });
}
// an elastic band between two stage points; set(A, B, rest) — brighter and thinner as it stretches
function bandLine(p, col = '#e86a8a') {
  const e = path(p, '', { stroke: col, 'stroke-width': 6, 'stroke-linecap': 'round' }, { o: 0 });
  return { e, set(A, B, rest = 100) { const L = Math.hypot(B[0] - A[0], B[1] - A[1]), k = clamp(L / rest - 1, 0, 1); e.setAttribute('d', `M${f1(A[0])} ${f1(A[1])}L${f1(B[0])} ${f1(B[1])}`); e.setAttribute('stroke-width', f1(6 - 2.5 * k)); e.setAttribute('stroke', mix(col, '#ffd75e', k * .6)); } };
}
const propLine = (p, d, t0, col = COL.dim, w = 5) => { const e = path(p, d, { stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' }, { o: 0 }); if (t0 !== null) show(e, t0); return e; };
// a ball (side view): set(x, y) moves it
function ballEl(p, r, col = '#86c9e8') {
  const defs = mk('defs', {}, p), g = G(p, { o: 0 });
  mk('circle', { r, fill: ballGrad(defs, col), stroke: mix(col, '#000000', .45), 'stroke-width': 2 }, g);
  return { g, set(x, y) { put(g, { x, y }); } };
}
// a seated rig figure on a chair, ankle at (ax, GY)
function seatFig(p, ax, GY, s, t0, pose = {}) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...SIT, ...pose } });
  plant(f, 'AN', ax, GY);
  const [hx, hy] = onStage(f, 'H');
  chair(p, hx, hy + 22 * s / .5 * .32, GY, t0);
  p.appendChild(f.g); show(f.g, t0);
  return f;
}
const QUAD = { ...STAND, t: 66, hN: 66, kN: 90, hF: 66, kF: 90, aN: 66, aF: 66, eN: 0, eF: 0, fN: -90, fF: -90 };
// a rig figure on all fours: knee at (kx, FY); hands under the shoulders
function quadFig(p, kx, FY, s, t0, pose = {}) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...QUAD, ...pose } });
  plant(f, 'KN', kx, FY - 12 * s);
  const Sh = onStage(f, 'Sh'); f.hand = [Sh[0] + 4, FY - 28 * s];
  reach(f, 'N', ...f.hand); reach(f, 'F', f.hand[0] - 4, f.hand[1]);
  show(f.g, t0); return f;
}
// a checklist of criteria that tick one by one
function checklist(p, x, y, items, t0, gap, col = SP, { size = 18, dy = 40 } = {}) {
  return items.map((s, i) => { const t = t0 + i * gap, g = G(p, {}); checkMark(g, x + 12, y + i * dy - 6, t, col, .9); txt(g, s, x + 34, y + i * dy, t, { size, fill: COL.chalk, weight: 600 }); return g; });
}
// horizontal bars with values: rows [label, value, colour]; k — px per unit
function bars(p, x, y, rows, t0, { k = 5, dy = 46, unit = '%', w0 = 210, size = 17 } = {}) {
  return rows.map(([s, v, c], i) => {
    const yy = y + i * dy, g = G(p, { o: 0 }); show(g, t0 + i * .5);
    T(g, s, { x: x + w0 - 12, y: yy + 6, size, fill: c, weight: 700, anchor: 'end' });
    const b = mk('rect', { x: x + w0, y: yy - 13, width: 0, height: 24, rx: 7, fill: c }, g);
    const tv = T(g, '', { x: x + w0 + 8, y: yy + 6, size, fill: COL.chalk, weight: 700 });
    prog(q => { b.setAttribute('width', f1(k * v * q)); put(tv, { x: x + w0 + 8 + k * v * q }); tv.textContent = (unit === '' ? '' : (v * q).toFixed(v % 1 ? 1 : 0).replace('.', ',')) + unit; }, t0 + i * .5, 1);
    return g;
  });
}
// a resistance arrow (the hand or a band pushes the other way): a short thick arrow onto point P from direction ang
function pushArr(p, P, ang, col, t0, L = 70) { const A = polar(P, L + 14, ang), B = polar(P, 14, ang); return arw(p, A[0], A[1], B[0], B[1], col, t0, 7); }

// a bent-over figure doing pendulum exercises with the other hand on a table; good: the trunk rocks, the arm swings a little
function pendFig(p, ax, GY, s, t0, good) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...STAND, t: 78, hN: 78, hF: 78, kN: 8, kF: 8, aN: 78, eN: 4, aF: 20, eF: 30 } });
  const TX = ax + 150 * s / .95, TY = GY - 150 * s / .95, tb = G(p, { o: 0 });
  path(tb, `M${f1(TX - 20)} ${f1(TY)}H${f1(TX + 90)}M${f1(TX - 10)} ${f1(TY)}V${GY}M${f1(TX + 80)} ${f1(TY)}V${GY}`, { stroke: COL.dim, 'stroke-width': 5 });
  p.insertBefore(tb, f.g); show(tb, t0);
  const pose = k => {
    const w = 2 * Math.PI * k, t = good ? 78 + 4 * Math.sin(w) : 78;
    f.set({ t, hN: t, hF: t, aN: t + (good ? 7 * Math.sin(w - .7) : 38 * Math.sin(w)) });
    plant(f, 'AN', ax, GY); reach(f, 'F', TX + 20, TY - 6);
  };
  pose(0); show(f.g, t0);
  return pose;
}

    pill(p, 'ладони вверх — легче повернуть наружу', 400, 600, m('sup2'), { col: FUN, size: 16 });
    infoCard(p, 800, 90, 760, 200, 'палка, трость, Т-рукоять', 'лёжа на спине — лопатка стабилизирована; сгибание, отведение, подъём в плоскости лопатки, ротации; здоровая рука ведёт больную', SH, m('sup'), { size: 19 });
    infoCard(p, 800, 305, 760, 175, 'после шва капсулы или губы', 'сложенное полотенце под нижнюю часть плеча: рука чуть впереди фронтальной плоскости при ротациях', ENV, m('towel'), { size: 19 });

    const S3 = onStage(g3, 'Sh'), cx = S3[0] + 50, hand = k => [cx + 24 * Math.sin(2 * Math.PI * k), S3[1] + 105];
    const cane = propLine(p, '', m('gear'), '#c9a97a', 7);
    const gs = k => { const H = hand(k); reach(g3, 'N', ...H); cane.setAttribute('d', `M${f1(cx)} ${GY3}L${f1(H[0])} ${f1(H[1] - 14)}`); };
    gs(0);
    prog(q => gs((q * 3) % 1), m('gear', 1), 6, lin);
    floorLn(p, 40, 400, GY3, m('gear'));
    infoCard(p, 800, 90, 760, 200, 'катание мяча', 'сидя, рука на столе в плоскости лопатки, кисть на мяче или полотенце; круги создаёт корпус — наклоны вперёд, назад, в стороны; когда боль стихнет — двигает само плечо', SP, m('ball'), { size: 19 });
    infoCard(p, 800, 305, 760, 175, '«мытьё окна»', 'стоя, кисть прижимает полотенце или мяч к стене; круги в обе стороны, затем выше и в сторону — без симптомов', SH, m('wall'), { size: 19 });
    infoCard(p, 800, 495, 760, 175, '«переключение передач»', 'сидя, рука у тела держит палку, конец которой упирается в пол; вперёд-назад, по диагонали, наружу и внутрь', FUN, m('gear'), { size: 19 });
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-ex', prompt: ['Какое это упражнение?'],
    build: grid([
      { parts: ['Сидя, кисть на мяче, круги создаёт корпус'], ans: ['b'], why: 'Катание мяча.' },
      { parts: ['Стоя, полотенце прижато к стене, круги'], ans: ['w'], why: '«Мытьё окна».' },
      { parts: ['Сидя, палка упирается в пол, движения как рычагом'], ans: ['g'], why: '«Переключение передач».' },
      { parts: ['Лёжа на спине, здоровая рука ведёт больную'], ans: ['p'], why: 'Палка лёжа — лопатка стабилизирована.' },
      { parts: ['Стоя, кисть тянется по стене вверх и в сторону'], ans: ['w'], why: '«Мытьё окна» — следующий шаг.' },
    ], [['p', 'Палка', SP], ['b', 'Мяч', SH], ['w', 'Окно', FUN], ['g', 'Передачи', MU]], { multi: false, text: true }),
  }], done) }],

  ['pend', 'Маятник', (m, D) => {
    const p = panel(0);
    txt(p, 'маятник Кодмана', 800, 56, m('pos'), { size: 28, weight: 700, anchor: 'middle', fill: SP });
    const GY = 480;
    floorLn(p, 40, 760, GY, m('pos'));
    const good = pendFig(p, 100, GY, .9, m('pos'), true);
    prog(q => good((q * 6) % 1), m('rock'), Math.max(6, m('help') - m('rock')), lin);
    txt(p, 'покачивается туловище, рука висит', 230, 530, m('rock'), { size: 17, fill: SP, weight: 700, anchor: 'middle' });
    // prone alternative: the arm hangs over the edge of the table
    const PY = 360, pr = lieFig(p, 380, PY, .4, m('help', 3), 'prone', { arm: 90, elb: 4 });
    propLine(p, `M372 ${PY}H${f1(pr.at('sh')[0] - 14)}M392 ${PY}V${GY}M${f1(pr.at('sh')[0] - 30)} ${PY}V${GY}`, m('help', 3));
    prog(q => pr.set({ arm: 90 + 8 * Math.sin(2 * Math.PI * 3 * q) }), m('help', 4), 5, lin);
    txt(p, 'лёжа на животе — при головокружении или боли в спине', 560, 290, m('help', 3), { size: 15, fill: FUN, weight: 700, anchor: 'middle' });
    pill(p, 'груз = растяжение III степени', 400, 590, m('wt', 1), { col: BAD, size: 17 });
    pillRow(p, ['поздняя подострая и хроническая стадии', 'лопатка фиксирована'], 400, 640, m('wt', 5), { col: BAD, size: 14, gap: 2, space: 6 });
    // EMG: big circles load the repaired cuff
    txt(p, 'активность мышц, % от максимума (здоровые)', 400, 720, m('ev', 1), { size: 16, fill: COL.task, weight: 700, anchor: 'middle' });
    bars(p, 10, 760, [['большие круги', 15, BAD], ['малые: подостная', 14, FUN], ['малые: надостная', 9, SP]], m('ev', 3), { k: 12, unit: '%', w0: 230, dy: 38, size: 15 });
    txt(p, '> 15%', 620, 766, m('ev', 3), { size: 15, fill: BAD, weight: 700 });
    infoCard(p, 800, 90, 760, 160, 'положение', 'стоя, корпус наклонён в бёдрах примерно на 90°, рука свободно висит — между 60 и 90° подъёма', SP, m('pos'), { size: 19 });
    infoCard(p, 800, 265, 760, 140, 'движение', 'качание запускает корпус: вперёд-назад, в стороны, по кругу; дуга растёт по переносимости, без боли', SP, m('rock'), { size: 19 });
    infoCard(p, 800, 420, 760, 105, 'опора', 'держаться за опору или лечь на живот', FUN, m('help'), { size: 19 });
    infoCard(p, 800, 540, 760, 140, 'груз или манжета', 'тянет сильнее — это уже растяжение III степени; только позже и при фиксированной лопатке', BAD, m('wt'), { size: 19 });
    infoCard(p, 800, 695, 760, 175, 'осторожно', 'голова закружилась — сесть; не при отёке руки и если боль растёт. После свежего шва — маленькие круги: большие нагружают манжету > 15%', BAD, m('pre'), { size: 18 });
  }],

  ['scap', 'Лопатка и контроль', (m, D) => {
    const p = panel(0);
    txt(p, 'лопатка и первые сокращения манжеты', 800, 56, m('side'), { size: 28, weight: 700, anchor: 'middle', fill: MU });
    const b = scapBack(p, 360, 420, .5, m('side'), { both: false, rhythm: false }); b.only([]);
    prog(q => { const k = cyc(q, 2); b.set({ elev: 30 * Math.max(0, Math.sin(2 * Math.PI * q)), pro: 30 * Math.max(0, -Math.sin(2 * Math.PI * q)) }); }, m('side', 1), 6, lin);
    txt(p, 'лёжа на боку — удобнее; сам может — сидя', 360, 130, m('side'), { size: 17, fill: MU, weight: 700, anchor: 'middle' });
    // multiple-angle setting of the rotators (view from above)
    const x = ghAxial(p, 640, 330, .45, m('set'));
    prog(q => { const k = Math.max(0, Math.sin(2 * Math.PI * 3 * q)); x.sub.act(.8 * k); x.isp.act(.8 * k); }, m('set', 1), 6, lin);
    txt(p, 'мягко: внутренние и наружные вращатели', 640, 470, m('set', 1), { size: 15, fill: SH, weight: 700, anchor: 'middle' });
    // protected weight bearing on a table
    const GY = 860, f = seatFig(p, 170, GY, .72, m('wb'), { t: 30 });
    const Sh = onStage(f, 'Sh'), TY = Sh[1] + 110;
    propLine(p, `M${f1(Sh[0] + 20)} ${f1(TY)}H${f1(Sh[0] + 200)}M${f1(Sh[0] + 180)} ${f1(TY)}V${GY}`, m('wb'));
    const lean = k => { f.set({ t: 30 + 6 * Math.sin(2 * Math.PI * k) }); plant(f, 'AN', 170, GY); reach(f, 'N', Sh[0] + 90, TY - 4); reach(f, 'F', Sh[0] + 84, TY - 4); };
    lean(0); prog(q => lean((q * 3) % 1), m('wb', 1), 6, lin);
    txt(p, 'опора на кисти или локти, перекат из стороны в сторону', 420, 600, m('wb', 1), { size: 16, fill: SP, weight: 700, anchor: 'middle' });
    infoCard(p, 800, 90, 760, 170, 'лопатка', 'пассивные и вспомогательные движения; в острой фазе удобнее лёжа на боку, чем на животе; если сам поднимает и выдвигает лопатку — сидя', MU, m('side'), { size: 19 });
    infoCard(p, 800, 275, 760, 200, 'напряжение мышц', 'манжета после травмы и операции часто «выключена»: мягкое многоугловое напряжение внутренних и наружных вращателей при сгибании или подъёме в плоскости лопатки; так же — мышцы лопатки', SH, m('set'), { size: 19 });
    infoCard(p, 800, 490, 760, 175, 'защищённая опора', 'сидя у стола, опереться на кисти или локти и перекатываться из стороны в сторону — головка садится во впадину, мышцы включаются', SP, m('wb'), { size: 19 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-pend', prompt: ['Можно ли так делать маятник сразу после шва манжеты?'],
    build: grid([
      { parts: ['Маленькие круги, корпус покачивается'], ans: ['y'], why: 'Да — активность ниже 15 и 10%.' },
      { parts: ['Большие круги мышцами плеча'], ans: ['n'], why: 'Нет — > 15% от максимума.' },
      { parts: ['С гантелью в руке'], ans: ['n'], why: 'Нет — это растяжение III степени.' },
      { parts: ['Лёжа на животе, рука свободно свешивается'], ans: ['y'], why: 'Да, если без боли.' },
      { parts: ['Когда боль и объём ухудшаются'], ans: ['n'], why: 'Нет — неподходящий выбор.' },
    ], [['y', 'Можно', COL.good], ['n', 'Нельзя', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Ранние движения — пассивные и с помощью, без боли, плюс шея, грудной отдел, лопатки и вся рука.', 'w1'],
     ['Палка лёжа на спине, мяч на столе, «мытьё окна», «переключение передач».', 'w2'],
     ['Маятник раскачивает корпус; груз — только для растяжения и при фиксированной лопатке; после свежего шва — маленькие круги.', 'w3'],
     ['Манжету будят мягким многоугловым напряжением и защищённой опорой на стол.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SP }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-dizzy', prompt: ['Пожилая пациентка делает маятник, выпрямляется — и у неё кружится голова. Что дальше?'],
    build: choice([
      ['Сесть и отдохнуть; дальше делать маятник лёжа на животе'],
      ['Продолжать, но быстрее'],
      ['Добавить груз, чтобы закончить быстрее'],
      ['Делать с закрытыми глазами'],
    ], 0, 'При головокружении — сесть; лёжа на животе маятник безопаснее.',
    [null, 'Это опасно.', 'Груз — для растяжения, не для скорости.', 'Хуже для равновесия.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-towel', prompt: ['После шва передней капсулы пациент делает ротации с палкой лёжа. Как разгрузить переднюю капсулу?'],
    build: choice([
      ['Подложить сложенное полотенце под нижнюю часть плеча — рука чуть впереди фронтальной плоскости'],
      ['Опустить локоть ниже уровня кушетки'],
      ['Делать ротации при отведении 90°'],
      ['Держать палку ладонями вниз'],
    ], 0, 'Полотенце выводит плечо вперёд — передняя капсула расслаблена.',
    [null, 'Это разгибание — натягивает переднюю капсулу.', 'Положение вывиха.', 'Ладони вверх помогают наружной ротации при болевом синдроме.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
