const CHAPTER = { number: 167, title: 'Растяжка и объём движений плеча', minutes: 9, language: 'ru', next: '../ch168/' };
// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch167/cards.ru.json

// cards-short end

const SH = '#86c9e8', MU = '#f4a48c', LG = '#f1dfa0', FUN = '#f0c060', SP = '#8fd6b0', ENV = '#c9b8e8', BAD = COL.bad;
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : an === 'middle' ? x : x + (right ? 8 : -8), ly = an === 'middle' ? y + (ty > y ? 8 : -size) : y - size * .35;
  path(g, `M${lx} ${ly}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
const arw = (p, x1, y1, x2, y2, col, t0, w = 6) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 14, g = G(p, { o: 0 }); path(g, `M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}M${f1(x2 - h * Math.cos(a - .5))} ${f1(y2 - h * Math.sin(a - .5))}L${f1(x2)} ${f1(y2)}L${f1(x2 - h * Math.cos(a + .5))} ${f1(y2 - h * Math.sin(a + .5))}`, { stroke: col, 'stroke-width': w }); if (t0 !== null) show(g, t0); else put(g, { o: 1 }); return g; };
const floorLn = (p, x1, x2, y, t0) => show(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 }), t0);
const ring = (p, P, r, col, t0) => { const c = mk('circle', { cx: f1(P[0]), cy: f1(P[1]), r, fill: 'none', stroke: col, 'stroke-width': 4, opacity: 0 }, p); show(c, t0); return c; };
// an arc of the glenoid or the head (radius rr about the centre C of the joint, angles a0..a1) in stage coordinates
const arcOn = (j, conv, rr, a0, a1) => { const P = []; for (let a = a0; a <= a1; a += 4) P.push(j.at(conv(polar([0, 0], rr, a)))); return P; };

/* ---------- exercise helpers (chapter 17, lessons 166–171) ---------- */
// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.
function fsReach(f, side, X, Y, flip = false) {
  const S = st(f.g), i = side === 'L' ? 0 : 1, k = i ? 1 : -1, Sh = f.pts.Sh[i];
  const tx = (X - S.x) / S.s - Sh[0], ty = (Y - S.y) / S.s - Sh[1], D = clamp(Math.hypot(tx, ty), 8, 137.5), dg = 180 / Math.PI;
  const phi = Math.atan2(k * tx, ty) * dg, be = Math.acos(clamp((72 * 72 + D * D - 66 * 66) / (2 * 72 * D), -1, 1)) * dg, ga = Math.acos(clamp((72 * 72 + 66 * 66 - D * D) / (2 * 72 * 66), -1, 1)) * dg;
  const sg = flip ? -1 : 1;
  f.set({ ['a' + side]: phi + sg * be, ['e' + side]: -sg * (180 - ga) });
}
// an elastic band between two stage points; set(A, B, rest) — brighter and thinner as it stretches
function bandLine(p, col = '#e86a8a') {
  const e = path(p, '', { stroke: col, 'stroke-width': 6, 'stroke-linecap': 'round' }, { o: 0 });
  return { e, set(A, B, rest = 100) { const L = Math.hypot(B[0] - A[0], B[1] - A[1]), k = clamp(L / rest - 1, 0, 1); e.setAttribute('d', `M${f1(A[0])} ${f1(A[1])}L${f1(B[0])} ${f1(B[1])}`); e.setAttribute('stroke-width', f1(6 - 2.5 * k)); e.setAttribute('stroke', mix(col, '#ffd75e', k * .6)); } };
}
const propLine = (p, d, t0, col = COL.dim, w = 5) => { const e = path(p, d, { stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' }, { o: 0 }); if (t0 !== null) show(e, t0); return e; };
// a ball (side view): set(x, y) moves it
function ballEl(p, r, col = '#86c9e8') {
  const defs = mk('defs', {}, p), g = G(p, { o: 0 });
  mk('circle', { r, fill: ballGrad(defs, col), stroke: mix(col, '#000000', .45), 'stroke-width': 2 }, g);
  return { g, set(x, y) { put(g, { x, y }); } };
}
// a seated rig figure on a chair, ankle at (ax, GY)
function seatFig(p, ax, GY, s, t0, pose = {}) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...SIT, ...pose } });
  plant(f, 'AN', ax, GY);
  const [hx, hy] = onStage(f, 'H');
  chair(p, hx, hy + 22 * s / .5 * .32, GY, t0);
  p.appendChild(f.g); show(f.g, t0);
  return f;
}
const QUAD = { ...STAND, t: 66, hN: 66, kN: 90, hF: 66, kF: 90, aN: 66, aF: 66, eN: 0, eF: 0, fN: -90, fF: -90 };
// a rig figure on all fours: knee at (kx, FY); hands under the shoulders
function quadFig(p, kx, FY, s, t0, pose = {}) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...QUAD, ...pose } });
  plant(f, 'KN', kx, FY - 12 * s);
  const Sh = onStage(f, 'Sh'); f.hand = [Sh[0] + 4, FY - 28 * s];
  reach(f, 'N', ...f.hand); reach(f, 'F', f.hand[0] - 4, f.hand[1]);
  show(f.g, t0); return f;
}
// a checklist of criteria that tick one by one
function checklist(p, x, y, items, t0, gap, col = SP, { size = 18, dy = 40 } = {}) {
  return items.map((s, i) => { const t = t0 + i * gap, g = G(p, {}); checkMark(g, x + 12, y + i * dy - 6, t, col, .9); txt(g, s, x + 34, y + i * dy, t, { size, fill: COL.chalk, weight: 600 }); return g; });
}
// horizontal bars with values: rows [label, value, colour]; k — px per unit
function bars(p, x, y, rows, t0, { k = 5, dy = 46, unit = '%', w0 = 210, size = 17 } = {}) {
  return rows.map(([s, v, c], i) => {
    const yy = y + i * dy, g = G(p, { o: 0 }); show(g, t0 + i * .5);
    T(g, s, { x: x + w0 - 12, y: yy + 6, size, fill: c, weight: 700, anchor: 'end' });
    const b = mk('rect', { x: x + w0, y: yy - 13, width: 0, height: 24, rx: 7, fill: c }, g);
    const tv = T(g, '', { x: x + w0 + 8, y: yy + 6, size, fill: COL.chalk, weight: 700 });
    prog(q => { b.setAttribute('width', f1(k * v * q)); put(tv, { x: x + w0 + 8 + k * v * q }); tv.textContent = (unit === '' ? '' : (v * q).toFixed(v % 1 ? 1 : 0).replace('.', ',')) + unit; }, t0 + i * .5, 1);
    return g;
  });
}
// a resistance arrow (the hand or a band pushes the other way): a short thick arrow onto point P from direction ang
function pushArr(p, P, ang, col, t0, L = 70) { const A = polar(P, L + 14, ang), B = polar(P, 14, ang); return arw(p, A[0], A[1], B[0], B[1], col, t0, 7); }

// the "sleeper" stretch seen from the feet: lying on the affected side, the upper arm forward on the table, the
// forearm turned down toward the table by the other hand (set(k): 0 forearm up, 1 down — internal rotation)
function sleeperFig(p, x, y, s, t0, col = '#d8d1c1') {
  const g = G(p, { x, y, s, o: 0 }), defs = mk('defs', {}, g), line = mix(col, COL.board, .62), L = (ra, rb) => limbEl(g, defs, col, ra, rb, line);
  path(g, 'M-260 0H260', { stroke: COL.dim, 'stroke-width': 6 });
  mk('ellipse', { cx: -120, cy: -75, rx: 70, ry: 75, fill: ballGrad(defs, col), stroke: line, 'stroke-width': 2 }, g);   // chest in section
  mk('circle', { cx: -120, cy: -175, r: 40, fill: ballGrad(defs, col), stroke: line, 'stroke-width': 2 }, g);   // head end-on
  const ua = L(22, 18), fa = L(16, 12), oa = L(15, 12), ofa = L(13, 10);
  const S = [-60, -24], E = [80, -24];
  ua.set(S, E);
  const r = { g, set(k) { const a = rad(-90 + 75 * k), W = [E[0] + 130 * Math.cos(a), E[1] + 130 * Math.sin(a)]; fa.set(E, W); const H = [W[0] - 6, W[1] - 22], O = [-120, -140]; oa.set(O, [lerp(O[0], H[0], .5), lerp(O[1], H[1], .5) - 40]); ofa.set([lerp(O[0], H[0], .5), lerp(O[1], H[1], .5) - 40], H); } };
  r.set(0); show(g, t0); return r;
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Растяжка', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 17 · Урок 167', { x: 800, y: 130, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'Растяжка и объём движений плеча', { x: 800, y: 215, size: 54, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'самостоятельная растяжка сустава и отдельных мышц', 800, 300, m('sub'), { size: 28, fill: MU, anchor: 'middle', weight: 600 });
    const art = G(scene, { o: 0 });
    const f = frontStand(art, 800, 860, 1.25, null, { muscles: false }); put(f.g, { o: 1 });
    prog(q => { const k = cyc(q, 2); const Sh = f.at(f.pts.Sh[1]); fsReach(f, 'L', Sh[0] + 30 * k + 10, Sh[1] + 30 - 10 * k); const E = f.at(f.pts.arms[0][0]); fsReach(f, 'R', E[0] + 6, E[1] + 6); }, .5, Math.max(3, D - 1.5), lin);
    show(art, .3);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(sub, D - .9, .8); hide(art, D - .9, .8);
  }],

  ['why', 'Зачем растягивать', (m, D) => {
    const p = panel(0);
    txt(p, 'сначала — длина, потом — контроль', 800, 56, m('aim'), { size: 28, weight: 700, anchor: 'middle', fill: MU });
    pillRow(p, ['укороченные мышцы и фасции', '→', 'правильная поза пояса и объём'], 400, 140, m('aim', 1), { col: [MU, COL.dim, SP], size: 16 });
    txt(p, 'сразу после одного занятия', 400, 230, m('ev', 8), { size: 18, fill: COL.task, weight: 700, anchor: 'middle' });
    bars(p, 20, 280, [['НР: занятие', 16.4, SP], ['НР: контроль', .9, COL.dim]], m('ev', 9), { k: 18, unit: '°', w0: 200 });
    bars(p, 20, 400, [['над головой: занятие', 9.6, SP], ['над головой: контроль', 2.4, COL.dim]], m('ev', 14), { k: 30, unit: ' см', w0: 200 });
    pill(p, 'отдалённых данных нет → домашняя растяжка', 400, 530, m('ev', 22), { col: FUN, size: 16 });
    pillRow(p, ['мягко', 'долго', 'без рывков'], 400, 640, m('rule'), { col: SP, size: 20 });
    infoCard(p, 800, 90, 760, 140, 'зачем', 'растянуть укороченные мышцы и фасции — тогда плечевой пояс встанет правильно и появится нужный объём', MU, m('aim'), { size: 19 });
    infoCard(p, 800, 245, 760, 300, 'рандомизированное', '20 человек с ограничением: мягкотканная мобилизация подлопаточной, «сокращение — расслабление» внутренних вращателей и активная диагональ (сгибание, отведение, НР). НР +16,4° против +0,9°, досягаемость над головой +9,6 см против +2,4 см', COL.task, m('ev'), { size: 18 });
    infoCard(p, 800, 560, 760, 105, 'правило', 'растяжка мягкая и долгая, без пружинящих рывков в конце объёма', SP, m('rule'), { size: 19 });
  }],

  ['horiz', 'Задние структуры', (m, D) => {
    const p = panel(0);
    txt(p, 'горизонтальное приведение и «спящий»', 800, 56, m('cross'), { size: 28, weight: 700, anchor: 'middle', fill: SH });
    const f = frontStand(p, 380, 560, 1.05, m('cross'), { muscles: false });
    const pull = k => { const ShR = f.at(f.pts.Sh[1]); fsReach(f, 'L', ShR[0] + 10 + 24 * k, ShR[1] + 34 - 6 * k); const E = f.at(f.pts.arms[0][0]); fsReach(f, 'R', E[0] + 8, E[1] + 8); };
    pull(0); prog(q => pull(cyc(q, 1.5)), m('cross', 1.5), 6);
    txt(p, 'рука поперёк груди', 380, 130, m('cross', 1), { size: 18, fill: SH, weight: 700, anchor: 'middle' });
    hide(f.g, m('sleep'));
    const sl = sleeperFig(p, 400, 620, .9, m('sleep', .5));
    prog(q => sl.set(cyc(q, 1.5)), m('sleep', 2), 6);
    txt(p, 'лёжа на больном боку (вид со стороны ног)', 400, 160, m('sleep', .5), { size: 17, fill: SH, weight: 700, anchor: 'middle' });
    pillRow(p, ['5 раз в день', 'по 30 с', '4 недели'], 400, 760, m('ev', 3), { col: COL.task, size: 17 });
    infoCard(p, 800, 90, 760, 175, 'поперёк груди', 'сидя или стоя: рука через грудь, другой рукой мягко и долго прижимать; задние структуры, тугие при соударении', SH, m('cross'), { size: 19 });
    infoCard(p, 800, 280, 760, 210, '«спящий»', 'лёжа на больном боку, плечо и локоть 90°: поднять локоть поперёк тела — лопатку держит опора; нажать на предплечье к кушетке — растяжка во внутреннюю ротацию', FUN, m('sleep'), { size: 19 });
    infoCard(p, 800, 505, 760, 175, 'данные', 'не хватало ≥ 10° ВР: поперёк груди 5 раз в день по 30 с 4 недели — ВР и общая ротация выросли; «спящий» — тоже, и досягаемость за спиной', COL.task, m('ev'), { size: 19 });
  }],

  ['flex', 'Сгибание, отведение, ротации', (m, D) => {
    const p = panel(0);
    txt(p, 'стол и дверной проём', 800, 56, m('flex'), { size: 28, weight: 700, anchor: 'middle', fill: SP });
    // flexion: the forearm slides forward along the table as the trunk bends
    const GY = 480, f = seatFig(p, 150, GY, .74, m('flex'));
    const Sh0 = onStage(f, 'Sh'), TY = Sh0[1] + 80;
