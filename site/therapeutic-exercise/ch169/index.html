const SH = '#86c9e8', MU = '#f4a48c', LG = '#f1dfa0', FUN = '#f0c060', SP = '#8fd6b0', ENV = '#c9b8e8', BAD = COL.bad;
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : an === 'middle' ? x : x + (right ? 8 : -8), ly = an === 'middle' ? y + (ty > y ? 8 : -size) : y - size * .35;
  path(g, `M${lx} ${ly}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
const arw = (p, x1, y1, x2, y2, col, t0, w = 6) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 14, g = G(p, { o: 0 }); path(g, `M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}M${f1(x2 - h * Math.cos(a - .5))} ${f1(y2 - h * Math.sin(a - .5))}L${f1(x2)} ${f1(y2)}L${f1(x2 - h * Math.cos(a + .5))} ${f1(y2 - h * Math.sin(a + .5))}`, { stroke: col, 'stroke-width': w }); if (t0 !== null) show(g, t0); else put(g, { o: 1 }); return g; };
const floorLn = (p, x1, x2, y, t0) => show(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 }), t0);
const ring = (p, P, r, col, t0) => { const c = mk('circle', { cx: f1(P[0]), cy: f1(P[1]), r, fill: 'none', stroke: col, 'stroke-width': 4, opacity: 0 }, p); show(c, t0); return c; };
// an arc of the glenoid or the head (radius rr about the centre C of the joint, angles a0..a1) in stage coordinates
const arcOn = (j, conv, rr, a0, a1) => { const P = []; for (let a = a0; a <= a1; a += 4) P.push(j.at(conv(polar([0, 0], rr, a)))); return P; };

/* ---------- exercise helpers (chapter 17, lessons 166–171) ---------- */
// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.
function fsReach(f, side, X, Y, flip = false) {
  const S = st(f.g), i = side === 'L' ? 0 : 1, k = i ? 1 : -1, Sh = f.pts.Sh[i];
  const tx = (X - S.x) / S.s - Sh[0], ty = (Y - S.y) / S.s - Sh[1], D = clamp(Math.hypot(tx, ty), 8, 137.5), dg = 180 / Math.PI;
  const phi = Math.atan2(k * tx, ty) * dg, be = Math.acos(clamp((72 * 72 + D * D - 66 * 66) / (2 * 72 * D), -1, 1)) * dg, ga = Math.acos(clamp((72 * 72 + 66 * 66 - D * D) / (2 * 72 * 66), -1, 1)) * dg;
  const sg = flip ? -1 : 1;
  f.set({ ['a' + side]: phi + sg * be, ['e' + side]: -sg * (180 - ga) });
}
// an elastic band between two stage points; set(A, B, rest) — brighter and thinner as it stretches
function bandLine(p, col = '#e86a8a') {
  const e = path(p, '', { stroke: col, 'stroke-width': 6, 'stroke-linecap': 'round' }, { o: 0 });
  return { e, set(A, B, rest = 100) { const L = Math.hypot(B[0] - A[0], B[1] - A[1]), k = clamp(L / rest - 1, 0, 1); e.setAttribute('d', `M${f1(A[0])} ${f1(A[1])}L${f1(B[0])} ${f1(B[1])}`); e.setAttribute('stroke-width', f1(6 - 2.5 * k)); e.setAttribute('stroke', mix(col, '#ffd75e', k * .6)); } };
}
const propLine = (p, d, t0, col = COL.dim, w = 5) => { const e = path(p, d, { stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' }, { o: 0 }); if (t0 !== null) show(e, t0); return e; };
// a ball (side view): set(x, y) moves it
function ballEl(p, r, col = '#86c9e8') {
  const defs = mk('defs', {}, p), g = G(p, { o: 0 });
  mk('circle', { r, fill: ballGrad(defs, col), stroke: mix(col, '#000000', .45), 'stroke-width': 2 }, g);
  return { g, set(x, y) { put(g, { x, y }); } };
}
// a seated rig figure on a chair, ankle at (ax, GY)
function seatFig(p, ax, GY, s, t0, pose = {}) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...SIT, ...pose } });
  plant(f, 'AN', ax, GY);
  const [hx, hy] = onStage(f, 'H');
  chair(p, hx, hy + 22 * s / .5 * .32, GY, t0);
  p.appendChild(f.g); show(f.g, t0);
  return f;
}
const QUAD = { ...STAND, t: 66, hN: 66, kN: 90, hF: 66, kF: 90, aN: 66, aF: 66, eN: 0, eF: 0, fN: -90, fF: -90 };
// a rig figure on all fours: knee at (kx, FY); hands under the shoulders
function quadFig(p, kx, FY, s, t0, pose = {}) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...QUAD, ...pose } });
  plant(f, 'KN', kx, FY - 12 * s);

  reach(f, 'N', ...f.hand); reach(f, 'F', f.hand[0] - 4, f.hand[1]);
  show(f.g, t0); return f;
}
// a checklist of criteria that tick one by one
function checklist(p, x, y, items, t0, gap, col = SP, { size = 18, dy = 40 } = {}) {
  return items.map((s, i) => { const t = t0 + i * gap, g = G(p, {}); checkMark(g, x + 12, y + i * dy - 6, t, col, .9); txt(g, s, x + 34, y + i * dy, t, { size, fill: COL.chalk, weight: 600 }); return g; });
}
// horizontal bars with values: rows [label, value, colour]; k — px per unit
function bars(p, x, y, rows, t0, { k = 5, dy = 46, unit = '%', w0 = 210, size = 17 } = {}) {
  return rows.map(([s, v, c], i) => {
    const yy = y + i * dy, g = G(p, { o: 0 }); show(g, t0 + i * .5);
    T(g, s, { x: x + w0 - 12, y: yy + 6, size, fill: c, weight: 700, anchor: 'end' });
    const b = mk('rect', { x: x + w0, y: yy - 13, width: 0, height: 24, rx: 7, fill: c }, g);
    const tv = T(g, '', { x: x + w0 + 8, y: yy + 6, size, fill: COL.chalk, weight: 700 });
    prog(q => { b.setAttribute('width', f1(k * v * q)); put(tv, { x: x + w0 + 8 + k * v * q }); tv.textContent = (unit === '' ? '' : (v * q).toFixed(v % 1 ? 1 : 0).replace('.', ',')) + unit; }, t0 + i * .5, 1);
    return g;
  });
}
// a resistance arrow (the hand or a band pushes the other way): a short thick arrow onto point P from direction ang
function pushArr(p, P, ang, col, t0, L = 70) { const A = polar(P, L + 14, ang), B = polar(P, 14, ang); return arw(p, A[0], A[1], B[0], B[1], col, t0, 7); }

// move the back-view model to a pose and set muscle activations (k: name → 0..1; the rest relax)
function scapState(b, t0, pose, act, dur = 1.2) {
  let from = null;
  prog(q => {
    if (!from) from = { ...b.q, act: Object.fromEntries(Object.keys(b.mus).map(k => [k, b.mus[k].level])) };
    const o = {}; for (const k in pose) o[k] = lerp(from[k] ?? 0, pose[k], q);
    b.set(o);
    Object.keys(b.mus).forEach(k => b.mus[k].act(lerp(from.act[k], act[k] || 0, q)));
  }, t0, dur);
}

    scapState(b, m('clasp', 1.5), { pro: -38 }, { rh: .9, mtr: .9 });
    const cl = txt(p, 'кисти за поясницей — лопатки сводятся', 430, 140, m('clasp', 1), { size: 18, fill: SH, weight: 700, anchor: 'middle' });
    // prone with a weight: squeeze the scapulae
    [b.g, cl].forEach(e => hide(e, m('pinch')));
    const PY = 330, pr = lieFig(p, 160, PY, .42, m('pinch', .3), 'prone', { arm: 90, elb: 4, scap: 0 });
    propLine(p, `M150 ${PY}H${f1(pr.at('sh')[0] - 14)}M170 ${PY}V520M${f1(pr.at('sh')[0] - 30)} ${PY}V520`, m('pinch', .3));
    prog(q => pr.set({ scap: -1 * cyc(q, 2) }), m('pinch', 1), 5);
    txt(p, 'лёжа, гантель в свешенной руке: свести лопатки', 400, 570, m('pinch', 1), { size: 16, fill: SP, weight: 700, anchor: 'middle' });
    // corner press-out, from above
    const cg = G(p, { x: 250, y: 760, o: 0 });
    path(cg, 'M-140 -90L0 40L140 -90', { stroke: COL.dim, 'stroke-width': 6 });
    mk('ellipse', { cx: 0, cy: -30, rx: 90, ry: 40, fill: ballGrad(mk('defs', {}, cg), '#d8d1c1'), stroke: '#8a8476', 'stroke-width': 2 }, cg);
    mk('circle', { cx: 0, cy: -34, r: 26, fill: '#d8d1c1', stroke: '#8a8476', 'stroke-width': 2 }, cg);
    [[-1], [1]].forEach(([k]) => { arw(cg, k * 70, -50, k * 110, -64, FUN, null, 6); });
    show(cg, m('corner'));
    txt(p, 'спиной в угол: локти в стены, оттолкнуться', 250, 860, m('corner', .5), { size: 15, fill: FUN, weight: 700, anchor: 'middle' });
    pill(p, 'лента на уровне плеча: свести лопатки', 600, 760, m('band'), { col: MU, size: 15 });
    infoCard(p, 800, 90, 760, 160, 'сцепить кисти', 'лёжа, сидя, стоя: кисти за поясницей — лопатки сводятся; удержать, опуская руки; затем без движения рук', SH, m('clasp'), { size: 19 });
    infoCard(p, 800, 265, 760, 150, 'лёжа с гантелью', 'рука свешивается — свести лопатки; затем тяга и горизонтальное отведение против силы тяжести', SP, m('pinch'), { size: 19 });
    infoCard(p, 800, 430, 760, 130, '«отжимание от угла»', 'спиной в угол, плечи 90°, локти согнуты — давить локтями в стены', FUN, m('corner'), { size: 19 });
    infoCard(p, 800, 575, 760, 130, 'лента', 'руки прямые вперёд на уровне плеча — тянуть ленту или блок, сводя лопатки', MU, m('band'), { size: 19 });
  }],

  ['comb', 'Сведение с отведением', (m, D) => {
    const p = panel(0);
    txt(p, 'сведение + горизонтальное отведение (+ НР)', 800, 56, m('hab'), { size: 28, weight: 700, anchor: 'middle', fill: SP });
    const b = scapBack(p, 430, 560, .7, m('hab'), { both: true, rhythm: false }); b.only(['rh', 'mtr', 'ltr', 'del', 'isp']);
    b.set({ arm: 90, armL: 90, up: 12 });
    scapState(b, m('hab', 1.5), { arm: 90, up: 12, pro: -30 }, { rh: .8, mtr: .9, del: .8 });
    txt(p, 'лёжа на животе (вид сверху): руки поднять от стола', 430, 140, m('hab', 1), { size: 17, fill: SP, weight: 700, anchor: 'middle' });
    pillRow(p, ['локти согнуты — легче', 'прямые — тяжелее', 'большие пальцы вверх'], 400, 830, m('hab', 6), { col: SP, size: 15, gap: 2, space: 6 });
    scapState(b, m('ninety', 1), { arm: 90, up: 18, pro: -32, elev: -12 }, { rh: .7, mtr: .8, ltr: .9, del: .8, isp: .9 });
    pill(p, '90/90: + подостная и малая круглая', 430, 190, m('ninety', 1), { col: FUN, size: 16 });
    infoCard(p, 800, 90, 760, 230, 'горизонтальное отведение', 'ромбовидные, средняя трапециевидная, задняя дельтовидная: лёжа на животе, плечи 90°, локти согнуты — развести руки, сводя лопатки; прямые локти — тяжелее; большие пальцы вверх — больше средней и нижней; затем гантели и тяга у ленты', SP, m('hab'), { size: 18 });
    infoCard(p, 800, 335, 760, 230, '«90 на 90»', 'отведение и НР по 90°: приподнять руку на несколько градусов — лопатки обязаны свестись; на узкой скамье — больший размах; стоя — лента спереди чуть выше плеч, развести кисти и локти назад', FUN, m('ninety'), { size: 18 });
  }],

  ['pro', 'Выдвижение', (m, D) => {
    const p = panel(0);
    txt(p, 'выдвижение — передняя зубчатая', 800, 56, m('push'), { size: 28, weight: 700, anchor: 'middle', fill: MU });
    // standing push against a band behind
    const GY = 480, f = fig(p, { x: 0, y: 0, s: .78, o: 0, pose: { ...STAND, aN: 90, eN: 2 } }); plant(f, 'AN', 160, GY); show(f.g, m('push'));
    const bd = bandLine(p); show(bd.e, m('push'));
    const Sh = onStage(f, 'Sh'), anchor = [Sh[0] - 120, Sh[1]];
    prog(q => { const k = cyc(q, 2); reach(f, 'N', Sh[0] + 104 + 22 * k, Sh[1]); bd.set(anchor, onStage(f, 'WN'), 230); }, m('push', 1), 6);
    propLine(p, `M${f1(anchor[0])} ${f1(anchor[1] - 40)}V${GY}`, m('push'), COL.dim, 6); floorLn(p, 40, 380, GY, m('push'));
    txt(p, 'толкать вперёд, не поворачивая корпус', 220, 540, m('push', 1), { size: 15, fill: MU, weight: 700, anchor: 'middle' });
    const b = scapBack(p, 600, 330, .38, m('push', 2), { both: false, rhythm: false }); b.only(['sa']);
    prog(q => { const k = cyc(q, 2); b.set({ pro: 45 * k }); b.mus.sa.act(.9 * k); }, m('push', 2.5), 6);
    pill(p, 'Экстром: подъём руки включает сильнее', 400, 600, m('tip'), { col: COL.task, size: 15 });
    // push-up with a plus: wall → table → knees → toes
    pillRow(p, ['стена', 'стол', 'колени', 'носки'], 400, 680, m('plus', 4), { col: MU, size: 17, gap: .6 });
    txt(p, 'оттолкнуться и «дожать», выдвигая лопатки', 400, 730, m('plus'), { size: 16, fill: MU, weight: 700, anchor: 'middle' });
    pillRow(p, ['четвереньки: нога своей стороны → зубчатая', 'противоположной → нижняя трапециевидная'], 400, 800, m('quad'), { col: [SP, FUN], size: 14, gap: 2, space: 6 });
    infoCard(p, 800, 90, 760, 175, 'толкать', 'стоя, плечо 90°, локоть прямой, лента сзади — «толкать» вперёд; лёжа на спине — выталкивать гантель вверх', MU, m('push'), { size: 19 });
    infoCard(p, 800, 280, 760, 110, 'Экстром', 'изолированное выдвижение включает зубчатую слабее подъёма руки', COL.task, m('tip'), { size: 19 });
    infoCard(p, 800, 405, 760, 175, '«с плюсом»', 'оттолкнуться и «дожать», выдвигая лопатки: стена → стол → колени → носки; затем груз на корпус', MU, m('plus'), { size: 19 });
    infoCard(p, 800, 595, 760, 150, 'на четвереньках', '«плюс» с подъёмом ноги: своей стороны — больше зубчатая, противоположной — нижняя трапециевидная', SP, m('quad'), { size: 19 });
  }],

  ['dep', 'Опускание и поворот вверх', (m, D) => {
    const p = panel(0);
    txt(p, 'опускание — нижняя трапециевидная и нижняя зубчатая', 800, 56, m('man'), { size: 28, weight: 700, anchor: 'middle', fill: FUN });
    // seated press-up from blocks
    const GY = 440, f = seatFig(p, 170, GY, .72, m('man'), { aN: 0, eN: 80 });
    pushArr(p, onStage(f, 'EN'), 90, COL.dim, m('man', 1));
    txt(p, 'давить локтем вниз в ладони', 230, 130, m('man', 1), { size: 15, fill: FUN, weight: 700, anchor: 'middle' });
    const H0 = onStage(f, 'H'), blk = [H0[0] + 10, H0[1] + 8];
    const bk = mk('rect', { x: f1(blk[0] - 22), y: f1(blk[1]), width: 44, height: 26, rx: 5, fill: '#c9a97a', stroke: mix('#c9a97a', '#000000', .4), 'stroke-width': 2, opacity: 0 }, p); show(bk, m('press'));
    const press = k => { f.set({ aN: -8, eN: 4 }); plant(f, 'AN', 170, GY); put(f.g, { y: st(f.g).y - 26 * k }); reach(f, 'N', ...blk); reach(f, 'F', blk[0] - 4, blk[1]); };
    prog(q => press(cyc(q, 1.5)), m('press', 1), 5);
    txt(p, 'отжимание сидя: выпрямить локти и опустить лопатки', 230, 500, m('press'), { size: 15, fill: SP, weight: 700, anchor: 'middle' });
    // wall slide and "superman"
    const w = frontStand(p, 560, 440, .7, m('wall'), { muscles: false, pose: { aL: 90, eL: 90, aR: 90, eR: 90 } });
    prog(q => { const k = cyc(q, 1.5); w.set({ aL: 90 + 60 * k, eL: 90 - 70 * k, aR: 90 + 60 * k, eR: 90 - 70 * k }); }, m('wall', 1), 5);
    txt(p, 'спиной к стене, скользить вверх', 560, 478, m('wall'), { size: 15, fill: SH, weight: 700, anchor: 'middle' });
    const PY = 680, pr = lieFig(p, 150, PY, .45, m('super'), 'prone', { arm: 180 });
    propLine(p, `M140 ${PY}H700M160 ${PY}V840M680 ${PY}V840`, m('super'));
    prog(q => pr.set({ arm: 180 + 14 * cyc(q, 2) }), m('super', 1), 5);
    txt(p, '«супермен»: чуть приподнять руку, лопатка опущена', 420, 870, m('super', 1), { size: 15, fill: SP, weight: 700, anchor: 'middle' });
    infoCard(p, 800, 90, 760, 140, 'опускание', 'сидя, локоть согнут — давить вниз в ладони терапевта; отжимание сидя: выпрямить локти и опустить лопатки', FUN, m('man'), { size: 18 });
    infoCard(p, 800, 245, 760, 175, 'поворот вверх с опусканием', 'отдельно от руки не изолировать; частая замена — поднимание лопатки верхней трапециевидной: учить держать лопатку опущенной', BAD, m('rot'), { size: 18 });
    infoCard(p, 800, 435, 760, 150, 'скольжение по стене', 'спиной к стене, таз в заднем наклоне, локти 90°, тыл рук на стене — вверх, не отрывая спины', SH, m('wall'), { size: 18 });
    infoCard(p, 800, 600, 760, 200, '«супермен»', 'лёжа, рука над головой — чуть приподнять (при тугом плече или соударении может быть недоступен); сидя или стоя — лента спереди сверху, рука дальше в сгибание с опусканием лопатки; касания нижней трапециевидной', SP, m('super'), { size: 18 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-err', prompt: ['Где ошибка?'],
    build: grid([
      { parts: ['Поднимает руку, поднимая лопатку к уху'], ans: ['e'], why: 'Ошибка: замена верхней трапециевидной.' },
      { parts: ['При отжимании лопатка отходит крылом'], ans: ['e'], why: 'Ошибка: облегчить упражнение.' },
      { parts: ['Опускает лопатку, поднимая руку'], ans: ['o'], why: 'Верно.' },
      { parts: ['В «супермене» поднимает руку на пару градусов'], ans: ['o'], why: 'Верно.' },
      { parts: ['Скользит руками по стене, отрывая поясницу'], ans: ['e'], why: 'Ошибка: спина прижата.' },
    ], [['o', 'Верно', COL.good], ['e', 'Ошибка', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Сначала стабилизаторы, лёгкое сопротивление и много повторов.', 'w1'],
     ['Нижняя трапециевидная — НР лёжа 90/90, «супермен», опускание; передняя зубчатая — отжимание «с плюсом» и подъём руки.', 'w2'],
     ['Сведение — тяги и горизонтальное отведение большими пальцами вверх.', 'w3'],
     ['Главная ошибка — поднимать лопатку верхней трапециевидной вместо поворота с опусканием.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: FUN }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-lt', prompt: ['У пациента с соударением лопатка наклоняется вперёд и запаздывает с поворотом вверх. Какое упражнение «лучшее» для нижней трапециевидной?'],
    build: choice([
      ['Наружная ротация лёжа на животе при отведении 90° и локте 90°'],
      ['Пожимание плечами с гантелями'],
      ['Изолированное выдвижение лопатки'],
      ['Жим над головой'],
    ], 0, 'Это положение даёт максимальное опускание лопатки и изолирует нижнюю часть.',
    [null, 'Это верхняя трапециевидная.', 'Это зубчатая, и слабо.', 'Не изолирует нижнюю трапециевидную.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-plus', prompt: ['Отжимания «с плюсом» с носков даются тяжело — лопатка отходит. Что делать?'],
    build: choice([
      ['Вернуться на шаг: с колен, от стола или от стены, затем прогрессировать'],
      ['Делать больше повторов с носков'],
      ['Добавить груз на корпус'],
      ['Убрать «плюс»'],
    ], 0, 'Прогрессия: стена → стол → колени → носки; крыловидная лопатка — сигнал облегчить.',
    [null, 'Закрепит ошибку.', 'Ещё тяжелее.', '«Плюс» — суть упражнения для зубчатой.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
