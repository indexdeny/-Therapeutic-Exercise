const SH = '#86c9e8', MU = '#f4a48c', LG = '#f1dfa0', FUN = '#f0c060', SP = '#8fd6b0', ENV = '#c9b8e8', BAD = COL.bad;
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : an === 'middle' ? x : x + (right ? 8 : -8), ly = an === 'middle' ? y + (ty > y ? 8 : -size) : y - size * .35;
  path(g, `M${lx} ${ly}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
const arw = (p, x1, y1, x2, y2, col, t0, w = 6) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 14, g = G(p, { o: 0 }); path(g, `M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}M${f1(x2 - h * Math.cos(a - .5))} ${f1(y2 - h * Math.sin(a - .5))}L${f1(x2)} ${f1(y2)}L${f1(x2 - h * Math.cos(a + .5))} ${f1(y2 - h * Math.sin(a + .5))}`, { stroke: col, 'stroke-width': w }); if (t0 !== null) show(g, t0); else put(g, { o: 1 }); return g; };
const floorLn = (p, x1, x2, y, t0) => show(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 }), t0);
const ring = (p, P, r, col, t0) => { const c = mk('circle', { cx: f1(P[0]), cy: f1(P[1]), r, fill: 'none', stroke: col, 'stroke-width': 4, opacity: 0 }, p); show(c, t0); return c; };
// an arc of the glenoid or the head (radius rr about the centre C of the joint, angles a0..a1) in stage coordinates
const arcOn = (j, conv, rr, a0, a1) => { const P = []; for (let a = a0; a <= a1; a += 4) P.push(j.at(conv(polar([0, 0], rr, a)))); return P; };

/* ---------- exercise helpers (chapter 17, lessons 166–171) ---------- */
// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.
function fsReach(f, side, X, Y, flip = false) {
  const S = st(f.g), i = side === 'L' ? 0 : 1, k = i ? 1 : -1, Sh = f.pts.Sh[i];
  const tx = (X - S.x) / S.s - Sh[0], ty = (Y - S.y) / S.s - Sh[1], D = clamp(Math.hypot(tx, ty), 8, 137.5), dg = 180 / Math.PI;
  const phi = Math.atan2(k * tx, ty) * dg, be = Math.acos(clamp((72 * 72 + D * D - 66 * 66) / (2 * 72 * D), -1, 1)) * dg, ga = Math.acos(clamp((72 * 72 + 66 * 66 - D * D) / (2 * 72 * 66), -1, 1)) * dg;
  const sg = flip ? -1 : 1;
  f.set({ ['a' + side]: phi + sg * be, ['e' + side]: -sg * (180 - ga) });
}
// an elastic band between two stage points; set(A, B, rest) — brighter and thinner as it stretches
function bandLine(p, col = '#e86a8a') {
  const e = path(p, '', { stroke: col, 'stroke-width': 6, 'stroke-linecap': 'round' }, { o: 0 });
  return { e, set(A, B, rest = 100) { const L = Math.hypot(B[0] - A[0], B[1] - A[1]), k = clamp(L / rest - 1, 0, 1); e.setAttribute('d', `M${f1(A[0])} ${f1(A[1])}L${f1(B[0])} ${f1(B[1])}`); e.setAttribute('stroke-width', f1(6 - 2.5 * k)); e.setAttribute('stroke', mix(col, '#ffd75e', k * .6)); } };
}
const propLine = (p, d, t0, col = COL.dim, w = 5) => { const e = path(p, d, { stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' }, { o: 0 }); if (t0 !== null) show(e, t0); return e; };
// a ball (side view): set(x, y) moves it
function ballEl(p, r, col = '#86c9e8') {
  const defs = mk('defs', {}, p), g = G(p, { o: 0 });
  mk('circle', { r, fill: ballGrad(defs, col), stroke: mix(col, '#000000', .45), 'stroke-width': 2 }, g);
  return { g, set(x, y) { put(g, { x, y }); } };
}
// a seated rig figure on a chair, ankle at (ax, GY)
function seatFig(p, ax, GY, s, t0, pose = {}) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...SIT, ...pose } });
  plant(f, 'AN', ax, GY);
  const [hx, hy] = onStage(f, 'H');
  chair(p, hx, hy + 22 * s / .5 * .32, GY, t0);
  p.appendChild(f.g); show(f.g, t0);
  return f;
}
const QUAD = { ...STAND, t: 66, hN: 66, kN: 90, hF: 66, kF: 90, aN: 66, aF: 66, eN: 0, eF: 0, fN: -90, fF: -90 };
// a rig figure on all fours: knee at (kx, FY); hands under the shoulders
function quadFig(p, kx, FY, s, t0, pose = {}) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...QUAD, ...pose } });
  plant(f, 'KN', kx, FY - 12 * s);
  const Sh = onStage(f, 'Sh'); f.hand = [Sh[0] + 4, FY - 28 * s];

  show(f.g, t0); return f;
}
// a checklist of criteria that tick one by one
function checklist(p, x, y, items, t0, gap, col = SP, { size = 18, dy = 40 } = {}) {
  return items.map((s, i) => { const t = t0 + i * gap, g = G(p, {}); checkMark(g, x + 12, y + i * dy - 6, t, col, .9); txt(g, s, x + 34, y + i * dy, t, { size, fill: COL.chalk, weight: 600 }); return g; });
}
// horizontal bars with values: rows [label, value, colour]; k — px per unit
function bars(p, x, y, rows, t0, { k = 5, dy = 46, unit = '%', w0 = 210, size = 17 } = {}) {
  return rows.map(([s, v, c], i) => {
    const yy = y + i * dy, g = G(p, { o: 0 }); show(g, t0 + i * .5);
    T(g, s, { x: x + w0 - 12, y: yy + 6, size, fill: c, weight: 700, anchor: 'end' });
    const b = mk('rect', { x: x + w0, y: yy - 13, width: 0, height: 24, rx: 7, fill: c }, g);
    const tv = T(g, '', { x: x + w0 + 8, y: yy + 6, size, fill: COL.chalk, weight: 700 });
    prog(q => { b.setAttribute('width', f1(k * v * q)); put(tv, { x: x + w0 + 8 + k * v * q }); tv.textContent = (unit === '' ? '' : (v * q).toFixed(v % 1 ? 1 : 0).replace('.', ',')) + unit; }, t0 + i * .5, 1);
    return g;
  });
}
// a resistance arrow (the hand or a band pushes the other way): a short thick arrow onto point P from direction ang
function pushArr(p, P, ang, col, t0, L = 70) { const A = polar(P, L + 14, ang), B = polar(P, 14, ang); return arw(p, A[0], A[1], B[0], B[1], col, t0, 7); }

// a small chip table: exercise → muscles (rows appear one by one)
function muscleRows(p, x, y, rows, t0, gap, dy = 58) {
  return rows.map(([ex, mus, col], i) => {
    const g = G(p, { o: 0 }), t = t0 + i * gap; show(g, t);
    T(g, ex, { x, y: y + i * dy, size: 18, fill: COL.chalk, weight: 700 });
    T(g, mus, { x: x + 20, y: y + i * dy + 26, size: 16, fill: col, weight: 700 });
    return g;
  });
}
// a dumbbell that follows a stage point
function dbAt(p, k = .8) { const g = G(p, { o: 0 }); dumbbell(g, k); return { g, go(P, r = 0) { put(g, { x: P[0], y: P[1], r }); } }; }

    infoCard(p, 800, 680, 760, 150, 'внутренняя ротация', 'подлопаточная: на больном боку, рука чуть вперёд — гантель от стола; стоя — лента сбоку на уровне локтя, тянуть поперёк живота', MU, m('ir'), { size: 18 });
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-mus', prompt: ['Какая мышца работает?'],
    build: grid([
      { parts: ['НР на здоровом боку с гантелью'], ans: ['i'], why: 'Подостная и малая круглая.' },
      { parts: ['ВР поперёк живота против ленты'], ans: ['s'], why: 'Подлопаточная (и большая грудная).' },
      { parts: ['Тяга сидя узким хватом'], ans: ['s'], why: 'Подлопаточная.' },
      { parts: ['Удар вперёд с сопротивлением'], ans: ['p'], why: 'Надостная и передняя дельтовидная.' },
      { parts: ['НР лёжа на животе при 90/90'], ans: ['i'], why: 'Подостная и малая круглая.' },
    ], [['i', 'Подостная', SP], ['s', 'Подлопаточная', MU], ['p', 'Надостная', LG]], { multi: false, text: true }),
  }], done) }],

  ['abd', 'Отведение и «полная банка»', (m, D) => {
    const p = panel(0);
    txt(p, 'подъём в плоскости лопатки — «полная банка»', 800, 56, m('plane'), { size: 28, weight: 700, anchor: 'middle', fill: LG });
    // the plane of the scapula from above
    const tg = G(p, { x: 230, y: 260, o: 0 }); show(tg, m('plane'));
    mk('ellipse', { rx: 120, ry: 60, fill: '#d8d1c1', stroke: '#8a8476', 'stroke-width': 2 }, tg); mk('circle', { r: 40, fill: '#d8d1c1', stroke: '#8a8476', 'stroke-width': 2 }, tg);
    path(tg, 'M0 -42L-10 -58L10 -58Z', { fill: '#d8d1c1', stroke: '#8a8476', 'stroke-width': 2 });
    path(tg, 'M120 0H290', { stroke: COL.dim, 'stroke-width': 3, 'stroke-dasharray': '8 6' });
    const Lp = polar([120, 0], 170, -38); path(tg, `M120 0L${f1(Lp[0])} ${f1(Lp[1])}`, { stroke: LG, 'stroke-width': 8, 'stroke-linecap': 'round' });
    T(tg, '30–45° вперёд', { x: 260, y: -90, size: 16, fill: LG, weight: 700 }); T(tg, 'фронтальная', { x: 250, y: 30, size: 14, fill: COL.dim, weight: 600 });
    // above 90°: turn out first — with internal rotation the tubercle hits the arch
    const a = ghJoint(p, 180, 560, .5, m('pre'), { delt: false }), b = ghJoint(p, 470, 560, .5, m('pre'), { delt: false });
    prog(q => { a.set({ elev: 100 * q, er: 50 * q }); b.set({ elev: 75 * q, er: -50 * q, dy: -4 * q }); }, m('pre', 1), 2);
    txt(p, 'с НР — проходит', 180, 420, m('pre', 3), { size: 15, fill: SP, weight: 700, anchor: 'middle' }); txt(p, 'с ВР — упирается', 470, 420, m('pre', 3), { size: 15, fill: BAD, weight: 700, anchor: 'middle' });
    [a.g, b.g, tg].forEach(e => hide(e, m('full')));
    // full can: scaption with the thumb up
    const f = frontStand(p, 400, 860, 1.05, m('full'), { muscles: false });
    const db = dbAt(p, .7); show(db.g, m('full'));
    prog(q => { const k = cyc(q, 1.5); f.set({ aR: 8 + 85 * k, eR: 0 }); db.go(f.at(f.pts.arms[1][2]), 90); }, m('full', 1), 5);
    txt(p, '«полная банка»: большой палец вверх', 400, 280, m('full', 1), { size: 19, fill: SP, weight: 700, anchor: 'middle' });
    txt(p, '«пустая банка» — лопатка внутрь и вперёд: риск соударения', 400, 320, m('ev', 8), { size: 16, fill: BAD, weight: 700, anchor: 'middle' });
    infoCard(p, 800, 90, 760, 140, 'плоскость лопатки', 'большинство дел — в 30–45° впереди фронтальной плоскости, по линии впадины', LG, m('plane'), { size: 19 });
    infoCard(p, 800, 245, 760, 140, 'выше 90°', 'плечо должно повернуться наружу, иначе бугорок ударит в акромион; при соударении — избегать дуги', BAD, m('pre'), { size: 19 });
    infoCard(p, 800, 400, 760, 165, 'варианты', 'до 90°, повернуть наружу и выше; лента под стопой — сопротивление растёт к концу; лёжа на боку — тяжелее в начале, на 90° сила идёт вдоль кости', FUN, m('var'), { size: 18 });
    infoCard(p, 800, 580, 760, 290, 'полная и пустая банка', 'надостную не изолирует ни одно упражнение; она работает и в «пустой банке», но её не советуют: лопатка сильнее поворачивается внутрь и наклоняется вперёд — риск соударения. «Полная банка» — большой палец вверх — его уменьшает', SP, m('full'), { size: 18 });
  }],

  ['flex', 'Сгибание, жим, приведение, разгибание', (m, D) => {
    const p = panel(0);
    txt(p, 'где сопротивление максимально', 800, 56, m('flex'), { size: 28, weight: 700, anchor: 'middle', fill: FUN });
    // standing flexion with a dumbbell: the hardest point is at 90°
    const GY = 480, f = fig(p, { x: 0, y: 0, s: .8, o: 0, pose: { ...STAND, aN: 0, eN: 4 } }); plant(f, 'AN', 140, GY); show(f.g, m('flex'));
    const d1 = dbAt(p, .6); show(d1.g, m('flex'));
    prog(q => { const a = 150 * cyc(q, 1.5); f.set({ aN: a }); d1.go(onStage(f, 'WN'), 90); }, m('flex', 1), 5);
    floorLn(p, 40, 260, GY, m('flex'));
    txt(p, 'стоя: тяжелее всего на 90°', 150, 520, m('flex', 3), { size: 15, fill: FUN, weight: 700, anchor: 'middle' });
    // military press, seated
    const s = seatFig(p, 380, GY, .7, m('press'), { aN: 20, eN: 120 });
    const d2 = dbAt(p, .6); show(d2.g, m('press'));
    prog(q => { const k = cyc(q, 1.5); s.set({ aN: 20 + 150 * k, eN: 120 - 115 * k }); d2.go(onStage(s, 'WN')); }, m('press', 1), 5);
    txt(p, 'жим вверх сидя', 400, 520, m('press', 1), { size: 15, fill: SH, weight: 700, anchor: 'middle' });
    // adduction against a band from above
    const a = frontStand(p, 620, GY, .62, m('add'), { muscles: false, pose: { aR: 150, eR: 0 } });
    const top = [700, 150], bd = bandLine(p); show(bd.e, m('add'));
    prog(q => { const k = cyc(q, 1.5); a.set({ aR: 150 - 110 * k }); bd.set(top, a.at(a.pts.arms[1][1]), 120); }, m('add', 1), 5);
    txt(p, 'приведение: вниз от ленты сверху', 620, 520, m('add', 1), { size: 15, fill: MU, weight: 700, anchor: 'middle' });
    // prone extension with a dumbbell
    const PY = 690, pr = lieFig(p, 120, PY, .42, m('ext'), 'prone', { arm: 90 });
    propLine(p, `M110 ${PY}H${f1(pr.at('sh')[0] - 14)}M130 ${PY}V860M${f1(pr.at('sh')[0] - 30)} ${PY}V860`, m('ext'));
    const d3 = dbAt(p, .55); show(d3.g, m('ext'));
    prog(q => { const k = cyc(q, 1.5); pr.set({ arm: 90 - 70 * k, elb: 4 }); d3.go(pr.stage(pr.geo.W), 0); }, m('ext', 1), 5);
    txt(p, 'разгибание лёжа: прямой локоть — длиннее рычаг', 420, 870, m('ext', 1), { size: 15, fill: LG, weight: 700, anchor: 'middle' });
    infoCard(p, 800, 90, 760, 175, 'сгибание', 'передняя дельтовидная, манжета, зубчатая: локоть прямой, большой палец вперёд; лёжа — тяжелее в начале, стоя — на 90°', FUN, m('flex'), { size: 18 });
    infoCard(p, 800, 280, 760, 140, 'жим вверх', 'сидя, плечо у тела в нейтральной или лёгкой НР, локоть согнут, большой палец назад — гантель вертикально вверх', SH, m('press'), { size: 18 });
    infoCard(p, 800, 435, 760, 175, 'приведение', 'большая грудная, большая круглая, широчайшая: тянуть вниз блок или ленту сверху — тяжелее, когда тяга под прямым углом к руке; горизонтальное — лёжа до вертикали', MU, m('add'), { size: 18 });
    infoCard(p, 800, 625, 760, 175, 'разгибание', 'задняя дельтовидная, широчайшая, ромбовидные: лёжа, рука свешивается — поднять назад; согнутый локоть легче, прямой — тяжелее; или стоя, лента сверху', LG, m('ext'), { size: 18 });
  }],

  ['bic', 'Двуглавая и диагонали', (m, D) => {
    const p = panel(0);
    txt(p, 'двуглавая — стабилизатор головки; диагонали', 800, 56, m('curl'), { size: 28, weight: 700, anchor: 'middle', fill: LG });
    const c = curlFig(p, 160, 480, .85, .7, m('curl'));
    curls(c, m('curl', .5), 5, 3);
    floorLn(p, 40, 300, 480, m('curl'));
    const j = ghJoint(p, 470, 310, .55, m('why'), { delt: false, bic: true });
    prog(q => j.bic.act(q), m('why', 1), 1);
    const H = j.at('H'); arw(p, H[0], H[1] - 70, H[0], H[1] - 20, LG, m('why', 3), 6);
    txt(p, 'прижимает и опускает головку', 470, 500, m('why', 3), { size: 15, fill: LG, weight: 700, anchor: 'middle' });
    // D2 flexion against a band from below
    const f = frontStand(p, 400, 860, .78, m('pnf'), { muscles: false, pose: { aR: -30, eR: 0 } });
    const low = [330, 860], bd = bandLine(p); show(bd.e, m('pnf'));
    prog(q => { const k = cyc(q, 1.5); f.set({ aR: -30 + 185 * k }); bd.set(low, f.at(f.pts.arms[1][2]), 200); }, m('pnf', 1), 6);
    txt(p, 'D2: сгибание, отведение, НР', 560, 560, m('pnf', 1), { size: 16, fill: SH, weight: 700, anchor: 'middle' });
    infoCard(p, 800, 90, 760, 130, 'сгибание локтя', 'гантель, ладонь вверх, рука у тела или в лёгком разгибании плеча', LG, m('curl'), { size: 19 });
    infoCard(p, 800, 235, 760, 175, 'зачем двуглавая', 'длинная головка — двусуставная: прижимает головку к впадине и опускает её при подъёме руки, помогая манжете — её обязательно укрепляют', LG, m('why'), { size: 19 });
    infoCard(p, 800, 425, 760, 175, 'диагонали', 'вся рука или лопатка; терапевт подчёркивает нужные мышцы руками и сопротивлением; затем сам — гантель или лента, например D2 сгибания', SH, m('pnf'), { size: 19 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-can', prompt: ['Какое упражнение безопаснее для надостной?'],
    build: grid([
      { parts: ['«Полная банка» — большой палец вверх'], ans: ['s'], why: 'Безопаснее.' },
      { parts: ['«Пустая банка» — большой палец вниз'], ans: ['r'], why: 'Рискованнее: лопатка внутрь и вперёд.' },
      { parts: ['Выше 90° с наружной ротацией'], ans: ['s'], why: 'Бугорок уходит назад.' },
      { parts: ['Выше 90° с внутренней ротацией'], ans: ['r'], why: 'Бугорок под дугой.' },
      { parts: ['При соударении — ниже болезненной дуги'], ans: ['s'], why: 'Безопаснее.' },
    ], [['s', 'Безопаснее', COL.good], ['r', 'Рискованнее', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Наружные вращатели сильнее всего работают на боку, на животе 90/90 и в плоскости лопатки; поворачивается плечо, а не локоть.', 'w1'],
     ['Выше 90° — с наружной ротацией; «полная банка» вместо «пустой».', 'w2'],
     ['Сгибание, жим, приведение и разгибание — с учётом, где сопротивление максимально.', 'w3'],
     ['Двуглавая — динамический стабилизатор головки, её тоже укрепляют; дальше — диагонали.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-elbow', prompt: ['Делая НР с лентой, пациент разгибает локоть, а плечо почти не поворачивается. Что подсказать?'],
    build: choice([
      ['Локоть 90° у тела — помогает полотенце между локтем и боком; поворачивать плечо'],
      ['Тянуть ленту прямой рукой'],
      ['Взять ленту потуже'],
      ['Делать быстрее'],
    ], 0, 'Сила должна быть под прямым углом к предплечью, а движение — ротацией плеча.',
    [null, 'Это уже не ротация.', 'Ошибка не в силе ленты.', 'Скорость не исправит технику.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-ssp', prompt: ['Пациенту с соударением нужно укреплять надостную. Что выбрать?'],
    build: choice([
      ['«Полную банку» в плоскости лопатки, ниже болезненной дуги'],
      ['«Пустую банку» выше 90°'],
      ['Отведение во фронтальной плоскости с внутренней ротацией'],
      ['Ничего — надостную не укрепляют'],
    ], 0, '«Полная банка» уменьшает риск соударения; при болезненной дуге — ниже неё.',
    [null, 'Повышает риск соударения.', 'Бугорок под дугой.', 'Манжету обязательно укрепляют.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
