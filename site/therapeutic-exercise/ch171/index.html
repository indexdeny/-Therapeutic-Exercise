'use strict';
const CHAPTER = { number: 171, title: 'Функциональная прогрессия для плеча', minutes: 6, language: 'ru', next: '../ch172/' };
// cards-short begin: key-word lines of the info cards (T switches); made by tools/therapeutic-exercise/cards.py from content/therapeutic-exercise/ch171/cards.ru.json
const CARDS_SHORT = {
  "прогрессия\nпоследовательность упражнений к нужным делам: открытая и закрытая цепь в сочетанных паттернах, сила, мощность и выносливость, равновесие, координация, навык, аэробная подготовка": "сила, равновесие, навык, аэробика",
  "сочетанные движения\nсогласованная работа стабилизаторов и двигателей лопатки и плеча, контроль всей руки и корпуса, иногда и ног; тянуть, толкать, поднимать, опускать, нести — всё труднее": "тянуть, толкать, нести — всё труднее",
  "гребля\nсидя с прямыми ногами, лента под стопами — тянуть концы назад; менять хват; сложнее — на фитболе; или блочный тренажёр": "тянуть ленту назад",

// cards-short end

const SH = '#86c9e8', MU = '#f4a48c', LG = '#f1dfa0', FUN = '#f0c060', SP = '#8fd6b0', ENV = '#c9b8e8', BAD = COL.bad;
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : an === 'middle' ? x : x + (right ? 8 : -8), ly = an === 'middle' ? y + (ty > y ? 8 : -size) : y - size * .35;
  path(g, `M${lx} ${ly}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);
  return g;
}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
const arw = (p, x1, y1, x2, y2, col, t0, w = 6) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 14, g = G(p, { o: 0 }); path(g, `M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}M${f1(x2 - h * Math.cos(a - .5))} ${f1(y2 - h * Math.sin(a - .5))}L${f1(x2)} ${f1(y2)}L${f1(x2 - h * Math.cos(a + .5))} ${f1(y2 - h * Math.sin(a + .5))}`, { stroke: col, 'stroke-width': w }); if (t0 !== null) show(g, t0); else put(g, { o: 1 }); return g; };
const floorLn = (p, x1, x2, y, t0) => show(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 }), t0);
const ring = (p, P, r, col, t0) => { const c = mk('circle', { cx: f1(P[0]), cy: f1(P[1]), r, fill: 'none', stroke: col, 'stroke-width': 4, opacity: 0 }, p); show(c, t0); return c; };
// an arc of the glenoid or the head (radius rr about the centre C of the joint, angles a0..a1) in stage coordinates
const arcOn = (j, conv, rr, a0, a1) => { const P = []; for (let a = a0; a <= a1; a += 4) P.push(j.at(conv(polar([0, 0], rr, a)))); return P; };

/* ---------- exercise helpers (chapter 17, lessons 166–171) ---------- */
// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.
function fsReach(f, side, X, Y, flip = false) {
  const S = st(f.g), i = side === 'L' ? 0 : 1, k = i ? 1 : -1, Sh = f.pts.Sh[i];
  const tx = (X - S.x) / S.s - Sh[0], ty = (Y - S.y) / S.s - Sh[1], D = clamp(Math.hypot(tx, ty), 8, 137.5), dg = 180 / Math.PI;
  const phi = Math.atan2(k * tx, ty) * dg, be = Math.acos(clamp((72 * 72 + D * D - 66 * 66) / (2 * 72 * D), -1, 1)) * dg, ga = Math.acos(clamp((72 * 72 + 66 * 66 - D * D) / (2 * 72 * 66), -1, 1)) * dg;
  const sg = flip ? -1 : 1;
  f.set({ ['a' + side]: phi + sg * be, ['e' + side]: -sg * (180 - ga) });
}
// an elastic band between two stage points; set(A, B, rest) — brighter and thinner as it stretches
function bandLine(p, col = '#e86a8a') {
  const e = path(p, '', { stroke: col, 'stroke-width': 6, 'stroke-linecap': 'round' }, { o: 0 });
  return { e, set(A, B, rest = 100) { const L = Math.hypot(B[0] - A[0], B[1] - A[1]), k = clamp(L / rest - 1, 0, 1); e.setAttribute('d', `M${f1(A[0])} ${f1(A[1])}L${f1(B[0])} ${f1(B[1])}`); e.setAttribute('stroke-width', f1(6 - 2.5 * k)); e.setAttribute('stroke', mix(col, '#ffd75e', k * .6)); } };
}
const propLine = (p, d, t0, col = COL.dim, w = 5) => { const e = path(p, d, { stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' }, { o: 0 }); if (t0 !== null) show(e, t0); return e; };
// a ball (side view): set(x, y) moves it
function ballEl(p, r, col = '#86c9e8') {
  const defs = mk('defs', {}, p), g = G(p, { o: 0 });
  mk('circle', { r, fill: ballGrad(defs, col), stroke: mix(col, '#000000', .45), 'stroke-width': 2 }, g);
  return { g, set(x, y) { put(g, { x, y }); } };
}
// a seated rig figure on a chair, ankle at (ax, GY)
function seatFig(p, ax, GY, s, t0, pose = {}) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...SIT, ...pose } });
  plant(f, 'AN', ax, GY);
  const [hx, hy] = onStage(f, 'H');
  chair(p, hx, hy + 22 * s / .5 * .32, GY, t0);
  p.appendChild(f.g); show(f.g, t0);
  return f;
}
const QUAD = { ...STAND, t: 66, hN: 66, kN: 90, hF: 66, kF: 90, aN: 66, aF: 66, eN: 0, eF: 0, fN: -90, fF: -90 };
// a rig figure on all fours: knee at (kx, FY); hands under the shoulders
function quadFig(p, kx, FY, s, t0, pose = {}) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...QUAD, ...pose } });
  plant(f, 'KN', kx, FY - 12 * s);
  const Sh = onStage(f, 'Sh'); f.hand = [Sh[0] + 4, FY - 28 * s];
  reach(f, 'N', ...f.hand); reach(f, 'F', f.hand[0] - 4, f.hand[1]);
  show(f.g, t0); return f;
}
// a checklist of criteria that tick one by one
function checklist(p, x, y, items, t0, gap, col = SP, { size = 18, dy = 40 } = {}) {
  return items.map((s, i) => { const t = t0 + i * gap, g = G(p, {}); checkMark(g, x + 12, y + i * dy - 6, t, col, .9); txt(g, s, x + 34, y + i * dy, t, { size, fill: COL.chalk, weight: 600 }); return g; });
}
// horizontal bars with values: rows [label, value, colour]; k — px per unit
function bars(p, x, y, rows, t0, { k = 5, dy = 46, unit = '%', w0 = 210, size = 17 } = {}) {
  return rows.map(([s, v, c], i) => {
    const yy = y + i * dy, g = G(p, { o: 0 }); show(g, t0 + i * .5);
    T(g, s, { x: x + w0 - 12, y: yy + 6, size, fill: c, weight: 700, anchor: 'end' });
    const b = mk('rect', { x: x + w0, y: yy - 13, width: 0, height: 24, rx: 7, fill: c }, g);
    const tv = T(g, '', { x: x + w0 + 8, y: yy + 6, size, fill: COL.chalk, weight: 700 });
    prog(q => { b.setAttribute('width', f1(k * v * q)); put(tv, { x: x + w0 + 8 + k * v * q }); tv.textContent = (unit === '' ? '' : (v * q).toFixed(v % 1 ? 1 : 0).replace('.', ',')) + unit; }, t0 + i * .5, 1);
    return g;
  });
}
// a resistance arrow (the hand or a band pushes the other way): a short thick arrow onto point P from direction ang
function pushArr(p, P, ang, col, t0, L = 70) { const A = polar(P, L + 14, ang), B = polar(P, 14, ang); return arw(p, A[0], A[1], B[0], B[1], col, t0, 7); }

// a long-sitting rig figure rowing against a band looped under the feet
function rowFig(p, hx, FY, s, t0) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...STAND, t: 0, hN: 90, kN: 0, hF: 90, kF: 0, fN: 0, fF: 0, aN: 80, eN: 0, aF: 80, eF: 0 } });
  const set = k => { f.set({ t: -6 * k + 4 }); put(f.g, { x: hx, y: FY - 25 * s }); const A = onStage(f, 'AN'), Sh = onStage(f, 'Sh'), W = [lerp(A[0] - 30 * s, Sh[0] + 40 * s, k), Sh[1] + 30 * s]; reach(f, 'N', ...W); reach(f, 'F', W[0] - 4, W[1]); return [onStage(f, 'AN'), onStage(f, 'WN')]; };
  set(0); show(f.g, t0); return set;
}
// a cart pushed along the floor; returns set(x)
function cartEl(p, GY, t0, s = 1) {
  const g = G(p, { o: 0, s });
  mk('rect', { x: -60, y: -70, width: 120, height: 50, rx: 6, fill: '#c9a97a', stroke: mix('#c9a97a', '#000000', .4), 'stroke-width': 2 }, g);
  mk('rect', { x: -40, y: -100, width: 50, height: 30, rx: 4, fill: '#9fb0bf', stroke: mix('#9fb0bf', '#000000', .4), 'stroke-width': 2 }, g);
  [-40, 40].forEach(x => mk('circle', { cx: x, cy: -10, r: 10, fill: '#5e6a74' }, g));
  path(g, 'M-60 -66L-100 -190M-112 -190H-88', { stroke: COL.dim, 'stroke-width': 6, 'stroke-linecap': 'round' });
  show(g, t0);
  return x => { put(g, { x, y: GY }); return [x - 100 * s, GY - 190 * s]; };
}

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'Функциональная прогрессия', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Глава 17 · Урок 171', { x: 800, y: 130, size: 28, fill: COL.dim, anchor: 'middle', weight: 600 });
    T(g, 'Функциональная прогрессия для плеча', { x: 800, y: 215, size: 54, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const sub = txt(scene, 'сочетанные движения · тренажёры · перенос в повседневные дела', 800, 300, m('sub'), { size: 28, fill: SP, anchor: 'middle', weight: 600 });
    const art = G(scene, { o: 0 });
    floorLn(art, 500, 1100, 800, null); [...art.children].forEach(c => put(c, { o: 1 }));
    const cs = cartEl(art, 800, null); put(art.lastChild, { o: 1 });
    const f = fig(art, { x: 0, y: 0, s: 1, pose: { ...STAND, t: 14 } });
    prog(q => { const x = 760 + 160 * q, H = cs(x); const w = 2 * Math.PI * 2 * q; f.set(gaitPose(w, 1, false)); f.set({ t: 14 }); plant(f, 'AN', x - 200 + 20 * Math.sin(w), 800); reach(f, 'N', ...H); reach(f, 'F', H[0] - 4, H[1]); }, .5, Math.max(3, D - 1.5), lin);
    show(art, .3);

  }],

  ['idea', 'Что такое прогрессия', (m, D) => {

    txt(p, 'от отдельных мышц — к нужным делам', 800, 56, m('seq'), { size: 28, weight: 700, anchor: 'middle', fill: SP });
    const steps = [['изолированные мышцы', SH], ['стабилизация', FUN], ['сочетанные паттерны', MU], ['нужные дела', SP]];
    steps.forEach(([s, c], i) => { const g = G(p, { x: 70 + i * 170, y: 360 - i * 50, o: 0 }); mk('rect', { x: 0, y: 0, width: 160, height: 50 + i * 50, rx: 10, fill: c, opacity: .85 }, g); T(g, s, { x: 80, y: -12, size: 15, fill: c, weight: 700, anchor: 'middle' }); show(g, m('seq', 1 + i * 1.6)); });
    pillRow(p, ['сила', 'мощность', 'выносливость', 'равновесие', 'координация', 'навык', 'аэробика'], 400, 520, m('seq', 6), { col: COL.task, size: 14, gap: .5, space: 6 });
    pillRow(p, ['тянуть', 'толкать', 'поднимать', 'опускать', 'нести'], 400, 620, m('comb', 6), { col: MU, size: 17, gap: .6 });
    infoCard(p, 800, 90, 760, 200, 'прогрессия', 'последовательность упражнений к нужным делам: открытая и закрытая цепь в сочетанных паттернах, сила, мощность и выносливость, равновесие, координация, навык, аэробная подготовка', SP, m('seq'), { size: 19 });
    infoCard(p, 800, 305, 760, 200, 'сочетанные движения', 'согласованная работа стабилизаторов и двигателей лопатки и плеча, контроль всей руки и корпуса, иногда и ног; тянуть, толкать, поднимать, опускать, нести — всё труднее', MU, m('comb'), { size: 19 });
  }],

    // lawnmower pull: from across the body down to up and back
    const GY = 860, f = fig(p, { x: 0, y: 0, s: .8, o: 0, pose: { ...STAND, t: 30, hN: 30, hF: 30, kN: 15, kF: 15 } }); plant(f, 'AN', 560, GY);
    const tbl = propLine(p, `M640 ${GY - 140}H720M700 ${GY - 140}V${GY}`, m('mower'));
    const bd2 = bandLine(p); show(bd2.e, m('mower')); show(f.g, m('mower'));
    const foot = [578, GY - 4];
    prog(q => { const k = cyc(q, 2), Sh = onStage(f, 'Sh'), W = [lerp(foot[0] + 30, Sh[0] - 70, k), lerp(GY - 90, Sh[1] - 20, k)]; reach(f, 'N', ...W); reach(f, 'F', 650, GY - 146); bd2.set(foot, W, 120); }, m('mower', 1), 6);
    floorLn(p, 440, 760, GY, m('mower'));

    floorLn(p, 40, 420, GY, m('cart'));
    infoCard(p, 800, 90, 760, 170, 'гребля', 'сидя с прямыми ногами, лента под стопами — тянуть концы назад; менять хват; сложнее — на фитболе; или блочный тренажёр', MU, m('row'), { size: 19 });
    infoCard(p, 800, 275, 760, 200, '«запуск газонокосилки»', 'стоя, бёдра согнуты, здоровая рука на столе; больная тянется через середину тела к ленте под стопой здоровой стороны и тянет по диагонали вверх; или гантель', FUN, m('mower'), { size: 19 });

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-comp', prompt: ['Какой это компонент движения?'],
    build: grid([

    ], [['pl', 'Тянуть', MU], ['pu', 'Толкать', SP], ['li', 'Поднимать', FUN], ['ca', 'Нести', SH]], { multi: false, text: true }),
  }], done) }],

  ['eq', 'Снаряды', (m, D) => {
    const p = panel(0);
    txt(p, 'таблица 17.6 — снаряды', 800, 56, m('blade'), { size: 28, weight: 700, anchor: 'middle', fill: SH });
    const rows = [['колеблющаяся пластина', 'анатомические плоскости и диагонали, круги', 'blade', SH], ['гребной тренажёр', 'выносливость, сведение лопаток, корпус', 'rower', MU], ['ручной эргометр', 'вперёд и назад; при соударении — больше назад', 'erg', FUN], ['валик, мяч, доска, полусфера', 'стабилизация и толчки в упоре, перенос веса', 'bal', SP], ['степпер, дорожка, платформа', '«лезть» руками, ходить на руках, быстрые смены', 'step', LG]];

      T(g, a, { x: 84, y: y + 40, size: 21, fill: c, weight: 700 });

    });

    mk('circle', { r: 90, fill: 'none', stroke: COL.dim, 'stroke-width': 4 }, ergo);
    const cr = G(ergo, {}); path(cr, 'M0 0L0 -90', { stroke: FUN, 'stroke-width': 8, 'stroke-linecap': 'round' }); mk('circle', { cx: 0, cy: -90, r: 12, fill: FUN }, cr);
    prog(q => cr.setAttribute('transform', `rotate(${f1(-720 * q)})`), m('erg', 1), 8, lin);
    T(ergo, '← назад', { x: 0, y: 130, size: 20, fill: FUN, weight: 700, anchor: 'middle' });
    T(ergo, 'при соударении: сведение лопаток, задние структуры', { x: 0, y: 165, size: 16, fill: COL.chalk, weight: 600, anchor: 'middle' });
    pill(p, 'изобретательность, но без обострения', 1180, 300, m('blade', 2), { col: SH, size: 17 });
  }],

  ['integ', 'Перенос в жизнь', (m, D) => {
    const p = panel(0);
    txt(p, 'от имитации с терапевтом — к самостоятельным делам', 800, 56, m('task'), { size: 28, weight: 700, anchor: 'middle', fill: SP });
    pillRow(p, ['простое', '→', 'сложное'], 400, 140, m('task', 1), { col: [SP, COL.dim, BAD], size: 20 });
    txt(p, 'те же паттерны и виды сокращения, что в нужных делах', 400, 190, m('task', 3), { size: 17, fill: COL.dim, weight: 600, anchor: 'middle' });
    // unloading a dishwasher to a low shelf
    const GY = 560, f = fig(p, { x: 0, y: 0, s: .8, o: 0, pose: { ...STAND } }); plant(f, 'AN', 160, GY); show(f.g, m('sup', 4));
    const shelf = propLine(p, `M260 ${GY - 150}H360`, m('sup', 4)), dish = mk('ellipse', { rx: 20, ry: 6, fill: '#e8eef2', stroke: '#9fb0bf', 'stroke-width': 2, opacity: 0 }, p); show(dish, m('sup', 4));
    prog(q => { const k = cyc(q, 1.5), P = [lerp(230, 300, k), lerp(GY - 30, GY - 160, k)]; f.set({ t: 40 * (1 - k), hN: 40 * (1 - k), hF: 40 * (1 - k), kN: 20 * (1 - k), kF: 20 * (1 - k) }); plant(f, 'AN', 160, GY); reach(f, 'N', ...P); dish.setAttribute('cx', f1(P[0])); dish.setAttribute('cy', f1(P[1] - 4)); }, m('sup', 5), 6);
    floorLn(p, 40, 400, GY, m('sup', 4));
    txt(p, 'посуда на низкую полку', 220, 610, m('sup', 5), { size: 16, fill: SP, weight: 700, anchor: 'middle' });
    pill(p, 'мытьё окна маленькими кругами', 580, 360, m('sup', 10), { col: SH, size: 16 });
    pill(p, 'бросок, мах битой — всем телом', 580, 420, m('sup', 13), { col: FUN, size: 16 });
    pillRow(p, ['малоподвижный: поза, эргономика', 'спортсмен, рабочий: выносливость, плиометрика'], 400, 720, m('who'), { col: [SH, MU], size: 15, gap: 4, space: 8 });
    infoCard(p, 800, 90, 760, 175, 'специфичность', 'от простых действий к сложным — в тех же паттернах и видах сокращения, что и в нужных делах', SP, m('task'), { size: 19 });
    infoCard(p, 800, 280, 760, 225, 'сначала с терапевтом', 'имитация без болезненных позиций и неправильной механики, потом дома или на работе: разгрузить посудомоечную машину, мыть окно маленькими кругами; бросок и мах — всем телом', SH, m('sup'), { size: 19 });
    infoCard(p, 800, 520, 760, 175, 'по образу жизни', 'малоподвижному — поза и эргономика, чтобы убрать повторную нагрузку; спортсмену и рабочему — выносливость мышц и сердца, интенсивная тренировка, плиометрика', MU, m('who'), { size: 19 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-start', prompt: ['С чего начать?'],
    build: grid([
      { parts: ['Имитация разгрузки посудомоечной машины с терапевтом'], ans: ['f'], why: 'Сначала — под присмотром.' },
      { parts: ['Сразу самостоятельно грузить тяжёлые коробки на работе'], ans: ['l'], why: 'Позже.' },
      { parts: ['Тележка двумя руками по ровному полу'], ans: ['f'], why: 'Сначала — проще.' },
      { parts: ['Тележка одной рукой с тяжёлым грузом по неровному'], ans: ['l'], why: 'Позже.' },
      { parts: ['Мытьё окна маленькими кругами'], ans: ['f'], why: 'Простое и безопасное.' },
    ], [['f', 'Сначала', SP], ['l', 'Позже', FUN]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Функциональная прогрессия соединяет силу, мощность, выносливость, равновесие и навык.', 'w1'],
     ['Гребля, «газонокосилка» и тележка тренируют тягу, толкание и подъём целиком.', 'w2'],
     ['Снаряды — от эргометра назад при соударении до качающейся доски и степпера.', 'w3'],
     ['Сначала имитация с терапевтом, потом самостоятельно; задачи — по образу жизни пациента.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SP }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-ergo', prompt: ['У офисной сотрудницы соударение и сутулость. Как использовать ручной эргометр?'],
    build: choice([
      ['Больше вращать назад — сведение лопаток и работа задних структур; плюс поза и рабочее место'],
      ['Только вперёд, с максимальным сопротивлением'],
      ['Эргометр при соударении противопоказан'],
      ['Сидя с поднятыми выше головы руками'],
    ], 0, 'Таблица 17.6: при соударении — акцент на вращение назад; малоподвижному — эргономика.',
    [null, 'Вперёд — больше тугих передних структур.', 'Его используют, с акцентом назад.', 'Выше головы — дуга соударения.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-sport', prompt: ['Волейболисту после реабилитации плеча нужно вернуться к подаче. Что добавить в конце программы?'],
    build: choice([
      ['Движения всем телом, плиометрику и выносливость — в паттернах подачи'],
      ['Только изометрию у тела'],
      ['Только растяжку'],
      ['Ничего — сила уже вернулась'],
    ], 0, 'Для спорта нужна специфичность: те же паттерны, мощность и выносливость.',
    [null, 'Это начальный этап.', 'Нужна мощность и навык.', 'Сила — не весь навык.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
