function sceneBox(p, x, y, w, h, title, col, t0) { const g = G(p, { o: 0 }); roundBox(g, x, y, w, h, EDGE, PANEL, 2); T(g, title, { x: x + w / 2, y: y + h - 16, size: 16, fill: col, weight: 700, anchor: 'middle' }); if (t0 !== null) show(g, t0); return g; }

/* ---------- chapter 18 helpers: a phase strip ---------- */
// Rehabilitation phases on a time axis: rows [label, from, to, colour] in weeks; ticks [[value, label]].
// Each phase gets its own row; they appear one by one (t0 + i * gap, or t0[i] if an array).
function phaseBar(p, x, y, w, max, rows, ticks, t0, { gap = .6, dy = 34, size = 15 } = {}) {
  const g = G(p, { o: 0 }), X = v => x + w * v / max;
  path(g, `M${x} ${y}H${x + w}`, { stroke: COL.dim, 'stroke-width': 3 });
  ticks.forEach(([v, s0]) => { path(g, `M${f1(X(v))} ${y - 6}V${y + 6}`, { stroke: COL.dim, 'stroke-width': 2 }); T(g, s0, { x: X(v), y: y + 26, size: 14, fill: COL.dim, anchor: 'middle' }); });
  if (t0 !== null) show(g, Array.isArray(t0) ? t0[0] : t0);
  const els = rows.map(([s0, a, b, c], i) => {
    const r = G(p, { o: 0 }), yy = y - 26 - (rows.length - 1 - i) * dy;
    mk('rect', { x: X(a), y: yy - 12, width: Math.max(4, X(b) - X(a)), height: 22, rx: 8, fill: c, 'fill-opacity': .85 }, r);
    const fits = uiW(s0, size) + 16 <= X(b) - X(a);
    T(r, s0, { x: fits ? X(a) + 8 : X(b) + 8, y: yy + 5, size, fill: fits ? COL.board : c, weight: 700 });
    if (t0 !== null) show(r, Array.isArray(t0) ? t0[i] : t0 + i * gap);
    return r;
  });
  return { g, rows: els, X };
}

/* ---------- chapter 18 helpers (lesson 175) ---------- */
// a two-column list with marks: items [text, colour], cross (✕) or tick
function markList(p, x, y, items, t0, gap, { cross: isX = true, size = 16, dy = 36, maxW = 300 } = {}) {
  return items.map(([s0, c], i) => { const g = G(p, { o: 0 }), yy = y + i * dy; if (isX) cross(g, x + 10, yy - 6, 9, 0, 4); else checkMark(g, x + 10, yy - 6, 0, c, .8); put(para(g, s0, x + 30, yy, null, { size, fill: c, weight: 600, maxW }), { o: 1 }); show(g, t0 + i * gap); return g; });
}
// a range bar: [label, lo, hi, mean, colour] on a % scale (k px per %)
function rangeBars(p, x, y, rows, t0, { k = 6, dy = 48, w0 = 220, size = 15, track = false } = {}) {
  return rows.map(([s0, lo, hi, mean, c], i) => {
    const g = G(p, { o: 0 }), yy = y + i * dy;
    T(g, s0, { x: x + w0 - 10, y: yy + 5, size, fill: c, weight: 700, anchor: 'end' });
    if (track) mk('rect', { x: x + w0, y: yy - 9, width: 100 * k, height: 18, rx: 6, fill: COL.faint, 'fill-opacity': .5 }, g);
    const a0 = track && lo === hi ? 0 : lo;
    mk('rect', { x: x + w0 + a0 * k, y: yy - 9, width: Math.max(4, (hi - a0) * k), height: 18, rx: 6, fill: c, 'fill-opacity': track ? .9 : .35 }, g);
    if (mean !== null) mk('rect', { x: x + w0 + mean * k - 3, y: yy - 14, width: 6, height: 28, rx: 2, fill: c }, g);
    T(g, (mean !== null ? String(mean).replace('.', ',') + ' %' : lo === hi ? `${lo} %` : `${lo}–${hi} %`), { x: x + w0 + Math.max(hi, mean ?? 0) * k + 12, y: yy + 5, size, fill: COL.chalk, weight: 700 });
    show(g, t0 + i * .6);
    return g;
  });
}

    const i3 = inc([.25, .1], [.1, 2.6], COL.whole, 'расщепление разгибателя пальцев', m('app', 1), 40, 760);
    [i1, i2, i3].forEach(e => hide(e, m('cut'), .4));
    const cut = G(p, { o: 0 }); const c1 = j.at(j.fore([-.6, 1.62])), c2 = j.at(j.fore([.65, 1.62]));
    path(cut, `M${f1(c1[0])} ${f1(c1[1])}L${f1(c2[0])} ${f1(c2[1])}`, { stroke: COL.bad, 'stroke-width': 4, 'stroke-dasharray': '6 5' }); show(cut, m('cut', .5));

    hide(j.rhG, m('cut', 3), .6); hide(cut, m('stem'), .4);
    j.implant('rh', m('stem', .5));
    const gr = G(p, { o: 0 }); const g1 = j.at(j.hum([-.32, -.1])), g2 = j.at(j.fore([-.72, 2.0]));
    path(gr, `M${f1(g1[0])} ${f1(g1[1])}L${f1(g2[0])} ${f1(g2[1])}`, { stroke: ANAT.tendon, 'stroke-width': 7, 'stroke-dasharray': '4 4' });
    lab(gr, 'трансплантат длинной ладонной', 40, 200, ...g2, ANAT.tendon, 0, { size: 15, anchor: 'start' }); show(gr, m('stem', 4));
    const nv = nerveLine(p, [j.at(j.fore([.6, .9])), j.at(j.fore([.75, 1.75])), j.at(j.fore([-.1, 2.3])), j.at(j.fore([-.85, 2.7]))], m('cx'), { w: 6, n: 6 });
    ring(p, j.at(j.fore([.5, 2.1])), 20, COL.bad, m('cx', .5));
    lab(p, 'задний межкостный нерв', 560, 520, ...j.at(j.fore([.65, 2.0])), NERVE_C, m('cx', .5), { size: 16 });
    infoCard(p, 800, 90, 760, 205, 'доступы', 'с расщеплением разгибателя пальцев (сохранить латеральную локтевую коллатеральную); по Кохеру; по Каплану', SH, m('app'), { size: 19 });
    infoCard(p, 800, 310, 760, 150, 'резекция', 'на уровне кольцевой связки, при тяжёлом переломе — с частью шейки; целые связки не отсекают; синовэктомия при синовите', COL.bad, m('cut'), { size: 18 });
    infoCard(p, 800, 475, 760, 120, 'протез', 'канал лучевой; связки восстанавливают; ЛЛКС — трансплантатом длинной ладонной', COL.good, m('stem'), { size: 18 });
    infoCard(p, 800, 610, 760, 235, 'осложнения', 'задний межкостный нерв; позиция и размер протеза; рана, инфекция, объём, синдром лучевого канала, разболтанность, боль; без протеза — смещение лучевой вверх, артроз; с протезом — расшатывание, износ', COL.bad, m('cx'), { size: 17 });
  }],

  ['post', 'Защита: первые недели', (m, D) => {
    const p = panel(0);
    txt(p, 'иммобилизация и максимальная защита', 400, 56, m('imm'), { size: 26, weight: 700, anchor: 'middle', fill: COL.good });
    const j = elbowSag(p, 230, 290, .64, m('imm'), { muscles: false });
    j.set({ flex: 70 });
    hingeBrace(p, j, m('imm', 1), 45);
    const Cj = j.at('C'); flexArc(p, Cj, 175, 45, 90, COL.good, m('imm', 4), 10);
    txt(p, '45–90°', Cj[0] + 175, Cj[1] - 30, m('imm', 4.5), { size: 18, fill: COL.good, weight: 700 });
    prog(q => j.set({ flex: lerp(70, 45, q) }), m('imm', 6), 1.2);
    prog(q => j.set({ flex: lerp(45, 110, cyc(q, 1)) + (q > .5 ? 0 : 0) }), m('imm', 10), 4);
    pill(p, 'ортез: снимают на упражнения, ночью — носят', 300, 690, m('imm', 12), { col: SH, size: 16 });
    // elevation: wrist above elbow above shoulder
    const f = fig(p, { x: 0, y: 0, s: .62, o: 0, pose: { aN: 150, eN: 25 } }); plant(f, 'AN', 690, 600); show(f.g, m('p1', 4));
    txt(p, 'запястье > локоть > плечо', 680, 630, m('p1', 4.5), { size: 15, fill: SH, weight: 700, anchor: 'middle' });
    const pb = phaseBar(p, 60, 830, 680, 26, [['максимальная', 0, 3, COL.good], ['умеренная', 2, 8, COL.task], ['минимальная', 8, 26, MU]], [[0, '0'], [3, '3 нед'], [8, '8 нед'], [26, '6 мес']], [m('p1'), D + 9, D + 9]);
    const e = foreEnd(p, 520, 560, .62, m('pron'));
    prog(q => e.set({ rot: lerp(0, -80, q) }), m('pron', .5), 1.5);
    txt(p, 'упражнения в пронации', 520, 650, m('pron', 1), { size: 16, fill: LG, weight: 700, anchor: 'middle' });
    infoCard(p, 800, 90, 760, 235, 'иммобилизация', 'длинный ортез или шарнирный с блоком разгибания до 3 недель: локоть 45–90°, предплечье в среднем положении, запястье нейтрально; движения часто через 1–3 дня', COL.good, m('imm'), { size: 19 });
    infoCard(p, 800, 340, 760, 235, 'максимальная защита: 2–3 недели', 'рана, боль, отёк — рука выше сердца, компрессионный рукав; плечо, запястье, кисть — сразу; локоть — защищённо через 2–3 дня, активно — с недели (не позже 3)', COL.good, m('p1'), { size: 19 });
    infoCard(p, 800, 590, 760, 175, 'восстановленный лучевой коллатеральный', 'упражнения на объём — с предплечьем в пронации; плюс субмаксимальная многоугловая изометрия', LG, m('pron'), { size: 19 });
  }],

  ['post2', 'Умеренная и минимальная защита', (m, D) => {
    const p = panel(0);
    txt(p, 'умеренная и минимальная защита', 400, 56, m('p2'), { size: 27, weight: 700, anchor: 'middle', fill: COL.task });
    phaseBar(p, 60, 860, 680, 26, [['максимальная', 0, 3, COL.good], ['умеренная', 2, 8, COL.task], ['минимальная', 8, 26, MU]], [[0, '0'], [3, '3 нед'], [8, '8 нед'], [26, '6 мес']], [.2, m('p2'), m('p3')]);
    const j = elbowSag(p, 200, 370, .55, m('p2'), { muscles: true });

    prog(q => j.set({ flex: lerp(40, 125, cyc(q, 1.5)) }), m('p2', 1), 5);
    pillRow(p, ['мягкая длительная растяжка', '«сокращение — расслабление»', 'мобилизация II → III'], 400, 110, m('p2', 3), { col: COL.task, size: 15, gap: 1.2 });

    txt(p, 'в книге — 1–2 lb', 330, 675, m('str', 1), { size: 13, fill: COL.dim, anchor: 'middle' });
    pill(p, 'захват и щипок · лёгкие дела', 560, 700, m('str', 4), { col: COL.task, size: 15 });
    prog(q => a.set({ vv: -8 * cyc(q, 1) }), m('p3', 3), 2.5);
    pillRow(p, ['мобилизация III–IV', 'лучевое и локтевое раскрытие', 'ортезы к 8 нед'], 400, 160, m('p3', 1), { col: MU, size: 15, gap: 1.2 });
    infoCard(p, 800, 90, 760, 205, 'умеренная: 2–3 → 8 недель', 'почти полный или функциональный объём при сохранной стабильности; мягкая длительная растяжка, «сокращение — расслабление», мобилизация II, после сращения — III', COL.task, m('p2'), { size: 18 });
    infoCard(p, 800, 310, 760, 150, 'противопоказание', 'варусная и вальгусная растяжка в конце разгибания и сгибания — особенно без протеза головки или при сомнительной стабильности', COL.bad, m('no'), { size: 18 });
    infoCard(p, 800, 475, 760, 120, 'сила', '0,5–1 кг, много повторений (в книге — 1–2 lb); захват, щипок, лёгкие дела', COL.task, m('str'), { size: 18 });
    infoCard(p, 800, 610, 760, 235, 'минимальная: 2–6 месяцев', 'мобилизация III–IV с растяжкой в конце объёма; лучевое раскрытие — для сгибания, локтевое — для разгибания; ортез к 8 неделям: статический прогрессивный — разгибание, динамический — сгибание; вся рука — гантели, ленты, тренажёры', MU, m('p3'), { size: 17 });

    infoCard(p, 800, 90, 760, 205, 'ожидаемо', 'стабильный локоть и безболезненные движения в функциональном объёме; резекция с протезом и без в ближайшие сроки сходна; хуже — при исходной нестабильности', SP, m('out'), { size: 18 });

    infoCard(p, 800, 665, 760, 150, 'остеосинтез и металлические протезы', 'при точной репозиции, прочной фиксации и ранних движениях — хорошие результаты', SP, m('good'), { size: 18 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-phase', prompt: ['Когда это уместно?'],
    build: grid([
      { parts: ['Активные движения плечом, запястьем и кистью'], ans: ['1'], why: 'Сразу после операции.' },
      { parts: ['Мобилизация II степени, мягкая длительная растяжка'], ans: ['2'], why: 'Умеренная защита (2–3 → 8 недель).' },

     ['Удаление головки меняет кинематику и стабильность, протез их восстанавливает: его выбирают при 3+ фрагментах, переломе венечного и нестабильности.', 'w2'],
     ['Ортез до 3 недель, движения через 1–3 дня; при пластике лучевой коллатеральной — в пронации.', 'w3'],
     ['Не растягивать в варус и вальгус в конце объёма; нагрузка — 0,5–1 кг, много повторений.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);

  }],

    ], 0, 'Варусные и вальгусные растяжки в конце объёма противопоказаны, особенно без протеза головки.',
    [null, 'Это уместно в умеренной фазе.', 'Уместно.', 'Уместно; III — после сращения.']),

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{

      ['Только изометрию до 8 недель'],
      ['С отягощением 2 кг'],

    [null, 'Супинация нагружает латеральный комплекс.', 'Движения начинают через 1–3 дня.', 'Сопротивление — позже и малое.']),

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
