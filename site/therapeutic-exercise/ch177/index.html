const SH = '#86c9e8', MU = '#f4a48c', LG = '#f1dfa0', FUN = '#f0c060', SP = '#8fd6b0', ENV = '#c9b8e8', BAD = COL.bad;
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : an === 'middle' ? x : x + (right ? 8 : -8), ly = an === 'middle' ? y + (ty > y ? 8 : -size) : y - size * .35;

}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
const arw = (p, x1, y1, x2, y2, col, t0, w = 6) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 14, g = G(p, { o: 0 }); path(g, `M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}M${f1(x2 - h * Math.cos(a - .5))} ${f1(y2 - h * Math.sin(a - .5))}L${f1(x2)} ${f1(y2)}L${f1(x2 - h * Math.cos(a + .5))} ${f1(y2 - h * Math.sin(a + .5))}`, { stroke: col, 'stroke-width': w }); if (t0 !== null) show(g, t0); else put(g, { o: 1 }); return g; };
const floorLn = (p, x1, x2, y, t0) => show(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 }), t0);
const ring = (p, P, r, col, t0) => { const c = mk('circle', { cx: f1(P[0]), cy: f1(P[1]), r, fill: 'none', stroke: col, 'stroke-width': 4, opacity: 0 }, p); show(c, t0); return c; };
// an arc of the glenoid or the head (radius rr about the centre C of the joint, angles a0..a1) in stage coordinates
const arcOn = (j, conv, rr, a0, a1) => { const P = []; for (let a = a0; a <= a1; a += 4) P.push(j.at(conv(polar([0, 0], rr, a)))); return P; };

/* ---------- exercise helpers (chapters 17–18) ---------- */
// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.
function fsReach(f, side, X, Y, flip = false) {
  const S = st(f.g), i = side === 'L' ? 0 : 1, k = i ? 1 : -1, Sh = f.pts.Sh[i];
  const tx = (X - S.x) / S.s - Sh[0], ty = (Y - S.y) / S.s - Sh[1], D = clamp(Math.hypot(tx, ty), 8, 137.5), dg = 180 / Math.PI;
  const phi = Math.atan2(k * tx, ty) * dg, be = Math.acos(clamp((72 * 72 + D * D - 66 * 66) / (2 * 72 * D), -1, 1)) * dg, ga = Math.acos(clamp((72 * 72 + 66 * 66 - D * D) / (2 * 72 * 66), -1, 1)) * dg;
  const sg = flip ? -1 : 1;
  f.set({ ['a' + side]: phi + sg * be, ['e' + side]: -sg * (180 - ga) });
}
// an elastic band between two stage points; set(A, B, rest) — brighter and thinner as it stretches
function bandLine(p, col = '#e86a8a') {
  const e = path(p, '', { stroke: col, 'stroke-width': 6, 'stroke-linecap': 'round' }, { o: 0 });
  return { e, set(A, B, rest = 100) { const L = Math.hypot(B[0] - A[0], B[1] - A[1]), k = clamp(L / rest - 1, 0, 1); e.setAttribute('d', `M${f1(A[0])} ${f1(A[1])}L${f1(B[0])} ${f1(B[1])}`); e.setAttribute('stroke-width', f1(6 - 2.5 * k)); e.setAttribute('stroke', mix(col, '#ffd75e', k * .6)); } };
}
const propLine = (p, d, t0, col = COL.dim, w = 5) => { const e = path(p, d, { stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' }, { o: 0 }); if (t0 !== null) show(e, t0); return e; };
// a ball (side view): set(x, y) moves it
function ballEl(p, r, col = '#86c9e8') {

  return { g, set(x, y) { put(g, { x, y }); } };
}
// a seated rig figure on a chair, ankle at (ax, GY)
function seatFig(p, ax, GY, s, t0, pose = {}) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...SIT, ...pose } });
  plant(f, 'AN', ax, GY);
  const [hx, hy] = onStage(f, 'H');
  chair(p, hx, hy + 22 * s / .5 * .32, GY, t0);

}
const QUAD = { ...STAND, t: 66, hN: 66, kN: 90, hF: 66, kF: 90, aN: 66, aF: 66, eN: 0, eF: 0, fN: -90, fF: -90 };
// a rig figure on all fours: knee at (kx, FY); hands under the shoulders
function quadFig(p, kx, FY, s, t0, pose = {}) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...QUAD, ...pose } });

}
// a checklist of criteria that tick one by one
function checklist(p, x, y, items, t0, gap, col = SP, { size = 18, dy = 40 } = {}) {
  return items.map((s, i) => { const t = t0 + i * gap, g = G(p, {}); checkMark(g, x + 12, y + i * dy - 6, t, col, .9); txt(g, s, x + 34, y + i * dy, t, { size, fill: COL.chalk, weight: 600 }); return g; });
}
// horizontal bars with values: rows [label, value, colour]; k — px per unit
function bars(p, x, y, rows, t0, { k = 5, dy = 46, unit = '%', w0 = 210, size = 17 } = {}) {
  return rows.map(([s, v, c], i) => {
    const yy = y + i * dy, g = G(p, { o: 0 }); show(g, t0 + i * .5);
    T(g, s, { x: x + w0 - 12, y: yy + 6, size, fill: c, weight: 700, anchor: 'end' });

    const tv = T(g, '', { x: x + w0 + 8, y: yy + 6, size, fill: COL.chalk, weight: 700 });
    prog(q => { b.setAttribute('width', f1(k * v * q)); put(tv, { x: x + w0 + 8 + k * v * q }); tv.textContent = (unit === '' ? '' : (v * q).toFixed(v % 1 ? 1 : 0).replace('.', ',')) + unit; }, t0 + i * .5, 1);

}
// a resistance arrow (the hand or a band pushes the other way): a short thick arrow onto point P from direction ang
function pushArr(p, P, ang, col, t0, L = 70) { const A = polar(P, L + 14, ang), B = polar(P, 14, ang); return arw(p, A[0], A[1], B[0], B[1], col, t0, 7); }


/* ---------- chapter 18 helpers (lesson 172) ---------- */
// a range dial round a stage point: the arc a0..a1 (degrees of flexion, 0 hanging down, turning forward = to the right)
function flexArc(p, C, r, a0, a1, col, t0, w = 10) { const e = path(p, romArc(C, r, a0, a1, 90, -1), { stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' }, { o: 0 }); if (t0 !== null) show(e, t0); return e; }
// a forearm-rotation dial for foreEnd: the sector ±a about thumb-up, and a pointer along the thumb
function rotDial(p, e, r, a, col, t0) {

/* ---------- chapter 18 helpers (lesson 173) ---------- */
// the flexion range a contracted capsule allows: [extension limit, flexion limit], scanned on the model
function capRange(j) {
  let lo = 0, hi = 145;
  for (let a = 0; a <= 145; a++) { j.set({ flex: a }); if (j.capA.tension < .97) { lo = a; break; } }
  for (let a = 145; a >= 0; a--) { j.set({ flex: a }); if (j.capP.tension < .97) { hi = a; break; } }
  return [lo, hi];
}
// a hinged elbow brace on an elbowSag model (bars, straps, the hinge); block — the extension stop in degrees
function hingeBrace(p, j, t0, block = null) {
  const g = G(p, { o: 0 }), col = '#9fb0bf', sw = 11 * st(j.g).s / .7;
  const bar1 = path(g, '', { stroke: col, 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-opacity': .9 });
  const bar2 = path(g, '', { stroke: col, 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-opacity': .9 });
  const straps = [0, 1, 2, 3].map(() => path(g, '', { stroke: '#6fa8c8', 'stroke-width': sw * 1.1, 'stroke-linecap': 'round', 'stroke-opacity': .75 }));
  const hinge = mk('circle', { r: sw * 1.3, fill: '#6f7f8c', stroke: '#2b343a', 'stroke-width': 2 }, g);
  const stop = block !== null ? path(g, '', { stroke: COL.bad, 'stroke-width': sw * .9, 'stroke-linecap': 'round' }) : null;
  const seg = (A, B) => `M${f1(A[0])} ${f1(A[1])}L${f1(B[0])} ${f1(B[1])}`;

    const a1 = j.at(j.hum([-.18, -4.6])), a2 = j.at(j.hum([-.22, -2.4])), b1 = j.at(j.fore([0, 2.6])), b2 = j.at(j.fore([.1, 5.2]));

// a small scene card: a framed box with a caption

/* ---------- chapter 18 helpers: a phase strip ---------- */
// Rehabilitation phases on a time axis: rows [label, from, to, colour] in weeks; ticks [[value, label]].

  if (t0 !== null) show(g, Array.isArray(t0) ? t0[0] : t0);

}
// a range bar: [label, lo, hi, mean, colour] on a % scale (k px per %)
function rangeBars(p, x, y, rows, t0, { k = 6, dy = 48, w0 = 220, size = 15, track = false } = {}) {
  return rows.map(([s0, lo, hi, mean, c], i) => {
    const g = G(p, { o: 0 }), yy = y + i * dy;
    T(g, s0, { x: x + w0 - 10, y: yy + 5, size, fill: c, weight: 700, anchor: 'end' });
    if (track) mk('rect', { x: x + w0, y: yy - 9, width: 100 * k, height: 18, rx: 6, fill: COL.faint, 'fill-opacity': .5 }, g);
    const a0 = track && lo === hi ? 0 : lo;
    mk('rect', { x: x + w0 + a0 * k, y: yy - 9, width: Math.max(4, (hi - a0) * k), height: 18, rx: 6, fill: c, 'fill-opacity': track ? .9 : .35 }, g);
    if (mean !== null) mk('rect', { x: x + w0 + mean * k - 3, y: yy - 14, width: 6, height: 28, rx: 2, fill: c }, g);
    T(g, (mean !== null ? String(mean).replace('.', ',') + ' %' : lo === hi ? `${lo} %` : `${lo}–${hi} %`), { x: x + w0 + Math.max(hi, mean ?? 0) * k + 12, y: yy + 5, size, fill: COL.chalk, weight: 700 });
    show(g, t0 + i * .6);
    return g;
  });
}

// a tendon close-up: healthy (parallel collagen) or tendinosis (disorganised fibres, new vessels)
function tendonPatch(p, x, y, w, h, sick, t0) {
  const g = G(p, { o: 0 }); roundBox(g, x, y, w, h, EDGE, PANEL, 2);
  for (let i = 0; i < 9; i++) {
    const yy = y + 22 + i * (h - 44) / 8;
    if (!sick) path(g, `M${x + 16} ${yy}H${x + w - 16}`, { stroke: ANAT.tendon, 'stroke-width': 3 });
    else { let d = `M${x + 16} ${yy}`; for (let k = 1; k <= 6; k++) d += `L${f1(x + 16 + (w - 32) * k / 6)} ${f1(yy + ((i * 7 + k * 5) % 9 - 4) * 2.4)}`; path(g, d, { stroke: ANAT.tendon, 'stroke-width': 2.5, 'stroke-opacity': .8 }); }
  }
  if (sick) for (let k = 0; k < 3; k++) path(g, `M${x + 30 + k * 50} ${y + 20}q12 20 -4 40t4 40`, { stroke: COL.bad, 'stroke-width': 3, 'stroke-opacity': .85 });
  if (t0 !== null) show(g, t0);
  return g;
}
// a fingertip that rubs across a point (cross-friction): returns the group; it oscillates along direction ang
function rubTip(p, P, ang, t0, dur, amp = 16) {
  const g = G(p, { o: 0 }); mk('ellipse', { rx: 15, ry: 20, fill: '#b9cfe0', 'fill-opacity': .9, stroke: '#4d6b80', 'stroke-width': 2 }, g);
  const u = polar([0, 0], 1, ang);
  prog(q => { const s0 = amp * Math.sin(2 * Math.PI * 4 * q); put(g, { x: P[0] + u[0] * s0, y: P[1] + u[1] * s0, r: ang + 90 }); }, t0, dur, lin);
  show(g, t0);
  return g;
}

// keep an armSide's wrist on a fixed stage point while it re-poses (forearm on a mat or a table)
function armHold(a, o, W0) { a.set(o); const W = a.at('W'), S0 = st(a.g); put(a.g, { x: S0.x + W0[0] - W[0], y: S0.y + W0[1] - W[1] }); a.set({}); }
// a helper hand (pale ellipse) with a push arrow onto stage point P from direction ang
function helpHand(p, P, ang, t0, col = COL.good) { const g = G(p, { o: 0 }), A = polar(P, 46, ang); mk('ellipse', { cx: A[0], cy: A[1], rx: 24, ry: 16, fill: '#b9cfe0', 'fill-opacity': .9, stroke: '#4d6b80', 'stroke-width': 2, transform: `rotate(${f1(ang)} ${f1(A[0])} ${f1(A[1])})` }, g); const B = polar(P, 28, ang), C2 = polar(P, 8, ang); arw(g, B[0], B[1], C2[0], C2[1], col, null, 5); if (t0 !== null) show(g, t0); return g; }

// a dumbbell held by an armSide: it follows the fist
function armDb(p, a, k = .6, t0 = null) { const g = G(p, { o: 0 }); dumbbell(g, k); a.onSet.push(() => { const P = a.at('grip'); put(g, { x: P[0], y: P[1], r: (a.dir || 0) + 90 }); }); a.set({}); if (t0 !== null) show(g, t0); return g; }
// resistance torque of gravity over the elbow angle (a scheme): two curves on a small chart
function torqueChart(p, x, y, w, h, curves, t0) {
  const g = G(p, { o: 0 });
  path(g, `M${x} ${y}H${x + w}M${x} ${y}V${y - h}`, { stroke: COL.dim, 'stroke-width': 2.5 });
  T(g, 'сопротивление', { x: x - 4, y: y - h - 10, size: 14, fill: COL.dim });
  [[0, '0°'], [90, '90°'], [140, '140°']].forEach(([v, s0]) => T(g, s0, { x: x + w * v / 140, y: y + 22, size: 13, fill: COL.dim, anchor: 'middle' }));
  T(g, 'сгибание локтя', { x: x + w, y: y + 44, size: 13, fill: COL.dim, anchor: 'end' });
  curves.forEach(([fn, col, s0, lx, ly]) => { path(g, fnPath(x, y, w, h, v => fn(v * 140)), { stroke: col, 'stroke-width': 4 }); T(g, s0, { x: lx, y: ly, size: 14, fill: col, weight: 700 }); });
  if (t0 !== null) show(g, t0);
  return g;
}

    txt(p, 'локоть 90° у туловища (вид сверху)', 240, 470, m('pos', 1), { size: 15, fill: SH, weight: 700, anchor: 'middle' });
    pill(p, 'иначе повернётся плечо', 240, 520, m('pos', 4), { col: COL.bad, size: 15 });
    const e = foreEnd(p, 560, 400, 1.15, m('pron'));
    const push = G(p, { o: 0 }); show(push, m('pron', 2));
    e.onSet.push(() => { const Rd = e.at('Rd'), C = e.at('C'), ang = Math.atan2(Rd[1] - C[1], Rd[0] - C[0]) / rad(1); [...push.children].forEach(c => c.remove()); put(helpHand(push, Rd, ang, null, e.q.rot <= 0 ? COL.good : SH), { o: 1 }); }); e.set({});
    prog(q => e.set({ rot: lerp(0, -80, q) }), m('pron', 3), 2.5);
    txt(p, 'тыл лучевой — пронировать', 560, 630, m('pron', 3), { size: 16, fill: COL.good, weight: 700, anchor: 'middle' });
    prog(q => e.set({ rot: lerp(-80, 80, q) }), m('sup', 2), 3);
    txt(p, 'ладонная сторона лучевой — супинировать', 560, 660, m('sup', 2), { size: 16, fill: SH, weight: 700, anchor: 'middle' });
    const rx = G(p, { o: 0 }); cross(rx, 380, 760, 14, 0, 5); T(rx, 'не на кисть', { x: 402, y: 767, size: 17, fill: COL.bad, weight: 700 }); checkMark(rx, 590, 760, 0, COL.good, 1.2); T(rx, 'на лучевую кость', { x: 612, y: 767, size: 17, fill: COL.good, weight: 700 }); show(rx, m('rad'));
    infoCard(p, 800, 90, 760, 150, 'положение', 'сидя, локоть 90° прижат к туловищу или на столе — иначе вместо предплечья повернётся плечо', SH, m('pos'), { size: 19 });
    infoCard(p, 800, 255, 760, 175, 'в пронацию', 'основание ладони — на тыльной стороне лучевой чуть выше запястья, пальцы — вокруг локтевой; пронировать и держать', COL.good, m('pron'), { size: 19 });
    infoCard(p, 800, 445, 760, 150, 'в супинацию', 'основание ладони — на ладонной стороне лучевой чуть выше запястья; супинировать и держать', SH, m('sup'), { size: 19 });
    infoCard(p, 800, 610, 760, 120, 'важно', 'сила — на лучевую кость, а не на кисть: иначе травма запястья', COL.bad, m('rad'), { size: 19 });
  }],

  ['epi', 'Мышцы надмыщелков', (m, D) => {
    const p = panel(0);
    txt(p, 'разгибатели и сгибатели запястья', 400, 56, m('ext'), { size: 27, weight: 700, anchor: 'middle', fill: MU });
    const a = armSide(p, 150, 220, .55, m('ext'), { muscles: ['ext', 'flx'] });
    a.set({ sh: 0, el: 40, wr: 0, fg: .2, pro: 1 });
    prog(q => a.set({ el: lerp(40, 0, q), wr: lerp(0, 75, q), fg: q }), m('ext', 2), 3);
    a.set({ el: 0, wr: 75, fg: 1 }); const Bf = a.at('back'); a.set({ el: 40, wr: 0, fg: .2 }); const hh = helpHand(p, Bf, -10, m('ext', 5)); hide(hh, m('wall'), .3);
    lab(p, 'растяжение по тыльной стороне', 60, 420, ...a.at(a.ext.mid(.4)), ANAT.stretch, m('ext', 5), { size: 16, anchor: 'start' });
    const wl = path(p, 'M470 110V560', { stroke: COL.dim, 'stroke-width': 8 }, { o: 0 }); show(wl, m('wall'));
    txt(p, 'стена', 485, 110, m('wall'), { size: 15, fill: COL.dim, weight: 700 });
    prog(q => a.set({ sh: lerp(8, -6, q), wr: lerp(75, 95, q), fg: 1 }), m('wall', 2), 3);
    pill(p, 'тыл кисти на стене, пальцы вниз — вести вверх', 400, 640, m('wall', 1), { col: COL.task, size: 15 });
    prog(q => a.set({ pro: 0, wr: lerp(95, -85, q), fg: 1 - q, sh: 4 }), m('flx', 1), 2.5);
    lab(p, 'растяжение по ладонной стороне', 60, 470, ...a.at(a.flx.mid(.4)), ANAT.stretch, m('flx', 4), { size: 16, anchor: 'start' });
    pill(p, 'ладонь на стене, пальцы вниз', 400, 800, m('flx', 6), { col: COL.good, size: 15 });
    infoCard(p, 800, 90, 760, 205, 'разгибатели запястья', 'с наружного надмыщелка: локоть разогнут, пронация; локтевое отведение, согнуть запястье и пальцы; мягко давить на тыл кисти — растяжение по тыльной стороне', MU, m('ext'), { size: 18 });
    infoCard(p, 800, 310, 760, 150, 'у стены', 'тыл кисти на стене, пальцы вниз — скользить вверх; согнуть пальцы, чтобы добавить', COL.task, m('wall'), { size: 18 });
    infoCard(p, 800, 475, 760, 205, 'сгибатели запястья', 'с внутреннего надмыщелка: локоть разогнут, супинация, лучевое отведение и разгибание; давление на ладонь; или ладонь на стене, пальцы вниз', COL.good, m('flx'), { size: 18 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-err', prompt: ['Верно или ошибка?'],
    build: grid([
      { parts: ['Давить на кисть, растягивая в супинацию'], ans: ['x'], why: 'Сила — на лучевую кость, не на кисть.' },
      { parts: ['Локоть 90° у туловища при растяжке в пронацию'], ans: ['v'], why: 'Так не поворачивается плечо.' },
      { parts: ['Пружинящие рывки в конце объёма'], ans: ['x'], why: 'Мягко и долго, без рывков.' },
      { parts: ['Двуглавая: разгибание плеча, локтя и пронация'], ans: ['v'], why: 'Полная растяжка двусуставной мышцы.' },
      { parts: ['Не проверять суставную игру перед растяжкой мышц'], ans: ['x'], why: 'Сначала убедиться, что не ограничивает капсула.' },
    ], [['v', 'Верно', COL.good], ['x', 'Ошибка', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Сначала капсула, потом мышцы; растягивать мягко и долго, без пружинящих рывков.', 'w1'],
     ['Разгибание — полотенце под плечом и манжета на предплечье во всех трёх положениях; двуглавая — ещё разгибание плеча и пронация.', 'w2'],
     ['Сгибание — опора на предплечья или наклон над предплечьем; трёхглавая — сгибание локтя и плеча.', 'w3'],
     ['Ротация — локоть 90° у тела, сила на лучевую кость; разгибатели — пронация и сгибание запястья, сгибатели — супинация и разгибание.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-bic', prompt: ['Разгибание после перелома не хватает 20°; сопротивление растяжке растёт, когда плечо разгибается. Что добавить?'],
    build: choice([
      ['Растяжку двуглавой: разгибание плеча + разгибание локтя + пронация'],
      ['Растяжку трёхглавой с поднятой рукой'],
      ['Растяжку сгибателей запястья в супинации'],
      ['Пружинящие движения в конце объёма'],
    ], 0, 'Двуглавая — единственный сгибатель, проходящий через плечо.',
    [null, 'Трёхглавая не ограничивает разгибание.', 'Это не главный ограничитель.', 'Рывки не используют.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-sup', prompt: ['Пациент растягивает предплечье в супинацию, держа себя за кисть, и жалуется на боль в запястье. Что исправить?'],
    build: choice([
      ['Давить основанием ладони на ладонную сторону лучевой кости чуть выше запястья, локоть 90° у туловища'],
      ['Держать за пальцы'],
      ['Выпрямить локоть'],
      ['Растягивать быстрее'],
    ], 0, 'Сила прикладывается к лучевой кости, а локоть у туловища исключает ротацию плеча.',
    [null, 'Ещё больше нагрузка на запястье.', 'Тогда повернётся плечо.', 'Растягивают мягко и долго.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
