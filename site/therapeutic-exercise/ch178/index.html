// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.

  if (t0 !== null) show(g, Array.isArray(t0) ? t0[0] : t0);
  const els = rows.map(([s0, a, b, c], i) => {
    const r = G(p, { o: 0 }), yy = y - 26 - (rows.length - 1 - i) * dy;
    mk('rect', { x: X(a), y: yy - 12, width: Math.max(4, X(b) - X(a)), height: 22, rx: 8, fill: c, 'fill-opacity': .85 }, r);

function rangeBars(p, x, y, rows, t0, { k = 6, dy = 48, w0 = 220, size = 15, track = false } = {}) {

// a tendon close-up: healthy (parallel collagen) or tendinosis (disorganised fibres, new vessels)
function tendonPatch(p, x, y, w, h, sick, t0) {

    else { let d = `M${x + 16} ${yy}`; for (let k = 1; k <= 6; k++) d += `L${f1(x + 16 + (w - 32) * k / 6)} ${f1(yy + ((i * 7 + k * 5) % 9 - 4) * 2.4)}`; path(g, d, { stroke: ANAT.tendon, 'stroke-width': 2.5, 'stroke-opacity': .8 }); }

    infoCard(p, 800, 90, 760, 150, 'мышцы и положение', 'пронация — круглый и квадратный пронаторы; супинация — супинатор и двуглавая; локоть 90° у туловища', SH, m('pos'), { size: 18 });
    infoCard(p, 800, 255, 760, 205, 'свободный вес', 'груз с одной стороны кисти — палка с грузом на конце; запястье нейтрально, особенно в конце; груз со стороны мизинца — нижняя дуга, другая половина объёма', COL.task, m('bar'), { size: 18 });
    infoCard(p, 800, 475, 760, 150, 'лента', 'конец держит здоровая рука или он надёжно привязан к ручке; для большей нагрузки — на коротком стержне', '#e86a8a', m('band'), { size: 18 });
    infoCard(p, 800, 640, 760, 120, 'функционально', 'стоя у двери, рука у бока, локоть 90° — крутить ручку, не подменяя плечом', SP, m('knob'), { size: 18 });
  }],

  ['wrist', 'Запястье', (m, D) => {
    const p = panel(0);
    txt(p, 'сгибатели и разгибатели запястья', 400, 56, m('which'), { size: 27, weight: 700, anchor: 'middle', fill: MU });
    matLine(p, 20, 160, 214, m('which'));
    const a = armSide(p, 40, 70, .45, m('which'), { muscles: ['ext', 'flx'] });
    a.set({ sh: 90, el: 90, wr: 0, fg: .7, pro: 1 }); armDb(p, a, .5, m('db'));
    prog(q => { const k = cyc(q, 2); a.set({ wr: -45 * k }); a.ext.act(k); }, m('which', 1), 4);
    txt(p, 'пронация — разгибатели', 180, 300, m('which', 1), { size: 15, fill: MU, weight: 700, anchor: 'middle' });
    prog(q => { const k = cyc(q, 2); a.set({ pro: 0, wr: 45 * k }); a.ext.act(0); a.flx.act(k); }, m('which', 5.5), 4);
    txt(p, 'супинация — сгибатели', 180, 330, m('which', 5.5), { size: 15, fill: COL.good, weight: 700, anchor: 'middle' });
    pill(p, 'лента: петля под стопой, предплечье на бедре', 400, 400, m('band', .5), { col: '#e86a8a', size: 15 });
    prog(q => { const k = cyc(q, 2); a.set({ pro: 1, wr: -45 * k }); a.flx.act(0); a.ext.act(k); }, m('db', 1), 4);
    // wrist roller: a rod in both hands, the cord winds and lifts the weight
    const rg = G(p, { o: 0 }), R0 = [560, 520];
    mk('rect', { x: R0[0] - 120, y: R0[1] - 10, width: 240, height: 20, rx: 8, fill: '#c9a97a', stroke: '#6b5520', 'stroke-width': 2 }, rg);
    [-1, 1].forEach(sg => mk('ellipse', { cx: R0[0] + sg * 95, cy: R0[1], rx: 26, ry: 22, fill: '#d8d1c1', stroke: '#8a8476', 'stroke-width': 2 }, rg));
    const cord = path(rg, '', { stroke: COL.chalk, 'stroke-width': 3 }), wt = G(rg, {}); mk('rect', { x: -24, y: 0, width: 48, height: 36, rx: 6, fill: '#7f8f9c', stroke: '#3f4a52', 'stroke-width': 2 }, wt);
    const stripe = path(rg, '', { stroke: '#6b5520', 'stroke-width': 3 });
    prog(q => { const L = lerp(260, 60, q); cord.setAttribute('d', `M${R0[0]} ${R0[1] + 10}V${R0[1] + 10 + L}`); put(wt, { x: R0[0], y: R0[1] + 10 + L }); const ph = q * 14; stripe.setAttribute('d', `M${f1(R0[0] - 20 + 40 * ((ph % 1)))} ${R0[1] - 10}V${R0[1] + 10}`); }, m('roll', 2), 7);
    show(rg, m('roll'));
    txt(p, 'роллер: шнур ≈ 60–120 см', R0[0], R0[1] - 50, m('roll'), { size: 15, fill: COL.task, weight: 700, anchor: 'middle' });
    txt(p, 'в книге — 2–4 фута', R0[0], R0[1] - 28, m('roll'), { size: 13, fill: COL.dim, anchor: 'middle' });
    infoCard(p, 800, 90, 760, 150, 'какие мышцы', 'сгибание — мышцы внутреннего надмыщелка, разгибание — наружного; пронация — разгибатели, супинация — сгибатели', MU, m('which'), { size: 18 });
    infoCard(p, 800, 255, 760, 150, 'лента', 'петля под стопой, предплечье на бедре; петля через тыл кисти — разгибатели, через ладонь — сгибатели', '#e86a8a', m('band'), { size: 18 });
    infoCard(p, 800, 420, 760, 120, 'гантель', 'предплечье на столе, кисть за краем — разгибать и сгибать запястье', MU, m('db'), { size: 18 });
    infoCard(p, 800, 555, 760, 205, 'роллер', 'шнур с грузом на середине палки; попеременно вращать запястья, намотать и медленно опустить; нужна стабилизация плеча и локтя; согнутые локти или супинация — сгибатели', COL.task, m('roll'), { size: 18 });
  }],

  ['func', 'Функциональная прогрессия', (m, D) => {
    const p = panel(0);

    const rf = fig(p, { x: 0, y: 0, s: .62, o: 0, dir: -1, pose: { aN: 70, eN: 10, aF: 70, eF: 10 } }); plant(rf, 'AN', 520, 560); show(rf.g, m('pull'));
    const rb = bandLine(p); show(rb.e, m('pull'));
    rf.onSet.push(() => rb.set([wallX, 400], onStage(rf, 'WN'), 120)); rf.set({});
    prog(q => { const k = cyc(q, 2); rf.set({ aN: 70 - 50 * k, eN: 10 + 90 * k, aF: 70 - 50 * k, eF: 10 + 90 * k }); }, m('pull', 1), 6);
    txt(p, 'тяга: сгибатели локтя + лопатка', 430, 600, m('pull', 1), { size: 15, fill: COL.task, weight: 700, anchor: 'middle' });

    // pushing: a wall push-up
    const wf = fig(p, { x: 0, y: 0, s: .62, o: 0, pose: { ...LEAN(25), aN: 95, eN: 10, aF: 95, eF: 10 } }); plant(wf, 'AN', 610, 560); show(wf.g, m('push'));
    const wall2 = 735; path(p, `M${wall2} 240V560`, { stroke: COL.dim, 'stroke-width': 6 }, { o: 0 }); show(p.lastChild, m('push'));
    prog(q => { const k = cyc(q, 2); wf.set({ ...LEAN(25 + 8 * k), aN: 95 - 5 * k, eN: 10 + 80 * k, aF: 95 - 5 * k, eF: 10 + 80 * k }); plant(wf, 'AN', 610, 560); reach(wf, 'N', wall2 - 10, 360); reach(wf, 'F', wall2 - 12, 362); }, m('push', 1), 6);
    txt(p, 'толчок: трёхглавая + лопатка', 640, 630, m('push', 1), { size: 15, fill: MU, weight: 700, anchor: 'middle' });
    pill(p, 'жим · эргометр · отжимания · брусья · степпер · толкать груз, дверь', 400, 720, m('push', 6), { col: MU, size: 14 });
    infoCard(p, 800, 90, 760, 175, 'цепь', 'локоть работает с плечом и кистью; следить, чтобы слабое звено не подменялось обходными движениями', SP, m('comb'), { size: 18 });
    infoCard(p, 800, 280, 760, 120, 'диагонали ПНФ', 'вручную, гантели, лента, блок, изокинетика; растут сопротивление, скорость, повторения', SH, m('pnf'), { size: 18 });
    infoCard(p, 800, 415, 760, 205, 'тяга', 'подтягивание против ленты; к перекладине с половиной веса (трапеция над кроватью); «газонокосилка»; гребля; перетаскивание грузов', COL.task, m('pull'), { size: 18 });
    infoCard(p, 800, 635, 760, 205, 'толчок', 'жим вверх и лёжа; ручной эргометр; отжимания от стены, с колен, полные; от стула и на брусьях; степпер руками; толкать грузы, открыть дверь', MU, m('push'), { size: 18 });
  }],

  ['plyo', 'Плиометрика и имитация', (m, D) => {
    const p = panel(0);
    txt(p, 'мощность и реальные задачи', 400, 56, m('plyo'), { size: 28, weight: 700, anchor: 'middle', fill: COL.task });
    const wallX = 680; path(p, `M${wallX} 160V560`, { stroke: COL.dim, 'stroke-width': 6 }, { o: 0 }); show(p.lastChild, m('plyo'));
    const f = fig(p, { x: 0, y: 0, s: .75, o: 0, pose: { aN: 80, eN: 100, aF: 80, eF: 100 } }); plant(f, 'AN', 300, 560); show(f.g, m('plyo'));
    const ball = ballEl(p, 22, COL.task); show(ball.g, m('plyo'));
    prog(q => {
      const k = (q * 3) % 1, Hn = onStage(f, 'WN'), throwing = k < .5, u = throwing ? k * 2 : (k - .5) * 2;
      f.set({ aN: 80, eN: throwing ? lerp(100, 10, Math.min(1, u * 3)) : lerp(10, 100, Math.min(1, u * 3)), aF: 80, eF: throwing ? lerp(100, 10, Math.min(1, u * 3)) : lerp(10, 100, Math.min(1, u * 3)) });
      const A = [Hn[0] + 20, Hn[1]], B = [wallX - 22, Hn[1] - 20], t = throwing ? u : 1 - u;
      ball.set(lerp(A[0], B[0], t), lerp(A[1], B[1], t) - 80 * Math.sin(Math.PI * t));
    }, m('plyo', 1), Math.max(6, m('sim') - m('plyo') - 2), lin);
    const pt0 = txt(p, 'поймать — сразу бросить', 450, 600, m('plyo', 1), { size: 16, fill: COL.task, weight: 700, anchor: 'middle' }); hide(pt0, m('sim'), .4);
    pillRow(p, ['лента: быстрая смена', 'из-за головы, от груди, сбоку', 'мяч о стену, ракетка'], 400, 660, m('plyo', 3), { col: COL.task, size: 14, gap: 1.5 });
    hide(f.g, m('sim'), .4); hide(ball.g, m('sim'), .4);
    const tf = frontStand(p, 330, 560, .7, m('sim', .5), { muscles: false, pose: { aR: -20, eR: 30 } });
    const pul = [620, 420], pb = bandLine(p); mk('circle', { cx: pul[0], cy: pul[1], r: 16, fill: '#9fb0bf', stroke: '#3f4a52', 'stroke-width': 2, opacity: 0 }, p); show(p.lastChild, m('sim', .5));
    show(pb.e, m('sim', .5));
    prog(q => { const k = cyc(q, 2); tf.set({ aR: -20 + 120 * k, eR: 30 - 20 * k }); pb.set(pul, tf.at(tf.pts.arms[1][2]), 200); }, m('sim', 1), Math.max(4, D - m('sim') - 1.5));
    txt(p, 'настенный блок: справа, слева, подача', 400, 610, m('sim', 1), { size: 15, fill: SH, weight: 700, anchor: 'middle' });
    pill(p, 'время, повторения, скорость, сопротивление ↑', 400, 720, m('sim', 8), { col: SH, size: 15 });
    infoCard(p, 800, 90, 760, 235, 'плиометрика', 'лента — быстрая смена уступающей и преодолевающей работы; поймать утяжелённый мяч и сразу бросить — из-за головы, от груди, сбоку; мяч о стену, теннисный мяч на ракетке в пронации и супинации', COL.task, m('plyo'), { size: 18 });
    infoCard(p, 800, 340, 760, 235, 'имитация задач', 'разобрать движение и отработать целиком: поднять, опустить, нести, толкать, тянуть, крутить, ловить, бросать, замахиваться; после «теннисного локтя» — удары на настенном блоке', SH, m('sim'), { size: 18 });
  }],

      { parts: ['Подтягивание к перекладине с половиной веса'], ans: ['l'], why: 'Тяга в закрытой цепи.' },

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Изометрия — во многих углах и под задачу; сопротивление на предплечье, а не на кисти.', 'w1'],
     ['Двуглавую подчёркивают супинацией и разгибанием плеча, длинную головку трёхглавой — рукой над головой; лёжа и стоя максимум в разных углах.', 'w2'],
     ['Ротация — локоть у тела, груз с одной стороны кисти; запястье — пронация для разгибателей, супинация для сгибателей, роллер.', 'w3'],
     ['Функция — диагонали, тяга, толчок, плиометрика и имитация реальных задач.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });

      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-box', prompt: ['Грузчику нужно носить коробки у груди. Какую изометрию выбрать для сгибателей?'],
    build: choice([

      ['Только в пронации, 3 секунды'],

    [null, 'Не тот угол.', 'Не то положение предплечья.', 'Сопротивление — на предплечье.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{

    build: choice([

      ['Взять гантель тяжелее'],
      ['Делать быстрее'],
    ], 0, 'Локоть у туловища исключает подмену ротацией плеча.',
    [null, 'Тогда плечо повернётся ещё легче.', 'Ошибка в положении, не в весе.', 'Скорость не исправит подмену.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
