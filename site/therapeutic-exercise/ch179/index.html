const SH = '#86c9e8', MU = '#f4a48c', LG = '#f1dfa0', FUN = '#f0c060', SP = '#8fd6b0', ENV = '#c9b8e8', BAD = COL.bad;

  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);

/* ---------- exercise helpers (chapters 17–18) ---------- */
// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.
function fsReach(f, side, X, Y, flip = false) {

  const tx = (X - S.x) / S.s - Sh[0], ty = (Y - S.y) / S.s - Sh[1], D = clamp(Math.hypot(tx, ty), 8, 137.5), dg = 180 / Math.PI;
  const phi = Math.atan2(k * tx, ty) * dg, be = Math.acos(clamp((72 * 72 + D * D - 66 * 66) / (2 * 72 * D), -1, 1)) * dg, ga = Math.acos(clamp((72 * 72 + 66 * 66 - D * D) / (2 * 72 * 66), -1, 1)) * dg;
  const sg = flip ? -1 : 1;

}
// an elastic band between two stage points; set(A, B, rest) — brighter and thinner as it stretches
function bandLine(p, col = '#e86a8a') {

}

// a seated rig figure on a chair, ankle at (ax, GY)
function seatFig(p, ax, GY, s, t0, pose = {}) {

  const bar1 = path(g, '', { stroke: col, 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-opacity': .9 });

    pill(p, 'вогнутая по выпуклой — по движению', 400, 265, m('radial', 5), { col: COL.good, size: 16 });
    infoCard(p, 800, 90, 760, 175, 'трапеция и первая пястная', 'трапеция вогнута в тыльно-ладонном направлении и выпукла в лучелоктевом, пястная — наоборот', SH, m('saddle'), { size: 19 });
    infoCard(p, 800, 280, 760, 150, 'рыхлая капсула', 'большой объём: полное противопоставление — основа захвата', COL.chalk, m('lax'), { size: 19 });
    infoCard(p, 800, 445, 760, 110, 'новые названия', 'приняты кистевыми обществами в начале девяностых', FUN, m('term'), { size: 19 });
    infoCard(p, 800, 570, 760, 145, 'ладонное отведение и приведение', 'от ладони и к ней; пястная выпуклая — скользит против движения', COL.task, m('palmar'), { size: 19 });
    infoCard(p, 800, 730, 760, 145, 'лучевое отведение и приведение', 'от лучевой и к ней; пястная вогнутая — скользит по движению', COL.good, m('radial'), { size: 19 });
  }],

  ['mp', 'Пальцы', (m, D) => {
    const p = panel(0);
    txt(p, 'пястно-фаланговый сустав', 400, 56, m('mp'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    const h = handSag(p, -230, 300, 2.2, m('mp'), { thumb: false, ghost: false, tendons: false, intr: false });
    h.set({ wr: 0, mp: 0, pip: 0, dip: 0 });
    prog(q => h.set({ mp: 70 * cyc(q, 1) }), m('mp', .8), 3.2);
    lab(p, 'ладонная пластинка', 40, 520, ...h.at('vpMP'), CAPS_C, m('plate', .3), { size: 17, anchor: 'start' });
    lab(p, 'коллатеральная', 560, 160, ...h.at('clMP'), CAPS_C, m('coll', .3), { size: 17 });
    prog(q => h.set({ mp: 85 * q }), m('coll', 1.2), 2.4);
    hide(txt(p, 'в сгибании натянута', 560, 190, m('coll', 3.6), { size: 15, fill: ANAT.taut, weight: 700 }), m('same') - 1.2, .3);
    prog(q => h.set({ mp: lerp(85, 20, q) }), m('same') - 1.2, 1);
    // the base of the proximal phalanx rolls and glides the same way as the movement (toward the palm)
    h.set({ mp: 20 }); const B = h.at(h.fr('1', [16, 0])); h.set({ mp: 0 });
    const sm = G(p, { o: 0 });
    path(sm, smoothD(arcPts(B, 46, -60, 40, 6), false), { stroke: COL.good, 'stroke-width': 5 });
    arw(sm, ...polar(B, 46, 30), ...polar(B, 46, 46), COL.good, null, 5);
    show(sm, m('same', .5)); hide(sm, m('ip'), .3);
    prog(q => h.set({ mp: lerp(20, 60, cyc(q, 1)) }), m('same', 1), 3);
    // abduction is possible in extension and blocked in flexion (from the back)
    const a = handFront(p, 600, 840, 1.2, m('lax'), { view: 'back' });
    a.set({ f: [0, 0, 0] });
    prog(q => a.set({ spread: 14 * cyc(q, 1.5) }), m('lax', .8), 4);
    prog(q => a.set({ f: [90 * q, 30 * q, 20 * q], spread: 0 }), m('coll', 1.2), 2.4);
    txt(p, 'с тыла', 600, 885, m('lax'), { size: 15, fill: COL.dim, anchor: 'middle' });
    prog(q => a.set({ f: [lerp(90, 0, q), lerp(30, 0, q), lerp(20, 0, q)] }), m('ip', .3), 1.5);
    prog(q => h.set({ mp: lerp(60, 20, q), pip: 70 * cyc(q, 1), dip: 50 * cyc(q, 1) }), m('ip', .6), 4);
    const M1 = a.at('MP1'), sx = G(p, { o: 0 });
    [[10, 6], [-8, -6]].forEach(([dx, dy]) => mk('circle', { cx: f1(M1[0] + dx), cy: f1(M1[1] + dy), r: 8, fill: FUN, stroke: COL.board, 'stroke-width': 2 }, sx));
    show(sx, m('tmp')); hide(sx, m('ulnar'), .3);
    hide(lab(p, 'две сесамовидные', 300, 620, ...M1, FUN, m('tmp', .5), { size: 16 }), m('ulnar'), .3);
    prog(q => a.set({ f: { 2: [50 * q, 20 * q, 10 * q], 3: [65 * q, 20 * q, 10 * q], 4: [78 * q, 20 * q, 10 * q], 5: [92 * q, 20 * q, 10 * q] } }), m('ulnar', .5), 3);
    infoCard(p, 800, 90, 760, 150, 'мыщелковые (II–V)', 'сгибание — разгибание, отведение — приведение; рыхлая капсула: добавочные движения и осевое вращение', SH, m('mp'), { size: 19 });
    infoCard(p, 800, 255, 760, 150, 'ладонная пластинка и две коллатеральные', 'коллатеральные натянуты в полном сгибании — палец не отвести', CAPS_C, m('plate'), { size: 19 });
    infoCard(p, 800, 420, 760, 120, 'скольжение', 'вогнутое основание по выпуклой головке — по движению', COL.good, m('same'), { size: 19 });
    infoCard(p, 800, 555, 760, 150, 'межфаланговые', 'блоковидные, одноосные; коллатеральные почти постоянной длины; скольжение по движению', COL.task, m('ip'), { size: 19 });
    infoCard(p, 800, 720, 760, 150, 'большой палец и локтевые пальцы', 'ПФ большого — одноосный, две сесамовидные; объём ПФ растёт от II к V: хват крепче с локтевой стороны', FUN, m('tmp'), { size: 18 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-joint', prompt: ['Какой сустав?'],
    build: grid([
      { parts: ['Седловидный, даёт противопоставление'], ans: ['c1'], why: 'Запястно-пястный большого пальца.' },
      { parts: ['Зубчатые поверхности, центральная опора'], ans: ['c23'], why: 'Запястно-пястные II и III.' },
      { parts: ['Складывают ладонь «чашечкой»'], ans: ['c45'], why: 'Запястно-пястные IV и V.' },
      { parts: ['Коллатеральные натянуты при полном сгибании'], ans: ['mp'], why: 'Пястно-фаланговые II–V.' },
      { parts: ['Отведение и приведение пальца'], ans: ['mp'], why: 'Мыщелковый пястно-фаланговый.' },
    ], [['c1', 'ЗП I', FUN], ['c23', 'ЗП II–III', COL.task], ['c45', 'ЗП IV–V', SH], ['mp', 'ПФ II–V', COL.good]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Запястье — лучезапястный и среднезапястный суставы; в делах кисть идёт по косой линии «броска дротика».', 'w1'],
     ['Проксимальный ряд скользит против движения кисти; в среднезапястном локтевой отдел — против, лучевой при сгибании и разгибании — по движению.', 'w2'],
     ['II и III пястные — опора, IV и V складывают ладонь; седловидный сустав даёт противопоставление.', 'w3'],
     ['В пястно-фаланговых коллатеральные натянуты при сгибании; фаланги скользят в сторону движения.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-ext', prompt: ['После иммобилизации пациенту трудно разогнуть запястье. Куда при разгибании должен скользить проксимальный ряд по лучевой кости?'],
    build: choice([
      ['В ладонную сторону — против движения кисти'],
      ['В тыльную сторону — вместе с кистью'],
      ['В локтевую сторону'],
      ['Никуда: в суставе только качение'],
    ], 0, 'Выпуклый ряд на вогнутой лучевой скользит против движения: кисть вверх — ряд в ладонную сторону.',
    [null, 'Так скользила бы вогнутая поверхность.', 'Это плоскость отклонений, а не разгибания.', 'Качение и скольжение идут вместе.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-cup', prompt: ['Пациентке трудно обхватить большую банку: ладонь не «обнимает» её. Какие суставы углубляют ладонь?'],
    build: choice([
      ['Запястно-пястные IV и V пальцев'],
      ['Запястно-пястные II и III пальцев'],
      ['Лучезапястный'],
      ['Дистальные межфаланговые'],
    ], 0, 'Четвёртая и пятая пястные сгибаются и поворачиваются к третьей — получается «чашечка».',
    [null, 'Это неподвижная центральная опора.', 'Он ставит кисть, но ладонь не складывает.', 'Они сгибают кончики пальцев, ладонь не меняют.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
