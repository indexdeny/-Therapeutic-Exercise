const SH = '#86c9e8', MU = '#f4a48c', LG = '#f1dfa0', FUN = '#f0c060', SP = '#8fd6b0', ENV = '#c9b8e8', BAD = COL.bad;

// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.
function fsReach(f, side, X, Y, flip = false) {

// horizontal bars with values: rows [label, value, colour]; k — px per unit

function hingeBrace(p, j, t0, block = null) {

  const bar1 = path(g, '', { stroke: col, 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-opacity': .9 });

      hook: { f: [0, 92, 70], spread: 0, dev: 0, rabd: 10, pabd: 0, tmp: 6, tip: 4, opp: 0 },
      lat: { f: { 2: [45, 75, 30], 3: [65, 95, 60], 4: [70, 95, 60], 5: [75, 95, 60] }, spread: 0, dev: 0, rabd: 0, pabd: .25, tmp: 20, tip: 10, opp: 1, oppPt: null },
    };
    F.set(POW.lat); const L2 = [F.J.PIP2[0] - 14, (F.J.PIP2[1] + F.J.DIP2[1]) / 2]; POW.lat.oppPt = L2;

    F.set({ f: [5, 5, 5] });

    Q = mid(ipad, padN); path(pen, `M${f1(Q[0] - 110)} ${f1(Q[1] - 90)}L${f1(Q[0] + 60)} ${f1(Q[1] + 50)}`, { stroke: '#86c9e8', 'stroke-width': 10 });

    const keyP = G(ob, { o: 0 }); { const Q0 = h.at(iside); mk('rect', { x: f1(Q0[0] - 7), y: f1(Q0[1] - 40), width: 14, height: 56, rx: 3, fill: '#c9cdd1', stroke: '#6a6f73', 'stroke-width': 2 }, keyP); }
    { const A0 = hc; prog(q => h.set(q < 1 ? SIDEp : SIDEp), m('power', 17.4), .2); prog(() => h.set(A0), m('pm'), .1); }
