    a.set({ f: [5, 5, 5] });
    helpHand(p, a.at([-10, 60]), 0, m('mwm', 4), COL.task);
    txt(p, 'стабилизация', 250 + 120, 880 - 1.6 * 70 + 40, m('mwm', 4.5), { size: 14, fill: COL.task, anchor: 'start' });
    pushArr(p, a.at('Tri'), 180, COL.good, m('mwm', 8));
    lab(p, 'скольжение ряда в лучевую сторону', 40, 330, ...a.at('Tri'), COL.good, m('mwm', 8.5), { size: 15, anchor: 'start' });
    const s2 = handSag(p, 660, 760, .62, m('act'), { thumb: false });
    put(s2.g, { r: -90 });
    prog(q => s2.set({ wr: -50 * Math.sin(Math.PI * 2 * q) }), m('act', .5), 6);
    txt(p, 'активно + нажим в конце', 660, 860, m('act', .5), { size: 14, fill: COL.dim, anchor: 'middle' });
    const cp = G(p, { o: 0 }); { const P = a.at('L'); arw(cp, P[0], P[1] + 26, P[0], P[1] - 22, FUN, null, 5); } show(cp, m('carp', 1));
    pill(p, '6–10 раз × 3 подхода', 400, 240, m('carp', 6), { col: FUN, size: 16 });
    prog(q => a.set({ f: { 2: [55 * cyc(q, 1), 30 * cyc(q, 1), 10 * cyc(q, 1)], 3: [5, 5, 5], 4: [5, 5, 5], 5: [5, 5, 5] } }), m('fing', 1.5), 4);
    pushArr(p, a.at([a.pts.MP2[0] - 6, (a.pts.MP2[1] + a.pts.PIP2[1]) / 2]), 0, COL.good, m('fing', 1));
    infoCard(p, 800, 90, 760, 150, 'контролируемые движения', 'мобилизация капсулы, растяжка, торможение мышц; проверить и вернуть скольжение сухожилий', SH, m('cap'), { size: 18 });
    infoCard(p, 800, 255, 760, 120, 'мобилизация III–IV', 'для суставов с ограниченной суставной игрой', COL.good, m('grade'), { size: 18 });
    infoCard(p, 800, 390, 760, 120, 'при РА — осторожно', 'в фазе воспаления часто противопоказано: ткань легко рвётся', COL.bad, m('ra'), { size: 18 });
    infoCard(p, 800, 525, 760, 175, 'запястье', 'ладонь к лицу; стабилизировать лучевую и локтевую, сдвинуть проксимальный ряд в лучевую сторону; пациент сгибает или разгибает и дожимает', COL.task, m('mwm'), { size: 18 });
    infoCard(p, 800, 715, 760, 155, 'кость запястья и пальцы', 'тыльное или ладонное скольжение кости; для ПФ и МФ — боковое смещение фаланги и активное движение', FUN, m('carp'), { size: 18 });
  }],

  ['func', 'Сила и функция', (m, D) => {
    const p = panel(0);
    txt(p, 'сила, функция, выносливость', 400, 56, m('exam'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    const h = handSag(p, 170, 380, 1.15, m('exam'));
    h.set({ wr: 0, mp: 20, pip: 25, dip: 10 });
    const hh = helpHand(p, h.at('dorsum'), -90, m('iso', 1), COL.task);
    prog(() => h.act({ ed: .6, wext: .6 }), m('iso', 1.5), .2);
    pill(p, 'одна рука сопротивляется другой', 400, 600, m('iso', 2), { col: COL.task, size: 16 });
    hide(hh, m('str'), .3);
    pill(p, 'с весами — осторожно', 400, 650, m('str', 3), { col: COL.bad, size: 16 });
    ['бассейн', 'велосипед'].forEach((s0, i) => pill(p, s0, 300 + i * 200, 720, m('act', 6 + i * .5), { col: SH, size: 16 }));
    const ev = G(p, { o: 0 });
    roundBox(ev, 60, 760, 680, 100, FUN, PANEL, 2);
    T(ev, '✓ низкая интенсивность: меньше боли, лучше функция и хват', { x: 80, y: 798, size: 16, fill: COL.good, weight: 700 });
    T(ev, '✕ высокая интенсивность может обострить', { x: 80, y: 836, size: 16, fill: COL.bad, weight: 700 });
    show(ev, m('ev'));
    infoCard(p, 800, 90, 760, 150, 'обследовать', 'многосуставные и внутренние мышцы: укорочение, спайки, слабость, дисбаланс', SH, m('exam'), { size: 18 });
    infoCard(p, 800, 255, 760, 150, 'совет', 'изометрия без боли, когда одна рука сопротивляется другой, — в течение дня', COL.task, m('iso'), { size: 18 });
    infoCard(p, 800, 420, 760, 150, 'сила и баланс', 'неразрушающее усилие, баланс антагонистов, выносливость; веса — осторожно', MU, m('str'), { size: 18 });
    infoCard(p, 800, 585, 760, 120, 'функция', 'захваты для работы и быта, координация, ловкость; бассейн или велосипед', SH, m('act'), { size: 18 });
    infoCard(p, 800, 720, 760, 150, 'данные', 'при РА упражнения низкой интенсивности полезны, высокой — могут обострить', FUN, m('ev'), { size: 18 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-prot', prompt: ['Это бережёт суставы?'],
    build: grid([
      { parts: ['Открывать тугую банку правой рукой с силой'], ans: ['n'], why: 'Лучше левой рукой или устройством.' },
      { parts: ['Носить сумку на предплечье или плече'], ans: ['y'], why: 'Нагружаются крупные суставы.' },
      { parts: ['Выкручивать тряпку пальцами'], ans: ['n'], why: 'Лучше сдавливать ладонями.' },
      { parts: ['Утолщённые ручки столовых приборов'], ans: ['y'], why: 'Меньше сильного хвата.' },
      { parts: ['Продолжать дело, хотя боль держится несколько часов'], ans: ['n'], why: 'Боль дольше часа — дело меняют или прекращают.' },
    ], [['y', 'Да', COL.good], ['n', 'Нет', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['При ревматоидном артрите — синовит, затем подвывихи и деформации: лучевое отклонение запястья, локтевой дрейф, «лебединая шея», «пуговичная петля».', 'w1'],
     ['Артроз — чаще основание большого пальца и ДМФ; после травмы помните о скрытом переломе.', 'w2'],
     ['Фаза защиты: ортез, мягкие движения, скольжение сухожилий, изометрия, защита суставов.', 'w3'],
     ['Затем мобилизация III–IV и мобилизация с движением; при РА — осторожно и с низкой интенсивностью.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-ra', prompt: ['Обострение ревматоидного артрита: ПФ суставы отёчные и тёплые. Что уместно из упражнений?'],
    build: choice([
      ['Мягкая безболезненная изометрия и движения в доступном объёме'],
      ['Мобилизация четвёртой степени'],
      ['Упражнения с отягощением в движении'],
      ['Интенсивная растяжка'],
    ], 0, 'При воспалении — изометрия без боли и движения по переносимости; сопротивление в движении не переносится.',
    [null, 'При РА в фазе воспаления мобилизация часто противопоказана.', 'При выпоте и воспалении не переносится.', 'Ткань ослаблена и легко рвётся.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-imm', prompt: ['После шести недель в гипсе разгибание запястья ограничено, ощущение плотное, воспаления нет. Что добавить?'],
    build: choice([
      ['Мобилизацию III–IV степени или мобилизацию с движением'],
      ['Только покой в ортезе'],
      ['Только изометрию'],
      ['Сильный хват с весом'],
    ], 0, 'Суставная игра снижена: растягиваем капсулу мобилизацией и сразу используем новый объём.',
    [null, 'Покой усилит тугоподвижность.', 'Изометрия не вернёт суставную игру.', 'Сначала объём и контроль, нагрузка — постепенно.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
