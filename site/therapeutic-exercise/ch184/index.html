    infoCard(p, 800, 390, 760, 150, 'объём и сила', 'противопоставление и ловкость лучше, но не во всех работах; лучше всего — при нетяжёлых нагрузках', COL.task, m('rom'), { size: 18 });
    infoCard(p, 800, 555, 760, 175, 'осложнения', 'мало: недостаточное облегчение и возврат нестабильности; ревизия — 3,8 %; нейропатическая боль', COL.bad, m('comp'), { size: 18 });
  }],

  ['rupt', 'Разрывы сухожилий при РА', (m, D) => {
    const p = panel(0);
    txt(p, 'разрывы сухожилий', 400, 56, m('why'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    const a = handFront(p, 290, 900, 1.65, m('why'), { tendons: 'ext' });
    a.set({ f: { 2: [0, 0, 0], 3: [0, 0, 0], 4: [35, 25, 10], 5: [45, 25, 10] } });
    ['ed4', 'ed5', 'edm', 'epl'].forEach((k, i) => tw(a.ten[k], { 'c_stroke': COL.bad, 'a_stroke-opacity': .5 }, m('which', 1 + (i > 2 ? 4 : i * .6)), .5));
    lab(p, 'разгибатели безымянного и мизинца', 470, 200, ...a.at('MC5'), COL.bad, m('which', 1.5), { size: 15 });
    lab(p, 'длинный разгибатель большого', 40, 300, ...a.at('MC1'), COL.bad, m('which', 5), { size: 15, anchor: 'start' });
    [['U', 'головка локтевой'], ['lister', 'бугорок Листера']].forEach(([k, s0], i) => { ring(p, a.at(k === 'U' ? [26, 12] : [-30, 16]), 20, FUN, m('cause', 6 + i * 2)); lab(p, s0, i ? 40 : 520, 820 - i * 0, ...a.at(k === 'U' ? [26, 12] : [-30, 16]), FUN, m('cause', 6.3 + i * 2), { size: 15, anchor: i ? 'start' : undefined }); });
    pill(p, 'безболезненно, при обычном движении', 400, 120, m('why', 6), { col: COL.bad, size: 15 });
    repIcon(p, 520, 330, 'transfer', 'перенос', m('opt', 1));
    repIcon(p, 700, 330, 'graft', 'пластика', m('opt', 7));
    repIcon(p, 520, 490, 'side', 'бок в бок', m('opt', 11));
    repIcon(p, 700, 490, 'end', 'конец в конец', m('opt', 16));
    infoCard(p, 800, 90, 760, 150, 'почему', 'хронический теносиновит; палец внезапно перестаёт разгибаться — признак тяжело поражённого сухожилия', COL.bad, m('why'), { size: 18 });
    infoCard(p, 800, 255, 760, 150, 'чаще всего', 'разгибатели мизинца и безымянного, длинный разгибатель большого; из сгибателей — длинный сгибатель большого', COL.bad, m('which'), { size: 18 });
    infoCard(p, 800, 420, 760, 175, 'причины', 'синовия прорастает в сухожилие; трение о головку локтевой, бугорок Листера, ладьевидную; инъекции стероидов; ишемия под удерживателем', FUN, m('cause'), { size: 18 });
    infoCard(p, 800, 610, 760, 120, 'показание', 'потеря функции: один разрыв может не мешать, несколько — сильно', SH, m('ind'), { size: 18 });
    infoCard(p, 800, 745, 760, 120, 'варианты', 'перенос (указательный → большой), пластика, шов «бок в бок», редко — «конец в конец»', COL.good, m('opt'), { size: 18 });
  }],

  ['ruptPost', 'После переноса сухожилия', (m, D) => {
    const p = panel(0);
    txt(p, 'медленная программа', 400, 56, m('imm'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    const h = handSag(p, 150, 340, 1.1, m('imm'), { thumb: true });
    h.set({ wr: -35, mp: 15, pip: 5, dip: 5 });
    const o1 = hOrth(h, 'volar', m('imm', 2), { wr: -35 });
    hide(lab(p, 'запястье 30–40° разгибания, ПФ 10–20° сгибания', 470, 130, ...h.at('MP'), ORTH_C, m('imm', 3), { size: 15 }), m('max'), .3);
    phaseBar(p, 60, 640, 680, 26, [['непрерывно', 0, 4, ORTH_C], ['дневной ортез', 0, 12, ORTH_C], ['ночной ортез', 0, 26, SH], ['лёгкие дела', 6, 26, COL.good], ['сопротивление', 8, 26, MU]], [[0, '0'], [4, '4'], [6, '6'], [8, '8'], [12, '12 нед'], [26, '6 мес']], [m('dur'), m('dur', 3), m('dur', 5), m('mod'), m('mod', 12)], { dy: 34 });
    hide(o1, m('max', 4), .4);
    prog(q => h.set({ wr: lerp(-35, 20, cyc(q, 1)) }), m('max', 5), 3);
    prog(q => { h.set({ wr: 0, mp: lerp(15, 0, q) }); h.act({ ed: q * .6 }); }, m('max', 10), 1.5);
    pill(p, '«поставить и удержать» в нейтральном и лёгком разгибании', 400, 120, m('max', 14), { col: ANAT.tendon, size: 15 });
    pill(p, 'думать о прежнем действии мышцы', 400, 165, m('learn', .5), { col: FUN, size: 16 });
    prog(q => { h.set({ wr: -20, mp: 0, pip: 90 * cyc(q, 1), dip: 70 * cyc(q, 1) }); h.act({ ed: 0 }); }, m('flex', 8), 3.5);
    pill(p, 'кулак-крючок при разогнутых запястье и ПФ', 400, 210, m('flex', 8), { col: SH, size: 15 });
    markList(p, 60, 700, [['ПФ разгибание из полного сгибания', COL.bad], ['растяжка в сгибание при дефиците', COL.bad], ['сгибание пальцев + сгибание запястья', COL.bad], ['опора на тыл кисти', COL.bad], ['энергичный хват', COL.bad]], m('box', .5), 1.6, { size: 15, dy: 30, maxW: 640 });
    infoCard(p, 800, 90, 760, 175, 'ортез покоя', 'запястье 30–40° разгибания, ПФ 10–20° сгибания, МФ свободны; при переносе на большой — палец в ладонном отведении', ORTH_C, m('imm'), { size: 18 });
    infoCard(p, 800, 280, 760, 150, 'сроки', 'непрерывно 3–4 нед; дневной ортез — до 12 нед, ночной — 6 мес и дольше; без ранних движений', SH, m('dur'), { size: 18 });
    infoCard(p, 800, 445, 760, 150, 'первые 6 недель', 'запястье при расслабленных пальцах; разгибание ПФ с помощью; удержание; затем активно ладонью на столе', COL.task, m('max'), { size: 18 });
    infoCard(p, 800, 610, 760, 120, 'перенос указательного на большой', 'чтобы разогнуть большой, думать о разгибании указательного', FUN, m('learn'), { size: 18 });
    infoCard(p, 800, 745, 760, 120, 'исход', 'чаще осложнение — повторный разрыв; лучше всего — свежий единичный разрыв', COL.good, m('out'), { size: 18 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-rep', prompt: ['Какой вариант подходит?'],
    build: grid([
      { parts: ['Разрыв длинного разгибателя большого пальца'], ans: ['t'], why: 'Перенос разгибателя указательного пальца.' },
      { parts: ['Разрыв разгибателя мизинца, соседние сухожилия целы'], ans: ['s'], why: 'Шов «бок в бок» к соседнему — частый вариант на запястье.' },
      { parts: ['Концы не свести без натяжения'], ans: ['g'], why: 'Пластика, чаще длинной ладонной мышцей.' },
      { parts: ['Несколько разгибателей порваны'], ans: ['t'], why: 'Перенос сгибателя на тыл.' },
    ], [['t', 'Перенос', COL.good], ['g', 'Пластика', SH], ['s', 'Бок в бок', FUN]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Артроз основания большого пальца — у каждой третьей женщины; чаще — удаление трапеции с интерпозицией и реконструкцией связки.', 'w1'],
     ['Гипс и ортез в ладонном отведении 40–60°; движения с 4–6 недель, изометрия с 8; три месяца — без приведения к мизинцу и сильного щипка.', 'w2'],
     ['При РА рвутся разгибатели мизинца, безымянного и длинный разгибатель большого; их переносят, пластируют или подшивают к соседним.', 'w3'],
     ['После переноса — 3–4 недели покоя и медленная программа; без сгибания запястья вместе с пальцами.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-stretch', prompt: ['Через 9 недель после реконструкции основания большого пальца пациентка растягивает отведение, давя на кончик пальца. Что поправить?'],
    build: choice([
      ['Давить на головку пястной кости, а не на фаланги'],
      ['Давить сильнее'],
      ['Растягивать в приведение к мизинцу'],
      ['Прекратить все упражнения'],
    ], 0, 'Сила на фалангу переразгибает и расшатывает ПФ сустав — давят на пястную.',
    [null, 'Ошибка не в силе, а в точке приложения.', 'Полное приведение — тоже предосторожность.', 'Растяжка в этот срок уместна.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-transfer', prompt: ['Разгибатель указательного перенесли на место длинного разгибателя большого. Пациент не может разогнуть большой палец. Что подсказать?'],
    build: choice([
      ['Думать о разгибании указательного пальца'],
      ['Сгибать запястье и тянуть большой палец'],
      ['Сразу добавить сопротивление'],
      ['Ждать — само наладится'],
    ], 0, 'Сначала опираются на прежнее действие мышцы; помогают обратная связь и электростимуляция.',
    [null, 'Сгибание запястья с движением пальцев перегружает перенос.', 'Сопротивление — не раньше 8–12 недель.', 'Учиться нужно активно.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
