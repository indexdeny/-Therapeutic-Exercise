// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.
function fsReach(f, side, X, Y, flip = false) {
  const S = st(f.g), i = side === 'L' ? 0 : 1, k = i ? 1 : -1, Sh = f.pts.Sh[i];
  const tx = (X - S.x) / S.s - Sh[0], ty = (Y - S.y) / S.s - Sh[1], D = clamp(Math.hypot(tx, ty), 8, 137.5), dg = 180 / Math.PI;
  const phi = Math.atan2(k * tx, ty) * dg, be = Math.acos(clamp((72 * 72 + D * D - 66 * 66) / (2 * 72 * D), -1, 1)) * dg, ga = Math.acos(clamp((72 * 72 + 66 * 66 - D * D) / (2 * 72 * 66), -1, 1)) * dg;
  const sg = flip ? -1 : 1;
  f.set({ ['a' + side]: phi + sg * be, ['e' + side]: -sg * (180 - ga) });
}
// an elastic band between two stage points; set(A, B, rest) — brighter and thinner as it stretches

}

// the flexion range a contracted capsule allows: [extension limit, flexion limit], scanned on the model
function capRange(j) {
  let lo = 0, hi = 145;
  for (let a = 0; a <= 145; a++) { j.set({ flex: a }); if (j.capA.tension < .97) { lo = a; break; } }
  for (let a = 145; a >= 0; a--) { j.set({ flex: a }); if (j.capP.tension < .97) { hi = a; break; } }
  return [lo, hi];
}

  };

    infoCard(p, 800, 555, 760, 175, 'способы', '«поставить и удержать» (индианский протокол), короткая дуга по Эвансу, комбинированная модель Грота — восемь уровней', FUN, m('ways'), { size: 18 });
  }],

  ['phases', 'Фазы', (m, D) => {
    const p = panel(0);
    txt(p, 'фазы после шва сгибателя', 400, 56, m('max'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    phaseBar(p, 60, 220, 680, 12, [['максимальная защита', 0, 4.5, COL.bad], ['умеренная', 4, 8, FUN], ['минимальная', 8, 12, COL.good]], [[0, '0'], [4, '4'], [6, '6'], [8, '8'], [12, '12 нед']], [m('max'), m('mod'), m('min')], { dy: 36 });
    const h = handSag(p, 110, 470, 1.15, m('max', 1), { thumb: false });
    h.set({ wr: 20, mp: 50, pip: 0, dip: 0 });
    const o1 = hOrth(h, 'dbo', m('max', 2), { wr: 20, mp: 50 });
    const r1 = repMark(p, h, 'fdp', h.fr('1', [44, 15.5]), COL.bad, m('prom', 1));
    const r2 = repMark(p, h, 'fds', h.fr('1', [40, 13]), FUN, m('prom', 1));
    prog(q => h.set({ pip: 70 * cyc(q, 1), dip: 50 * cyc(q, 1) }), m('prom', 2), 4);
    prog(q => h.set({ pip: 70, dip: 50 * cyc(q, 2) }), m('prom', 8), 6);
    h.set({ pip: 70, dip: 25 }); const RM = h.at(h.fr('1', [50, 16])); h.set({ pip: 0, dip: 0 });
    hide(lab(p, 'шов глубокого уходит от шва поверхностного', 470, 780, ...RM, COL.bad, m('prom', 9), { size: 15 }), m('ph'), .3);
    prog(q => h.set({ pip: lerp(70, 0, q), dip: lerp(50, 0, q) }), m('ph') - 1, .8);
    hide(o1, m('ph'), .3);
    prog(q => h.set({ wr: lerp(20, 0, q), mp: 60 }), m('ph', .2), .6);
    const o3 = hOrth(h, 'ten', m('ph', .5));
    prog(q => { const k = cyc(q, 1); h.set({ wr: lerp(10, -30, k), mp: 60, pip: 60, dip: 40 }); h.act({ fdp: .25, fds: .25 }); }, m('ph', 4), 6);
    const pls = [], pl = (str, t, col) => { pls.forEach(e => hide(e, t, .3)); pls.push(pill(p, str, 400, 860, t + .2, { col, size: 15 })); };
    pl('держать 5 секунд минимальным усилием', m('ph', 3), MU);
    pl('запястье разогнуто + ПФ согнуты = наименьшая сила', m('evid', 1), COL.good);
    hide(o3, m('mod'), .3); hide(o3.hand, m('mod'), .3);
    const x1 = G(p, { o: 0 }); { h.set({ wr: -30, mp: 0, pip: 0, dip: 0 }); const P = h.at('MP'); h.set({ wr: 10, mp: 60, pip: 60, dip: 40 }); mk('path', { d: `M${f1(P[0] - 26)} ${f1(P[1] - 26)}l52 52m0 -52l-52 52`, fill: 'none', stroke: COL.bad, 'stroke-width': 7 }, x1); }
    prog(q => h.set({ wr: lerp(10, -30, q), mp: lerp(60, 0, q), pip: lerp(60, 0, q), dip: lerp(40, 0, q) }), m('mod', 24), 1.2);
    show(x1, m('mod', 25.5));
    pl('6–8 нед: не разгибать пальцы вместе с запястьем', m('mod', 25), COL.bad);
    pl('с 8 нед: сопротивление, дела 0,5–1 кг · в книге — 1–2 фунта', m('min', 1), COL.good);
    hide(x1, m('min'), .3);
    prog(q => h.set({ wr: lerp(-30, 0, q), mp: lerp(0, 20, q), pip: lerp(0, 20, q), dip: lerp(0, 10, q) }), m('min', .2), 1);
    infoCard(p, 800, 90, 760, 175, 'максимальная защита', 'до 3–5 нед, шов слабее всего; каждый час — пассивно каждый сустав и кулаки, ДМФ отдельно при согнутом ПМФ; ПФ всегда согнуты', COL.bad, m('max'), { size: 18 });
    infoCard(p, 800, 280, 760, 175, '«поставить и удержать»', 'МФ ставят в сгибание, пациент держит 5 секунд минимально; в тенодезном — вместе с разгибанием запястья', MU, m('ph'), { size: 18 });
    infoCard(p, 800, 470, 760, 175, 'умеренная (4–8 нед)', 'тенодезный — прочь, тыльный — кроме упражнений; активные кулаки, с 5–6 нед — скольжение и блокирующие', FUN, m('mod'), { size: 18 });
    infoCard(p, 800, 660, 760, 150, 'минимальная (с 8 нед)', 'сопротивление, ловкость, лёгкие дела; к 12 неделям — полная активность', COL.good, m('min'), { size: 18 });
  }],

  ['out', 'Результаты', (m, D) => {
    const p = panel(0);
    txt(p, 'результаты и осложнения', 400, 56, m('good'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    hbars(p, 60, 140, [['хорошо или отлично', 80, COL.good]], m('good', 3), { k: 6, unit: ' % и больше' });
    pill(p, 'система Стрикланда: % нормального движения ПМФ и ДМФ', 400, 220, m('good', 9), { col: SH, size: 15 });
    pill(p, '4 недели без движения — медленнее прочность, больше спаек', 400, 270, m('gen', 9), { col: COL.bad, size: 15 });
    pill(p, 'разрыв чаще около 10-го дня', 400, 330, m('comp', 9), { col: COL.bad, size: 16 });
    txt(p, 'частота разрывов', 400, 400, m('rates', 1), { size: 17, fill: FUN, weight: 700, anchor: 'middle' });
    hbars(p, 60, 450, [['комбинированные протоколы (Чесни)', 2.3, COL.good], ['протоколы Клейнерта (Чесни)', 7.1, COL.bad], ['пассивные = активные (Трамбл), зона II', 4, FUN]], [m('rates', 4), m('rates', 7), m('rates', 11)], { k: 50, dy: 60, unit: ' %' });
    infoCard(p, 800, 90, 760, 150, 'сегодня', 'хорошо или отлично — у 80 % и больше: прочные швы и ранние движения', COL.good, m('good'), { size: 19 });
    infoCard(p, 800, 255, 760, 175, 'общее', 'немедленный = отсроченный первичный; поздние и этапные — хуже; детям до 7–10 лет обычно фиксируют, но есть данные о ранних движениях', SH, m('gen'), { size: 18 });
    infoCard(p, 800, 445, 760, 175, 'осложнения', 'рано — разрыв, поздно — контрактура и дефицит разгибания; зона II — чаще; рвётся при хвате, нагрузке или во сне без ортеза', COL.bad, m('comp'), { size: 18 });
    infoCard(p, 800, 635, 760, 120, 'разрывов немного', 'различия между протоколами статистически незначимы', FUN, m('rates'), { size: 18 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-early', prompt: ['Первые недели после шва сгибателя — можно?'],
    build: grid([
      { parts: ['Пассивное сгибание МФ при согнутых ПФ'], ans: ['y'], why: 'Так и делают каждый час.' },
      { parts: ['Разгибать пальцы вместе с запястьем'], ans: ['n'], why: 'Максимально натягивает шов — 6–8 недель нельзя.' },
      { parts: ['Удержание позиции минимальным усилием'], ans: ['y'], why: 'При разогнутом запястье и согнутых ПФ.' },
      { parts: ['Блокирующие упражнения'], ans: ['n'], why: 'Не на ранних сроках.' },
      { parts: ['Сильный хват'], ans: ['n'], why: 'Риск разрыва.' },
    ], [['y', 'Можно', COL.good], ['n', 'Нельзя', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Пять ладонных зон; зона II — «ничья земля», где легче всего образуются спайки.', 'w1'],
     ['Шов до 10 дней не хуже немедленного; прочность растёт с числом нитей — это и разрешает ранние движения.', 'w2'],
     ['Тыльный ортез: запястье и ПФ согнуты; пассивно МФ — при согнутых ПФ; удержание — при разогнутом запястье.', 'w3'],
     ['6–8 недель не разгибать пальцы вместе с запястьем; сопротивление с 8, полная активность к 12 неделям.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-night', prompt: ['Десятый день после шва в зоне II. Пациент снимает ортез на ночь — «неудобно». Что ответить?'],
    build: choice([
      ['Ночью ортез обязателен: около 10-го дня шов слабее всего'],
      ['Можно снимать, если днём упражнения'],
      ['Можно, если пальцы согнуты'],
      ['Ортез нужен только для упражнений'],
    ], 0, 'Разрыв бывает и во сне, если рука не защищена; шов слабее всего около десятого дня.',
    [null, 'Упражнения не защищают шов во сне.', 'Без ортеза пальцы и запястье разогнутся.', 'Тыльный ортез — защита и ночью.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-child', prompt: ['Ребёнку 4 года, шов сгибателя. Какой подход вероятнее?'],
    build: choice([
      ['Иммобилизация на 3–4 недели, затем защищённые упражнения'],
      ['Ранние активные движения с удержанием позиции'],
      ['Тенодезный ортез с первого дня'],
      ['Сопротивление с четвёртой недели'],
    ], 0, 'Дети до 5 лет не могут выполнять программу ранних движений — блок 19.12.',
    [null, 'Требует понимания и приверженности.', 'Тоже ранняя программа.', 'Сопротивление — не раньше 8 недель.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
