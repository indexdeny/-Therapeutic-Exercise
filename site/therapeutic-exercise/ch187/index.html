// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.
function fsReach(f, side, X, Y, flip = false) {

    ['27 человек, 44 пальца', 'ПФ сгибание до 30°, резинка разгибает', '10 раз в час', '4 нед — активное разгибание', '5 нед — полный кулак', 'сопротивление — 8–12 нед'].forEach((s0, i) => txt(p, s0, 420, 440 + i * 34, m('dyn', 2 + i * 2), { size: 14, fill: COL.chalk }));
    pill(p, 'разрывов нет · динамический — лучше функция', 400, 760, m('res', 1), { col: COL.good, size: 16 });
    infoCard(p, 800, 90, 760, 150, 'как оценивают', 'объём, расстояние подушечки до ладони, суммарное активное движение, сила хвата', SH, m('meas'), { size: 18 });
    infoCard(p, 800, 255, 760, 150, 'тяжесть травмы', 'простые — 64 % хороших, с костью или суставом — 47 %; шов до 10 дней = немедленный', FUN, m('sev'), { size: 18 });
    infoCard(p, 800, 420, 760, 205, 'Китис и соавторы', 'зоны V–VII, рандомизация: статический ладонный ортез с активными МФ против динамического тыльного ортеза с активным сгибанием ПФ и резиновым разгибанием', COL.task, m('kitis'), { size: 18 });
    infoCard(p, 800, 640, 760, 120, 'итог', 'ни одного разрыва; функция лучше с динамическим ортезом', COL.good, m('res'), { size: 18 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-del', prompt: ['Безопасно ли это движение?'],
    build: grid([
      { parts: ['Полный кулак на 2-й неделе после шва в зоне III'], ans: ['n'], why: 'Не раньше 4 недель.' },
      { parts: ['Сгибание ДМФ на 20° в первую неделю движений (зона I)'], ans: ['y'], why: '20–25° и +10° в неделю.' },
      { parts: ['Сопротивление разгибателям на 5-й неделе'], ans: ['n'], why: 'Не раньше 8–12 недель.' },
      { parts: ['Разгибание МФ при стабилизированных ПФ (зоны V–VI)'], ans: ['y'], why: 'ПФ — в нейтральном положении.' },
      { parts: ['Полное сгибание ДМФ через месяц (зона I)'], ans: ['n'], why: 'Полное — около трёх месяцев.' },
    ], [['y', 'Безопасно', COL.good], ['n', 'Нет', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Семь тыльных зон: нечётные над суставами, чётные над костями; трудные — III и VII, частая — V.', 'w1'],
     ['Молоткообразный палец — ДМФ в разгибании 6–8 недель; закрытая «петля» — ПМФ в разгибании 6 недель и каждый час сгибание ДМФ.', 'w2'],
     ['Короткая дуга: шаблоны 30° и 20–25°, +10° в неделю без отставания.', 'w3'],
     ['При отсроченных движениях сгибание прибавляют понемногу; сопротивление с 8–12 недель.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-mallet', prompt: ['Молоткообразный палец: через три недели пациент снял шину «проверить». Что ответить?'],
    build: choice([
      ['Шина — непрерывно 6–8 недель; снимать нельзя'],
      ['Можно снимать на ночь'],
      ['Можно, если палец не болит'],
      ['Достаточно трёх недель'],
    ], 0, 'Любое сгибание ДМФ до заживления растягивает терминальное сухожилие.',
    [null, 'Ночью тоже нужна защита.', 'Отсутствие боли не означает заживления.', 'Нужно 6–8 недель.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-sam', prompt: ['Программа короткой дуги после шва центрального пучка. Вторая неделя, отставания разгибания нет. Что дальше?'],
    build: choice([
      ['Переделать шаблон на 40° сгибания ПМФ'],
      ['Разрешить полный кулак'],
      ['Начать сопротивление'],
      ['Оставить 30° до конца программы'],
    ], 0, 'Со второй недели шаблон — до 40°, затем по 10° в неделю.',
    [null, 'Полный кулак — не раньше 4 недель.', 'Сопротивление — с 6–8 недель.', 'Дугу постепенно увеличивают.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
