// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.
function fsReach(f, side, X, Y, flip = false) {

    infoCard(p, 800, 470, 760, 175, 'сгибание запястья', 'тыл на столе и предплечье вверх; или запястье у края и нажим на тыл; или тыльные стороны кистей вместе', SH, m('wf'), { size: 18 });
    infoCard(p, 800, 660, 760, 150, 'отдельные суставы', 'фаланга у края стола, проксимальную кость прижать, силу — на дистальную', FUN, m('fj'), { size: 18 });
  }],

  ['intr', 'Внутренние и многосуставные', (m, D) => {
    const p = panel(0);
    txt(p, 'внутренние и многосуставные мышцы', 400, 56, m('lum'), { size: 25, weight: 700, anchor: 'middle', fill: SH });
    const h = handSag(p, -100, 320, 1.55, m('lum'), { thumb: false });
    h.set({ wr: 0, mp: -10, pip: 90, dip: 70 });
    const hh = helpHand(p, h.at('p2'), 0, m('lum', 1), COL.task);
    hide(hh, m('int'), .3);
    pill(p, 'червеобразные: ПФ разогнуть, МФ согнуть, дожать', 400, 120, m('lum', 1), { col: MU, size: 15 });
    hide(h.g, m('add'), .4);
    const a = handFront(p, 300, 900, 1.5, m('add', .3), { view: 'palm' });
    a.set({ f: [5, 5, 5], pabd: .9, rabd: 15 });
    const ok = G(p, { o: 0 }); { const P = a.at('MP1'), Q = a.at('MP2'); arw(ok, P[0] + 50, P[1] - 30, P[0] + 10, P[1] - 6, COL.good, null, 6); arw(ok, Q[0] - 50, Q[1] - 30, Q[0] - 10, Q[1] - 8, COL.good, null, 6); }
    show(ok, m('add', 2));
    const bad = G(p, { o: 0 }); { const P = a.at('IP1'); mk('path', { d: `M${f1(P[0] - 18)} ${f1(P[1] - 18)}l36 36m0 -36l-36 36`, fill: 'none', stroke: COL.bad, 'stroke-width': 6 }, bad); } show(bad, m('add', 10));
    pill(p, 'приводящая: сила — на головки пястных', 400, 165, m('add', 2), { col: COL.good, size: 15 });
    pill(p, 'не на фаланги — нестабильность ПФ большого', 400, 210, m('add', 10), { col: COL.bad, size: 15 });
    hide(a.g, m('ext'), .4); [ok, bad].forEach(e => hide(e, m('ext'), .3));
    const s = handSag(p, 120, 560, 1.15, m('ext', .3), { thumb: false, wmus: true });
    s.set({ wr: 0, mp: 40, pip: 60, dip: 40 });
    tableTopEl(p, 40, 760, 618, m('ff'));
    const st = [[20, { dip: 0 }], [24, { pip: 0 }], [28, { mp: 0 }]];
    st.forEach(([dt, o]) => prog(q => { const A = { ...s.q }; const B = { ...A, ...o }; s.set({ mp: lerp(A.mp, B.mp, q), pip: lerp(A.pip, B.pip, q), dip: lerp(A.dip, B.dip, q) }); }, m('ext', dt - 14), 1));
    pill(p, 'от дистального сустава к проксимальному', 400, 260, m('ext', 4), { col: SH, size: 15 });
    pill(p, 'не переразгибать ПМФ и ПФ на запястье', 400, 305, m('ext', 15), { col: COL.bad, size: 15 });
    prog(q => { put(s.g, { r: 45 * q }); s.set({ wr: -45 * q }); }, m('ff', 6), 3);
    lab(p, 'сгибатели растянуты', 470, 840, ...s.at('fdpM'), ANAT.stretch, m('ff', 9), { size: 15 });
    prog(q => { put(s.g, { r: 0 }); s.set({ wr: 60 * q, mp: 85 * q, pip: 100 * q, dip: 70 * q }); }, m('ed'), 2);
    lab(p, 'разгибатель растянут', 470, 790, ...s.at('edM'), ANAT.stretch, m('ed', 2.5), { size: 15 });
    infoCard(p, 800, 90, 760, 150, 'червеобразные и межкостные', 'ПФ разогнуть, МФ согнуть, дожать; межкостные — ладонь на столе, отвести или привести, давить на конец основной фаланги', MU, m('lum'), { size: 18 });
    infoCard(p, 800, 255, 760, 175, 'приводящая большого', 'кисть на столе локтевым краем, ладонное отведение; скрещёнными пальцами давить на головки пястных I и II', COL.good, m('add'), { size: 18 });
    infoCard(p, 800, 445, 760, 175, 'многосуставные', 'сначала через самый дистальный сустав, держать — следующий; не переразгибать ПМФ и ПФ, когда тянут через запястье', SH, m('ext'), { size: 18 });
    infoCard(p, 800, 635, 760, 120, 'сгибатели пальцев', 'ладонь на столе, разогнуть суставы по очереди, поднять предплечье', ANAT.taut, m('ff'), { size: 18 });
    infoCard(p, 800, 770, 760, 95, 'разгибатель пальцев', 'согнуть пальцы с дистальных, затем запястье', ANAT.tendon, m('ed'), { size: 18 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-err', prompt: ['Верно или ошибка?'],
    build: grid([
      { parts: ['Растягивают приводящую мышцу, давя на ногтевую фалангу'], ans: ['e'], why: 'Сила — на головки пястных, иначе страдает связка ПФ большого.' },
      { parts: ['Сгибатели пальцев растягивают сразу через все суставы'], ans: ['e'], why: 'Начинают с дистального сустава.' },
      { parts: ['Растягивая запястье, пальцы свободно свисают с края'], ans: ['r'], why: 'Так внешние мышцы пальцев не мешают.' },
      { parts: ['Блокирующие упражнения на первой неделе после шва'], ans: ['e'], why: 'Рано — большая нагрузка на шов.' },
      { parts: ['Перед растяжкой восстанавливают скольжение сустава'], ans: ['r'], why: 'Иначе можно повредить сустав.' },
    ], [['r', 'Верно', COL.good], ['e', 'Ошибка', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Удержание позиции — минимальное усилие рано после шва: сгибатели — в ортезе с согнутыми ПФ, разгибатели — в разгибании.', 'w1'],
     ['Крючок — глубокий по поверхностному, полный кулак — глубокий, прямой кулак — поверхностный; блокирующие — не рано.', 'w2'],
     ['Отставание: крючок, положение стола, конечное разгибание, скольжение; спайка — массаж трением удлинённого сухожилия.', 'w3'],
     ['Многосуставные — от дистального сустава; приводящую большого — через головки пястных.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-lag', prompt: ['После пассивной растяжки в сгибание при спайке разгибателя отставание разгибания выросло. Что делать?'],
    build: choice([
      ['Прекратить пассивное сгибание, сделать упор на массаж трением'],
      ['Растягивать в сгибание сильнее'],
      ['Добавить сопротивление сгибателям'],
      ['Ничего не менять'],
    ], 0, 'Растёт отставание — растягивается сухожилие ниже спайки, а не спайка.',
    [null, 'Это ещё сильнее растянет сухожилие.', 'Не решает проблему спайки.', 'Признак требует изменить программу.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-fds', prompt: ['Нужно максимально прокатить поверхностный сгибатель по влагалищу и кости. Какое положение?'],
    build: choice([
      ['Прямой кулак: ПФ и ПМФ согнуты, ДМФ разогнут'],
      ['Кулак-крючок'],
      ['Положение стола'],
      ['Прямая кисть'],
    ], 0, 'Из положения стола сгибают ПМФ при прямом ДМФ — максимум для поверхностного.',
    [null, 'Крючок — для глубокого по поверхностному.', 'Это исходное положение.', 'Сухожилия не скользят.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
