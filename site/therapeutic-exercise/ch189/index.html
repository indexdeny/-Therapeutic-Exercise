/* ---------- exercise helpers (chapters 17–18) ---------- */
// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.
function fsReach(f, side, X, Y, flip = false) {

  const tx = (X - S.x) / S.s - Sh[0], ty = (Y - S.y) / S.s - Sh[1], D = clamp(Math.hypot(tx, ty), 8, 137.5), dg = 180 / Math.PI;

// an elastic band between two stage points; set(A, B, rest) — brighter and thinner as it stretches
function bandLine(p, col = '#e86a8a') {

    infoCard(p, 800, 470, 760, 150, 'цель', 'расспросить, чего хочет пациент, и подобрать силовые и точные захваты под его дела', FUN, m('goal'), { size: 18 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-ex', prompt: ['Что тренирует упражнение?'],
    build: grid([
      { parts: ['Выталкивать кончики пальцев из положения крючка'], ans: ['l'], why: 'Червеобразные: сгибание ПФ и разгибание МФ.' },
      { parts: ['Развести два пальца против резинки'], ans: ['d'], why: 'Тыльные межкостные — отведение.' },
      { parts: ['Сжимать пластилин между соседними пальцами'], ans: ['v'], why: 'Ладонные межкостные — приведение.' },
      { parts: ['Петля с грузом на основной фаланге, ладонь на столе'], ans: ['e'], why: 'Разгибатели пальцев.' },
      { parts: ['Подушечки к подушечкам, сгибать против другой руки'], ans: ['f'], why: 'Глубокий и поверхностный сгибатели.' },
    ], [['l', 'Червеобразные', MU], ['d', 'Тыльные межкостные', COL.task], ['v', 'Ладонные межкостные', SH], ['e', 'Разгибатели', ANAT.tendon], ['f', 'Сгибатели', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Запястье: пальцы расслаблены; супинация — сопротивление сгибанию, пронация — разгибанию; палка с грузом — отклонения.', 'w1'],
     ['Внутренние мышцы: положение стола против сопротивления, выталкивание кончиков, межкостные с резинкой, противопоставление.', 'w2'],
     ['Внешние — при стабильном запястье: петля для разгибания ПФ, сгибание пальцев друг против друга; полотенце, газета, диск.', 'w3'],
     ['Ловкость и функция — по захватам, которые нужны пациенту, с выносливостью и координацией.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-wr', prompt: ['Пациент поднимает гантель для плеча, и запястье у него «проваливается» в крайнее сгибание. Что сказать?'],
    build: choice([
      ['Держать запястье в безопасном положении, без крайних углов'],
      ['Взять гантель тяжелее'],
      ['Для упражнений плеча это не важно'],
      ['Полностью расслабить кисть'],
    ], 0, 'В упражнениях для всей руки запястье стабилизируют — функциональная прогрессия включает всю конечность.',
    [null, 'Это только усилит проблему.', 'Книга советует следить за запястьем и в этих упражнениях.', 'Без стабилизации груз не удержать.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-claw', prompt: ['Слабость внутренних мышц после поражения нерва: кисть встаёт «когтем». Что подойдёт?'],
    build: choice([
      ['Разгибать МФ до положения стола при стабилизированных согнутых ПФ'],
      ['Сжимать мяч в полный кулак'],
      ['Разгибание ПФ с петлёй и грузом'],
      ['Только растяжка сгибателей'],
    ], 0, 'Это упражнение для червеобразных — сгибание ПФ с разгибанием МФ.',
    [null, 'Кулак тренирует в основном внешние сгибатели.', 'Это внешние разгибатели — их перевес и даёт «коготь».', 'Растяжка не укрепит слабые мышцы.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
