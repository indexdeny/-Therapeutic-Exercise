const SH = '#86c9e8', MU = '#f4a48c', LG = '#f1dfa0', FUN = '#f0c060', SP = '#8fd6b0', ENV = '#c9b8e8', BAD = COL.bad;

/* ---------- exercise helpers (chapters 17–18) ---------- */
// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.
function fsReach(f, side, X, Y, flip = false) {
  const S = st(f.g), i = side === 'L' ? 0 : 1, k = i ? 1 : -1, Sh = f.pts.Sh[i];
  const tx = (X - S.x) / S.s - Sh[0], ty = (Y - S.y) / S.s - Sh[1], D = clamp(Math.hypot(tx, ty), 8, 137.5), dg = 180 / Math.PI;

  const sg = flip ? -1 : 1;

}
// an elastic band between two stage points; set(A, B, rest) — brighter and thinner as it stretches
function bandLine(p, col = '#e86a8a') {

}

// a seated rig figure on a chair, ankle at (ax, GY)

  const stop = block !== null ? path(g, '', { stroke: COL.bad, 'stroke-width': sw * .9, 'stroke-linecap': 'round' }) : null;
  const seg = (A, B) => `M${f1(A[0])} ${f1(A[1])}L${f1(B[0])} ${f1(B[1])}`;

  };

    const M = h.M;
    prog(q => h.set({ tilt: -11 * Math.sin(Math.PI * q) }), m('lat', 3), 5);
    prog(q => h.set({ tilt: 11 * Math.sin(Math.PI * q) }), m('lat', 10), 5);
    const pr = [txt(p, 'подъём — приведение', 560, 140, m('lat', 3), { size: 18, fill: COL.good, weight: 700, anchor: 'middle' }), txt(p, 'опускание — отведение', 560, 140, m('lat', 10), { size: 18, fill: COL.bad, weight: 700, anchor: 'middle' })];
    hide(pr[0], m('lat', 9), .3); hide(pr[1], m('lat', 15.5), .3);
    prog(q => { const k = Math.sin(Math.PI * q); h.set({ tilt: -11 * k }); M.L.ql.act(k); M.R.gmed.act(k); }, m('mus', 1.5), 6);
    const lq = lab(p, 'квадратная поясницы', 760, 130, ...stg(h, M.L.ql.last[0][1]), MU, m('mus', 2), { anchor: 'end' });
    const lg = lab(p, 'средняя ягодичная опоры', 40, 200, ...stg(h, M.R.gmed.last[0][1]), MU, m('mus', 3), { anchor: 'start' });
    // one leg: gravity tends to drop the free side; the stance gluteus medius holds
    const C = h.at('sacrum'), arr = arw(p, C[0] + 40, C[1] + 20, C[0] + 40, C[1] + 110, COL.bad, m('one', 1));
    prog(q => { M.R.gmed.act(.8); }, m('one', 1), .5);
    const p1 = pill(p, 'момент приведения — держит средняя ягодичная', 400, 830, m('one', 2), { col: MU, size: 16 });
    hide(arr, m('rot'), .3); hide(p1, m('rot'), .3); hide(lq, m('rot'), .3); hide(lg, m('rot'), .3);
    hide(h.g, m('rot'), .4);
    const tp = pelvTop(p, 390, 420, 1.3, m('rot', .3));
    prog(q => tp.set(-22 * Math.sin(Math.PI * q)), m('rot', 3), 5);
    prog(q => tp.set(22 * Math.sin(Math.PI * q)), m('rot', 9), 5);
    const r1 = txt(p, 'свободная сторона вперёд — опорное бедро внутрь', 390, 690, m('rot', 3), { size: 18, fill: COL.good, anchor: 'middle', weight: 700 });
    hide(r1, m('rot', 8.5), .3);
    txt(p, 'назад — опорное бедро наружу', 390, 690, m('rot', 9), { size: 18, fill: COL.bad, anchor: 'middle', weight: 700 });
    infoCard(p, 800, 90, 760, 150, 'фронтальный наклон', 'по гребню свободной стороны: подъём — приведение на этой стороне, опускание — отведение; поясница — к поднятому гребню', SH, m('lat'), { size: 18 });
    infoCard(p, 800, 255, 760, 150, 'мышцы', 'квадратная поясницы на поднятой стороне + средняя ягодичная опорной ноги; при отведении бедра таз держат косые мышцы', MU, m('mus'), { size: 18 });
    infoCard(p, 800, 420, 760, 150, 'на одной ноге', 'тяжесть приводит бедро; таз держит средняя ягодичная опоры; в расслабленной позе — Y-связка и тракт', MU, m('one'), { size: 18 });
    infoCard(p, 800, 585, 760, 150, 'ротация таза', 'вокруг опорной ноги: вперёд — опорное бедро внутрь, туловище в обратную сторону', COL.task, m('rot'), { size: 18 });
  }],

  ['rhythm', 'Пояснично-тазовый ритм', (m, D) => {
    const p = panel(0);
    txt(p, 'наклон вперёд', 400, 56, m('what'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    const f = postureFig(p, 330, 880, .78, m('what'), { pose: 'std', arm: true });
    const hm = f.mus('hams', { w: 13 }), gm = f.mus('glut', { w: 15 }), er = f.mus('erector', { w: 12 });
    void hm; void gm; void er;
    f.to({ hd: 25, kyph: 52 }, m('start', .5), 2);
    f.to({ lord: -8, kyph: 62 }, m('spine', 1), 6);
    f.to({ tilt: 50 }, m('pelv', 1), 8);
    f.to({ tilt: 0 }, m('up', .5), 3.5);
    f.to({ lord: 46, kyph: 42, hd: 0 }, m('up', 4.5), 3.5);
    const s1 = pill(p, '≈ 45° — позвоночник, держат разгибатели', 400, 110, m('spine', 1), { col: SH, size: 16 });
    const s2 = pill(p, 'затем таз вперёд — ягодичная и задняя группа', 400, 155, m('pelv', 1), { col: MU, size: 16 });
    const s3 = pill(p, 'вверх: сначала таз назад, потом спина', 400, 200, m('up', .5), { col: COL.good, size: 16 });
    void s1; void s2; void s3;
    infoCard(p, 800, 90, 760, 120, 'начало', 'голова и верх туловища наклоняются, таз уходит назад над опорой', SH, m('start'), { size: 18 });
    infoCard(p, 800, 225, 760, 150, 'позвоночник', 'до ≈ 45°: разгибатели спины тормозят; натягиваются задние связки и капсулы фасеточных суставов', SH, m('spine'), { size: 18 });
    infoCard(p, 800, 390, 760, 150, 'таз', 'вращается вперёд под контролем большой ягодичной и задней группы — до их полной длины', MU, m('pelv'), { size: 18 });
    infoCard(p, 800, 555, 760, 120, 'возвращение', 'разгибатели бедра наклоняют таз назад, затем разгибается спина снизу вверх', COL.good, m('up'), { size: 18 });
    infoCard(p, 800, 690, 760, 120, 'вариации', 'тренировка, привычки, укорочения, травма, проприоцепция', COL.task, m('var'), { size: 18 });
  }],

  ['chain', 'Бедро, колено и стопа', (m, D) => {
    const p = panel(0);
    txt(p, 'в опоре', 400, 56, m('intro'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    const sg = hipSag(p, 380, 330, .6, m('intro'), { muscles: ['rf', 'gmax', 'ham', 'gast'], farLeg: false, plant: true });
    prog(q => { const k = Math.sin(Math.PI * q); sg.set({ th: 45 * k, kn: 80 * k, an: 30 * k, tilt: 12 * k }); ['gmax', 'ham', 'rf', 'gast'].forEach(n => sg.M[n].act(k)); }, m('flex', 2), 7);
    prog(q => sg.set({ th: -6 * Math.sin(Math.PI * q) }), m('flex', 11), 4);
    const pf = pill(p, 'сгибание: колено и стопа сгибаются вместе', 400, 110, m('flex', 2), { col: MU, size: 16 });
    const pe = pill(p, 'разгибание бедра «запирает» колено', 400, 155, m('flex', 11), { col: COL.good, size: 16 });
    hide(sg.g, m('abd'), .4); hide(pf, m('abd'), .3); hide(pe, m('abd'), .3);
    const h = hipFront(p, 380, 300, .66, m('abd', .3), { tibia: true, muscles: ['gmed', 'tfl', 'add'] });
    h.set({ pivot: 'R', knL: 55 });
    prog(q => h.M.R.gmed.act(1), m('abd', 1), .5);
    prog(q => { const k = Math.sin(Math.PI * Math.min(1, q * 1.4)); h.set({ tilt: 12 * k, abdR: -8 * k, vgR: 11 * k }); h.M.R.gmed.act(1 - .8 * k); }, m('abd', 8), 9);
    const pw = pill(p, 'слабая средняя ягодичная → вальгус колена', 400, 110, m('abd', 8), { col: COL.bad, size: 16 });
    const kk = h.at('K', 'R');
    const lk = lab(p, 'медиальная коллатеральная, ПКС', 40, 760, kk[0] + 12, kk[1], COL.bad, m('abd', 12), { anchor: 'start' });
    hide(pw, m('rot'), .3); hide(lk, m('rot'), .3);
    prog(q => { const k = Math.sin(Math.PI * q); h.set({ tilt: 0, abdR: -3 * k, vgR: 6 * k, rotR: 30 * k }); h.M.R.gmed.act(.3); }, m('rot', 1.5), 8);
    pill(p, 'внутренняя ротация → пронация стопы', 400, 110, m('rot', 2), { col: COL.task, size: 16 });
    infoCard(p, 800, 90, 760, 175, 'сгибание и разгибание', 'сгибание с коленом и стопой контролируют большая ягодичная, задняя группа, четырёхглавая, икроножная и камбаловидная; разгибание запирает колено', MU, m('flex'), { size: 18 });
    infoCard(p, 800, 280, 760, 175, 'отведение и приведение', 'средняя ягодичная держит таз — в колене варусный момент; при её слабости бедро приводится, растёт вальгус', COL.bad, m('abd'), { size: 18 });
    infoCard(p, 800, 470, 760, 150, 'ротация', 'внутренняя ротация бедра — эверсия пятки и пронация стопы; наружная — наоборот; в каждом шаге', COL.task, m('rot'), { size: 18 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-pelvis', prompt: ['Что происходит в тазобедренном суставе?'],
    build: grid([
      { parts: ['Передний наклон таза'], ans: ['f'], why: 'Таз ближе к передней поверхности бедра.' },
      { parts: ['Задний наклон таза'], ans: ['e'], why: 'Разгибание бедра и сгибание поясницы.' },
      { parts: ['Стоя на одной ноге, таз опускается с другой стороны — опорное бедро'], ans: ['ad'], why: 'Опорный сустав приводится — это и держит средняя ягодичная.' },
      { parts: ['Свободная сторона таза поднимается — её собственное бедро'], ans: ['ad'], why: 'На поднятой стороне — приведение.' },
      { parts: ['Свободная сторона таза уходит вперёд — опорное бедро'], ans: ['ir'], why: 'Ротация таза вперёд — опорное бедро внутрь.' },
    ], [['f', 'Сгибание', MU], ['e', 'Разгибание', SH], ['ad', 'Приведение', COL.bad], ['ir', 'Внутр. ротация', COL.task]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Сустав шаровидный и устойчивый: угол шейки ≈ 125°, торсия ≈ 12°; все три связки — против разгибания, сильнее всех Y-связка.', 'w1'],
     ['Головка скользит против движения бедра; впадина на опорной ноге — туда же, куда таз.', 'w2'],
     ['Передний наклон таза — сгибание бедра и разгибание поясницы; на одной ноге таз держит средняя ягодичная опоры.', 'w3'],
     ['Наклон вперёд: сначала позвоночник, затем таз; слабая средняя ягодичная даёт вальгус колена.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-drop', prompt: ['Пациент стоит на правой ноге, и левая сторона таза опускается. Какая мышца не справляется?'],
    build: choice([
      ['Правая средняя ягодичная'],
      ['Левая средняя ягодичная'],
      ['Правая квадратная мышца поясницы'],
      ['Левые приводящие'],
    ], 0, 'Таз на свободной стороне держит средняя ягодичная опорной ноги — правая.',
    [null, 'Левая нога свободна, её отводящие таз не держат.', 'Квадратная мышца поднимает гребень своей стороны, а опускается левая.', 'Приводящие не держат таз от опускания.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-rhythm', prompt: ['Человек наклоняется, чтобы дотянуться до пола. Как обычно идёт движение?'],
    build: choice([
      ['Позвоночник сгибается примерно до 45°, затем таз вращается вперёд'],
      ['Сначала вращается таз, затем сгибается позвоночник'],
      ['Двигаются только тазобедренные суставы'],
      ['Таз смещается вперёд над стопами'],
    ], 0, 'Наклон начинают голова и туловище, разгибатели спины тормозят до ≈ 45°, потом таз вращается вперёд под контролем ягодичной и задней группы.',
    [null, 'Таз включается, когда позвоночник дошёл до конца объёма.', 'Сгибается и позвоночник.', 'Таз смещается назад, чтобы центр тяжести остался над опорой.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
