/* ---------- exercise helpers (chapters 17–18) ---------- */
// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.
function fsReach(f, side, X, Y, flip = false) {

// an elastic band between two stage points; set(A, B, rest) — brighter and thinner as it stretches

}

    txt(p, 'мышцы в шаге', 400, 56, m('flex'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    const f = fig(p, { x: 260, y: 470, s: 1.15, o: 0, pose: { ...STRIDE } }); show(f.g, m('flex'));
    const f2 = fig(p, { x: 560, y: 470, s: 1.15, o: 0, pose: { ...STRIDE, hN: -10, hF: 22 } }); show(f2.g, m('flex'));
    floorLn(p, 80, 760, 470 + 182 * 1.15 + 2, m('flex'));
    prog(q => f.set({ t: -14 * Math.sin(Math.PI * q) }), m('flex', 3), 3);
    const t1 = txt(p, 'нет сгибателей: рывок назад в начале переноса', 400, 120, m('flex', 3), { size: 17, fill: COL.bad, anchor: 'middle', weight: 700 });
    prog(q => f2.set({ t: 4 + 20 * Math.sin(Math.PI / 2 * Math.min(1, q * 2)) }), m('flex', 9), 3);
    const t2 = txt(p, 'контрактура: наклон вперёд, шаг короче', 400, 160, m('flex', 9), { size: 17, fill: MU, anchor: 'middle', weight: 700 });
    prog(q => f.set({ t: -16 * Math.sin(Math.PI * q) }), m('ext', 2), 3);
    const t3 = txt(p, 'нет разгибателей: туловище назад при контакте', 400, 200, m('ext', 2), { size: 17, fill: COL.bad, anchor: 'middle', weight: 700 });
    [t1, t2, t3].forEach(e => hide(e, m('abd'), .3)); hide(f.g, m('abd'), .4); hide(f2.g, m('abd'), .4);
    const fs = frontStand(p, 390, 820, 1.25, m('abd', .3), { pose: { liftL: 0 } });
    prog(q => { const k = Math.sin(Math.PI / 2 * Math.min(1, q * 1.5)); fs.set({ liftR: 28 * k, lean: -12 * k, shift: -14 * k }); fs.mus.medL.act(.3); }, m('abd', 2), 4);
    pill(p, 'туловище над слабым суставом', 400, 120, m('abd', 2), { col: COL.bad, size: 16 });
    pill(p, 'анталгическая походка: опора на больной ноге короче', 400, 165, m('ant', 1), { col: COL.task, size: 16 });
    infoCard(p, 800, 90, 760, 175, 'сгибатели', 'тормозят разгибание в конце опоры и начинают перенос; без них — рывок назад; контрактура — короткий шаг, лордоз или наклон вперёд', MU, m('flex'), { size: 17 });
    infoCard(p, 800, 280, 760, 175, 'разгибатели', 'держат сгибающий момент при нагрузке; без них — отклонение назад при контакте; контрактура большой ягодичной — нога наружу, раздражение у колена', SH, m('ext'), { size: 17 });
    infoCard(p, 800, 470, 760, 150, 'отводящие', 'держат таз при переносе другой ноги; при слабости или боли туловище смещается над опорной ногой', COL.bad, m('abd'), { size: 17 });
  }],

  ['pain', 'Боль и нервы', (m, D) => {
    const p = panel(0);
    txt(p, 'откуда боль', 400, 56, m('l3'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    const h = hipFront(p, 330, 300, .64, m('l3'), { tibia: true, muscles: [] });
    const zP = [h.at('pubis', 'L'), h.at('GT', 'L'), h.stage(h.fem('L', [1.0, 4.5])), h.at('Klat', 'L'), h.stage(h.fem('L', [-.6, 10.5])), h.stage(h.fem('L', [-.6, 5])), h.at('sym')];
    zoneBand(p, zP, COL.bad, m('l3', 2));
    lab(p, 'L3: пах → перед бедра → колено', 760, 520, ...h.at('shaft', 'L'), COL.bad, m('l3', 3), { anchor: 'end' });
    piriInset(p, 610, 210, .7, m('sci', .3));
    pillRow(p, ['запирательный — роды', 'бедренный — переломы, вывих'], 400, 790, m('obt', .5), { col: NERVE_C, size: 15, gap: 3 });
    pill(p, 'источники: L1–L3, S1–S2, суставы поясницы, крестцово-подвздошные', 400, 835, m('ref', .5), { col: COL.task, size: 15 });
    infoCard(p, 800, 90, 760, 150, 'сустав — сегмент L3', 'раздражение сустава — пах, передняя поверхность бедра до колена (глава 13)', COL.bad, m('l3'), { size: 18 });
    infoCard(p, 800, 255, 760, 120, 'седалищный нерв', 'сдавление под грушевидной мышцей (иногда над ней или сквозь)', NERVE_C, m('sci'), { size: 18 });
    infoCard(p, 800, 390, 760, 150, 'запирательный и бедренный', 'запирательный — редко, в родах; бедренный — переломы бедра и таза, вправление вывиха, щипцы', NERVE_C, m('obt'), { size: 18 });
    infoCard(p, 800, 555, 760, 150, 'отражённая боль', 'лечат источник: корешки и ткани L1–L3, S1–S2, межпозвонковые и крестцово-подвздошные суставы', COL.task, m('ref'), { size: 18 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-gait', prompt: ['Какая мышца слаба или укорочена?'],
    build: grid([
      { parts: ['Туловище смещается вбок над опорной ногой'], ans: ['gmed'], why: 'Так компенсируют слабую среднюю ягодичную.' },
      { parts: ['Туловище отклоняется назад в момент контакта'], ans: ['ext'], why: 'Центр тяжести уходит за сустав — слабы разгибатели.' },
      { parts: ['Бедро не разгибается в конце опоры, растёт лордоз'], ans: ['flexT'], why: 'Контрактура сгибателей.' },
      { parts: ['Рывок туловищем назад, чтобы начать перенос'], ans: ['flexW'], why: 'Сгибатели не начинают перенос.' },
      { parts: ['Таз опускается с другой стороны, туловище наклонено к этой'], ans: ['add'], why: 'Укороченные приводящие.' },
    ], [['gmed', 'Слаба ср. ягодичная', COL.bad], ['ext', 'Слабы разгибатели', SH], ['flexT', 'Укор. сгибатели', MU], ['flexW', 'Слабы сгибатели', FUN], ['add', 'Укор. приводящие', COL.task]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Укороченные сгибатели — лордоз и незапертое колено; слабые отводящие, разгибатели и наружные ротаторы — вальгусный провал.', 'w1'],
     ['Дисбалансы: напрягатель над средней ягодичной, задняя группа над большой, двусуставные сгибатели над подвздошно-поясничной.', 'w2'],
     ['Шаг: 40° сгибания-разгибания, по 15° во фронтальной и горизонтальной; слабая средняя ягодичная — смещение туловища.', 'w3'],
     ['Боль из сустава — по L3: пах, перед бедра, колено; при отражённой боли лечат источник.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-valgus', prompt: ['Спортсменка при приземлении после прыжка «проваливает» колено внутрь. Что укреплять прежде всего?'],
    build: choice([
      ['Отводящие, разгибатели и наружные ротаторы бедра'],
      ['Приводящие бедра'],
      ['Напрягатель широкой фасции'],
      ['Только четырёхглавую мышцу'],
    ], 0, 'Вальгусный провал связан со слабостью отводящих, разгибателей и наружных ротаторов бедра.',
    [null, 'Приводящие усиливают приведение бедра.', 'Его доминирование само усиливает вальгус и натяжение тракта.', 'Причина провала — в мышцах бедра.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-l3', prompt: ['Боль в паху отдаёт по передней поверхности бедра до колена. Что вероятнее?'],
    build: choice([
      ['Раздражение тазобедренного сустава — сегмент L3'],
      ['Синдром грушевидной мышцы'],
      ['Поражение запирательного нерва'],
      ['Боль из крестцово-подвздошного сустава'],
    ], 0, 'Сустав иннервируется в основном из L3 — так и отдаёт боль.',
    [null, 'Он даёт боль по ходу седалищного нерва — сзади.', 'Изолированное поражение редко, обычно после родов.', 'Это возможно, но типичная картина сустава — L3.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
