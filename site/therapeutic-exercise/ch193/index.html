// cards-short end

const SH = '#86c9e8', MU = '#f4a48c', LG = '#f1dfa0', FUN = '#f0c060', SP = '#8fd6b0', ENV = '#c9b8e8', BAD = COL.bad;
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');
  T(g, str, { x, y, size, fill: col, weight: 600, anchor: an });
  const lx = an === 'start' && right ? x + uiW(str, size) + 8 : an === 'middle' ? x : x + (right ? 8 : -8), ly = an === 'middle' ? y + (ty > y ? 8 : -size) : y - size * .35;
  path(g, `M${lx} ${ly}L${tx.toFixed(1)} ${ty.toFixed(1)}`, { stroke: col, 'stroke-width': 1.8, 'stroke-opacity': .8 });
  mk('circle', { cx: tx, cy: ty, r: 3.5, fill: col }, g);
  if (t0 !== null) show(g, t0);

}
const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
const arw = (p, x1, y1, x2, y2, col, t0, w = 6) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 14, g = G(p, { o: 0 }); path(g, `M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}M${f1(x2 - h * Math.cos(a - .5))} ${f1(y2 - h * Math.sin(a - .5))}L${f1(x2)} ${f1(y2)}L${f1(x2 - h * Math.cos(a + .5))} ${f1(y2 - h * Math.sin(a + .5))}`, { stroke: col, 'stroke-width': w }); if (t0 !== null) show(g, t0); else put(g, { o: 1 }); return g; };
const floorLn = (p, x1, x2, y, t0) => show(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 }), t0);
const ring = (p, P, r, col, t0) => { const c = mk('circle', { cx: f1(P[0]), cy: f1(P[1]), r, fill: 'none', stroke: col, 'stroke-width': 4, opacity: 0 }, p); show(c, t0); return c; };
// an arc of the glenoid or the head (radius rr about the centre C of the joint, angles a0..a1) in stage coordinates
const arcOn = (j, conv, rr, a0, a1) => { const P = []; for (let a = a0; a <= a1; a += 4) P.push(j.at(conv(polar([0, 0], rr, a)))); return P; };

/* ---------- exercise helpers (chapters 17–18) ---------- */
// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.
function fsReach(f, side, X, Y, flip = false) {
  const S = st(f.g), i = side === 'L' ? 0 : 1, k = i ? 1 : -1, Sh = f.pts.Sh[i];
  const tx = (X - S.x) / S.s - Sh[0], ty = (Y - S.y) / S.s - Sh[1], D = clamp(Math.hypot(tx, ty), 8, 137.5), dg = 180 / Math.PI;
  const phi = Math.atan2(k * tx, ty) * dg, be = Math.acos(clamp((72 * 72 + D * D - 66 * 66) / (2 * 72 * D), -1, 1)) * dg, ga = Math.acos(clamp((72 * 72 + 66 * 66 - D * D) / (2 * 72 * 66), -1, 1)) * dg;
  const sg = flip ? -1 : 1;
  f.set({ ['a' + side]: phi + sg * be, ['e' + side]: -sg * (180 - ga) });
}
// an elastic band between two stage points; set(A, B, rest) — brighter and thinner as it stretches
function bandLine(p, col = '#e86a8a') {
  const e = path(p, '', { stroke: col, 'stroke-width': 6, 'stroke-linecap': 'round' }, { o: 0 });
  return { e, set(A, B, rest = 100) { const L = Math.hypot(B[0] - A[0], B[1] - A[1]), k = clamp(L / rest - 1, 0, 1); e.setAttribute('d', `M${f1(A[0])} ${f1(A[1])}L${f1(B[0])} ${f1(B[1])}`); e.setAttribute('stroke-width', f1(6 - 2.5 * k)); e.setAttribute('stroke', mix(col, '#ffd75e', k * .6)); } };
}
const propLine = (p, d, t0, col = COL.dim, w = 5) => { const e = path(p, d, { stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' }, { o: 0 }); if (t0 !== null) show(e, t0); return e; };
// a ball (side view): set(x, y) moves it
function ballEl(p, r, col = '#86c9e8') {
  const defs = mk('defs', {}, p), g = G(p, { o: 0 });
  mk('circle', { r, fill: ballGrad(defs, col), stroke: mix(col, '#000000', .45), 'stroke-width': 2 }, g);
  return { g, set(x, y) { put(g, { x, y }); } };
}
// a seated rig figure on a chair, ankle at (ax, GY)
function seatFig(p, ax, GY, s, t0, pose = {}) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...SIT, ...pose } });
  plant(f, 'AN', ax, GY);
  const [hx, hy] = onStage(f, 'H');
  chair(p, hx, hy + 22 * s / .5 * .32, GY, t0);
  p.appendChild(f.g); show(f.g, t0);
  return f;
}
const QUAD = { ...STAND, t: 66, hN: 66, kN: 90, hF: 66, kF: 90, aN: 66, aF: 66, eN: 0, eF: 0, fN: -90, fF: -90 };
// a rig figure on all fours: knee at (kx, FY); hands under the shoulders
function quadFig(p, kx, FY, s, t0, pose = {}) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...QUAD, ...pose } });
  plant(f, 'KN', kx, FY - 12 * s);
  const Sh = onStage(f, 'Sh'); f.hand = [Sh[0] + 4, FY - 28 * s];
  reach(f, 'N', ...f.hand); reach(f, 'F', f.hand[0] - 4, f.hand[1]);
  show(f.g, t0); return f;
}
// a checklist of criteria that tick one by one
function checklist(p, x, y, items, t0, gap, col = SP, { size = 18, dy = 40 } = {}) {
  return items.map((s, i) => { const t = t0 + i * gap, g = G(p, {}); checkMark(g, x + 12, y + i * dy - 6, t, col, .9); txt(g, s, x + 34, y + i * dy, t, { size, fill: COL.chalk, weight: 600 }); return g; });
}
// horizontal bars with values: rows [label, value, colour]; k — px per unit
function bars(p, x, y, rows, t0, { k = 5, dy = 46, unit = '%', w0 = 210, size = 17 } = {}) {
  return rows.map(([s, v, c], i) => {
    const yy = y + i * dy, g = G(p, { o: 0 }); show(g, t0 + i * .5);
    T(g, s, { x: x + w0 - 12, y: yy + 6, size, fill: c, weight: 700, anchor: 'end' });
    const b = mk('rect', { x: x + w0, y: yy - 13, width: 0, height: 24, rx: 7, fill: c }, g);
    const tv = T(g, '', { x: x + w0 + 8, y: yy + 6, size, fill: COL.chalk, weight: 700 });
    prog(q => { b.setAttribute('width', f1(k * v * q)); put(tv, { x: x + w0 + 8 + k * v * q }); tv.textContent = (unit === '' ? '' : (v * q).toFixed(v % 1 ? 1 : 0).replace('.', ',')) + unit; }, t0 + i * .5, 1);
    return g;
  });
}
// a resistance arrow (the hand or a band pushes the other way): a short thick arrow onto point P from direction ang
function pushArr(p, P, ang, col, t0, L = 70) { const A = polar(P, L + 14, ang), B = polar(P, 14, ang); return arw(p, A[0], A[1], B[0], B[1], col, t0, 7); }


/* ---------- chapter 18 helpers (lesson 172) ---------- */
// a range dial round a stage point: the arc a0..a1 (degrees of flexion, 0 hanging down, turning forward = to the right)
function flexArc(p, C, r, a0, a1, col, t0, w = 10) { const e = path(p, romArc(C, r, a0, a1, 90, -1), { stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' }, { o: 0 }); if (t0 !== null) show(e, t0); return e; }
// a forearm-rotation dial for foreEnd: the sector ±a about thumb-up, and a pointer along the thumb
function rotDial(p, e, r, a, col, t0) {
  const C = e.at('C'), g = G(p, { o: 0 });
  path(g, romArc(C, r, -a, a, -90, 1), { stroke: col, 'stroke-width': 10, 'stroke-linecap': 'round' });
  T(g, 'супинация', { x: C[0] - r - 12, y: C[1] - r * .55, size: 16, fill: col, weight: 700, anchor: 'end' });
  T(g, 'пронация', { x: C[0] + r + 12, y: C[1] - r * .55, size: 16, fill: col, weight: 700 });
  if (t0 !== null) show(g, t0);
  return g;
}
// a small axial inset of a radioulnar joint (volar side up). kind 'prox': the radial head in the annular ring against
// the radial notch of the ulna; 'dist': the ulnar notch of the radius going round the head of the ulna. set(pro 0..1)
function ruInset(p, x, y, kind, t0) {
  const g = G(p, { x, y, o: 0 }), defs = mk('defs', {}, g), RC = mix(ANAT.bone, '#f6d9a8', .25), line = mix(ANAT.bone, '#000000', .5);
  roundBox(g, -150, -120, 300, 240, EDGE, PANEL, 2);

  T(g, 'тыльная сторона', { x: 0, y: 108, size: 15, fill: COL.dim, anchor: 'middle' });

    mk('path', { d: 'M48 -62Q8 0 48 62L110 62L110 -62Z', fill: boneGrad(defs, 0, 0, 1, 0), stroke: line, 'stroke-width': 2 }, g);   // ulna, radial notch
    path(g, 'M44 -56Q6 0 44 56', { stroke: CART_C, 'stroke-width': 4 });
    path(g, 'M44 -56A58 58 0 1 0 44 56', { stroke: ANAT.tendon, 'stroke-width': 9, 'stroke-opacity': .85 });   // annular ligament

    mk('path', { d: 'M-40 -24A38 38 0 0 1 -40 24L-112 34Q-128 0 -112 -34Z', fill: boneGrad(defs, 0, 0, 1, 0, RC), stroke: line, 'stroke-width': 2 }, rad);
    path(rad, 'M-40 -24A38 38 0 0 1 -40 24', { stroke: CART_C, 'stroke-width': 4 });
    o.set = pro => { put(rad, { x: 30, y: 6, r: 55 * pro }); };
  }
  o.set(0);
  if (t0 !== null) show(g, t0);
  return o;
}

/* ---------- chapter 18 helpers (lesson 173) ---------- */
// the flexion range a contracted capsule allows: [extension limit, flexion limit], scanned on the model
function capRange(j) {
  let lo = 0, hi = 145;
  for (let a = 0; a <= 145; a++) { j.set({ flex: a }); if (j.capA.tension < .97) { lo = a; break; } }
  for (let a = 145; a >= 0; a--) { j.set({ flex: a }); if (j.capP.tension < .97) { hi = a; break; } }
  return [lo, hi];
}
// a hinged elbow brace on an elbowSag model (bars, straps, the hinge); block — the extension stop in degrees
function hingeBrace(p, j, t0, block = null) {
  const g = G(p, { o: 0 }), col = '#9fb0bf', sw = 11 * st(j.g).s / .7;
  const bar1 = path(g, '', { stroke: col, 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-opacity': .9 });
  const bar2 = path(g, '', { stroke: col, 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-opacity': .9 });
  const straps = [0, 1, 2, 3].map(() => path(g, '', { stroke: '#6fa8c8', 'stroke-width': sw * 1.1, 'stroke-linecap': 'round', 'stroke-opacity': .75 }));
  const hinge = mk('circle', { r: sw * 1.3, fill: '#6f7f8c', stroke: '#2b343a', 'stroke-width': 2 }, g);
  const stop = block !== null ? path(g, '', { stroke: COL.bad, 'stroke-width': sw * .9, 'stroke-linecap': 'round' }) : null;
  const seg = (A, B) => `M${f1(A[0])} ${f1(A[1])}L${f1(B[0])} ${f1(B[1])}`;
  const across = (P, Q, k) => { const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy) || 1, n = [-dy / L * 34 * st(j.g).s / .7, dx / L * 34 * st(j.g).s / .7]; return seg([P[0] + n[0], P[1] + n[1]], [P[0] - n[0], P[1] - n[1]]); };

    const C = j.at('C'), A = j.at(j.hum([-.15, -5.6])), B = j.at(j.fore([.1, 6.3]));
    bar1.setAttribute('d', seg(A, C)); bar2.setAttribute('d', seg(C, B));
    const a1 = j.at(j.hum([-.18, -4.6])), a2 = j.at(j.hum([-.22, -2.4])), b1 = j.at(j.fore([0, 2.6])), b2 = j.at(j.fore([.1, 5.2]));
    straps[0].setAttribute('d', across(a1, C, 1)); straps[1].setAttribute('d', across(a2, C, 1)); straps[2].setAttribute('d', across(b1, C, 1)); straps[3].setAttribute('d', across(b2, C, 1));
    hinge.setAttribute('cx', f1(C[0])); hinge.setAttribute('cy', f1(C[1]));
    if (stop) { const r = rad(st(j.g).r || 0), P = polar(C, 60 * st(j.g).s / .7, 90 - block + (st(j.g).r || 0)), Q = polar(C, 90 * st(j.g).s / .7, 90 - block + (st(j.g).r || 0)); stop.setAttribute('d', seg(P, Q)); }
  };
  j.onSet.push(upd); upd();
  if (t0 !== null) show(g, t0);
  return g;
}
// a small scene card: a framed box with a caption
function sceneBox(p, x, y, w, h, title, col, t0) { const g = G(p, { o: 0 }); roundBox(g, x, y, w, h, EDGE, PANEL, 2); T(g, title, { x: x + w / 2, y: y + h - 16, size: 16, fill: col, weight: 700, anchor: 'middle' }); if (t0 !== null) show(g, t0); return g; }

/* ---------- chapter 18 helpers: a phase strip ---------- */
// Rehabilitation phases on a time axis: rows [label, from, to, colour] in weeks; ticks [[value, label]].
// Each phase gets its own row; they appear one by one (t0 + i * gap, or t0[i] if an array).
function phaseBar(p, x, y, w, max, rows, ticks, t0, { gap = .6, dy = 34, size = 15 } = {}) {
  const g = G(p, { o: 0 }), X = v => x + w * v / max;
  path(g, `M${x} ${y}H${x + w}`, { stroke: COL.dim, 'stroke-width': 3 });
  ticks.forEach(([v, s0]) => { path(g, `M${f1(X(v))} ${y - 6}V${y + 6}`, { stroke: COL.dim, 'stroke-width': 2 }); T(g, s0, { x: X(v), y: y + 26, size: 14, fill: COL.dim, anchor: 'middle' }); });
  if (t0 !== null) show(g, Array.isArray(t0) ? t0[0] : t0);
  const els = rows.map(([s0, a, b, c], i) => {
    const r = G(p, { o: 0 }), yy = y - 26 - (rows.length - 1 - i) * dy;
    mk('rect', { x: X(a), y: yy - 12, width: Math.max(4, X(b) - X(a)), height: 22, rx: 8, fill: c, 'fill-opacity': .85 }, r);
    const fits = uiW(s0, size) + 16 <= X(b) - X(a);
    T(r, s0, { x: fits ? X(a) + 8 : X(b) + 8, y: yy + 5, size, fill: fits ? COL.board : c, weight: 700 });
    if (t0 !== null) show(r, Array.isArray(t0) ? t0[i] : t0 + i * gap);
    return r;
  });
  return { g, rows: els, X };
}

/* ---------- chapter 18 helpers (lesson 175) ---------- */
// a two-column list with marks: items [text, colour], cross (✕) or tick
function markList(p, x, y, items, t0, gap, { cross: isX = true, size = 16, dy = 36, maxW = 300 } = {}) {

    pillRow(p, ['костыли или ходунки сразу', 'вода — когда рана зажила'], 400, 760, m('walk', 1), { col: SH, size: 15, gap: 2 });
    infoCard(p, 800, 90, 760, 175, 'ограничение движений', 'ортез 10–14 дней; валик против наружной ротации; активная внутренняя ротация от нуля — в первые дни против спаек; иногда аппарат пассивных движений', ORTH_C, m('brace'), { size: 17 });
    infoCard(p, 800, 280, 760, 150, 'с первых дней', 'качания стопой и изометрия; растяжка, если нет полного пассивного объёма к 4–6 неделям; стабилизация туловища', COL.good, m('early'), { size: 17 });
    infoCard(p, 800, 445, 760, 175, 'ходьба и функция', 'частичная нагрузка с костылями с 1-го дня; вода до полной нагрузки; раньше возвращаются после губы и капсулы, позже — после микропереломов и остеопластики', SH, m('walk'), { size: 17 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-limit', prompt: ['После какой операции такое ограничение?'],
    build: grid([
      { parts: ['Наружная ротация не дальше 10° три–четыре недели'], ans: ['cap'], why: 'После операции на передней капсуле.' },
      { parts: ['Касание стопой 4–6 недель — защитить молодой хрящ'], ans: ['mf'], why: 'Микропереломы.' },
      { parts: ['Сгибание не больше 80–90°, велотренажёр с высоким сиденьем'], ans: ['lab'], why: 'Операции на губе.' },
      { parts: ['Касание 4–6 недель ради костного заживления'], ans: ['ost'], why: 'Остеопластика.' },
      { parts: ['Частичная нагрузка до 4 недель'], ans: ['lab'], why: 'После шва губы.' },
    ], [['mf', 'Микропереломы', COL.bad], ['lab', 'Губа', LAB_C], ['ost', 'Остеопластика', FRAC_C], ['cap', 'Капсула', CAPS_C]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Артроскопия — хрящ, губа, импинджмент, капсула; при поздней дегенерации — остеотомия и эндопротезирование.', 'w1'],
     ['Дольше всего защищают микропереломы и остеопластику: касание 4–6 недель; губа — частичная 2–4 недели.', 'w2'],
     ['Подъём прямой ноги — через 3–4 недели после микропереломов и остеопластики; после капсулы — наружная ротация ≤ 10°.', 'w3'],
     ['Ортез и валик 10–14 дней, но внутренняя ротация от нуля — рано; растяжка — если нет объёма к 4–6 неделям.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-labrep', prompt: ['Сшита острая травма губы. Как нагружать ногу?'],
    build: choice([
      ['Частичная нагрузка до 4 недель, дальше — постепенно по боли'],
      ['Сразу полная нагрузка'],
      ['Касание стопой 8 недель'],
      ['Без нагрузки 12 недель'],
    ], 0, 'После шва губы — частичная нагрузка до 4 недель, затем постепенно.',
    [null, 'Так можно только позже.', 'Это ограничения после микропереломов.', 'Такой защиты не требуется.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-slr', prompt: ['Через 2 недели после микропереломов пациент хочет поднимать прямую ногу лёжа с манжетой. Что ответить?'],
    build: choice([
      ['Рано: подъём прямой ноги — через 3–4 недели, сопротивление — с 4–6'],
      ['Можно, это лёгкое упражнение'],
      ['Можно, но не больше 2 кг'],
      ['Подъём прямой ноги запрещён навсегда'],
    ], 0, 'Подъём прямой ноги лёжа сильно сжимает сустав — его откладывают на 3–4 недели, сопротивление начинают в 4–6.',
    [null, 'Он сильно сжимает сустав.', 'Сопротивление — не раньше 4–6 недель.', 'Ограничение временное.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
