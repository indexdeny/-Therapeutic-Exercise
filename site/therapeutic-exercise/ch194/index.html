  roundBox(g, -150, -150, 300, 300, EDGE, PANEL, 2);
  T(g, 'вид сверху', { x: 0, y: -122, size: 17, fill: COL.dim, anchor: 'middle', weight: 600 });
  mk('ellipse', { cx: 0, cy: 50, rx: 112, ry: 42, fill: boneGrad(defs, 0, 0, 0, 1), stroke: mix(ANAT.bone, '#000000', .5), 'stroke-width': 2 }, g);
  path(g, 'M-128 50H128', { stroke: SH, 'stroke-width': 3, 'stroke-dasharray': '8 6' });
  const neck = G(g, {}), head = mk('circle', { r: 30, fill: ballGrad(defs), stroke: mix(ANAT.bone, '#000000', .45), 'stroke-width': 1.5 }, neck);
  const nk = mk('path', { fill: boneGrad(defs, 0, 0, 1, 0), stroke: mix(ANAT.bone, '#000000', .5), 'stroke-width': 2 }, neck);
  neck.insertBefore(nk, head);
  mk('circle', { cx: 0, cy: 0, r: 26, fill: ballGrad(defs), stroke: mix(ANAT.bone, '#000000', .45), 'stroke-width': 1.5 }, g);
  const axis = path(g, '', { stroke: FUN, 'stroke-width': 3, 'stroke-dasharray': '8 6' }), arc = path(g, '', { stroke: FUN, 'stroke-width': 3.5 });
  const lbl = T(g, '', { x: -60, y: 92, size: 22, fill: FUN, weight: 700, anchor: 'middle' });
  T(g, 'вперёд ↓', { x: 108, y: 128, size: 15, fill: COL.dim, anchor: 'end' });
  g.set = a => {
    const H = [-105 * Math.cos(rad(a)), 105 * Math.sin(rad(a))];
    head.setAttribute('cx', f1(H[0])); head.setAttribute('cy', f1(H[1]));
    const n = [-H[1] / 105, H[0] / 105];
    nk.setAttribute('d', ptsD([[n[0] * 18, n[1] * 18], [H[0] + n[0] * 14, H[1] + n[1] * 14], [H[0] - n[0] * 14, H[1] - n[1] * 14], [-n[0] * 18, -n[1] * 18]], true));
    axis.setAttribute('d', `M${f1(-H[0] * .3)} ${f1(-H[1] * .3)}L${f1(H[0] * 1.25)} ${f1(H[1] * 1.25)}`);
    arc.setAttribute('d', smoothD(arcPts([0, 0], 70, 180 - a, 180, 4), false));

// a belt loop round a stage point P with a pull arrow at angle ang (the mobilization belt of MWM)
function beltEl(p, P, ang, t0, { L = 150, col = '#9fd0e8', r = 26 } = {}) {
  const g = G(p, { o: 0 }), B = polar(P, L, ang);
  mk('ellipse', { cx: f1(P[0]), cy: f1(P[1]), rx: r, ry: r * .55, transform: `rotate(${f1(ang + 90)} ${f1(P[0])} ${f1(P[1])})`, fill: 'none', stroke: col, 'stroke-width': 7 }, g);
  path(g, `M${f1(P[0])} ${f1(P[1])}L${f1(B[0])} ${f1(B[1])}`, { stroke: col, 'stroke-width': 7, 'stroke-linecap': 'round' });
  const A1 = polar(P, L * .45, ang), A2 = polar(P, L * .8, ang);
  g.appendChild(arw(p, A1[0], A1[1], A2[0], A2[1], COL.good, null, 5));
  if (t0 !== null) show(g, t0);
  return g;
}

    infoCard(p, 800, 610, 760, 150, 'установка', 'пересечь шейку, рассверлить впадину, чашка, ножка в канал; проверить положение и устойчивость; ушить капсулу и слои', SH, m('impl'), { size: 17 });
  }],

  ['comp', 'Осложнения', (m, D) => {
    const p = panel(0);
    txt(p, 'осложнения и вывих', 400, 56, m('types'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    const tl = G(p, {});
    phaseBar(tl, 60, 520, 640, 20, [['во время: компоненты, перелом, длина ног, нерв', 0, .6, COL.task], ['рано: рана, инфекция, вывих', .6, 8, COL.bad], ['поздно: расшатывание (чаще всего), износ, перелом', 8, 20, MU]],
      [[0, 'операция'], [4, '6 нед'], [8, '2–3 мес'], [20, 'годы']], [m('types', 1), m('types', 4), m('types', 12), m('types', 22)], { dy: 50, size: 14 });
    pill(tl, 'схема', 640, 590, m('types', 2), { col: COL.dim, size: 13 });
    hide(tl, m('disl'), .3);
    const sg = hipSag(p, 330, 400, .75, m('disl'), { muscles: ['gmax', 'piri'], farLeg: false, fade: 5.5 });
    sg.implant('tha', m('disl', .2), .1);
    prog(q => { const k = Math.min(1, q * 1.6); sg.set({ th: 105 * k, kn: 90 * k }); }, m('disl', 3), 4);
    prog(q => sg.set({ disl: q }), m('disl', 7), 1.5);
    const ds = txt(p, 'вывих кзади — чаще в первые 2–3 месяца', 400, 120, m('disl', 7), { size: 18, fill: COL.bad, anchor: 'middle', weight: 700 });
    hbars(p, 60, 720, [['после первичной: в среднем < 2 %', 2, SH], ['1-й год после ревизии', 5.1, COL.bad], ['1-й год после первичной', 1.7, SH]], [m('disl', 10), m('disl', 13), m('disl', 13)], { k: 70, dy: 46, unit: ' %', size: 14 });
    hide(ds, m('len'), .3);
    pill(p, 'разница > 20 мм — нарушения походки, боль в спине', 400, 120, m('len', 6), { col: COL.task, size: 15 });
    infoCard(p, 800, 90, 760, 175, 'когда', 'во время операции — положение компонентов, перелом, длина ног, нерв; рано — инфекция, вывих; поздно — расшатывание (чаще всего), износ, перелом', COL.task, m('types'), { size: 16 });
    infoCard(p, 800, 280, 760, 150, 'вывих', 'обычно нетравматический и кзади, после заднего доступа; первый вправляют закрыто, повторные — операция', COL.bad, m('disl'), { size: 16 });
    infoCard(p, 800, 445, 760, 175, 'риск', 'старше 80–85 лет, перелом шейки, ревматоидный артрит, прежние операции, слабые отводящие, когнитивные нарушения; задний доступ, малая головка, положение чашки', COL.bad, m('risk'), { size: 16 });
    infoCard(p, 800, 635, 760, 150, 'длина ног', 'чаще функциональная — спазм, слабость, контрактура — и проходит за год; истинная — от операции', COL.task, m('len'), { size: 16 });
  }],

  ['prec', 'Предосторожности', (m, D) => {
    const p = panel(0);
    txt(p, 'ограничения движений', 400, 56, m('gen'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    const gp = [pill(p, 'зависит от доступа и устойчивости протеза', 400, 300, m('gen', 1), { col: SH, size: 16 }), pill(p, 'после малоинвазивных — могут быть не нужны', 400, 350, m('gen', 5), { col: COL.good, size: 16 })];
    gp.forEach(e => hide(e, m('post'), .3));
    const sg = hipSag(p, 330, 380, .55, m('post'), { muscles: ['gmax'], farLeg: false });
    sg.implant('tha', m('post', .2), .1);
    prog(q => sg.set({ th: 80 * Math.min(1, q * 2), kn: 85 * Math.min(1, q * 2) }), m('post', 1), 2);
    const ok = txt(p, '✓ высокий стул: колени чуть ниже бёдер', 400, 120, m('post', 1.5), { size: 18, fill: COL.good, anchor: 'middle', weight: 700 });
    prog(q => sg.set({ th: lerp(80, 110, q), kn: lerp(85, 110, q) }), m('post', 8), 1.5);
    const no = txt(p, '✕ низкое кресло: сгибание > 90°', 400, 160, m('post', 8.5), { size: 18, fill: COL.bad, anchor: 'middle', weight: 700 });
    const ml = markList(p, 90, 660, [['ногу на ногу', COL.bad], ['наклон к ногам', COL.bad], ['сон на боку', COL.bad], ['поворот к больной ноге', COL.bad]], m('post', 12), 1.5, { cross: true, size: 15, dy: 38, maxW: 300 });
    [ok, no, ...ml].forEach(e => hide(e, m('ant'), .3)); hide(sg.g, m('ant'), .4);
    const h = hipFront(p, 380, 328, .62, m('ant', .3), { tibia: true, spine: false, muscles: ['gmed'] });
    prog(q => h.set({ abdL: -10 * cyc(q, 1) }), m('ant', 3), 2.5);
    pill(p, 'передний доступ: без разгибания, приведения и наружной ротации за ноль', 400, 120, m('ant', 1), { col: COL.task, size: 14 });
    pill(p, 'средняя ягодичная сшита — без отведения против тяжести 6–8 нед', 400, 165, m('ant', 10), { col: COL.bad, size: 14 });
    pill(p, 'любой доступ ≈ 6 нед: сгибание < 90°, ротация < 45°', 400, 830, m('all', .5), { col: SH, size: 15 });
    infoCard(p, 800, 90, 760, 200, 'задний доступ', 'сгибание ≤ 90°, приведение и внутренняя ротация не дальше нуля; на здоровую сторону, не скрещивать, высокий стул и унитаз, лестница вверх — здоровой, вниз — оперированной, спать на спине с подушкой', COL.bad, m('post'), { size: 16 });
    infoCard(p, 800, 305, 760, 175, 'передний, переднебоковой, боковой', 'сгибание ≤ 90°; без разгибания, приведения и наружной ротации за ноль; без сгибания с отведением и наружной ротацией; приставлять шаг, не заносить', COL.task, m('ant'), { size: 16 });
    infoCard(p, 800, 495, 760, 150, 'остеотомия вертела', 'без приведения за ноль, без активного отведения 6–8 нед, без опоры на ногу в упражнениях; разгрузка до 12 нед', FRAC_C, m('tt'), { size: 16 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-post', prompt: ['Можно ли после заднего доступа?'],
    build: grid([
      { parts: ['Сидеть на высоком стуле, колени чуть ниже бёдер'], ans: ['y'], why: 'Сгибание меньше 90°.' },
      { parts: ['Сидеть в низком мягком кресле'], ans: ['n'], why: 'Сгибание больше 90° — риск вывиха.' },
      { parts: ['Закинуть ногу на ногу'], ans: ['n'], why: 'Приведение за ноль.' },
      { parts: ['Подниматься по лестнице со здоровой ноги'], ans: ['y'], why: 'Вверх — здоровой, вниз — оперированной.' },
      { parts: ['Спать на боку'], ans: ['n'], why: 'Спать на спине с подушкой для отведения.' },
    ], [['y', 'Можно', COL.good], ['n', 'Нельзя', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Эндопротез служит ≈ 20 лет; цемент — нагрузка сразу, без цемента — врастание кости 3–6 месяцев.', 'w1'],
     ['Задний доступ — самый частый и с наибольшим риском вывиха; боковой и переднебоковой ослабляют отводящие; передний не отсекает мышц.', 'w2'],
     ['Вывих — в первые 2–3 месяца, в среднем < 2 %, обычно кзади; разница длины ног чаще функциональная.', 'w3'],
     ['После заднего доступа — без сгибания > 90°, приведения и внутренней ротации за ноль; после переднего — без разгибания, приведения и наружной ротации.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-socks', prompt: ['Через неделю после эндопротезирования задним доступом пациентке нужно одеться. Что правильно?'],
    build: choice([
      ['Одеваться, не наклоняя туловище к ногам'],
      ['Сесть и подтянуть стопу к груди'],
      ['Сесть и закинуть ногу на ногу'],
      ['Наклониться к стопе стоя'],
    ], 0, 'После заднего доступа избегают сгибания больше 90° и наклона туловища к ногам при одевании.',
    [null, 'Это сгибание больше 90°.', 'Это приведение за ноль.', 'Наклон к ногам — сильное сгибание бедра.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-abd', prompt: ['При прямом боковом доступе отсекали и сшивали среднюю ягодичную. Когда отведение против силы тяжести?'],
    build: choice([
      ['Не раньше 6–8 недель или с разрешения хирурга'],
      ['С первого дня'],
      ['Через 2 недели'],
      ['Только через год'],
    ], 0, 'Если среднюю ягодичную рассекали или делали остеотомию вертела, активное отведение против тяжести откладывают на 6–8 недель.',
    [null, 'Шов мышцы ещё слаб.', 'Слишком рано.', 'Так долго ждать не нужно.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
