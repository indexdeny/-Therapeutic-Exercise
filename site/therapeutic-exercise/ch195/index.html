const SH = '#86c9e8', MU = '#f4a48c', LG = '#f1dfa0', FUN = '#f0c060', SP = '#8fd6b0', ENV = '#c9b8e8', BAD = COL.bad;

// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.

    tbl(p, 40, 230, [240, 250, 240], ['можно', 'осторожно', 'нельзя'], [['гольф', 'быстрая ходьба', 'бег трусцой'], ['плавание', 'походы', 'бейсбол'], ['ходьба', 'степпер, гребля', 'ракетбол, сквош'], ['велотренажёр, эллипс', 'парный теннис', 'сноуборд'], ['лыжный тренажёр', 'силовые тренажёры', 'высокоударная аэробика'], ['боулинг', 'пилатес, беговые лыжи', 'футбол, баскетбол'], ['лёгкая аэробика', 'ролики, коньки, горные лыжи', '—']], m('sport', 2), { size: 15, gap: .9, col: COL.good });
    infoCard(p, 800, 90, 760, 150, 'с 12 недель', 'сила, выносливость, равновесие, симметричный шаг; полное возвращение — год и больше', SH, m('when'), { size: 17 });
    infoCard(p, 800, 255, 760, 175, 'продлённая программа', 'слабость отводящих держится месяцами; ходьба малой интенсивности; меньше нагрузки на протез, при тяжёлом труде — менять работу', COL.good, m('ext'), { size: 17 });
    infoCard(p, 800, 445, 760, 150, 'спорт', 'без ударов и сильных поворотов; 90 % хирургов — возврат к выбранным занятиям к 6 месяцам', MU, m('sport'), { size: 17 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-sport', prompt: ['Какой вид нагрузки после эндопротеза?'],
    build: grid([
      { parts: ['Плавание'], ans: ['y'], why: 'Рекомендовано.' },
      { parts: ['Парный теннис'], ans: ['c'], why: 'Осторожно и при опыте.' },
      { parts: ['Бег трусцой'], ans: ['n'], why: 'Ударная нагрузка.' },
      { parts: ['Горные лыжи'], ans: ['c'], why: 'Осторожно и при опыте.' },
      { parts: ['Футбол'], ans: ['n'], why: 'Контактный вид.' },
    ], [['y', 'Можно', COL.good], ['c', 'Осторожно', COL.task], ['n', 'Нельзя', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['out', 'Результаты', (m, D) => {
    const p = panel(0);
    txt(p, 'результаты', 400, 56, m('pain'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    const op = [pill(p, 'боль заметно меньше', 400, 280, m('pain', 1), { col: COL.good, size: 16 }), pill(p, 'хуже исход: сильная боль и плохая функция до операции', 400, 330, m('pain', 9), { col: COL.bad, size: 15 }),
      pill(p, 'пожилой возраст, боль в спине', 400, 380, m('pain', 14), { col: COL.bad, size: 15 })];
    op.forEach(e => hide(e, m('func'), .3));
    hbars(p, 60, 180, [['улучшения за 1-й год', 90, COL.good], ['с одной тростью при выписке: малоинвазивно', 87, SH], ['то же: традиционно', 53, COL.dim]], [m('func', 1), m('mi', 6), m('mi', 7)], { k: 6, dy: 66, unit: ' %', size: 15 });
    pillRow(p, ['плато — 2–3 года', 'равновесие на ноге — хуже'], 400, 450, m('func', 8), { col: COL.task, size: 15, gap: 2 });
    pill(p, '12 занятий ходьбой — дальше, быстрее, меньше падений', 400, 560, m('rehab', 10), { col: MU, size: 15 });
    pill(p, 'тренажёры 10 недель — быстрее ходьба и лестница', 400, 605, m('rehab', 18), { col: MU, size: 15 });
    infoCard(p, 800, 90, 760, 150, 'боль и удовлетворённость', 'боль заметно меньше; хуже исход — при сильной боли и плохой функции до операции, в пожилом возрасте, при боли в спине', SH, m('pain'), { size: 17 });
    infoCard(p, 800, 255, 760, 150, 'функция', '90 % улучшения к году, плато к 2–3 годам; через год объём и сила почти как у здоровой ноги, равновесие хуже', COL.good, m('func'), { size: 17 });
    infoCard(p, 800, 420, 760, 150, 'малоинвазивно или нет', 'больничные плюсы, иногда больше осложнений; явной разницы в функции и ходьбе нет', COL.task, m('mi'), { size: 17 });
    infoCard(p, 800, 585, 760, 150, 'реабилитация', 'повышает шанс выписки домой; тренировка ходьбы и прогрессивная сила дают лучшую функцию', MU, m('rehab'), { size: 17 });
  }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Цемент — нагрузка по переносимости сразу; без цемента ограничения разные; ранняя нагрузка у молодых с хорошей костью безопасна, решает хирург.', 'w1'],
     ['Первые недели: обучение, высокий стул, ходунки → трость, субмаксимальная изометрия; переход — сила ≥ 3/5.', 'w2'],
     ['С 4–6 недель — отводящие и разгибатели, закрытая цепь, Томас до нуля, трость в противоположной руке; с 12 — малоударный спорт.', 'w3'],
     ['90 % улучшения — за год, плато — через 2–3; равновесие на оперированной ноге восстанавливается хуже всего.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-cane2', prompt: ['Через 5 недель после эндопротеза пациент ходит с положительным признаком Тренделенбурга. Что с тростью?'],
    build: choice([
      ['Трость в противоположной руке, пока есть хромота и ограничения'],
      ['Трость в руке на стороне операции'],
      ['Отказаться от трости, чтобы окрепли мышцы'],
      ['Трость только на лестнице'],
    ], 0, 'Трость в противоположной руке снижает нагрузку на отводящие; её используют, пока есть хромота или ограничения.',
    [null, 'Так активность отводящих не снижается.', 'Без силы отводящих отказ от трости закрепит асимметрию.', 'По лестнице — обязательно, но не только.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-bag', prompt: ['Пациенту с эндопротезом левого бедра нужно нести тяжёлую сумку. В какой руке?'],
    build: choice([
      ['В левой — на стороне протеза'],
      ['В правой'],
      ['Попеременно'],
      ['Носить нельзя никогда'],
    ], 0, 'Груз на стороне оперированного бедра заметно уменьшает силу его отводящих.',
    [null, 'Так отводящим протеза работать тяжелее.', 'Лучше держать на стороне протеза.', 'Можно, с умом.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
