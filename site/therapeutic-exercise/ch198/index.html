const SH = '#86c9e8', MU = '#f4a48c', LG = '#f1dfa0', FUN = '#f0c060', SP = '#8fd6b0', ENV = '#c9b8e8', BAD = COL.bad;

// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.
function fsReach(f, side, X, Y, flip = false) {

  const tx = (X - S.x) / S.s - Sh[0], ty = (Y - S.y) / S.s - Sh[1], D = clamp(Math.hypot(tx, ty), 8, 137.5), dg = 180 / Math.PI;
  const phi = Math.atan2(k * tx, ty) * dg, be = Math.acos(clamp((72 * 72 + D * D - 66 * 66) / (2 * 72 * D), -1, 1)) * dg, ga = Math.acos(clamp((72 * 72 + 66 * 66 - D * D) / (2 * 72 * 66), -1, 1)) * dg;

// an elastic band between two stage points; set(A, B, rest) — brighter and thinner as it stretches

}

// horizontal bars with values: rows [label, value, colour]; k — px per unit
function bars(p, x, y, rows, t0, { k = 5, dy = 46, unit = '%', w0 = 210, size = 17 } = {}) {

// the flexion range a contracted capsule allows: [extension limit, flexion limit], scanned on the model
function capRange(j) {
  let lo = 0, hi = 145;
  for (let a = 0; a <= 145; a++) { j.set({ flex: a }); if (j.capA.tension < .97) { lo = a; break; } }
  for (let a = 145; a >= 0; a--) { j.set({ flex: a }); if (j.capP.tension < .97) { hi = a; break; } }
  return [lo, hi];
}
// a hinged elbow brace on an elbowSag model (bars, straps, the hinge); block — the extension stop in degrees
function hingeBrace(p, j, t0, block = null) {

  const bar1 = path(g, '', { stroke: col, 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-opacity': .9 });
  const bar2 = path(g, '', { stroke: col, 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-opacity': .9 });
  const straps = [0, 1, 2, 3].map(() => path(g, '', { stroke: '#6fa8c8', 'stroke-width': sw * 1.1, 'stroke-linecap': 'round', 'stroke-opacity': .75 }));
  const hinge = mk('circle', { r: sw * 1.3, fill: '#6f7f8c', stroke: '#2b343a', 'stroke-width': 2 }, g);
  const stop = block !== null ? path(g, '', { stroke: COL.bad, 'stroke-width': sw * .9, 'stroke-linecap': 'round' }) : null;
  const seg = (A, B) => `M${f1(A[0])} ${f1(A[1])}L${f1(B[0])} ${f1(B[1])}`;

  };

/* ---------- chapter 18 helpers: a phase strip ---------- */
// Rehabilitation phases on a time axis: rows [label, from, to, colour] in weeks; ticks [[value, label]].
// Each phase gets its own row; they appear one by one (t0 + i * gap, or t0[i] if an array).
function phaseBar(p, x, y, w, max, rows, ticks, t0, { gap = .6, dy = 34, size = 15 } = {}) {
  const g = G(p, { o: 0 }), X = v => x + w * v / max;
  path(g, `M${x} ${y}H${x + w}`, { stroke: COL.dim, 'stroke-width': 3 });
  ticks.forEach(([v, s0]) => { path(g, `M${f1(X(v))} ${y - 6}V${y + 6}`, { stroke: COL.dim, 'stroke-width': 2 }); T(g, s0, { x: X(v), y: y + 26, size: 14, fill: COL.dim, anchor: 'middle' }); });
  if (t0 !== null) show(g, Array.isArray(t0) ? t0[0] : t0);
  const els = rows.map(([s0, a, b, c], i) => {
    const r = G(p, { o: 0 }), yy = y - 26 - (rows.length - 1 - i) * dy;
    mk('rect', { x: X(a), y: yy - 12, width: Math.max(4, X(b) - X(a)), height: 22, rx: 8, fill: c, 'fill-opacity': .85 }, r);
    const fits = uiW(s0, size) + 16 <= X(b) - X(a);
    T(r, s0, { x: fits ? X(a) + 8 : X(b) + 8, y: yy + 5, size, fill: fits ? COL.board : c, weight: 700 });
    if (t0 !== null) show(r, Array.isArray(t0) ? t0[i] : t0 + i * gap);

    infoCard(p, 800, 225, 760, 120, 'Томас с согнутым коленом', 'вес ноги; можно добавить сокращение разгибателей бедра', MU, m('thom'), { size: 16 });
    infoCard(p, 800, 360, 760, 150, 'на животе', 'взять лодыжку или ремень; полотенце под нижнюю треть бедра; без отведения, ротации и прогиба поясницы', MU, m('prone'), { size: 16 });
    infoCard(p, 800, 525, 760, 150, 'стоя', 'задний наклон таза, спина не прогибается; если мышца коротка — стопа на стул сзади', MU, m('stand'), { size: 16 });
  }],

  ['ham', 'Задняя группа', (m, D) => {
    const p = panel(0);
    txt(p, 'задняя группа бедра', 400, 56, m('what'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    const a = lyingSag(p, 370, 510, .5, m('slr'), -90, { muscles: ['ham', 'rf'], farLeg: true }, {});
    const bn = bench(p, 60, 760, 566, m('slr'));
    prog(q => a.set({ th: 70 * Math.min(1, q * 1.4), kn: 0 }), m('slr', 1), 4);
    const ps = pill(p, 'прямая нога, полотенце за бедром', 400, 740, m('slr', 1), { col: MU, size: 15 });
    prog(q => { const k = q < .45 ? 1 : 0; a.M.ham.act(k * .9); a.set({ th: q < .5 ? 70 : lerp(70, 80, (q - .5) * 2) }); }, m('door', 6), 6);
    const pd = pill(p, 'дверной проём: давить пяткой — расслабиться — поднять ногу', 400, 785, m('door', 6), { col: COL.good, size: 14 });
    [bn, ps, pd].forEach(e => hide(e, m('chair'), .3)); hide(a.g, m('chair'), .4);
    const c = hipSag(p, 300, 380, .55, m('chair', .3), { muscles: ['ham'], farLeg: true });
    c.set({ th: 85, kn: 5, th2: 90, kn2: 90 });
    const chG = G(p, {}); bench(chG, 240, 370, 420, m('chair', .3), COL.dim, 182); bench(chG, 660, 760, 450, m('chair', .3), COL.dim, 152); floorLn(chG, 80, 760, 602, m('chair', .3));
    prog(q => c.set({ tilt: 22 * q, trunk: 22 * q }), m('chair', 2), 4);
    const pc = pill(p, 'наклон к бедру с прямой спиной', 400, 120, m('chair', 2), { col: MU, size: 15 });
    [pc, chG].forEach(e => hide(e, m('toe'), .3)); hide(c.g, m('toe'), .4);
    const d = hipSag(p, 360, 370, .55, m('toe', .3), { muscles: ['ham', 'erect'], farLeg: true });
    prog(q => d.set({ tilt: 45 * q, trunk: 45 * q }), m('toe', 8), 4);
    pill(p, 'руки на бёдрах: наклон в тазобедренных суставах', 400, 120, m('toe', 8), { col: COL.good, size: 15 });
    pill(p, 'при боли в пояснице — нельзя', 400, 165, m('toe', 14), { col: COL.bad, size: 15 });
    infoCard(p, 800, 90, 760, 120, 'двусуставная', 'сгибание бедра при прямом колене', MU, m('what'), { size: 16 });
    infoCard(p, 800, 225, 760, 175, 'лёжа', 'подъём прямой ноги с полотенцем; в проёме: таз и другая нога на полу, ягодицы ближе к косяку, «напряжение — расслабление» с сокращением агониста', MU, m('slr'), { size: 16 });
    infoCard(p, 800, 415, 760, 120, 'сидя или стоя', 'нога на стуле или столе, наклон к бедру с нейтральной спиной', MU, m('chair'), { size: 16 });
    infoCard(p, 800, 550, 760, 175, 'не «к носкам»', 'достать до носков — общая гибкость, маскирует укорочение; лучше наклон в бёдрах с разогнутой поясницей', COL.bad, m('toe'), { size: 16 });
  }],

  ['tfl', 'Напрягатель широкой фасции', (m, D) => {
    const p = panel(0);
    txt(p, 'напрягатель и тракт', 400, 56, m('what'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    const h = hipFront(p, 380, 330, .6, m('what'), { tibia: true, spine: false, muscles: ['tfl', 'gmed'] });
    pillRow(p, ['разгибание', 'приведение', 'наружная ротация'], 400, 120, m('what', 4), { col: MU, size: 15, gap: 1 });
    prog(q => h.set({ abdL: -14 * q, rotL: -15 * q }), m('sup', 2), 3);
    pill(p, 'лёжа: здоровая нога поверх, стопа снаружи колена', 400, 165, m('sup', 2), { col: SH, size: 14 });
    prog(q => h.set({ abdL: lerp(-14, -20, q), knL: 60 * q }), m('side', 4), 3);
    pill(p, 'на боку: не заваливаться назад; груз 1–2,3 кг, 20–30 мин', 400, 210, m('side', 10), { col: COL.task, size: 14 });
    prog(q => h.set({ knL: 0, abdL: -18, sx: .5 * q }), m('stand', 2), 3);
    pill(p, 'стоя: нога за другой, таз к стене', 400, 830, m('stand', 2), { col: SH, size: 15 });
    infoCard(p, 800, 90, 760, 175, 'что растягивать', 'мышца сгибает, отводит и ротирует внутрь — растяжка разгибанием, приведением и наружной ротацией; тракт над вертелом, позже колено согнуто', MU, m('what'), { size: 16 });
    infoCard(p, 800, 280, 760, 120, 'лёжа на спине', 'подушки под тазом; здоровая нога перекинута через больную', SH, m('sup'), { size: 16 });
    infoCard(p, 800, 415, 760, 175, 'на боку', 'верхнюю ногу отвести в плоскости тела, развернуть наружу и опустить; туловище не заваливается; ремень, сгибание колена, груз (в книге — 2–5 фунтов)', COL.task, m('side'), { size: 16 });
    infoCard(p, 800, 605, 760, 120, 'стоя', 'боком к стене: нога назад, внутрь и наружу, таз к стене', SH, m('stand'), { size: 16 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-two', prompt: ['Какую мышцу растягивают?'],
    build: grid([
      { parts: ['Положение Томаса с согнутым коленом'], ans: ['rf'], why: 'Разгибание бедра при согнутом колене.' },
      { parts: ['Подъём прямой ноги с полотенцем'], ans: ['ham'], why: 'Сгибание бедра при прямом колене.' },
      { parts: ['На боку: разогнуть, развернуть наружу, опустить верхнюю ногу'], ans: ['tfl'], why: 'Разгибание, приведение, наружная ротация.' },
      { parts: ['Лёжа на животе, стопу к ягодице'], ans: ['rf'], why: 'Колено согнуто, бедро разогнуто.' },
      { parts: ['Сидя, наклон к прямой ноге на стуле'], ans: ['ham'], why: 'Наклон в бёдрах при прямом колене.' },
    ], [['rf', 'Прямая мышца', MU], ['ham', 'Задняя группа', SH], ['tfl', 'Напрягатель', COL.task]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Растягивая сам сустав, двусуставные мышцы держат расслабленными через колено; антагонист закрепляет объём.', 'w1'],
     ['Разгибание: отжимание, Томас, фехтовальщик с задним наклоном таза; сгибание: колени к груди без отрыва таза, четвереньки с прогибом.', 'w2'],
     ['Прямая мышца — разгибание бедра при согнутом колене; задняя группа — сгибание при прямом, наклон в бёдрах.', 'w3'],
     ['Напрягатель — разгибание, приведение, наружная ротация; тракт над вертелом, туловище не заваливается.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-toe', prompt: ['Пациент тянется к носкам с круглой спиной и считает, что растягивает заднюю группу. Что исправить?'],
    build: choice([
      ['Руки на бёдра, передний наклон таза и наклон только в тазобедренных суставах'],
      ['Тянуться сильнее'],
      ['Добавить пружинящие движения'],
      ['Согнуть колени'],
    ], 0, 'Наклон к носкам растягивает и спину; для задней группы — наклон в бёдрах с разогнутой поясницей.',
    [null, 'Нагрузка уйдёт в спину.', 'Это не меняет, куда идёт растяжка.', 'Так задняя группа расслабится.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-tfl', prompt: ['Растяжка напрягателя лёжа на боку не ощущается. Частая ошибка?'],
    build: choice([
      ['Туловище заваливается назад — бедро сгибается, тракт уходит с вертела'],
      ['Туловище держится ровно'],
      ['Бедро разогнуто'],
      ['Бедро развёрнуто наружу'],
    ], 0, 'Если туловище заваливается назад, бедро сгибается и тракт соскальзывает вперёд с вертела.',
    [null, 'Так и нужно.', 'Разгибание нужно.', 'Наружная ротация нужна.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
