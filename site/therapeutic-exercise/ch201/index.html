    id: 'p-lock', prompt: ['У пациента сгибательная контрактура тазобедренного сустава. Почему ему трудно стоять с прямыми коленями?'],
    build: choice([
      ['Без разгибания бедра колено не замыкается пассивно'],
      ['Слишком сильна четырёхглавая'],
      ['Рвётся передняя крестообразная связка'],
      ['Надколенник выше борозды'],
    ], 0, 'Замыканию помогают разгибание бедра и натяжение подвздошно-бедренной связки; без них стоять приходится на мышцах.',
    [null, 'Сила мышцы тут ни при чём.', 'Связка не связана с контрактурой бедра.', 'Это норма в разгибании.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-gait', prompt: ['При касании пяткой пациент резко наклоняет туловище вперёд. Функция какой мышцы потеряна?'],
    build: choice([
      ['Четырёхглавой'],
      ['Задней группы бедра'],
      ['Камбаловидной'],
      ['Подколенной'],
    ], 0, 'Без четырёхглавой центр тяжести переносят вперёд оси колена, чтобы оно не подогнулось.',
    [null, 'Её потеря — щелчок в разгибание и переразгибание.', 'Её потеря — переразгибание перед отрывом.', 'Она размыкает колено.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
