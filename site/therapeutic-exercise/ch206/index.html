// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.

    prog(q => { const c = cyc(q, 2); a.set({ th: 35 * c }); a.M.rf.act(c); }, m('ex', 4), 4);
    const pe = pillRow(p, ['изометрия', 'с подъёмом ноги', 'под разными углами'], 400, 165, m('ex', 1), { col: MU, size: 15, gap: 1 });
    pe.forEach(e => hide(e, m('tke'), .3));
    const rl = G(p, { o: 0 }); { const K = a.at('knee'); mk('ellipse', { cx: K[0], cy: K[1] + 22, rx: 26, ry: 14, fill: '#b9c4c9', stroke: COL.dim, 'stroke-width': 2 }, rl); } show(rl, m('tke', .5));
    a.set({ kn: 20, th: 6 });
    prog(q => { const c = cyc(q, 3); a.set({ kn: 20 * (1 - c), th: 6 }); a.M.rf.act(c); }, m('tke', 2), 9);
    const cuff = G(p, { o: 0 }), ce = mk('rect', { width: 26, height: 20, rx: 5, fill: '#6f857b', stroke: '#9fb0bf', 'stroke-width': 2 }, cuff);
    a.onSet.push(() => { const A = a.at('ankle'); put(ce, { x: A[0] - 13, y: A[1] - 10 }); }); a.set({}); show(cuff, m('tke', 8));
    pill(p, 'с 20° до разгибания: мышца слабее всего, надколенник не сжат', 400, 165, m('tke', 4), { col: COL.good, size: 14 });
    pill(p, 'раздражена сумка над надколенником — отложить', 400, 210, m('tke', 14), { col: COL.bad, size: 14 });
    void bn;
    infoCard(p, 800, 90, 760, 120, 'подбор', 'упражнения под нарушения пациента; бедро и устойчивость туловища обязательны', SH, m('why'), { size: 16 });
    infoCard(p, 800, 225, 760, 175, 'где больно', '0–15° — контакта почти нет, боль от жирового тела или синовиальной ткани; 60° — напряжение, 75° — сжатие; в болезненной дуге не нагружать', COL.bad, m('range'), { size: 16 });
    infoCard(p, 800, 415, 760, 120, 'изометрия', 'в безболезненных положениях, с подъёмом прямой ноги, под разными углами', MU, m('ex'), { size: 16 });
    infoCard(p, 800, 550, 760, 150, 'концевое разгибание', 'на спине с валиком, с 20°; груз на лодыжке без боли; нужно, чтобы занести ногу в машину', COL.good, m('tke'), { size: 16 });
  }],

  ['closed', 'Закрытая цепь', (m, D) => {
    const p = panel(0);
    txt(p, 'в опоре', 400, 56, m('why'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    const h = hipFront(p, 390, 330, .62, m('why'), { tibia: true, spine: false, muscles: ['gmed', 'add'] });
    h.set({ pivot: 'R', abdR: -8, rotR: 18, vgR: 10 });
    prog(q => { h.set({ abdR: lerp(-8, 0, q), rotR: lerp(18, 0, q), vgR: lerp(10, 0, q) }); h.M.R.gmed.act(q); }, m('why', 8), 3);
    const pw = [pill(p, 'вальгус в приседе — слабы отводящие, разгибатели, ротаторы', 400, 120, m('why', 4), { col: COL.bad, size: 14 }), pill(p, 'укреплять их в опоре, с правильной осью', 400, 165, m('why', 9), { col: COL.good, size: 15 })];
    [...pw, h.g].forEach(e => hide(e, m('sixty'), .3));
    const ch = kChart(p, 70, 330, 660, 120, { xmax: 90, ticks: [[0, '0'], [30, '30'], [60, '60'], [90, '90°']], ylab: 'сгибание под нагрузкой', scheme: false }, m('sixty'));
    ch.band(0, 60, COL.good, 'можно', m('sixty', 1), 250); ch.band(60, 90, COL.bad, 'осторожно', m('sixty', 2), 250);
    hide(ch, m('prog'), .3);
    const s = hipSag(p, 360, 370, .55, m('prog', .3), { muscles: ['rf', 'gmax', 'ham'], farLeg: true, plant: true });
    floorLn(p, 80, 760, s.at('heel')[1] + 22, m('prog', .3));
    prog(q => { const c = cyc(q, 3); s.set({ th: 50 * c, kn: 55 * c, an: 18 * c, th2: 50 * c, kn2: 55 * c, an2: 18 * c, tilt: 18 * c }); s.M.gmax.act(c); s.M.rf.act(c); }, m('prog', 2), 12);
    pill(p, 'мини-приседания: колени над носками', 400, 120, m('prog', 4), { col: COL.good, size: 15 });
    pill(p, 'повторять до первых симптомов, но не дальше', 400, 165, m('prog', 10), { col: COL.bad, size: 15 });
    pillRow(p, ['стена', 'выпады', 'ступеньки', 'жим ногами', 'равновесие', 'плиометрика'], 400, 210, m('prog', 18), { col: MU, size: 13, gap: .8 });
    pill(p, 'при пронации — стелька с медиальным клином', 400, 830, m('func', 4), { col: COL.task, size: 15 });
    infoCard(p, 800, 90, 760, 150, 'основа', 'опорные упражнения: меньше симптомов, больше сила и контроль колена, бедра и туловища, равновесие', SH, m('why'), { size: 16 });
    infoCard(p, 800, 255, 760, 120, 'после 60°', 'давление на надколенник выше — переходить осторожно и останавливаться при боли', COL.bad, m('sixty'), { size: 16 });
    infoCard(p, 800, 390, 760, 175, 'прогрессия', 'частичная нагрузка → полная; концевое разгибание; мини-приседания на двух, потом на одной; стена, выпады, ступеньки, резинка, тренажёры, равновесие, плиометрика', MU, m('prog'), { size: 16 });
    infoCard(p, 800, 580, 760, 120, 'функция', 'задачи без боли; переобучение движения; стелька при пронации', COL.task, m('func'), { size: 16 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-safe', prompt: ['Безопасно ли это упражнение при пателлофеморальной боли?'],
    build: grid([
      { parts: ['Мини-приседания до 45°, колени над носками'], ans: ['y'], why: 'Да — в безопасной дуге с правильной осью.' },
      { parts: ['Глубокий присед до 100° с весом'], ans: ['n'], why: 'После 60° давление на надколенник выше.' },
      { parts: ['Сопротивление разгибанию через болезненную дугу 50–80°'], ans: ['n'], why: 'В болезненной дуге нагрузку не дают.' },
      { parts: ['Концевое разгибание с 20° без боли'], ans: ['y'], why: 'Надколенник почти не сжат.' },
      { parts: ['Укрепление отводящих бедра стоя'], ans: ['y'], why: 'Да — проксимальная программа.' },
    ], [['y', 'Да', COL.good], ['n', 'Нет', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['out', 'Результаты', (m, D) => {
    const p = panel(0);
    txt(p, 'что работает', 400, 56, m('rev'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    pillRow(p, ['укрепление четырёхглавой', 'акупунктура', 'сочетание с тейпом'], 400, 120, m('rev', 2), { col: COL.good, size: 15, gap: .8 });
    const fq = kneeFront(p, 230, 560, .8, m('rev', 1), { muscles: ['vl', 'vmo', 'rf'], cruc: false });
    prog(q => { const c = cyc(q, 3); ['vl', 'vmo', 'rf'].forEach(n => fq.M[n].act(c)); }, m('rev', 2), 8);
    const hq = hipFront(p, 580, 450, .48, m('prox', .5), { tibia: true, spine: false, muscles: ['gmed', 'add'] }); hq.set({ pivot: 'R' });
    prog(q => { const c = cyc(q, 2); hq.set({ abdL: 22 * c }); hq.M.L.gmed.act(c); hq.M.R.gmed.act(.6); }, m('prox', 1), 6);
    [fq.g, hq.g].forEach(e => hide(e, m('fukuda'), .4));
    pillRow(p, ['бандаж ?', 'растяжка ?', 'мануальная терапия ?'], 400, 165, m('rev', 8), { col: COL.dim, size: 15, gap: .8 });
    pill(p, 'сильные доказательства: бедро, таз, туловище', 400, 210, m('prox', 1), { col: MU, size: 15 });
    tbl(p, 40, 280, [180, 520], ['исследование', 'итог'], [['Фукуда, 70', 'колено + бедро лучше одного колена; меньше боли на лестнице'], ['Хаямбаши', '8 недель бедра — меньше боли, эффект полгода'], ['Долак, 33', '4 недели бедра — меньше боли; к 8 неделям улучшились обе группы'], ['Балдон, 31', 'бедро и контроль — лучше ось и функция, меньше боли через 3 месяца']], [m('fukuda', 1), m('fukuda', 10), m('dolak', 1), m('baldon', 1)], { size: 14, col: SH });
    infoCard(p, 800, 90, 760, 175, 'обзоры', 'лучше всего — укрепление четырёхглавой, акупунктура, сочетание с тейпом и обратной связью; бандаж, растяжка и мануальная терапия — не доказаны', COL.good, m('rev'), { size: 16 });
    infoCard(p, 800, 280, 760, 120, 'проксимальные', 'сильные доказательства для бедра, таза и туловища — с четырёхглавой или без', MU, m('prox'), { size: 16 });
    infoCard(p, 800, 415, 760, 175, 'исследования', 'сочетание колена и бедра лучше; укрепление бедра в первые недели даёт надколеннику отдохнуть; контроль туловища и ноги улучшает ось', SH, m('fukuda'), { size: 16 });
  }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Острая фаза — покой, изометрия, тейп или бандаж, стельки; потом — избегать долгого сгибания и лестниц.', 'w1'],
     ['Надколенник мобилизуют медиальным скольжением и наклоном; тейп снижает боль, почти не меняя положения.', 'w2'],
     ['В открытой цепи — без нагрузки в болезненной дуге, концевое разгибание с 20°; в закрытой — осторожно после 60°, колени над носками.', 'w3'],
     ['Лучше всего доказано укрепление четырёхглавой и мышц бедра и туловища.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-pfm1', prompt: ['Пациентку беспокоит боль при сидении в кино. Какой совет?'],
    build: choice([
      ['Периодически разгибать колени во время сидения'],
      ['Сидеть, поджав ноги под стул'],
      ['Носить бандаж только ночью'],
      ['Больше приседать с весом'],
    ], 0, 'Долгое сгибание увеличивает давление на надколенник; помогают периодические разгибания.',
    [null, 'Это ещё больше сгибает колени.', 'Не решает проблему сидения.', 'Это усилит боль.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-pfm2', prompt: ['По Долаку, почему укрепление бедра в первые 4 недели уменьшило боль быстрее?'],
    build: choice([
      ['Надколенник отдыхал, пока готовилось бедро'],
      ['Бедро сильнее четырёхглавой'],
      ['Изменился Q-угол'],
      ['Упражнения для бедра длиннее'],
    ], 0, 'Без нагрузки на надколенник в первые недели боль уходила, а бедро готовилось к опорным упражнениям.',
    [null, 'Дело не в силе мышц.', 'Q-угол не меняли.', 'Длительность была одинаковой.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
