    const pl1 = pill(s1, 'медиально — дельтовидная связка', 400, 120, m('mort', 8), { col: LG, size: 15 });
    hide(s1b, m('axis'), .4); hide(pl1, m('axis'), .3);
    // the axis: inclined 10° down in the back view; turned 20–30° out in the top view
    const ax = G(s1, { o: 0 }), M0 = r.at('malM'), L0 = r.at('malL'), k0 = (L0[1] - M0[1]) / (L0[0] - M0[0]);
    path(ax, `M${f1(M0[0] - 40)} ${f1(M0[1] - 40 * k0)}L${f1(L0[0] + 50)} ${f1(L0[1] + 50 * k0)}`, { stroke: COL.task, 'stroke-width': 3.5, 'stroke-dasharray': '9 6' });
    path(ax, `M${f1(M0[0] - 40)} ${f1(M0[1])}H${f1(L0[0] + 60)}`, { stroke: COL.dim, 'stroke-width': 2 });

    const ft = footTop(s1, 560, 560, .62, m('axis', .3));
    ft.axis(m('axis', 1));
    txt(s1, 'ось повёрнута наружу на 20–30°', 560, 680, m('axis', 1.5), { size: 15, fill: COL.task, weight: 700, anchor: 'middle' });
    const wd = G(s1, { o: 0 }), W = [[-.7, -.52], [.7, -.62], [.56, .92], [-.56, .92]].map(P => ft.stage(ft.H(P)));
    mk('path', { d: ptsD(W, true), fill: COL.task, 'fill-opacity': .2, stroke: COL.task, 'stroke-width': 2.5 }, wd);
    show(wd, m('wedge'));
    lab(s1, 'блок спереди шире', 560, 730, ...ft.stage(ft.H([.2, .2])), COL.task, m('wedge', .5), { size: 15, anchor: 'middle' });
    prog(q => r.set({ dfk: cyc(q, 2) }), m('wedge', 2), 8, lin);
    pill(s1, 'тыльное сгибание — плотное, подошвенное — свободное', 400, 120, m('close'), { col: COL.good, size: 15 });
    hide(s1, m('heel'), .4);
    // high heels
    const s2 = G(p, {});
    const hs = ankleSag(s2, 320, 700, .62, m('heel', .3), { view: 'lat', plant: 'ball', muscles: ['gast', 'sol', 'ext'] }); hs.set({ df: -30 });
    const shoe = G(s2, { o: 0 }); { const H = hs.at('heel'), B0 = hs.at('ball'); mk('path', { d: `M${f1(H[0] - 24)} ${f1(H[1])}L${f1(H[0] + 10)} ${f1(H[1])}L${f1(H[0] + 4)} ${f1(B0[1])}L${f1(H[0] - 18)} ${f1(B0[1])}Z`, fill: '#9c6b8a', stroke: COL.board, 'stroke-width': 2 }, shoe); path(shoe, `M${f1(H[0] - 24)} ${f1(H[1] + 4)}Q${f1((H[0] + B0[0]) / 2)} ${f1(H[1] + 34)} ${f1(B0[0] + 70)} ${f1(B0[1] + 4)}`, { stroke: '#9c6b8a', 'stroke-width': 6 }); }
    show(shoe, m('heel', .6));
    pill(s2, 'каблук: голеностоп свободен, стопа замкнута — уязвимо', 400, 120, m('heel', 1), { col: COL.bad, size: 15 });
    hide(s2, m('arth'), .4);
    const s3 = G(p, {});
    const ak = ankleSag(s3, 320, 700, .66, m('arth', .3), { view: 'lat', muscles: ['gast', 'ext'] });
    const ga = G(s3, { o: 0 }), gl = path(ga, '', { stroke: COL.whole, 'stroke-width': 5 });
    ak.onSet.push(j => { const T0 = j.stage(j.Tl([0, -.3])), d = clamp(-j.q.df / 18, -1, 1), L = 42 * d; gl.setAttribute('d', Math.abs(L) < 4 ? '' : `M${f1(T0[0] - L)} ${f1(T0[1])}L${f1(T0[0] + L)} ${f1(T0[1])}M${f1(T0[0] + L - Math.sign(L) * 12)} ${f1(T0[1] - 9)}L${f1(T0[0] + L)} ${f1(T0[1])}L${f1(T0[0] + L - Math.sign(L) * 12)} ${f1(T0[1] + 9)}`); });
    show(ga, m('arth', 1));
    prog(q => ak.set({ df: 18 * Math.sin(q * Math.PI * 3) }), m('arth', 1), Math.max(3, D - m('arth') - 1.5), lin);
    pill(s3, 'выпуклая таранная скользит против движения стопы', 400, 120, m('arth', 1), { col: COL.whole, size: 15 });
    infoCard(p, 800, 90, 760, 175, 'строение', 'блоковидный синовиальный: вилка (большеберцовая с лодыжками) и блок таранной. Капсула тонкая. Медиально — дельтовидная связка, латерально — две таранно-малоберцовые и пяточно-малоберцовая', SH, m('mort'), { size: 16 });
    infoCard(p, 800, 280, 760, 120, 'ось', 'латеральная лодыжка ниже и дальше кзади: ось повёрнута наружу на 20–30° и наклонена вниз на 10°', COL.task, m('axis'), { size: 16 });
    infoCard(p, 800, 415, 760, 150, 'клин и конус', 'блок шире спереди и сужается медиально: в тыльном сгибании таранная отводится и слегка эвертируется, в подошвенном — приводится и инвертируется', COL.task, m('wedge'), { size: 16 });
    infoCard(p, 800, 580, 760, 150, 'скольжение', 'вилка вогнута, таранная выпукла: тыльное сгибание — таранная скользит назад, подошвенное — вперёд', COL.whole, m('arth'), { size: 16 });

  ['sub', 'Подтаранный сустав', (m, D) => {

    path(sx, `M${f1(A[0])} ${f1(A[1])}L${f1(B[0] + (B[0] - A[0]) * .3)} ${f1(B[1] + (B[1] - A[1]) * .3)}`, { stroke: COL.task, 'stroke-width': 3.5, 'stroke-dasharray': '9 6' });

    const dk = G(s2, { o: 0 }), sw = path(dk, '', { stroke: COL.task, 'stroke-width': 5 }), sl = path(dk, '', { stroke: COL.whole, 'stroke-width': 5 });
    const ah = (P, L) => `M${f1(P[0] - L)} ${f1(P[1])}L${f1(P[0] + L)} ${f1(P[1])}M${f1(P[0] + L - Math.sign(L) * 11)} ${f1(P[1] - 8)}L${f1(P[0] + L)} ${f1(P[1])}L${f1(P[0] + L - Math.sign(L) * 11)} ${f1(P[1] + 8)}`;
    r.onSet.push(j => { const v = clamp(-j.q.inv / 14, -1, 1), H = j.at('heel'), S0 = j.at('sub'); sw.setAttribute('d', Math.abs(v) < .15 ? '' : ah([H[0], H[1] + 22], 36 * v)); sl.setAttribute('d', Math.abs(v) < .15 ? '' : ah([S0[0], S0[1] - 6], -28 * v)); });
    show(dk, m('ak'));
    prog(q => r.set({ inv: -16 * Math.sin(q * Math.PI * 3) }), m('ak', 1), Math.max(3, D - m('ak') - 1.5), lin);
    pill(s2, 'пятка наружу — задняя фасетка медиально («дверная ручка»)', 400, 210, m('ak', 1), { col: COL.task, size: 14 });
    infoCard(p, 800, 90, 760, 150, 'косая ось', 'три сочленения таранной и пяточной; ось ≈ 42° к горизонтальной и ≈ 16° к сагиттальной плоскости — пронация и супинация пятки в трёх плоскостях', COL.task, m('what'), { size: 16 });
    infoCard(p, 800, 255, 760, 150, 'связки', 'коллатеральные (общие с голеностопом), межкостная таранно-пяточная в канале предплюсны, задняя и латеральная таранно-пяточные', LG, m('iso'), { size: 16 });
    infoCard(p, 800, 420, 760, 150, 'две полости', 'канал предплюсны отделяет заднее сочленение (своя капсула) от переднего и среднего — они общие с таранно-ладьевидным: таранно-пяточно-ладьевидный сустав', SH, m('two'), { size: 16 });
    infoCard(p, 800, 585, 760, 150, 'скольжение', 'сзади пяточная выпукла — скользит против движения; спереди вогнута — в ту же сторону. Эверсия: пятка наружу, задняя поверхность медиально', COL.whole, m('ak'), { size: 16 });

    infoCard(p, 800, 255, 760, 200, 'пронация в опоре', 'пяточная эвертируется, но не может разогнуться и отвестись — таранная сгибается подошвенно и инвертируется: головка вниз и внутрь, ладьевидная относительно неё вверх и наружу, свод уплощается', SH, m('pron'), { size: 16 });

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
