// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.

    infoCard(p, 800, 225, 760, 150, 'задняя большеберцовая', 'сильный супинатор и инвертор; держит медиальный свод; в нагружении контролирует и разворачивает пронацию', MU, m('tp'), { size: 16 });
    infoCard(p, 800, 390, 760, 150, 'сгибатели и малоберцовые', 'длинные сгибатели пальцев держат свод (против когтистых пальцев нужны собственные мышцы); малоберцовые пронируют, длинная держит поперечный и латеральный своды', MU, m('fl'), { size: 16 });
    infoCard(p, 800, 555, 760, 150, 'тыльные сгибатели и собственные', 'передняя большеберцовая (и инвертирует), длинные разгибатели, третья малоберцовая; собственные мышцы стопы держат своды при ходьбе', MU, m('df'), { size: 16 });
  }],

  ['q1', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-mus', prompt: ['Какая мышца это делает?'],
    build: grid([
      { parts: ['Держит медиальный свод, контролирует пронацию в нагружении'], ans: ['tp'], why: 'Задняя большеберцовая — сильный супинатор.' },
      { parts: ['Пронирует стопу, поддерживает поперечный свод'], ans: ['fb'], why: 'Длинная малоберцовая.' },

  }], done) }],

  ['gait', 'Голеностоп в шаге', (m, D) => {
    const p = panel(0);
    txt(p, 'голеностоп в цикле шага', 400, 56, m('rom'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    const ch = kChart(p, 70, 380, 660, 230, { xmax: 100, ticks: [[0, '0'], [12, '12'], [30, '30'], [60, '60'], [100, '100 %']], xlab: 'цикл шага', ylab: 'угол голеностопа' }, m('rom'));
    path(ch, `M70 ${f1(ch.Y(gY(0)))}H730`, { stroke: COL.dim, 'stroke-width': 1.5, 'stroke-dasharray': '5 5' });
    T(ch, '0°', { x: 60, y: ch.Y(gY(0)) + 5, size: 13, fill: COL.dim, anchor: 'end' });
    ch.curve(v => gY(GAIT_AN(v)), SH, '', 0, 0, m('rom', 1));
    T(ch, '≈ 7° тыльного', { x: ch.X(40), y: ch.Y(gY(7)) + 26, size: 14, fill: COL.task, weight: 700, anchor: 'middle' });
    T(ch, '25° подошвенного', { x: ch.X(60) + 8, y: ch.Y(gY(-25)) + 4, size: 14, fill: MU, weight: 700 });
    ch.band(0, 12, SH, 'нагружение', m('load'), 172);
    ch.band(12, 30, COL.good, 'опора', m('mid'), 172);
    ch.band(30, 60, MU, 'конец опоры', m('term'), 172);
    const dot = ch.dot(COL.task, m('rom', 1));
    const a = ankleSag(p, 150, 800, .62, m('rom', .5), { view: 'med', muscles: ['gast', 'sol', 'ta'], fade: 5 });
    prog(q => {
      const v = (q * 2 * 100) % 100, an = GAIT_AN(v);
      ch.at(dot, v, w => gY(GAIT_AN(w)));
      const arch = v < 12 ? -.6 * v / 12 : v < 30 ? -.6 : v < 60 ? lerp(-.6, .7, (v - 30) / 30) : lerp(.7, 0, clamp((v - 60) / 15, 0, 1));
      const mtp = v > 40 && v < 62 ? 40 * Math.sin(Math.PI * (v - 40) / 22) : 0;
      a.set({ df: an, arch, mtp });
    }, m('rom', 2), Math.max(4, D - m('rom') - 3), lin);
    pill(p, 'нагружение: пронация — податлива, гасит удар', 590, 650, m('load', 1), { col: SH, size: 14 });
    pill(p, 'голень над стопой, ротация внутрь', 590, 695, m('mid', .5), { col: COL.good, size: 14 });
    pill(p, 'конец опоры: супинация, лебёдка — жёсткий рычаг', 590, 740, m('term', 1), { col: MU, size: 14 });
    infoCard(p, 800, 90, 760, 120, 'объём в шаге', '32–35°: ≈ 7° тыльного сгибания в конце средней опоры и 25° подошвенного при отрыве пальцев', SH, m('rom'), { size: 16 });
    infoCard(p, 800, 225, 760, 150, 'нагружение', 'пятка встаёт нейтрально или в лёгкой супинации; стопа пронирует и становится свободной, вся нога ротируется внутрь', SH, m('load'), { size: 16 });
    infoCard(p, 800, 390, 760, 120, 'средняя опора', 'тыльное сгибание: голень проходит над стопой; ротация голени внутрь поддерживает пронацию', COL.good, m('mid'), { size: 16 });
    infoCard(p, 800, 525, 760, 180, 'конец опоры', 'голень ротируется наружу, задний отдел супинирует, поперечный сустав предплюсны замыкается; пальцы разгибаются — лебёдка; трёхглавая мышца толкает тело вперёд', MU, m('term'), { size: 16 });
  }],

  ['gmus', 'Мышцы в шаге', (m, D) => {
    const p = panel(0);
    txt(p, 'когда работают мышцы', 400, 56, m('dfm'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    const X = v => 250 + 4.8 * v, Y0 = 130;
    const ax = G(p, { o: 0 });
    path(ax, `M250 ${Y0 + 230}H730`, { stroke: COL.dim, 'stroke-width': 2 });
    [[0, '0'], [12, '12'], [40, '40'], [60, '60'], [100, '100 %']].forEach(([v, s0]) => { path(ax, `M${f1(X(v))} ${Y0 + 225}V${Y0 + 235}`, { stroke: COL.dim, 'stroke-width': 2 }); T(ax, s0, { x: X(v), y: Y0 + 255, size: 13, fill: COL.dim, anchor: 'middle' }); });
    put(pill(ax, 'схема', 690, Y0 - 16, null, { col: COL.dim, size: 13 }), { o: 1 });

    ROWS.forEach(([s0, mk0, bars], i) => {
      const g = G(p, { o: 0 }), y = Y0 + 20 + i * 42;
      T(g, s0, { x: 240, y: y + 16, size: 15, fill: COL.chalk, weight: 600, anchor: 'end' });
      bars.forEach(([a0, b0, conc]) => mk('rect', { x: X(a0), y, width: X(b0) - X(a0), height: 22, rx: 6, fill: conc ? MU : mix(MU, COL.board, .45), stroke: MU, 'stroke-width': 1.5 }, g));
      show(g, m(mk0));

    const lg = G(p, { o: 0 }); mk('rect', { x: 260, y: Y0 + 270, width: 26, height: 14, rx: 4, fill: mix(MU, COL.board, .45), stroke: MU }, lg); T(lg, 'уступающая', { x: 294, y: Y0 + 282, size: 13, fill: COL.dim }); mk('rect', { x: 420, y: Y0 + 270, width: 26, height: 14, rx: 4, fill: MU }, lg); T(lg, 'концентрическая / удержание', { x: 454, y: Y0 + 282, size: 13, fill: COL.dim });
    show(lg, m('dfm', 2));
    const cur = path(p, '', { stroke: COL.task, 'stroke-width': 3 }, { o: 0 }); show(cur, m('dfm', 1));
    const a = ankleSag(p, 120, 810, .56, m('dfm', .5), { view: 'med', muscles: ['gast', 'sol', 'ta', 'tp', 'abh'], fade: 5 });
    const b = ankleSag(p, 470, 810, .56, m('dfm', .5), { view: 'lat', muscles: ['gast', 'sol', 'ext', 'fibl'], fade: 5 });
    prog(q => {
      const v = (q * 3 * 100) % 100, an = GAIT_AN(v);
      cur.setAttribute('d', `M${f1(X(v))} ${Y0 + 10}V${Y0 + 232}`);
      [a, b].forEach(j => j.set({ df: an }));
      const dfA = v < 12 || v > 60 ? 1 : 0, pfA = v > 12 && v < 60 ? (v > 40 ? 1 : .5) : 0;
      a.M.ta.act(dfA); b.M.ext.act(dfA); [a, b].forEach(j => { j.M.gast.act(pfA); j.M.sol.act(pfA); });
      b.M.fibl.act(v > 40 && v < 60 ? 1 : 0); a.M.tp.act(v < 15 ? 1 : 0); a.M.abh.act(v > 10 && v < 60 ? .8 : 0);
    }, m('dfm', 2), Math.max(4, D - m('dfm') - 3), lin);
    infoCard(p, 800, 90, 760, 150, 'тыльные сгибатели', 'касание и нагружение — плавно опускают стопу; перенос — держат пальцы над полом. Без них — шлепок стопы и лишнее сгибание бедра и колена', MU, m('dfm'), { size: 16 });
    infoCard(p, 800, 255, 760, 150, 'подошвенные сгибатели', 'в начале опоры уступающе тормозят голень; около 40 % цикла — концентрический всплеск для отталкивания. Без них нет толчка', MU, m('pfm'), { size: 16 });
    infoCard(p, 800, 420, 760, 120, 'длинная малоберцовая', 'в конце опоры переносит вес на медиальный край и стабилизирует первый луч', SH, m('ev'), { size: 16 });
    infoCard(p, 800, 555, 760, 120, 'инверторы и собственные', 'передняя большеберцовая — пронация заднего отдела, задняя — медиального свода; собственные мышцы держат своды', COL.good, m('inv'), { size: 16 });
  }],

  ['nerve', 'Нервы и отражённая боль', (m, D) => {
    const p = panel(0);
    txt(p, 'где сдавливаются нервы', 400, 56, m('src'), { size: 26, weight: 700, anchor: 'middle', fill: SH });

    infoCard(p, 800, 315, 760, 120, 'большеберцовый нерв', 'тарзальный канал позади медиальной лодыжки: синдром тарзального канала', '#ffe14d', m('tt'), { size: 16 });
    infoCard(p, 800, 450, 760, 175, 'подошвенные и пяточные ветви', 'ущемляются в отверстиях мышцы, отводящей большой палец; избыточная пронация прижимает их: болезненность заднемедиального края подошвы, боль в пятке, боль при полой стопе', '#ffe14d', m('pl'), { size: 16 });
    infoCard(p, 800, 640, 760, 120, 'сегменты', 'корешки L4, L5, S1 через ветви малоберцового и большеберцового нервов; боль может быть отражённой', SH, m('seg'), { size: 16 });
  }],

    [['Пронация идёт с внутренней ротацией голени, супинация — с наружной. Своды держит пружинящая связка; разгибание пальцев натягивает апоневроз.', 'w1'],
     ['Задняя большеберцовая держит медиальный свод, малоберцовые пронируют, камбаловидная уравновешивает стояние.', 'w2'],
     ['В шаге ≈ 7° тыльного и 25° подошвенного сгибания: стопа сначала податлива, потом — жёсткий рычаг.', 'w3'],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-gt1', prompt: ['После травмы нерва стопа шлёпает при касании пяткой, а в переносе человек высоко поднимает колено. Какие мышцы не работают?'],
    build: choice([
      ['Тыльные сгибатели'],
      ['Подошвенные сгибатели'],
      ['Малоберцовые'],
      ['Собственные мышцы стопы'],

    [null, 'Без них нет толчка в конце опоры, а не шлепка.', 'Они переносят вес на медиальный край.', 'Они держат своды, но не поднимают стопу.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-gt2', prompt: ['У бегуньи с избыточной пронацией жжение и болезненность у заднемедиального края подошвы. О чём подумать?'],
    build: choice([
      ['Сдавление подошвенных ветвей большеберцового нерва у мышцы, отводящей большой палец'],
      ['Сдавление общего малоберцового нерва у шейки малоберцовой'],
      ['Корешок L4 — это всегда спина'],
      ['Разрыв ахиллова сухожилия'],
    ], 0, 'Избыточная пронация прижимает подошвенные ветви к отверстиям мышцы, отводящей большой палец.',
    [null, 'Это латеральная сторона голени.', 'Отражённая боль возможна, но признаки указывают на подошвенные ветви.', 'Разрыв даёт слабость подошвенного сгибания, а не такие симптомы.']),

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
