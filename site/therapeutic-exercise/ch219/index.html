      ['Примерно к шести неделям, сначала в фиксаторе'],
      ['Сразу, без фиксатора'],
      ['Не раньше шести месяцев'],
      ['Только после двенадцати недель без нагрузки'],
    ], 0, 'Рекомендации разные, но полной нагрузки обычно достигают к 6 неделям; позже — при сращении синдесмоза или фиксации лодыжки.',
    [null, 'Нагрузку начинают в фиксаторе.', 'Так долго не ждут без причин.', 'Это слишком долго для эндопротеза без добавок.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-taa2', prompt: ['После эндопротеза голеностопа пациентка 58 лет, раньше бегавшая, спрашивает, чем заниматься. Что ответить?'],
    build: choice([
      ['Плавание, велосипед, ходьба; бег и игры на площадке не рекомендуются'],
      ['Бег трусцой — если не больно'],
      ['Баскетбол — для ловкости'],
      ['Плиометрика — для силы'],
    ], 0, 'Малоударные виды можно всем; бег, ударное и прыжки не рекомендуются.',
    [null, 'Бег — в списке не рекомендуемых.', 'Игры на площадке не рекомендуются.', 'Плиометрика считается неподходящей.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
