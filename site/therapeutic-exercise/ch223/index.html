    pill(s1, 'Кокрейн: к спорту — одинаково; повторных меньше после операции', 400, 120, m('acute', 1), { col: SH, size: 13 });
    txt(s1, 'солдаты-срочники, через 14 лет', 400, 200, m('acute', 12), { size: 17, fill: COL.task, weight: 700, anchor: 'middle' });
    tbl(s1, 30, 225, [300, 220, 220], ['', 'шов', 'функциональное'], [['повторные травмы', '1 из 15', '7 из 18'], ['признаки артроза', '4 из 15', '1 из 18']], [m('acute', 18), m('acute', 24)], { size: 15 });
    pill(s1, 'операция: меньше растяжений, но, возможно, больше артроза', 400, 380, m('acute', 29), { col: COL.task, size: 14 });
    pill(s1, 'хроническая: де Фрис — лучшей методики нет', 400, 460, m('chr', 1), { col: COL.dim, size: 14 });
    pill(s1, 'до — нервно-мышечная тренировка; после — рано двигаться', 400, 505, m('chr', 7), { col: COL.good, size: 14 });
    hide(s1, m('dr'), .4);
    const s2 = G(p, {});
    txt(s2, 'Крипс: 77 спортсменов, 2–10 лет', 400, 130, m('dr', 1), { size: 18, fill: COL.task, weight: 700, anchor: 'middle' });
    txtBars(s2, 20, 190, [['меньше тыльного: пластика', 42, '15 из 36', GRAFT_C], ['меньше тыльного: шов', 7, '3 из 41', COL.good], ['хорошо и отлично: шов', 88, '88 %', COL.good], ['хорошо и отлично: пластика', 58, '58 %', GRAFT_C]], [m('dr', 6), m('dr', 9), m('dr', 13), m('dr', 15)], { k: 3.6, w0: 260, size: 14, dy: 42 });
    pill(s2, 'анатомические пластики сокращают разницу', 400, 380, m('dr', 18), { col: SH, size: 14 });
    txt(s2, '42 профи после острого шова', 400, 450, m('sport', 1), { size: 17, fill: COL.task, weight: 700, anchor: 'middle' });
    txtBars(s2, 20, 490, [['к тренировкам', 63, '63 дня', SH], ['к полноценному спорту', 77, '77 дней', COL.good]], [m('sport', 4), m('sport', 6)], { k: 4, w0: 220, size: 14, dy: 40 });
    txt(s2, 'Маффулли, 9 лет:', 40, 620, m('sport', 11), { size: 16, fill: COL.task, weight: 700 });
    { const g = G(s2, { o: 0 }); let x0 = 40; [[58, 'прежний уровень', COL.good], [16, 'ниже', COL.task], [26, 'бросили', COL.bad]].forEach(([v, s0, c]) => { mk('rect', { x: x0, y: 640, width: v * 7, height: 30, fill: c, 'fill-opacity': .8 }, g); T(g, `${v} %`, { x: x0 + v * 3.5, y: 661, size: 14, fill: COL.board, weight: 700, anchor: 'middle' }); T(g, s0, { x: x0 + v * 3.5, y: 695, size: 14, fill: c, weight: 700, anchor: 'middle' }); x0 += v * 7; }); show(g, m('sport', 12)); }
    txt(s2, 'хорошо и отлично — 76 %', 40, 750, m('sport', 18), { size: 16, fill: COL.good, weight: 700 });
    infoCard(p, 800, 90, 760, 175, 'острый разрыв', 'к спорту — одинаково; после операции меньше повторных растяжений, но, возможно, больше артроза (солдаты: 1/15 против 7/18; артроз 4/15 и 1/18)', SH, m('acute'), { size: 16 });
    infoCard(p, 800, 280, 760, 150, 'хроническая', 'лучшей методики не найдено; до операции — нервно-мышечная тренировка, после — ранние движения и нагрузка', COL.good, m('chr'), { size: 16 });
    infoCard(p, 800, 445, 760, 150, 'шов или пластика', 'после старых пластик чаще меньше тыльного сгибания и хуже функция; анатомические сокращают разницу', GRAFT_C, m('dr'), { size: 16 });
    infoCard(p, 800, 610, 760, 150, 'спорт', '42 профи: тренировки через 63 дня, спорт через 77; Маффулли: 58 % — на прежнем уровне, 76 % — хорошо и отлично', COL.task, m('sport'), { size: 16 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-rts', prompt: ['Это говорит за готовность к спорту?'],
    build: grid([
      { parts: ['Сила малоберцовых — как на здоровой стороне'], ans: ['y'], why: 'Да.' },
      { parts: ['Прыжковые тесты — 70 % здоровой стороны'], ans: ['n'], why: 'Нужно не меньше 90 %.' },
      { parts: ['Положительный симптом переднего выдвижения'], ans: ['n'], why: 'Нестабильности быть не должно.' },
      { parts: ['Нормальная ходьба по неровному и лестнице, сила ≥ 90 %'], ans: ['y'], why: 'Да.' },
      { parts: ['Пациент не уверен в голеностопе'], ans: ['n'], why: 'Ощущение готовности тоже критерий.' },
    ], [['y', 'Да', COL.good], ['n', 'Нет', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Нестабильность — механическая и функциональная; оперируют при хронической после неудачного лечения или при остром разрыве III степени у части спортсменов.', 'w1'],
     ['Шов по Брострёму — Гулду с удерживателем разгибателей — выбор; пластика сухожилием — при плохой ткани, большом весе, повторной операции.', 'w2'],
     ['2–6 нед. иммобилизации, затем ортез и дуга 10–15°; полная нагрузка через 6–12 нед.; главное — сила эверторов.', 'w3'],
     ['Спорт через 3–4 месяца: малоберцовые как на здоровой, нет нестабильности, прыжковые тесты ≥ 90 %.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-bg1', prompt: ['Три недели после шва по Брострёму — Гулду, нога в фиксаторе. Что уместно?'],
    build: choice([
      ['Изометрия в нейтрали, движения пальцев, упражнения для бедра и колена, ходьба с разрешённой нагрузкой'],
      ['Скачки на одной ноге'],
      ['Растяжение в конечную инверсию'],
      ['Бег по неровному'],
    ], 0, 'Это фаза максимальной защиты: защищают шов, работают изометрией и соседними сегментами.',
    [null, 'Плиометрика — только при устойчивом голеностопе и 25 подъёмах на носок.', 'Конечную инверсию избегают — она натягивает шов.', 'Это поздний этап.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-bg2', prompt: ['Волейболист после операции, раньше не раз растягивал голеностоп. Что снизит риск повторной травмы в сезоне?'],
    build: choice([
      ['Тренировка равновесия весь сезон и ортез'],
      ['Только силовые для бедра'],
      ['Отказ от разминки'],
      ['Ничего: после операции риска нет'],
    ], 0, 'У тех, кто уже растягивал голеностоп, тренировка равновесия снижает число растяжений; ортез дополнительно защищает.',
    [null, 'Нужна работа с голеностопом и равновесием.', 'Разминка снижает риск.', 'Риск повторной травмы остаётся.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
