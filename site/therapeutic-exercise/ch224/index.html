    infoCard(p, 800, 305, 760, 100, 'подсказка', 'выносливость отстаёт минимум год — тренируют и её', COL.bad, m('tip'), { size: 16 });
    infoCard(p, 800, 420, 760, 150, 'минимальная (12–16 нед.)', 'уступающая работа, лестница, плиометрика, дорожка в гору; затем бег, ловкость, спорт через 4–6 мес.', COL.good, m('min'), { size: 16 });
  }],

  ['out', 'Результаты', (m, D) => {
    const p = panel(0);
    txt(p, 'результаты', 400, 56, m('best'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    pill(p, 'первичный шов лучше отсроченного; задержка до 30 дней не вредит', 400, 120, m('best', 2), { col: COL.good, size: 13 });
    pill(p, 'повторный разрыв ≈ 3 %; выше всего у активных до 30 лет', 400, 165, m('best', 9), { col: COL.bad, size: 14 });
    tbl(p, 30, 210, [360, 380], ['метаанализ 10 РКИ', 'при функциональной реабилитации'], [['повторные разрывы', 'одинаково'], ['другие осложнения', 'больше после операции'], ['возврат к работе', 'после операции на 19 дней раньше'], ['объём, сила, функция', 'без значимой разницы']], [m('meta', 4), m('meta', 7), m('meta', 10), m('meta', 13)], { size: 15 });
    txtBars(p, 20, 480, [['боль, слабость через 1–5 лет', 30, '> 30 %', COL.bad], ['профи на прежнем уровне', 70, '61–78 %', COL.task]], [m('imp', 1), m('imp', 7)], { k: 4, w0: 260, size: 14 });
    txtBars(p, 20, 600, [['осложнения: открытый', 14, '14 %', COL.bad], ['малоинвазивный', 6, '6 %', COL.good]], [m('mi', 4), m('mi', 6)], { k: 14, w0: 260, size: 14 });
    pill(p, 'малоинвазивный: чаще страдает нерв, но быстрее на работу', 400, 710, m('mi', 9), { col: SH, size: 13 });
    pill(p, 'итог: ранняя нагрузка и ранние движения — стандарт', 400, 790, m('sum', 1), { col: COL.good, size: 16 });
    infoCard(p, 800, 90, 760, 150, 'идеал', 'возврат к прежней активности без боли и повторного разрыва; первичный шов лучше отсроченного', COL.good, m('best'), { size: 16 });
    infoCard(p, 800, 255, 760, 175, 'операция или нет', 'при функциональной реабилитации повторных разрывов поровну; после операции больше других осложнений, но раньше на работу; спортсменам чаще советуют шов', COL.task, m('meta'), { size: 16 });
    infoCard(p, 800, 445, 760, 120, 'последствия', '> 30 % — боль, слабость или ограничение; хуже исход у старших', COL.bad, m('imp'), { size: 16 });
    infoCard(p, 800, 580, 760, 120, 'открытый или малоинвазивный', 'исходы сопоставимы; по цене и рискам выигрывает малоинвазивный', SH, m('mi'), { size: 16 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-ach', prompt: ['Когда это разрешают после шва ахиллова?'],
    build: grid([
      { parts: ['Тыльное сгибание до +10° за нейтраль'], ans: ['a'], why: 'К 6–8 неделям.' },
      { parts: ['Подъёмы на носок на одной оперированной ноге'], ans: ['b'], why: 'С 10–12 недель.' },
      { parts: ['Плиометрика на суше'], ans: ['c'], why: 'После 12 недель.' },
      { parts: ['Возвращение к спорту'], ans: ['d'], why: 'Через 4–6 месяцев.' },
    ], [['a', '6–8 нед.', SH], ['b', '10–12 нед.', COL.task], ['c', '> 12 нед.', COL.good], ['d', '4–6 мес.', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Сухожилие рвётся в 3–4 см выше пятки; разрыв подтверждают проба Томпсона, меньший угол покоя и дефект.', 'w1'],
     ['При ранней функциональной реабилитации операция и консервативное лечение сходны; после операции раньше на работу, но больше осложнений.', 'w2'],
     ['Упор ортеза −20°, −10°, 0°, +10°; подпяточники к 7-й неделе; тыльное не дальше +10° до 8 недель.', 'w3'],
     ['Носки на одной ноге — с 10–12 недель, плиометрика на суше — после 12, спорт — через 4–6 месяцев.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-at1', prompt: ['Пять недель после шва ахиллова: полная нагрузка в ортезе с упором 0°. Пациент хочет растягиваться стоя на одной ноге с пяткой за краем ступеньки. Ваш ответ?'],
    build: choice([
      ['Пока нет: стоя — только на двух ногах на клине до 10°, с пяткой за краем — примерно с 12 недель'],
      ['Да, растяжение ускорит восстановление'],
      ['Да, если не больно'],
      ['Растягиваться вообще нельзя до года'],
    ], 0, 'Блок 22.7: трёхглавую нагружают очень постепенно; на одной ноге и с пяткой за краем — около 12 недель.',
    [null, 'Ранняя сильная растяжка грозит удлинением сухожилия.', 'Отсутствие боли не защищает шов от растяжения.', 'Растяжение нужно, но постепенно.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-at2', prompt: ['Через 14 недель после шва: ходит без боли и опоры, тыльное сгибание больше, чем на здоровой ноге, 5 подъёмов на носок на одной ноге — на 70 % высоты. Можно ли начинать плиометрику на суше?'],
    build: choice([
      ['Нет: избыточное тыльное говорит об удлинении, а подъёмы ниже 90 %'],
      ['Да, все критерии выполнены'],
      ['Да, срок больше 12 недель — этого достаточно'],
      ['Нет, плиометрика запрещена навсегда'],
    ], 0, 'Нужны нормальное (не избыточное) тыльное сгибание и 5 подъёмов на одной ноге не ниже 90 % высоты.',
    [null, 'Два критерия не выполнены.', 'Срок — не единственный критерий.', 'Плиометрику начинают, когда критерии выполнены.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
