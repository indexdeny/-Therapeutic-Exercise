/* ---------- exercise helpers (chapters 17–18) ---------- */
// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.
function fsReach(f, side, X, Y, flip = false) {

// the flexion range a contracted capsule allows: [extension limit, flexion limit], scanned on the model
function capRange(j) {
  let lo = 0, hi = 145;
  for (let a = 0; a <= 145; a++) { j.set({ flex: a }); if (j.capA.tension < .97) { lo = a; break; } }
  for (let a = 145; a >= 0; a--) { j.set({ flex: a }); if (j.capP.tension < .97) { hi = a; break; } }
  return [lo, hi];
}
// a hinged elbow brace on an elbowSag model (bars, straps, the hinge); block — the extension stop in degrees
function hingeBrace(p, j, t0, block = null) {
  const g = G(p, { o: 0 }), col = '#9fb0bf', sw = 11 * st(j.g).s / .7;
  const bar1 = path(g, '', { stroke: col, 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-opacity': .9 });
  const bar2 = path(g, '', { stroke: col, 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-opacity': .9 });
  const straps = [0, 1, 2, 3].map(() => path(g, '', { stroke: '#6fa8c8', 'stroke-width': sw * 1.1, 'stroke-linecap': 'round', 'stroke-opacity': .75 }));
  const hinge = mk('circle', { r: sw * 1.3, fill: '#6f7f8c', stroke: '#2b343a', 'stroke-width': 2 }, g);
  const stop = block !== null ? path(g, '', { stroke: COL.bad, 'stroke-width': sw * .9, 'stroke-linecap': 'round' }) : null;
  const seg = (A, B) => `M${f1(A[0])} ${f1(A[1])}L${f1(B[0])} ${f1(B[1])}`;

    hinge.setAttribute('cx', f1(C[0])); hinge.setAttribute('cy', f1(C[1]));
    if (stop) { const r = rad(st(j.g).r || 0), P = polar(C, 60 * st(j.g).s / .7, 90 - block + (st(j.g).r || 0)), Q = polar(C, 90 * st(j.g).s / .7, 90 - block + (st(j.g).r || 0)); stop.setAttribute('d', seg(P, Q)); }

/* ---------- chapter 18 helpers: a phase strip ---------- */

// Each phase gets its own row; they appear one by one (t0 + i * gap, or t0[i] if an array).

  ticks.forEach(([v, s0]) => { path(g, `M${f1(X(v))} ${y - 6}V${y + 6}`, { stroke: COL.dim, 'stroke-width': 2 }); T(g, s0, { x: X(v), y: y + 26, size: 14, fill: COL.dim, anchor: 'middle' }); });
  if (t0 !== null) show(g, Array.isArray(t0) ? t0[0] : t0);
  const els = rows.map(([s0, a, b, c], i) => {
    const r = G(p, { o: 0 }), yy = y - 26 - (rows.length - 1 - i) * dy;
    mk('rect', { x: X(a), y: yy - 12, width: Math.max(4, X(b) - X(a)), height: 22, rx: 8, fill: c, 'fill-opacity': .85 }, r);
    const fits = uiW(s0, size) + 16 <= X(b) - X(a);

    if (t0 !== null) show(r, Array.isArray(t0) ? t0[i] : t0 + i * gap);

}

    markList(s2, 40, 165, [['6 нед. длинный гипс, 4 — короткий', COL.task], ['стопа тугая, голень атрофирована', COL.bad], ['малоберцовая не скользит', COL.bad]], m('sandy', 3), 4, { size: 15, dy: 42, maxW: 720 });
    const r = ankleRear(s2, 300, 760, .8, m('sandy', 12), { muscles: ['gast', 'sol'], fade: 6 });
    lab(s2, 'межберцовые суставы', 480, 440, ...r.at('syn'), COL.bad, m('sandy', 13), { size: 15 });
    hide(s2, m('ron'), .4);
    const s3 = G(p, {});
    txt(s3, 'Рон, 35: баскетбол, II степень', 40, 120, m('ron', 1), { size: 19, fill: COL.task, weight: 700 });
    markList(s3, 40, 165, [['отёк, синяк', COL.bad], ['боль при инверсии и подошвенном', COL.bad], ['переднее выдвижение, пальпация', COL.bad]], m('ron', 6), 3, { size: 15, dy: 42, maxW: 720 });
    const b = ankleSag(s3, 260, 690, .9, m('ron', 6), { view: 'lat', muscles: ['fib'], fade: 6 }); b.L.atf.torn = .6; b.set({});
    painSpot(s3, b.at('atf'), m('ron', 7));
    hide(s3, m('jamaal'), .4);
    const s4 = G(p, {});
    txt(s4, 'Джамаль, 43: ахиллово, открытый шов', 40, 120, m('jamaal', 1), { size: 19, fill: COL.task, weight: 700 });
    markList(s4, 40, 165, [['2 нед. гипс в подошвенном', COL.task], ['теперь ортез, частичная нагрузка', COL.task], ['ортез снимают для упражнений', COL.good]], m('jamaal', 5), 3, { cross: false, size: 15, dy: 42, maxW: 720 });
    const c = ankleSag(s4, 260, 700, .9, m('jamaal', 5), { view: 'lat', muscles: ['gast', 'sol'], fade: 6 }); c.ach('repair', null); c.set({ df: -10 });
    bootEl(c, s4, m('jamaal', 9), { stop: -10 });
    NOTE(p, 1180, 860, m('carl', 20));
    infoCard(p, 800, 90, 760, 150, 'Карл — по материалу главы', 'мягкая мобилизация и растяжение, обувь и стельки, сила и выносливость; без ударных нагрузок', COL.good, m('carl', 20), { size: 16 });
    infoCard(p, 800, 255, 760, 150, 'Сэнди — по материалу главы', 'активная мобилизация, включая межберцовые суставы, растяжение, постепенная нагрузка', SH, m('sandy', 16), { size: 16 });
    infoCard(p, 800, 420, 760, 150, 'Рон — по материалу главы', 'защита, ранние упражнения, равновесие, критерии возвращения, ортез или тейп', COL.task, m('ron', 15), { size: 16 });
    infoCard(p, 800, 585, 760, 150, 'Джамаль — по материалу главы', 'ранняя нагрузка и движения по фазам с предосторожностями шва ахиллова, затем подготовка к теннису', COL.bad, m('jamaal', 13), { size: 16 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-case', prompt: ['Какой это случай?'],
    build: grid([
      { parts: ['Пронация, молоткообразные пальцы, не встаёт на носки'], ans: ['c'], why: 'Карл, ревматоидный артрит.' },
      { parts: ['После 10 недель гипса малоберцовая не скользит'], ans: ['s'], why: 'Сэнди, перелом голени.' },
      { parts: ['Боль при инверсии и переднем выдвижении после приземления на чужую стопу'], ans: ['r'], why: 'Рон, растяжение II степени.' },
      { parts: ['Ортез в подошвенном сгибании после шва, частичная нагрузка'], ans: ['j'], why: 'Джамаль, шов ахиллова.' },
    ], [['c', 'Карл', COL.good], ['s', 'Сэнди', SH], ['r', 'Рон', COL.task], ['j', 'Джамаль', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Закрытую цепь начинают с разгрузки и идут от двух ног к одной, от твёрдой опоры к неустойчивой, от предупреждённых толчков к неожиданным.', 'w1'],
     ['Подъёмы на носки, затем с грузом и прыжки; уступающее опускание пятки — без концентрической работы больной ноги.', 'w2'],
     ['Лента на здоровой ноге: шаг вперёд — тыльные сгибатели опорной, шаг назад — подошвенные.', 'w3'],
     ['Функциональная прогрессия охватывает всё тело: выносливость, равновесие, ловкость и навыки.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-cc1', prompt: ['У бегуна тендинопатия средней части ахиллова сухожилия. Какое упражнение особенно полезно?'],
    build: choice([
      ['Уступающее опускание пятки больной ноги, поднимаясь на здоровой'],
      ['Только быстрые подъёмы на носки на двух ногах'],
      ['Скачки на одной ноге с первого дня'],
      ['Полный покой до исчезновения боли'],
    ], 0, 'Тренировка с упором на уступающую работу подошвенных сгибателей уменьшает боль и улучшает функцию при тендинопатии средней части.',
    [null, 'Концентрическая работа не даёт того же эффекта.', 'Плиометрика — поздний этап.', 'Покой не тренирует сухожилие.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-cc2', prompt: ['Пациент уверенно стоит на больной ноге на ровном полу с предупреждёнными толчками. Как усложнить?'],
    build: choice([
      ['Неустойчивая опора, неожиданные и более сильные толчки, затем глаза закрыты'],
      ['Вернуться к стойке на двух ногах'],
      ['Убрать толчки совсем'],
      ['Перейти к упражнениям только сидя'],
    ], 0, 'Прогрессия: от твёрдой опоры к неустойчивой, от предупреждённых толчков к неожиданным, быстрее и сильнее, затем с закрытыми глазами.',
    [null, 'Это шаг назад.', 'Без помех стабилизаторы не тренируются.', 'Нужна именно закрытая цепь.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
