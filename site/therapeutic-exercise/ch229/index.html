/* ---------- exercise helpers (chapters 17–18) ---------- */
// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.
function fsReach(f, side, X, Y, flip = false) {

// A supine bridge: shoulders on the floor at Sh0, feet at A0 (stage); lift 0..1 raises the pelvis by up to rise px.
function bridgeSet(f, Sh0, A0, rise, { oneLeg = false, footDir = null } = {}) {
  return (lift, liftLeg = 0) => {

// High kneeling (both knees on the floor at Kx, gy) with a forward/backward lean (deg, + forward) about the knees.
function kneelSet(f, Kx, gy, { half = false } = {}) {
  return (lean = 0, sink = 0) => {
    const K = [Kx, gy - 10 * f.s], u = rad(lean), H = [K[0] + Math.sin(u) * RIG.th * f.s * f.dir * (1 - sink * .3), K[1] - Math.cos(u) * RIG.th * f.s * (1 - sink * .3)];

  };
}
// Standing with the ankles at the given stage points (near, far) and the hip at H; feet flat.
function standSet(f, AN, AF) {

    prog(q => { const u = cyc(q, 3); fs.set({ liftR: lerp(0, 65, u), abR: lerp(28, -12, u), eL: lerp(10, 120, 1 - u), aL: 14 }); fs.mus.medL && fs.mus.medL.act && fs.mus.medL.act(.7); }, m('pnf', 1), Math.max(3, m('more') - m('pnf') - 1), lin);
    lab(s3, 'D1: сгибание-приведение ↔ разгибание-отведение', 440, 330, ...fs.at(fs.pts.legs[1][0]), COL.task, m('pnf', 2), { size: 14 });
    lab(s3, 'противоположный локоть с гантелью', 440, 420, ...fs.at(fs.pts.arms[0][1]), SH, m('pnf', 8), { size: 14 });
    hide(s3, m('more'), .4);
    const s4 = scn(p, m('more'));
    floorAt(s4, 40, 760, 840, m('more'));
    const g = fig(s4, { s: 1.35 }); const N = figMus(g, ['glutMax', 'hamstrings', 'parasp', 'deltA']); const sg = standSet(g, [300, 834], [200, 760]);
    sg([280, 834 - 178 * 1.35]);
    prog(q => { const e = Math.min(1, q * 3); figTrunk(g, [280 - 30 * e, 834 - lerp(178, 160, e) * 1.35], [280 - 30 * e + 100 * Math.sin(rad(70 * e)), 834 - lerp(178, 160, e) * 1.35 - 100 * Math.cos(rad(70 * e))]); figLegIK(g, 'N', [300, 834]); g.set({ hF: lerp(0, 70 * e - 100 * e, 1), kF: 5, fF: 10, aN: 70 * e + 90, aF: 70 * e + 90, eN: 0, eF: 0 }); musAct(N, ['glutMax', 'hamstrings', 'parasp'], e); if (q > .5) { const w = (q - .5) * 2; g.set({ aN: 160 + 100 * Math.sin(w * Math.PI * 4), aF: 160 - 100 * Math.sin(w * Math.PI * 4) }); musAct(N, ['deltA'], .8); } }, m('more', 14), Math.max(3, m('unst') - m('more') - 15), lin);
    pill(s4, 'ходьба боком, «косичка»; полуприсед с поворотом за предметом', 400, 120, m('more', 1), { col: SH, size: 13 });
    pill(s4, 'конькобежец: наклон в бёдрах, нога назад; мельница руками', 400, 165, m('more', 14), { col: COL.good, size: 13 });
    hide(s4, m('unst'), .4);
    const s5 = scn(p, m('unst'));
    floorAt(s5, 40, 760, 840, m('unst'));
    const bo = bosuEl(s5, 270, 840, 280, m('unst'), { flat: true });
    const h = fig(s5, { s: 1.3 }); const K = figMus(h, ['glutMax', 'gastroc', 'tibAnt', 'abdom', 'iliopsoas']); const sh = standSet(h, [276, bo.top - 2], [250, bo.top - 60]);
    sh([262, bo.top - 182 * 1.3 + 4]);
    prog(q => { const k = Math.sin(q * Math.PI * 6); sh([262 + 4 * k, bo.top - 182 * 1.3 + 4]); h.set({ hF: 35 * k, kF: 10, fF: 0 }); musAct(K, ['iliopsoas'], Math.max(0, k)); musAct(K, ['glutMax', 'gastroc', 'tibAnt'], .6 + .3 * Math.abs(k)); }, m('unst', 6), Math.max(3, D - m('unst') - 7), lin);
    pill(s5, 'полусфера — круглой, потом плоской стороной; доска, диск', 400, 120, m('unst', 1), { col: SH, size: 13 });
    pill(s5, 'толчки или лента; махи ногой — всё быстрее', 400, 165, m('unst', 6), { col: COL.task, size: 14 });
    infoCard(p, 800, 90, 760, 120, 'руки', 'диагонали с гантелями или лентой, одной или двумя руками; угол тяги меняет задачу', SH, m('arms'), { size: 16 });
    infoCard(p, 800, 225, 760, 120, 'звёздочка', 'стопа в центре, другой коснуться каждой линии: вперёд, вбок, назад, скрестно позади', COL.good, m('star'), { size: 16 });
    infoCard(p, 800, 360, 760, 175, 'ещё', 'D1 ногой с локтем; ходьба боком и «косичка»; полуприсед за предметом; конькобежец и мельница', COL.task, m('pnf'), { size: 16 });
    infoCard(p, 800, 550, 760, 120, 'неустойчивая опора', 'полусфера, доска, диск: толчки, лента, махи ногой', COL.bad, m('unst'), { size: 16 });
  }],

  ['plant', 'Двигайся и замри', (m, D) => {
    const p = panel(0);
    txt(p, '«двигайся и замри»', 400, 56, m('why'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    pill(p, 'остановить тело — быстрая реакция равновесия', 400, 120, m('why', 1), { col: COL.good, size: 15 });
    pill(p, 'готовит к смене направления и ловкости', 400, 165, m('why', 5), { col: SH, size: 15 });
    const s1 = scn(p, m('why', 2));
    floorAt(s1, 40, 760, 840, m('why', 2));
    const pb = platBox(s1, 80, 260, 90, 840, m('why', 2));
    const f = fig(s1, { s: 1.25 }); const M = figMus(f, ['glutMax', 'quads', 'gastroc', 'hamstrings']);
    put(f.g, { x: 170, y: pb.top - 182 * 1.25 });
    prog(q => { if (q < .55) { const a = q / .55; f.set({ ...STAND, aN: 40, aF: 40, hN: 20 * Math.sin(a * Math.PI), kN: 30 * Math.sin(a * Math.PI), hF: 20 * Math.sin(a * Math.PI), kF: 30 * Math.sin(a * Math.PI) }); put(f.g, { x: lerp(170, 420, a), y: lerp(pb.top, 840, a) - 182 * 1.25 - 60 * Math.sin(a * Math.PI) }); musAct(M, ['glutMax', 'quads', 'gastroc'], .3); }
      else { f.set({ ...SQUAT, t: 25, aN: 70, aF: 70 }); put(f.g, { x: 420, y: 840 - 140 * 1.25 }); musAct(M, ['glutMax', 'quads', 'gastroc'], 1); } }, m('jump', 1), 3, lin);
    const fr = txt(s1, '«Замри!»', 600, 380, m('jump', 4), { size: 26, fill: COL.bad, weight: 700, anchor: 'middle' }); void fr;
    pill(s1, 'потом — запрыгнуть; затем скачок на одной ноге', 400, 210, m('jump', 7), { col: COL.task, size: 14 });
    hide(s1, m('shuf'), .4);
    const s2 = scn(p, m('shuf'));
    floorAt(s2, 40, 760, 840, m('shuf'));
    const fs = frontStand(s2, 220, 840, 1.4, m('shuf'), { muscles: true });
    prog(q => { const ph = Math.min(1, q * 2.2), k = Math.sin(ph * Math.PI * 3); put(fs.g, { x: 220 + 300 * Math.min(1, q * 2.2) }); fs.set({ w: 22 + 18 * Math.abs(k), drop: 14, shift: 0 }); }, m('shuf', 1), 3, lin);
    txt(s2, '«Замри!»', 200, 330, m('shuf', 4), { size: 26, fill: COL.bad, weight: 700, anchor: 'middle' });
    pill(s2, 'два-три приставных шага — удержать — обратно', 400, 210, m('shuf', 1), { col: COL.good, size: 14 });
    hide(s2, m('run'), .4);
    const s3 = scn(p, m('run'));
    floorAt(s3, 40, 760, 840, m('run'));
    const g = fig(s3, { x: 120, y: 840 - 182 * 1.25, s: 1.25 }); const N = figMus(g, ['glutMax', 'quads', 'hamstrings', 'gastroc']);
    walk(g, m('run', 1), 2.4, { cycles: 3, dx: 330, running: true });
    prog(q => { g.set({ ...STAND, t: -8, hN: 30, kN: 40, fN: 10, hF: -5, kF: 20, fF: 5, aN: 40, aF: -20 }); put(g.g, { y: 840 - 172 * 1.25 }); musAct(N, ['quads', 'hamstrings', 'gastroc'], .9); }, m('run', 3.5), .4, lin);
    txt(s3, '«Замри!» — по команде или свистку', 560, 400, m('run', 3.5), { size: 20, fill: COL.bad, weight: 700, anchor: 'middle' });
    pill(s3, 'бег вперёд, боком, спиной — и остановка', 400, 210, m('run', 1), { col: COL.task, size: 14 });
    infoCard(p, 800, 90, 760, 120, 'зачем', 'остановить тело и не упасть; основа резких смен направления и ловкости', COL.good, m('why'), { size: 16 });
    infoCard(p, 800, 225, 760, 150, 'прыжок и «замри»', 'спрыгнуть с платформы и удержать; затем запрыгнуть; при контроле на одной ноге — скачок на ступеньку и с неё', COL.task, m('jump'), { size: 16 });
    infoCard(p, 800, 390, 760, 150, 'приставные шаги', 'два-три шага, удержать, обратно; по диагонали и по дуге со сменой направления', SH, m('shuf'), { size: 16 });
    infoCard(p, 800, 555, 760, 100, 'бег и «замри»', 'вперёд, боком, спиной — остановка по команде', COL.bad, m('run'), { size: 16 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-harder', prompt: ['Это усложнение упражнения?'],
    build: grid([
      { parts: ['Полусфера: перейти с круглой стороны на плоскую'], ans: ['y'], why: 'Да — так прогрессирует глава.' },
      { parts: ['Перейти от неожиданных толчков к ожидаемым'], ans: ['n'], why: 'Нет — это облегчение.' },
      { parts: ['Ловить утяжелённый мяч вместо обычного'], ans: ['y'], why: 'Да.' },
      { parts: ['Встать с одной ноги на две'], ans: ['n'], why: 'Нет — опора шире.' },
    ], [['y', 'Усложнение', COL.good], ['n', 'Облегчение', COL.bad]], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Сидя и на коленях — неустойчивая опора, движения рук, лента, мяч и толчки.', 'w1'],
     ['На двух ногах — от устойчивой опоры к тандему, бревну и доскам; позвоночник нейтрален, поворот — в бёдрах.', 'w2'],
     ['На одной ноге — диагонали рук, звёздочка, D1 ногой, «косичка», конькобежец и мельница, затем полусфера и толчки.', 'w3'],
     ['«Двигайся и замри» — прыжок, приставные шаги и бег с остановкой — готовят к смене направления и ловкости.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-bl1', prompt: ['Пациент уверенно стоит на одной ноге на полу и делает диагонали руками с лентой. Как продолжить?'],
    build: choice([
      ['Перейти на неустойчивую опору — полусфера, доска, диск — и добавить толчки'],
      ['Вернуться к стойке на двух ногах'],
      ['Убрать ленту'],
      ['Сразу прыжки в глубину'],
    ], 0, 'На одной ноге прогрессия та же, что на двух: от устойчивой опоры к неустойчивой, затем толчки.',
    [null, 'Это шаг назад.', 'Лента — часть задачи, её не убирают ради прогресса.', 'Прыжки в глубину — продвинутая плиометрика.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-bl2', prompt: ['Футболист готовится к резким остановкам и сменам направления. Что добавить?'],
    build: choice([
      ['«Двигайся и замри»: прыжок, приставные шаги и бег с остановкой'],
      ['Только стойку на двух ногах на полу'],
      ['Сидеть на мяче и тянуться руками'],
      ['Только растяжку'],
    ], 0, 'Упражнения «двигаться и поставить стопу» тренируют остановку тела и готовят к смене направления и ловкости.',
    [null, 'Слишком просто для его цели.', 'Это ранний этап.', 'Растяжка не тренирует остановку.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
