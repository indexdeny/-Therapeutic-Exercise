const SH = '#86c9e8', MU = '#f4a48c', LG = '#f1dfa0', FUN = '#f0c060', SP = '#8fd6b0', ENV = '#c9b8e8', BAD = COL.bad;
function pillRow(p, items, cx, y, t0, { gap = .35, size = 22, col = COL.whole, space = 18 } = {}) {
  const ws = items.map(s => uiW(s, size) + 30), tot = ws.reduce((a, b) => a + b, 0) + space * (items.length - 1);
  let x = cx - tot / 2;
  return items.map((s, i) => { const c = Array.isArray(col) ? col[i] : col, t = Array.isArray(t0) ? t0[i] : t0 === null ? null : t0 + i * gap, g = pill(p, s, x + ws[i] / 2, y, t, { col: c, size }); x += ws[i] + space; return g; });
}
function lab(p, str, x, y, tx, ty, col, t0, { size = 19, anchor = null } = {}) {
  const g = G(p, { o: 0 }), right = tx > x, an = anchor || (right ? 'end' : 'start');

const cyc = (q, n) => (1 - Math.cos(2 * Math.PI * n * q)) / 2;
const f1 = v => v.toFixed(1);
const arw = (p, x1, y1, x2, y2, col, t0, w = 6) => { const a = Math.atan2(y2 - y1, x2 - x1), h = 14, g = G(p, { o: 0 }); path(g, `M${f1(x1)} ${f1(y1)}L${f1(x2)} ${f1(y2)}M${f1(x2 - h * Math.cos(a - .5))} ${f1(y2 - h * Math.sin(a - .5))}L${f1(x2)} ${f1(y2)}L${f1(x2 - h * Math.cos(a + .5))} ${f1(y2 - h * Math.sin(a + .5))}`, { stroke: col, 'stroke-width': w }); if (t0 !== null) show(g, t0); else put(g, { o: 1 }); return g; };
const floorLn = (p, x1, x2, y, t0) => show(path(p, `M${x1} ${y}H${x2}`, { stroke: COL.dim, 'stroke-width': 4 }, { o: 0 }), t0);
const ring = (p, P, r, col, t0) => { const c = mk('circle', { cx: f1(P[0]), cy: f1(P[1]), r, fill: 'none', stroke: col, 'stroke-width': 4, opacity: 0 }, p); show(c, t0); return c; };
// an arc of the glenoid or the head (radius rr about the centre C of the joint, angles a0..a1) in stage coordinates
const arcOn = (j, conv, rr, a0, a1) => { const P = []; for (let a = a0; a <= a1; a += 4) P.push(j.at(conv(polar([0, 0], rr, a)))); return P; };

/* ---------- exercise helpers (chapters 17–18) ---------- */
// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.
function fsReach(f, side, X, Y, flip = false) {
  const S = st(f.g), i = side === 'L' ? 0 : 1, k = i ? 1 : -1, Sh = f.pts.Sh[i];
  const tx = (X - S.x) / S.s - Sh[0], ty = (Y - S.y) / S.s - Sh[1], D = clamp(Math.hypot(tx, ty), 8, 137.5), dg = 180 / Math.PI;
  const phi = Math.atan2(k * tx, ty) * dg, be = Math.acos(clamp((72 * 72 + D * D - 66 * 66) / (2 * 72 * D), -1, 1)) * dg, ga = Math.acos(clamp((72 * 72 + 66 * 66 - D * D) / (2 * 72 * 66), -1, 1)) * dg;
  const sg = flip ? -1 : 1;
  f.set({ ['a' + side]: phi + sg * be, ['e' + side]: -sg * (180 - ga) });
}
// an elastic band between two stage points; set(A, B, rest) — brighter and thinner as it stretches
function bandLine(p, col = '#e86a8a') {
  const e = path(p, '', { stroke: col, 'stroke-width': 6, 'stroke-linecap': 'round' }, { o: 0 });
  return { e, set(A, B, rest = 100) { const L = Math.hypot(B[0] - A[0], B[1] - A[1]), k = clamp(L / rest - 1, 0, 1); e.setAttribute('d', `M${f1(A[0])} ${f1(A[1])}L${f1(B[0])} ${f1(B[1])}`); e.setAttribute('stroke-width', f1(6 - 2.5 * k)); e.setAttribute('stroke', mix(col, '#ffd75e', k * .6)); } };
}
const propLine = (p, d, t0, col = COL.dim, w = 5) => { const e = path(p, d, { stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' }, { o: 0 }); if (t0 !== null) show(e, t0); return e; };
// a ball (side view): set(x, y) moves it
function ballEl(p, r, col = '#86c9e8') {

// a seated rig figure on a chair, ankle at (ax, GY)
function seatFig(p, ax, GY, s, t0, pose = {}) {
  const f = fig(p, { x: 0, y: 0, s, o: 0, pose: { ...SIT, ...pose } });

const QUAD = { ...STAND, t: 66, hN: 66, kN: 90, hF: 66, kF: 90, aN: 66, aF: 66, eN: 0, eF: 0, fN: -90, fF: -90 };
// a rig figure on all fours: knee at (kx, FY); hands under the shoulders
function quadFig(p, kx, FY, s, t0, pose = {}) {

// horizontal bars with values: rows [label, value, colour]; k — px per unit
function bars(p, x, y, rows, t0, { k = 5, dy = 46, unit = '%', w0 = 210, size = 17 } = {}) {
  return rows.map(([s, v, c], i) => {

}

function pushArr(p, P, ang, col, t0, L = 70) { const A = polar(P, L + 14, ang), B = polar(P, 14, ang); return arw(p, A[0], A[1], B[0], B[1], col, t0, 7); }


/* ---------- chapter 18 helpers (lesson 172) ---------- */

function flexArc(p, C, r, a0, a1, col, t0, w = 10) { const e = path(p, romArc(C, r, a0, a1, 90, -1), { stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' }, { o: 0 }); if (t0 !== null) show(e, t0); return e; }

// the flexion range a contracted capsule allows: [extension limit, flexion limit], scanned on the model
function capRange(j) {

  for (let a = 0; a <= 145; a++) { j.set({ flex: a }); if (j.capA.tension < .97) { lo = a; break; } }

// a hinged elbow brace on an elbowSag model (bars, straps, the hinge); block — the extension stop in degrees
function hingeBrace(p, j, t0, block = null) {
  const g = G(p, { o: 0 }), col = '#9fb0bf', sw = 11 * st(j.g).s / .7;
  const bar1 = path(g, '', { stroke: col, 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-opacity': .9 });
  const bar2 = path(g, '', { stroke: col, 'stroke-width': sw, 'stroke-linecap': 'round', 'stroke-opacity': .9 });

  const hinge = mk('circle', { r: sw * 1.3, fill: '#6f7f8c', stroke: '#2b343a', 'stroke-width': 2 }, g);
  const stop = block !== null ? path(g, '', { stroke: COL.bad, 'stroke-width': sw * .9, 'stroke-linecap': 'round' }) : null;
  const seg = (A, B) => `M${f1(A[0])} ${f1(A[1])}L${f1(B[0])} ${f1(B[1])}`;

  };

}
// a small scene card: a framed box with a caption

/* ---------- chapter 18 helpers: a phase strip ---------- */
// Rehabilitation phases on a time axis: rows [label, from, to, colour] in weeks; ticks [[value, label]].
// Each phase gets its own row; they appear one by one (t0 + i * gap, or t0[i] if an array).

  path(g, `M${x} ${y}H${x + w}`, { stroke: COL.dim, 'stroke-width': 3 });
  ticks.forEach(([v, s0]) => { path(g, `M${f1(X(v))} ${y - 6}V${y + 6}`, { stroke: COL.dim, 'stroke-width': 2 }); T(g, s0, { x: X(v), y: y + 26, size: 14, fill: COL.dim, anchor: 'middle' }); });
  if (t0 !== null) show(g, Array.isArray(t0) ? t0[0] : t0);

    const r = G(p, { o: 0 }), yy = y - 26 - (rows.length - 1 - i) * dy;

    infoCard(p, 800, 360, 760, 150, 'подтягивание и выпад', 'как можно выше с коленями к груди; приземление в выпад той же ногой или «ножницами»; труднее — с грузом', CON_C, m('tuck'), { size: 16 });
  }],

  ['le3', 'Ноги: платформы и препятствия', (m, D) => {
    const p = panel(0);
    txt(p, 'зигзаг, платформы, препятствия', 400, 56, m('zig'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    const zz = G(p, { o: 0 }); path(zz, 'M80 380L220 300L360 380L500 300L640 380', { stroke: SH, 'stroke-width': 4, fill: 'none', 'stroke-dasharray': '10 8' }); show(zz, m('zig'));
    const dz = G(p, { o: 0 }); mk('ellipse', { rx: 20, ry: 9, fill: COL.task }, dz); show(dz, m('zig', 1)); hide(dz, m('plat'), .3); hide(zz, m('plat'), .3);
    const ZP = [[80, 380], [220, 300], [360, 380], [500, 300], [640, 380]];
    prog(q => { const i = Math.min(3, Math.floor(q * 4)), u = (q * 4) % 1; put(dz, { x: lerp(ZP[i][0], ZP[i + 1][0], u), y: lerp(ZP[i][1], ZP[i + 1][1], u) - 30 * Math.sin(u * Math.PI) }); }, m('zig', 1), 4, lin);
    floorAt(p, 40, 760, 840, m('zig'));
    const a = platBox(p, 70, 220, 80, 840, m('plat')), b = platBox(p, 560, 710, 80, 840, m('plat', 9));
    const f = fig(p, { s: 1.0, o: 0 }); show(f.g, m('plat')); const M = figMus(f, ['glutMax', 'quads', 'gastroc']);
    prog(q => { const u = q * 2 % 1; if (u < .5) jumpPose(f, M, 380, 145, 840, 1.0, u * 2, 'stand', 120); else { const v = (u - .5) * 2; f.set({ ...STAND }); put(f.g, { x: lerp(145, 380, v), y: lerp(a.top, 840, v * v) - 182 - 40 * Math.sin(v * Math.PI) }); } }, m('plat', 1), 6, lin);
    prog(q => { const v = q * 2 % 1, A = [145, a.top], B = [635, b.top]; if (v < .3) { const s0 = v / .3; f.set({ ...STAND, aN: 30, aF: 30 }); put(f.g, { x: lerp(A[0], 390, s0), y: lerp(A[1], 840, s0 * s0) - 182 - 30 * Math.sin(s0 * Math.PI) }); } else if (v < .5) { f.set({ ...SQUAT, t: 28, aN: -20, aF: -20 }); put(f.g, { x: 390, y: 840 - 140 }); musAct(M, ['glutMax', 'quads', 'gastroc'], 1); } else { const s0 = (v - .5) / .5, e = Math.sin(s0 * Math.PI); f.set({ ...STAND, aN: 150 * (1 - s0), aF: 150 * (1 - s0), hN: 30 * e, kN: 50 * e, hF: 30 * e, kF: 50 * e }); put(f.g, { x: lerp(390, B[0], s0), y: lerp(840, B[1], s0) - 182 - 110 * e }); musAct(M, ['glutMax', 'quads', 'gastroc'], .3); } }, m('plat', 9), 6, lin);
    pill(p, 'зигзаг: прыжки или скачки, быстрее и дальше', 400, 120, m('zig', 1), { col: SH, size: 14 });
    pill(p, 'одна платформа: вперёд, назад, в стороны; потом выше', 400, 165, m('plat', 1), { col: COL.good, size: 14 });
    pill(p, 'несколько платформ: с одной — на пол — на следующую', 400, 210, m('plat', 9), { col: CON_C, size: 14 });
    const cs = G(p, { o: 0 }); [230, 360, 490].forEach((x, i) => cone(cs, x, 840, 40 + 14 * i, m('obst', .3 + i * .3))); show(cs, m('obst'));
    pill(p, 'скачки через предметы разного размера', 400, 255, m('obst', 1), { col: COL.task, size: 14 });
    hide(a.g, m('obst'), .3); hide(b.g, m('obst'), .3);
    prog(q => { const k = Math.floor(q * 3), u = (q * 3) % 1, e = Math.sin(u * Math.PI); f.set({ ...STAND, hF: 50, kF: 90, fF: -10, hN: 20 * e, kN: 30 * e, aN: 40, aF: 40 }); put(f.g, { x: 160 + 130 * k + 130 * u, y: 840 - 182 - 120 * e }); musAct(M, ['glutMax', 'quads', 'gastroc'], u < .2 || u > .8 ? 1 : .3); }, m('obst', 1), Math.max(3, D - m('obst') - 2), lin);
    infoCard(p, 800, 90, 760, 120, 'зигзаг', 'по зигзагу на полу — прыжки или скачки, всё быстрее и дальше', SH, m('zig'), { size: 16 });
    infoCard(p, 800, 225, 760, 150, 'платформы', 'на одну и с неё — во все стороны, сначала скорость и повторения, потом высота; с платформы на пол и на следующую', COL.good, m('plat'), { size: 16 });
    infoCard(p, 800, 390, 760, 100, 'препятствия', 'скачки через предметы разного размера', COL.task, m('obst'), { size: 16 });
  }],

  ['cases', 'Случаи главы', (m, D) => {
    const p = panel(0);
    txt(p, 'два случая главы', 400, 56, m('intro'), { size: 26, weight: 700, anchor: 'middle', fill: SH });
    const s1 = scn(p, m('c1'));
    txt(s1, 'волейболистка, 21 год: 4 мес. после пластики ПКС', 40, 120, m('c1', 1), { size: 18, fill: COL.task, weight: 700 });
    markList(s1, 40, 165, [['объём полный, без боли', COL.good], ['сила 80–85 % от правой ноги', COL.good], ['стабильность как на здоровой', COL.good]], m('c1', 5), 3, { cross: false, size: 15, dy: 40, maxW: 360 });
    markList(s1, 420, 165, [['приведение бедра', COL.bad], ['внутренняя ротация бедра', COL.bad], ['вальгус колена', COL.bad], ['пронация стопы', COL.bad]], m('c1', 16), 2, { size: 15, dy: 40, maxW: 350 });
    txt(s1, 'при спуске со ступеньки:', 420, 145, m('c1', 15), { size: 15, fill: COL.bad, weight: 700 });
    const stp = platBox(s1, 140, 340, 70, 840, m('c1', 15)); floorAt(s1, 40, 760, 840, m('c1', 15));
    const f = fig(s1, { s: 1.15, o: 0 }); show(f.g, m('c1', 15)); const M = figMus(f, ['glutMax', 'quads', 'hamstrings']);
    prog(q => { const c = cyc(q, 2); const H = [lerp(250, 290, c), stp.top - lerp(182, 135, c) * 1.15]; figTrunk(f, H, [H[0] + 30 * c, H[1] - 100]); figLegIK(f, 'N', [260, stp.top - 2]); figLegIK(f, 'F', [lerp(330, 380, c), lerp(stp.top - 2, 836, c)]); musAct(M, ['glutMax', 'quads'], c); }, m('c1', 16), 8, lin);
    pill(s1, 'задание: 8 недель силы, равновесия и плиометрики; и руки', 400, 340, m('c1', 28), { col: SH, size: 13 });
    hide(s1, m('c2'), .4);
    const s2 = scn(p, m('c2'));
    txt(s2, 'мужчина, 35 лет: хронический теннисный локоть', 40, 120, m('c2', 1), { size: 18, fill: COL.task, weight: 700 });
    const as = armSide(s2, 130, 300, .85, m('c2', 2), { muscles: ['ext', 'flx'] }); as.set({ sh: 70, el: 60, wr: -10, pro: 1 });
    if (as.ext) { as.ext.hurt = .8; as.ext.act(0); }
    lab(s2, 'разгибатели запястья — от латерального надмыщелка', 330, 460, ...as.at('E'), COL.bad, m('c2', 3), { size: 14 });
    pill(s2, 'симптомы под контролем; цель — турниры в клубе', 400, 680, m('c2', 6), { col: COL.good, size: 14 });
    pill(s2, 'задание: сила и плиометрика для рук и ног, всё тело', 400, 725, m('c2', 10), { col: SH, size: 13 });
    NOTE(p, 1180, 860, m('c1', 28));
    infoCard(p, 800, 90, 760, 230, 'волейболистка — по материалу главы', 'сначала приземление без вальгуса и устойчивость бедра на одной ноге; затем прыжки на двух → скачки на одной, платформы и смены направления 2 раза в неделю; равновесие с толчками; плиометрика для рук — броски мяча', COL.task, m('c1', 28), { size: 16 });
    infoCard(p, 800, 335, 760, 200, 'теннисист — по материалу главы', 'запястье и локоть — подбрасывания, ракетка с короткой, потом длинной ручкой; ротаторы — лента 90/90; ноги — приставные шаги и прыжки; повторения, потом нагрузка', SH, m('c2', 10), { size: 16 });
  }],

  ['q2', 'Быстрая проверка', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'c-start', prompt: ['С чего начать плиометрику для ног у волейболистки из случая?'],
    build: choice([
      ['Научить приземляться без вальгуса колена, прыжки на двух ногах — потом на одной'],
      ['Сразу прыжки в глубину с высокой платформы'],
      ['Скачки на одной ноге через препятствия'],
      ['Прыжки с жилетом с грузом'],
    ], 0, 'У неё при спуске со ступеньки вальгус и приведение бедра: сначала техника приземления и прыжки на двух, затем одна нога и усложнение.',
    [null, 'Это самый продвинутый уровень.', 'Одна нога — после двух и при хорошем приземлении.', 'Груз добавляют после техники и повторений.']),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Руки — броски и ловля утяжелённого мяча двумя, затем одной рукой, лента для ротаторов в 90/90, удары мячом лёжа, обратная ловля.', 'w1'],
     ['Локоть и запястье — подбрасывания и ракетка; с опорой — скользящая платформа, отталкивания, отжимания с хлопком и с платформ.', 'w2'],
     ['Ноги — удар по мячу, вставание с мяча, батут, шаги, прыжки из приседа, серии, квадраты, с подтягиванием коленей и в выпаде.', 'w3'],
     ['Зигзаг, платформы и препятствия; всегда — опорная обувь и приземление без вальгуса колена.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-pe1', prompt: ['Подающему в бейсболе нужно ускорить замедление руки после броска. Какое упражнение особенно подходит?'],
    build: choice([
      ['Обратная ловля в положении 90/90 — наружные ротаторы'],
      ['Подъёмы на носки на батуте'],
      ['Удар по мячу ногой'],
      ['Вставание с мяча'],
    ], 0, 'Торможение руки после броска выполняют наружные ротаторы: обратная ловля тренирует их в конце объёма.',
    [null, 'Это икроножная и камбаловидная.', 'Это мышцы бедра.', 'Это разгибатели бедра и колена.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-pe2', prompt: ['Во время прыжков из приседа колени пациента заваливаются внутрь. Что делать?'],
    build: choice([
      ['Остановиться и вернуться к технике приземления: голени вертикально'],
      ['Прыгать выше'],
      ['Добавить жилет с грузом'],
      ['Перейти на одну ногу'],
    ], 0, 'Вальгусный провал недопустим: техника приземления важнее высоты и груза.',
    [null, 'Высота усилит нагрузку на колено.', 'Груз добавляют только при правильной технике.', 'На одной ноге контролировать ещё труднее.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
