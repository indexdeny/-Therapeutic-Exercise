/* ---------- exercise helpers (chapters 17–18) ---------- */
// Put a hand of the front-view figure on a stage point (two-link arm 72 + 66); flip bends the elbow the other way.
function fsReach(f, side, X, Y, flip = false) {

      { parts: ['Высокое давление в покое'], ans: ['g'], why: 'Поэтому его не носят ночью.' },
      { parts: ['Высокое давление при работе мышц'], ans: ['b'], why: 'Мышца упирается в нерастяжимый бинт.' },
    ], [['b', 'Бинты', '#e8c27a'], ['g', 'Изделие', '#c9a98a']], { multi: false, text: true }),
  }], done) }],

  ['wrap', 'Итоги', (m) => {
    const p = panel(0);
    txt(p, 'Итоги урока', 800, 110, .2, { size: 32, fill: COL.dim, anchor: 'middle', weight: 600 });
    [['Лимфедема не излечима: уменьшить отёк, сохранить ткани, снизить риск инфекции; работают внешнее давление, подъём и перепады давления — дыхание и мышцы.', 'w1'],
     ['Противоотёчная терапия: фаза I уменьшает отёк под руководством терапевта, фаза II удерживает результат силами пациента.', 'w2'],
     ['Ручной лимфодренаж: лёгкие медленные движения, сначала центр, потом конечность от ближней части к дальней.', 'w3'],
     ['Бинты малой растяжимости уменьшают отёк и носятся круглосуточно; изделие днём удерживает размер; помпа — только дополнение.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 210 + i * 160, o: 0 });
      mk('circle', { cx: 200, cy: -12, r: 26, fill: SH }, g);
      T(g, String(i + 1), { x: 200, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      put(para(g, str, 260, 0, null, { size: 29, weight: 600, maxW: 1150 }), { o: 1 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
  }],

  ['final1', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-tx1', prompt: ['Пациентка в первой фазе лечения просит снимать бинты на день и носить старый эластичный спортивный бинт — «он удобнее». Что ответить?'],
    build: choice([
      ['Нет: в первой фазе — бинты малой растяжимости круглосуточно, снимать только для мытья; эластичные спортивные не подходят'],
      ['Можно: любой бинт одинаково давит'],
      ['Можно ходить без бинтов, если делать упражнения'],
      ['Лучше заменить бинты помпой'],
    ], 0, 'Бинт малой растяжимости даёт высокое рабочее давление; эластичный — нет. Честное ношение бинтов лучше всего предсказывает результат.',
    [null, 'Давление в покое и при работе у них разное.', 'Упражнения делают как раз в бинтах.', 'Помпа — только дополнение.']),
  }], done, 'Практика урока   1 из 2') }],

  ['final2', 'Практика урока', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-tx2', prompt: ['Отёк левой руки после удаления левых подмышечных узлов. В каком порядке вести ручной лимфодренаж?'],
    build: choice([
      ['Правая подмышка и левый пах → через грудь и бок → левое плечо → предплечье и кисть'],
      ['Сразу кисть, гнать лимфу к левой подмышке'],
      ['От кисти к плечу сильным давлением'],
      ['Только кисть и предплечье'],
    ], 0, 'Сначала освобождают свободные центральные зоны, ведут лимфу через водоразделы, потом конечность — от ближней части к дальней.',
    [null, 'Левые узлы удалены — туда лимфе некуда идти.', 'Сильное давление расширяет сосуды, а порядок неверный.', 'Без освобождения центра лимфе некуда уйти.']),
  }], done, 'Практика урока   2 из 2') }],

  ['finish', 'Готово', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
</body>
</html>
