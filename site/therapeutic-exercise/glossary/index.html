<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Глоссарий — Лечебные упражнения</title>
<link rel="stylesheet" href="../lib/study.css">
<style>
/* The contents and the lessons cross-fade on navigation; the page takes part. The opt-in is in the page itself, as in the
   atlas: from study.css alone Chromium often missed it here (no fade, «Transition was aborted» in the console). */
@view-transition { navigation: auto; }
.tog { padding: 6px 13px; border: 1px solid var(--edge); border-radius: 999px; background: var(--panel); color: var(--dim); font: 14px var(--ui); white-space: nowrap; cursor: pointer; }
.tog[aria-pressed="true"] { border-color: var(--good); color: var(--chalk); }
/* The letters, the list on the left, the term's panel on the right (as the atlas's preview). */
.abc { display: flex; flex-wrap: wrap; gap: 3px; padding: 0 24px 10px; }
.abc button { min-width: 26px; padding: 2px 6px; border: 0; border-radius: 6px; background: none; color: var(--dim); font: 13px var(--ui); cursor: pointer; }
.abc button:hover:not(:disabled) { background: var(--panel); color: var(--task); }
.abc button:disabled { color: #3d4f48; cursor: default; }
.gl { display: grid; grid-template-columns: minmax(0, 1fr) 520px; gap: 24px; align-items: start; padding: 4px 24px 32px; }
.L { margin: 10px 0 4px; color: var(--task); font: 600 20px var(--book); scroll-margin-top: 130px; }
.row { display: grid; grid-template-columns: minmax(180px, 280px) minmax(0, 1fr) 70px; gap: 14px; align-items: baseline; width: 100%; padding: 8px 12px;
  border: 1.5px solid transparent; border-radius: 10px; background: none; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.row:hover { background: rgba(255, 255, 255, .03); }
.row.sel { border-color: var(--task); background: rgba(240, 180, 90, .06); }
.row .t { font-size: 16px; font-weight: 700; }
.row .t small { display: block; color: var(--dim); font-size: 12.5px; font-weight: 400; }
.row .d { overflow: hidden; color: var(--dim); font-size: 14px; white-space: nowrap; text-overflow: ellipsis; }
.row .n { color: var(--faint); font-size: 12px; text-align: right; white-space: nowrap; }
.empty { padding: 40px 0; color: var(--dim); text-align: center; }
.pv { position: sticky; top: 70px; max-height: calc(100svh - 86px); overflow-y: auto; border: 1.5px solid var(--edge); border-radius: 16px; background: var(--page); }
.pv-empty { margin: 0; padding: 48px 28px; color: var(--dim); text-align: center; }
.pv-body { position: relative; }
.pv-x { display: none; position: absolute; right: 10px; top: 10px; z-index: 2; width: 38px; height: 38px; border: 0; border-radius: 50%;
  background: rgba(15, 22, 19, .85); color: var(--chalk); font: 24px/1 var(--ui); cursor: pointer; }
.pv-info { padding: 12px 16px 16px; }
.pv-info h2 { margin: 0; font: 500 24px/1.2 var(--book); }
.pv-info .en { color: var(--dim); font-size: 14px; }
.pv-info .def { margin: 10px 0 8px; font-size: 16px; }
.mom { margin: 6px 0 0; padding: 0; list-style: none; }
.mom button { display: flex; gap: 10px; width: 100%; padding: 6px 8px; border: 0; border-radius: 8px; background: none; color: var(--dim); font: 14px/1.35 var(--ui);
  text-align: left; cursor: pointer; }
.mom button b { flex: none; min-width: 74px; color: var(--chalk); }
.mom button[aria-current] { background: rgba(240, 180, 90, .12); color: var(--chalk); }
.mom button[aria-current] b { color: var(--task); }
.see { margin: 10px 0 0; color: var(--dim); font-size: 14px; }
.see button { padding: 0; border: 0; background: none; color: var(--quiz); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.page { margin: 8px 0 0; color: var(--faint); font-size: 13px; }
/* Narrow screens: the panel slides up over the whole page. */
@media (max-width: 1099px) {
  .abc { padding: 0 16px 10px; }
  .gl { display: block; padding: 4px 16px 24px; }
  .pv { display: none; position: fixed; inset: 0; z-index: 5; max-height: none; border: 0; border-radius: 0; animation: up .25s var(--ease); }
  body.pv-open { overflow: hidden; }
  body.pv-open .pv { display: block; }
  .pv-x { display: block; }
}
@media (max-width: 559px) {
  .row { grid-template-columns: minmax(0, 1fr) auto; gap: 2px 10px; }
  .row .d { grid-column: 1 / -1; grid-row: 2; white-space: normal; }
}
@keyframes up { from { transform: translateY(100%); } }
@media (prefers-reduced-motion: reduce) { .pv { animation: none; } }
</style>
</head>
<body>
<header class="top"><a class="back" href="../#contents">← Оглавление</a><h1>Глоссарий</h1></header>
<div class="filters" id="filters"></div>
<nav class="abc" id="glAbc" aria-label="Буквы"></nav>
<main class="gl">
  <section id="glList" aria-label="Термины"></section>
  <aside class="pv" id="pv" aria-label="Термин">
    <p class="pv-empty" id="pvEmpty">Выберите термин — здесь урок покажет, где его объясняют.</p>
    <div class="pv-body" id="pvBody" hidden>
      <button class="pv-x" id="pvClose" type="button" aria-label="Закрыть">×</button>
      <div class="pv-frame"><iframe id="pvFrame" title="Момент урока" allow="autoplay"></iframe>
        <button class="pv-sound" id="pvSound" type="button" hidden>▶ Включить звук</button></div>
      <div class="pv-ctl"><button class="pv-play" id="pvPlay" type="button" aria-label="Пуск или пауза">▶</button><span id="pvNow">0:00</span>
        <span class="pv-bar"><i id="pvBar"></i></span><span id="pvDur"></span></div>
      <div class="pv-info" id="pvInfo"></div>
    </div>
  </aside>
</main>
<script src="data.js"></script>
<script src="../lib/moment.js"></script>
<script src="../lib/glossary.js"></script>
</body>
</html>
