<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Повторение — Лечебные упражнения</title>
<link rel="stylesheet" href="../lib/study.css">
<style>
/* The contents and the lessons cross-fade on navigation; the page takes part. The opt-in is in the page itself, as in the
   atlas: from study.css alone Chromium often missed it here (no fade, «Transition was aborted» in the console). */
@view-transition { navigation: auto; }
/* The chapters column on the left, the card on the right. */
.rv { display: grid; grid-template-columns: 340px minmax(0, 1fr); align-items: start; }
.side { position: sticky; top: 60px; max-height: calc(100svh - 60px); overflow-y: auto; padding: 18px; border-right: 1px solid #2a3b35; background: #1a2723; }
.side-x { display: none; }
.today { padding: 14px 16px; border: 1.5px solid var(--quiz); border-radius: 14px; background: var(--panel); }
.today .n { font: 600 30px/1 var(--ui); }
.today p { margin: 6px 0 10px; color: var(--dim); font-size: 13.5px; }
.today .now { margin: 4px 0 0; color: var(--chalk); }
.side h3 { margin: 18px 0 8px; color: var(--dim); font: 600 13px var(--ui); letter-spacing: .08em; text-transform: uppercase; }
.units { margin: 0; padding: 0; list-style: none; }
.u { display: grid; grid-template-columns: 24px minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; padding: 5px 6px; border-radius: 8px; }
.u.cur { background: rgba(134, 201, 232, .1); }
.u .box { width: 18px; height: 18px; padding: 0; border: 1.5px solid var(--edge); border-radius: 4px; background: none; color: #10242e; font: 700 12px/1 var(--ui); cursor: pointer; }
.u .box.all, .u .box.mark { background: var(--good); border-color: var(--good); }
.u .box.part { background: linear-gradient(135deg, var(--good) 50%, transparent 50%); border-color: var(--good); }
.u .box:disabled { cursor: default; }
.u .nm { padding: 0; border: 0; background: none; color: var(--chalk); font: 14px/1.3 var(--ui); text-align: left; cursor: pointer; }
.u .nm:hover { color: var(--quiz); }
.u small { color: var(--faint); font-size: 12px; font-variant-numeric: tabular-nums; }
.u .mini { grid-column: 2 / 4; height: 4px; border-radius: 2px; background: #2c3d37; overflow: hidden; }
.u .mini i { display: block; height: 100%; background: var(--good); }
.hint { margin: 12px 6px 0; color: var(--faint); font-size: 12.5px; }
.msg { margin: 10px 6px 0; color: var(--good); font-size: 13px; }
.msg.bad, .nostore { color: var(--bad); }
.nostore { margin: 10px 6px 0; font-size: 13px; }
.main { min-width: 0; padding: 26px 34px 40px; }
.stat { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin-bottom: 14px; color: var(--dim); font-size: 14px; }
.stat b { color: var(--chalk); }
.bar { flex: 0 0 220px; height: 6px; border-radius: 3px; background: #2c3d37; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--quiz); }
.chip.run { border-color: var(--task); color: var(--task); }
/* A card, like the lessons' question card. */
.qc { max-width: 860px; padding: 22px 30px; border: 1.5px solid var(--edge); border-left: 7px solid var(--quiz); border-radius: 20px;
  background: rgba(34, 50, 45, .97); box-shadow: 0 14px 44px rgba(0, 0, 0, .35); }
.src { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin-bottom: 8px; color: var(--dim); font-size: 14px; }
.src .k { color: var(--quiz); font-size: 15px; font-weight: 600; }
.prompt { margin: 0 0 16px; font: 600 22px/1.35 var(--ui); }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; padding: 9px 18px; border: 2px solid var(--edge); border-radius: 999px;
  background: none; color: var(--chalk); font: 18px/1.3 var(--ui); text-align: left; cursor: pointer; }
.opt:hover:not(:disabled) { border-color: var(--dim); }
.opt:disabled { cursor: default; }
.opt.good { border-color: var(--good); box-shadow: 0 0 0 3px rgba(143, 214, 176, .35); }
.opt.bad { border-color: var(--bad); color: var(--bad); }
.grid .row { display: grid; grid-template-columns: minmax(0, 1fr) 30px; gap: 6px 14px; align-items: center; padding: 8px 0 8px 12px; border-bottom: 1px solid #2e433b; }
.grid .num { grid-column: 1 / -1; font-size: 17px; }
.grid .opts { flex-direction: row; flex-wrap: wrap; gap: 8px; }
.grid .opt { width: auto; min-height: 38px; padding: 3px 14px; font-size: 15px; }
.grid .opt[aria-pressed="true"] { background: var(--c, var(--chalk)); border-color: var(--c, var(--chalk)); color: #1b2320; font-weight: 600; }
.grid .row.cur { background: rgba(236, 232, 220, .05); box-shadow: inset 4px 0 var(--quiz); }
.mark { font-weight: 700; text-align: center; }
.mark.good { color: var(--good); }
.mark.bad { color: var(--bad); }
.why { grid-column: 1 / -1; color: var(--dim); font-size: 15px; }
.why:empty { display: none; }
.blanks .brow { padding: 8px 0; border-bottom: 1px solid #2e433b; }
.bline { font-size: 18px; line-height: 2.2; }
.box { margin: 0 6px; padding: 2px 6px; border: 0; border-bottom: 3px solid var(--quiz); border-radius: 6px 6px 0 0; background: rgba(236, 232, 220, .07);
  color: var(--chalk); font: 18px var(--ui); text-align: center; }
.box.good { border-color: var(--good); }
.box.bad { border-color: var(--bad); color: var(--bad); }
.blanks .mark { display: inline-block; margin-left: 10px; }
.ans { margin-left: 2px; color: var(--good); font-size: 15px; }
.fb { margin-top: 14px; font-size: 17px; line-height: 1.45; }
.fb:empty { display: none; }
.fb.ok::before { content: "✓ "; color: var(--good); font-weight: 700; }
.fb.no::before { content: "✗ "; color: var(--bad); font-weight: 700; }
.acts { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 18px; }
.next { margin-left: auto; color: var(--dim); font-size: 13px; }
/* A term card: the front, then the definition and the lesson moment. */
.tc { padding: 0; overflow: hidden; border-left-color: var(--task); }
.tc .f { padding: 22px 30px 18px; }
.tc .src .k { color: var(--task); }
.tc .t { font: 500 32px/1.15 var(--book); }
.tc .e { margin-top: 3px; color: var(--dim); font-size: 16px; }
.tc .turn { margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--edge); }
.tc .def { margin: 0 0 10px; font-size: 19px; line-height: 1.45; }
.tc .moment { max-width: 520px; overflow: hidden; border: 1px solid var(--edge); border-radius: 12px; background: var(--page); }
.self { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding: 14px 30px; border-top: 1px solid #2a3b35; background: #1b2824; }
.btn.no { border-color: var(--bad); color: var(--bad); }
.btn.yes { border-color: var(--good); color: var(--good); }
.sum { max-width: 640px; }
.sum h2 { margin: 0 0 8px; font: 500 28px/1.2 var(--book); }
.sum p { color: var(--dim); }
/* Narrow screens: the chapters column opens over the page from the «Главы» button. */
@media (min-width: 1100px) { #rvSideBtn { display: none; } }
@media (max-width: 1099px) {
  .rv { display: block; }
  .side { display: none; position: fixed; inset: 0; z-index: 5; max-height: none; border: 0; }
  .side-x { display: block; margin: 0 0 12px auto; }
  body.side-open { overflow: hidden; }
  body.side-open .side { display: block; }
  .main { padding: 18px 16px 32px; }
  .qc { padding: 18px; }
  .tc { padding: 0; }
  .tc .f, .self { padding-left: 18px; padding-right: 18px; }
  .bar { flex-basis: 120px; }
  .prompt { font-size: 19px; }
  .opt { font-size: 16px; }
}
</style>
</head>
<body>
<header class="top"><a class="back" href="../#contents">← Оглавление</a><h1>Повторение</h1>
  <button class="btn" id="rvSideBtn" type="button">Главы</button><span class="sp"></span>
  <button class="btn quiet" id="rvSave" type="button">Сохранить<span class="wide"> в файл</span></button>
  <button class="btn quiet" id="rvLoad" type="button">Загрузить</button>
  <input id="rvFile" type="file" accept="application/json,.json" hidden></header>
<main class="rv">
  <aside class="side" id="rvSide" aria-label="План и главы">
    <button class="btn side-x" id="rvSideX" type="button" aria-label="Закрыть список глав">×</button>
    <div class="today" id="rvToday"></div>
    <h3>Главы · выучено</h3>
    <ol class="units" id="rvUnits"></ol>
    <p class="hint">✓ — глава пройдена: её карточки идут в «на сегодня». Щелчок по названию — повтор главы вперемешку.</p>
    <p class="nostore" id="rvNoStore" hidden>Браузер не даёт хранилище — прогресс не сохранится после закрытия страницы.</p>
    <p class="msg" id="rvMsg" role="status"></p>
  </aside>
  <section class="main" id="rvMain" aria-live="polite"></section>
</main>
<script src="data.js"></script>
<script src="../lib/moment.js"></script>
<script src="../lib/review.js"></script>
</body>
</html>
